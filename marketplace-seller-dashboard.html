<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Relay Seller Dashboard · Marketplace</title>
<style>
  :root {
    --bg: #f8f7f5;
    --card: #ffffff;
    --line: #e5e0d8;
    --ink: #1a1512;
    --soft: #6b6359;
    --accent: #2563eb;
    --green: #059669;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; }

  header {
    background: var(--card);
    border-bottom: 1px solid var(--line);
    padding: 24px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .branding {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }
  .logo {
    font-size: 1.6rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0;
  }
  .byline {
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--soft);
    margin-top: 2px;
    font-weight: 600;
  }
  .seller-info {
    font-size: 0.85rem;
    color: var(--soft);
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 32px;
  }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 32px;
  }
  .stat-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 20px;
  }
  .stat-label {
    font-size: 0.8rem;
    color: var(--soft);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 8px;
    font-weight: 600;
  }
  .stat-value {
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--accent);
  }

  .tabs {
    display: flex;
    gap: 2px;
    margin-bottom: 24px;
    border-bottom: 1px solid var(--line);
  }
  .tab-btn {
    background: transparent;
    border: none;
    padding: 12px 16px;
    font-size: 0.95rem;
    color: var(--soft);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
  }
  .tab-btn:hover { color: var(--ink); }
  .tab-btn.active {
    color: var(--ink);
    border-bottom-color: var(--accent);
    font-weight: 600;
  }

  .tab-content {
    display: none;
  }
  .tab-content.active {
    display: block;
  }

  .listings-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 20px;
    margin-bottom: 32px;
  }
  .listing-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
    transition: box-shadow 0.3s;
  }
  .listing-card:hover {
    box-shadow: 0 4px 16px rgba(37, 99, 235, 0.08);
    border-color: var(--accent);
  }
  .listing-card .image {
    width: 100%;
    height: 160px;
    background: var(--line);
    object-fit: cover;
  }
  .listing-card .info {
    padding: 12px;
  }
  .listing-card .title {
    font-weight: 600;
    font-size: 0.9rem;
    margin: 0 0 4px;
    line-height: 1.3;
  }
  .listing-card .price {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 8px;
  }
  .listing-card .status {
    font-size: 0.75rem;
    padding: 4px 8px;
    background: #d1fae5;
    color: #047857;
    border-radius: 4px;
    display: inline-block;
  }

  .form-group {
    margin-bottom: 16px;
  }
  .form-group label {
    display: block;
    font-weight: 600;
    margin-bottom: 6px;
    font-size: 0.9rem;
  }
  .form-group input,
  .form-group select,
  .form-group textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 0.9rem;
    font-family: inherit;
  }
  .form-group textarea {
    resize: vertical;
    min-height: 80px;
  }
  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
  }

  .camera-section {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .camera-section h4 {
    margin: 0 0 12px;
    font-size: 0.95rem;
  }
  video {
    width: 100%;
    height: 240px;
    background: var(--line);
    border-radius: 6px;
    margin-bottom: 12px;
    display: none;
  }
  video.active {
    display: block;
  }
  .camera-controls {
    display: flex;
    gap: 8px;
  }
  .camera-controls button {
    flex: 1;
    padding: 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.85rem;
    transition: all 0.2s;
  }
  .camera-controls button:hover {
    border-color: var(--accent);
    background: #f0f6ff;
  }
  .camera-controls button.primary {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }
  .camera-controls button.primary:hover {
    background: #1d4ed8;
  }

  .submit-btn {
    background: var(--accent);
    color: white;
    border: none;
    padding: 12px 24px;
    border-radius: 6px;
    font-weight: 700;
    cursor: pointer;
    font-size: 0.95rem;
    transition: background 0.2s;
  }
  .submit-btn:hover { background: #1d4ed8; }
  .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .status-msg {
    padding: 12px 16px;
    border-radius: 6px;
    margin-bottom: 16px;
    font-size: 0.9rem;
  }
  .status-msg.ok { background: #d1fae5; color: #047857; }
  .status-msg.err { background: #fee2e2; color: #dc2626; }

  .payout-list {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
  }
  .payout-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px;
    border-bottom: 1px solid var(--line);
  }
  .payout-item:last-child { border-bottom: none; }
  .payout-info {
    flex: 1;
  }
  .payout-status {
    display: inline-block;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 0.75rem;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .payout-status.pending {
    background: #fef08a;
    color: #713f12;
  }
  .payout-status.approved {
    background: #d1fae5;
    color: #047857;
  }
  .payout-status.processing {
    background: #cffafe;
    color: #0e7490;
  }

  footer {
    background: var(--card);
    border-top: 1px solid var(--line);
    padding: 32px;
    text-align: center;
    color: var(--soft);
    font-size: 0.85rem;
  }
  .footer-brand {
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 8px;
  }

  @media(max-width: 768px) {
    .stats-row { grid-template-columns: 1fr; }
    header { flex-direction: column; gap: 12px; align-items: flex-start; }
    .tabs { flex-wrap: wrap; }
  }
</style>
</head>
<body>

<header>
  <div class="branding">
    <div class="logo">Relay</div>
    <div class="byline">by LIMEN Helix</div>
  </div>
  <div class="seller-info">
    Seller: <span id="sellerDisplay">Loading...</span>
  </div>
</header>

<div class="container">
  <div id="statusMsg"></div>

  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-label">Total Listings</div>
      <div class="stat-value" id="totalListings">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Total Earnings</div>
      <div class="stat-value" id="totalEarnings">$0.00</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Pending Payout</div>
      <div class="stat-value" id="pendingPayout">$0.00</div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('listings')">My Listings</button>
    <button class="tab-btn" onclick="switchTab('sell')">Sell Item</button>
    <button class="tab-btn" onclick="switchTab('payouts')">Earnings & Payouts</button>
  </div>

  <!-- Listings Tab -->
  <div id="listings" class="tab-content active">
    <div id="listingsContainer" style="padding: 40px; text-align: center; color: var(--soft);">Loading listings...</div>
  </div>

  <!-- Sell Item Tab -->
  <div id="sell" class="tab-content">
    <div style="max-width: 600px;">
      <h2 style="margin-top: 0;">Create New Listing</h2>

      <div class="camera-section">
        <h4>Take Photo</h4>
        <video id="cameraVideo" playsinline></video>
        <div class="camera-controls">
          <button onclick="startCamera()">Start Camera</button>
          <button class="primary" onclick="capturePhoto()" id="captureBtn" disabled>Capture Photo</button>
          <button onclick="stopCamera()">Stop Camera</button>
        </div>
        <input type="hidden" id="imageUrl" />
      </div>

      <form onsubmit="createListing(event)">
        <div class="form-group">
          <label>Title</label>
          <input type="text" id="listingTitle" placeholder="e.g. Vintage leather jacket" required />
        </div>

        <div class="form-group">
          <label>Price (USD)</label>
          <input type="number" id="listingPrice" min="0" step="0.01" placeholder="49.99" required />
        </div>

        <div class="form-group">
          <label>Condition</label>
          <select id="listingCondition" required>
            <option value="">Choose condition</option>
            <option value="like-new">Like New</option>
            <option value="good">Good</option>
            <option value="fair">Fair</option>
          </select>
        </div>

        <div class="form-group">
          <label>Category</label>
          <select id="listingCategory" required>
            <option value="">Choose category</option>
            <option value="fashion">Fashion</option>
            <option value="shoes">Shoes</option>
            <option value="accessories">Accessories</option>
            <option value="home">Home</option>
          </select>
        </div>

        <div class="form-group">
          <label>Description</label>
          <textarea id="listingDescription" placeholder="Describe your item..."></textarea>
        </div>

        <div class="form-group">
          <label>Quantity</label>
          <input type="number" id="listingQuantity" min="1" value="1" />
        </div>

        <button type="submit" class="submit-btn">Create Listing</button>
      </form>
    </div>
  </div>

  <!-- Payouts Tab -->
  <div id="payouts" class="tab-content">
    <h2 style="margin-top: 0;">Earnings & Payouts</h2>
    <div id="payoutsContainer" style="padding: 40px; text-align: center; color: var(--soft);">Loading payouts...</div>
  </div>
</div>

<footer>
  <div class="footer-brand">Relay · by LIMEN Helix</div>
  <div>Fast, secure seller tools · Get paid reliably</div>
</footer>

<script>
var MARKETPLACE_ID = localStorage.getItem('relay-marketplace-id') || 'mkt_1787335292880_bm7h5jy';
var SELLER_ID = localStorage.getItem('relay-seller-id');
var videoStream = null;
var marketplaceListings = [];

if (!SELLER_ID) {
  SELLER_ID = 'seller_' + prompt('Enter your seller ID (or leave blank for a new ID):');
  if (!SELLER_ID.slice(7)) SELLER_ID = 'seller_' + Date.now();
  localStorage.setItem('relay-seller-id', SELLER_ID);
}

document.getElementById('sellerDisplay').textContent = SELLER_ID;
loadListings();
loadPayouts();
setInterval(() => { loadStats(); loadPayouts(); }, 30000);

async function loadListings() {
  try {
    const r = await fetch('/api/relay-marketplace?action=seller-listings&marketplaceId=' + encodeURIComponent(MARKETPLACE_ID) + '&sellerId=' + encodeURIComponent(SELLER_ID));
    const j = await r.json();
    if (j.ok) {
      marketplaceListings = j.listings || [];
      renderListings();
      loadStats();
    }
  } catch (e) {
    showStatus('Error loading listings: ' + e.message, 'err');
  }
}

function renderListings() {
  const html = marketplaceListings.map(function(l) {
    return `
      <div class="listing-card">
        <img src="${l.images && l.images[0] ? l.images[0] : 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22160%22%3E%3Crect fill=%22%23e5e0d8%22 width=%22200%22 height=%22160%22/%3E%3C/svg%3E'}" class="image" alt="${l.title}" />
        <div class="info">
          <div class="title">${l.title}</div>
          <div class="price">$${l.price.toFixed(2)}</div>
          <span class="status">${l.status}</span>
        </div>
      </div>
    `;
  }).join('');

  const container = document.getElementById('listingsContainer');
  container.innerHTML = html || '<p style="padding: 40px; color: var(--soft);">No listings yet. Start selling!</p>';
}

async function loadStats() {
  try {
    const r = await fetch('/api/relay-marketplace?action=seller-stats&sellerId=' + encodeURIComponent(SELLER_ID) + '&marketplaceId=' + encodeURIComponent(MARKETPLACE_ID));
    const j = await r.json();
    if (j.ok && j.stats) {
      const s = j.stats;
      document.getElementById('totalListings').textContent = s.totalListings || 0;
      document.getElementById('totalEarnings').textContent = '$' + (s.totalEarnings || 0).toFixed(2);
      document.getElementById('pendingPayout').textContent = '$' + (s.pendingPayout || 0).toFixed(2);
    }
  } catch (e) {}
}

async function loadPayouts() {
  try {
    const r = await fetch('/api/relay-marketplace?action=seller-payouts&sellerId=' + encodeURIComponent(SELLER_ID) + '&marketplaceId=' + encodeURIComponent(MARKETPLACE_ID));
    const j = await r.json();
    if (j.ok && j.payouts) {
      const html = j.payouts.map(function(p) {
        return `
          <div class="payout-item">
            <div class="payout-info">
              <span class="payout-status ${p.status}">${p.status.toUpperCase()}</span>
              <div style="margin-top: 4px;">Order ${p.orderId.slice(0, 8)}...</div>
            </div>
            <div style="text-align: right; font-weight: 700;">$${p.amount.toFixed(2)}</div>
          </div>
        `;
      }).join('');

      document.getElementById('payoutsContainer').innerHTML = html || '<div style="padding: 40px; text-align: center; color: var(--soft);">No payouts yet.</div>';
    }
  } catch (e) {}
}

function startCamera() {
  navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'environment' }
  }).then(function(stream) {
    videoStream = stream;
    const video = document.getElementById('cameraVideo');
    video.srcObject = stream;
    video.classList.add('active');
    document.getElementById('captureBtn').disabled = false;
  }).catch(function(e) {
    showStatus('Camera access denied: ' + e.message, 'err');
  });
}

function capturePhoto() {
  const video = document.getElementById('cameraVideo');
  if (!video.srcObject) return;

  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0);

  const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
  document.getElementById('imageUrl').value = dataUrl;
  showStatus('Photo captured! Click Create Listing to save.', 'ok');
}

function stopCamera() {
  if (videoStream) {
    videoStream.getTracks().forEach(function(t) { t.stop(); });
    videoStream = null;
  }
  document.getElementById('cameraVideo').classList.remove('active');
  document.getElementById('captureBtn').disabled = true;
}

async function createListing(event) {
  event.preventDefault();

  const btn = event.target.querySelector('[type="submit"]');
  btn.disabled = true;
  btn.textContent = 'Creating...';

  try {
    const images = [];
    const imageUrl = document.getElementById('imageUrl').value;
    if (imageUrl) images.push(imageUrl);

    const r = await fetch('/api/relay-marketplace', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'create-listing',
        marketplaceId: MARKETPLACE_ID,
        sellerId: SELLER_ID,
        title: document.getElementById('listingTitle').value,
        price: parseFloat(document.getElementById('listingPrice').value),
        condition: document.getElementById('listingCondition').value,
        category: document.getElementById('listingCategory').value,
        description: document.getElementById('listingDescription').value,
        quantity: parseInt(document.getElementById('listingQuantity').value) || 1,
        images: images
      })
    });

    const j = await r.json();
    if (j.ok) {
      showStatus('Listing created!', 'ok');
      event.target.reset();
      document.getElementById('imageUrl').value = '';
      stopCamera();
      setTimeout(() => loadListings(), 1000);
    } else {
      showStatus('Failed: ' + (j.error || 'unknown error'), 'err');
    }
  } catch (e) {
    showStatus('Error: ' + e.message, 'err');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Create Listing';
  }
}

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
  document.querySelectorAll('.tab-content').forEach(function(c) { c.classList.remove('active'); });

  event.target.classList.add('active');
  document.getElementById(tab).classList.add('active');
}

function showStatus(msg, type) {
  const el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.className = 'status-msg ' + type;
  setTimeout(() => { el.textContent = ''; }, 3000);
}
</script>
</body>
</html>
