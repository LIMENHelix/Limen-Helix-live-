<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LIMEN · Biosensor</title>
<script>if(sessionStorage.getItem('limen_access')!=='granted'){window.location.replace('/?return='+encodeURIComponent('/biosensor'));}</script>
<style>
  :root{--gold:#c9a94e;--ink:#efe9d8;--line:rgba(201,169,78,0.22);--void:#03030a}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--void);font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--ink)}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
  .veil{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(130% 100% at 50% 45%,rgba(3,3,10,0) 42%,rgba(3,3,10,0.5) 80%,rgba(3,3,10,0.9) 100%)}
  .stage{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;pointer-events:none}
  .phase-big{font-size:clamp(1.3rem,5vw,3rem);letter-spacing:.18em;text-transform:uppercase;
    text-shadow:-1px -1px 2px #000,1px -1px 2px #000,-1px 1px 2px #000,1px 1px 2px #000,0 0 22px rgba(0,0,0,.7);
    transition:color 2s ease}
  .phase-desc{margin-top:10px;font-size:clamp(.6rem,1.7vw,.82rem);font-style:italic;letter-spacing:.1em;
    color:rgba(222,206,162,.8);text-shadow:0 1px 3px #000,0 0 12px #000}
  .hr{margin-top:18px;font-size:clamp(1.1rem,4vw,2.2rem);letter-spacing:.1em;color:#fff;
    text-shadow:-1px -1px 2px #000,1px 1px 2px #000,0 0 18px rgba(220,40,40,.5)}
  .hr small{font-size:.42em;letter-spacing:.3em;opacity:.6}
  /* readout bars */
  .readout{position:fixed;left:18px;top:18px;z-index:3;width:200px;background:rgba(2,2,8,0.55);
    border:1px solid var(--line);border-radius:6px;padding:12px 13px;backdrop-filter:blur(4px);font-size:10px;letter-spacing:.08em}
  .readout h4{margin:0 0 10px;font-size:9px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;opacity:.85}
  .met{margin:7px 0}
  .met .lab{display:flex;justify-content:space-between;text-transform:uppercase;color:rgba(239,233,216,.6);font-size:8.5px;letter-spacing:1.5px}
  .met .track{height:5px;background:rgba(255,255,255,0.06);border-radius:3px;margin-top:3px;overflow:hidden}
  .met .fill{height:100%;width:0%;background:var(--gold);border-radius:3px;transition:width .3s ease,background 1.5s ease}
  /* controls */
  .controls{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:3;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .controls button{background:rgba(2,2,8,0.6);border:1px solid var(--line);color:var(--gold);cursor:pointer;
    font-family:inherit;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;padding:9px 14px;border-radius:3px;transition:.2s;backdrop-filter:blur(3px)}
  .controls button:hover{background:rgba(201,169,78,.16);color:#fff}
  .controls button.on{color:#fff;border-color:var(--gold);box-shadow:0 0 14px rgba(201,169,78,.45)}
  .controls button.err{border-color:#c25b56;color:#e08a72}
  .topright{position:fixed;right:18px;top:18px;z-index:3;text-align:right;font-size:9px;letter-spacing:.12em}
  .topright a{color:rgba(201,169,78,.7);text-decoration:none}
  .topright a:hover{color:#fff}
  .topright .live{color:#7fb069;text-shadow:0 0 8px rgba(127,176,105,.6)}
  .topright .idle{color:rgba(239,233,216,.35)}
  .note{position:fixed;bottom:64px;left:50%;transform:translateX(-50%);z-index:3;font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:rgba(239,233,216,.28)}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="veil"></div>

<div class="readout">
  <h4>LIMEN Biosensor</h4>
  <div class="met"><div class="lab"><span>arousal</span><span id="vArousal">—</span></div><div class="track"><div class="fill" id="fArousal"></div></div></div>
  <div class="met"><div class="lab"><span>coherence</span><span id="vCoh">—</span></div><div class="track"><div class="fill" id="fCoh"></div></div></div>
  <div class="met"><div class="lab"><span>cognitive load</span><span id="vLoad">—</span></div><div class="track"><div class="fill" id="fLoad"></div></div></div>
  <div class="met"><div class="lab"><span>valence</span><span id="vVal">—</span></div><div class="track"><div class="fill" id="fVal"></div></div></div>
  <div class="met"><div class="lab"><span>HR / HRV</span><span id="vHr">— / —</span></div></div>
</div>

<div class="topright">
  <div id="bcast" class="idle">○ broadcast idle</div>
  <div style="margin-top:6px"><a href="/civilization">→ LIMEN cockpit</a></div>
</div>

<div class="stage">
  <div class="phase-big" id="phaseBig">— · AWAITING SIGNAL</div>
  <div class="phase-desc" id="phaseDesc">connect a sensor below to begin</div>
  <div class="hr" id="hrBig" style="display:none"><span id="hrVal">--</span> <small>BPM</small></div>
</div>

<div class="note">inferred regulation phase · not clinical · your data stays in this browser</div>

<div class="controls">
  <button id="bCam">Camera rPPG</button>
  <button id="bBle">Polar / HRV strap</button>
  <button id="bMot">Motion</button>
  <button id="bSnd">♪ Sound</button>
</div>

<script type="x-shader/x-vertex" id="vert">attribute vec2 p;void main(){gl_Position=vec4(p,0.0,1.0);}</script>
<script type="x-shader/x-fragment" id="frag">
precision highp float;
uniform vec2 u_res; uniform float u_time; uniform vec3 u_color; uniform float u_chaos; uniform float u_pulse;
mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
void main(){
  vec2 uv=(gl_FragCoord.xy-0.5*u_res)/min(u_res.x,u_res.y);
  float t=u_time*0.12;
  uv*=(1.35+0.42*sin(u_time*0.13))*(1.0-u_pulse*0.16);
  uv*=rot(t*0.25);
  for(int i=0;i<4;i++){ uv=abs(uv)-(0.42-u_chaos*0.10); uv*=rot(0.38+0.16*sin(t+float(i))+u_chaos*0.55*sin(t*1.9+float(i)*2.1)); }
  vec2 c=0.7885*vec2(cos(t*0.7),sin(t*0.93));
  vec2 z=uv*1.55; float m=0.0; bool esc=false;
  for(int i=0;i<110;i++){ z=vec2(z.x*z.x-z.y*z.y,2.0*z.x*z.y)+c; float d=dot(z,z);
    if(d>16.0){ m=float(i)-log2(log2(d))+4.0; esc=true; break; } }
  float n=esc?clamp(m/110.0,0.0,1.0):1.0;
  float core=exp(-3.2*n);
  vec3 base=u_color;
  vec3 col=base*(0.22+0.85*pow(n,0.6));
  col+=core*mix(base,vec3(1.0),0.65)*1.45;
  col+=base*pow(1.0-n,4.0)*0.95;
  col+=vec3(1.0)*pow(max(0.0,sin(34.0*length(z)+u_time*2.6)),22.0)*0.18;
  col*=1.0+u_pulse*0.55;
  float vig=1.0-0.55*length((gl_FragCoord.xy/u_res)-0.5);
  col*=clamp(vig,0.0,1.0); col=pow(col,vec3(0.86));
  gl_FragColor=vec4(col,1.0);
}
</script>

<script src="biosensorEngine.js"></script>
<script>
/* ── canonical phases: color (rgb + hex), chaos (form), target [arousal,coherence,load,valence], audio scaleId ── */
var PHASES=[
 {p:'P0', l:'SOURCE / NULL SYMMETRY',  d:'Pre-recursive non-differentiation',                        hex:'#F4F1E8', c:[0.957,0.945,0.910], ch:0.08, tgt:[0.15,0.50,0.10,0.50], sc:'calm'},
 {p:'P1', l:'COLLAPSE / LIGHT',        d:'Adaptive collapse / defensive contraction',                hex:'#FFD166', c:[1.000,0.820,0.400], ch:0.50, tgt:[0.25,0.25,0.30,0.30], sc:'dark'},
 {p:'P2', l:'RHYTHM / BONDING',        d:'Dyadic co-regulation / phase-locked entrainment',          hex:'#2DD4BF', c:[0.176,0.831,0.749], ch:0.28, tgt:[0.35,0.80,0.25,0.70], sc:'calm'},
 {p:'P3', l:'DARKNESS / FRACTURE',     d:'Recursive overload / pattern instability',                 hex:'#9D6BFF', c:[0.165,0.063,0.239], ch:1.00, tgt:[0.85,0.20,0.80,0.25], sc:'dark'},
 {p:'P4', l:'PEACE / STABILIZATION',   d:'Scaffolded stabilization / nested integration',            hex:'#8FBF9F', c:[0.561,0.749,0.624], ch:0.25, tgt:[0.40,0.65,0.40,0.62], sc:'calm'},
 {p:'P5', l:'ENDURANCE',               d:'Rhythmic self-regulation / recurrent predictive control',  hex:'#F59E0B', c:[0.961,0.620,0.043], ch:0.42, tgt:[0.55,0.55,0.62,0.50], sc:'dark'},
 {p:'P6', l:'ORDER',                   d:'Coordinated modularity / executive task-state switching',  hex:'#2563EB', c:[0.145,0.388,0.922], ch:0.12, tgt:[0.65,0.85,0.70,0.70], sc:'lum'},
 {p:'P7', l:'SEPARATION',              d:'Recursive shear / functional dissociation',                hex:'#DC2626', c:[0.863,0.149,0.149], ch:0.80, tgt:[0.60,0.40,0.62,0.40], sc:'dark'},
 {p:'P7b',l:'DIVERGENCE FORK',         d:'Bifurcation point / recursive exhaustion vs re-engagement',hex:'#F97316', c:[0.976,0.451,0.086], ch:0.92, tgt:[0.78,0.35,0.85,0.40], sc:'dark'},
 {p:'P8', l:'CONSCIENCE / REFLECTION', d:'Reflective feedback / metacognitive self-monitoring',      hex:'#6D5DFC', c:[0.427,0.365,0.988], ch:0.40, tgt:[0.45,0.70,0.78,0.55], sc:'calm'},
 {p:'P9', l:'THRESHOLD',               d:'Poised disequilibrium / pre-transformation saturation',    hex:'#A855F7', c:[0.659,0.333,0.969], ch:0.72, tgt:[0.90,0.30,0.90,0.45], sc:'dark'},
 {p:'P10',l:'RESURRECTION',            d:'Reintegrated recursion / multilayer integration',          hex:'#10B981', c:[0.063,0.725,0.506], ch:0.22, tgt:[0.55,0.90,0.50,0.88], sc:'lum'}
];
function clamp01(v){return Math.max(0,Math.min(1,v));}

/* ── classify metrics -> nearest phase (transparent heuristic, weighted) ── */
var W=[1.1,1.2,0.9,0.7]; // arousal, coherence, load, valence weights
function classify(a,c,l,v){
  var best=0,bd=1e9;
  for(var i=0;i<PHASES.length;i++){ var t=PHASES[i].tgt;
    var d=W[0]*Math.pow(a-t[0],2)+W[1]*Math.pow(c-t[1],2)+W[2]*Math.pow(l-t[2],2)+W[3]*Math.pow(v-t[3],2);
    if(d<bd){bd=d;best=i;} }
  return best;
}

/* ── live state (eased) ── */
var S={a:0.15,c:0.5,l:0.1,v:0.5,hr:0,hrv:0,have:false};
var curColor=PHASES[0].c.slice(), tgtColor=PHASES[0].c.slice();
var curChaos=PHASES[0].ch, tgtChaos=PHASES[0].ch;
window.__bioColor=curColor; window.__bioChaos=curChaos; window.__bioPulse=0;
var phaseIdx=0, candIdx=0, candSince=0;

/* ── WebGL fractal ── */
(function(){
  var cv=document.getElementById('gl'),gl=null; try{gl=cv.getContext('webgl')||cv.getContext('experimental-webgl');}catch(e){}
  if(!gl){cv.style.background='radial-gradient(60% 60% at 50% 45%,#1a1407,#03030a)';return;}
  function sh(t,s){var x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);return x;}
  var pr=gl.createProgram();
  gl.attachShader(pr,sh(gl.VERTEX_SHADER,document.getElementById('vert').textContent));
  gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,document.getElementById('frag').textContent));
  gl.linkProgram(pr); if(!gl.getProgramParameter(pr,gl.LINK_STATUS)){cv.style.background='radial-gradient(60% 60% at 50% 45%,#1a1407,#03030a)';return;}
  gl.useProgram(pr);
  var b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  var lc=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(lc);gl.vertexAttribPointer(lc,2,gl.FLOAT,false,0,0);
  var uR=gl.getUniformLocation(pr,'u_res'),uT=gl.getUniformLocation(pr,'u_time'),uC=gl.getUniformLocation(pr,'u_color'),uH=gl.getUniformLocation(pr,'u_chaos'),uP=gl.getUniformLocation(pr,'u_pulse');
  function sz(){var d=Math.min(window.devicePixelRatio||1,1.5);cv.width=(innerWidth*d)|0;cv.height=(innerHeight*d)|0;gl.viewport(0,0,cv.width,cv.height);}
  sz();addEventListener('resize',sz);
  var t0=Date.now(),run=true;
  document.addEventListener('visibilitychange',function(){run=!document.hidden;if(run)loop();});
  // heart-pulse accumulator
  var beat=0,last=Date.now();
  function loop(){ if(!run)return;
    var now=Date.now(),dt=(now-last)/1000; last=now;
    if(S.hr>30){ beat+=dt*(S.hr/60); window.__bioPulse=Math.pow(Math.max(0,Math.sin(beat*6.2832)),3); }
    else window.__bioPulse*=0.9;
    for(var k=0;k<3;k++) curColor[k]+=(tgtColor[k]-curColor[k])*0.02;
    curChaos+=(tgtChaos-curChaos)*0.02;
    gl.uniform2f(uR,cv.width,cv.height); gl.uniform1f(uT,(now-t0)/1000);
    gl.uniform3f(uC,curColor[0],curColor[1],curColor[2]); gl.uniform1f(uH,curChaos); gl.uniform1f(uP,window.__bioPulse);
    gl.drawArrays(gl.TRIANGLES,0,3); requestAnimationFrame(loop);
  }
  loop();
})();

/* ── phase-tuned generative audio (original; starts on first gesture) ── */
var AU=(function(){
  var ctx=null,master=null,arp=null,voices=[],on=false,curScale='calm';
  var SCALES={ calm:[196,220,261.6,293.7,392], dark:[146.8,174.6,196,233.1,277.2], lum:[220,261.6,329.6,392,440,523.3] };
  var ROOT={ calm:55, dark:49, lum:65.4 };
  function start(){ if(ctx)return; var AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
    ctx=new AC(); master=ctx.createGain(); master.gain.value=0; master.connect(ctx.destination);
    master.gain.linearRampToValueAtTime(0.15,ctx.currentTime+4); on=true; rebuildDrone(); startArp();
  }
  function rebuildDrone(){ voices.forEach(function(v){try{v.o.stop();}catch(e){}}); voices=[];
    var r=ROOT[curScale]; [1,1.5,2,3].forEach(function(mul,k){
      var o=ctx.createOscillator(); o.type=k%2?'sine':'triangle'; o.frequency.value=r*mul;
      var f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=520;
      var g=ctx.createGain(); g.gain.value=0.12/(k+1);
      var lfo=ctx.createOscillator(); lfo.frequency.value=0.04+0.025*k; var lg=ctx.createGain(); lg.gain.value=2+k; lfo.connect(lg); lg.connect(o.detune); lfo.start();
      o.connect(f); f.connect(g); g.connect(master); o.start(); voices.push({o:o,lfo:lfo});
    });
  }
  function startArp(){ var dl=ctx.createDelay(1.5); dl.delayTime.value=0.66; var fb=ctx.createGain(); fb.gain.value=0.42;
    dl.connect(fb); fb.connect(dl); var wet=ctx.createGain(); wet.gain.value=0.5; dl.connect(wet); wet.connect(master);
    var s=0; arp=setInterval(function(){ if(!ctx)return; var sc=SCALES[curScale]; var n=sc[s%sc.length]*(Math.random()<0.25?2:1); s++;
      var o=ctx.createOscillator(); o.type='sine'; o.frequency.value=n; var g=ctx.createGain(); g.gain.value=0;
      o.connect(g); g.connect(dl); g.connect(master); var t=ctx.currentTime;
      g.gain.linearRampToValueAtTime(0.05,t+0.05); g.gain.exponentialRampToValueAtTime(0.0008,t+1.7); o.start(t); o.stop(t+1.9);
    },1500);
  }
  function setScale(id){ if(id===curScale||!ctx)return; curScale=id; rebuildDrone(); }
  function stop(){ if(!ctx)return; clearInterval(arp); var c=ctx; try{master.gain.linearRampToValueAtTime(0,c.currentTime+1);}catch(e){} setTimeout(function(){try{c.close();}catch(e){}},1200); ctx=null; on=false; }
  return { start:start, stop:stop, setScale:setScale, isOn:function(){return on;}, ensure:function(){ if(!ctx) start(); } };
})();

/* ── broadcast to LIMEN tabs ── */
var BC=(function(){ try{ return new BroadcastChannel('limen-bio'); }catch(e){ return null; } })();
function broadcast(){
  var ph=PHASES[phaseIdx];
  var msg={ src:'tracker', ts:Date.now(), hr:Math.round(S.hr), hrv:Math.round(S.hrv),
    arousal:+S.a.toFixed(3), coherence:+S.c.toFixed(3), cognitiveLoad:+S.l.toFixed(3), valence:+S.v.toFixed(3),
    phase:{ id:ph.p, label:ph.l, hex:ph.hex, color:ph.c, chaos:ph.ch } };
  if(BC) try{ BC.postMessage(msg); }catch(e){}
  try{ localStorage.setItem('limen_bio_state', JSON.stringify(msg)); }catch(e){}
  var el=document.getElementById('bcast'); el.className='live'; el.textContent='● broadcasting · '+ph.p;
}

/* ── UI refresh ── */
function bar(id,vid,val){ document.getElementById(id).style.width=(val*100).toFixed(0)+'%'; document.getElementById(vid).textContent=(val*100).toFixed(0); }
function refresh(){
  if(!S.have) return;  // keep the AWAITING SIGNAL placeholder until a sensor feeds data
  bar('fArousal','vArousal',S.a); document.getElementById('fArousal').style.background=PHASES[phaseIdx].hex;
  bar('fCoh','vCoh',S.c); document.getElementById('fCoh').style.background=PHASES[phaseIdx].hex;
  bar('fLoad','vLoad',S.l); bar('fVal','vVal',S.v);
  document.getElementById('vHr').textContent=(S.hr?Math.round(S.hr):'—')+' / '+(S.hrv?Math.round(S.hrv):'—');
  var ph=PHASES[phaseIdx];
  document.getElementById('phaseBig').textContent=ph.p+' · '+ph.l;
  document.getElementById('phaseBig').style.color=ph.hex;
  document.getElementById('phaseDesc').textContent=ph.d;
  if(S.hr){ document.getElementById('hrBig').style.display='block'; document.getElementById('hrVal').textContent=Math.round(S.hr); }
}

/* ── consume engine state ── */
function onState(bio){
  if(!bio) return;
  S.have=true;
  if(typeof bio.arousal==='number') S.a=S.a+( clamp01(bio.arousal)-S.a)*0.2;
  if(typeof bio.coherence==='number') S.c=S.c+( clamp01(bio.coherence)-S.c)*0.2;
  if(typeof bio.cognitiveLoad==='number') S.l=S.l+( clamp01(bio.cognitiveLoad)-S.l)*0.2;
  if(typeof bio.valence==='number') S.v=S.v+( clamp01(bio.valence<0?(bio.valence+1)/2:bio.valence)-S.v)*0.2;
  if(typeof bio.heartRate==='number'&&bio.heartRate>0) S.hr=bio.heartRate;
  if(typeof bio.hrv==='number') S.hrv=bio.hrv;
  // classify + debounce (must persist ~1.5s to switch)
  var cand=classify(S.a,S.c,S.l,S.v);
  if(cand===candIdx){ if(Date.now()-candSince>1500 && cand!==phaseIdx){ phaseIdx=cand;
      tgtColor=PHASES[cand].c.slice(); tgtChaos=PHASES[cand].ch; AU.setScale(PHASES[cand].sc); } }
  else { candIdx=cand; candSince=Date.now(); }
}

/* ── wire engine ── */
var engine=null;
function ensureEngine(){
  if(engine) return engine;
  if(typeof window.startBiosensorEngine==='function'){ engine=window.startBiosensorEngine(); try{engine.start();}catch(e){}
    try{ engine.subscribe(function(){ try{ onState(engine.getState()); }catch(e){} }); }catch(e){} }
  return engine;
}
async function connect(kind,btn){
  AU.ensure();                 // first gesture unlocks + auto-starts phase music
  var e=ensureEngine(); if(!e){ btn.classList.add('err'); btn.textContent='engine missing'; return; }
  var fn={camera:'enableCamera',ble:'enableBLE',motion:'enableMotion'}[kind];
  try{ var r=await e[fn](); if(r&&r.success===false){ btn.classList.add('err'); btn.textContent=(r.error||'failed').slice(0,18); return; }
    btn.classList.add('on'); if(kind==='ble'&&r&&r.deviceName) btn.textContent='● '+r.deviceName; }
  catch(err){ btn.classList.add('err'); btn.textContent='failed'; }
}
document.getElementById('bCam').addEventListener('click',function(){connect('camera',this);});
document.getElementById('bBle').addEventListener('click',function(){connect('ble',this);});
document.getElementById('bMot').addEventListener('click',function(){connect('motion',this);});
document.getElementById('bSnd').addEventListener('click',function(){ if(AU.isOn()){AU.stop();this.classList.remove('on');this.innerHTML='♪ Sound';} else {AU.ensure();this.classList.add('on');this.innerHTML='♪ On';} });

/* ── main tick: refresh UI + broadcast ~5Hz ── */
setInterval(function(){ refresh(); if(S.have) broadcast(); }, 200);
</script>
</body>
</html>
