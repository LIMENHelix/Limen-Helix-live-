// ═══ DENDRITIC BRANCH GENERATOR ═══
function drawDendrite(x,y,angle,length,depth,alpha,p){
if(depth<=0||length<3||alpha<0.005)return;
var endX=x+Math.cos(angle)*length;
var endY=y+Math.sin(angle)*length;
ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(endX,endY);
ctx.strokeStyle='rgba('+p.aR+','+p.aG+','+p.aB+','+alpha+')';
ctx.lineWidth=Math.max(0.3,depth*0.4);ctx.stroke();
// Branch — real dendrites branch at ~30-45 degree angles
var branchAngle=0.4+Math.random()*0.3;
var shrink=0.6+Math.random()*0.15;
drawDendrite(endX,endY,angle-branchAngle,length*shrink,depth-1,alpha*0.7,p);
drawDendrite(endX,endY,angle+branchAngle,length*shrink,depth-1,alpha*0.7,p);
// Occasional third branch (real neurons do this)
if(Math.random()<0.3&&depth>2){
drawDendrite(endX,endY,angle+(Math.random()-0.5)*0.8,length*shrink*0.8,depth-1,alpha*0.5,p);
}}

// ═══ MAIN DRAW ═══
function draw(){
var p=PH[phase];var cx=W/2,cy=H/2,maxD=Math.max(W,H);

// ── BIOSENSOR MODULATION ──
// If biosensor engine is running, modulate phase visualization params
if(window._bioEngine){
  var bState=window._bioEngine.getState();
  if(bState.timestamp>0){
    var bv=bState.viz;
    // Create modulated copy of phase params
    p={};for(var k in PH[phase])p[k]=PH[phase][k];
    p.nodeActivity=Math.max(0.05,PH[phase].nodeActivity+(bv.nodeActivity||0));
    p.connectivity=Math.max(0.02,Math.min(2,PH[phase].connectivity+(bv.connectivity||0)));
    p.chaos=Math.max(0,Math.min(1,PH[phase].chaos+(bv.chaos||0)));
    p.fireRate=Math.max(0.01,PH[phase].fireRate+(bv.fireRate||0));
    // Color warmth shift based on arousal
    if(bv.colorShift){
      var shift=bv.colorShift*15;
      p.aR=Math.max(0,Math.min(255,PH[phase].aR+shift));
      p.aG=Math.max(0,Math.min(255,PH[phase].aG-shift*0.3));
      p.aB=Math.max(0,Math.min(255,PH[phase].aB-shift*0.5));
    }
    // Update phase resonance
    window._bioEngine.getPhaseResonance(phase);
  }
}

var aRGB=p.aR+','+p.aG+','+p.aB;
ctx.clearRect(0,0,W,H);

// ── NAV SIGNAL STATE — network behavior changes ──
var navSig=window._navSignal||{type:null};
var navActive=false,navFade=0,navType=null;
if(navSig.type&&navSig.startT>0){
  var elapsed=performance.now()-navSig.startT;
  if(elapsed<(navSig.durationMs||6000)){
    navActive=true;
    navType=navSig.type;
    // Fade envelope: ramp up 0-1s, sustain, fade out last 1.5s
    var dur=navSig.durationMs||6000;
    if(elapsed<1000) navFade=elapsed/1000;
    else if(elapsed>dur-1500) navFade=(dur-elapsed)/1500;
    else navFade=1;
    navFade*=(navSig.intensity||0.7);
  }
}

// ── IMMERSIVE MODE — first-person neural experience ──
if(immersiveMode){
  drawImmersive(ctx,p,W,H,t);
  t+=16;requestAnimationFrame(draw);return;
}

// === DEEP SPACE BACKGROUND ===
var bg=ctx.createRadialGradient(cx,cy,0,cx,cy,maxD*0.7);
bg.addColorStop(0,'rgba('+Math.floor(p.aR*0.06)+','+Math.floor(p.aG*0.06)+','+Math.floor(p.aB*0.06)+',1)');
bg.addColorStop(0.5,'rgba('+Math.floor(p.aR*0.02)+','+Math.floor(p.aG*0.02)+','+Math.floor(p.aB*0.02)+',1)');
bg.addColorStop(1,'rgba(0,0,0,1)');
ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

// === OSCILLATORY WAVE FIELD (EEG-like) ===
// Alpha/theta/gamma waves rippling through the network
var waveCount=3;
for(var wv=0;wv<waveCount;wv++){
var freq=[0.003,0.008,0.02][wv]; // theta, alpha, gamma
var amp=p.waveAmp*[30,18,8][wv];
var wAlpha=[0.04,0.03,0.025][wv]*p.nodeActivity;

// ── NAV SIGNAL: Wave band modulation ──
if(navActive&&navFade>0){
  if(navType==='descent'){
    // Gamma band (wv=2) dominates — coherent high-frequency oscillation
    if(wv===2){amp*=1+navFade*2.5;wAlpha*=1+navFade*3;}
    else{amp*=1-navFade*0.5;wAlpha*=1-navFade*0.4;} // Suppress theta/alpha
  } else if(navType==='regression'){
    // All bands become erratic then flatten
    amp*=1+navFade*Math.sin(t*0.01+wv*3)*2; // Wild oscillation
    wAlpha*=1-navFade*0.5; // Then fade
  }
}

if(wAlpha<0.003)continue;
var waveColor=aRGB;
if(navActive&&navFade>0&&navType==='descent'&&wv===2)waveColor='201,169,78';
ctx.beginPath();
for(var wx=0;wx<W;wx+=2){
var wy=cy+Math.sin(wx*freq+t*0.002*(wv+1))*amp+Math.sin(wx*freq*2.3+t*0.003)*amp*0.3;
wy+=Math.sin(t*0.001+wv)*20; // drift
if(wx===0)ctx.moveTo(wx,wy);else ctx.lineTo(wx,wy);

}

// === WHITE MATTER FIBER TRACTS (connections between nodes) ===
for(var ci=0;ci<DMN_CONNECTIONS.length;ci++){
var conn=DMN_CONNECTIONS[ci];
var n1=DMN_NODES[conn[0]],n2=DMN_NODES[conn[1]];
var x1=n1.x*W,y1=n1.y*H,x2=n2.x*W,y2=n2.y*H;

// Connection strength varies with phase connectivity
var cAlpha=0.08*p.connectivity*(1-p.dissolution*0.9);
// Add pulsing — connections breathe
cAlpha*=0.7+0.3*Math.sin(t*0.002+ci*0.7);

// ── NAV SIGNAL: Connection behavior changes ──
var connColor=aRGB;
var connWidth=1+p.connectivity*0.8;
if(navActive&&navFade>0){
  if(navType==='descent'){
    // GAMMA SYNCHRONY: all connections pulse in unison (same phase, not offset by ci)
    // This is what coherent gamma oscillation looks like — everything locks

    y1+=Math.cos(t*0.025+ci*3.3)*fragmentJitter;
    x2+=Math.sin(t*0.028+ci*5.7)*fragmentJitter;
    y2+=Math.cos(t*0.032+ci*2.9)*fragmentJitter;

    if(Math.sin(t*0.01+ci*7.3)>0.3*navFade) cAlpha*=0.2;

  }
}

// Curved fiber tract (real axon bundles curve, they don't go straight)

var midY=(y1+y2)/2+Math.cos(ci*1.7)*20;

ctx.strokeStyle='rgba('+connColor+','+cAlpha+')';ctx.lineWidth=connWidth;ctx.stroke();

// Myelin sheath shimmer — dashed overlay
if(p.connectivity>0.5){
ctx.setLineDash([4,8]);
ctx.beginPath();ctx.moveTo(x1,y1);ctx.quadraticCurveTo(midX,midY,x2,y2);
ctx.strokeStyle='rgba(255,255,255,'+(cAlpha*0.3)+')';ctx.lineWidth=0.3;ctx.stroke();
ctx.setLineDash([]);
}}

// === NEURAL NODES (brain regions) ===
// Seed random for consistent dendrites per frame
var savedRandom=Math.random;
for(var ni=0;ni<DMN_NODES.length;ni++){
var node=DMN_NODES[ni];
var nx=node.x*W,ny=node.y*H;
var nodeR=maxD*0.018*node.r;

// Node dissolution

// In Phase 7, mPFC (index 0) goes offline first
if(phase===7&&ni===0)nodeDis=Math.min(1,nodeDis+0.3);

if(phase===7&&ni===1)nodeDis=Math.min(1,nodeDis+0.2);

var jy=ny+Math.cos(t*0.004*p.chaos+ni*2.3)*maxD*0.01*p.chaos;

// ── NAV SIGNAL: Node behavior changes ──
var nodeColor=aRGB;
var nodeGlowMult=1;
if(navActive&&navFade>0){
  if(navType==='descent'){
    // All nodes pulse together — coherent gamma rhythm

  }
}

// === SOMA (cell body) GLOW ===
var somaGlowR=nodeR*3*nodeGlowMult;
var somaGlow=ctx.createRadialGradient(jx,jy,0,jx,jy,somaGlowR);
somaGlow.addColorStop(0,'rgba('+nodeColor+','+(0.15*nodeAlpha*nodeGlowMult)+')');

coreGrad.addColorStop(0.5,'rgba('+nodeColor+','+(coreAlpha)+')');
coreGrad.addColorStop(1,'rgba('+nodeColor+','+(coreAlpha*0.3)+')');

// === NUCLEUS ===
ctx.beginPath();ctx.arc(jx,jy,coreR*0.3,0,Math.PI*2);
ctx.fillStyle='rgba(255,255,255,'+(coreAlpha*0.6)+')';ctx.fill();

// === DENDRITIC ARBOR ===
if(p.branchDepth>0&&nodeAlpha>0.05){

Math.random=function(){branchSeed=(branchSeed*16807)%2147483647;return(branchSeed-1)/2147483646};

var branches=4+Math.floor(node.r*3);
for(var bi=0;bi<branches;bi++){
var bAngle=(bi/branches)*Math.PI*2+ni*0.5;
var bLen=nodeR*1.5+node.r*10;

}

// === NODE LABEL (very subtle) ===
if(nodeAlpha>0.15){

}

var apChance=p.fireRate*0.15;
// Nav signal modulates AP firing
if(navActive&&navFade>0){

    apChance=Math.max(apChance,0.4*navFade);

}

for(var api=actionPotentials.length-1;api>=0;api--){

var curveY=(1-t2)*(1-t2)*fromN.y*H+2*(1-t2)*t2*((fromN.y*H+toN.y*H)/2+Math.cos(ci2*1.7)*20)+t2*t2*toN.y*H;

var tx=(1-tp2)*(1-tp2)*fromN.x*W+2*(1-tp2)*tp2*((fromN.x*W+toN.x*W)/2+midOff)+tp2*tp2*toN.x*W;

}}

// === DISSOLUTION PARTICLES — network fragmenting ===
if(p.dissolution>0.05){
var partCount=Math.floor(p.dissolution*150);
for(var dp=0;dp<partCount;dp++){
var dx=cx+Math.sin(dp*4.7+t*0.001)*W*0.5;
var dy=cy+Math.cos(dp*3.1+t*0.0008)*H*0.45;

// === SELF-NARRATIVE WHISPERS ===
if(p.txt.length>0){
ctx.font=Math.round(Math.min(16,W*0.025))+'px monospace';ctx.textAlign='center';
for(var ti=0;ti<p.txt.length;ti++){

var ty=cy+Math.cos(ti*1.7+t*0.0003)*H*0.25*(1-p.dissolution*0.8);
var ta=0.15*(1-p.dissolution)*(0.5+Math.sin(t*0.001+ti*1.5)*0.5);

}}

// === HUD CORNER BRACKETS ===
var bL=35,bA=0.15*(1-p.dissolution*0.5);
ctx.strokeStyle='rgba('+aRGB+','+bA+')';ctx.lineWidth=0.8;

ctx.beginPath();ctx.moveTo(W-8-bL,8);ctx.lineTo(W-8,8);ctx.lineTo(W-8,8+bL);ctx.stroke();
ctx.beginPath();ctx.moveTo(8,H-8-bL);ctx.lineTo(8,H-8);ctx.lineTo(8+bL,H-8);ctx.stroke();
ctx.beginPath();ctx.moveTo(W-8-bL,H-8);ctx.lineTo(W-8,H-8);ctx.lineTo(W-8,H-8-bL);ctx.stroke();

// === USER PROXIMITY — nodes react to cursor/finger ===
hoveredNode=-1;
if(mouseX>0&&mouseY>0&&t%3===0){// only check every 3rd frame
// Check proximity to each node

var unx=un.x*W,uny=un.y*H;

var proxStrength=1-udist/proxThresh;
hoveredNode=ui;

// Node glow on hover
var reactG=ctx.createRadialGradient(unx,uny,0,unx,uny,30+proxStrength*30);
reactG.addColorStop(0,'rgba(255,255,255,'+(proxStrength*0.15)+')');
reactG.addColorStop(1,'rgba(0,0,0,0)');
ctx.fillStyle=reactG;ctx.beginPath();ctx.arc(unx,uny,30+proxStrength*30,0,Math.PI*2);ctx.fill();

// Show node name on hover
ctx.font='14px monospace';ctx.textAlign='center';
ctx.fillStyle='rgba('+aRGB+','+(proxStrength*0.7)+')';
ctx.fillText(un.name,unx,uny-35-proxStrength*10);
ctx.font='11px monospace';

// Immersive mode: check hotspot taps

  var somaR3=Math.min(W,H)*0.3;

}

if(immersiveMode&&Math.abs(dx)>40)immBehavior.escapeAttempts++;
// Swipe nav (long horizontal swipe)
if(!immersiveMode&&Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*2&&dt<500){
if(dx<-60&&phase<10&&isUnlocked(phase+1))setPhase(phase+1);
if(dx>60&&phase>0)setPhase(phase-1);
}
// Tap (short press, small movement)
else if(!immersiveMode&&dt<300&&Math.abs(dx)<20&&Math.abs(dy)<20){
var tx=e.changedTouches[0].clientX,ty=e.changedTouches[0].clientY;
for(var ni=0;ni<DMN_NODES.length;ni++){
var nd=DMN_NODES[ni],ndx=nd.x*W,ndy=nd.y*H;
var dist2=Math.sqrt((tx-ndx)*(tx-ndx)+(ty-ndy)*(ty-ndy));
if(dist2<W*0.08){if(tappedNode===ni){closeNodePanel();return;}tappedNode=ni;tapFade=1;showNodePanel(ni);
for(var fc=0;fc<DMN_CONNECTIONS.length;fc++){
if(DMN_CONNECTIONS[fc][0]===ni||DMN_CONNECTIONS[fc][1]===ni)fireAP(fc,PH[phase]);}
break;}}
}
setTimeout(function(){mouseX=-1;mouseY=-1;touchActive=false},100);
});

// ═══ BEHAVIORAL TRACKING — nervous system state inference ═══
var immBehavior={
  tapCount:0,          // total taps during experience
  tapTimes:[],         // timestamps of taps (for frequency analysis)
  hotspotsTapped:[],   // which hotspots were explored
  lastInteractionT:0,  // last tap/interaction frame
  exitEarly:false,     // did user exit before completion
  completedFull:false, // ran through entire sequence
  startTime:0,         // when experience started
  totalDuration:0,     // how long they stayed
  freezeEvents:0,      // periods of no interaction > 10s
  escapeAttempts:0     // swipe/scroll attempts during experience
};

function resetBehavior(){
  immBehavior={tapCount:0,tapTimes:[],hotspotsTapped:[],lastInteractionT:0,
    exitEarly:false,completedFull:false,startTime:Date.now(),totalDuration:0,
    freezeEvents:0,escapeAttempts:0};
}

function logTap(){
  immBehavior.tapCount++;
  immBehavior.tapTimes.push(Date.now());
  immBehavior.lastInteractionT=immersiveT;
  // Keep only last 20 taps for frequency analysis
  if(immBehavior.tapTimes.length>20)immBehavior.tapTimes.shift();
}

function getTapFrequency(){
  // Taps per second over last 10 seconds
  var now=Date.now();
  var recent=immBehavior.tapTimes.filter(function(t){return now-t<10000});
  return recent.length/10;
}

// Nervous system state inference
function inferState(){
  var tapFreq=getTapFrequency();
  var silenceSec=(immersiveT-immBehavior.lastInteractionT)/60;
  var totalSec=immersiveT/60;
  var hotspotsExplored=immBehavior.hotspotsTapped.length;
  
  // SYMPATHETIC ACTIVATION — rapid tapping + escape attempts (genuine distress signal)
  if(tapFreq>2.0&&immBehavior.escapeAttempts>2)return 'sympathetic';
  if(tapFreq>3.0)return 'sympathetic';
  // DORSAL VAGAL — frozen: requires EXTENDED silence (60s+), minimal total engagement,
  // AND multiple freeze events detected. Quiet watching is NOT freeze.
  if(silenceSec>60&&immBehavior.tapCount<2&&immBehavior.freezeEvents>1&&totalSec>90)return 'dorsal';
  // VENTRAL VAGAL — engaged, exploring at moderate pace
  if(hotspotsExplored>0&&tapFreq<2.0&&tapFreq>0)return 'ventral';
  // CONTEMPLATIVE — present, watching, absorbing. This is healthy on Phase 0, 4, 7, 9.
  // Not frozen. Not disengaged. Just still.
  if(silenceSec>15&&silenceSec<=60)return 'contemplative';
  // OBSERVING — watching but not yet deeply engaged
  return 'observing';
}

  // [currentPhase][state] → {suggested, reason}

  // ventral = engaged, ready for deeper

function getRouting(fromPhase,state,hotspotsExplored,completedFull){
  // CONTEMPLATIVE or OBSERVING — no routing suggestion. They're present and processing.
  if(state==='contemplative'||state==='observing') return null;
  
  // SYMPATHETIC ACTIVATION — genuine distress signals only
  if(state==='sympathetic'){
    if(fromPhase===3||fromPhase===7)return {phase:4,reason:"Your system is activated. Phase 4 builds the inhibitory architecture to process what you've encountered.",short:"REGULATE FIRST"};
    if(fromPhase===5)return {phase:4,reason:"Hormetic load exceeded. Your parasympathetic system needs restoration before continuing.",short:"RESTORE"};
    if(fromPhase===9)return {phase:4,reason:"Threshold activation is intense. Phase 4 restores baseline before re-approach.",short:"RESTORE BASELINE"};
    return {phase:4,reason:"Sympathetic activation detected. Phase 4 builds parasympathetic capacity.",short:"REGULATE FIRST"};
  }
  
  // DORSAL VAGAL — genuine freeze (requires 60s+ silence, freeze events, minimal engagement)
  if(state==='dorsal'){
    if(fromPhase===3||fromPhase===7||fromPhase===9)return {phase:2,reason:"Your system entered protective shutdown. Phase 2 uses rhythm to gently re-engage.",short:"RECONNECT"};
    return {phase:2,reason:"Extended freeze detected. Phase 2 uses rhythm to re-engage the ventral vagal system.",short:"RECONNECT"};
  }
  
  // POST-EXPERIENCE SUGGESTIONS (after completion)
  if(completedFull){
    if(fromPhase===0)return {phase:1,reason:"You've mapped your default mode. Phase 1 introduces the first disruption — prediction error. Your dACC is ready.",short:"NOTICE THE CRACK"};
    if(fromPhase===1)return {phase:2,reason:"You've seen the anomaly. Phase 2 builds the relational container to hold what comes next.",short:"BUILD THE CONTAINER"};
    if(fromPhase===2)return {phase:3,reason:"Co-regulation established. Your nervous system can now safely approach the shadow.",short:"FACE THE SHADOW"};
    if(fromPhase===3){
      if(hotspotsExplored>0)return {phase:8,reason:"You explored the fear circuit. Phase 8 transforms what you found into empathic data.",short:"TRANSFORM THE DATA"};
      return {phase:4,reason:"You witnessed the darkness. Phase 4 builds the calm that makes integration possible.",short:"BUILD THE CALM"};
    }
    if(fromPhase===4)return {phase:5,reason:"Baseline restored. Your system can now accept controlled stress. Phase 5 builds resilience.",short:"BUILD RESILIENCE"};
    if(fromPhase===5)return {phase:6,reason:"Stress tolerance established. Phase 6 gives structure to what you've endured.",short:"GIVE IT STRUCTURE"};
    if(fromPhase===6)return {phase:7,reason:"Order built. Phase 7 asks: can you let it go? The architecture must dissolve to transform.",short:"LET IT DISSOLVE"};
    if(fromPhase===7)return {phase:9,reason:"The narrative stopped. Phase 9 is the threshold — the binding event cannot be forced. It emerges.",short:"WAIT FOR EMERGENCE"};
    if(fromPhase===8)return {phase:9,reason:"Conscience recalibrated. Phase 9 integrates everything that came before.",short:"APPROACH THE THRESHOLD"};
    if(fromPhase===9)return {phase:10,reason:"The binding occurred. Phase 10 is the return — the same neuron, different wiring.",short:"RETURN CHANGED"};
    if(fromPhase===10)return {phase:0,reason:"The spiral completes. But you are not who you were. Begin again — deeper.",short:"RECURSE"};
  }
  
  // VENTRAL VAGAL — engaged, explored hotspots, exited early. Suggest deeper on same phase.
  if(state==='ventral'&&!completedFull){
    return {phase:fromPhase,reason:"You were engaged but left before completion. Return when ready — the architecture holds.",short:"GO DEEPER"};
  }
  
  // Default: no suggestion. Don't force routing.
  return null;
}

function enterPhaseExperience(){
  if(immersiveMode)return;
  if(!PHASE_EXP[phase])return;// no experience built for this phase yet
  
  immersiveMode=true;
  immersiveT=0;
  immersiveFocusNode=PHASE_EXP[phase].focusNode;
  immersiveZoom=0;
  immActiveInputs=[];
  immAssembledWords=[];
  immLastSeqIdx=-1;
  immHotspots=[];
  immActiveDrawer=null;
  closeDrawer();
  dismissRouting();
  resetBehavior();
  
  // Hide HUD
  hideEnterBtn();
  document.getElementById('plabel').style.opacity='0';
  document.getElementById('nav').style.opacity='0';
  document.getElementById('htl').style.opacity='0';
  document.getElementById('htr').style.opacity='0';
  document.getElementById('hbl').style.opacity='0';
  document.getElementById('hbr').style.opacity='0';
  
  // Show exit button after 5s
  setTimeout(function(){document.getElementById('immersive-exit').classList.add('vis')},5000);
}

function exitPhaseExperience(){
  var wasPhase=phase;
  var state=inferState();
  immBehavior.totalDuration=Date.now()-immBehavior.startTime;
  // Check if they completed the full sequence
  var exp=PHASE_EXP[phase];
  if(exp){
    var lastSeq=exp.sequence[exp.sequence.length-1];
    var elapsed=immersiveT/60;
    immBehavior.completedFull=elapsed>=lastSeq.at-2;
    immBehavior.exitEarly=!immBehavior.completedFull;
  }
  
  immersiveMode=false;
  immersiveZoom=0;
  immHotspots=[];
  closeDrawer();
  
  // Restore HUD
  document.getElementById('plabel').style.opacity='1';
  document.getElementById('nav').style.opacity='1';
  document.getElementById('htl').style.opacity='1';
  document.getElementById('htr').style.opacity='1';
  document.getElementById('hbl').style.opacity='1';
  document.getElementById('hbr').style.opacity='1';
  document.getElementById('immersive-exit').classList.remove('vis');
  document.getElementById('immersive-narration').style.color='rgba(201,169,78,0)';
  document.getElementById('immersive-source').style.color='rgba(201,169,78,0)';
  
  enterTimer=setTimeout(showEnterBtn,2000);
  
  // Show nervous system routing suggestion
  var route=getRouting(wasPhase,state,immBehavior.hotspotsTapped.length,immBehavior.completedFull);
  if(route&&route.phase!==wasPhase){
    setTimeout(function(){showRouting(route)},2500);
  }
}

  var panel=document.getElementById('node-panel');
  document.getElementById('np-title').textContent=nd.name;

  document.getElementById('np-fn').textContent=info.fn;

  // Pop lines

  // Position near the node

  panel.style.top=py+'px';
  panel.classList.add('open');

// Spawn a hotspot when a signal arrives
function spawnHotspot(triggerName){
  var phaseData=HOTSPOT_DATA[phase];
  if(!phaseData)return;
  for(var hi=0;hi<phaseData.length;hi++){
    if(phaseData[hi].trigger===triggerName){
      // Don't duplicate
      for(var eh=0;eh<immHotspots.length;eh++){
        if(immHotspots[eh].trigger===triggerName)return;
      }
      immHotspots.push({
        trigger:triggerName,
        label:phaseData[hi].label,
        angle:phaseData[hi].angle,
        dist:phaseData[hi].dist,
        data:phaseData[hi],
        spawnT:immersiveT,
        pulse:0
      });
      return;
    }
  }
}

// Check hotspot tap
function checkHotspotTap(tapX,tapY,cx,cy,somaR){
  for(var hi=0;hi<immHotspots.length;hi++){
    var hs=immHotspots[hi];
    var hx=cx+Math.cos(hs.angle+Math.sin(immersiveT*0.005+hi)*0.15)*somaR*hs.dist;
    var hy=cy+Math.sin(hs.angle+Math.sin(immersiveT*0.005+hi)*0.15)*somaR*hs.dist;
    var dx=tapX-hx,dy=tapY-hy;
    if(Math.sqrt(dx*dx+dy*dy)<35){
      openDrawer(hs.data);
      return true;
    }
  }
  return false;
}

// Draw immersive experience — called from main draw loop
function drawImmersive(ctx,p,W,H,t){
  var exp=PHASE_EXP[phase];
  if(!exp)return;
  
  var cx=W/2,cy=H/2;
  var aRGB=p.aR+','+p.aG+','+p.aB;
  var elapsed=immersiveT/60;// seconds (approx at 60fps)
  
  // ── ZOOM TRANSITION (first 3 seconds) ──
  if(immersiveZoom<1)immersiveZoom=Math.min(1,immersiveZoom+0.008);
  var zoom=immersiveZoom;
  var easeZoom=zoom*zoom*(3-2*zoom);// smoothstep
  
  // Focus node position
  var fn=DMN_NODES[exp.focusNode];
  var fnx=fn.x*W,fny=fn.y*H;
  
  // ── BACKGROUND: deep space, darker as we go in ──
  var bg=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*0.7);
  bg.addColorStop(0,'rgba('+Math.floor(p.aR*0.04)+','+Math.floor(p.aG*0.04)+','+Math.floor(p.aB*0.04)+',1)');
  bg.addColorStop(1,'rgba(0,0,0,1)');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  
  // ── During zoom: DMN nodes shrink away except focus ──
  if(easeZoom<1){
    for(var ni=0;ni<DMN_NODES.length;ni++){
      if(ni===exp.focusNode)continue;
      var nd=DMN_NODES[ni];
      var nx=nd.x*W,ny=nd.y*H;
      // Nodes drift outward and fade
      var dx=nx-fnx,dy=ny-fny;
      var pushOut=easeZoom*3;
      nx+=dx*pushOut;ny+=dy*pushOut;
      var fadeAlpha=(1-easeZoom)*0.3;
      if(fadeAlpha>0.01){
        ctx.beginPath();ctx.arc(nx,ny,6*(1-easeZoom),0,Math.PI*2);
        ctx.fillStyle='rgba('+aRGB+','+fadeAlpha+')';ctx.fill();
      }
    }
  }
  
  // ── THE SOMA — you are inside it ──
  // Membrane boundary — pulsing circle
  var somaR=Math.min(W,H)*0.3*(0.5+easeZoom*0.5);
  var breathe=Math.sin(immersiveT*0.02)*0.03+1;
  somaR*=breathe;
  
  // Membrane — lipid bilayer ring
  var memAlpha=0.08+easeZoom*0.12;
  // Phase 7: membrane dissolves
  if(phase===7&&elapsed>13)memAlpha*=Math.max(0.05,1-(elapsed-13)/40);
  ctx.beginPath();ctx.arc(cx,cy,somaR,0,Math.PI*2);
  ctx.strokeStyle='rgba('+aRGB+','+memAlpha+')';
  ctx.lineWidth=2+easeZoom*3;
  if(phase===7&&elapsed>25)ctx.setLineDash([8,8+Math.min(20,(elapsed-25)*2)]);
  ctx.stroke();ctx.setLineDash([]);
  // Double membrane
  ctx.beginPath();ctx.arc(cx,cy,somaR+4,0,Math.PI*2);
  ctx.strokeStyle='rgba('+aRGB+','+(memAlpha*0.4)+')';
  ctx.lineWidth=1;ctx.stroke();
  
  // Ion channel pores around membrane
  var poreCount=24;
  for(var pi=0;pi<poreCount;pi++){
    var pa=(pi/poreCount)*Math.PI*2+immersiveT*0.003;
    var px=cx+Math.cos(pa)*somaR;
    var py=cy+Math.sin(pa)*somaR;
    var poreOpen=Math.sin(immersiveT*0.05+pi*2.3)>0.3;
    ctx.beginPath();ctx.arc(px,py,poreOpen?3.5:2,0,Math.PI*2);
    ctx.fillStyle=poreOpen?'rgba('+aRGB+','+(memAlpha*1.5)+')':'rgba(40,40,50,'+(memAlpha)+')';
    ctx.fill();
  }
  
  // ── NUCLEUS at center ──
  var nucR=somaR*0.15;
  var nucGrad=ctx.createRadialGradient(cx,cy,0,cx,cy,nucR);
  nucGrad.addColorStop(0,'rgba(255,255,255,0.12)');
  nucGrad.addColorStop(0.5,'rgba('+aRGB+',0.08)');
  nucGrad.addColorStop(1,'rgba('+aRGB+',0.02)');
  ctx.fillStyle=nucGrad;ctx.beginPath();ctx.arc(cx,cy,nucR,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(cx,cy,nucR,0,Math.PI*2);
  ctx.strokeStyle='rgba('+aRGB+',0.1)';ctx.lineWidth=1;ctx.stroke();
  
  // ── DENDRITES extending outward — your input receivers ──
  if(easeZoom>0.5){
    var dendAlpha=(easeZoom-0.5)*2*0.15;
    var numDendrites=6;
    for(var di=0;di<numDendrites;di++){
      var da=(di/numDendrites)*Math.PI*2+0.3;
      var dLen=somaR*0.8;
      // Main dendrite shaft
      ctx.beginPath();
      ctx.moveTo(cx+Math.cos(da)*somaR*0.1,cy+Math.sin(da)*somaR*0.1);
      var dendEndX=cx+Math.cos(da)*dLen;
      var dendEndY=cy+Math.sin(da)*dLen;
      // Slight curve
      var ctrlX=cx+Math.cos(da+0.2)*dLen*0.6;
      var ctrlY=cy+Math.sin(da+0.2)*dLen*0.6;
      ctx.quadraticCurveTo(ctrlX,ctrlY,dendEndX,dendEndY);
      ctx.strokeStyle='rgba('+aRGB+','+dendAlpha+')';
      ctx.lineWidth=2;ctx.stroke();
      
      // Dendritic spines — tiny protrusions (synaptic receivers)
      var spineCount=8;
      for(var si=0;si<spineCount;si++){
        var st=(si+1)/(spineCount+1);
        var sx=cx+Math.cos(da)*dLen*st+Math.cos(da+0.2)*dLen*st*0.2*(1-st);
        var sy=cy+Math.sin(da)*dLen*st+Math.sin(da+0.2)*dLen*st*0.2*(1-st);
        var spineAngle=da+Math.PI/2*(si%2===0?1:-1)+Math.sin(immersiveT*0.03+si)*0.3;
        var spineLen=4+Math.sin(immersiveT*0.05+si*1.7)*2;
        ctx.beginPath();
        ctx.moveTo(sx,sy);
        ctx.lineTo(sx+Math.cos(spineAngle)*spineLen,sy+Math.sin(spineAngle)*spineLen);
        ctx.strokeStyle='rgba('+aRGB+','+(dendAlpha*0.6)+')';
        ctx.lineWidth=0.8;ctx.stroke();
        // Spine head (bouton)
        ctx.beginPath();
        ctx.arc(sx+Math.cos(spineAngle)*spineLen,sy+Math.sin(spineAngle)*spineLen,1.5,0,Math.PI*2);
        ctx.fillStyle='rgba('+aRGB+','+(dendAlpha*0.5)+')';ctx.fill();
      }
    }
  }
  
  // ── RESTING POTENTIAL — subtle oscillation ──
  // Faint concentric rings pulsing outward from nucleus — membrane potential
  // Phase 7: rings get erratic and fade. Phase 9: rings are absent then BURST
  var rpAlpha=easeZoom*0.04;
  if(phase===7)rpAlpha*=Math.max(0,1-elapsed/45);// dissolving
  if(phase===9&&elapsed<23)rpAlpha=0;// silent until claustrum fires
  if(phase===9&&elapsed>=23)rpAlpha=easeZoom*0.08;// then bright
  for(var rpi=0;rpi<3;rpi++){
    var rpR=(nucR+immersiveT*0.5+rpi*30)%(somaR*0.9);
    var rpFade=1-rpR/(somaR*0.9);
    ctx.beginPath();ctx.arc(cx,cy,rpR,0,Math.PI*2);
    ctx.strokeStyle='rgba('+aRGB+','+(rpAlpha*rpFade)+')';
    ctx.lineWidth=0.5;ctx.stroke();
  }
  
  // ── PHASE 7 SPECIAL: Soma membrane dissolving ──
  if(phase===7&&elapsed>13){
    var dissP=Math.min(1,(elapsed-13)/35);
    // Membrane fragments drifting outward
    for(var di=0;di<Math.floor(dissP*30);di++){
      var dAngle=di*0.618*Math.PI*2+immersiveT*0.002;
      var dDist=somaR*(1+dissP*0.5)+di*3;
      var dx2=cx+Math.cos(dAngle)*dDist;
      var dy2=cy+Math.sin(dAngle)*dDist;
      var dAlpha=(1-dissP)*0.1;
      ctx.beginPath();ctx.arc(dx2,dy2,1.5,0,Math.PI*2);
      ctx.fillStyle='rgba('+aRGB+','+dAlpha+')';ctx.fill();
    }
  }
  
  // ── PHASE 9 SPECIAL: Claustrum broadcast flash ──
  if(phase===9&&elapsed>=28&&elapsed<32){
    var broadP=(elapsed-28)/4;
    var flashR=broadP*Math.max(W,H);
    var flashAlpha=(1-broadP)*0.15;
    ctx.beginPath();ctx.arc(cx,cy,flashR,0,Math.PI*2);
    ctx.strokeStyle='rgba(255,255,200,'+flashAlpha+')';
    ctx.lineWidth=3;ctx.stroke();
    // Inner glow
    var bGrad=ctx.createRadialGradient(cx,cy,0,cx,cy,flashR*0.5);
    bGrad.addColorStop(0,'rgba(255,255,200,'+(flashAlpha*0.3)+')');
    bGrad.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=bGrad;ctx.beginPath();ctx.arc(cx,cy,flashR*0.5,0,Math.PI*2);ctx.fill();
  }
  
  // ── SEQUENCE EVENTS — narration + input signals ──
  var seq=exp.sequence;
  for(var si=0;si<seq.length;si++){
    if(elapsed>=seq[si].at&&si>immLastSeqIdx){
      immLastSeqIdx=si;
      var narrEl=document.getElementById('immersive-narration');
      var srcEl=document.getElementById('immersive-source');
      
      // Fade out then in
      narrEl.style.color='rgba(201,169,78,0)';
      srcEl.style.color='rgba(201,169,78,0)';
      (function(s){setTimeout(function(){
        narrEl.textContent=s.narr;
        srcEl.textContent=s.src;
        if(s.narr)narrEl.style.color='rgba(201,169,78,0.4)';
        if(s.src)srcEl.style.color='rgba(201,169,78,0.45)';
      },400)})(seq[si]);
      
      // Trigger input signal
      if(seq[si].input&&exp.inputs[seq[si].input]){
        var inp=exp.inputs[seq[si].input];
        immActiveInputs.push({
          angle:inp.angle,
          color:inp.color,
          label:inp.label,
          word:seq[si].word,
          startT:immersiveT,
          duration:300,// frames
          arrived:false
        });
        // Spawn floating hotspot for this input
        spawnHotspot(seq[si].input);
      }
      // Word assembly (no input signal, just convergence)
      if(seq[si].word&&!seq[si].input){
        immAssembledWords.push(seq[si].word);
      }
      
      // Auto-exit at end
      if(si===seq.length-1){
        setTimeout(exitPhaseExperience,4000);
      }
    }
  }
  
  // ── DRAW ACTIVE INPUT SIGNALS ──
  for(var ii=immActiveInputs.length-1;ii>=0;ii--){
    var inp=immActiveInputs[ii];
    var inpProgress=(immersiveT-inp.startT)/inp.duration;
    if(inpProgress>1.5){immActiveInputs.splice(ii,1);continue;}
    
    var iR=inp.color[0],iG=inp.color[1],iB=inp.color[2];
    var iRGB=iR+','+iG+','+iB;
    
    if(inpProgress<=1){
      // Signal traveling inward — from edge of screen toward soma
      var startDist=Math.max(W,H)*0.7;
      var endDist=somaR*0.3;
      var currentDist=startDist+(endDist-startDist)*inpProgress*inpProgress;
      var sx=cx+Math.cos(inp.angle)*currentDist;
      var sy=cy+Math.sin(inp.angle)*currentDist;
      
      // Signal packet — bright leading point with trail
      var sigAlpha=Math.sin(inpProgress*Math.PI)*0.9;
      var sigGrad=ctx.createRadialGradient(sx,sy,0,sx,sy,15);
      sigGrad.addColorStop(0,'rgba(255,255,255,'+sigAlpha+')');
      sigGrad.addColorStop(0.3,'rgba('+iRGB+','+(sigAlpha*0.8)+')');
      sigGrad.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=sigGrad;ctx.beginPath();ctx.arc(sx,sy,15,0,Math.PI*2);ctx.fill();
      
      // Core
      ctx.beginPath();ctx.arc(sx,sy,3,0,Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,'+(sigAlpha*0.9)+')';ctx.fill();
      
      // Trail (light)
      for(var tr=1;tr<=4;tr++){
        var tp=Math.max(0,inpProgress-tr*0.03);
        var td=startDist+(endDist-startDist)*tp*tp;
        var tx=cx+Math.cos(inp.angle)*td;
        var ty=cy+Math.sin(inp.angle)*td;
        ctx.beginPath();ctx.arc(tx,ty,2.5-tr*0.4,0,Math.PI*2);
        ctx.fillStyle='rgba('+iRGB+','+(sigAlpha*(1-tr/5)*0.4)+')';ctx.fill();
      }
      
      // Source label — where it's coming from
      if(inpProgress<0.4){
        var labelDist=startDist-40;
        var lx=cx+Math.cos(inp.angle)*labelDist;
        var ly=cy+Math.sin(inp.angle)*labelDist;
        ctx.font='10px monospace';ctx.textAlign='center';
        ctx.fillStyle='rgba('+iRGB+','+(0.4*(1-inpProgress/0.4))+')';
        ctx.fillText(inp.label,lx,ly);
      }
      
      // Arrival flash
      if(inpProgress>0.95&&!inp.arrived){
        inp.arrived=true;
        if(inp.word)immAssembledWords.push(inp.word);
      }
    }
    
    // Post-arrival — soma flash (simple)
    if(inp.arrived){
      var postP=Math.min(1,(inpProgress-1)*2);
      var flashAlpha=(1-postP)*0.1;
      ctx.beginPath();ctx.arc(cx,cy,somaR*0.4,0,Math.PI*2);
      ctx.fillStyle='rgba('+iRGB+','+flashAlpha+')';ctx.fill();
    }
  }
  
  // ── FLOATING HOTSPOTS — tappable content nodes ──
  for(var hi=0;hi<immHotspots.length;hi++){
    var hs=immHotspots[hi];
    var hsAge=(immersiveT-hs.spawnT)/60;
    var fadeIn=Math.min(1,hsAge/2);
    var orbAngle=hs.angle+Math.sin(immersiveT*0.005+hi*1.7)*0.15;
    var hx=cx+Math.cos(orbAngle)*somaR*hs.dist;
    var hy=cy+Math.sin(orbAngle)*somaR*hs.dist;
    var hsAlpha=fadeIn*0.4;
    var hsPulse=0.8+Math.sin(immersiveT*0.04+hi*2.1)*0.2;
    var hsR=8*hsPulse;
    
    // Simple dot + ring (no gradient)
    ctx.beginPath();ctx.arc(hx,hy,hsR*0.6,0,Math.PI*2);
    ctx.fillStyle='rgba(201,169,78,'+hsAlpha+')';ctx.fill();
    ctx.beginPath();ctx.arc(hx,hy,hsR*1.5,0,Math.PI*2);
    ctx.strokeStyle='rgba(201,169,78,'+(hsAlpha*0.4)+')';ctx.lineWidth=1;ctx.stroke();
    
    // Label
    var isMob2=W<600;
    ctx.font=(isMob2?'9':'10')+'px monospace';ctx.textAlign='center';
    ctx.fillStyle='rgba(201,169,78,'+(hsAlpha*0.7)+')';
    ctx.fillText(hs.label,hx,hy+hsR*2+12);
    
    // Portal or content icon
    var phaseData=HOTSPOT_DATA[phase];
    var hsData2=null;
    if(phaseData){for(var pd=0;pd<phaseData.length;pd++){if(phaseData[pd].trigger===hs.trigger)hsData2=phaseData[pd];}}
    var tierIcon=(hsData2&&hsData2.portal)?'⊘ ENTER':'◈';
    ctx.font=(isMob2?'8':'9')+'px monospace';
    ctx.fillStyle='rgba(201,169,78,'+(hsAlpha*0.5)+')';
    ctx.fillText(tierIcon,hx,hy+hsR*2+22);
    
    // Resonance glow on portal hotspots when body is ready
    if(hsData2&&hsData2.portal&&window._bioEngine&&window._bioEngine.fractal){
      var readiness=window._bioEngine.fractal.checkPortalReadiness(phase);
      if(readiness.ready){
        // Breathing glow effect
        var glowPulse=0.3+Math.sin(t*0.004)*0.2;
        ctx.beginPath();ctx.arc(hx,hy,hsR*3,0,Math.PI*2);
        ctx.fillStyle='rgba(201,169,78,'+glowPulse*hsAlpha+')';ctx.fill();
        // "RESONANT" label
        ctx.font=(isMob2?'6':'7')+'px monospace';
        ctx.fillStyle='rgba(201,169,78,'+(hsAlpha*0.6)+')';
        ctx.fillText('RESONANT',hx,hy+hsR*2+34);
      } else if(readiness.resonance>0.5){
        // Subtle ring showing approach to readiness
        var ringAlpha=(readiness.resonance-0.5)*2*0.15*hsAlpha;
        ctx.beginPath();ctx.arc(hx,hy,hsR*2.5,0,Math.PI*2);
        ctx.strokeStyle='rgba(201,169,78,'+ringAlpha+')';ctx.lineWidth=0.5;ctx.stroke();
      }
    }
  }

  // ── ASSEMBLED NARRATIVE — the words you've bound ──
  if(immAssembledWords.length>0){
    var isMob=W<600;
    var wordSize=isMob?Math.round(W*0.038):Math.round(Math.min(20,W*0.025));
    ctx.font='bold '+wordSize+'px monospace';
    ctx.textAlign='center';
    
    if(isMob&&immAssembledWords.length>3){
      // Stack vertically on mobile when many words
      var lineH=wordSize+8;
      var startY=cy+somaR*0.35;
      // Background
      var maxTw=0;
      for(var wi=0;wi<immAssembledWords.length;wi++){
        var tw2=ctx.measureText(immAssembledWords[wi]).width;
        if(tw2>maxTw)maxTw=tw2;
      }
      ctx.fillStyle='rgba(0,0,0,0.5)';
      ctx.fillRect(cx-maxTw/2-16,startY-wordSize-4,maxTw+32,immAssembledWords.length*lineH+12);
      
      for(var wi=0;wi<immAssembledWords.length;wi++){
        var wordAlpha=0.7+Math.sin(immersiveT*0.03+wi)*0.15;
        ctx.fillStyle='rgba('+aRGB+','+wordAlpha+')';
        ctx.fillText(immAssembledWords[wi],cx,startY+wi*lineH);
      }
    }else{
      // Horizontal for few words or desktop
      var wordStr=immAssembledWords.join('  ·  ');
      var tw=ctx.measureText(wordStr).width;
      ctx.fillStyle='rgba(0,0,0,0.5)';
      ctx.fillRect(cx-tw/2-20,cy+somaR*0.4-wordSize-4,tw+40,wordSize+18);
      ctx.fillStyle='rgba('+aRGB+',0.75)';
      ctx.fillText(wordStr,cx,cy+somaR*0.4+5);
    }
  }
  
  // ── REAL-TIME BEHAVIORAL MONITORING ──
  // Check for freeze (no interaction >15s after first 10s)
  if(immersiveT>600&&immBehavior.lastInteractionT>0){
    var silenceFrames=immersiveT-immBehavior.lastInteractionT;
    if(silenceFrames>900&&silenceFrames%900<2)immBehavior.freezeEvents++;
  }
  // Check for genuine distress — show gentle suggestion (only sympathetic/dorsal, after 30s+)
  var state=inferState();
  if((state==='sympathetic'||state==='dorsal')&&immersiveT>1800&&!routingVisible){
    var route=getRouting(phase,state,immBehavior.hotspotsTapped.length,false);
    if(route){
      // Subtle text suggestion at bottom — not intrusive
      ctx.font='10px monospace';ctx.textAlign='center';
      ctx.fillStyle='rgba(201,169,78,0.15)';
      ctx.fillText('YOUR SYSTEM SUGGESTS: PHASE '+route.phase+' · '+route.short,cx,H-20);
    }
  }
  
  // ── SPONTANEOUS FIRING — you fire occasionally ──
  var fireRate=0.5+immAssembledWords.length*0.1;
  var fireCycle=Math.sin(immersiveT*0.01*fireRate);
  if(fireCycle>0.95){
    // Action potential — bright flash from nucleus outward
    var apExpand=(fireCycle-0.95)/0.05;
    var apR=nucR+apExpand*somaR*0.8;
    ctx.beginPath();ctx.arc(cx,cy,apR,0,Math.PI*2);
    ctx.strokeStyle='rgba(255,255,255,'+(0.3*(1-apExpand))+')';
    ctx.lineWidth=2;ctx.stroke();
  }
  
  // ── CYTOPLASM texture ──
  // Faint organic noise inside the soma
  var cytoAlpha=easeZoom*0.015;
  for(var ci=0;ci<40;ci++){
    var cAngle=ci*0.618*Math.PI*2+immersiveT*0.001;
    var cDist=(ci*7.3+immersiveT*0.1)%(somaR*0.85);
    var cx2=cx+Math.cos(cAngle)*cDist;
    var cy2=cy+Math.sin(cAngle)*cDist;
    ctx.beginPath();ctx.arc(cx2,cy2,0.8+Math.sin(ci*3.1)*0.5,0,Math.PI*2);
    ctx.fillStyle='rgba('+aRGB+','+cytoAlpha+')';ctx.fill();
  }
  
  immersiveT++;
}

if(typeof startBiosensorEngine==='function'){
  window._bioEngine=startBiosensorEngine({camera:false,hud:true});
  // Start behavioral tracking immediately (no permissions needed)
  window._bioEngine.start();
  
  // Wire phase transitions to biosensor + navigator
  var _origSetPhase=setPhase;
  setPhase=function(n){
    if(window._bioEngine){
      window._bioEngine.recordPhaseTransition(phase,n);
      window._bioEngine.navigator.setPhase(n,0);
    }
    _origSetPhase(n);
  };
  // Initialize navigator with current phase
  window._bioEngine.navigator.setPhase(phase,0);
  
  // ── FRACTAL API — bridges navigator to spiral rendering ──
  window._bioEngine.fractal={
    pushState:function(phaseNum){
      window._bioEngine.navigator.pushDepth(phaseNum);
    },
    checkPortalReadiness:function(phaseNum){
      var navState=window._bioEngine.navigator.getState();
      var resonance=navState.resonanceAvg;
      var timeMs=navState.timeInPhaseMs;
      var thresh=window._bioEngine.navigator.THRESHOLDS;
      return {
        ready: resonance>thresh.descentResonanceMin*0.9 && timeMs>thresh.descentDurationMs*0.5,
        resonance: resonance,
        intensity: clamp01((resonance-0.5)*2.5),
        timeInPhase: timeMs,
      };
      function clamp01(v){return Math.max(0,Math.min(1,v));}
    }
  };
  
  // ── NAVIGATOR SIGNALS — network behavior + clinical HUD readout ──
  // No center overlay. The NETWORK itself signals navigation state.
  // Clinical readout goes in bottom HUD bar where it belongs.
  
  var navSignal={type:null,intensity:0,startT:0,durationMs:6000};
  
  window._bioEngine.navigator.subscribe(function(suggestion){
    navSignal.type=suggestion.type;
    navSignal.intensity=suggestion.intensity||suggestion.urgency||suggestion.readiness||0.7;
    navSignal.startT=performance.now();
    navSignal.targetPhase=suggestion.targetPhase||null;
    
    // Update bottom-left HUD with clinical nav readout
    var hblEl=document.getElementById('hbl');
    if(hblEl){
      var p2=PH[phase];
      var ac='rgb('+p2.aR+','+p2.aG+','+p2.aB+')';
      var navText='';
      if(suggestion.type==='descent'){
        navText=' · <span style="color:rgba(201,169,78,0.7)">NAV:DESCENT.READY</span>';
      } else if(suggestion.type==='progression'){
        var tgt=suggestion.targetPhase!=null?' →P'+suggestion.targetPhase:'';
        navText=' · <span style="color:rgba(80,200,120,0.6)">NAV:INTEGRATE'+tgt+'</span>';
      } else if(suggestion.type==='regression'){
        var tgt2=suggestion.targetPhase!=null?' →P'+suggestion.targetPhase:'';
        navText=' · <span style="color:rgba(200,80,80,0.6)">NAV:REGRESS'+tgt2+'</span>';
      }
      hblEl.innerHTML='<span style="color:'+ac+'">NODES:'+Math.round(DMN_NODES.length*(1-p2.dissolution))+' CONN:'+Math.round(p2.connectivity*100)+'% FIRE:'+p2.fireRate.toFixed(1)+'Hz</span>'+navText;
      
      // Clear nav text after duration
      setTimeout(function(){
        if(navSignal.type===suggestion.type){
          updateHUD(); // Reset to normal HUD
        }
      },navSignal.durationMs);
    }
    
    // Auto-regress for safety (keep this behavior)
    if(suggestion.type==='regression'){
      if(suggestion.targetDepth<window._bioEngine.navigator.getState().depthLevel){
        setTimeout(function(){
          document.body.style.transition='opacity 1.5s';
          document.body.style.opacity='0';
          setTimeout(function(){history.back()},1600);
        },2500);
      } else if(suggestion.targetPhase<phase){
        setTimeout(function(){setPhase(suggestion.targetPhase)},2500);
      }
    }
  });
  
  // Expose navSignal to draw loop
  window._navSignal=navSignal;
  
  // Add biosensor toggle button
  var bioBtn=document.createElement('div');
  bioBtn.id='bio-toggle';
  bioBtn.innerHTML='⦿ BIO';
  bioBtn.style.cssText='position:fixed;top:12px;right:14px;z-index:500;font-family:monospace;font-size:9px;letter-spacing:2px;color:rgba(201,169,78,0.3);cursor:pointer;padding:6px 8px;border:1px solid rgba(201,169,78,0.1);border-radius:3px;transition:all 0.3s;user-select:none;-webkit-user-select:none;';
  
  var bioLastTap=0;
  bioBtn.addEventListener('click',function(){
    var now=Date.now();
    // Double-tap: pair BLE device
    if(now-bioLastTap<400){
      window._bioEngine.enableBLE().then(function(r){
        if(r.success){
          bioBtn.innerHTML='♡ '+r.device;
          bioBtn.style.color='rgba(80,200,80,0.7)';
          bioBtn.style.borderColor='rgba(80,200,80,0.3)';
        } else {
          // Briefly flash the error
          bioBtn.innerHTML='⦿ '+(r.error||'').substring(0,20);
          setTimeout(function(){bioBtn.innerHTML='⦿ BIO'},2000);
        }
      });
      bioLastTap=0;
      return;
    }
    bioLastTap=now;
    
    // Single tap: toggle HUD
    setTimeout(function(){
      if(Date.now()-bioLastTap<350) return; // Wait to see if double-tap
    },350);
    var hud=window._bioEngine.hud;
    hud.toggle();
    var isVisible=document.getElementById('biosensor-hud')&&document.getElementById('biosensor-hud').style.opacity==='1';
    bioBtn.style.color=isVisible?'rgba(201,169,78,0.7)':'rgba(201,169,78,0.3)';
    bioBtn.style.borderColor=isVisible?'rgba(201,169,78,0.3)':'rgba(201,169,78,0.1)';
  });
  
  // Long press to enable camera
  var bioLongPress=null;
  bioBtn.addEventListener('touchstart',function(e){
    bioLongPress=setTimeout(async function(){
      var result=await window._bioEngine.enableCamera();
      if(result.success){
        bioBtn.innerHTML='📷 BIO';
        bioBtn.style.color='rgba(80,200,80,0.6)';
      }
    },1500);
  },{passive:true});
  bioBtn.addEventListener('touchend',function(){clearTimeout(bioLongPress);},{passive:true});
  document.body.appendChild(bioBtn);
}
</script>
</body>
</html>
