// Loads company-index.json once, builds ticker→{cik,slug,name} map
var _cikMap = {};    // TICKER → { cik, slug, name }
var _cikReady = false;

(function _loadCompanyIndex() {
  var xhr = new XMLHttpRequest();
  xhr.open('GET', 'assets/data/company-index.json', true);
  xhr.onload = function() {
    if (xhr.status === 200) {
      try {
        var idx = JSON.parse(xhr.responseText);
        var byTicker = idx.byTicker || {};
        var companies = idx.companies || {};
        for (var ticker in byTicker) {
          var slug = byTicker[ticker];
          var co = companies[slug];
          if (co && co.cik) {
            _cikMap[ticker] = { cik: co.cik, slug: slug, name: co.name };
          }
        }
        _cikReady = true;
        console.log('[Opportunities] CIK map loaded: ' + Object.keys(_cikMap).length + ' tickers');
      } catch (e) { console.warn('[Opportunities] CIK map parse error:', e); }
    }
  };
  xhr.onerror = function() { console.warn('[Opportunities] CIK map load failed'); };
  xhr.send();
})();

// Lookup: returns { cik, slug, name } or null
function _lookupCIK(ticker) {
  if (!ticker || ticker === 'N/A') return null;
  return _cikMap[ticker.toUpperCase()] || null;

// ═══ DATA QUALITY ═══

function _getDataQuality(domainKeys, doms) {
  var totalSources = 0;
  var liveSources = 0;
  for (var i = 0; i < domainKeys.length; i++) {
    var d = doms[domainKeys[i]];
    if (!d || !d.sources) continue;
    for (var j = 0; j < d.sources.length; j++) {
      totalSources++;
      if (d.sources[j].live) liveSources++;
    }
  }
  if (totalSources === 0) return { live: 0, total: 0, label: 'NO DATA', color: '#e85454' };
  var ratio = liveSources / totalSources;
  var label = liveSources + '/' + totalSources + ' LIVE';
  var color = ratio >= 0.75 ? '#5ab5a0' : ratio >= 0.5 ? '#C9A94E' : '#e85454';
  if (ratio === 0) label = 'FALLBACK ONLY';
  return { live: liveSources, total: totalSources, label: label, color: color };
}

function _fetchOppExposure() {
  fetch('/api/paper-positions')
    .then(function(r) { return r.ok ? r.json() : null; })
    .then(function(data) {
      if (data && data.positions) {
        for (var i = 0; i < data.positions.length; i++) {
          _oppPaperPositions[data.positions[i].symbol] = data.positions[i];
        }
      }
    })
    .catch(function() {});

  fetch('/api/paper-orders?status=all&limit=50')
    .then(function(r) { return r.ok ? r.json() : null; })
    .then(function(data) {
      if (data && data.orders) {
        for (var i = 0; i < data.orders.length; i++) {
          var o = data.orders[i];
          if (!_oppPaperOrders[o.symbol]) _oppPaperOrders[o.symbol] = o;
        }
      }
      _oppExposureFetched = true;
      if (window.LIMENPortfolioContext) {
        _oppPortfolio = window.LIMENPortfolioContext.analyzePortfolio(_oppPaperPositions, _oppPaperOrders);
      }
      if (_hasRendered) render(); // re-render with badges
    })
    .catch(function() { _oppExposureFetched = true; });
}

function _getOppExposureBadge(pbId) {
  if (!_oppExposureFetched) return '';
  var tickers = _OPP_INVEST_TICKERS[pbId];
  if (!tickers) return '';
  var badges = [];
  for (var i = 0; i < tickers.length; i++) {
    var t = tickers[i];
    var pos = _oppPaperPositions[t];
    var ord = _oppPaperOrders[t];
    if (pos && Number(pos.qty) > 0) {
      badges.push('<span style="font-size:0.36rem;padding:1px 5px;background:rgba(201,169,78,0.1);border:1px solid rgba(201,169,78,0.15);border-radius:2px;color:#C9A94E">' + t + ': ' + pos.qty + ' sh</span>');
    } else if (ord && (ord.status === 'new' || ord.status === 'accepted' || ord.status === 'pending_new')) {
      badges.push('<span style="font-size:0.36rem;padding:1px 5px;background:rgba(74,143,212,0.1);border:1px solid rgba(74,143,212,0.15);border-radius:2px;color:#4a8fd4">' + t + ': pending</span>');
    } else if (ord && ord.status === 'filled') {
      badges.push('<span style="font-size:0.36rem;padding:1px 5px;background:rgba(150,150,150,0.06);border:1px solid rgba(150,150,150,0.1);border-radius:2px;color:#888">' + t + ': traded</span>');
    }
  }
  if (badges.length === 0) return '';
  return '<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:4px">' + badges.join('') + '</div>';
}

function _activateOpportunities() {
  var doms = window.LIMENDomains || {};
  var cd = (window.LIMENCrossDomain && window.LIMENCrossDomain.active) ? window.LIMENCrossDomain.active : [];
  var cdPatterns = {};
  for (var ci = 0; ci < cd.length; ci++) {
    if (cd[ci].patternId) cdPatterns[cd[ci].patternId] = cd[ci];
    if (cd[ci].id) cdPatterns[cd[ci].id] = cd[ci];
    if (cd[ci].pattern) cdPatterns[cd[ci].pattern] = cd[ci];
  }

  // Domain filter: if ?domain= is set, only include playbooks touching that domain
  var domainFilter = _DOMAIN_FILTER;
  var domainSK = domainFilter ? (window.LIMENDomainIdentity ? window.LIMENDomainIdentity.snapshotKey(domainFilter) : domainFilter) : null;

  var active = [];

  for (var i = 0; i < PLAYBOOKS.length; i++) {
    var pb = PLAYBOOKS[i];

    // Apply domain filter
    if (domainFilter && pb.domains) {
      var domainMatch = false;
      for (var dfi = 0; dfi < pb.domains.length; dfi++) {
        var pbd = pb.domains[dfi];
        if (pbd === domainFilter || pbd === domainSK || pbd === 'infrastructure' && domainFilter === 'infrastructure') { domainMatch = true; break; }
      }
      if (!domainMatch) continue;
    }
    var dominated = pb.domains;
    var isActive = false;
    var confidence = 0;
    var urgency = 'low';
    var whyNow = '';

    if (pb.pattern && cdPatterns[pb.pattern]) {
      // Cross-domain pattern is firing
      var pat = cdPatterns[pb.pattern];
      isActive = true;
      confidence = Math.round((pat.confidence || 0.5) * 100);
      urgency = (pat.severity || 0) > 0.65 ? 'high' : (pat.severity || 0) > 0.4 ? 'medium' : 'low';
      var stresses = (pat.stresses || []).map(function(s){return s.toFixed(2)});
      whyNow = (pat.domains || []).join(' + ') + ' stress: ' + stresses.join(', ');
      // Add source detail
      for (var di = 0; di < (pat.domains || []).length; di++) {
        var dd = doms[pat.domains[di]];
        if (dd && dd.sources) {
          for (var si = 0; si < dd.sources.length; si++) {
            if (dd.sources[si].live && dd.sources[si].label) {
              whyNow += ' \u00b7 ' + dd.sources[si].label;
              break;
            }
          }
        }
      }
    } else if (pb.id === 'data_infra') {
      // Special: count degraded domains
      var degraded = 0;
      for (var dk in doms) { if (doms[dk].status === 'PARTIAL' || doms[dk].status === 'FALLBACK') degraded++; }
      if (degraded >= 3) {
        isActive = true;
        confidence = Math.min(90, degraded * 15);
        urgency = degraded >= 5 ? 'high' : 'medium';
        whyNow = degraded + ' domains degraded or in fallback';
      }
    } else if (pb.id === 'treatment_gap') {
      // Special: scan for evidence gaps
      var ar = window.LIMENAnalystReport;
      if (ar && ar.domains) {
        for (var ari = 0; ari < ar.domains.length; ari++) {
          var ard = ar.domains[ari];
          if ((ard.evidenceScore || 0) >= 0.5 && (ard.treatmentCount || 0) <= 3 && (ard.diagnosticCount || 0) >= 2 && (ard.stress || 0) > 0.35) {
            isActive = true;
            confidence = Math.round((ard.evidenceScore || 0) * 100);
            urgency = ard.stress > 0.65 ? 'high' : 'medium';
            whyNow = (ard.label || ard.domainId) + ': ' + ard.diagnosticCount + ' diagnoses, only ' + ard.treatmentCount + ' treatments';
            break;
          }
        }
      }
    } else {
      // Generic: check if relevant domains are stressed (threshold 0.20 post-normalization)
      var anyStressed = false;
      var topStress = 0;
      var topSrc = '';
      for (var dj = 0; dj < dominated.length; dj++) {
        var dd2 = doms[dominated[dj]];
        if (dd2 && dd2.stress > 0.20) {
          anyStressed = true;
          if (dd2.stress > topStress) {
            topStress = dd2.stress;
            topSrc = '';
            if (dd2.sources) {
              for (var sk = 0; sk < dd2.sources.length; sk++) {
                if (dd2.sources[sk].live && dd2.sources[sk].label) { topSrc = dd2.sources[sk].label; break; }
              }
            }
            if (!topSrc && dd2.signals && dd2.signals.length > 0) {
              topSrc = typeof dd2.signals[0] === 'string' ? dd2.signals[0] : (dd2.signals[0].label || '');
            }
          }
        }
      }
      if (anyStressed) {
        isActive = true;
        confidence = Math.round(Math.min(topStress * 100, 90));
        urgency = topStress > 0.65 ? 'high' : topStress > 0.4 ? 'medium' : 'low';
        whyNow = topSrc || (dominated[0] + ' stress ' + topStress.toFixed(2));
      }
    }

    var quality = _getDataQuality(dominated[0] === 'any' ? Object.keys(doms) : dominated, doms);

    if (isActive) {
      // Downgrade confidence if data quality is poor
      if (quality.live === 0 && quality.total > 0) confidence = Math.min(confidence, 20);
      active.push({
        pb: pb,
        confidence: confidence,
        urgency: urgency,
        whyNow: whyNow,
        status: 'active',
        quality: quality
      });
    } else {
      active.push({
        pb: pb,
        confidence: 0,
        urgency: 'watching',
        whyNow: 'Monitoring \u2014 triggers not yet met',
        status: 'watching',
        quality: quality
      });
    }
  }

  // Debug: log activation results
  console.log('[Opportunities] Activation results:', {
    totalPlaybooks: PLAYBOOKS.length,
    activeCount: active.length,
    domainCount: Object.keys(doms).length,
    crossDomainPatterns: cd.length,
    hasAnalystReport: !!(window.LIMENAnalystReport && window.LIMENAnalystReport.domains),
    activeTitles: active.map(function(a){ return a.pb.title })
  });

  // Sort: active first (high > medium > low), then watching
  var uOrder = {high:0,medium:1,low:2,watching:3};
  active.sort(function(a,b) {
    var ua = uOrder[a.urgency] !== undefined ? uOrder[a.urgency] : 9;
    var ub = uOrder[b.urgency] !== undefined ? uOrder[b.urgency] : 9;
    if (ua !== ub) return ua - ub;
    return b.confidence - a.confidence;
  });

  return active;
}

// ═══ CONNECTOME BAR FOR CARDS ═══

function _renderConnectomeBar(opp) {
  if (!opp.connectome || opp.connectome.nodeCount === 0) return '';
  var c = opp.connectome;
  var sourceColor = c.source === 'CONNECTOME' ? '#5ab5a0' : '#666';

  var html = '<div style="margin-top:6px;padding:6px 10px;background:rgba(201,169,78,0.03);border:1px solid rgba(201,169,78,0.06);border-radius:2px;font-size:0.38rem">';

  // Row 1: source tag + node count + cross-domain
  html += '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:#888;margin-bottom:3px">';
  html += '<span style="color:' + sourceColor + ';letter-spacing:1px">' + c.source + '</span>';
  html += '<span>' + c.totalActivated + ' node' + (c.totalActivated > 1 ? 's' : '') + '</span>';
  if (c.crossDomainNodes > 0) html += '<span style="color:#C9A94E">' + c.crossDomainNodes + ' cross-domain</span>';
  html += '</div>';

  // Row 2: top nodes with their primary role (much more informative than bare IDs)
  if (c.nodes && c.nodes.length > 0) {
    html += '<div style="display:flex;gap:6px;flex-wrap:wrap">';
    for (var ni = 0; ni < Math.min(c.nodes.length, 3); ni++) {
      var nd = c.nodes[ni];
      var ndColor = nd.crossDomain ? '#C9A94E' : '#888';
      var ndRole = nd.roles && nd.roles[0] ? nd.roles[0] : '';
      html += '<span style="color:' + ndColor + '">' + nd.id;
      if (ndRole) html += ' <span style="color:#555;font-size:0.34rem">' + ndRole + '</span>';
      html += '</span>';
    }
    if (c.nodes.length > 3) html += '<span style="color:#555">+' + (c.nodes.length - 3) + '</span>';
    html += '</div>';
  }

  // Row 3: feed context — which domains are stressed and how much
  if (c.feedContext) {
    var fcKeys = Object.keys(c.feedContext);
    if (fcKeys.length > 0) {
      html += '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:3px">';
      for (var fi = 0; fi < fcKeys.length; fi++) {
        var fk = fcKeys[fi];
        var fv = c.feedContext[fk];
        var stColor = fv.stress > 0.65 ? '#e85454' : fv.stress > 0.4 ? '#C9A94E' : '#666';
        html += '<span style="color:' + stColor + '">' + fk.toUpperCase() + ' ' + (fv.stress * 100).toFixed(0) + '%</span>';
      }
      html += '</div>';
    }
  }

  html += '</div>';
  return html;
}

// Build "why this surfaced" explanation from connectome + feed data
function _buildWhySurfaced(opp) {
  if (!opp.connectome || opp.connectome.nodeCount === 0) return '';
  var c = opp.connectome;
  var parts = [];

  // Which domains triggered
  if (c.feedContext) {
    var stressedDoms = [];
    for (var dk in c.feedContext) {
      if (c.feedContext[dk].stress >= 0.35) stressedDoms.push(dk.toUpperCase() + ' (' + (c.feedContext[dk].stress * 100).toFixed(0) + '%)');
    }
    if (stressedDoms.length > 0) parts.push('Stressed domains: ' + stressedDoms.join(', '));
  }

  // Top responsible nodes
  if (c.nodes && c.nodes.length > 0) {
    var topNodeDesc = c.nodes.slice(0, 2).map(function(n) {
      return n.id + (n.roles && n.roles[0] ? ' (' + n.roles[0] + ')' : '');
    });
    parts.push('Key nodes: ' + topNodeDesc.join(', '));
  }

  // Business relevance
  if (c.businessMappings && c.businessMappings.length > 0) {
    var sectors = c.businessMappings.slice(0, 2).map(function(bm) { return bm.role; });
    parts.push('Sector relevance: ' + sectors.join(', '));
  }

  if (parts.length === 0) return '';
  return '<div style="margin-top:4px;font-size:0.36rem;color:#666;line-height:1.5">' + parts.join(' \u00b7 ') + '</div>';
}

// ── LEGITIMACY METRICS (always visible on every card) ──────────────────────

function _computeLegitimacy(o) {
  var pb = o.pb;
  var doms = window.LIMENDomains || {};
  var quality = o.quality || { live: 0, total: 0 };

  // Signal Integrity
  var sigInt = 'INFERRED';
  if (quality.live > 0 && quality.total > 0) {
    var ratio = quality.live / quality.total;
    if (ratio >= 0.75) sigInt = 'LIVE';
    else if (ratio >= 0.5) sigInt = 'PARTIAL';
  }
  if (quality.total === 0) sigInt = 'SIMULATED';

  // Entity Support — check if playbook has CIK-backed companies in examples or tickers
  var tickers = _OPP_INVEST_TICKERS[pb.id] || [];
  var entSupport = 'NONE';
  if (tickers.length > 0 && pb.examples && pb.examples.length > 0) entSupport = 'MAPPED';
  else if (pb.examples && pb.examples.length > 0) entSupport = 'PARTIAL';

  // Market Timing — use market stress triage if available
  var mkt = window.LIMENMarketStressTriage;
  var timing = 'EARLY';
  if (mkt) {
    var combined = mkt.combined || 0;
    var mode = mkt.mode || 'neutral';
    if (mode === 'opportunity' || (combined < 0.30 && o.status === 'active')) timing = 'ALIGNED';
    else if (combined > 0.60 || mode === 'defensive') timing = 'CONFLICTED';
    else timing = 'EARLY';
  } else {
    timing = o.status === 'active' ? 'EARLY' : 'EARLY';
  }

  // Invalidation Risk — based on data quality + confidence spread
  var invalidation = 'UNKNOWN';
  if (o.status === 'watching') {
    invalidation = 'UNKNOWN';
  } else if (sigInt === 'SIMULATED' || quality.live === 0) {
    invalidation = 'HIGH';
  } else if (o.confidence < 40 || sigInt === 'INFERRED') {
    invalidation = 'MED';
  } else if (o.confidence >= 60 && sigInt === 'LIVE') {
    invalidation = 'LOW';
  } else {
    invalidation = 'MED';
  }

  return { signalIntegrity: sigInt, entitySupport: entSupport, marketTiming: timing, invalidationRisk: invalidation };
}

function _buildLegitimacyMetrics(o) {
  var m = _computeLegitimacy(o);
  var colors = {
    LIVE:'#5ab5a0', PARTIAL:'#C9A94E', INFERRED:'#888', SIMULATED:'#e85454',
    NONE:'#e85454', MAPPED:'#5ab5a0',
    ALIGNED:'#5ab5a0', EARLY:'#C9A94E', CONFLICTED:'#e85454',
    LOW:'#5ab5a0', MED:'#C9A94E', HIGH:'#e85454', UNKNOWN:'#555'
  };
  var h = '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;padding-top:6px;border-top:1px solid rgba(201,169,78,0.06)">';
  h += '<span style="font-size:0.3rem;letter-spacing:1px;color:' + (colors[m.signalIntegrity]||'#888') + '">SIG:' + m.signalIntegrity + '</span>';
  h += '<span style="font-size:0.3rem;letter-spacing:1px;color:' + (colors[m.entitySupport]||'#888') + '">ENT:' + m.entitySupport + '</span>';
  h += '<span style="font-size:0.3rem;letter-spacing:1px;color:' + (colors[m.marketTiming]||'#888') + '">MKT:' + m.marketTiming + '</span>';
  h += '<span style="font-size:0.3rem;letter-spacing:1px;color:' + (colors[m.invalidationRisk]||'#888') + '">INV:' + m.invalidationRisk + '</span>';
  h += '</div>';
  return h;
}

// ── PIPELINE VERDICT (always visible) ──────────────────────────────────────

function _buildPipelineVerdict(o) {
  var m = _computeLegitimacy(o);
  var verdict, color;

  if (o.status === 'watching') {
    verdict = 'MONITORING'; color = '#555';
  } else if (o.confidence >= 60 && m.signalIntegrity === 'LIVE' && m.invalidationRisk === 'LOW') {
    verdict = 'HIGH POTENTIAL'; color = '#5ab5a0';
  } else if (o.confidence >= 35 && (m.signalIntegrity === 'LIVE' || m.signalIntegrity === 'PARTIAL')) {
    verdict = 'DEVELOPING'; color = '#C9A94E';
  } else {
    verdict = 'SPECULATIVE'; color = '#888';
  }

  return '<div style="margin-top:4px;font-size:0.34rem;letter-spacing:2px;color:' + color + '">' + verdict + '</div>';
}

// ── INTERNAL ACTION SIGNAL (internal mode only) ───────────────────────────

function _computeActionSignal(o) {
  if (o.status === 'watching') return { signal: 'HOLD', color: '#555' };
  var m = _computeLegitimacy(o);

  // Language control: NEVER imply certainty when data is weak
  if (m.invalidationRisk === 'HIGH' || m.marketTiming === 'CONFLICTED') {
    return { signal: 'HOLD', color: '#888' };
  }
  if (m.signalIntegrity === 'SIMULATED' || m.entitySupport === 'NONE') {
    return { signal: 'EXPLORE', color: '#C9A94E' };
  }
  if (o.confidence >= 60 && m.signalIntegrity === 'LIVE' && m.invalidationRisk === 'LOW' && m.marketTiming !== 'CONFLICTED') {
    return { signal: 'ACT NOW', color: '#5ab5a0' };
  }
  if (o.confidence >= 40 && m.signalIntegrity !== 'SIMULATED') {
    return { signal: 'STAGE', color: '#4a8fd4' };
  }
  return { signal: 'EXPLORE', color: '#C9A94E' };
}

// Reads pathway weights from localStorage (written by console-clarity outcome loop).
// Applies same hub-specificity + direct/transfer logic as console-clarity.

var _OPP_PATHWAY_MAP = {
  energy: ['THAL','dlPFC','BLA'], health: ['NTS','AI','HIPP'],
  finance: ['BLA','vmPFC','NAcc'], technology: ['dlPFC','THAL','BDNF'],
  defense: ['BLA','PAG','dACC'], environment: ['NTS','THAL','AI'],
  education: ['HIPP','PCC','DMN'], governance: ['dlPFC','dACC','mPFC'],
  industry: ['THAL','dlPFC','GP'], trade: ['THAL','dlPFC','NAcc']
};
var _OPP_HUB_FREQ = {};
(function() {
  for (var d in _OPP_PATHWAY_MAP) {
    for (var i = 0; i < _OPP_PATHWAY_MAP[d].length; i++) {
      _OPP_HUB_FREQ[_OPP_PATHWAY_MAP[d][i]] = (_OPP_HUB_FREQ[_OPP_PATHWAY_MAP[d][i]] || 0) + 1;
    }
  }
})();

function _oppOutcomeFactor(domains) {
  var weights;
  try { weights = JSON.parse(localStorage.getItem('limen_pathway_weights') || '{}'); } catch(e) { return 1.0; }
  var domain = domains && domains[0] ? domains[0] : '';
  var nodes = _OPP_PATHWAY_MAP[domain];
  if (!nodes) return 1.0; // unmapped = no adjustment
  var nodeFactors = [];
  for (var i = 0; i < nodes.length; i++) {
    var w = weights[nodes[i]];
    if (!w || !w.total) continue;
    var raw = w.factor;
    var isDirect = w.domains && w.domains[domain];
    if (isDirect) {
      nodeFactors.push(raw);
    } else {
      var spec = 1 / Math.sqrt(_OPP_HUB_FREQ[nodes[i]] || 1);
      nodeFactors.push(1.0 + (raw - 1.0) * spec);
    }
  }
  if (nodeFactors.length === 0) return 1.0;
  nodeFactors.sort(function(a, b) { return Math.abs(b - 1.0) - Math.abs(a - 1.0); });
  var anchor = nodeFactors[0];
  if (nodeFactors.length === 1) return Math.max(0.8, Math.min(1.2, anchor));
  var restSum = 0;
  for (var j = 1; j < nodeFactors.length; j++) restSum += nodeFactors[j];
  var blended = anchor * 0.6 + (restSum / (nodeFactors.length - 1)) * 0.4;
  return Math.max(0.8, Math.min(1.2, blended));
}

      if (co.ticker !== 'N/A') h += '<span style="color:#C9A94E;margin-right:4px">' + co.ticker + '</span>';
      h += co.name;
      if (_cik && _cik !== 'ETF') {
        h += ' <a href="company-portal.html?company=' + (_slug || '') + '" style="font-size:0.26rem;color:rgba(90,181,160,0.5);text-decoration:none" title="Open company portal">CIK:' + _cik + '</a>';
      } else if (_cik === 'ETF' || co.cik === 'ETF') {
        h += ' <span style="font-size:0.26rem;color:#807868">ETF</span>';
      }
      h += ' <span style="font-size:0.26rem;color:' + supColor + '">' + co.support + '</span>';
      h += '</div>';
    }
    h += '</div>';
  } else if (pb.examples && pb.examples.length > 0) {
    h += '<div style="margin-bottom:6px">';
    h += '<div style="font-size:0.3rem;letter-spacing:1.5px;color:#9a9080;margin-bottom:3px">TARGET ENTITIES</div>';
    for (var ei = 0; ei < Math.min(pb.examples.length, 3); ei++) {
      h += '<div style="font-size:0.36rem;color:#c0b8a5;padding:1px 0">' + pb.examples[ei] + ' <span style="font-size:0.26rem;color:#908878">UNVERIFIED</span></div>';
    }
    h += '</div>';
  }

  // B. FAST ENTRY PATH
  var fastPaths = _FAST_ENTRY[type] || _FAST_ENTRY.build;
  h += '<div style="margin-bottom:6px">';
  h += '<div style="font-size:0.3rem;letter-spacing:1.5px;color:#9a9080;margin-bottom:3px">48H ENTRY</div>';
  for (var fi = 0; fi < fastPaths.length; fi++) {
    h += '<div style="font-size:0.36rem;padding:2px 0;border-left:2px solid rgba(201,169,78,0.08);padding-left:6px">';
    h += '<span style="color:rgba(220,215,200,0.7)">' + fastPaths[fi].action + '</span>';
    h += '<span style="color:#908878;font-size:0.3rem;margin-left:6px">' + fastPaths[fi].detail + '</span>';
    h += '</div>';
  }
  h += '</div>';

  // C. MONEY PATH
  var moneyPaths = _MONEY_PATHS[type] || _MONEY_PATHS.build;
  h += '<div style="margin-bottom:6px">';
  h += '<div style="font-size:0.3rem;letter-spacing:1.5px;color:#9a9080;margin-bottom:3px">MONEY PATH</div>';
  for (var mi = 0; mi < moneyPaths.length; mi++) {
    h += '<div style="font-size:0.36rem;color:#d8d0c0;padding:1px 0">';
    h += moneyPaths[mi].path + ' <span style="font-size:0.3rem;color:#908878">' + moneyPaths[mi].label + '</span>';
    h += '</div>';
  }
  h += '<div style="font-size:0.26rem;color:#706860;letter-spacing:1px;margin-top:2px">INTERNAL \u00b7 UNVERIFIED</div>';
  h += '</div>';

  // D. WHY NOW (SYSTEM SIGNAL)
  h += '<div>';
  h += '<div style="font-size:0.3rem;letter-spacing:1.5px;color:#9a9080;margin-bottom:3px">WHY NOW</div>';
  var whyParts = [];
  // Domain stress
  for (var di = 0; di < pb.domains.length; di++) {
    var dd = doms[pb.domains[di]];
    if (dd && dd.stress > 0.2) {
      whyParts.push(pb.domains[di].toUpperCase() + ' ' + (dd.stress * 100).toFixed(0) + '%');
    }
  }
  if (whyParts.length > 0) {
    h += '<div style="font-size:0.36rem;color:#d8d0c0">Stress: ' + whyParts.join(' + ') + '</div>';
  }
  // Timing
  h += '<div style="font-size:0.36rem;color:rgba(220,215,200,0.5)">Timing: ' + m.marketTiming + ' \u00b7 Signal: ' + m.signalIntegrity + '</div>';
  // Cross-domain
  if (o.whyNow && o.whyNow.indexOf('+') !== -1) {
    h += '<div style="font-size:0.36rem;color:rgba(201,169,78,0.5)">Cross-domain: ' + o.whyNow.split('\u00b7')[0].trim() + '</div>';
  }
  h += '</div>';

  h += '</div>';
  return h;
}

function _buildExecutionBlock(o) {
  var pb = o.pb;
  var paths = _EXECUTION_PATHS[pb.id];
  var action = _computeActionSignal(o);
  var m = _computeLegitimacy(o);

  var h = '<div style="margin-top:8px;padding:8px 10px;border:1px solid rgba(201,169,78,0.08);background:rgba(0,0,0,0.15);border-radius:3px">';

  // Internal action signal
  h += '<div style="display:flex;align-items:baseline;gap:8px;margin-bottom:6px">';
  h += '<span style="font-size:0.42rem;letter-spacing:2px;color:' + action.color + ';font-weight:bold">' + action.signal + '</span>';
  h += '<span style="font-size:0.28rem;letter-spacing:1px;color:#807868">INTERNAL \u00b7 RECURSIVE ENGINE</span>';
  h += '</div>';

  if (!paths) {
    h += '<div style="font-size:0.34rem;color:#555;letter-spacing:1px">No execution paths defined for this playbook</div>';
    h += '</div>';
    return h;
  }

  // A. INVEST PATH
  if (paths.invest && paths.invest.length > 0) {
    h += '<div style="margin-bottom:6px">';
    h += '<div style="font-size:0.32rem;letter-spacing:1.5px;color:rgba(201,169,78,0.4);margin-bottom:2px">INVEST PATH</div>';
    for (var i = 0; i < paths.invest.length; i++) {
      var co = paths.invest[i];
      var supColor = co.support === 'MAPPED' ? '#5ab5a0' : '#888';
      h += '<div style="font-size:0.38rem;color:#bbb;padding:1px 0">';
      h += co.name;
      if (co.ticker !== 'N/A') h += ' <span style="color:#C9A94E">(' + co.ticker + ')</span>';
      h += ' <span style="font-size:0.28rem;color:' + supColor + '">' + co.support + '</span>';
      h += '</div>';
    }
    h += '</div>';
  }

  // B. BUILD PATH
  if (paths.build) {
    h += '<div style="margin-bottom:6px">';
    h += '<div style="font-size:0.32rem;letter-spacing:1.5px;color:rgba(201,169,78,0.4);margin-bottom:2px">BUILD PATH</div>';
    h += '<div style="font-size:0.36rem;color:#bbb">' + paths.build.model + '</div>';
    h += '<div style="font-size:0.32rem;color:#888">Pays: ' + paths.build.pays + '</div>';
    // Language control: downgrade "why now" if data is weak
    var whyLabel = (m.signalIntegrity === 'SIMULATED' || m.invalidationRisk === 'HIGH')
      ? 'Hypothesis: ' + paths.build.whyNow
      : 'Why now: ' + paths.build.whyNow;
    h += '<div style="font-size:0.32rem;color:#888">' + whyLabel + '</div>';
    h += '</div>';
  }

  // C. FUND PATH
  if (paths.fund && paths.fund.length > 0) {
    h += '<div style="margin-bottom:6px">';
    h += '<div style="font-size:0.32rem;letter-spacing:1.5px;color:rgba(201,169,78,0.4);margin-bottom:2px">FUND PATH</div>';
    h += '<div style="font-size:0.28rem;color:#807868;margin-bottom:2px">POTENTIAL SOURCES \u2014 NOT VERIFIED</div>';
    for (var f = 0; f < paths.fund.length; f++) {
      h += '<div style="font-size:0.34rem;color:#888;padding:1px 0">\u2022 ' + paths.fund[f] + '</div>';
    }
    h += '</div>';
  }

  // D. STRUCTURE PATH
  if (paths.structure && paths.structure.length > 0) {
    h += '<div style="margin-bottom:4px">';
    h += '<div style="font-size:0.32rem;letter-spacing:1.5px;color:rgba(201,169,78,0.4);margin-bottom:2px">STRUCTURE PATH</div>';
    h += '<div style="font-size:0.28rem;color:#807868;margin-bottom:2px">OPTIONS \u2014 USER RESPONSIBILITY</div>';
    for (var s = 0; s < paths.structure.length; s++) {
      h += '<div style="font-size:0.34rem;color:#888;padding:1px 0">\u2022 ' + paths.structure[s] + '</div>';
    }
    h += '</div>';
  }

  h += '</div>';
  return h;
}

window.toggleSelect = toggleSelect;
window.openPlaybook = openPlaybook;
window.closePlaybook = closePlaybook;
window.generateActionReport = generateActionReport;

})();
</script>
