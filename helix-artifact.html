<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LIMEN Helix · Artifact</title>
<meta name="description" content="View a single persisted READY-TO-SIGN artifact: full Markdown body, open items, ready-to-sign checklist, citations used, provenance chain, and status promotion." />
<style>html,body{margin:0;padding:0;background:#f6f6f5}</style>
</head>
<body>
<div id="artifact-root"></div>

<script src="assets/js/limen/markdown-renderer.js"></script>
<script src="assets/js/limen/artifact-viewer-ui.js"></script>
<script>
(function () {
  'use strict';
  function boot() {
    if (!window.LIMENArtifactViewerUI) {
      document.getElementById('artifact-root').innerHTML =
        '<div style="padding:24px;color:#7a2828">artifact-viewer-ui.js failed to load</div>';
      return;
    }
    window.LIMENArtifactViewerUI.mount(document.getElementById('artifact-root'));
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
