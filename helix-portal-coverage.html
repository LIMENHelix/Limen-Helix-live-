<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LIMEN Helix · Portal Coverage</title>
<meta name="description" content="Status of every company portal in /assets/data/companies/: schema version, functionalNetwork density, intelligenceCycle status, last enrichment. Filterable; click any cell to inspect the JSON." />
<style>
  html,body{margin:0;padding:0;background:#f6f6f5;color:#1a1a1a;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif}
  .root{padding:24px;max-width:1400px;margin:0 auto}
  h1{font-size:24px;font-weight:600;margin:0 0 8px;letter-spacing:-0.01em}
  .nav{display:flex;gap:14px;font-size:12px;color:#666;margin-bottom:24px}
  .nav a{color:#5b73a8;text-decoration:none}
  .nav a:hover{text-decoration:underline}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:16px}
  .stat{background:#fff;border:1px solid #d6d3d1;padding:12px;border-radius:6px}
  .stat-label{font-size:10px;text-transform:uppercase;color:#666;letter-spacing:0.4px;font-weight:600}
  .stat-val{font-size:22px;font-weight:600;font-family:ui-monospace,Menlo,monospace;margin-top:4px}
  .filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center;font-size:12px}
  .filters select,.filters input{font-size:12px;padding:6px 8px;border:1px solid #d6d3d1;border-radius:3px;background:#fff;font-family:inherit}
  .filters label{font-size:11px;color:#666;text-transform:uppercase;letter-spacing:0.3px}
  table{width:100%;background:#fff;border:1px solid #d6d3d1;border-collapse:collapse;font-size:12px}
  th{background:#f0eee9;text-align:left;padding:8px 10px;border-bottom:1px solid #d6d3d1;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:0.3px;cursor:pointer;user-select:none}
  th:hover{background:#e6e3de}
  td{padding:6px 10px;border-bottom:1px solid #f0eee9;vertical-align:middle}
  tr:hover{background:#fafaf8}
  tr.clickable{cursor:pointer}
  .pill{display:inline-block;padding:2px 8px;border-radius:3px;font-size:10px;font-weight:600;letter-spacing:0.3px}
  .pill-v2{background:#d6f0d6;color:#1e5e1e}
  .pill-v1{background:#fff7d6;color:#856404}
  .pill-stub{background:#ffd6d6;color:#7a2828}
  .pill-error{background:#e0e0e0;color:#555}
  .bar{display:inline-block;height:8px;background:#e6e3de;border-radius:2px;position:relative;width:120px;vertical-align:middle}
  .bar-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,#5b73a8,#7a9ae6)}
  .bar-fill.dense{background:linear-gradient(90deg,#1e5e1e,#5e9e1e)}
  .bar-fill.sparse{background:linear-gradient(90deg,#856404,#bc8a3c)}
  .bar-fill.empty{background:#bc4a4a}
  .mono{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#555}
  .ic-yes{color:#1e5e1e;font-weight:600}
  .ic-no{color:#bc4a4a}
  .domain-tag{display:inline-block;padding:1px 6px;border-radius:2px;font-size:10px;color:#555;background:#f0eee9}
  #empty{padding:48px;text-align:center;color:#666;background:#fff;border:1px solid #d6d3d1;border-radius:6px;margin-top:14px}
  #loading{padding:48px;text-align:center;color:#666;font-family:ui-monospace,Menlo,monospace}
  .legend{font-size:11px;color:#666;margin-top:8px}
  .legend span{margin-right:14px}
  .legend .wmt-bar{display:inline-block;width:8px;height:8px;background:#1e5e1e;vertical-align:middle;margin-right:4px}
</style>
</head>
<body>
<div class="root">
  <h1>Portal Coverage</h1>
  <div class="nav">
    <a href="/helix-brain-grid.html">Brain Grid</a>
    <a href="/helix-artifacts.html">Artifacts</a>
    <a href="/civilization.html">Civilization</a>
  </div>
  <div id="loading">Loading portal index…</div>
  <div id="content" style="display:none">
    <div class="stats" id="stats"></div>
    <div class="filters">
      <label>Schema</label>
      <select id="f-schema">
        <option value="">all</option>
        <option value="v2">v2.0.1 only</option>
        <option value="v1">v1 only (needs enrichment)</option>
      </select>
      <label>Domain</label>
      <select id="f-domain"><option value="">all</option></select>
      <label>Density</label>
      <select id="f-density">
        <option value="">all</option>
        <option value="dense">≥ 30 entries</option>
        <option value="moderate">10–29 entries</option>
        <option value="sparse">1–9 entries</option>
        <option value="empty">0 entries</option>
      </select>
      <label>IntelCycle</label>
      <select id="f-ic">
        <option value="">all</option>
        <option value="yes">populated</option>
        <option value="no">empty / missing</option>
      </select>
      <label>Search</label>
      <input id="f-search" type="text" placeholder="slug / name / ticker" />
    </div>
    <div class="legend">
      <span><span class="wmt-bar"></span>WMT exemplar = 30 entries</span>
      <span>Density: green ≥ 30 · blue 10–29 · yellow 1–9 · red 0</span>
    </div>
    <table id="tbl">
      <thead>
        <tr>
          <th data-col="slug">Slug</th>
          <th data-col="name">Name</th>
          <th data-col="ticker">Ticker</th>
          <th data-col="cik">CIK</th>
          <th data-col="domain">Domain</th>
          <th data-col="schema">Schema</th>
          <th data-col="density">functionalNetwork</th>
          <th data-col="ic">IntelCycle</th>
          <th data-col="fred">FRED</th>
          <th data-col="comm">Commodity</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty" style="display:none">no portals match the current filters</div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var state = {
    rows: [],
    sort: { col: 'density', dir: 'desc' },
    filters: { schema: '', domain: '', density: '', ic: '', search: '' }
  };

  // We list portals via a static manifest — derive by globbing on the
  // server side would require an endpoint; for now, fetch the same
  // command-board CIK→slug map and walk that. Simpler: GET each portal
  // by trying known slugs OR (better) fetch /assets/data/companies/
  // directory listing if available. Vercel doesn't serve directory
  // listings by default, so we use a known-slugs manifest.
  // Fallback: build the slug list from command-board-data.json by
  // matching ticker → slug heuristic. Most reliable: ship a
  // companies-manifest.json. For now, use the known v2 list + try
  // common v1 names.

  async function loadManifest() {
    // Try assets/data/companies-manifest.json if it exists. Otherwise
    // fall back to scraping from command-board + a heuristic.
    try {
      var r = await fetch('/assets/data/companies-manifest.json', { cache: 'no-store' });
      if (r.ok) {
        var j = await r.json();
        if (Array.isArray(j.slugs)) return j.slugs;
      }
    } catch (e) {}
    // Heuristic fallback: read command-board, build slugs from tickers
    try {
      var rb = await fetch('/assets/data/command-board-data.json', { cache: 'no-store' });
      var cb = await rb.json();
      var arr = (cb && cb.companies) || (Array.isArray(cb) ? cb : []);
      var seen = {};
      var slugs = [];
      for (var i = 0; i < arr.length; i++) {
        var c = arr[i];
        var name = (c.n || c.name || '').toLowerCase();
        var slug = name.replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
        if (slug && !seen[slug]) { seen[slug] = true; slugs.push(slug); }
      }
      return slugs;
    } catch (e) {
      return [];
    }
  }

  function countFunctionalNetwork(portal) {
    var fn = portal && portal.functionalNetwork;
    if (!fn) return 0;
    var n = 0;
    var cats = ['suppliers','logisticsPartners','customers','competitors','regulators','capitalProviders','executiveTeam','marketSignals','partners','peers','auditors'];
    cats.forEach(function (c) { if (Array.isArray(fn[c])) n += fn[c].length; });
    if (fn.auditor && typeof fn.auditor === 'object' && !Array.isArray(fn.auditor)) n += 1;
    return n;
  }

  function classifyDensity(n) {
    if (n >= 30) return 'dense';
    if (n >= 10) return 'moderate';
    if (n >= 1)  return 'sparse';
    return 'empty';
  }

  async function loadPortal(slug) {
    try {
      var r = await fetch('/assets/data/companies/' + encodeURIComponent(slug) + '.json', { cache: 'no-store' });
      if (!r.ok) return null;
      return await r.json();
    } catch (e) { return null; }
  }

  function rowFromPortal(slug, p) {
    if (!p) return { slug: slug, name: slug, schema: 'missing', density: 0, ic: false };
    var density = countFunctionalNetwork(p);
    var icItems = 0;
    if (Array.isArray(p.intelligenceCycle)) {
      p.intelligenceCycle.forEach(function (l) { icItems += (l.items || []).length; });
    }
    return {
      slug: slug,
      name: p.name || slug,
      ticker: p.ticker || null,
      cik: p.cik || null,
      domain: p.domainId || null,
      schema: p.schemaVersion === '2.0.1' ? 'v2' : (p.schemaVersion ? 'v_other' : 'v1'),
      kernelStatus: p.kernelStatus || null,
      density: density,
      densityClass: classifyDensity(density),
      ic: icItems > 0,
      icItems: icItems,
      fred: Array.isArray(p.fredSeries) ? p.fredSeries.length : 0,
      commodity: Array.isArray(p.commodityExposure) ? p.commodityExposure.length : 0
    };
  }

  async function run() {
    var manifest = await loadManifest();
    if (!manifest || manifest.length === 0) {
      document.getElementById('loading').textContent = 'no portals found';
      return;
    }
    // Load in parallel but throttled to avoid hammering the CDN.
    var rows = [];
    var BATCH = 20;
    for (var i = 0; i < manifest.length; i += BATCH) {
      var slice = manifest.slice(i, i + BATCH);
      var portals = await Promise.all(slice.map(function (s) { return loadPortal(s); }));
      portals.forEach(function (p, idx) {
        if (p) rows.push(rowFromPortal(slice[idx], p));
      });
      document.getElementById('loading').textContent = 'loaded ' + rows.length + ' / ' + manifest.length + '…';
    }
    state.rows = rows;
    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';

    // Populate domain dropdown
    var domains = {};
    rows.forEach(function (r) { if (r.domain) domains[r.domain] = true; });
    var dSelect = document.getElementById('f-domain');
    Object.keys(domains).sort().forEach(function (d) {
      var opt = document.createElement('option');
      opt.value = d; opt.textContent = d;
      dSelect.appendChild(opt);
    });

    // Wire filters
    ['f-schema', 'f-domain', 'f-density', 'f-ic'].forEach(function (id) {
      document.getElementById(id).addEventListener('change', render);
    });
    document.getElementById('f-search').addEventListener('input', render);
    document.querySelectorAll('th[data-col]').forEach(function (th) {
      th.addEventListener('click', function () {
        var col = th.getAttribute('data-col');
        if (state.sort.col === col) state.sort.dir = state.sort.dir === 'asc' ? 'desc' : 'asc';
        else { state.sort.col = col; state.sort.dir = 'desc'; }
        render();
      });
    });

    render();
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function applyFilters(rows) {
    var f = state.filters;
    var lower = (f.search || '').toLowerCase();
    return rows.filter(function (r) {
      if (f.schema === 'v2' && r.schema !== 'v2') return false;
      if (f.schema === 'v1' && r.schema !== 'v1') return false;
      if (f.domain && r.domain !== f.domain) return false;
      if (f.density && r.densityClass !== f.density) return false;
      if (f.ic === 'yes' && !r.ic) return false;
      if (f.ic === 'no' && r.ic) return false;
      if (lower) {
        var hay = (r.slug + ' ' + (r.name || '') + ' ' + (r.ticker || '')).toLowerCase();
        if (hay.indexOf(lower) === -1) return false;
      }
      return true;
    });
  }

  function applySort(rows) {
    var s = state.sort;
    var dir = s.dir === 'asc' ? 1 : -1;
    return rows.slice().sort(function (a, b) {
      var av = a[s.col]; var bv = b[s.col];
      if (av === undefined || av === null) av = '';
      if (bv === undefined || bv === null) bv = '';
      if (typeof av === 'boolean') av = av ? 1 : 0;
      if (typeof bv === 'boolean') bv = bv ? 1 : 0;
      if (av < bv) return -1 * dir;
      if (av > bv) return 1 * dir;
      return 0;
    });
  }

  function render() {
    state.filters.schema = document.getElementById('f-schema').value;
    state.filters.domain = document.getElementById('f-domain').value;
    state.filters.density = document.getElementById('f-density').value;
    state.filters.ic = document.getElementById('f-ic').value;
    state.filters.search = document.getElementById('f-search').value;

    var filtered = applySort(applyFilters(state.rows));

    // Stats
    var totals = { total: state.rows.length, v2: 0, v1: 0, dense: 0, ic: 0 };
    state.rows.forEach(function (r) {
      if (r.schema === 'v2') totals.v2++;
      if (r.schema === 'v1') totals.v1++;
      if (r.density >= 30) totals.dense++;
      if (r.ic) totals.ic++;
    });
    document.getElementById('stats').innerHTML =
      stat('total portals', totals.total) +
      stat('v2.0.1', totals.v2) +
      stat('v1 (need enrich)', totals.v1) +
      stat('WMT-grade (≥30)', totals.dense) +
      stat('intelligenceCycle', totals.ic + ' / ' + totals.total);

    if (filtered.length === 0) {
      document.getElementById('rows').innerHTML = '';
      document.getElementById('empty').style.display = 'block';
      return;
    }
    document.getElementById('empty').style.display = 'none';

    var maxDensity = 50; // for the bar visualization
    document.getElementById('rows').innerHTML = filtered.map(function (r) {
      var pct = Math.min(100, Math.round((r.density / maxDensity) * 100));
      var schemaPill = r.schema === 'v2' ? 'v2' : (r.schema === 'v1' ? 'v1' : 'stub');
      return '<tr class="clickable" data-slug="' + escapeHtml(r.slug) + '">' +
        '<td class="mono">' + escapeHtml(r.slug) + '</td>' +
        '<td>' + escapeHtml(r.name) + '</td>' +
        '<td class="mono">' + escapeHtml(r.ticker || '—') + '</td>' +
        '<td class="mono">' + escapeHtml(r.cik || '—') + '</td>' +
        '<td>' + (r.domain ? '<span class="domain-tag">' + escapeHtml(r.domain) + '</span>' : '—') + '</td>' +
        '<td><span class="pill pill-' + schemaPill + '">' + schemaPill + '</span></td>' +
        '<td><span class="bar"><span class="bar-fill ' + escapeHtml(r.densityClass) + '" style="width:' + pct + '%"></span></span> <span class="mono">' + r.density + '</span></td>' +
        '<td>' + (r.ic ? '<span class="ic-yes">' + r.icItems + ' items</span>' : '<span class="ic-no">—</span>') + '</td>' +
        '<td class="mono">' + r.fred + '</td>' +
        '<td class="mono">' + r.commodity + '</td>' +
      '</tr>';
    }).join('');

    document.querySelectorAll('tr.clickable').forEach(function (tr) {
      tr.addEventListener('click', function () {
        var slug = tr.getAttribute('data-slug');
        window.open('/assets/data/companies/' + slug + '.json', '_blank');
      });
    });
  }

  function stat(label, value) {
    return '<div class="stat"><div class="stat-label">' + escapeHtml(label) + '</div><div class="stat-val">' + escapeHtml(String(value)) + '</div></div>';
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', run);
  else run();
})();
</script>
</body>
</html>
