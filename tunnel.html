<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>LIMEN HELIX — Entering</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#000;overflow:hidden;height:100%;width:100%}
canvas{position:fixed;top:0;left:0;width:100%;height:100%}
#overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;pointer-events:none}
#msg{font-family:monospace;font-size:clamp(0.5rem,1.5vw,0.7rem);letter-spacing:4px;text-transform:uppercase;color:rgba(201,169,78,0);transition:color 1.2s;text-align:center;line-height:2.5}
#whiteout{position:fixed;inset:0;z-index:20;background:#fff;opacity:0;pointer-events:none;transition:opacity 0.8s}
#vignette{position:fixed;inset:0;z-index:5;pointer-events:none;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,0.7) 100%);transition:background 0.3s}
#flash{position:fixed;inset:0;z-index:8;pointer-events:none;background:#fff;opacity:0}
#blackout{position:fixed;inset:0;z-index:15;background:#000;opacity:0;pointer-events:none;transition:opacity 0.5s}
</style>
</head>
<body>
<script src="assets/js/auth-gate.js"></script>
<canvas id="c"></canvas>
<div id="whiteout"></div>
<script>
var canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
var W,H,CX,CY;
function resize(){
  W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;
  CX=W/2;CY=H/2;
}
window.addEventListener('resize',resize);
resize();

// ═══ FAST TUNNEL: gold ring → crack → whiteout → redirect ═══
var DURATION=750;// total ms
var startTime=performance.now();
var whiteout=document.getElementById('whiteout');
var dest=new URLSearchParams(window.location.search).get('dest');
var done=false;

function ease(t){return t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}

function render(now){
  if(done)return;
  var elapsed=now-startTime;
  var p=Math.min(elapsed/DURATION,1);
  var ep=ease(p);
  ctx.fillStyle='#000';
  ctx.fillRect(0,0,W,H);
  var maxR=Math.max(W,H)*0.8;

  // Phase 1 (0-0.35): Gold ring expands from center
  if(p<0.35){
    var rp=p/0.35;
    var ringR=rp*maxR*0.4;
    var ringW=8+rp*20;
    ctx.beginPath();ctx.arc(CX,CY,ringR,0,Math.PI*2);
    ctx.strokeStyle='rgba(201,169,78,'+(0.3+rp*0.7)+')';
    ctx.lineWidth=ringW;ctx.stroke();
    // Inner glow
    var grd=ctx.createRadialGradient(CX,CY,0,CX,CY,ringR*0.8);
    grd.addColorStop(0,'rgba(201,169,78,'+(rp*0.15)+')');
    grd.addColorStop(1,'rgba(201,169,78,0)');
    ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);
  }

  // Phase 2 (0.25-0.65): Crack open — bright radial lines burst out
  if(p>0.25&&p<0.65){
    var cp=(p-0.25)/0.4;
    var numRays=12;
    ctx.save();ctx.translate(CX,CY);
    for(var i=0;i<numRays;i++){
      var angle=(i/numRays)*Math.PI*2+0.2;
      var rayLen=cp*maxR*1.2;
      var rayW=2+cp*6;
      ctx.beginPath();ctx.moveTo(0,0);
      ctx.lineTo(Math.cos(angle)*rayLen,Math.sin(angle)*rayLen);
      ctx.strokeStyle='rgba(255,245,220,'+(0.5+cp*0.5)+')';
      ctx.lineWidth=rayW;ctx.stroke();
    }
    ctx.restore();
    // Center flash
    var flashR=cp*maxR*0.3;
    var grd2=ctx.createRadialGradient(CX,CY,0,CX,CY,flashR);
    grd2.addColorStop(0,'rgba(255,250,230,'+(cp*0.9)+')');
    grd2.addColorStop(0.4,'rgba(201,169,78,'+(cp*0.4)+')');
    grd2.addColorStop(1,'rgba(201,169,78,0)');
    ctx.fillStyle=grd2;ctx.fillRect(0,0,W,H);
  }

  // Phase 3 (0.5-1.0): Whiteout flood
  if(p>0.5){
    var wp=(p-0.5)/0.5;
    whiteout.style.opacity=wp*wp;
  }

  // Redirect
  if(p>=1&&!done){
    done=true;
    try{localStorage.setItem('limenTunnelSeen','1')}catch(e){}
    if(dest){window.location.href=dest;}
    else{window.location.href='spiral.html';}
    return;
  }
  requestAnimationFrame(render);
}
requestAnimationFrame(render);
</script>
</body>
</html>
