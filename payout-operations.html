<!DOCTYPE html>
<html lang="en"><head><script src="/assets/js/gate-finance.js"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>LIMEN HELIX · Payout Operations</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#050810;color:#e8e3d9;font-family:"IBM Plex Mono",monospace;padding:20px 24px;max-width:900px;margin:0 auto;font-size:12px;line-height:1.7}h1{font-size:0.6rem;letter-spacing:4px;color:#C9A94E;margin-bottom:12px}h2{font-size:0.42rem;color:rgba(201,169,78,0.6);margin:16px 0 6px;letter-spacing:2px;border-bottom:1px solid rgba(201,169,78,0.08);padding-bottom:4px}.row{display:flex;justify-content:space-between;font-size:0.38rem;color:#b0a898;padding:2px 0}.row b{color:#d0c8b8}.card{padding:10px;border:1px solid rgba(201,169,78,0.06);border-radius:3px;margin-bottom:8px;background:rgba(0,0,0,0.15)}.badge{display:inline-block;font-size:0.3rem;padding:2px 6px;border-radius:2px;margin-left:6px}.bg-ok{background:rgba(90,181,160,0.15);color:#5ab5a0}.bg-warn{background:rgba(212,168,74,0.15);color:#d4a84a}.bg-bad{background:rgba(232,84,84,0.15);color:#e85454}.bg-grey{background:rgba(120,120,140,0.15);color:#9898a8}a{color:rgba(201,169,78,0.5);text-decoration:none}.btn{font-family:inherit;font-size:0.34rem;padding:6px 12px;border:1px solid rgba(90,181,160,0.3);background:rgba(90,181,160,0.08);color:#5ab5a0;border-radius:2px;cursor:pointer}.empty{font-size:0.36rem;color:#605848;padding:20px;text-align:center}</style></head>
<body>
<a href="/domain-console?domain=energy&mode=operator" style="font-size:0.34rem;display:block;margin-bottom:12px">&larr; Back</a>
<h1>PAYOUT OPERATIONS</h1>
<div id="payoutSummary"></div>
<h2>PAYOUT QUEUE</h2>
<div id="payoutQueue"></div>
<script src="assets/js/operator-compensation.js"></script><script src="assets/js/operator-claim-ledger.js"></script><script src="assets/js/execution-outcomes.js"></script><script src="assets/js/execution-payout-ops.js"></script>
<script>
function render(){
  var po=window.LIMENExecution&&window.LIMENExecution.phase11&&window.LIMENExecution.phase11.payoutOps;
  if(!po){document.getElementById('payoutQueue').innerHTML='<div class="empty">Module not loaded.</div>';return}
  var summary=po.getPayoutSummary();
  document.getElementById('payoutSummary').innerHTML='<div class="card"><div class="row"><span>Eligible</span><b>'+summary.eligible+'</b></div><div class="row"><span>Blocked</span><b>'+summary.blocked+'</b></div><div class="row"><span>Prepared</span><b>'+summary.prepared+'</b></div><div class="row"><span>Operator Est.</span><b>$'+summary.totalOperatorEstimate.toLocaleString()+'</b></div><div class="row"><span>Platform Retained</span><b>$'+summary.totalPlatformRetained.toLocaleString()+'</b></div></div>';
  var queue=po.getPayoutQueue();
  if(queue.length===0){document.getElementById('payoutQueue').innerHTML='<div class="empty">No payout items.</div>';return}
  var h='';
  for(var i=0;i<queue.length;i++){var p=queue[i];
    var bc=p.payoutStatus==='eligible'?'bg-ok':p.payoutStatus==='prepared'?'bg-ok':p.payoutStatus==='blocked'?'bg-warn':'bg-grey';
    h+='<div class="card"><div class="row"><span>'+p.title+'</span><b>'+p.payoutStatus.toUpperCase()+'<span class="badge '+bc+'">'+p.payoutBasis.toUpperCase()+'</span></b></div>';
    h+='<div class="row"><span>Operator: $'+p.operatorEstimate.toLocaleString()+'</span><b>Platform: $'+p.platformRetainedEstimate.toLocaleString()+'</b></div>';
    if(p.payoutBlockers.length>0)h+='<div class="row" style="color:#e85454;font-size:0.32rem">Blockers: '+p.payoutBlockers.join(', ')+'</div>';
    if(p.payoutStatus==='eligible')h+='<div style="margin-top:4px"><button class="btn" onclick="prep(\''+p.claimId+'\')">MARK PREPARED</button></div>';
    h+='</div>';
  }
  document.getElementById('payoutQueue').innerHTML=h;
}
function prep(id){var po=window.LIMENExecution.phase11.payoutOps;po.markPayoutPrepared(id);render()}
setTimeout(render,500);
</script></body></html>
