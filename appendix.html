<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LIMEN HELIX · APPENDIX — Complete Page Index</title>
<script>if(sessionStorage.getItem('limen_access')!=='granted'){window.location.replace('/?return='+encodeURIComponent('/appendix'));}</script>
<style>
:root{--bg:#050810;--panel:#0b1018;--ink:#e8e3d9;--mut:#9aa0ab;--gold:rgba(201,169,78,1);--gold5:rgba(201,169,78,.5);--gold1:rgba(201,169,78,.12);--line:rgba(201,169,78,.16)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);margin:0;font-family:ui-monospace,Menlo,Monaco,Consolas,"Liberation Mono",monospace;line-height:1.5}
a{color:var(--ink);text-decoration:none}
.wrap{max-width:1100px;margin:0 auto;padding:28px 20px 80px}
header{position:sticky;top:0;background:linear-gradient(180deg,var(--bg) 70%,transparent);padding:18px 0 14px;z-index:5;border-bottom:1px solid var(--line)}
.brand{color:var(--gold);letter-spacing:3px;font-size:13px}
h1{font-size:22px;margin:6px 0 2px;letter-spacing:.5px}
.sub{color:var(--mut);font-size:12px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.bar a.home{border:1px solid var(--gold5);color:var(--gold);padding:7px 12px;border-radius:4px;font-size:12px}
.bar a.home:hover{background:var(--gold1)}
select,input{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:7px 10px;font:inherit;font-size:12px}
input{flex:1;min-width:180px}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 6px}
.toc a{font-size:11px;color:var(--mut);border:1px solid var(--line);padding:3px 8px;border-radius:3px}
.toc a:hover{color:var(--gold);border-color:var(--gold5)}
section{margin-top:26px;scroll-margin-top:90px}
section h2{color:var(--gold);font-size:13px;letter-spacing:2px;border-bottom:1px solid var(--line);padding-bottom:6px;margin:0 0 12px}
section h2 .n{color:var(--mut);letter-spacing:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.cell{display:block;border:1px solid var(--line);border-radius:4px;padding:9px 11px;background:var(--panel);transition:.12s}
.cell:hover{border-color:var(--gold5);background:var(--gold1)}
.cell .l{font-size:13px}
.cell .u{font-size:10.5px;color:var(--mut);margin-top:2px}
.empty{color:var(--mut);font-size:12px;padding:30px 0;text-align:center}
footer{margin-top:50px;color:var(--mut);font-size:11px;border-top:1px solid var(--line);padding-top:14px}
</style></head>
<body>
<div class="wrap">
<header>
  <div class="brand">LIMEN HELIX</div>
  <h1>Appendix — Complete Page Index</h1>
  <div class="sub" id="sub">Every page in the system, grouped and linked.</div>
  <div class="bar">
    <a class="home" href="/civilization">← Cockpit</a>
    <a class="home" href="/">Front Door</a>
    <select id="jump"><option value="">⤓ Jump to a page…</option></select>
    <input id="filter" type="search" placeholder="Filter pages… (e.g. operator, finance, vitals)">
  </div>
  <nav class="toc" id="toc"></nav>
</header>
<main id="main"><div class="empty" id="loading">Loading page index…</div></main>
<footer id="foot"></footer>
</div>
<script src="/assets/js/limen-site-index.js" defer></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var IDX = window.LIMEN_SITE_INDEX;
  var main = document.getElementById('main'), toc = document.getElementById('toc'), jump = document.getElementById('jump');
  if (!IDX || !IDX.groups) { main.innerHTML = '<div class="empty">Page index failed to load (assets/js/limen-site-index.js).</div>'; return; }
  document.getElementById('loading').remove();
  document.getElementById('sub').textContent = IDX.total + ' pages · ' + IDX.groups.length + ' sections · every page reachable + linked here.';
  var slug = function (s) { return s.replace(/[^a-z0-9]+/gi, '-').toLowerCase(); };
  IDX.groups.forEach(function (g) {
    var id = 'g-' + slug(g.name);
    var t = document.createElement('a'); t.href = '#' + id; t.textContent = g.name; toc.appendChild(t);
    var sec = document.createElement('section'); sec.id = id;
    var h = document.createElement('h2'); h.innerHTML = g.name + ' <span class="n">(' + g.items.length + ')</span>'; sec.appendChild(h);
    var grid = document.createElement('div'); grid.className = 'grid';
    g.items.forEach(function (it) {
      var a = document.createElement('a'); a.className = 'cell'; a.href = it.url;
      a.setAttribute('data-q', (it.label + ' ' + it.stem + ' ' + g.name).toLowerCase());
      a.innerHTML = '<div class="l">' + it.label + '</div><div class="u">' + it.url + '</div>';
      grid.appendChild(a);
      var o = document.createElement('option'); o.value = it.url; o.textContent = g.name + ' › ' + it.label; jump.appendChild(o);
    });
    sec.appendChild(grid); main.appendChild(sec);
  });
  jump.addEventListener('change', function () { if (jump.value) location.href = jump.value; });
  var filter = document.getElementById('filter');
  filter.addEventListener('input', function () {
    var q = filter.value.trim().toLowerCase();
    document.querySelectorAll('section').forEach(function (sec) {
      var shown = 0;
      sec.querySelectorAll('.cell').forEach(function (c) {
        var hit = !q || c.getAttribute('data-q').indexOf(q) >= 0;
        c.style.display = hit ? '' : 'none'; if (hit) shown++;
      });
      sec.style.display = shown ? '' : 'none';
    });
  });
  document.getElementById('foot').textContent = 'LIMEN Helix · Appendix · generated from the live page set. If a page 404s, it may be JSON/router-driven — see SYSTEM_MAP_FULL.md.';
});
</script>
</body></html>
