<script>
(function () {
  'use strict';

  function boot() {
    var status = document.getElementById('lbg-boot-status');
    var checks = [];

    function check(name, condition) {
      checks.push({ name: name, ok: !!condition });
    }

    // Upstream
    check('FastBoot',         window.LIMENFastBoot || window.limenFastBoot);
    check('FeedStore',        window.FeedStore || window.LIMENFeedStore);
    check('SharedSnapshot',   window.LIMENSharedSnapshot);
    check('DomainAdapter',    window.LIMENDomainBrainAdapter || window.LIMENDomains);
    check('CivPackets',       window.LIMENCivilizationAdapter || window.LIMENCivilizationPackets);
    check('Handoff',          window.LIMENMainBrainHandoff || window.LIMENMainBrainHandoffState);

    // New layer
    check('PatternEnvelope',  window.LIMENPatternEnvelope);
    check('PatternBroker',    window.LIMENPatternBroker);
    check('SuperBrainBase',   window.LIMENSuperBrainBase);
    check('CivilizationSB',   window.LIMENCivilizationSuperBrain);
    check('ConnectomeSB',     window.LIMENConnectomeSuperBrain);
    check('MasterLivingBrain',window.LIMENMasterLivingBrain);
    check('CikCoverage',      window.LIMENCikCoverage);
    check('ContextBuilder',   window.LIMENEngineContextBuilder);
    check('ClaudeRunner',     window.LIMENEngineRunnerClaude);
    check('BrainGridUI',      window.LIMENBrainGridUI);

    var newLayerOk = checks.slice(-9).every(function (c) { return c.ok; });
    if (status) {
      status.innerHTML = checks.map(function (c) {
        return '<span class="' + (c.ok ? 'lbg-boot-ok' : 'lbg-boot-warn') + '">' +
               (c.ok ? '✓' : '✗') + ' ' + c.name + '</span>';
      }).join('  ·  ');
    }
    if (!newLayerOk) {
      console.error('[helix-brain-grid] new-layer modules missing', checks.filter(function(c){return !c.ok;}));
      return;
    }

    // Build the Claude-backed engine runner
    var claudeRunner = window.LIMENEngineRunnerClaude.create({
      rateLimitMs: 10 * 60 * 1000,   // 10 min between calls per (cik, lane)
      minReadiness: 0.45,
      onResult: function (r) {
        console.log('[engine-result]', r.lane, r.cik, 'outputId=' + r.outputId);
      }
    });

    // Instantiate super-brains
    try {
      window.civilization = new window.LIMENCivilizationSuperBrain({ autoStart: true });
      window.connectome   = new window.LIMENConnectomeSuperBrain({ autoStart: true });
      window.masterLiving = new window.LIMENMasterLivingBrain({
        autoStart: true,
        engineRunner: claudeRunner
      });

      window.masterLiving.subscribeTo(['civilization', 'connectome']);

      console.log('[helix-brain-grid] super-brains instantiated', {
        civilization: window.civilization,
        connectome:   window.connectome,
        masterLiving: window.masterLiving,
        claudeRunner: claudeRunner
      });
    } catch (err) {
      console.error('[helix-brain-grid] super-brain init failed', err);
      if (status) {
        status.innerHTML += '<div class="lbg-boot-err">init failed: ' +
          String(err && err.message || err) + '</div>';
      }
      return;
    }

    // Mount UI
    try {
      window.LIMENBrainGridUI.mount(document.getElementById('brain-grid-root'));
    } catch (err2) {
      console.error('[helix-brain-grid] UI mount failed', err2);
    }

    // Expose debug helpers
    window.LIMEN_HELIX = {
      civilization: window.civilization,
      connectome:   window.connectome,
      masterLiving: window.masterLiving,
      broker:       window.LIMENPatternBroker,
      envelope:     window.LIMENPatternEnvelope,
      context:      window.LIMENEngineContextBuilder,
      claudeRunner: claudeRunner,
      ui:           window.LIMENBrainGridUI,
      snapshot: function () {
        return {
          stats: window.LIMENPatternBroker.stats(),
          registry: window.LIMENPatternBroker.getRegistry(),
          latest: window.LIMENPatternBroker.getAllLatest(),
          runner: claudeRunner._stats(),
          runnerLog: claudeRunner._log().slice(-20)
        };
      },
      cycleMaster: function () { return window.masterLiving.cycle(); },
      // Force fire a specific lane for a specific CIK without waiting on
      // gates — useful for testing one engine end-to-end.
      forceFire: function (lane, cik, slug) {
        var env = window.masterLiving.getLatest();
        if (!env) return Promise.reject(new Error('no master envelope yet'));
        return claudeRunner(env, {
          engineId: 'force-' + lane,
          lane: lane,
          cik: cik,
          slug: slug || null,
          sourcePatternSig: env.pattern.signature,
          readiness: 0.99
        });
      }
    };
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { setTimeout(boot, 200); });
  } else {
    setTimeout(boot, 200);
  }
})();
</script>
