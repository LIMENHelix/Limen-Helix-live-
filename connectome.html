<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#050810;color:#e8e3d9;font-family:monospace;overflow:hidden;height:100%;width:100%;-webkit-user-select:none;user-select:none}

.center-label .subtitle{font-size:clamp(0.45rem,1.4vw,0.6rem);letter-spacing:clamp(4px,1.5vw,10px);text-transform:uppercase;opacity:0.2;margin-top:4px;color:rgba(140,170,200,0.4)}
.hud{position:fixed;z-index:100;font-size:clamp(0.35rem,1vw,0.45rem);letter-spacing:2px;text-transform:uppercase;color:rgba(201,169,78,0.4)}
.hud-tl{top:40px;left:14px}.hud-tr{top:12px;right:14px;text-align:right}
.hud-bl{bottom:12px;left:14px}.hud-br{bottom:12px;right:14px;text-align:right}
.headline{position:fixed;top:52px;left:0;right:0;z-index:150;text-align:center;padding:0 16px;pointer-events:none;font-family:Georgia,serif;font-size:clamp(.62rem,1.7vw,.9rem);letter-spacing:.05em;color:rgba(201,169,78,0.85);text-shadow:0 0 18px rgba(0,0,0,.85)}
.headline b{color:#fff;font-weight:700}
#tooltip{position:fixed;z-index:400;background:rgba(5,8,16,0.96);border:1px solid rgba(140,170,200,0.15);padding:14px 18px;max-width:340px;width:max-content;pointer-events:none;display:none;font-family:monospace}
#subMenu{position:fixed;z-index:500;background:rgba(5,8,16,0.96);border:1px solid rgba(140,170,200,0.15);padding:12px 16px;display:none;font-family:monospace;min-width:200px}
#subMenu .sm-title{font-size:0.5rem;letter-spacing:3px;text-transform:uppercase;margin-bottom:8px;color:rgba(180,200,220,0.4)}
#subMenu a{display:block;color:rgba(140,170,200,0.6);text-decoration:none;font-size:clamp(0.6rem,1.8vw,0.72rem);letter-spacing:1px;padding:5px 0;transition:color 0.2s}
#subMenu a:hover{color:rgba(201,169,78,0.9)}
#subMenu .sm-main{color:rgba(180,200,220,0.8);font-size:clamp(0.65rem,1.9vw,0.75rem);letter-spacing:2px}
#subMenu .sm-sep{border-top:1px solid rgba(140,170,200,0.08);margin:6px 0}
#tooltip .tt-phase{font-size:0.5rem;letter-spacing:3px;text-transform:uppercase;margin-bottom:4px}
#tooltip .tt-name{font-size:clamp(0.85rem,2.8vw,1rem);color:rgba(180,200,220,0.9);letter-spacing:2px;margin-bottom:2px}
#tooltip .tt-tagline{font-family:Georgia,serif;font-size:0.8rem;color:rgba(180,200,220,0.45);line-height:1.5;margin-bottom:8px}
#tooltip .tt-enter{font-size:0.5rem;letter-spacing:3px;color:rgba(140,170,200,0.5);text-transform:uppercase}
#entry-veil{position:fixed;inset:0;z-index:50;background:#050810;pointer-events:none;transition:opacity 2s}
</style>

<script>
(function () {
  'use strict';

  // Consume-and-clear context handoff (new API with fallback to legacy)
  var ctx;
  if (window.LIMENUIState) {
    ctx = window.LIMENUIState.getConnectomeContext() || {};
  } else {
    ctx = JSON.parse(sessionStorage.getItem('limen_connectome_context') || '{}');
    sessionStorage.removeItem('limen_connectome_context');
  }
  CivilizationConnectome.init('c', {
    miniMode: false,
    focusDomain: ctx.focusDomain || null
  });

  // Entry veil fade
  setTimeout(function () {
    var v = document.getElementById('entry-veil');
    if (v) {
      v.style.opacity = '0';
      setTimeout(function () { v.remove(); }, 2000);
    }
  }, 300);

})();
</script>
<script>
/* Animated galaxy backdrop — matches the front page exactly. The connectome floats transparently above. */
(function(){
  var cv=document.getElementById('stars'); if(!cv) return; var ctx=cv.getContext('2d');
  var dpr=Math.min(window.devicePixelRatio||1,2), stars=[], neb=[], W=0, H=0, RAD=0;
  var BAND=-0.5, cosB=Math.cos(BAND), sinB=Math.sin(BAND);
  function rand(a,b){ return a+Math.random()*(b-a); }
  function gauss(){ return (Math.random()+Math.random()+Math.random()-1.5)/1.5; }
  function build(){
    W=cv.width=innerWidth*dpr; H=cv.height=innerHeight*dpr; RAD=Math.sqrt(W*W+H*H)/2;
    var n=Math.floor(innerWidth*innerHeight/380); stars=[];
    for(var i=0;i<n;i++){
      var x,y;
      if(Math.random()<0.5){ var u=rand(-RAD,RAD), v=gauss()*RAD*0.5; x=W/2+u*cosB-v*sinB; y=H/2+u*sinB+v*cosB; }
      else { x=Math.random()*W; y=Math.random()*H; }
      var t=Math.random(), bright=t>0.9, mid=t>0.68, roll=Math.random();
      var col=roll<0.55?'255,255,255':roll<0.74?'190,210,255':roll<0.89?'225,205,235':'245,210,170';
      stars.push({ x:x, y:y, r:(bright?rand(1.1,2.1):mid?rand(0.6,1.05):rand(0.3,0.7))*dpr,
        base:bright?rand(0.85,1):mid?rand(0.5,0.85):rand(0.18,0.55), tw:rand(0.006,0.034), ph:Math.random()*6.2832, col:col, spark:bright, flare:(bright&&Math.random()<0.32) });
    }
    neb=[]; var pal=['150,80,215','125,70,200','205,85,165','215,100,160','75,105,225','60,150,200','175,110,225'];
    for(var j=0;j<22;j++){
      var spread=Math.random()<0.5, u=rand(-RAD*0.95,RAD*0.95), v=gauss()*(spread?RAD*0.62:RAD*0.28);
      neb.push({ x:W/2+u*cosB-v*sinB, y:H/2+u*sinB+v*cosB, r:rand(RAD*0.18,RAD*0.5), c:pal[(Math.random()*pal.length)|0], a:rand(0.08,0.20) });
    }
    for(var m=0;m<30;m++){ var pu=rand(-RAD*0.9,RAD*0.9), pv=gauss()*RAD*0.17;
      neb.push({ x:W/2+pu*cosB-pv*sinB, y:H/2+pu*sinB+pv*cosB, r:rand(RAD*0.05,RAD*0.15), c:pal[(Math.random()*pal.length)|0], a:rand(0.05,0.12) }); }
    var cx=W*0.30, cy=H*0.70; // warm galactic core, lower-left
    neb.push({ x:cx, y:cy, r:RAD*0.62, c:'232,165,110', a:0.24 });
    neb.push({ x:cx, y:cy, r:RAD*0.34, c:'245,200,150', a:0.22 });
    neb.push({ x:W*0.46, y:H*0.56, r:RAD*0.46, c:'212,120,150', a:0.15 });
    neb.push({ x:W*0.62, y:H*0.30, r:RAD*0.5, c:'110,90,205', a:0.13 });
  }
  build(); addEventListener('resize',build);
  var run=true; document.addEventListener('visibilitychange',function(){ run=!document.hidden; if(run) draw(); });
  function draw(){
    if(!run) return;
    var bg=ctx.createRadialGradient(W*0.34,H*0.62,0,W*0.34,H*0.62,RAD*1.15);
    bg.addColorStop(0,'#0a0815'); bg.addColorStop(0.55,'#05040d'); bg.addColorStop(1,'#020207');
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation='lighter';
    for(var k=0;k<neb.length;k++){ var b=neb[k]; var g=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r);
      g.addColorStop(0,'rgba('+b.c+','+b.a+')'); g.addColorStop(0.5,'rgba('+b.c+','+(b.a*0.4).toFixed(3)+')'); g.addColorStop(1,'rgba('+b.c+',0)');
      ctx.fillStyle=g; ctx.fillRect(b.x-b.r,b.y-b.r,b.r*2,b.r*2); }
    for(var i=0;i<stars.length;i++){ var s=stars[i]; s.ph+=s.tw; var al=s.base*(0.45+0.55*Math.sin(s.ph)); if(al<0) al=0;
      if(s.spark){ ctx.beginPath(); ctx.arc(s.x,s.y,s.r*3,0,6.2832); ctx.fillStyle='rgba('+s.col+','+(al*0.12).toFixed(3)+')'; ctx.fill(); }
      if(s.flare){ var fl=s.r*6; ctx.strokeStyle='rgba('+s.col+','+(al*0.22).toFixed(3)+')'; ctx.lineWidth=0.7*dpr; ctx.beginPath(); ctx.moveTo(s.x-fl,s.y); ctx.lineTo(s.x+fl,s.y); ctx.moveTo(s.x,s.y-fl); ctx.lineTo(s.x,s.y+fl); ctx.stroke(); }
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.2832); ctx.fillStyle='rgba('+s.col+','+al.toFixed(3)+')'; ctx.fill(); }
    ctx.globalCompositeOperation='source-over';
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>
