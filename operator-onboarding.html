<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>LIMEN HELIX · Operator Onboarding</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#050810;color:#e8e3d9;font-family:"IBM Plex Mono",monospace;padding:20px 24px;max-width:700px;margin:0 auto;font-size:12px;line-height:1.7}h1{font-size:0.6rem;letter-spacing:4px;color:#C9A94E;margin-bottom:12px}h2{font-size:0.42rem;color:rgba(201,169,78,0.6);margin:16px 0 6px;letter-spacing:2px}a{color:rgba(201,169,78,0.5);text-decoration:none}.card{padding:12px;border:1px solid rgba(201,169,78,0.06);border-radius:3px;margin-bottom:10px;background:rgba(0,0,0,0.15)}.row{display:flex;justify-content:space-between;font-size:0.38rem;color:#b0a898;padding:2px 0}.row b{color:#d0c8b8}input,select,textarea{font-family:inherit;font-size:0.36rem;padding:5px 8px;background:rgba(0,0,0,0.3);border:1px solid rgba(201,169,78,0.1);color:#e8e3d9;border-radius:2px;width:100%;margin-bottom:6px}select{width:auto;min-width:120px}.btn{font-family:inherit;font-size:0.34rem;padding:6px 14px;border:1px solid rgba(90,181,160,0.3);background:rgba(90,181,160,0.08);color:#5ab5a0;border-radius:2px;cursor:pointer;margin-right:6px}.check{color:#5ab5a0}.uncheck{color:#605848}.status{font-size:0.36rem;padding:8px;border-radius:3px;margin-bottom:12px}</style></head>
<body>
<a href="/domain-console?domain=energy&mode=operator" style="font-size:0.34rem;display:block;margin-bottom:12px">&larr; Back</a>
<h1>OPERATOR ONBOARDING</h1>
<div id="onboardStatus"></div>
<div id="onboardForm"></div>
<div id="onboardChecklist"></div>
<script src="assets/js/execution-operator-onboarding.js"></script>
<script>
function render(){
  var ob=window.LIMENExecution&&window.LIMENExecution.phase11&&window.LIMENExecution.phase11.onboarding;
  if(!ob){document.getElementById('onboardForm').textContent='Module not loaded.';return}
  var profile=ob.getOperatorProfile();var status=ob.getOnboardingStatus();
  // Status
  var sh='';
  if(status.complete)sh='<div class="status" style="border:1px solid rgba(90,181,160,0.3);color:#5ab5a0">ONBOARDING COMPLETE</div>';
  else if(profile)sh='<div class="status" style="border:1px solid rgba(201,169,78,0.2);color:#C9A94E">IN PROGRESS</div>';
  else sh='<div class="status" style="border:1px solid rgba(120,120,140,0.2);color:#9898a8">NOT STARTED</div>';
  document.getElementById('onboardStatus').innerHTML=sh;
  // Form
  if(!profile){
    document.getElementById('onboardForm').innerHTML='<div class="card"><h2>CREATE PROFILE</h2><input id="opName" placeholder="Full Name"><input id="opEmail" placeholder="Email"><h2>SELECT DOMAINS</h2><div id="domainChecks" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px"></div><h2>SELECT PATHS</h2><div style="display:flex;gap:8px;margin-bottom:8px"><label style="font-size:0.34rem"><input type="checkbox" class="pathCb" value="GRANT"> GRANT</label><label style="font-size:0.34rem"><input type="checkbox" class="pathCb" value="PATENT"> PATENT</label><label style="font-size:0.34rem"><input type="checkbox" class="pathCb" value="INVEST"> INVEST</label><label style="font-size:0.34rem"><input type="checkbox" class="pathCb" value="BUSINESS"> BUSINESS</label></div><button class="btn" onclick="createProfile()">CREATE PROFILE</button></div>';
    var domains=['energy','agriculture','technology','communications','medicine','health','environment','education','finance','trade','defense','transportation','manufacturing','construction','science','research','legal','governance','space','arts'];
    var dc=document.getElementById('domainChecks');
    for(var i=0;i<domains.length;i++){var l=document.createElement('label');l.style.fontSize='0.34rem';l.innerHTML='<input type="checkbox" class="domCb" value="'+domains[i]+'"> '+domains[i];dc.appendChild(l)}
  }else{
    var fh='<div class="card"><h2>PROFILE</h2><div class="row"><span>Name</span><b>'+profile.name+'</b></div><div class="row"><span>Email</span><b>'+profile.email+'</b></div><div class="row"><span>Domains</span><b>'+(profile.selectedDomains||[]).join(', ')+'</b></div><div class="row"><span>Paths</span><b>'+(profile.selectedPaths||[]).join(', ')+'</b></div>';
    if(!profile.agreementAccepted)fh+='<button class="btn" onclick="acceptAgreement()" style="margin-top:6px">ACCEPT AGREEMENT</button>';
    if(!profile.policyAccepted)fh+='<button class="btn" onclick="acceptPolicy()">ACCEPT POLICY</button>';
    if(profile.agreementAccepted&&profile.policyAccepted&&!profile.onboardingCompletedAt)fh+='<button class="btn" onclick="complete()" style="border-color:rgba(90,181,160,0.5)">COMPLETE ONBOARDING</button>';
    fh+='</div>';
    document.getElementById('onboardForm').innerHTML=fh;
  }
  // Checklist
  var cl=ob.getOnboardingChecklist();var ch='<div class="card"><h2>CHECKLIST</h2>';
  for(var j=0;j<cl.length;j++){ch+='<div class="row"><span>'+(cl[j].completed?'<span class="check">&#10003;</span>':'<span class="uncheck">&#9675;</span>')+' '+cl[j].label+'</span></div>'}
  ch+='</div>';document.getElementById('onboardChecklist').innerHTML=ch;
}
function createProfile(){
  var ob=window.LIMENExecution.phase11.onboarding;
  var domains=[];document.querySelectorAll('.domCb:checked').forEach(function(c){domains.push(c.value)});
  var paths=[];document.querySelectorAll('.pathCb:checked').forEach(function(c){paths.push(c.value)});
  ob.createOperatorProfile({name:document.getElementById('opName').value,email:document.getElementById('opEmail').value,selectedDomains:domains,selectedPaths:paths});render();
}
function acceptAgreement(){window.LIMENExecution.phase11.onboarding.updateOperatorProfile({agreementAccepted:true});render()}
function acceptPolicy(){window.LIMENExecution.phase11.onboarding.updateOperatorProfile({policyAccepted:true});render()}
function complete(){window.LIMENExecution.phase11.onboarding.completeOnboarding();render()}
setTimeout(render,300);
</script></body></html>
