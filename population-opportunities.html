<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#050810;color:#e8e3d9;font-family:"IBM Plex Mono",monospace;height:100%;overflow-x:hidden}

/* ═══ HEADER — matches civilization nav exactly ═══ */
.opp-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 16px;border-bottom:1px solid rgba(201,169,78,0.08);
  background:rgba(5,8,16,0.95);position:sticky;top:0;z-index:100;
}
.ch-title{font-size:clamp(0.48rem,1.4vw,0.60rem);letter-spacing:4px;text-transform:uppercase;color:rgba(201,169,78,0.5)}
.ch-title a{color:rgba(201,169,78,0.45);text-decoration:none;transition:color 0.2s}
.ch-title a:hover{color:rgba(201,169,78,0.9)}
.ch-bc-sep{color:rgba(201,169,78,0.2)}
.ch-bc-active{color:rgba(201,169,78,0.7)}
.opp-nav{display:flex;gap:8px;align-items:center}
.opp-nav a,.opp-nav button{
  font-family:inherit;font-size:0.38rem;letter-spacing:1.5px;text-transform:uppercase;
  color:rgba(201,169,78,0.4);text-decoration:none;padding:3px 10px;
  border:1px solid rgba(201,169,78,0.1);border-radius:2px;background:none;cursor:pointer;
  transition:all 0.2s;
}
.opp-nav a:hover,.opp-nav button:hover{color:rgba(201,169,78,0.8);border-color:rgba(201,169,78,0.3)}

/* ═══ COMMAND STRIP ═══ */
.opp-command{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:10px 20px;border-bottom:1px solid rgba(201,169,78,0.06);
  font-size:0.45rem;letter-spacing:1.2px;color:#c0b8a5;
}
.opp-stat{color:rgba(201,169,78,0.6)}
.opp-stat-val{color:#C9A94E;font-weight:bold}
.opp-summary{flex:1;text-align:right;font-size:0.48rem;color:#d0c8b8}

/* ═══ CARD GRID ═══ */
.opp-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));
  gap:12px;padding:16px 20px;
}
@media(max-width:700px){.opp-grid{grid-template-columns:1fr}}

/* ═══ CARD ═══ */
.opp-card{
  background:#0e1018;border:1px solid rgba(201,169,78,0.08);border-radius:4px;
  padding:14px 16px;cursor:pointer;transition:border-color 0.2s;position:relative;
}
.opp-card:hover{border-color:rgba(201,169,78,0.25)}
.opp-card.selected{border-color:rgba(201,169,78,0.5);background:#111420}
.opp-card-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.opp-card-title{font-size:0.6rem;color:#e8e3d9;letter-spacing:0.5px;flex:1}
.opp-card-type{
  font-size:0.36rem;letter-spacing:1.5px;text-transform:uppercase;
  padding:2px 8px;border-radius:2px;white-space:nowrap;flex-shrink:0;
}
.type-invest{background:rgba(90,181,160,0.12);color:#5ab5a0}
.type-build{background:rgba(74,143,212,0.12);color:#4a8fd4}
.type-fund{background:rgba(201,169,78,0.12);color:#C9A94E}
.type-patent{background:rgba(168,85,247,0.12);color:#a855f7}
.type-advise{background:rgba(255,152,0,0.12);color:#FF9800}
.type-procure{background:rgba(232,84,84,0.12);color:#e85454}

.opp-card-explain{font-size:0.5rem;color:#d0c8b8;line-height:1.6;margin-bottom:8px}
.opp-card-action{
  font-size:0.48rem;color:#5ab5a0;padding:6px 10px;margin-bottom:8px;
  background:rgba(90,181,160,0.06);border-left:2px solid rgba(90,181,160,0.3);border-radius:0 2px 2px 0;
}
.opp-card-why{font-size:0.42rem;color:#c0b8a5;margin-bottom:6px}
.opp-card-value{font-size:0.45rem;color:#C9A94E;margin-bottom:4px}
.opp-card-meta{display:flex;gap:10px;flex-wrap:wrap;font-size:0.38rem;color:#a09888;letter-spacing:0.8px}
.opp-card-meta span{white-space:nowrap}
.sat-low{color:#5ab5a0}.sat-medium{color:#C9A94E}.sat-high{color:#e85454}
.opp-card-check{position:absolute;top:10px;right:10px;width:14px;height:14px;
  border:1px solid rgba(201,169,78,0.2);border-radius:2px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:0.4rem;color:#C9A94E;
}
.opp-card-check.checked{background:rgba(201,169,78,0.15);border-color:rgba(201,169,78,0.5)}

/* ═══ PLAYBOOK PANEL ═══ */
.opp-playbook{
  display:none;position:fixed;top:0;right:0;width:min(520px,90vw);height:100vh;
  background:#0a0c14;border-left:1px solid rgba(201,169,78,0.12);
  overflow-y:auto;z-index:200;padding:0;
}
.opp-playbook.open{display:block}
.opp-pb-header{
  display:flex;justify-content:space-between;align-items:center;
  padding:12px 16px;border-bottom:1px solid rgba(201,169,78,0.08);
  position:sticky;top:0;background:#0a0c14;z-index:1;
}
.opp-pb-title{font-size:0.5rem;letter-spacing:2px;color:#C9A94E;text-transform:uppercase}
.opp-pb-close{background:none;border:none;color:#666;font-size:0.7rem;cursor:pointer;padding:4px 8px}
.opp-pb-section{padding:10px 16px;border-bottom:1px solid rgba(201,169,78,0.04)}
.opp-pb-label{font-size:0.4rem;letter-spacing:2px;color:rgba(201,169,78,0.4);text-transform:uppercase;margin-bottom:4px}
.opp-pb-text{font-size:0.48rem;color:rgba(200,195,184,0.7);line-height:1.6}
.opp-pb-step{padding:3px 0 3px 12px;border-left:2px solid rgba(201,169,78,0.1);margin:3px 0;font-size:0.45rem;color:#d0c8b8}

/* ═══ ACTION BAR ═══ */
.opp-action-bar{
  display:none;position:fixed;bottom:0;left:0;right:0;
  padding:8px 20px;background:rgba(5,8,16,0.95);
  border-top:1px solid rgba(201,169,78,0.12);z-index:100;
  align-items:center;gap:12px;
}
.opp-action-bar.has-selected{display:flex}
.opp-action-count{font-size:0.45rem;color:#c0b8a5;letter-spacing:1px}
.opp-action-btn{
  font-family:inherit;font-size:0.42rem;letter-spacing:1.5px;text-transform:uppercase;
  padding:6px 16px;border-radius:2px;cursor:pointer;transition:all 0.2s;
}
.opp-action-btn.primary{background:rgba(201,169,78,0.15);border:1px solid rgba(201,169,78,0.3);color:#C9A94E}
.opp-action-btn.primary:hover{background:rgba(201,169,78,0.25)}
.opp-action-btn.disabled{background:rgba(100,100,100,0.08);border:1px solid rgba(100,100,100,0.15);color:#555;cursor:not-allowed}
.opp-action-spacer{flex:1}

/* ═══ PRINT ═══ */
@media print{
  .opp-header,.opp-action-bar,.opp-playbook,.opp-card-check{display:none!important}
  .opp-card{break-inside:avoid;border:1px solid #333}
  body{background:#fff;color:#111}
  .opp-card-title{color:#111}.opp-card-explain{color:#444}
  .opp-card-action{color:#0a6;border-color:#0a6;background:#f0faf5}
  .opp-card-value{color:#8a6d1b}
}
</style>

<script>
(function(){
'use strict';

// ═══ DYNAMIC CIK LOOKUP ═══
// Loads company-index.json once, builds ticker→{cik,slug,name} map
var _cikMap = {};    // TICKER → { cik, slug, name }
var _cikReady = false;

(function _loadCompanyIndex() {
  var xhr = new XMLHttpRequest();
  xhr.open('GET', 'assets/data/company-index.json', true);
  xhr.onload = function() {
    if (xhr.status === 200) {
      try {
        var idx = JSON.parse(xhr.responseText);
        var byTicker = idx.byTicker || {};
        var companies = idx.companies || {};
        for (var ticker in byTicker) {
          var slug = byTicker[ticker];
          var co = companies[slug];
          if (co && co.cik) {
            _cikMap[ticker] = { cik: co.cik, slug: slug, name: co.name };
          }
        }
        _cikReady = true;
        console.log('[Opportunities] CIK map loaded: ' + Object.keys(_cikMap).length + ' tickers');
      } catch (e) { console.warn('[Opportunities] CIK map parse error:', e); }
    }
  };
  xhr.onerror = function() { console.warn('[Opportunities] CIK map load failed'); };
  xhr.send();
})();

// Lookup: returns { cik, slug, name } or null
function _lookupCIK(ticker) {
  if (!ticker || ticker === 'N/A') return null;
  return _cikMap[ticker.toUpperCase()] || null;
}

// ═══ PLAYBOOK DEFINITIONS ═══
// Canonical dataset lives in assets/js/domain-brains/data/population-opportunity-playbooks.js
// (loaded above as window.LIMENPopulationOpportunityPlaybooks). Shared with
// population-brain.js so /opportunities.html projects the same rich fields.

var PLAYBOOKS = (window.LIMENPopulationOpportunityPlaybooks || []);


// ═══ DATA QUALITY ═══

function _getDataQuality(domainKeys, doms) {
  var totalSources = 0;
  var liveSources = 0;
  for (var i = 0; i < domainKeys.length; i++) {
    var d = doms[domainKeys[i]];
    if (!d || !d.sources) continue;
    for (var j = 0; j < d.sources.length; j++) {
      totalSources++;
      if (d.sources[j].live) liveSources++;
    }
  }
  if (totalSources === 0) return { live: 0, total: 0, label: 'NO DATA', color: '#e85454' };
  var ratio = liveSources / totalSources;
  var label = liveSources + '/' + totalSources + ' LIVE';
  var color = ratio >= 0.75 ? '#5ab5a0' : ratio >= 0.5 ? '#C9A94E' : '#e85454';
  if (ratio === 0) label = 'FALLBACK ONLY';
  return { live: liveSources, total: totalSources, label: label, color: color };
}

// ═══ OPPORTUNITY ACTIVATION ═══

var _selected = {};
var _oppPaperPositions = {}; // symbol → position
var _oppPaperOrders = {};    // symbol → most recent order
var _oppExposureFetched = false;
var _oppPortfolio = null;    // LIMENPortfolioContext.analyzePortfolio result

// ASSET_MAP mirror (invest-type playbook → tickers) for exposure lookup
var _OPP_INVEST_TICKERS = {
  population_collapse:['AMED','HCA','COUR'], mass_migration:[], aging_crisis:['AMED','HUM','CVS'],
  urbanization_overload:['DHI','LEN','PRCR'], pandemic_shock:['ABT','TDOC','HCA'],
  workforce_rebalancing:['COUR','RCRT'], population_governance:[], population_culture:[],
  population_data_gap:[]
};

function _fetchOppExposure() {
  fetch('/api/paper-positions')
    .then(function(r) { return r.ok ? r.json() : null; })
    .then(function(data) {
      if (data && data.positions) {
        for (var i = 0; i < data.positions.length; i++) {
          _oppPaperPositions[data.positions[i].symbol] = data.positions[i];
        }
      }
    })
    .catch(function() {});

  fetch('/api/paper-orders?status=all&limit=50')
    .then(function(r) { return r.ok ? r.json() : null; })
    .then(function(data) {
      if (data && data.orders) {
        for (var i = 0; i < data.orders.length; i++) {
          var o = data.orders[i];
          if (!_oppPaperOrders[o.symbol]) _oppPaperOrders[o.symbol] = o;
        }
      }
      _oppExposureFetched = true;
      if (window.LIMENPortfolioContext) {
        _oppPortfolio = window.LIMENPortfolioContext.analyzePortfolio(_oppPaperPositions, _oppPaperOrders);
      }
      if (_hasRendered) render(); // re-render with badges
    })
    .catch(function() { _oppExposureFetched = true; });
}

function _getOppExposureBadge(pbId) {
  if (!_oppExposureFetched) return '';
  var tickers = _OPP_INVEST_TICKERS[pbId];
  if (!tickers) return '';
  var badges = [];
  for (var i = 0; i < tickers.length; i++) {
    var t = tickers[i];
    var pos = _oppPaperPositions[t];
    var ord = _oppPaperOrders[t];
    if (pos && Number(pos.qty) > 0) {
      badges.push('<span style="font-size:0.36rem;padding:1px 5px;background:rgba(201,169,78,0.1);border:1px solid rgba(201,169,78,0.15);border-radius:2px;color:#C9A94E">' + t + ': ' + pos.qty + ' sh</span>');
    } else if (ord && (ord.status === 'new' || ord.status === 'accepted' || ord.status === 'pending_new')) {
      badges.push('<span style="font-size:0.36rem;padding:1px 5px;background:rgba(74,143,212,0.1);border:1px solid rgba(74,143,212,0.15);border-radius:2px;color:#4a8fd4">' + t + ': pending</span>');
    } else if (ord && ord.status === 'filled') {
      badges.push('<span style="font-size:0.36rem;padding:1px 5px;background:rgba(150,150,150,0.06);border:1px solid rgba(150,150,150,0.1);border-radius:2px;color:#888">' + t + ': traded</span>');
    }
  }
  if (badges.length === 0) return '';
  return '<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:4px">' + badges.join('') + '</div>';
}

function _activateOpportunities() {
  var doms = window.LIMENDomains || {};
  var cd = (window.LIMENCrossDomain && window.LIMENCrossDomain.active) ? window.LIMENCrossDomain.active : [];
  var cdPatterns = {};
  for (var ci = 0; ci < cd.length; ci++) {
    if (cd[ci].patternId) cdPatterns[cd[ci].patternId] = cd[ci];
    if (cd[ci].id) cdPatterns[cd[ci].id] = cd[ci];
    if (cd[ci].pattern) cdPatterns[cd[ci].pattern] = cd[ci];
  }

  // Domain filter: if ?domain= is set, only include playbooks touching that domain
  var domainFilter = _DOMAIN_FILTER;
  var domainSK = domainFilter ? (window.LIMENDomainIdentity ? window.LIMENDomainIdentity.snapshotKey(domainFilter) : domainFilter) : null;

  var active = [];

  for (var i = 0; i < PLAYBOOKS.length; i++) {
    var pb = PLAYBOOKS[i];

    // Apply domain filter
    if (domainFilter && pb.domains) {
      var domainMatch = false;
      for (var dfi = 0; dfi < pb.domains.length; dfi++) {
        var pbd = pb.domains[dfi];
        if (pbd === domainFilter || pbd === domainSK) { domainMatch = true; break; }
      }
      if (!domainMatch) continue;
    }
    var dominated = pb.domains;
    var isActive = false;
    var confidence = 0;
    var urgency = 'low';
    var whyNow = '';

    if (pb.pattern && cdPatterns[pb.pattern]) {
      // Cross-domain pattern is firing
      var pat = cdPatterns[pb.pattern];
      isActive = true;
      confidence = Math.round((pat.confidence || 0.5) * 100);
      urgency = (pat.severity || 0) > 0.65 ? 'high' : (pat.severity || 0) > 0.4 ? 'medium' : 'low';
      var stresses = (pat.stresses || []).map(function(s){return s.toFixed(2)});
      whyNow = (pat.domains || []).join(' + ') + ' stress: ' + stresses.join(', ');
      // Add source detail
      for (var di = 0; di < (pat.domains || []).length; di++) {
        var dd = doms[pat.domains[di]];
        if (dd && dd.sources) {
          for (var si = 0; si < dd.sources.length; si++) {
            if (dd.sources[si].live && dd.sources[si].label) {
              whyNow += ' \u00b7 ' + dd.sources[si].label;
              break;
            }
          }
        }
      }
    } else if (pb.id === 'data_infra') {
      // Special: count degraded domains
      var degraded = 0;
      for (var dk in doms) { if (doms[dk].status === 'PARTIAL' || doms[dk].status === 'FALLBACK') degraded++; }
      if (degraded >= 3) {
        isActive = true;
        confidence = Math.min(90, degraded * 15);
        urgency = degraded >= 5 ? 'high' : 'medium';
        whyNow = degraded + ' domains degraded or in fallback';
      }
    } else if (pb.id === 'treatment_gap') {
      // Special: scan for evidence gaps
      var ar = window.LIMENAnalystReport;
      if (ar && ar.domains) {
        for (var ari = 0; ari < ar.domains.length; ari++) {
          var ard = ar.domains[ari];
          if ((ard.evidenceScore || 0) >= 0.5 && (ard.treatmentCount || 0) <= 3 && (ard.diagnosticCount || 0) >= 2 && (ard.stress || 0) > 0.35) {
            isActive = true;
            confidence = Math.round((ard.evidenceScore || 0) * 100);
            urgency = ard.stress > 0.65 ? 'high' : 'medium';
            whyNow = (ard.label || ard.domainId) + ': ' + ard.diagnosticCount + ' diagnoses, only ' + ard.treatmentCount + ' treatments';
            break;
          }
        }
      }
    } else if (pb.id === 'patent_vacuum') {
      // Special: check patent report
      var reports = window.LIMENReports || {};
      var patRpt = reports.patentOpportunity;
      if (patRpt && patRpt.signals) {
        for (var pi = 0; pi < patRpt.signals.length; pi++) {
          var ps = patRpt.signals[pi];
          if (ps.type === 'temporal_gap' && (ps.opportunityScore || 0) > 0.4) {
            isActive = true;
            confidence = Math.round((ps.opportunityScore || 0) * 100);
            urgency = 'medium';
            whyNow = 'Filing gap in ' + (ps.techNode || 'tech area') + ': ' + (ps.indication || '');
            break;
          }
        }
      }
    } else {
      // Generic: check if relevant domains are stressed (threshold 0.20 post-normalization)
      var anyStressed = false;
      var topStress = 0;
      var topSrc = '';
      for (var dj = 0; dj < dominated.length; dj++) {
        var dd2 = doms[dominated[dj]];
        if (dd2 && dd2.stress > 0.20) {
          anyStressed = true;
          if (dd2.stress > topStress) {
            topStress = dd2.stress;
            topSrc = '';
            if (dd2.sources) {
              for (var sk = 0; sk < dd2.sources.length; sk++) {
                if (dd2.sources[sk].live && dd2.sources[sk].label) { topSrc = dd2.sources[sk].label; break; }
              }
            }
            if (!topSrc && dd2.signals && dd2.signals.length > 0) {
              topSrc = typeof dd2.signals[0] === 'string' ? dd2.signals[0] : (dd2.signals[0].label || '');
            }
          }
        }
      }
      if (anyStressed) {
        isActive = true;
        confidence = Math.round(Math.min(topStress * 100, 90));
        urgency = topStress > 0.65 ? 'high' : topStress > 0.4 ? 'medium' : 'low';
        whyNow = topSrc || (dominated[0] + ' stress ' + topStress.toFixed(2));
      }
    }

    var quality = _getDataQuality(dominated[0] === 'any' ? Object.keys(doms) : dominated, doms);

    if (isActive) {
      // Downgrade confidence if data quality is poor
      if (quality.live === 0 && quality.total > 0) confidence = Math.min(confidence, 20);
      active.push({
        pb: pb,
        confidence: confidence,
        urgency: urgency,
        whyNow: whyNow,
        status: 'active',
        quality: quality
      });
    } else {
      active.push({
        pb: pb,
        confidence: 0,
        urgency: 'watching',
        whyNow: 'Monitoring \u2014 triggers not yet met',
        status: 'watching',
        quality: quality
      });
    }
  }

  // Debug: log activation results
  console.log('[Opportunities] Activation results:', {
    totalPlaybooks: PLAYBOOKS.length,
    activeCount: active.length,
    domainCount: Object.keys(doms).length,
    crossDomainPatterns: cd.length,
    hasAnalystReport: !!(window.LIMENAnalystReport && window.LIMENAnalystReport.domains),
    hasPatentReport: !!(window.LIMENReports && window.LIMENReports.patentOpportunity),
    activeTitles: active.map(function(a){ return a.pb.title })
  });

  // Sort: active first (high > medium > low), then watching
  var uOrder = {high:0,medium:1,low:2,watching:3};
  active.sort(function(a,b) {
    var ua = uOrder[a.urgency] !== undefined ? uOrder[a.urgency] : 9;
    var ub = uOrder[b.urgency] !== undefined ? uOrder[b.urgency] : 9;
    if (ua !== ub) return ua - ub;
    return b.confidence - a.confidence;
  });

  return active;
}

// ═══ CONNECTOME BAR FOR CARDS ═══

function _renderConnectomeBar(opp) {
  if (!opp.connectome || opp.connectome.nodeCount === 0) return '';
  var c = opp.connectome;
  var sourceColor = c.source === 'CONNECTOME' ? '#5ab5a0' : '#666';

  var html = '<div style="margin-top:6px;padding:6px 10px;background:rgba(201,169,78,0.03);border:1px solid rgba(201,169,78,0.06);border-radius:2px;font-size:0.38rem">';

  // Row 1: source tag + node count + cross-domain
  html += '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:#888;margin-bottom:3px">';
  html += '<span style="color:' + sourceColor + ';letter-spacing:1px">' + c.source + '</span>';
  html += '<span>' + c.totalActivated + ' node' + (c.totalActivated > 1 ? 's' : '') + '</span>';
  if (c.crossDomainNodes > 0) html += '<span style="color:#C9A94E">' + c.crossDomainNodes + ' cross-domain</span>';
  html += '</div>';

  // Row 2: top nodes with their primary role (much more informative than bare IDs)
  if (c.nodes && c.nodes.length > 0) {
    html += '<div style="display:flex;gap:6px;flex-wrap:wrap">';
    for (var ni = 0; ni < Math.min(c.nodes.length, 3); ni++) {
      var nd = c.nodes[ni];
      var ndColor = nd.crossDomain ? '#C9A94E' : '#888';
      var ndRole = nd.roles && nd.roles[0] ? nd.roles[0] : '';
      html += '<span style="color:' + ndColor + '">' + nd.id;
      if (ndRole) html += ' <span style="color:#555;font-size:0.34rem">' + ndRole + '</span>';
      html += '</span>';
    }
    if (c.nodes.length > 3) html += '<span style="color:#555">+' + (c.nodes.length - 3) + '</span>';
    html += '</div>';
  }

  // Row 3: feed context — which domains are stressed and how much
  if (c.feedContext) {
    var fcKeys = Object.keys(c.feedContext);
    if (fcKeys.length > 0) {
      html += '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:3px">';
      for (var fi = 0; fi < fcKeys.length; fi++) {
        var fk = fcKeys[fi];
        var fv = c.feedContext[fk];
        var stColor = fv.stress > 0.65 ? '#e85454' : fv.stress > 0.4 ? '#C9A94E' : '#666';
        html += '<span style="color:' + stColor + '">' + fk.toUpperCase() + ' ' + (fv.stress * 100).toFixed(0) + '%</span>';
      }
      html += '</div>';
    }
  }

  html += '</div>';
  return html;
}

// Build "why this surfaced" explanation from connectome + feed data
function _buildWhySurfaced(opp) {
  if (!opp.connectome || opp.connectome.nodeCount === 0) return '';
  var c = opp.connectome;
  var parts = [];

  // Which domains triggered
  if (c.feedContext) {
    var stressedDoms = [];
    for (var dk in c.feedContext) {
      if (c.feedContext[dk].stress >= 0.35) stressedDoms.push(dk.toUpperCase() + ' (' + (c.feedContext[dk].stress * 100).toFixed(0) + '%)');
    }
    if (stressedDoms.length > 0) parts.push('Stressed domains: ' + stressedDoms.join(', '));
  }

  // Top responsible nodes
  if (c.nodes && c.nodes.length > 0) {
    var topNodeDesc = c.nodes.slice(0, 2).map(function(n) {
      return n.id + (n.roles && n.roles[0] ? ' (' + n.roles[0] + ')' : '');
    });
    parts.push('Key nodes: ' + topNodeDesc.join(', '));
  }

  // Business relevance
  if (c.businessMappings && c.businessMappings.length > 0) {
    var sectors = c.businessMappings.slice(0, 2).map(function(bm) { return bm.role; });
    parts.push('Sector relevance: ' + sectors.join(', '));
  }

  if (parts.length === 0) return '';
  return '<div style="margin-top:4px;font-size:0.36rem;color:#666;line-height:1.5">' + parts.join(' \u00b7 ') + '</div>';
}

    summaryText = activeCount + ' live opportunit' + (activeCount > 1 ? 'ies' : 'y') + ' generated from Population intelligence at ' + ePct + '% sector stress. ';

  } else if (watchCount > 0) {
    summaryText = 'Pipeline quiet. ' + watchCount + ' opportunities in monitoring state. Population stress at ' + ePct + '% (' + eSev + ') \u2014 ';

  } else {
    summaryText = 'No opportunities in pipeline. Population stress: ' + ePct + '%. Signal confidence: ' + Math.round((F.confidence || 0) * 100) + '%. Feed coverage may be insufficient to generate actionable positions.';
  }

  cmd.innerHTML =

    '<span class="opp-stat">Urgent: <span class="opp-stat-val" style="color:#e85454">' + highCount + '</span></span>' +
    (connectomeCount > 0 ? '<span class="opp-stat">Connectome: <span class="opp-stat-val" style="color:#5ab5a0">' + connectomeCount + '</span></span>' : '') +
    '<span class="opp-stat">Watching: <span class="opp-stat-val" style="color:#666">' + watchCount + '</span></span>' +
    '<span class="opp-stat" style="color:' + eSevC + '">' + eSev + ': <span class="opp-stat-val">' + ePct + '%</span></span>' +
    '<span class="opp-summary">' + summaryText + '</span>';

  // Cards
  var grid = document.getElementById('oppGrid');
  grid.innerHTML = '';
  for (var i = 0; i < opps.length; i++) {
    var o = opps[i];
    var pb = o.pb;
    var typeClass = 'type-' + pb.type;

    var isWatching = o.status === 'watching';
    var card = document.createElement('div');
    card.className = 'opp-card' + (_selected[pb.id] ? ' selected' : '');
    if (isWatching) card.style.opacity = '0.5';
    card.setAttribute('data-id', pb.id);
    card.setAttribute('data-idx', i);

    var urgColor = o.urgency === 'high' ? '#e85454' : o.urgency === 'medium' ? '#C9A94E' : o.urgency === 'watching' ? '#555' : '#5ab5a0';
    var satClass = 'sat-' + pb.saturation;
    var statusLabel = isWatching ? 'WATCHING' : o.urgency.toUpperCase();

    // Source indicator for connectome vs domain-only
    var sourceIndicator = '';
    if (o.connectome && o.connectome.source === 'CONNECTOME') {
      sourceIndicator = '<span style="font-size:0.34rem;padding:1px 5px;background:rgba(90,181,160,0.08);border:1px solid rgba(90,181,160,0.12);border-radius:2px;color:#5ab5a0;margin-left:6px">CONNECTOME</span>';
    }

    card.innerHTML =
      '<div class="opp-card-check' + (_selected[pb.id] ? ' checked' : '') + '" onclick="toggleSelect(event,\'' + pb.id + '\')">' + (_selected[pb.id] ? '\u2713' : '') + '</div>' +
      '<div class="opp-card-header">' +
        '<div class="opp-card-title">' + pb.title + sourceIndicator + '</div>' +
        '<span class="opp-card-type ' + typeClass + '">' + pb.type.toUpperCase() + '</span>' +
      '</div>' +
      '<div class="opp-card-explain">' + pb.explain + '</div>' +
      (isWatching ? '' : '<div class="opp-card-action">' + pb.action + '</div>') +
      '<div class="opp-card-why">' + (isWatching ? 'STATUS: Monitoring \u2014 ' + DOMAIN_LABEL + ' stress at ' + ePct + '% (' + eSev + '). Trigger threshold not reached. Will activate if sector pressure escalates or cross-domain convergence fires.' : 'WHY NOW: ' + o.whyNow) + '</div>' +
      (isWatching ? '' : '<div class="opp-card-value">POTENTIAL: ' + pb.valueRange + '</div>') +
      (!isWatching && o.confidence ? '<div style="font-size:0.36rem;color:#908878;margin-top:2px">INVALIDATES IF: ' + DOMAIN_LABEL + ' stress drops below 20% or triggering domain conditions resolve. Confidence: ' + o.confidence + '%.</div>' : '') +
      '<div class="opp-card-meta">' +
        '<span style="color:' + (o.quality ? o.quality.color : '#666') + '">' + (o.quality ? o.quality.label : '') + '</span>' +
        '<span class="' + satClass + '">SATURATION: ' + pb.saturation.toUpperCase() + '</span>' +
        (isWatching ? '' : '<span>CONF: ' + o.confidence + '%</span>') +
        '<span style="color:' + urgColor + '">' + statusLabel + '</span>' +
        '<span>' + pb.domains.join(' \u00d7 ').toUpperCase() + '</span>' +
        '<span>' + pb.window + '</span>' +
      '</div>' +
      _renderConnectomeBar(o) +
      (isWatching ? '' : _buildWhySurfaced(o));

    // Add invest button, exposure badges, and concentration context for invest-type active opportunities
    if (!isWatching && pb.type === 'invest') {
      var expBadgeHtml = _getOppExposureBadge(pb.id);
      if (expBadgeHtml) {
        var expDiv = document.createElement('div');
        expDiv.innerHTML = expBadgeHtml;
        card.appendChild(expDiv.firstChild);
      }
      // Portfolio concentration badge
      if (_oppPortfolio && _oppPortfolio.totalPositions > 0 && window.LIMENPortfolioContext) {
        var qb = window.LIMENPortfolioContext.quickBadge(pb.id, _oppPortfolio);
        if (qb.text) {
          var concSpan = document.createElement('div');
          concSpan.style.cssText = 'font-size:0.36rem;margin-top:4px;padding:2px 6px;border-radius:2px;color:' + qb.color + ';background:rgba(255,255,255,0.02);border:1px solid ' + qb.color + '22';
          concSpan.textContent = qb.text;
          card.appendChild(concSpan);
        }
      }
      var investBtn = document.createElement('button');
      investBtn.style.cssText = 'display:block;width:100%;margin-top:8px;padding:6px;font-family:inherit;font-size:0.4rem;letter-spacing:1.5px;text-transform:uppercase;background:rgba(90,181,160,0.1);border:1px solid rgba(90,181,160,0.25);color:#5ab5a0;border-radius:2px;cursor:pointer;transition:all 0.2s';
      investBtn.textContent = 'OPEN INVESTMENT CONSOLE \u2192';
      investBtn.addEventListener('click', (function(oppObj){ return function(e) {
        e.stopPropagation();
        try { sessionStorage.setItem('limen_invest_opp', JSON.stringify(oppObj)); } catch(ex) {}
        window.location.href = 'investment-console.html?opp=' + encodeURIComponent(oppObj.pb.id) + '&source=' + _DOMAIN_FILTER + '&returnTo=' + encodeURIComponent('/' + _DOMAIN_FILTER + '-opportunities');
      }})(o));
      card.appendChild(investBtn);
    }

    // ── STAR RATING + LEGITIMACY METRICS (always visible) ──
    var metricsDiv = document.createElement('div');
    metricsDiv.innerHTML = _buildStarRating(o, i) + _buildLegitimacyMetrics(o);
    card.appendChild(metricsDiv);

    // ── PIPELINE VERDICT (always visible) ──
    var pipeDiv = document.createElement('div');
    pipeDiv.innerHTML = _buildPipelineVerdict(o);
    card.appendChild(pipeDiv);

    // ── ACTION STACK (always visible — internal-first) ──
    if (o.status === 'active') {
      var stackDiv = document.createElement('div');
      stackDiv.innerHTML = _buildActionStack(o);
      card.appendChild(stackDiv);
    }

    // ── EXECUTION BLOCK (internal mode only) ──
    if (_isInternalMode()) {

      execDiv.innerHTML = _buildExecutionBlock(o);
      card.appendChild(execDiv);
    }

    card.addEventListener('click', (function(idx){ return function(e) {
      if (e.target.classList.contains('opp-card-check')) return;

      openPlaybook(idx);

    grid.appendChild(card);
  }

  _updateActionBar();
  window._oppData = opps;
  _injectStarRatings();
  // Top 3 section removed — stars in main card list are sufficient
  var _tsEl = document.getElementById('oppLastUpdated');
  if (_tsEl) _tsEl.textContent = 'Updated: ' + new Date().toLocaleString();
}

function toggleSelect(e, id) {
  e.stopPropagation();
  _selected[id] = !_selected[id];
  render();
}

function _updateActionBar() {
  var count = Object.keys(_selected).filter(function(k){return _selected[k]}).length;
  var bar = document.getElementById('oppActionBar');
  bar.style.display = count > 0 ? 'flex' : 'none';
  document.getElementById('oppSelectedCount').textContent = count + ' selected';
}

  html += '<div class="opp-pb-section"><div class="opp-pb-label">VALIDATION</div><div class="opp-pb-text">' + pb.validation + '</div></div>';

  html += '<div class="opp-pb-section"><div class="opp-pb-label">EXECUTION STEPS</div>';
  for (var si = 0; si < pb.steps.length; si++) {
    html += '<div class="opp-pb-step">' + (si+1) + '. ' + pb.steps[si] + '</div>';
  }
  html += '</div>';

  html += '<div class="opp-pb-section"><div class="opp-pb-label">IF STRENGTHENS</div><div class="opp-pb-text">' + pb.branch_up + '</div></div>';
  html += '<div class="opp-pb-section"><div class="opp-pb-label">IF WEAKENS</div><div class="opp-pb-text">' + pb.branch_down + '</div></div>';
  html += '<div class="opp-pb-section"><div class="opp-pb-label">EXPECTED OUTCOME</div><div class="opp-pb-text">' + pb.outcome + '</div></div>';

  html += '<div class="opp-pb-section"><div class="opp-pb-label">CONFIDENCE</div><div class="opp-pb-text">' + o.confidence + '%</div></div>';
  html += '<div class="opp-pb-section"><div class="opp-pb-label">MARKET SATURATION</div><div class="opp-pb-text">' + pb.saturation.toUpperCase() + '</div></div>';

  // FAST PATH — 3-step immediate execution
  if (pb.fastPath && pb.fastPath.length > 0) {
    html += '<div class="opp-pb-section" style="background:rgba(90,181,160,0.04);border-left:3px solid rgba(90,181,160,0.3)">';

    html += '<div class="opp-pb-section"><div class="opp-pb-label">REAL-WORLD ACTIONS</div>';

  if (pb.examples && pb.examples.length > 0) {
    html += '<div class="opp-pb-section"><div class="opp-pb-label">EXAMPLES</div>';

    }
    html += '</div>';
  }

  // WHY THIS SURFACED
  if (o.connectome && o.connectome.feedContext) {
    var fc = o.connectome.feedContext;
    var fcKeys = Object.keys(fc);
    if (fcKeys.length > 0) {
      html += '<div class="opp-pb-section" style="border-left:3px solid rgba(201,169,78,0.2)">';
      html += '<div class="opp-pb-label">WHY THIS SURFACED</div>';

      // Feed domains that triggered
      html += '<div style="margin-bottom:6px">';
      for (var fci = 0; fci < fcKeys.length; fci++) {
        var fdk = fcKeys[fci];
        var fdv = fc[fdk];
        var fdColor = fdv.stress > 0.65 ? '#e85454' : fdv.stress > 0.4 ? '#C9A94E' : '#5ab5a0';

        html += '<span style="color:' + fdColor + '">' + (fdv.stress * 100).toFixed(0) + '% ' + fdv.status + '</span>';
        html += '</div>';
      }
      html += '</div>';

      // Connectome domains mapped
      if (window.LIMENConnectomeResolver) {
        var connectomeDoms = [];
        for (var cdi = 0; cdi < fcKeys.length; cdi++) {
          var mapped = window.LIMENConnectomeResolver.getConnectomeDomains(fcKeys[cdi]);
          for (var mi = 0; mi < mapped.length; mi++) {
            if (connectomeDoms.indexOf(mapped[mi]) === -1) connectomeDoms.push(mapped[mi]);
          }
        }
        if (connectomeDoms.length > 0) {
          html += '<div style="font-size:0.38rem;color:#666;margin-bottom:4px">Connectome domains: ' + connectomeDoms.join(', ') + '</div>';
        }
      }

      // Node-level explanation
      var c = o.connectome;
      if (c.nodes && c.nodes.length > 0) {
        html += '<div style="font-size:0.38rem;color:#666;margin-bottom:3px">Top nodes driving this opportunity:</div>';
        for (var tni = 0; tni < Math.min(c.nodes.length, 3); tni++) {
          var tn = c.nodes[tni];
          html += '<div style="font-size:0.42rem;color:#bbb;padding:1px 0">';
          html += '<span style="color:' + (tn.crossDomain ? '#C9A94E' : '#888') + ';font-weight:bold">' + tn.id + '</span> ';

          html += ' <span style="color:#555">(' + tn.feedDomains.join(', ') + ')</span>';
          html += '</div>';
        }
      }

      // Sector relevance from business mappings
      if (c.businessMappings && c.businessMappings.length > 0) {
        var sectors = c.businessMappings.slice(0, 3).map(function(bm) { return bm.role; });
        html += '<div style="font-size:0.38rem;color:#666;margin-top:4px">Sector relevance: <span style="color:#bbb">' + sectors.join(', ') + '</span></div>';
      }

      html += '</div>';
    }
  }

  // CONNECTOME GROUNDING (full detail)
  if (o.connectome && o.connectome.nodeCount > 0) {
    var c = o.connectome;

    html += '<div class="opp-pb-section" style="background:rgba(201,169,78,0.03);border-left:3px solid rgba(201,169,78,0.15)">';
    html += '<div class="opp-pb-label" style="color:#C9A94E">CONNECTOME GROUNDING</div>';
    html += '<div style="font-size:0.42rem;display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px">';
    html += '<span style="color:' + (c.source === 'CONNECTOME' ? '#5ab5a0' : '#888') + '">' + c.source + '</span>';
    html += '<span style="color:#C9A94E">' + c.totalActivated + ' nodes</span>';

// ── LEGITIMACY METRICS (always visible on every card) ──────────────────────

function _computeLegitimacy(o) {
  var pb = o.pb;
  var doms = window.LIMENDomains || {};
  var quality = o.quality || { live: 0, total: 0 };

  // Signal Integrity
  var sigInt = 'INFERRED';
  if (quality.live > 0 && quality.total > 0) {
    var ratio = quality.live / quality.total;
    if (ratio >= 0.75) sigInt = 'LIVE';
    else if (ratio >= 0.5) sigInt = 'PARTIAL';
  }
  if (quality.total === 0) sigInt = 'SIMULATED';

  // Entity Support — check if playbook has CIK-backed companies in examples or tickers
  var tickers = _OPP_INVEST_TICKERS[pb.id] || [];
  var entSupport = 'NONE';
  if (tickers.length > 0 && pb.examples && pb.examples.length > 0) entSupport = 'MAPPED';
  else if (pb.examples && pb.examples.length > 0) entSupport = 'PARTIAL';

  // Market Timing — use market stress triage if available
  var mkt = window.LIMENMarketStressTriage;
  var timing = 'EARLY';
  if (mkt) {
    var combined = mkt.combined || 0;
    var mode = mkt.mode || 'neutral';
    if (mode === 'opportunity' || (combined < 0.30 && o.status === 'active')) timing = 'ALIGNED';
    else if (combined > 0.60 || mode === 'defensive') timing = 'CONFLICTED';
    else timing = 'EARLY';
  } else {
    timing = o.status === 'active' ? 'EARLY' : 'EARLY';
  }

  // Invalidation Risk — based on data quality + confidence spread
  var invalidation = 'UNKNOWN';
  if (o.status === 'watching') {
    invalidation = 'UNKNOWN';
  } else if (sigInt === 'SIMULATED' || quality.live === 0) {
    invalidation = 'HIGH';
  } else if (o.confidence < 40 || sigInt === 'INFERRED') {
    invalidation = 'MED';
  } else if (o.confidence >= 60 && sigInt === 'LIVE') {
    invalidation = 'LOW';
  } else {
    invalidation = 'MED';
  }

  return { signalIntegrity: sigInt, entitySupport: entSupport, marketTiming: timing, invalidationRisk: invalidation };
}

function _buildLegitimacyMetrics(o) {
  var m = _computeLegitimacy(o);
  var colors = {
    LIVE:'#5ab5a0', PARTIAL:'#C9A94E', INFERRED:'#888', SIMULATED:'#e85454',
    NONE:'#e85454', MAPPED:'#5ab5a0',
    ALIGNED:'#5ab5a0', EARLY:'#C9A94E', CONFLICTED:'#e85454',
    LOW:'#5ab5a0', MED:'#C9A94E', HIGH:'#e85454', UNKNOWN:'#555'
  };
  var h = '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;padding-top:6px;border-top:1px solid rgba(201,169,78,0.06)">';
  h += '<span style="font-size:0.3rem;letter-spacing:1px;color:' + (colors[m.signalIntegrity]||'#888') + '">SIG:' + m.signalIntegrity + '</span>';
  h += '<span style="font-size:0.3rem;letter-spacing:1px;color:' + (colors[m.entitySupport]||'#888') + '">ENT:' + m.entitySupport + '</span>';

// ── PIPELINE VERDICT (always visible) ──────────────────────────────────────

function _buildPipelineVerdict(o) {
  var m = _computeLegitimacy(o);
  var verdict, color;

  if (o.status === 'watching') {
    verdict = 'MONITORING'; color = '#555';
  } else if (o.confidence >= 60 && m.signalIntegrity === 'LIVE' && m.invalidationRisk === 'LOW') {
    verdict = 'HIGH POTENTIAL'; color = '#5ab5a0';
  } else if (o.confidence >= 35 && (m.signalIntegrity === 'LIVE' || m.signalIntegrity === 'PARTIAL')) {
    verdict = 'DEVELOPING'; color = '#C9A94E';
  } else {
    verdict = 'SPECULATIVE'; color = '#888';
  }

  return '<div style="margin-top:4px;font-size:0.34rem;letter-spacing:2px;color:' + color + '">' + verdict + '</div>';
}

// ── INTERNAL ACTION SIGNAL (internal mode only) ───────────────────────────

function _computeActionSignal(o) {
  if (o.status === 'watching') return { signal: 'HOLD', color: '#555' };
  var m = _computeLegitimacy(o);

  // Language control: NEVER imply certainty when data is weak
  if (m.invalidationRisk === 'HIGH' || m.marketTiming === 'CONFLICTED') {
    return { signal: 'HOLD', color: '#888' };
  }
  if (m.signalIntegrity === 'SIMULATED' || m.entitySupport === 'NONE') {
    return { signal: 'EXPLORE', color: '#C9A94E' };
  }
  if (o.confidence >= 60 && m.signalIntegrity === 'LIVE' && m.invalidationRisk === 'LOW' && m.marketTiming !== 'CONFLICTED') {
    return { signal: 'ACT NOW', color: '#5ab5a0' };
  }
  if (o.confidence >= 40 && m.signalIntegrity !== 'SIMULATED') {
    return { signal: 'STAGE', color: '#4a8fd4' };
  }
  return { signal: 'EXPLORE', color: '#C9A94E' };
}

// ── OUTCOME-ADJUSTED RANKING ─────────────────────────────────────────
// Reads pathway weights from localStorage (written by console-clarity outcome loop).
// Applies same hub-specificity + direct/transfer logic as console-clarity.

var _OPP_PATHWAY_MAP = {
  energy: ['THAL','dlPFC','BLA'], health: ['NTS','AI','HIPP'],
  finance: ['BLA','vmPFC','NAcc'], technology: ['dlPFC','THAL','BDNF'],
  defense: ['BLA','PAG','dACC'], environment: ['NTS','THAL','AI'],
  education: ['HIPP','PCC','DMN'], governance: ['dlPFC','dACC','mPFC'],
  industry: ['THAL','dlPFC','GP'], trade: ['THAL','dlPFC','NAcc']
};
var _OPP_HUB_FREQ = {};
(function() {
  for (var d in _OPP_PATHWAY_MAP) {
    for (var i = 0; i < _OPP_PATHWAY_MAP[d].length; i++) {
      _OPP_HUB_FREQ[_OPP_PATHWAY_MAP[d][i]] = (_OPP_HUB_FREQ[_OPP_PATHWAY_MAP[d][i]] || 0) + 1;
    }
  }
})();

function _oppOutcomeFactor(domains) {
  var weights;
  try { weights = JSON.parse(localStorage.getItem('limen_pathway_weights') || '{}'); } catch(e) { return 1.0; }
  var domain = domains && domains[0] ? domains[0] : '';
  var nodes = _OPP_PATHWAY_MAP[domain];
  if (!nodes) return 1.0; // unmapped = no adjustment
  var nodeFactors = [];
  for (var i = 0; i < nodes.length; i++) {
    var w = weights[nodes[i]];
    if (!w || !w.total) continue;
    var raw = w.factor;
    var isDirect = w.domains && w.domains[domain];
    if (isDirect) {
      nodeFactors.push(raw);
    } else {
      var spec = 1 / Math.sqrt(_OPP_HUB_FREQ[nodes[i]] || 1);
      nodeFactors.push(1.0 + (raw - 1.0) * spec);
    }
  }
  if (nodeFactors.length === 0) return 1.0;
  nodeFactors.sort(function(a, b) { return Math.abs(b - 1.0) - Math.abs(a - 1.0); });
  var anchor = nodeFactors[0];
  if (nodeFactors.length === 1) return Math.max(0.8, Math.min(1.2, anchor));
  var restSum = 0;
  for (var j = 1; j < nodeFactors.length; j++) restSum += nodeFactors[j];
  var blended = anchor * 0.6 + (restSum / (nodeFactors.length - 1)) * 0.4;
  return Math.max(0.8, Math.min(1.2, blended));
}

// ── STAR RATING (top 5 active opportunities) ──────────────────────────

function _buildStarRating(o, cardIndex) {
  if (o.status !== 'active') return '';
  // Score: confidence + urgency + data quality
  var score = o.confidence;
  if (o.urgency === 'high') score += 20;
  else if (o.urgency === 'medium') score += 10;
  if (o.quality && o.quality.live > 0) score += 10;
  // Apply outcome-adjusted factor from pathway weights
  var factor = _oppOutcomeFactor(o.pb ? o.pb.domains : []);
  score = Math.round(score * factor);
  o._rankScore = score;
  return ''; // actual stars rendered in _injectStarRatings after all cards scored
}

function _injectStarRatings() {
  var opps = window._oppData;
  if (!opps) return;
  var active = opps.filter(function(o) { return o.status === 'active' && o._rankScore; });
  active.sort(function(a, b) { return b._rankScore - a._rankScore; });
  var top5 = active.slice(0, 5);
  for (var i = 0; i < top5.length; i++) {
    var idx = opps.indexOf(top5[i]);
    var card = document.querySelector('[data-idx="' + idx + '"]');
    if (!card) continue;
    var stars = 5 - i; // 5 stars for #1, 4 for #2, etc.
    var starStr = '';
    for (var s = 0; s < stars; s++) starStr += '\u2605';
    for (var e = stars; e < 5; e++) starStr += '\u2606';
    var badge = document.createElement('div');
    badge.style.cssText = 'position:absolute;top:6px;right:6px;font-size:0.5rem;color:#C9A94E;letter-spacing:2px';
    badge.textContent = starStr;
    card.style.position = 'relative';
    card.appendChild(badge);
  }
}
