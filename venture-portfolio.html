<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>LIMEN HELIX · Venture Portfolio</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#050810;color:#e8e3d9;font-family:"IBM Plex Mono",monospace;padding:20px 24px;max-width:900px;margin:0 auto;font-size:12px;line-height:1.7}h1{font-size:0.6rem;letter-spacing:4px;color:#C9A94E;margin-bottom:4px}p{font-size:0.4rem;color:#b0a898;margin-bottom:12px}table{width:100%;border-collapse:collapse;margin:12px 0}th{font-size:0.30rem;letter-spacing:1.5px;color:rgba(201,169,78,0.4);padding:4px 8px;border-bottom:1px solid rgba(201,169,78,0.1);text-align:left}td{padding:5px 8px;border-bottom:1px solid rgba(255,255,255,0.02);font-size:0.38rem;color:#c0b8a5}.stats{display:flex;gap:16px;margin:12px 0;font-size:0.36rem;flex-wrap:wrap}.stat{color:#807868}.stat b{color:#d0c8b8}a{color:rgba(201,169,78,0.5);text-decoration:none}.add-form{padding:12px;border:1px solid rgba(201,169,78,0.08);border-radius:3px;margin:12px 0}input,select{padding:4px 8px;background:#0a0c14;border:1px solid rgba(201,169,78,0.12);border-radius:2px;color:#e8e3d9;font-family:inherit;font-size:0.36rem;margin-bottom:4px;width:100%}.btn{font-family:inherit;font-size:0.34rem;padding:6px 12px;border-radius:2px;cursor:pointer;border:1px solid rgba(90,181,160,0.3);background:rgba(90,181,160,0.08);color:#5ab5a0}@media print{body{background:white;color:black}}</style></head>
<body>
<a href="/domain-console?domain=energy&mode=operator" style="font-size:0.34rem;display:block;margin-bottom:12px">&larr; Back</a>
<h1>VENTURE PORTFOLIO</h1>
<p>Companies created or supported through LIMEN domain execution.</p>

<div class="stats" id="portfolioStats"></div>
<table><thead><tr><th>COMPANY</th><th>DOMAIN</th><th>OWNERSHIP</th><th>STATUS</th><th>CREATED</th></tr></thead><tbody id="portfolioBody"></tbody></table>

<div class="add-form">
<div style="font-size:0.28rem;letter-spacing:2px;color:rgba(201,169,78,0.4);margin-bottom:6px">ADD PORTFOLIO COMPANY</div>
<input id="pcoName" placeholder="Company name">
<input id="pcoDomain" placeholder="Domain (e.g., energy, medicine)">
<input id="pcoOwnership" placeholder="Ownership % (e.g., 30)" type="number">
<input id="pcoNotes" placeholder="Notes">
<button class="btn" id="pcoAdd">ADD COMPANY</button>
</div>

<script src="assets/js/execution-portfolio-shell.js"></script>
<script>
(function(){
  var pf = window.LIMENExecution && window.LIMENExecution.phase4 && window.LIMENExecution.phase4.portfolio;
  if (!pf) return;

  function render() {
    var all = pf.getAllCompanies();
    var stats = pf.getStats();
    document.getElementById('portfolioStats').innerHTML =
      '<span class="stat">Total: <b>' + stats.total + '</b></span>' +
      '<span class="stat">Forming: <b>' + stats.forming + '</b></span>' +
      '<span class="stat" style="color:#5ab5a0">Active: <b>' + stats.active + '</b></span>' +
      '<span class="stat">Exited: <b>' + stats.exited + '</b></span>';

    var h = '';
    for (var i = 0; i < all.length; i++) {
      var c = all[i];
      h += '<tr><td>' + (c.name || '') + '</td><td>' + (c.domain || '').toUpperCase() + '</td><td>' + (c.ownershipPct || 0) + '%</td><td>' + (c.status || '').toUpperCase() + '</td><td>' + new Date(c.createdAt).toLocaleDateString() + '</td></tr>';
    }
    if (all.length === 0) h = '<tr><td colspan="5" style="color:#706860">No portfolio companies yet.</td></tr>';
    document.getElementById('portfolioBody').innerHTML = h;
  }

  document.getElementById('pcoAdd').addEventListener('click', function() {
    var name = document.getElementById('pcoName').value;
    if (!name) return;
    pf.addCompany({ name: name, domain: document.getElementById('pcoDomain').value, ownershipPct: parseInt(document.getElementById('pcoOwnership').value) || 30, notes: document.getElementById('pcoNotes').value });
    document.getElementById('pcoName').value = '';
    document.getElementById('pcoDomain').value = '';
    document.getElementById('pcoOwnership').value = '';
    document.getElementById('pcoNotes').value = '';
    render();
  });

  render();
})();
</script></body></html>
