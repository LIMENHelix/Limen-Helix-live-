<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Relay Vinted Scraper</title>
<style>
  :root {
    --bg: #f8f7f5;
    --card: #ffffff;
    --line: #e5e0d8;
    --ink: #1a1512;
    --soft: #6b6359;
    --accent: #2563eb;
    --green: #059669;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; }

  header {
    background: var(--card);
    border-bottom: 1px solid var(--line);
    padding: 24px 32px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .branding {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }
  .logo {
    font-size: 1.6rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0;
  }
  .byline {
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--soft);
    margin-top: 2px;
    font-weight: 600;
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 32px;
  }

  h1 {
    font-size: 1.8rem;
    margin: 0 0 8px;
    font-weight: 800;
  }
  .subtitle {
    color: var(--soft);
    font-size: 0.95rem;
    margin-bottom: 32px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 24px;
    margin-bottom: 24px;
  }
  .card h2 {
    font-size: 1rem;
    margin: 0 0 16px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-size: 0.8rem;
    font-weight: 600;
  }

  .form-group {
    margin-bottom: 16px;
  }
  .form-group label {
    display: block;
    font-weight: 600;
    margin-bottom: 6px;
    font-size: 0.9rem;
  }
  .form-group input,
  .form-group select,
  .form-group textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 0.9rem;
    font-family: inherit;
  }
  .form-group input:focus,
  .form-group select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
  }

  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  @media(max-width: 768px) {
    .form-row { grid-template-columns: 1fr; }
  }

  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 12px 24px;
    font-weight: 700;
    cursor: pointer;
    font-size: 0.95rem;
    transition: background 0.2s;
  }
  button:hover { background: #1d4ed8; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .status-msg {
    padding: 12px 16px;
    border-radius: 6px;
    margin-bottom: 16px;
    font-size: 0.9rem;
  }
  .status-msg.ok { background: #d1fae5; color: #047857; }
  .status-msg.err { background: #fee2e2; color: #dc2626; }
  .status-msg.info { background: #cffafe; color: #0e7490; }

  .results {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 16px;
    max-height: 400px;
    overflow-y: auto;
  }
  .result-item {
    padding: 12px;
    border-bottom: 1px solid var(--line);
    font-size: 0.9rem;
  }
  .result-item:last-child { border-bottom: none; }
  .result-item .title { font-weight: 600; }
  .result-item .price { color: var(--accent); font-weight: 700; }
  .result-item .meta { color: var(--soft); font-size: 0.8rem; margin-top: 4px; }

  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 16px;
  }
  .stat {
    background: var(--bg);
    padding: 12px;
    border-radius: 6px;
    border: 1px solid var(--line);
  }
  .stat-label { color: var(--soft); font-size: 0.8rem; }
  .stat-value { font-size: 1.4rem; font-weight: 700; color: var(--accent); }

  footer {
    background: var(--card);
    border-top: 1px solid var(--line);
    padding: 32px;
    text-align: center;
    color: var(--soft);
    font-size: 0.85rem;
    margin-top: 48px;
  }
  .footer-brand {
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 8px;
  }
</style>
</head>
<body>

<header>
  <div class="branding">
    <div class="logo">Relay</div>
    <div class="byline">Vinted Scraper</div>
  </div>
</header>

<nav style="background: white; border-bottom: 1px solid #ddd; padding: 12px 20px; position: sticky; top: 0; z-index: 98;">
  <div style="max-width: 1200px; margin: 0 auto; display: flex; gap: 20px; font-size: 0.95rem;">
    <a href="/relay" style="color: #666; text-decoration: none;">Storefront</a>
    <a href="/relay-checkout" style="color: #666; text-decoration: none;">Checkout</a>
    <a href="/api/relay-admin-page" style="color: #666; text-decoration: none;">Admin</a>
    <a href="/merchant-onboarding" style="color: #666; text-decoration: none;">Merchants</a>
    <a href="/relay-margin.html" style="color: #666; text-decoration: none;">Margin</a>
    <a href="/relay-marketplace-control.html" style="color: #666; text-decoration: none;">Settings</a>
  </div>
</nav>

<div class="container">
  <h1>Vinted Scraper</h1>
  <p class="subtitle">Search Vinted listings and import to your Relay marketplace</p>

  <div id="statusMsg"></div>

  <div class="card">
    <h2>Search Settings</h2>
    <div class="form-group">
      <label>Search Query</label>
      <input type="text" id="searchQuery" placeholder="e.g. vintage jacket, leather boots" required />
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Marketplace ID</label>
        <input type="text" id="marketplaceId" placeholder="e.g. mkt_1787335292880_bm7h5jy" />
      </div>
      <div class="form-group">
        <label>Seller ID</label>
        <input type="text" id="sellerId" placeholder="e.g. seller_1234567890" />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Max Items to Scrape</label>
        <input type="number" id="maxItems" min="1" max="100" value="20" />
      </div>
      <div class="form-group">
        <label>Delay Between Posts (ms)</label>
        <input type="number" id="delayMs" min="500" step="100" value="1000" />
      </div>
    </div>

    <div class="form-group">
      <label>
        <input type="checkbox" id="includeSource" checked />
        Include Vinted link in listing description
      </label>
    </div>

    <div style="display: flex; gap: 12px;">
      <button onclick="searchVinted()">Search Vinted</button>
      <button onclick="scrapeAndPost()" style="background: var(--green);">Scrape & Post to Relay</button>
    </div>
  </div>

  <div class="card">
    <h2>Search Results</h2>
    <div id="resultsContainer" style="min-height: 100px; color: var(--soft);">Ready to search...</div>
  </div>
</div>

<footer>
  <div class="footer-brand">Relay Vinted Scraper</div>
  <div>Automated listing import from Vinted</div>
</footer>

<script>
function getSettings() {
  return {
    query: document.getElementById('searchQuery').value,
    marketplaceId: document.getElementById('marketplaceId').value || 'mkt_1787335292880_bm7h5jy',
    sellerId: document.getElementById('sellerId').value || 'scraper_seller_' + Date.now(),
    maxItems: parseInt(document.getElementById('maxItems').value) || 20,
    delayMs: parseInt(document.getElementById('delayMs').value) || 1000,
    includeSource: document.getElementById('includeSource').checked
  };
}

function showStatus(msg, type) {
  const el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.className = 'status-msg ' + type;
}

function showResults(items) {
  const container = document.getElementById('resultsContainer');
  if (items.length === 0) {
    container.innerHTML = '<p style="color: var(--soft);">No items found</p>';
    return;
  }

  const html = items.map(item => `
    <div class="result-item">
      <div class="title">${item.title}</div>
      <div class="price">$${item.price.toFixed(2)}</div>
      <div class="meta">Condition: ${item.condition} | Category: ${item.category || 'unknown'}</div>
    </div>
  `).join('');

  container.innerHTML = `
    <div style="margin-bottom: 16px; font-weight: 600;">${items.length} items found</div>
    <div class="results">${html}</div>
  `;
}

async function searchVinted() {
  const settings = getSettings();
  if (!settings.query.trim()) {
    showStatus('Enter a search query', 'err');
    return;
  }

  showStatus('Searching Vinted...', 'info');

  try {
    const r = await fetch('/api/relay-vinted-scraper', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'search',
        query: settings.query,
        maxItems: settings.maxItems
      })
    });

    const j = await r.json();
    if (j.ok) {
      showStatus(`Found ${j.items.length} items on Vinted`, 'ok');
      showResults(j.items);
    } else {
      showStatus('Search failed: ' + (j.error || 'unknown error'), 'err');
    }
  } catch (e) {
    showStatus('Error: ' + e.message, 'err');
  }
}

async function scrapeAndPost() {
  const settings = getSettings();
  if (!settings.query.trim()) {
    showStatus('Enter a search query', 'err');
    return;
  }

  showStatus('Scraping Vinted and posting to Relay...', 'info');

  try {
    const r = await fetch('/api/relay-vinted-scraper', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'scrape-and-post',
        query: settings.query,
        marketplaceId: settings.marketplaceId,
        sellerId: settings.sellerId,
        maxItems: settings.maxItems,
        includeSource: settings.includeSource,
        delayMs: settings.delayMs
      })
    });

    const j = await r.json();
    if (j.ok) {
      const msg = `Created ${j.created} listings, ${j.failed} failed`;
      showStatus(msg, 'ok');
      showResults(j.createdListings.map(c => c.item));
    } else {
      showStatus('Scrape failed: ' + (j.error || 'unknown error'), 'err');
    }
  } catch (e) {
    showStatus('Error: ' + e.message, 'err');
  }
}

// Load defaults from localStorage
window.addEventListener('DOMContentLoaded', function() {
  const saved = localStorage.getItem('relay-scraper-settings');
  if (saved) {
    try {
      const s = JSON.parse(saved);
      if (s.marketplaceId) document.getElementById('marketplaceId').value = s.marketplaceId;
      if (s.sellerId) document.getElementById('sellerId').value = s.sellerId;
    } catch (e) {}
  }

  // Save settings on change
  document.addEventListener('change', function() {
    const settings = getSettings();
    localStorage.setItem('relay-scraper-settings', JSON.stringify(settings));
  });
});
</script>
</body>
</html>
