<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#050810;color:#e8e3d9;font-family:monospace;overflow:hidden;height:100%;width:100%;-webkit-user-select:none;user-select:none}
canvas#c{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;background:#050810}
canvas#stars{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;mix-blend-mode:screen}
.scanline{position:fixed;inset:0;z-index:5;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.02) 2px,rgba(0,0,0,0.02) 4px)}

/* public top bar */
.topbar{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:14px 20px}
.topbar .brand{font-family:Georgia,serif;font-size:1.05rem;letter-spacing:.22em;color:rgba(201,169,78,0.9);text-shadow:0 0 16px rgba(201,169,78,.4)}
.topbar .brand b{font-weight:700}
.adminbtn{font-size:.55rem;letter-spacing:2px;text-transform:uppercase;color:rgba(201,169,78,0.55);border:1px solid rgba(201,169,78,0.3);padding:7px 13px;border-radius:3px;background:rgba(5,8,16,0.5);cursor:pointer;font-family:monospace}
.adminbtn:hover{color:#fff;border-color:rgba(201,169,78,0.8)}

/* center label */
.center-label{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:50;text-align:center;pointer-events:none}
.center-label .title{font-size:clamp(1.1rem,3.6vw,1.8rem);font-weight:100;letter-spacing:clamp(6px,2vw,14px);opacity:0.05;font-family:Georgia,serif;color:rgba(140,170,200,0.6)}
.center-label .subtitle{font-size:clamp(0.42rem,1.3vw,0.56rem);letter-spacing:clamp(4px,1.5vw,9px);text-transform:uppercase;opacity:0.22;margin-top:4px;color:rgba(140,170,200,0.4)}

/* hud */
.hud{position:fixed;z-index:100;font-size:clamp(0.34rem,1vw,0.44rem);letter-spacing:2px;text-transform:uppercase;color:rgba(201,169,78,0.4)}
.hud-tr{top:52px;right:16px;text-align:right}.hud-bl{bottom:74px;left:16px}
.headline{position:fixed;top:50px;left:0;right:0;z-index:150;text-align:center;padding:0 16px;pointer-events:none;font-family:Georgia,serif;font-size:clamp(.7rem,2vw,.98rem);letter-spacing:.05em;color:rgba(201,169,78,0.82);text-shadow:0 0 18px rgba(0,0,0,.8)}
.headline b{color:#fff;font-weight:700}

/* tooltip (engine-driven) */
#tooltip{position:fixed;z-index:400;background:rgba(5,8,16,0.96);border:1px solid rgba(140,170,200,0.15);padding:14px 18px;max-width:340px;width:max-content;pointer-events:none;display:none;font-family:monospace}
#tooltip .tt-phase{font-size:0.5rem;letter-spacing:3px;text-transform:uppercase;margin-bottom:4px}
#tooltip .tt-name{font-size:clamp(0.85rem,2.8vw,1rem);color:rgba(180,200,220,0.9);letter-spacing:2px;margin-bottom:2px}
#tooltip .tt-tagline{font-family:Georgia,serif;font-size:0.8rem;color:rgba(180,200,220,0.45);line-height:1.5;margin-bottom:8px}
#tooltip .tt-counts{font-family:monospace;font-size:0.62rem;letter-spacing:.5px;color:rgba(201,169,78,0.75);margin-bottom:8px}
#tooltip .tt-counts b{color:#fff;font-weight:700}
#tooltip .tt-enter{font-size:0.5rem;letter-spacing:3px;color:rgba(140,170,200,0.5);text-transform:uppercase}
#subMenu{display:none}

/* intro + tools */
.intro{position:fixed;left:0;right:0;bottom:0;z-index:120;text-align:center;padding:0 18px 18px;pointer-events:none}
.intro p{max-width:640px;margin:0 auto 12px;font-family:Georgia,serif;font-size:clamp(.74rem,2vw,.92rem);line-height:1.6;color:rgba(232,227,217,0.62)}
.intro .em{color:rgba(201,169,78,0.9)}
.tools{pointer-events:auto}
.tools a{color:#06060e;font-weight:700;background:#d8b85a;border-radius:18px;padding:7px 13px;display:inline-block;margin:4px;box-shadow:0 2px 12px rgba(0,0,0,.55);font-family:Georgia,serif;font-size:.78rem;text-decoration:none;transition:.2s}
.tools a:hover{background:#e9cd74;transform:translateY(-2px)}
.tools .lab{display:block;font-family:monospace;font-size:.5rem;letter-spacing:.28em;text-transform:uppercase;color:rgba(232,227,217,0.4);margin-bottom:6px}

#entry-veil{position:fixed;inset:0;z-index:60;background:#050810;pointer-events:none;transition:opacity 2s}

/* admin overlay */
.ov{position:fixed;inset:0;background:rgba(0,0,0,0.94);display:none;align-items:center;justify-content:center;z-index:600;padding:24px;backdrop-filter:blur(6px)}
.ov.show{display:flex}
.card{background:#06060e;border:1px solid rgba(201,169,78,0.35);padding:34px 30px 26px;max-width:360px;width:100%;text-align:center;position:relative;font-family:Georgia,serif}
.card .lbl{font-size:.62rem;letter-spacing:6px;color:rgba(201,169,78,.85);text-transform:uppercase;margin-bottom:22px}
.card input{width:100%;background:transparent;border:none;border-bottom:1px solid rgba(201,169,78,0.35);color:#efe9d8;font-family:Georgia,serif;font-size:1rem;padding:10px 4px;letter-spacing:2px;text-align:center;outline:none}
.card button{margin-top:20px;background:transparent;border:1px solid rgba(201,169,78,0.45);color:rgba(201,169,78,.85);font-family:Georgia,serif;font-size:.7rem;letter-spacing:4px;text-transform:uppercase;padding:10px 24px;cursor:pointer}
.card .x{position:absolute;top:8px;right:12px;background:none;border:none;color:rgba(239,233,216,.4);font-size:1.2rem;cursor:pointer}
.card .err{margin-top:12px;min-height:14px;font-size:.62rem;letter-spacing:2px;color:rgba(220,120,100,.85);text-transform:uppercase}
</style>

<body>

<div class="topbar">
  <span class="brand">⊹ LIMEN <b>HELIX</b></span>
  <button class="adminbtn" id="adminBtn">Admin</button>
</div>
<div class="headline"><b>20</b> domains · <b>123</b> brain nodes · <b>465,939</b> portals · <b>~880K</b> diagnoses · <b>~8.2M</b> treatments</div>

<canvas id="c"></canvas>
<canvas id="stars"></canvas>

<div class="center-label">

</div>
<div class="hud hud-tr">CONNECTOME</div>
<div class="hud hud-bl">20 DOMAINS · 30 PATHWAYS</div>

<div id="tooltip">
  <div class="tt-phase" id="ttPhase"></div>
  <div class="tt-name" id="ttName"></div>
  <div class="tt-tagline" id="ttTagline"></div>
  <div class="tt-counts" id="ttCounts"></div>

</div>

<!-- admin -->
<div class="ov" id="ov">
  <div class="card">
    <button class="x" id="ovX" aria-label="close">&times;</button>
    <div class="lbl">Authorized Access</div>
    <form id="ovForm">
      <input type="password" id="ovPw" placeholder="• • • • • •" autocomplete="off" inputmode="numeric">
      <div class="err" id="ovErr"></div>
      <button type="submit">Enter</button>
    </form>
  </div>
</div>

<script src="assets/js/limen-ui-state.js"></script>

<script>
(function(){
  'use strict';
  // PUBLIC routing only — clicks never reach gated pages.
  var PUBLIC = { energy:'/energy', culture:'/culture', infrastructure:'/infrastructure' };
  function onNodeClick(n){
    var url = n && (PUBLIC[n.id] || PUBLIC[(n.childUniverse||'').toLowerCase()]);
    if (url) window.location.href = url;
    // else: no navigation — hover tooltip already shows the sector's state
  }
  if (window.CivilizationConnectome) {
    CivilizationConnectome.init('c', { miniMode:false, focusDomain:null, onNodeClick:onNodeClick });
  }
  var v=document.getElementById('entry-veil');
  setTimeout(function(){ if(v){ v.style.opacity='0'; setTimeout(function(){ v.remove(); },2000); } },300);
})();

/* admin: passcode → /api/admin-auth → /admin */
(function(){
  var btn=document.getElementById('adminBtn'),ov=document.getElementById('ov'),
      f=document.getElementById('ovForm'),pw=document.getElementById('ovPw'),
      err=document.getElementById('ovErr'),x=document.getElementById('ovX');
  function show(){ov.classList.add('show');setTimeout(function(){pw.focus();},50);}
  function hide(){ov.classList.remove('show');err.textContent='';pw.value='';}
  btn.addEventListener('click',show); x.addEventListener('click',hide);
  ov.addEventListener('click',function(e){if(e.target===ov)hide();});
  document.addEventListener('keydown',function(e){
    if((e.ctrlKey||e.metaKey)&&e.shiftKey&&(e.key==='A'||e.key==='a')){e.preventDefault();show();}
    if(e.key==='Escape')hide();});
  f.addEventListener('submit',function(e){e.preventDefault();var val=(pw.value||'').trim();
    if(!val){err.textContent='Enter code';return;} err.textContent='checking…';
    fetch('/api/admin-auth',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({passcode:val})})
      .then(function(r){return r.json();})
      .then(function(j){ if(j&&j.ok){ try{sessionStorage.setItem('limen_access','granted');if(j.person)sessionStorage.setItem('limen_admin',JSON.stringify(j.person));sessionStorage.setItem('limen_pass',val);}catch(e){} window.location.replace('/admin'); }
        else { err.textContent='Incorrect'; pw.value=''; pw.focus(); } })
      .catch(function(){ err.textContent='Error — try again'; });
  });
})();
</script>
<script>
/* Milky-Way galaxy — tilted star band + colored nebula + glowing stars, slowly rotating
   around the SAME center as the connectome so the whole scene moves as one galaxy. */
(function(){
  var cv=document.getElementById('stars'); if(!cv) return; var ctx=cv.getContext('2d');
  var dpr=Math.min(window.devicePixelRatio||1,2), stars=[], neb=[], RAD=0, ang=0;
  var BAND=-0.42, cosB=Math.cos(BAND), sinB=Math.sin(BAND); // galactic plane tilt
  function rand(a,b){ return a+Math.random()*(b-a); }
  function gauss(){ return (Math.random()+Math.random()+Math.random()-1.5)/1.5; }
  function build(){
    cv.width=innerWidth*dpr; cv.height=innerHeight*dpr;
    RAD=Math.sqrt(cv.width*cv.width+cv.height*cv.height)/2*1.06;
    var n=Math.floor(innerWidth*innerHeight/1100); stars=[];
    var bandHalf=RAD*0.20;
    for(var i=0;i<n;i++){
      var x,y;
      if(Math.random()<0.58){ var u=rand(-RAD,RAD), v=gauss()*bandHalf; x=u*cosB-v*sinB; y=u*sinB+v*cosB; }
      else { var a2=Math.random()*6.2832, rr=Math.sqrt(Math.random())*RAD; x=Math.cos(a2)*rr; y=Math.sin(a2)*rr; }
      var bright=Math.random()<0.13, roll=Math.random();
      var col=roll<0.62?'255,255,255':roll<0.78?'180,205,255':roll<0.9?'235,205,150':'230,160,170';
      stars.push({ x:x, y:y, r:(bright?rand(0.9,1.9):rand(0.3,0.95))*dpr,
        base:bright?rand(0.6,1):rand(0.08,0.4), tw:rand(0.004,0.02), ph:Math.random()*6.2832, col:col, glow:bright });
    }
    neb=[]; var cols=['80,120,220','150,90,200','210,90,150','60,170,170','220,170,90'];
    for(var j=0;j<7;j++){
      var along=Math.random()<0.62, uu=rand(-RAD*0.8,RAD*0.8), vv=gauss()*RAD*0.18;
      var nx=along?(uu*cosB-vv*sinB):rand(-RAD*0.7,RAD*0.7), ny=along?(uu*sinB+vv*cosB):rand(-RAD*0.7,RAD*0.7);
      neb.push({ x:nx, y:ny, r:rand(RAD*0.18,RAD*0.42), c:cols[j%cols.length], a:rand(0.035,0.075) });
    }
  }
  build(); addEventListener('resize',build);
  var run=true; document.addEventListener('visibilitychange',function(){ run=!document.hidden; if(run) draw(); });
  function draw(){
    if(!run) return;
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.save(); ctx.translate(cv.width/2,cv.height/2); ctx.rotate(ang);
    var cg=ctx.createRadialGradient(0,0,0,0,0,RAD*0.55);
    cg.addColorStop(0,'rgba(120,140,210,0.06)'); cg.addColorStop(0.5,'rgba(90,110,180,0.025)'); cg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=cg; ctx.fillRect(-RAD,-RAD,RAD*2,RAD*2);
    for(var k=0;k<neb.length;k++){ var b=neb[k]; var g=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r);
      g.addColorStop(0,'rgba('+b.c+','+b.a+')'); g.addColorStop(1,'rgba('+b.c+',0)'); ctx.fillStyle=g; ctx.fillRect(b.x-b.r,b.y-b.r,b.r*2,b.r*2); }
    for(var i=0;i<stars.length;i++){ var s=stars[i]; s.ph+=s.tw; var al=s.base*(0.5+0.5*Math.sin(s.ph));
      if(s.glow){ ctx.beginPath(); ctx.arc(s.x,s.y,s.r*3.2,0,6.2832); ctx.fillStyle='rgba('+s.col+','+(al*0.10).toFixed(3)+')'; ctx.fill(); }
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.2832); ctx.fillStyle='rgba('+s.col+','+al.toFixed(3)+')'; ctx.fill(); }
    ctx.restore();
    ang+=0.0006;
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>
