<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LIMEN Helix</title>
<meta name="description" content="LIMEN Helix">
<!-- Kept deliberately: removing this loses Google Search Console ownership of the domain,
     which is painful to re-establish and has nothing to do with the site being down. -->
<meta name="google-site-verification" content="2xLI4zw_nL8XXPveYa48ALKWg6WDC86VzvtRvV6HayA" />
<link rel="canonical" href="https://limenhelix.com/">
<meta name="robots" content="noindex, nofollow">
<meta property="og:type" content="website">
<meta property="og:url" content="https://limenhelix.com/">
<meta property="og:title" content="LIMEN Helix">
<meta property="og:image" content="https://limenhelix.com/assets/img/limen-wordmark.jpg">
<link rel="icon" href="/assets/img/limen-wordmark.jpg">
<style>
  /* HOLDING PAGE — the wordmark in a live starfield.
     No libraries, no fonts, no third-party requests. One image, one canvas, ~90 lines of JS.

     The previous homepage restores with:  git checkout 9430efd9 -- index.html          */

  /* Sampled from the wordmark's own background so the image edge dissolves into the page
     instead of showing as a lighter square. */
  :root{ --space:#0b131d; }

  *{margin:0;padding:0;box-sizing:border-box}

  html,body{height:100%;overflow:hidden}

  body{
    background:var(--space);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* The sky sits behind everything and is purely decorative.
     z-index:-1 is deliberate and load-bearing. mix-blend-mode blends an element against its
     backdrop WITHIN the nearest stacking context, so if the mark sat inside a positioned,
     z-indexed wrapper it would blend against that wrapper's transparent background and the
     canvas would be invisible to it — which renders as a dark square punched in the sky.
     Putting the canvas at -1 and leaving the mark in normal flow keeps both in the root
     stacking context, which is the only arrangement where the blend actually reaches the stars. */
  canvas#sky{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    z-index:-1;
  }

  main{
    padding:6vh 5vw;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:clamp(1.6rem,5vw,2.6rem);
  }

  /* The mark is a JPEG with a solid dark background, so dropping it straight onto the stars
     punches a visible rectangle in the sky. mix-blend-mode:screen was tried first and is not
     sufficient: screen only erases a backdrop that is genuinely black, and this artwork sits
     on #0d1520, so the square came back as a LIGHTER patch instead of a darker one.

     The script below therefore rebuilds the image with a real alpha channel — luminance
     becomes transparency — and crops it to the wordmark. That keeps the original letterforms
     exactly, and the starfield runs behind the type with nothing to give away an image edge.
     The element starts hidden and fades in once that has happened, so the raw square is never
     on screen. */
  /* The wrapper sizes itself to the mark, and the shine layer sits exactly on top of it.
     No z-index here on purpose: position:relative alone does not create a stacking context,
     so the shine's screen blend can still reach the mark and the stars beneath it. */
  .markwrap{
    position:relative;
    display:inline-block;
    line-height:0;
  }

  img.mark{
    display:block;
    width:min(74vw, 62vh, 620px);
    height:auto;
    max-width:100%;
    opacity:0;
    transition:opacity .6s ease;
    /* A warm bloom plus a small lift. Against a dark, colourful field the gold sampled from
       the JPEG reads muted — the surrounding nebula raises the eye's adaptation point, so the
       same pixels look dimmer than they do on the flat original. The brightness/saturate pair
       compensates for that rather than changing the brand colour in any real sense. */
    /* Three stacked shadows rather than one: a tight hot core, a mid halo, and a wide dim
       spill. A single large blur just makes a soft smudge; stacking radii is what gives the
       glow a falloff that reads as light rather than as blur. */
    filter:
      drop-shadow(0 0 14px rgba(255,214,120,.30))
      drop-shadow(0 0 44px rgba(212,175,55,.30))
      drop-shadow(0 0 90px rgba(180,130,40,.18))
      brightness(1.14) saturate(1.16);
  }
  img.mark.ready{
    opacity:1;
    /* The bloom breathes. Slow enough (9s) that you notice it without watching for it. */
    animation:breathe 9s ease-in-out infinite;
  }

  /* The trough is the previous STATIC look, not something dimmer than it. An earlier version
     dipped to brightness(1.08) with a 26px bloom, which made the low half of the cycle read as
     a slightly faded logo rather than as a glow at rest. Breathing should only ever add. */
  @keyframes breathe{
    0%,100%{ filter:
      drop-shadow(0 0 14px rgba(255,214,120,.30))
      drop-shadow(0 0 44px rgba(212,175,55,.30))
      drop-shadow(0 0 90px rgba(180,130,40,.18))
      brightness(1.14) saturate(1.16) }
    50%    { filter:
      drop-shadow(0 0 20px rgba(255,232,160,.46))
      drop-shadow(0 0 70px rgba(226,186,70,.50))
      drop-shadow(0 0 140px rgba(200,145,45,.30))
      brightness(1.26) saturate(1.24) }
  }

  /* ── THE SWEEP ────────────────────────────────────────────────────────────────────────
     A specular highlight travelling across the letters, the way light moves over polished
     metal when you tilt it.

     It works by masking: the layer is a plain diagonal gradient, and the wordmark's own alpha
     channel is used as a mask, so the band is only ever visible ON the letters and never in
     the space around them. The mask URL is the same generated PNG the <img> uses, set from
     JS once the alpha extraction has finished.

     Masking rather than a blend was the right call: a blended band would light the nebula and
     the gap between letters just as much as the gold, which reads as a searchlight passing
     over the page instead of a shine on the type.

     The animation runs 0 -> 50% -> 100% with the two ends identical, so the band travels one
     way and then back rather than jumping. ease-in-out makes it slow at each turn, which is
     what makes it feel like a pendulum instead of a loop. */
  .shine{
    position:absolute;
    inset:0;
    pointer-events:none;
    opacity:0;
    transition:opacity .6s ease;
    /* BAND WIDTH IS THE WHOLE EFFECT.
       The first attempt spread the highlight from 38% to 62% of a gradient sized at 280%,
       which works out to roughly two thirds of the wordmark's width. At that width it does
       not read as a light travelling across the letters at all — it reads as the whole mark
       slowly getting brighter and then dimmer, which is not what a glint looks like.
       Narrowing it to 44%-56% puts the streak at about a third of the width, with a hard
       white core, and it reads as a specular highlight moving over metal. */
    background:linear-gradient(
      100deg,
      rgba(255,255,255,0)    43%,
      rgba(255,238,196,.28)  47%,
      rgba(255,253,240,1)    50%,
      rgba(255,238,196,.28)  53%,
      rgba(255,255,255,0)    57%
    );
    background-size:300% 100%;
    background-repeat:no-repeat;
    -webkit-mask-size:100% 100%;
            mask-size:100% 100%;
    -webkit-mask-repeat:no-repeat;
            mask-repeat:no-repeat;
    mix-blend-mode:screen;
  }
  .shine.ready{
    opacity:1;
    animation:sweep 11s linear infinite;
  }

  /* ONE DIRECTION, LEFT TO RIGHT, WITH A REST BETWEEN PASSES.
     Previously this ran 0 -> 50% -> 100% and swept back the way it came, which reads as a
     light rocking rather than a light passing. Now the band travels once and the return is a
     hard jump from -40% back to 140% — invisible, because the highlight is fully off the
     letters at both of those positions.

     The pass occupies the first 62% of the cycle and the remaining 38% holds it off-screen.
     That rest is deliberate: a highlight in constant motion becomes wallpaper, while one that
     arrives every few seconds stays an event. Linear timing, because ease-in-out would spend
     its slow moments at the two ends, which is exactly where nothing is visible. */
  @keyframes sweep{
    0%   { background-position:140% 0 }
    62%  { background-position:-40% 0 }
    100% { background-position:-40% 0 }
  }

  /* If the script fails or JS is off, show the original rather than a blank page. Screen
     blending at least keeps it legible; the square is the acceptable cost of a fallback. */
  .nojs img.mark{opacity:1;mix-blend-mode:screen}

  /* Motion is decorative only. Anyone who has asked their OS to reduce motion gets a still
     sky, a still bloom, and no sweep — but still sees the mark. */
  @media (prefers-reduced-motion:reduce){
    img.mark.ready{animation:none}
    .shine{display:none}
  }
</style>
</head>
<body>

<canvas id="sky" aria-hidden="true"></canvas>

<main>
  <div class="markwrap">
    <img class="mark" id="mark" src="/assets/img/limen-wordmark.jpg" alt="LIMEN Helix">
    <span class="shine" id="shine" aria-hidden="true"></span>
  </div>
</main>

<noscript><style>img.mark{opacity:1;mix-blend-mode:screen}</style></noscript>

<script>
/* ── THE MARK: luminance -> alpha, then crop ───────────────────────────────────────────────
   Runs once. Reads the JPEG into an offscreen canvas, turns brightness into opacity so the
   dark backdrop disappears and the gold letters stay, trims the empty margin, and swaps the
   result back in as a transparent PNG. After that the element is an ordinary <img> and all
   the normal layout rules apply.

   Same-origin image, so reading pixels back is allowed and no CORS header is involved.       */
(function () {
  'use strict';
  var el = document.getElementById('mark');
  var shine = document.getElementById('shine');
  if (!el) return;

  function reveal() { el.classList.add('ready'); }

  /* Point the sweep's mask at the generated transparent PNG. Until this runs the shine layer
     has no mask at all, and an unmasked gradient would paint a bright band straight across the
     page — so it is held at opacity 0 in CSS and only revealed here, once it has something to
     be shaped by. */
  function armShine(url) {
    if (!shine) return;
    shine.style.webkitMaskImage = 'url(' + url + ')';
    shine.style.maskImage = 'url(' + url + ')';
    shine.classList.add('ready');
  }

  function process() {
    try {
      var w = el.naturalWidth, h = el.naturalHeight;
      if (!w || !h) { fallback(); return; }

      var c = document.createElement('canvas');
      c.width = w; c.height = h;
      var x = c.getContext('2d', { willReadFrequently: true });
      x.drawImage(el, 0, 0);

      var d = x.getImageData(0, 0, w, h), p = d.data;

      /* MEASURED off this exact artwork rather than guessed (histogram, 1,048,576 px):
           backdrop  94% of all pixels sit at luminance 0.05-0.06
           tail      0.07-0.11 is the backdrop's soft vignette, ~0.5% of pixels
           gap       0.12-0.55 holds ~0.01% per bucket: antialiased letter edges only
           ink       p97 = 0.60, p99 = 0.68, max 0.95
         So there is a wide empty corridor between backdrop and ink. Putting the ramp at
         0.26 -> 0.58 lands it squarely in that corridor: the vignette is driven hard to zero
         (an earlier ramp of 0.12 -> 0.34 left it at partial alpha, which showed as a faint
         rectangle floating behind the type), while the serif edges still get a smooth
         gradient instead of a jagged cut. */
      var LO = 0.26, HI = 0.58, span = HI - LO;
      var minX = w, minY = h, maxX = -1, maxY = -1;

      for (var i = 0, px = 0; i < p.length; i += 4, px++) {
        var lum = (p[i] * 0.299 + p[i + 1] * 0.587 + p[i + 2] * 0.114) / 255;
        var a = (lum - LO) / span;
        a = a < 0 ? 0 : (a > 1 ? 1 : a);
        p[i + 3] = (a * 255) | 0;
        if (a > 0.06) {                       // track the ink bounds for the crop
          var cx = px % w, cy = (px / w) | 0;
          if (cx < minX) minX = cx;
          if (cx > maxX) maxX = cx;
          if (cy < minY) minY = cy;
          if (cy > maxY) maxY = cy;
        }
      }
      if (maxX < 0) { fallback(); return; }   // nothing survived the threshold

      x.putImageData(d, 0, 0);

      // Crop to the wordmark plus a small breathing margin, so the element box is the type
      // rather than a mostly-empty square.
      var pad = Math.round(Math.max(w, h) * 0.02);
      var sx = Math.max(0, minX - pad), sy = Math.max(0, minY - pad);
      var sw = Math.min(w - sx, (maxX - minX) + pad * 2);
      var sh = Math.min(h - sy, (maxY - minY) + pad * 2);

      var out = document.createElement('canvas');
      out.width = sw; out.height = sh;
      out.getContext('2d').drawImage(c, sx, sy, sw, sh, 0, 0, sw, sh);

      el.removeAttribute('width');
      el.removeAttribute('height');
      el.onload = null;
      var url = out.toDataURL('image/png');
      el.src = url;
      armShine(url);
      reveal();
    } catch (e) {
      fallback();
    }
  }

  // Anything goes wrong: show the original with screen blending rather than a blank page.
  function fallback() {
    el.style.mixBlendMode = 'screen';
    reveal();
  }

  if (el.complete && el.naturalWidth) process();
  else { el.onload = process; el.onerror = reveal; }
})();
</script>


<script>
/* ── THE SKY ───────────────────────────────────────────────────────────────────────────────
   Deep space, drawn in two parts.

   PART 1, drawn ONCE per resize into an offscreen bitmap: the space gradient, the nebula
   clouds, the Milky Way band with its dust lanes, and the far starfield. None of it moves,
   and it is by far the most expensive thing here — several hundred gradient fills. Caching it
   means the animation loop never pays for it again.

   PART 2, drawn EVERY frame: only the stars that actually twinkle, plus the flares and any
   shooting star. That is a few hundred small arcs, which is cheap enough to hold 60fps on a
   phone.

   Splitting it this way is the whole performance story. Redrawing the nebula per frame would
   cost ~50x more for something that never changes.                                          */
(function () {
  'use strict';

  var canvas = document.getElementById('sky');
  var ctx = canvas.getContext('2d', { alpha: false });
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var bg = document.createElement('canvas');      // the cached, unmoving universe
  var bgx = bg.getContext('2d');

  var twinklers = [], flares = [], shooting = null;
  var w = 0, h = 0, dpr = 1, raf = null, t0 = 0, nextShot = 0;

  /* Real stars are not white. Colour comes from temperature: blue-white giants through to
     cool red dwarfs. A field of identical white dots reads as noise; this reads as a sky. */
  var PALETTE = [
    '255,255,255', '255,255,255', '255,255,255', '255,255,255',
    '202,222,255',   // blue-white, hot
    '176,205,255',   // blue
    '255,246,222',   // yellow-white
    '255,228,178',   // amber, echoes the gold in the mark
    '255,198,148'    // orange, cool
  ];

  function rand(a, b) { return a + Math.random() * (b - a); }
  function pick(a) { return a[(Math.random() * a.length) | 0]; }

  // ── PART 1: the cached universe ─────────────────────────────────────────────────────────

  function paintUniverse() {
    bg.width = Math.round(w * dpr);
    bg.height = Math.round(h * dpr);
    bgx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // Base void. Not flat black: a slight vertical lift gives the frame somewhere to sit.
    var base = bgx.createLinearGradient(0, 0, 0, h);
    base.addColorStop(0, '#05070d');
    base.addColorStop(0.55, '#080d17');
    base.addColorStop(1, '#04060b');
    bgx.fillStyle = base;
    bgx.fillRect(0, 0, w, h);

    var diag = Math.sqrt(w * w + h * h);

    /* NEBULAE. Big soft radial gradients composited additively. Each cloud is several
       overlapping blobs of one hue rather than a single circle, because one circle reads as a
       circle and a cluster reads as gas. */
    bgx.globalCompositeOperation = 'lighter';

    /* Clouds are pushed to the CORNERS and the broad central wash is gone. An earlier version
       had a wide cloud sitting at (0.50, 0.48) and the gold wordmark lost its contrast against
       it — the type has to win, and colour behind type is the fastest way to lose it. The
       colour now frames the centre instead of filling it. */
    /* Eight clouds instead of four, with hotter hues and higher alpha. The palette is drawn
       from what real emission nebulae actually are: H-alpha rose and crimson, OIII teal, plus
       reflection blue and violet from dust scattering starlight. An amber region echoes the
       gold in the mark without sitting near it. Still all pushed to the edges — the centre
       stays dark so the type keeps its contrast. */
    var clouds = [
      { x: 0.10, y: 0.18, r: 0.40, c: '132,72,220', a: 0.20 },  // violet
      { x: 0.30, y: 0.08, r: 0.30, c: '210,70,150', a: 0.16 },  // rose, H-alpha
      { x: 0.90, y: 0.14, r: 0.36, c: '48,120,225', a: 0.19 },  // blue
      { x: 0.72, y: 0.06, r: 0.26, c: '30,180,190', a: 0.14 },  // teal, OIII
      { x: 0.88, y: 0.80, r: 0.40, c: '200,60,120', a: 0.17 },  // magenta
      { x: 0.62, y: 0.95, r: 0.30, c: '150,60,210', a: 0.14 },  // purple
      { x: 0.12, y: 0.86, r: 0.36, c: '20,150,175', a: 0.17 },  // cyan
      { x: 0.34, y: 0.96, r: 0.26, c: '225,140,60', a: 0.11 }   // amber
    ];

    clouds.forEach(function (cl) {
      var cx = cl.x * w, cy = cl.y * h, rr = cl.r * diag;
      // 7 offset lobes per cloud: irregular edges instead of a perfect disc.
      for (var i = 0; i < 7; i++) {
        var ox = cx + rand(-rr * 0.42, rr * 0.42);
        var oy = cy + rand(-rr * 0.34, rr * 0.34);
        var orr = rr * rand(0.35, 0.85);
        var g = bgx.createRadialGradient(ox, oy, 0, ox, oy, orr);
        g.addColorStop(0, 'rgba(' + cl.c + ',' + (cl.a * rand(0.6, 1)).toFixed(3) + ')');
        g.addColorStop(0.45, 'rgba(' + cl.c + ',' + (cl.a * 0.35).toFixed(3) + ')');
        g.addColorStop(1, 'rgba(' + cl.c + ',0)');
        bgx.fillStyle = g;
        bgx.fillRect(ox - orr, oy - orr, orr * 2, orr * 2);
      }
    });

    /* THE MILKY WAY. A diagonal band, because a horizontal one looks like a horizon and the
       galactic plane never does. Built from many overlapping soft ellipses along an axis. */
    var ang = -0.42;                       // radians, up to the right
    var ca = Math.cos(ang), sa = Math.sin(ang);
    var steps = 46;
    for (var s = 0; s <= steps; s++) {
      var tpos = s / steps;
      var px = (tpos - 0.5) * diag * 1.25;
      var bx = w * 0.5 + px * ca;
      var by = h * 0.5 + px * sa;
      // Thicker and brighter toward the centre: the galactic bulge.
      var bulge = 1 - Math.abs(tpos - 0.5) * 1.5;
      if (bulge < 0) bulge = 0;
      var br = diag * (0.055 + 0.075 * bulge);
      var alpha = 0.030 + 0.055 * bulge;
      var g2 = bgx.createRadialGradient(bx, by, 0, bx, by, br);
      g2.addColorStop(0, 'rgba(190,200,235,' + alpha.toFixed(3) + ')');
      g2.addColorStop(0.5, 'rgba(150,165,215,' + (alpha * 0.4).toFixed(3) + ')');
      g2.addColorStop(1, 'rgba(120,140,200,0)');
      bgx.fillStyle = g2;
      bgx.fillRect(bx - br, by - br, br * 2, br * 2);
    }

    /* FAR STARS. Dense, tiny, static. At this size a twinkle would be invisible anyway, so
       they live in the cached layer and cost nothing per frame. This is the layer that makes
       the sky feel deep rather than sparse. */
    var farCount = Math.min(2600, Math.round((w * h) / 620));
    for (var f = 0; f < farCount; f++) {
      var fx = Math.random() * w, fy = Math.random() * h;
      // Cluster toward the band: multiply density along the galactic axis.
      var dToAxis = Math.abs((fx - w * 0.5) * sa - (fy - h * 0.5) * ca);
      var nearBand = Math.exp(-(dToAxis / (diag * 0.16)) * (dToAxis / (diag * 0.16)));
      if (Math.random() > 0.32 + nearBand * 0.68) continue;
      var fr = rand(0.22, 0.75);
      var fa = rand(0.10, 0.55) * (0.55 + nearBand * 0.45);
      bgx.beginPath();
      bgx.arc(fx, fy, fr, 0, 6.2832);
      bgx.fillStyle = 'rgba(' + pick(PALETTE) + ',' + fa.toFixed(3) + ')';
      bgx.fill();
    }

    /* DUST LANES. Dark, subtractive-looking streaks across the band. Real galaxies are cut by
       these and without them the band reads as an airbrushed smear. */
    bgx.globalCompositeOperation = 'source-over';
    /* Dust is kept OUT of the middle. Placed freely, one lane landed directly behind HELIX and
       read as a smudge on the screen rather than as dust in a galaxy. Anything that lands
       within 22% of centre is rejected and re-rolled. */
    for (var d = 0; d < 9; d++) {
      var dx0, dy0, tries = 0;
      do {
        var dt = rand(0.10, 0.90);
        var dpx = (dt - 0.5) * diag * 1.15;
        dx0 = w * 0.5 + dpx * ca + rand(-diag * 0.06, diag * 0.06);
        dy0 = h * 0.5 + dpx * sa + rand(-diag * 0.06, diag * 0.06);
        tries++;
      } while (tries < 8 && Math.hypot(dx0 - w * 0.5, dy0 - h * 0.5) < diag * 0.22);
      var dr = diag * rand(0.04, 0.10);
      var g3 = bgx.createRadialGradient(dx0, dy0, 0, dx0, dy0, dr);
      g3.addColorStop(0, 'rgba(4,6,12,' + rand(0.22, 0.42).toFixed(3) + ')');
      g3.addColorStop(1, 'rgba(4,6,12,0)');
      bgx.fillStyle = g3;
      bgx.fillRect(dx0 - dr, dy0 - dr, dr * 2, dr * 2);
    }

    /* A CLEARING behind the wordmark. Deep space is not uniformly lit and dark nebulae are
       real, so a soft pool of shadow at centre is physically unremarkable — but its actual job
       is contrast: the gold has to read at a glance, and it cannot do that over lit gas.
       Applied after the clouds and before the vignette so it darkens colour, not just edges. */
    /* Deepened when the palette got richer. Brighter, more saturated gas around the edges
       compresses the whole image toward mid-tone, and the type loses its separation along with
       it. Pushing the clearing harder does two things at once: the gold regains contrast, and
       the colour actually reads MORE saturated, because it now has something dark to sit
       against instead of blending into a uniformly lit field. */
    var clear = bgx.createRadialGradient(w / 2, h * 0.5, 0, w / 2, h * 0.5, diag * 0.34);
    clear.addColorStop(0, 'rgba(2,4,9,0.78)');
    clear.addColorStop(0.45, 'rgba(2,4,9,0.52)');
    clear.addColorStop(1, 'rgba(2,4,9,0)');
    bgx.fillStyle = clear;
    bgx.fillRect(0, 0, w, h);

    // A soft vignette pulls the eye to the centre, where the wordmark is.
    var vg = bgx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.25, w / 2, h / 2, diag * 0.62);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.62)');
    bgx.fillStyle = vg;
    bgx.fillRect(0, 0, w, h);
  }

  // ── PART 2: the things that move ────────────────────────────────────────────────────────

  function buildTwinklers() {
    twinklers = [];
    flares = [];

    var count = Math.min(420, Math.round((w * h) / 3400));
    for (var i = 0; i < count; i++) {
      twinklers.push({
        x: Math.random() * w,
        y: Math.random() * h,
        r: rand(0.5, 1.5),
        colour: pick(PALETTE),
        base: rand(0.35, 1.0),
        /* Two rates that do not divide into each other, so the product never repeats on a
           short cycle. One sine gives every star an obvious metronome; two give irregular,
           unpredictable blinking, which is what the eye reads as a real sky. */
        s1: rand(1.1, 4.2),
        s2: rand(0.3, 1.3),
        p1: Math.random() * 6.2832,
        p2: Math.random() * 6.2832,
        /* Depth of blink. A third of them blink HARD (down to near zero and back), the rest
           shimmer. Mixed depth is what stops it looking like a string of fairy lights. */
        amp: Math.random() < 0.34 ? rand(0.75, 1.0) : rand(0.25, 0.6)
      });
    }

    // The handful of bright anchors that carry cross-flares.
    var fcount = Math.min(22, Math.max(6, Math.round((w * h) / 90000)));
    for (var k = 0; k < fcount; k++) {
      flares.push({
        x: rand(w * 0.04, w * 0.96),
        y: rand(h * 0.04, h * 0.96),
        r: rand(1.5, 2.8),
        colour: pick(PALETTE),
        base: rand(0.7, 1.0),
        s1: rand(0.5, 1.6),
        s2: rand(0.2, 0.6),
        p1: Math.random() * 6.2832,
        p2: Math.random() * 6.2832,
        amp: rand(0.35, 0.7),
        spikes: rand(9, 22)
      });
    }
  }

  function twinkle(s, t) {
    if (reduce) return s.base;
    /* Product of two sines, each mapped to 0..1. The result spends more time dim than bright,
       which matches how twinkling actually looks: brief flashes out of a low baseline. */
    var a = 0.5 - 0.5 * Math.cos(s.s1 * t + s.p1);
    var b = 0.5 - 0.5 * Math.cos(s.s2 * t + s.p2);
    var m = 1 - s.amp * (1 - a * (0.45 + 0.55 * b));
    return Math.max(0, Math.min(1, s.base * m));
  }

  function spawnShot(t) {
    // Enters from the top half, travels down-right or down-left.
    var dir = Math.random() < 0.5 ? 1 : -1;
    shooting = {
      x: dir > 0 ? rand(-w * 0.1, w * 0.6) : rand(w * 0.4, w * 1.1),
      y: rand(-h * 0.05, h * 0.45),
      vx: dir * rand(420, 760),
      vy: rand(200, 380),
      life: 0,
      ttl: rand(0.55, 1.0),
      len: rand(70, 190),
      born: t
    };
  }

  function draw(now) {
    var t = (now - t0) / 1000;

    // The cached universe, blitted whole. One drawImage instead of ~400 gradient fills.
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(bg, 0, 0);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    ctx.globalCompositeOperation = 'lighter';

    var i, s, a;

    for (i = 0; i < twinklers.length; i++) {
      s = twinklers[i];
      a = twinkle(s, t);
      if (a < 0.012) continue;                       // fully dark: skip the draw entirely
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, 6.2832);
      ctx.fillStyle = 'rgba(' + s.colour + ',' + a.toFixed(3) + ')';
      ctx.fill();
      if (a > 0.6) {                                 // halo only when actually bright
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r * 3.4, 0, 6.2832);
        ctx.fillStyle = 'rgba(' + s.colour + ',' + (a * 0.09).toFixed(3) + ')';
        ctx.fill();
      }
    }

    // Bright anchors with cross-flares. The spike length breathes with the twinkle, which is
    // what makes them read as brilliant rather than merely large.
    for (i = 0; i < flares.length; i++) {
      s = flares[i];
      a = twinkle(s, t);
      var L = s.spikes * (0.55 + 0.45 * a);

      var g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 7);
      g.addColorStop(0, 'rgba(' + s.colour + ',' + (a * 0.95).toFixed(3) + ')');
      g.addColorStop(0.28, 'rgba(' + s.colour + ',' + (a * 0.22).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(' + s.colour + ',0)');
      ctx.fillStyle = g;
      ctx.fillRect(s.x - s.r * 7, s.y - s.r * 7, s.r * 14, s.r * 14);

      ctx.strokeStyle = 'rgba(' + s.colour + ',' + (a * 0.34).toFixed(3) + ')';
      ctx.lineWidth = 0.7;
      ctx.beginPath();
      ctx.moveTo(s.x - L, s.y); ctx.lineTo(s.x + L, s.y);
      ctx.moveTo(s.x, s.y - L); ctx.lineTo(s.x, s.y + L);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r * 0.85, 0, 6.2832);
      ctx.fillStyle = 'rgba(255,255,255,' + (a * 0.9).toFixed(3) + ')';
      ctx.fill();
    }

    // Shooting star. Rare on purpose: constant meteors look like a screensaver.
    if (!reduce) {
      if (!shooting && t > nextShot) { spawnShot(t); }
      if (shooting) {
        var age = t - shooting.born;
        if (age > shooting.ttl) {
          shooting = null;
          nextShot = t + rand(4, 13);
        } else {
          var k = age / shooting.ttl;
          var cx = shooting.x + shooting.vx * age;
          var cy = shooting.y + shooting.vy * age;
          var nx = shooting.vx, ny = shooting.vy;
          var nl = Math.sqrt(nx * nx + ny * ny);
          nx /= nl; ny /= nl;
          var fade = Math.sin(Math.PI * k);          // fade in and out, never pop
          var tg = ctx.createLinearGradient(cx, cy, cx - nx * shooting.len, cy - ny * shooting.len);
          tg.addColorStop(0, 'rgba(255,255,255,' + (0.9 * fade).toFixed(3) + ')');
          tg.addColorStop(0.35, 'rgba(200,220,255,' + (0.35 * fade).toFixed(3) + ')');
          tg.addColorStop(1, 'rgba(160,190,255,0)');
          ctx.strokeStyle = tg;
          ctx.lineWidth = 1.7;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(cx, cy);
          ctx.lineTo(cx - nx * shooting.len, cy - ny * shooting.len);
          ctx.stroke();
        }
      }
    }

    ctx.globalCompositeOperation = 'source-over';
    if (!reduce) raf = requestAnimationFrame(draw);
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);   // cap: 3x is wasted fill rate
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    paintUniverse();
    buildTwinklers();
  }

  function start() {
    if (raf) cancelAnimationFrame(raf);
    t0 = performance.now();
    nextShot = 2.5;
    if (reduce) draw(t0); else raf = requestAnimationFrame(draw);
  }

  /* Stop drawing when the tab is hidden. A holding page has no business burning a CPU core in
     a background tab for weeks. */
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { if (raf) { cancelAnimationFrame(raf); raf = null; } }
    else if (!reduce) start();
  });

  var rt;
  window.addEventListener('resize', function () {
    clearTimeout(rt);
    rt = setTimeout(function () { resize(); if (!reduce) start(); }, 160);
  });

  resize();
  start();
})();
</script>

</body>
</html>
