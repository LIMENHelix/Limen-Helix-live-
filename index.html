<style>
  /* HOLDING PAGE — the wordmark in a live starfield.
     No libraries, no fonts, no third-party requests. Inline SVG type, one canvas.

     The previous homepage restores with:  git checkout 9430efd9 -- index.html          */

  /* Sampled from the wordmark's own background so the page has somewhere to sit before
     the canvas paints. */
  :root{ --space:#0b131d; }

  *{margin:0;padding:0;box-sizing:border-box}

  html,body{height:100%;overflow:hidden}

  /* Background stays on BODY and not on html. If html also carried one, body's background
     would stop propagating to the root canvas and paint as its own box instead, which
     lands on top of the z-index:-1 sky and hides it completely. */
  body{
    background:var(--space);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* The sky sits behind everything and is purely decorative. z-index:-1 keeps it below the
     mark while both stay in the root stacking context. */
  canvas#sky{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    z-index:-1;
  }

  main{
    padding:6vh 5vw;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:clamp(1.6rem,5vw,2.6rem);
  }

  /* THE MARK IS VECTOR.
     It used to be a JPEG of type whose luminance was converted to alpha at runtime, in
     ~135 lines of canvas work on every page load. That approach could never be sharp: JPEG
     ringing around gold-on-dark edges came through as chewed alpha, so the letters carried
     chipped edges and mottled stroke interiors at every size.

     These paths are traced from that same artwork, so the letterforms are unchanged. The
     trace binary-thresholds first, which removes the mottling outright, then smooths and
     simplifies the contours, which removes the edge chatter. 6.6 KB, sharp at any size, and
     no script has to run before the mark can appear. */
  svg.mark{
    display:block;
    width:min(74vw, 62vh, 620px);
    height:auto;
    max-width:100%;
    /* ONE glow, not three.
       The old stack ran three drop-shadows plus brightness(1.14) saturate(1.16), plus a 9s
       breathing pulse, plus a white band sweeping across the letters. Stacked that hard the
       mark reads as an effect rather than as a logo, and it was compensating for a
       background so bright the gold had nothing to sit against. With the sky's centre
       genuinely dark, one soft bloom is enough and the gold reads richer, not dimmer. */
    filter:drop-shadow(0 0 28px rgba(206,164,84,.28));
  }
  /* The vertical gradient does the work the brightness filter used to do: a shallow shift
     from pale to deep gold reads as metal without touching the brand colour. */
  svg.mark path{ fill:url(#limenGold); }

  /* ── SOCIAL ROW ───────────────────────────────────────────────────────────────────────
     Inline SVG, no icon font and no third-party request. Each link is a 48px target because
     that is the minimum a thumb can hit reliably, even though the glyph inside is smaller.

     The icons carry their own brand colours, so the ring around them is NEUTRAL rather than
     gold. A gold ring would put a fifth colour family next to Facebook blue, YouTube red,
     Instagram's gradient and TikTok's cyan/magenta, and the badge would end up competing
     with the emblem it contains. Neutral lets the brand colour be the colour. */
  nav.social{
    display:flex;
    gap:clamp(.85rem,3.4vw,1.5rem);
    align-items:center;
    justify-content:center;
    opacity:0;
    animation:fadein 1s ease .5s forwards;
  }
  @keyframes fadein{to{opacity:1}}

  nav.social a{
    width:48px;
    height:48px;
    display:grid;
    place-items:center;
    border-radius:50%;
    border:1px solid rgba(226,236,250,.16);
    background:rgba(226,236,250,.045);
    transition:border-color .22s ease, background .22s ease, transform .22s ease, box-shadow .22s ease;
    -webkit-tap-highlight-color:transparent;
  }
  /* No fill:currentColor any more. Each emblem sets its own fills, because these are
     multi-colour marks, not monochrome glyphs. */
  nav.social svg{ width:22px; height:22px; display:block }

  nav.social a:hover,
  nav.social a:focus-visible{
    border-color:rgba(226,236,250,.48);
    background:rgba(226,236,250,.11);
    transform:translateY(-2px);
    outline:none;
    box-shadow:0 0 22px rgba(150,180,220,.24);
  }

  /* Motion is decorative only. Anyone who has asked their OS to reduce motion gets a still
     sky and a still row, and still sees the mark. The mark itself no longer animates at
     all, so there is nothing to switch off there. */
  @media (prefers-reduced-motion:reduce){
    nav.social{animation:none;opacity:1}
    nav.social a:hover,nav.social a:focus-visible{transform:none}
  }
</style>

        <defs><path id="ttGlyph" d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></defs>

    </a>

  </nav>
</main>

<script>
/* ── THE SKY ───────────────────────────────────────────────────────────────────────────────
   Deep space, drawn in two parts.

   PART 1, drawn ONCE per resize into an offscreen bitmap: the void gradient, the nebula, and
   the two static star populations. None of it moves, and it is by far the most expensive
   thing here. Caching it means the animation loop never pays for it again.

   PART 2, drawn EVERY frame: only the stars that twinkle, the few bright anchors, and any
   shooting star. A few hundred small arcs, cheap enough to hold 60fps on a phone.

   WHAT CHANGED FROM THE PREVIOUS VERSION, and why:

   The old sky was eight soft radial gradients in eight different hues (violet, rose, blue,
   teal, magenta, blue, cyan, amber) pushed out to the edges of the frame, with a dark pool
   punched in the middle to protect the type. Three things made that read as a colouring
   book rather than as space:

     - SIX HUES, EVENLY SPREAD. Roughly the whole colour wheel, at similar alpha, arranged
       around the border. Real fields are dominated by one or two hues.
     - NO STRUCTURE. Every cloud was the same seven-lobe blur, so there were no filaments,
       no hard edges and no dust anywhere. All airbrush.
     - A COLOURED FRAME AROUND A HOLE. Colour in the margins with an empty middle is
       literally the shape of a colouring-book page.

   This version fixes all three: domain-warped noise for structure, two hue families along
   one diagonal axis, and an elliptical clearing shaped like the wordmark so the middle is
   protected without looking punched out.                                                    */
(function () {
  'use strict';

  var canvas = document.getElementById('sky');
  var ctx = canvas.getContext('2d', { alpha: false });
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var bg = document.createElement('canvas');      // the cached, unmoving universe
  var bgx = bg.getContext('2d');

  var twinklers = [], flares = [], shooting = null;
  var w = 0, h = 0, dpr = 1, raf = null, t0 = 0, nextShot = 0;

  /* Real stars are not white. Colour comes from temperature: blue-white giants through to
     cool red dwarfs. A field of identical white dots reads as noise; this reads as a sky. */
  var PALETTE = [
    '255,255,255', '255,255,255', '255,255,255',
    '214,228,255',   // blue-white, hot
    '182,208,255',   // blue
    '255,246,224',   // yellow-white
    '255,228,180'    // amber, echoes the gold in the mark
  ];

  function rand(a, b) { return a + Math.random() * (b - a); }
  function pick(a) { return a[(Math.random() * a.length) | 0]; }
  function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }

  /* ── NOISE ─────────────────────────────────────────────────────────────────────────────
     Integer-hash value noise. Deterministic, dependency-free, and cheap enough to evaluate
     per-pixel over a reduced-resolution buffer.                                            */
  function h2(x, y, seed) {
    var n = (x * 374761393 + y * 668265263 + seed * 1274126177) | 0;
    n = Math.imul(n ^ (n >>> 13), 1274126177);
    return ((n ^ (n >>> 16)) >>> 0) / 4294967295;
  }
  function vnoise(x, y, seed) {
    var xi = Math.floor(x), yi = Math.floor(y);
    var xf = x - xi, yf = y - yi;
    var u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    var a = h2(xi, yi, seed),     b = h2(xi + 1, yi, seed);
    var c = h2(xi, yi + 1, seed), d = h2(xi + 1, yi + 1, seed);
    return (a * (1 - u) + b * u) * (1 - v) + (c * (1 - u) + d * u) * v;
  }
  function fbm(x, y, seed, oct) {
    var s = 0, amp = 0.5, f = 1, norm = 0;
    for (var i = 0; i < oct; i++) {
      s += amp * vnoise(x * f, y * f, seed + i * 17);
      norm += amp; amp *= 0.5; f *= 2;
    }
    return s / norm;
  }

  // ── PART 1: the cached universe ─────────────────────────────────────────────────────────

  function paintUniverse() {
    bg.width = Math.round(w * dpr);
    bg.height = Math.round(h * dpr);
    bgx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var diag = Math.sqrt(w * w + h * h);

    // Base void. Not flat black: a slight vertical lift gives the frame somewhere to sit.
    var base = bgx.createLinearGradient(0, 0, 0, h);
    base.addColorStop(0,    '#04060c');
    base.addColorStop(0.55, '#070c15');
    base.addColorStop(1,    '#03050a');
    bgx.fillStyle = base;
    bgx.fillRect(0, 0, w, h);

    /* THE GAS.
       Computed per-pixel into a buffer at 1/3 scale and then upscaled. Nebulae are soft, so
       the interpolation costs nothing visually, and it makes a per-pixel noise field
       affordable: on a 1440-wide desktop that is ~120k samples instead of ~1.3 million, and
       on a phone it is ~37k. Measured at 133ms on desktop, once per resize, which is in the
       same range as the ~400 gradient fills the previous version did.                       */
    var SC = 3;
    var bw = Math.max(2, Math.ceil(w / SC)), bh = Math.max(2, Math.ceil(h / SC));
    var buf = document.createElement('canvas');
    buf.width = bw; buf.height = bh;
    var bctx = buf.getContext('2d');
    var img = bctx.createImageData(bw, bh);
    var px = img.data;

    var ang = -0.42;                       // galactic plane, up to the right
    var ca = Math.cos(ang), sa = Math.sin(ang);

    /* NOISE SCALE AND WARP STRENGTH ARE THE WHOLE CHARACTER OF THIS.
       At 3.1 structures across the frame with a warp of 3.4, the result was unmistakably ink
       dropped in water: a few huge smooth swirls. Gas in a real field is finer and less
       curled, so the frequency goes up and the warp comes down. The warp is what bends
       straight noise into wisps, but past about 2 it starts folding the field back over
       itself, and folding is what reads as liquid rather than as gas. */
    var NS = 5.2 / bw;

    for (var y = 0; y < bh; y++) {
      for (var x = 0; x < bw; x++) {
        // Isotropic noise coordinates, so the gas keeps its shape instead of stretching on
        // a very wide or very tall viewport.
        var nx = x * NS, ny = y * NS;

        // domain warp
        var q1 = fbm(nx, ny, 1, 4);
        var q2 = fbm(nx + 5.2, ny + 1.3, 2, 4);
        var dens = fbm(nx + 1.9 * q1, ny + 1.9 * q2, 3, 6);

        /* Lifting the floor from 0.30 to 0.40 is what buys back real black. fBm clusters
           around 0.5, so a 0.30 floor left most of the frame carrying SOME gas, and a field
           that is never empty reads as haze. Cutting at 0.40 empties roughly half the frame
           outright, and the emptiness is what makes the remaining gas look bright. */
        var core = clamp01((dens - 0.40) / 0.52);
        dens = Math.pow(core, 2.2);

        /* Dust lanes. Real emission regions are cut by dark dust in front of them, and it is
           mostly the LANES the eye reads as structure, not the glow. Without these the gas
           still looks airbrushed however fine the noise gets. */
        var dust = fbm(nx * 1.7 + 31.4, ny * 1.7 + 17.8, 33, 4);
        dens *= 0.30 + 0.70 * clamp01((dust - 0.34) / 0.30);

        // confine to one diagonal band
        var cx = (x + 0.5) * SC, cy = (y + 0.5) * SC;
        var dAxis = Math.abs((cx - w * 0.5) * sa - (cy - h * 0.5) * ca);
        var band = Math.exp(-Math.pow(dAxis / (diag * 0.32), 2));

        /* Keep the type readable with an ELLIPSE, not a circle. The wordmark is a wide,
           short block, so a circular clearing big enough to protect its width also scoops
           out everything above and below it, which is what left the middle looking empty
           and smoky. An ellipse shaped like the type lets gas come close top and bottom
           while still guaranteeing contrast where the letters actually are. */
        var ex = (cx - w * 0.5) / (w * 0.34);
        var ey = (cy - h * 0.5) / (h * 0.26);
        var clear = clamp01(Math.pow(Math.hypot(ex, ey), 1.5));

        var amt = dens * band * clear;
        if (amt <= 0.004) { px[(y * bw + x) * 4 + 3] = 0; continue; }

        // hue: indigo -> teal along a slow independent field
        var mix = clamp01((fbm(nx * 0.55 + 9.1, ny * 0.55 + 4.7, 9, 3) - 0.28) / 0.44);
        var r = 48  + (16  - 48)  * mix;
        var g = 78  + (178 - 78)  * mix;
        var b = 190 + (186 - 190) * mix;

        /* One warm region, low and left. This is the only warm colour in the sky and it is
           what stops the whole field reading as one cold wash; it also ties the background
           to the gold in the mark without sitting near enough to compete with it. */
        var reg = Math.exp(-Math.pow(Math.hypot(cx - w * 0.22, cy - h * 0.82) / (diag * 0.34), 2));
        var warm = clamp01((fbm(nx * 0.7 + 21.3, ny * 0.7 + 13.9, 21, 3) - 0.34) * 3.2) * reg;
        r = r + (238 - r) * warm;
        g = g + (150 - g) * warm;
        b = b + (56  - b) * warm;

        /* Dense cores run hotter and paler, the way real emission regions do, but this is
           easy to overdo: pushed hard it desaturates the brightest gas toward white and the
           result reads as a grey smudge rather than a lit core. Kept low and gated late. */
        var hot = clamp01((core - 0.84) / 0.16);
        r += (255 - r) * hot * 0.30;
        g += (255 - g) * hot * 0.22;
        b += (255 - b) * hot * 0.14;

        var i4 = (y * bw + x) * 4;
        px[i4]     = r | 0;
        px[i4 + 1] = g | 0;
        px[i4 + 2] = b | 0;
        px[i4 + 3] = (clamp01(amt * 1.9) * 255) | 0;
      }
    }
    bctx.putImageData(img, 0, 0);

    bgx.save();
    bgx.globalCompositeOperation = 'lighter';
    bgx.imageSmoothingEnabled = true;
    bgx.imageSmoothingQuality = 'high';
    bgx.drawImage(buf, 0, 0, w, h);
    bgx.restore();

    /* STARS ARE WHAT SAY "SPACE". Gas alone, however good, reads as weather or as ink. An
       earlier pass had half this many at half this brightness and the field looked like a
       smoke plume; the fix was not better gas, it was more stars.

       Two populations, because one uniform size reads as noise: a dense faint layer that
       gives depth, and a sparser brighter layer that gives the eye something to land on.
       Both are static, so both live in the cached bitmap and cost nothing per frame. */
    var farCount = Math.min(5200, Math.round((w * h) / 330));
    for (var f = 0; f < farCount; f++) {
      var fx = Math.random() * w, fy = Math.random() * h;
      var dA = Math.abs((fx - w * 0.5) * sa - (fy - h * 0.5) * ca);
      var nb = Math.exp(-Math.pow(dA / (diag * 0.19), 2));
      if (Math.random() > 0.34 + nb * 0.66) continue;
      var fr = 0.24 + Math.random() * 0.58;
      var fa = (0.16 + Math.random() * 0.54) * (0.58 + nb * 0.42);
      bgx.beginPath();
      bgx.arc(fx, fy, fr, 0, 6.2832);
      bgx.fillStyle = 'rgba(' + pick(PALETTE) + ',' + fa.toFixed(3) + ')';
      bgx.fill();
    }

    var midCount = Math.min(260, Math.round((w * h) / 6200));
    for (var m = 0; m < midCount; m++) {
      var mx = Math.random() * w, my = Math.random() * h;
      var mA = Math.abs((mx - w * 0.5) * sa - (my - h * 0.5) * ca);
      var mb = Math.exp(-Math.pow(mA / (diag * 0.24), 2));
      if (Math.random() > 0.42 + mb * 0.58) continue;
      var col = pick(PALETTE);
      var mr = 0.7 + Math.random() * 0.7;
      var ma = 0.45 + Math.random() * 0.45;
      var hg = bgx.createRadialGradient(mx, my, 0, mx, my, mr * 5.5);
      hg.addColorStop(0, 'rgba(' + col + ',' + (ma * 0.5).toFixed(3) + ')');
      hg.addColorStop(1, 'rgba(' + col + ',0)');
      bgx.fillStyle = hg;
      bgx.fillRect(mx - mr * 5.5, my - mr * 5.5, mr * 11, mr * 11);
      bgx.beginPath();
      bgx.arc(mx, my, mr, 0, 6.2832);
      bgx.fillStyle = 'rgba(' + col + ',' + ma.toFixed(3) + ')';
      bgx.fill();
    }

    /* Vignette only. The previous version also punched a hard dark pool into the middle to
       rescue the type's contrast from bright gas sitting behind it; the elliptical clearing
       above does that job now, in the gas itself, so there is no hole to see. */
    var vg = bgx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.30, w / 2, h / 2, diag * 0.62);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.55)');
    bgx.fillStyle = vg;
    bgx.fillRect(0, 0, w, h);
  }

  // ── PART 2: the things that move ────────────────────────────────────────────────────────

  function buildTwinklers() {
    twinklers = [];
    flares = [];

    var count = Math.min(420, Math.round((w * h) / 3400));
    for (var i = 0; i < count; i++) {
      twinklers.push({
        x: Math.random() * w,
        y: Math.random() * h,
        r: rand(0.5, 1.5),
        colour: pick(PALETTE),
        base: rand(0.35, 1.0),
        /* Two rates that do not divide into each other, so the product never repeats on a
           short cycle. One sine gives every star an obvious metronome; two give irregular,
           unpredictable blinking, which is what the eye reads as a real sky. */
        s1: rand(1.1, 4.2),
        s2: rand(0.3, 1.3),
        p1: Math.random() * 6.2832,
        p2: Math.random() * 6.2832,
        /* Depth of blink. A third of them blink HARD (down to near zero and back), the rest
           shimmer. Mixed depth is what stops it looking like a string of fairy lights. */
        amp: Math.random() < 0.34 ? rand(0.75, 1.0) : rand(0.25, 0.6)
      });
    }

    /* FEWER AND SMALLER CROSS-FLARES than before (was up to 22, with spikes up to 22px).
       At that count and spike length they stop reading as bright stars and start reading as
       decoration, and they were a real part of why the old sky looked like clip-art. */
    var fcount = Math.min(9, Math.max(3, Math.round((w * h) / 150000)));
    for (var k = 0; k < fcount; k++) {
      flares.push({
        x: rand(w * 0.04, w * 0.96),
        y: rand(h * 0.04, h * 0.96),
        r: rand(1.1, 1.9),
        colour: pick(PALETTE),
        base: rand(0.7, 1.0),
        s1: rand(0.5, 1.6),
        s2: rand(0.2, 0.6),
        p1: Math.random() * 6.2832,
        p2: Math.random() * 6.2832,
        amp: rand(0.35, 0.7),
        spikes: rand(5, 11)
      });
    }
  }

  function twinkle(s, t) {
    if (reduce) return s.base;
    /* Product of two sines, each mapped to 0..1. The result spends more time dim than bright,
       which matches how twinkling actually looks: brief flashes out of a low baseline. */
    var a = 0.5 - 0.5 * Math.cos(s.s1 * t + s.p1);
    var b = 0.5 - 0.5 * Math.cos(s.s2 * t + s.p2);
    var m = 1 - s.amp * (1 - a * (0.45 + 0.55 * b));
    return Math.max(0, Math.min(1, s.base * m));
  }

  function spawnShot(t) {
    // Enters from the top half, travels down-right or down-left.
    var dir = Math.random() < 0.5 ? 1 : -1;
    shooting = {
      x: dir > 0 ? rand(-w * 0.1, w * 0.6) : rand(w * 0.4, w * 1.1),
      y: rand(-h * 0.05, h * 0.45),
      vx: dir * rand(420, 760),
      vy: rand(200, 380),
      life: 0,
      ttl: rand(0.55, 1.0),
      len: rand(70, 190),
      born: t
    };
  }

  function draw(now) {
    var t = (now - t0) / 1000;

    // The cached universe, blitted whole. One drawImage instead of the entire noise field.
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(bg, 0, 0);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    ctx.globalCompositeOperation = 'lighter';

    var i, s, a;

    for (i = 0; i < twinklers.length; i++) {
      s = twinklers[i];
      a = twinkle(s, t);
      if (a < 0.012) continue;                       // fully dark: skip the draw entirely
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, 6.2832);
      ctx.fillStyle = 'rgba(' + s.colour + ',' + a.toFixed(3) + ')';
      ctx.fill();
      if (a > 0.6) {                                 // halo only when actually bright
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r * 3.4, 0, 6.2832);
        ctx.fillStyle = 'rgba(' + s.colour + ',' + (a * 0.09).toFixed(3) + ')';
        ctx.fill();
      }
    }

    // Bright anchors with cross-flares. The spike length breathes with the twinkle, which is
    // what makes them read as brilliant rather than merely large.
    for (i = 0; i < flares.length; i++) {
      s = flares[i];
      a = twinkle(s, t);
      var L = s.spikes * (0.55 + 0.45 * a);

      var g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 7);
      g.addColorStop(0, 'rgba(' + s.colour + ',' + (a * 0.95).toFixed(3) + ')');
      g.addColorStop(0.28, 'rgba(' + s.colour + ',' + (a * 0.22).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(' + s.colour + ',0)');
      ctx.fillStyle = g;
      ctx.fillRect(s.x - s.r * 7, s.y - s.r * 7, s.r * 14, s.r * 14);

      ctx.strokeStyle = 'rgba(' + s.colour + ',' + (a * 0.34).toFixed(3) + ')';
      ctx.lineWidth = 0.7;
      ctx.beginPath();
      ctx.moveTo(s.x - L, s.y); ctx.lineTo(s.x + L, s.y);
      ctx.moveTo(s.x, s.y - L); ctx.lineTo(s.x, s.y + L);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r * 0.85, 0, 6.2832);
      ctx.fillStyle = 'rgba(255,255,255,' + (a * 0.9).toFixed(3) + ')';
      ctx.fill();
    }

    // Shooting star. Rare on purpose: constant meteors look like a screensaver.
    if (!reduce) {
      if (!shooting && t > nextShot) { spawnShot(t); }
      if (shooting) {
        var age = t - shooting.born;
        if (age > shooting.ttl) {
          shooting = null;
          nextShot = t + rand(4, 13);
        } else {
          var k = age / shooting.ttl;
          var cx = shooting.x + shooting.vx * age;
          var cy = shooting.y + shooting.vy * age;
          var nx = shooting.vx, ny = shooting.vy;
          var nl = Math.sqrt(nx * nx + ny * ny);
          nx /= nl; ny /= nl;
          var fade = Math.sin(Math.PI * k);          // fade in and out, never pop
          var tg = ctx.createLinearGradient(cx, cy, cx - nx * shooting.len, cy - ny * shooting.len);
          tg.addColorStop(0, 'rgba(255,255,255,' + (0.9 * fade).toFixed(3) + ')');
          tg.addColorStop(0.35, 'rgba(200,220,255,' + (0.35 * fade).toFixed(3) + ')');
          tg.addColorStop(1, 'rgba(160,190,255,0)');
          ctx.strokeStyle = tg;
          ctx.lineWidth = 1.7;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(cx, cy);
          ctx.lineTo(cx - nx * shooting.len, cy - ny * shooting.len);
          ctx.stroke();
        }
      }
    }

    ctx.globalCompositeOperation = 'source-over';
    if (!reduce) raf = requestAnimationFrame(draw);
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);   // cap: 3x is wasted fill rate
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    paintUniverse();
    buildTwinklers();
  }

  function start() {
    if (raf) cancelAnimationFrame(raf);
    t0 = performance.now();
    nextShot = 2.5;
    if (reduce) draw(t0); else raf = requestAnimationFrame(draw);
  }

  /* Stop drawing when the tab is hidden. A holding page has no business burning a CPU core in
     a background tab for weeks. */
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { if (raf) { cancelAnimationFrame(raf); raf = null; } }
    else if (!reduce) start();
  });

  var rt;
  window.addEventListener('resize', function () {
    clearTimeout(rt);
    rt = setTimeout(function () { resize(); if (!reduce) start(); }, 160);
  });

  resize();
  start();
})();
</script>
