<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LIMEN Helix</title>
<meta name="description" content="LIMEN Helix">
<!-- Kept deliberately: removing this loses Google Search Console ownership of the domain,
     which is painful to re-establish and has nothing to do with the site being down. -->
<meta name="google-site-verification" content="2xLI4zw_nL8XXPveYa48ALKWg6WDC86VzvtRvV6HayA" />
<link rel="canonical" href="https://limenhelix.com/">
<meta name="robots" content="noindex, nofollow">
<meta property="og:type" content="website">
<meta property="og:url" content="https://limenhelix.com/">
<meta property="og:title" content="LIMEN Helix">
<meta property="og:image" content="https://limenhelix.com/assets/img/limen-helix.jpg">
<link rel="icon" href="/assets/img/limen-helix.jpg">
<style>
  /* HOLDING PAGE — the site is down for now.
     One image, one phone number, no scripts, no fonts, no third-party requests.

     The previous homepage is intact in git and comes back with one command:
       git checkout 9430efd9 -- index.html                                             */

  :root { --gold:#D4AF37; --gold-dim:#7c6a2e; }

  *{margin:0;padding:0;box-sizing:border-box}

  /* overflow-x guard: with align-items:center, ANY child wider than the viewport shifts the
     whole column sideways and clips it. Verified on a 390px screenshot before this was added. */
  html,body{height:100%;background:#000;color:var(--gold);overflow-x:hidden}

  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:6vh 5vw;
    gap:clamp(1.6rem,5vw,2.8rem);
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    -webkit-font-smoothing:antialiased;
  }

  /* The mark carries the wordmark, so there is no <h1> text to compete with it.
     The name still reaches screen readers and search engines through the alt text. */
  img.mark{
    display:block;
    width:min(72vw, 44vh, 520px);   /* never taller than the viewport on a short screen */
    height:auto;
    max-width:100%;
  }

  a.phone{
    color:var(--gold);
    text-decoration:none;
    /* Sized so a 12-14 character number still fits inside a 320px screen. The letter-spacing
       is the part that bites: it adds per-character width that font-size clamping alone
       does not account for, which is what pushed this off-screen the first time. */
    font-size:clamp(.95rem,4.2vw,1.7rem);
    letter-spacing:.12em;
    font-variant-numeric:tabular-nums;
    padding:.55em .9em;
    border:1px solid var(--gold-dim);
    border-radius:2px;
    white-space:nowrap;      /* a phone number must never wrap mid-number */
    max-width:100%;
    transition:background 160ms ease,border-color 160ms ease;
  }
  a.phone:hover,a.phone:focus-visible{
    background:rgba(212,175,55,.09);
    border-color:var(--gold);
    outline:none;
  }

  @media (prefers-reduced-motion:reduce){a.phone{transition:none}}
</style>
</head>
<body>

  <img class="mark" src="/assets/img/limen-helix.jpg" alt="LIMEN Helix" width="1024" height="1024">

  <!-- Phone goes here when the number is available. The .phone style below is already
       written and verified down to a 320px screen, so this is a one-line addition:
       <a class="phone" href="tel:+1XXXXXXXXXX">(XXX) XXX-XXXX</a>                        -->

</body>
</html>
