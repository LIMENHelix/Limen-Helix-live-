<style>
*{margin:0;padding:0;box-sizing:border-box}
/* ROOT FONT-SIZE (2026-07-18): the console's type is all sub-0.5rem, which is 3-8px at the browser
   default 16px root — no html/:root font-size was ever set anywhere in the repo, so everything read
   tiny. Set a responsive root so the existing rem scale becomes legible. Scoped to this page only.
   Tunable: raise/lower the clamp to scale ALL console text uniformly. */
html{font-size:clamp(24px,2.6vw,32px)}
body{font-size:0.36rem}   /* sane default for any un-sized text (so it inherits ~12px, not 32px) */
html,body{background:#080c14;color:#e8e3d9;font-family:monospace;height:100%;width:100%;overflow-x:hidden;-webkit-user-select:none;user-select:none}

/* ═══ UNIVERSAL SECTION HEADER ═══ */
.limen-section-header{color:rgba(201,169,78,0.85);font-weight:600;letter-spacing:1.2px;text-transform:uppercase;text-shadow:0 0 6px rgba(201,169,78,0.25);opacity:1}
.limen-section-header:hover{color:rgba(201,169,78,1);text-shadow:0 0 8px rgba(201,169,78,0.4)}
/* Severity overrides */
.limen-section-header.severity-critical{color:#FF4D4D;text-shadow:0 0 8px rgba(255,77,77,0.6)}
.limen-section-header.severity-active{color:#00E5FF;text-shadow:0 0 6px rgba(0,229,255,0.4)}
.limen-section-header.severity-stable{color:#00FFAA;text-shadow:0 0 6px rgba(0,255,170,0.4)}

/* ═══ FULL-HEIGHT CONSOLE GRID ════════════════════════════════ */
#console-grid{
  display:grid;
  grid-template-columns:1fr 1.2fr 1fr;
  grid-template-rows:auto 1fr auto;
  grid-template-areas:
    "header  header  header"
    "left    center  right"
    "footer  footer  footer";
  min-height:100vh;
  gap:0 8px;
}

/* ─── Clarity view — content area below header ──────────────── */
#clarity-view{
  grid-column:1 / -1;
  grid-row:2;
  z-index:1;
  overflow-y:auto;
  overflow-x:hidden;
}

/* ─── Header bar ──────────────────────────────────────────────── */
#console-header{
  grid-area:header;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 16px;
  border-bottom:1px solid rgba(201,169,78,0.08);
  background:rgba(5,8,16,0.98);
  z-index:200;
  position:sticky;
  top:0;
  transform:translateZ(0);
}
.ch-left{
  display:flex;
  align-items:center;
  gap:10px;
}
.ch-title{
  font-size:0.48rem;
  letter-spacing:3px;
  text-transform:uppercase;
  color:rgba(201,169,78,0.7);
}
.ch-title a{color:rgba(201,169,78,0.6);text-decoration:none;transition:color 0.2s}
.ch-title a:hover{color:rgba(201,169,78,0.95)}
/* ── Nav dropdown ── */
.ch-nav-dropdown{position:relative;display:inline-block}
.ch-nav-btn{font-family:monospace;font-size:0.36rem;letter-spacing:2px;text-transform:uppercase;padding:4px 10px;border:1px solid rgba(201,169,78,0.2);border-radius:2px;background:rgba(201,169,78,0.04);color:rgba(201,169,78,0.7);cursor:pointer;transition:all 0.2s}
.ch-nav-btn:hover{border-color:rgba(201,169,78,0.4);color:rgba(201,169,78,0.95);background:rgba(201,169,78,0.08)}
.ch-nav-menu{display:none;position:absolute;top:100%;left:0;margin-top:4px;background:#0e1018;border:1px solid rgba(201,169,78,0.15);border-radius:3px;min-width:200px;z-index:500;padding:4px 0;box-shadow:0 4px 16px rgba(0,0,0,0.5)}
.ch-nav-menu.open{display:block}
.ch-nav-menu a{display:block;padding:6px 14px;font-size:0.36rem;letter-spacing:1.5px;color:rgba(201,169,78,0.6);text-decoration:none;transition:all 0.15s}
.ch-nav-menu a:hover{background:rgba(201,169,78,0.06);color:rgba(201,169,78,0.95)}
.ch-nav-menu a.active{color:rgba(201,169,78,0.95);border-left:2px solid rgba(201,169,78,0.5)}
/* ── Center mode switch ── */
.ch-center{display:flex;align-items:center;gap:0}
.ch-mode-btn{font-family:monospace;font-size:0.42rem;letter-spacing:2.5px;text-transform:uppercase;padding:5px 16px;border:1px solid rgba(201,169,78,0.15);background:none;color:rgba(201,169,78,0.4);cursor:pointer;transition:all 0.2s;font-weight:600}
.ch-mode-btn:first-child{border-radius:3px 0 0 3px;border-right:none}
.ch-mode-btn:last-child{border-radius:0 3px 3px 0}
.ch-mode-btn:hover{color:rgba(201,169,78,0.8);border-color:rgba(201,169,78,0.3)}
.ch-mode-btn.active{color:#C9A94E;border-color:rgba(201,169,78,0.45);background:rgba(201,169,78,0.08);text-shadow:0 0 8px rgba(201,169,78,0.3);font-weight:700}
.ch-right{
  display:flex;
  align-items:center;
  gap:10px;
}
.ch-status{
  font-size:0.40rem;
  letter-spacing:1.5px;
  color:rgba(200,195,184,0.35);
}
.ch-cmd-hint{
  display:none !important;
}
.ch-cmd-hint:hover{
  border-color:rgba(201,169,78,0.2);
  color:rgba(200,195,184,0.4);
}
#enter-connectome{
  font-family:monospace;
  font-size:0.36rem;
  letter-spacing:2px;
  text-transform:uppercase;
  color:rgba(201,169,78,0.6);
  cursor:pointer;
  padding:4px 10px;
  border:1px solid rgba(201,169,78,0.2);
  border-radius:2px;
  background:rgba(201,169,78,0.04);
  transition:background 0.3s,color 0.3s,border-color 0.3s;
}
#enter-connectome:hover{
  background:rgba(201,169,78,0.12);
  color:rgba(201,169,78,0.9);
  border-color:rgba(201,169,78,0.35);
}

/* ─── Column containers ───────────────────────────────────────── */
.console-col{
  overflow-y:auto;
  padding:8px 8px 60px;
  scrollbar-width:thin;
  scrollbar-color:rgba(201,169,78,0.1) transparent;
  position:relative;
  min-height:0;
}
.console-col::-webkit-scrollbar{width:3px}
.console-col::-webkit-scrollbar-thumb{background:rgba(201,169,78,0.1);border-radius:2px}

#col-left{grid-area:left;border-right:1px solid rgba(201,169,78,0.04)}
#col-center{grid-area:center}
#col-right{grid-area:right;border-left:1px solid rgba(201,169,78,0.04)}

/* Domain-scoped: hide columns immediately to prevent flash before brain boots */
.dcb-active #col-left,.dcb-active #col-center,.dcb-active #col-right{display:none!important}

/* ─── Column labels ───────────────────────────────────────────── */
.col-label{
  font-size:0.34rem;
  letter-spacing:2.5px;
  text-transform:uppercase;
  color:rgba(201,169,78,0.6);
  padding:6px 8px 8px;
  border-bottom:1px solid rgba(201,169,78,0.08);
  margin-bottom:8px;
  font-weight:600;
}

/* ─── Panel overrides: make fixed panels flow inside columns ──── */
.console-col > [id^="limen-"]{
  position:relative !important;
  top:auto !important;
  left:auto !important;
  right:auto !important;
  bottom:auto !important;
  transform:none !important;
  width:100% !important;
  max-width:100% !important;
  margin-bottom:8px;
  padding:10px 12px;
  border-radius:2px;
  box-shadow:none !important;
  pointer-events:auto !important;
}

/* ─── Investigation panel scroll fix ─────────────────────────── */
.console-col > #limen-investigation-drawer{
  max-height:420px !important;
  overflow-y:auto !important;
  overflow-x:hidden !important;
  min-height:0 !important;
  pointer-events:auto !important;
}

/* ─── Footer area ─────────────────────────────────────────────── */
#console-footer{
  grid-area:footer;
  display:flex;
  align-items:center;
  gap:12px;
  border-top:1px solid rgba(201,169,78,0.06);
  background:rgba(5,8,16,0.95);
  padding:3px 12px;
  font-size:0.36rem;
  letter-spacing:1.2px;
  color:rgba(200,195,184,0.35);
  z-index:100;
  min-height:24px;
  position:relative;
}
#footer-left{flex:1}
#footer-center{text-align:center;flex:1}
#footer-right{text-align:right;flex:1}

/* Footer panel overrides */
#console-footer > [id^="limen-"]{
  position:relative !important;
  top:auto !important;
  left:auto !important;
  right:auto !important;
  bottom:auto !important;
  transform:none !important;
  max-width:none !important;
  margin:0;
  display:inline-flex !important;
  align-items:center;
}

/* ─── Mode bar — hidden on domain console ─────────────────────── */
#limen-mode-bar{
  display:none !important;
}

/* ─── Biosensor badge — hidden on domain console (shown inline in exec strip) */
#limen-biosensor-badge{display:none !important}

/* ─── Stress strip — inline in footer, not floating overlay ────── */
#limen-stress-strip{
  position:relative !important;
  top:auto !important;
  bottom:auto !important;
  left:auto !important;
  right:auto !important;
  z-index:auto !important;
  background:none !important;
  border:none !important;
  padding:0 !important;
  pointer-events:auto !important;
  display:inline-flex !important;
  gap:8px;
  font-size:0.34rem !important;
  line-height:1.4 !important;
}

/* ─── Bottom-edge controls — vertical separation ─────────────── */
#limen-voice-control{
  bottom:4px !important;
  right:12px !important;
}
#limen-report-btn{
  display:none !important;  /* replaced by header button */
}
/* (removed) */

/* ─── Stability HUD — hidden on domain console (debug overlay, not for operators) */
#limen-stability-hud{
  display:none !important;
}

/* ─── Responsive ──────────────────────────────────────────────── */
@media(max-width:900px){
  #console-grid{
    grid-template-columns:1fr 1fr;
    grid-template-areas:
      "header  header"
      "left    center"
      "right   right"
      "footer  footer";
  }
  #col-right{border-left:none;border-top:1px solid rgba(201,169,78,0.04)}
}
@media(max-width:600px){
  #console-grid{
    grid-template-columns:1fr;
    grid-template-areas:
      "header"
      "left"
      "center"
      "right"
      "footer";
  }
  #col-left,#col-right{border:none}
}

.ro-section-arrow{font-size:0.35rem;color:rgba(201,169,78,0.4);min-width:10px}

<script>
(function () {
  'use strict';

  // ═══ HEADER CONTROLS — relocated to global top bar (assets/js/limen-topbar.js) ═══

  // ═══ PANEL RELOCATION — move fixed panels into grid columns ═══

  var PANEL_MAP = {
    // Left: Events, Escalation, Investigations
    'limen-event-rail':           'col-left',

    'limen-investigation-drawer': 'col-left',
    'limen-narrator-panel':       'col-left',
    'limen-systemic-panel':       'col-left',

    // Center: State, Feeds, Domain Overview
    'limen-global-state-badge':   'col-center',
    'limen-feed-inspector':       'col-center',
    'limen-domain-panel':         'col-center',
    'limen-timeline-strip':       'col-center',
    'limen-phase-display':        'col-center',

    // Right: Health, Research, Market
    'limen-health-strip':         'col-right',
    'limen-triage-panel':         'col-right',
    'limen-connectome-map':       'col-right',
    'limen-research-observatory': 'col-right',

    // Footer
    'limen-stress-strip':         'console-footer',
    'limen-snapshot-badge':       'console-footer'
  };

  function relocatePanel(panelId) {
    var el = document.getElementById(panelId);
    var targetId = PANEL_MAP[panelId];
    if (!el || !targetId) return false;
    var target = document.getElementById(targetId);
    if (!target) return false;
    if (el.parentNode === target) return true;
    target.appendChild(el);
    return true;
  }

  function relocateAll() {
    var moved = 0;
    for (var panelId in PANEL_MAP) {
      if (relocatePanel(panelId)) moved++;
    }
    return moved;
  }

  var _relocPasses = 0;
  var _relocInterval = setInterval(function () {
    relocateAll();
    _relocPasses++;
    if (_relocPasses >= 10) clearInterval(_relocInterval);
  }, 500);

  if (typeof MutationObserver !== 'undefined') {
    var obs = new MutationObserver(function (mutations) {
      for (var i = 0; i < mutations.length; i++) {
        var added = mutations[i].addedNodes;
        for (var j = 0; j < added.length; j++) {
          var node = added[j];
          if (node.id && PANEL_MAP[node.id]) {
            relocatePanel(node.id);
          }
        }
      }
    });
    obs.observe(document.body, { childList: true });
  }

  // ═══ MODE BAR: MAP → CONNECTOME ═══

  function patchModeBar() {
    var mapBtn = document.querySelector('#limen-mode-bar [data-action="map"]');
    if (!mapBtn) return false;
    mapBtn.textContent = 'CONNECTOME';
    mapBtn.setAttribute('data-action', 'connectome-nav');
    var newBtn = mapBtn.cloneNode(true);
    mapBtn.parentNode.replaceChild(newBtn, mapBtn);
    newBtn.addEventListener('click', function () {
      var fd = new URLSearchParams(window.location.search).get('domain') || null;
      var ctx = { focusDomain: fd, navigatedAt: Date.now() };
      if (window.LIMENUIState) window.LIMENUIState.setConnectomeContext(ctx);
      else sessionStorage.setItem('limen_connectome_context', JSON.stringify(ctx));
      window.location.href = '/connectome.html';
    });
    newBtn.addEventListener('mouseenter', function () {
      this.style.background = 'rgba(201,169,78,0.15)';
      this.style.borderColor = 'rgba(201,169,78,0.3)';
    });
    newBtn.addEventListener('mouseleave', function () {
      this.style.background = 'rgba(201,169,78,0.06)';
      this.style.borderColor = 'rgba(201,169,78,0.12)';
    });
    return true;
  }

  var _patchAttempts = 0;
  var _patchInterval = setInterval(function () {
    if (patchModeBar() || _patchAttempts++ > 20) clearInterval(_patchInterval);
  }, 300);

})();
</script>
