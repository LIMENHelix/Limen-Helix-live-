<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LIMEN HELIX &middot; SITE MAP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#050810;color:#e8e3d9;font-family:"IBM Plex Mono",monospace;min-height:100%}
a{color:inherit;text-decoration:none}

.sm-head{
  padding:18px 24px 10px;border-bottom:1px solid rgba(201,169,78,0.08);
  position:sticky;top:0;background:rgba(5,8,16,0.96);z-index:10;backdrop-filter:blur(4px);
}
.sm-crumb{font-size:0.42rem;letter-spacing:3px;text-transform:uppercase;color:rgba(201,169,78,0.45)}
.sm-crumb a:hover{color:rgba(201,169,78,0.9)}
.sm-title{font-size:0.95rem;letter-spacing:2px;color:#C9A94E;margin-top:6px;text-shadow:0 0 10px rgba(201,169,78,0.25)}
.sm-sub{font-size:0.45rem;letter-spacing:1.5px;color:rgba(200,195,184,0.4);margin-top:4px}
.sm-search{margin-top:12px}
.sm-search input{
  width:min(420px,100%);font-family:inherit;font-size:0.5rem;letter-spacing:1px;
  background:#0e1018;border:1px solid rgba(201,169,78,0.18);border-radius:3px;
  color:#e8e3d9;padding:7px 12px;outline:none;
}
.sm-search input:focus{border-color:rgba(201,169,78,0.45)}

.sm-wrap{padding:20px 24px 60px}
.sm-section{margin-bottom:26px}
.sm-section-name{
  font-size:0.46rem;letter-spacing:2.5px;text-transform:uppercase;
  color:rgba(201,169,78,0.7);font-weight:600;margin-bottom:12px;
  border-bottom:1px solid rgba(201,169,78,0.08);padding-bottom:6px;
}

/* Core/links grid */
.sm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.sm-item{
  display:block;font-size:0.5rem;letter-spacing:0.5px;color:#d0c8b8;
  padding:7px 10px;border-radius:3px;border:1px solid rgba(201,169,78,0.08);
  background:#0b0e16;transition:all 0.15s;
}
.sm-item:hover{background:rgba(201,169,78,0.06);color:#fff;border-color:rgba(201,169,78,0.3)}
.sm-item .sm-url{display:block;font-size:0.36rem;color:rgba(200,195,184,0.35);letter-spacing:1px;margin-top:2px}

/* Domain rows */
.sm-domain{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:9px 12px;margin-bottom:6px;border-radius:3px;
  background:#0b0e16;border:1px solid rgba(201,169,78,0.08);
}
.sm-domain-name{
  font-size:0.55rem;letter-spacing:1.5px;text-transform:uppercase;color:#e8e3d9;
  min-width:150px;flex:0 0 auto;
}
.sm-tag{
  font-size:0.38rem;letter-spacing:1.2px;text-transform:uppercase;
  padding:3px 10px;border-radius:2px;border:1px solid rgba(201,169,78,0.18);
  color:rgba(201,169,78,0.7);background:rgba(201,169,78,0.04);transition:all 0.15s;
}
.sm-tag:hover{color:#fff;border-color:rgba(201,169,78,0.45);background:rgba(201,169,78,0.12)}
.sm-tag-console{color:#C9A94E;border-color:rgba(201,169,78,0.3)}
.sm-empty{font-size:0.45rem;color:rgba(200,195,184,0.4);padding:24px}
</style>
</head>
<body>
<script src="assets/js/auth-gate.js"></script>
<div id="limen-topbar"></div>
<script src="assets/js/limen-topbar.js"></script>

<div class="sm-head">
  <div class="sm-crumb"><a href="/civilization">CIVILIZATION</a> &nbsp;&rsaquo;&nbsp; SITE MAP</div>
  <div class="sm-title">SITE MAP</div>
  <div class="sm-sub" id="smCount"></div>
  <div class="sm-search"><input type="text" id="smSearch" placeholder="Filter..." autocomplete="off"></div>
</div>

<div class="sm-wrap" id="smWrap"></div>

<script>
(function () {
  'use strict';

  // ── Curated cockpit / tools (the surfaces actually used) ──
  var CORE = [
    { label: 'Civilization (Cockpit)', url: '/civilization' },
    { label: 'Connectome',             url: '/connectome' },
    { label: 'Command Board',          url: '/kernel-comparison' },
    { label: 'Phase Map',              url: '/phase-map' },
    { label: 'Observatory',            url: '/civilization-opportunities' },
    { label: 'Opportunities',          url: '/opportunities' },
    { label: 'Treatment Discovery',    url: '/treatment-discovery' },
    { label: 'My Documents',           url: '/my-documents' },
    { label: 'Pattern Proposals',      url: '/pattern-proposals' },
    { label: 'System Vitals',          url: '/vitals' }
  ];

  // ── The 20 domains. Console + Portal are universal routes (?domain=X). ──
  // opps = a dedicated {domain}-opportunities.html exists (else use global /opportunities).
  var DOMAINS = [
    { d: 'agriculture',    opps: false },
    { d: 'communication',  opps: true  },
    { d: 'culture',        opps: true  },
    { d: 'defense',        opps: false },
    { d: 'economy',        opps: false },
    { d: 'education',      opps: true  },
    { d: 'energy',         opps: true  },
    { d: 'environment',    opps: false },
    { d: 'finance',        opps: true  },
    { d: 'governance',     opps: false },
    { d: 'industry',       opps: false },
    { d: 'infrastructure', opps: false },
    { d: 'intelligence',   opps: true  },
    { d: 'law',            opps: false },
    { d: 'medicine',       opps: true  },
    { d: 'population',     opps: true  },
    { d: 'religion',       opps: false },
    { d: 'science',        opps: true  },
    { d: 'technology',     opps: true  },
    { d: 'trade',          opps: false }
  ];

  var wrap = document.getElementById('smWrap');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  function matches(f, txt) { return !f || txt.toLowerCase().indexOf(f) !== -1; }

  function render(filter) {
    var f = (filter || '').trim().toLowerCase();
    var html = '';

    // Domains section
    var domRows = '';
    for (var i = 0; i < DOMAINS.length; i++) {
      var x = DOMAINS[i];
      if (!matches(f, x.d)) continue;
      var tags = '<a class="sm-tag sm-tag-console" href="/domain-console?domain=' + x.d + '">Console</a>';
      tags += '<a class="sm-tag" href="/portal?domain=' + x.d + '">Portal</a>';
      if (x.opps) tags += '<a class="sm-tag" href="/' + x.d + '-opportunities">Opportunities</a>';
      domRows += '<div class="sm-domain"><span class="sm-domain-name">' + cap(x.d) + '</span>' + tags + '</div>';
    }
    if (domRows) html += '<div class="sm-section"><div class="sm-section-name">The 20 Domains</div>' + domRows + '</div>';

    // Core section
    var coreCards = '';
    for (var j = 0; j < CORE.length; j++) {
      var c = CORE[j];
      if (!matches(f, c.label + ' ' + c.url)) continue;
      coreCards += '<a class="sm-item" href="' + esc(c.url) + '">' + esc(c.label) +
                   '<span class="sm-url">' + esc(c.url) + '</span></a>';
    }
    if (coreCards) html += '<div class="sm-section"><div class="sm-section-name">Cockpit &amp; Tools</div><div class="sm-grid">' + coreCards + '</div></div>';

    wrap.innerHTML = html || '<div class="sm-empty">Nothing matches &ldquo;' + esc(f) + '&rdquo;.</div>';
  }

  document.getElementById('smCount').textContent = DOMAINS.length + ' domains · ' + CORE.length + ' cockpit pages';
  document.getElementById('smSearch').addEventListener('input', function () { render(this.value); });
  render('');
})();
</script>
</body>
</html>
