<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Grok Movies · LIMEN Helix</title>
  <meta name="description" content="10-second educational videos about Grok AI. Learn and copy transcripts with a subscription." />
  <link rel="canonical" href="https://limenhelix.com/grok-movies" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", sans-serif;
      background: #fafafa;
      color: #1a1a1a;
      line-height: 1.6;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0a0a0a; color: #e5e5e5; }
    }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    header {
      text-align: center;
      padding: 40px 0;
      border-bottom: 1px solid #e5e5e5;
    }
    @media (prefers-color-scheme: dark) {
      header { border-bottom-color: #333; }
    }
    h1 { font-size: 2.5rem; margin-bottom: 10px; }
    .tagline { font-size: 1.1rem; color: #666; margin-bottom: 30px; }
    @media (prefers-color-scheme: dark) {
      .tagline { color: #999; }
    }

    .controls {
      display: flex;
      gap: 15px;
      margin: 30px 0;
      flex-wrap: wrap;
    }
    .search-box {
      flex: 1;
      min-width: 200px;
      padding: 10px 15px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 1rem;
    }
    @media (prefers-color-scheme: dark) {
      .search-box { background: #1a1a1a; border-color: #333; color: #e5e5e5; }
    }
    .filter-select {
      padding: 10px 15px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
    }
    @media (prefers-color-scheme: dark) {
      .filter-select { background: #1a1a1a; border-color: #333; color: #e5e5e5; }
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin: 30px 0;
    }
    .video-card {
      background: white;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    @media (prefers-color-scheme: dark) {
      .video-card { background: #1a1a1a; border-color: #333; }
    }
    .video-title { font-size: 1.2rem; font-weight: 600; }
    .video-meta {
      font-size: 0.9rem;
      color: #666;
      display: flex;
      gap: 15px;
    }
    @media (prefers-color-scheme: dark) {
      .video-meta { color: #999; }
    }
    .video-topic {
      display: inline-block;
      padding: 4px 10px;
      background: #f0f0f0;
      border-radius: 4px;
      font-size: 0.85rem;
      width: fit-content;
    }
    @media (prefers-color-scheme: dark) {
      .video-topic { background: #333; }
    }
    .transcript-preview {
      font-size: 0.95rem;
      color: #555;
      max-height: 80px;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.4;
    }
    @media (prefers-color-scheme: dark) {
      .transcript-preview { color: #aaa; }
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn-watch {
      background: #007bff;
      color: white;
    }
    .btn-watch:hover { background: #0056b3; }
    .btn-copy {
      background: #28a745;
      color: white;
    }
    .btn-copy:hover { background: #218838; }
    .btn-copy.locked {
      background: #999;
      cursor: not-allowed;
      opacity: 0.7;
    }
    .btn-copy.locked:hover { background: #999; }

    .auth-panel {
      background: #f8f9fa;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 20px;
      margin: 30px 0;
      text-align: center;
    }
    @media (prefers-color-scheme: dark) {
      .auth-panel { background: #1a1a1a; border-color: #333; }
    }
    .auth-panel h2 { margin-bottom: 15px; }
    .auth-email {
      width: 100%;
      max-width: 300px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      margin-bottom: 15px;
      font-size: 1rem;
    }
    @media (prefers-color-scheme: dark) {
      .auth-email { background: #0a0a0a; border-color: #333; color: #e5e5e5; }
    }
    .btn-subscribe {
      background: #dc3545;
      color: white;
      padding: 12px 30px;
      margin: 0 5px;
    }
    .btn-subscribe:hover { background: #c82333; }
    .btn-check {
      background: #6c757d;
      color: white;
      padding: 12px 30px;
      margin: 0 5px;
    }
    .btn-check:hover { background: #5a6268; }
    .status-msg {
      margin-top: 15px;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.95rem;
    }
    .status-msg.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .status-msg.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    @media (prefers-color-scheme: dark) {
      .status-msg.success { background: #1e3a1e; color: #7dce7d; border-color: #2d5a2d; }
      .status-msg.error { background: #3a1e1e; color: #e07d7d; border-color: #5a2d2d; }
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: #666;
    }
    @media (prefers-color-scheme: dark) {
      .empty-state { color: #999; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Grok Movies</h1>
      <p class="tagline">10-second educational videos. Learn about AI, copy transcripts with a subscription.</p>
    </header>

    <div class="auth-panel">
      <h2>Subscribe to Copy Transcripts</h2>
      <input type="email" id="userEmail" class="auth-email" placeholder="your@email.com" />
      <button class="btn-check" onclick="checkSubscription()">Check Subscription</button>
      <button class="btn-subscribe" onclick="startCheckout()">Subscribe $4.99/month</button>
      <div id="authStatus"></div>
    </div>

    <div class="controls">
      <input type="text" id="searchBox" class="search-box" placeholder="Search videos or transcripts..." onkeyup="search()" />
      <select id="topicFilter" class="filter-select" onchange="search()">
        <option value="">All Topics</option>
      </select>
    </div>

    <div id="gallery" class="gallery"></div>
    <div id="emptyState" class="empty-state" style="display: none;">
      <p>No videos found. Try a different search.</p>
    </div>
  </div>

  <script>
    let allVideos = [];
    let userEmail = '';
    let isSubscribed = false;

    async function loadVideos() {
      try {
        const res = await fetch('/api/grok-movies?action=list');
        const data = await res.json();
        if (data.ok) {
          allVideos = data.videos;
          renderVideos(allVideos);
          loadTopics();
        }
      } catch (e) {
        console.error('Failed to load videos:', e);
      }
    }

    async function loadTopics() {
      try {
        const res = await fetch('/api/grok-movies?action=topics');
        const data = await res.json();
        if (data.ok) {
          const select = document.getElementById('topicFilter');
          data.topics.forEach(topic => {
            const opt = document.createElement('option');
            opt.value = topic;
            opt.textContent = topic;
            select.appendChild(opt);
          });
        }
      } catch (e) {
        console.error('Failed to load topics:', e);
      }
    }

    function renderVideos(videos) {
      const gallery = document.getElementById('gallery');
      const emptyState = document.getElementById('emptyState');

      if (!videos.length) {
        gallery.innerHTML = '';
        emptyState.style.display = 'block';
        return;
      }

      emptyState.style.display = 'none';
      gallery.innerHTML = videos.map(v => `
        <div class="video-card">
          <div class="video-title">${escapeHtml(v.title)}</div>
          <div class="video-meta">
            <span>⏱ ${v.duration}</span>
          </div>
          <div class="video-topic">${escapeHtml(v.topic)}</div>
          <div class="transcript-preview">${escapeHtml(v.transcript)}</div>
          <div class="actions">
            <button class="btn-watch" onclick="playVideo('${v.id}')">Watch</button>
            <button class="btn-copy ${isSubscribed ? '' : 'locked'}" onclick="${isSubscribed ? `copyTranscript('${v.id}')` : `alert('Subscribe to copy transcripts')`}">
              ${isSubscribed ? 'Copy' : 'Lock'}
            </button>
          </div>
        </div>
      `).join('');
    }

    function search() {
      const query = document.getElementById('searchBox').value.toLowerCase();
      const topic = document.getElementById('topicFilter').value;

      let filtered = allVideos.filter(v => {
        const matchesQuery = !query || v.title.toLowerCase().includes(query) || v.transcript.toLowerCase().includes(query);
        const matchesTopic = !topic || v.topic === topic;
        return matchesQuery && matchesTopic;
      });

      renderVideos(filtered);
    }

    function playVideo(id) {
      alert(`Playing: ${id}\n\nVideo playback would open here. Real video URLs coming soon.`);
    }

    function copyTranscript(id) {
      const video = allVideos.find(v => v.id === id);
      if (!video) return;
      navigator.clipboard.writeText(video.transcript).then(() => {
        alert(`Copied: "${video.title}"\n\n${video.transcript}`);
      }).catch(() => {
        alert(`Text:\n\n${video.transcript}`);
      });
    }

    async function checkSubscription() {
      const email = document.getElementById('userEmail').value.trim();
      if (!email) {
        showStatus('Enter your email', 'error');
        return;
      }

      try {
        const res = await fetch('/api/grok-movies?action=verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();

        if (data.ok) {
          userEmail = email;
          isSubscribed = data.subscribed;
          if (isSubscribed) {
            showStatus('You are subscribed! Copy transcripts now.', 'success');
            renderVideos(allVideos);
          } else {
            showStatus('No active subscription found.', 'error');
          }
        }
      } catch (e) {
        showStatus('Error checking subscription.', 'error');
      }
    }

    async function startCheckout() {
      const email = document.getElementById('userEmail').value.trim();
      if (!email) {
        showStatus('Enter your email', 'error');
        return;
      }

      try {
        const res = await fetch('/api/grok-movies?action=checkout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();

        if (data.ok) {
          window.location.href = data.url;
        } else {
          showStatus(data.error || 'Checkout failed', 'error');
        }
      } catch (e) {
        showStatus('Error starting checkout', 'error');
      }
    }

    function showStatus(msg, type) {
      const div = document.getElementById('authStatus');
      div.className = `status-msg ${type}`;
      div.textContent = msg;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    loadVideos();
  </script>
</body>
</html>
