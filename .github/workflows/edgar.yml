# FINANCE distress signal worker — pulls SEC EDGAR distress filings (bankruptcy / default / delisting /
# going-concern / late), ranks them, POSTs to /api/finance-distress-ingest. National single-source, free.
name: EDGAR distress signal
on:
  schedule:
    - cron: '0 13 * * *'      # daily
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts/edgar-fetch.js
            lib/edgar.js
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: fetch + ingest EDGAR distress
        run: node scripts/edgar-fetch.js
        env:
          LEAD_ADMIN_KEY: ${{ secrets.LEAD_ADMIN_KEY }}
          INGEST_URL: https://limenhelix.com
      - name: report this run to the harness
        # Records that this job ran, so /api/harness can tell "never ran" from
        # "ran and failed". Never fails the job: a ledger outage must not look
        # like a work outage.
        if: always()
        continue-on-error: true
        env:
          HARNESS_KEY: ${{ secrets.LEAD_ADMIN_KEY }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then OK=1; else OK=0; fi
          curl -sS -m 15 -o /dev/null -G https://limenhelix.com/api/harness \
            --data-urlencode "beat=edgar" \
            --data-urlencode "ok=$OK" \
            --data-urlencode "note=$JOB_STATUS" \
            --data-urlencode "key=$HARNESS_KEY" || true
