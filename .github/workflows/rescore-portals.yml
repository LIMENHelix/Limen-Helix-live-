name: Rescore portals (EDGAR → portal refresh)

# Keeps company-portal financialHealth current. Portal scores were frozen at a
# one-time Nov-2024 migration; this re-runs the envelope-aware kernel against
# live EDGAR (via the deployed /api/limen/score) and commits fresh, envelope-
# classified financialHealth back into assets/data/companies/*.json.
#
# Cheap: EDGAR + kernel only, NO AI spend — so it's safe to schedule (unlike
# artifact generation, which stays operator-fired).
#
# Pushes to THIS repo, so the built-in GITHUB_TOKEN suffices (no cross-repo PAT).

on:
  schedule:
    - cron: '0 6 * * 1'      # Mondays 06:00 UTC — catches the week's new 10-Q/10-K filings
  workflow_dispatch:
    inputs:
      stale_only:
        description: 'Only refresh portals whose stored quarter is >2 quarters old'
        type: boolean
        default: false
      base:
        description: 'Scoring endpoint base URL'
        default: 'https://limenhelix.com'

concurrency:
  group: rescore-portals
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rescore:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rescore portals against live envelope-aware kernel
        run: |
          ARGS="--pace 500 --base ${{ github.event.inputs.base || 'https://limenhelix.com' }}"
          if [ "${{ github.event.inputs.stale_only }}" = "true" ]; then ARGS="$ARGS --stale-only"; fi
          echo "Running: node scripts/rescore-portals.mjs $ARGS"
          node scripts/rescore-portals.mjs $ARGS | tee rescore-output.txt

      - name: Commit refreshed portals
        run: |
          git config user.name  "limen-rescore-bot"
          git config user.email "rescore@limenhelix.com"
          # Drop the local progress log so it isn't committed
          rm -f scripts/_rescore-portals-log.jsonl rescore-output.txt
          if git diff --quiet -- assets/data/companies/; then
            echo "No portal changes this run."
            exit 0
          fi
          git add assets/data/companies/
          SUMMARY=$(git diff --cached --name-only -- assets/data/companies/ | wc -l)
          git commit -m "Auto: rescore $SUMMARY company portals against live EDGAR

          Scheduled EDGAR → portal financialHealth refresh (envelope-aware kernel).
          Generated by .github/workflows/rescore-portals.yml. No AI spend.

          Co-Authored-By: Claude Opus 4.8 (1M context) <noreply@anthropic.com>"
          # Rebase-and-retry push (linear main; tolerate a concurrent commit landing mid-run)
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then echo "pushed"; exit 0; fi
            echo "push rejected, rebasing (attempt $i)…"
            git pull --rebase origin main || true
          done
          echo "::warning::rescore push failed after 5 attempts; next scheduled run will retry"
