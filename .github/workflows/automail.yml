# Homestead autonomous auto-mail — ARM-SWITCH gated, sends server-side.
# The daily cron just POKES the Vercel endpoint (/api/homestead-automail action=send).
# The Lob key + return address live in Vercel env — never copied into GitHub. The endpoint
# no-ops unless the operator armed the switch, and dry-runs unless LOB_API_KEY + MAIL_FROM_*
# are set. Two gates: switch = safety, Lob key = spend. "Wire everything, hit a switch."
name: Homestead auto-mail

on:
  schedule:
    - cron: '45 11 * * *'      # ~45 min after the 11:00 UTC scrape/enrich
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  automail:
    runs-on: ubuntu-latest
    concurrency: { group: homestead-automail, cancel-in-progress: false }
    steps:
      - name: trigger server-side auto-mail (no-op unless armed)
        run: |
          echo "Triggering /api/homestead-automail action=send ..."
          RESP=$(curl -s -X POST "https://limenhelix.com/api/homestead-automail" \
            -H "content-type: application/json" \
            -d "{\"key\":\"${{ secrets.LEAD_ADMIN_KEY }}\",\"action\":\"send\"}")
          echo "Response: $RESP"
          echo "$RESP" | grep -q '"ok":true' || { echo "auto-mail call failed"; exit 1; }
