# Homestead autonomous auto-mail — ARM-SWITCH gated, sends server-side.
# The daily cron just POKES the Vercel endpoint (/api/homestead-automail action=send).
# The Lob key + return address live in Vercel env — never copied into GitHub. The endpoint
# no-ops unless the operator armed the switch, and dry-runs unless LOB_API_KEY + MAIL_FROM_*
# are set. Two gates: switch = safety, Lob key = spend. "Wire everything, hit a switch."
name: Homestead auto-mail

on:
  schedule:
    - cron: '45 11 * * *'      # ~45 min after the 11:00 UTC scrape/enrich
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  automail:
    runs-on: ubuntu-latest
    concurrency: { group: homestead-automail, cancel-in-progress: false }
    steps:
      - name: trigger server-side auto-mail (no-op unless armed)
        run: |
          echo "Triggering /api/homestead-automail action=send ..."
          RESP=$(curl -s -X POST "https://limenhelix.com/api/homestead-automail" \
            -H "content-type: application/json" \
            -d "{\"key\":\"${{ secrets.LEAD_ADMIN_KEY }}\",\"action\":\"send\"}")
          echo "auto-mail: $RESP"
          echo "$RESP" | grep -q '"ok":true' || { echo "auto-mail call failed"; exit 1; }
      - name: validation tracker — snapshot cohort + check outcomes
        run: |
          K='${{ secrets.LEAD_ADMIN_KEY }}'
          echo "snapshot: $(curl -s -X POST https://limenhelix.com/api/homestead-validation -H 'content-type: application/json' -d "{\"key\":\"$K\",\"action\":\"snapshot\"}")"
          echo "check:    $(curl -s -X POST https://limenhelix.com/api/homestead-validation -H 'content-type: application/json' -d "{\"key\":\"$K\",\"action\":\"check\"}")"
      - name: report this run to the harness
        # Records that this job ran, so /api/harness can tell "never ran" from
        # "ran and failed". Never fails the job: a ledger outage must not look
        # like a work outage.
        if: always()
        continue-on-error: true
        env:
          HARNESS_KEY: ${{ secrets.LEAD_ADMIN_KEY }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then OK=1; else OK=0; fi
          curl -sS -m 15 -o /dev/null -G https://limenhelix.com/api/harness \
            --data-urlencode "beat=automail" \
            --data-urlencode "ok=$OK" \
            --data-urlencode "note=$JOB_STATUS" \
            --data-urlencode "key=$HARNESS_KEY" || true
