name: Discovery store refresh (treatment-discovery data)

# Keeps the treatment-discovery surface (limenhelix.com/treatment-discovery)
# current without manual runs. Each scheduled run:
#   1. rebuilds the discovery store under one snapshot (cube → residuals →
#      ledger join → render split → epistemic buckets → master inbox). This
#      also materializes the gitignored 81MB cube the verification organ reads,
#      so it MUST run before the organ in a fresh checkout,
#   2. verifies budget-capped batches of PENDING claims (verification organ —
#      append-only ledger). Two invocations so the biomedical queue is never
#      starved: the general run drains the rule-based/affinity front of the
#      queue (~20k claims), a --verifier=pubmed run is reserved for the PubMed
#      queue behind it (otherwise --max would never reach it),
#   3. rebuilds again so the new verdicts propagate into every artifact under
#      one final snapshot,
#   4. runs the 19-check reconciliation self-test,
#   5. ships ONLY if something substantive changed (scripts/substantive-data-
#      change.mjs strips snapshot timestamps before deciding — otherwise every
#      run would commit pure timestamp churn). Shipping needs a non-actions
#      credential: GitHub suppresses workflow runs on GITHUB_TOKEN-created
#      PRs, so required checks can never start on one. Two modes:
#        - AUTO_SHIP_TOKEN secret set: push + PR + self-merge as that actor,
#          gated by a data-only provenance check (this automation may never
#          land a code change unattended),
#        - secret absent: validate and stop with a notice — no half-broken
#          bot PRs littering the repo.
#      (Verified live: GH013 rejects even GITHUB_TOKEN direct pushes, and
#      rescore-portals.yml's silent direct-push loop has been failing the same
#      way since the ruleset landed.)
#
# The job is main-only: a workflow_dispatch from a feature branch must never
# publish that branch's HEAD anywhere (scheduled runs always have ref == main).
#
# Cheap: PubMed e-utils (2 req/sec without a key) + local rebuild. NO AI spend.
# PR merges use --squash so the resulting main commit keeps the operator author
# (Vercel's git-author deployment protection blocks bot-authored commits).
#
# Add secrets.PUBMED_API_KEY (NCBI) to raise PubMed pacing from 2/sec to 8/sec.

on:
  schedule:
    - cron: '30 7 * * 1'    # Mondays 07:30 UTC, after the 06:00 portal rescore
  workflow_dispatch:
    inputs:
      general_claims:
        description: 'Organ budget — general queue (rule-based, affinities; first-come)'
        type: number
        default: 150
      pubmed_claims:
        description: 'Organ budget — PubMed queue (biomedical claims, network-paced)'
        type: number
        default: 50

concurrency:
  group: discovery-store-refresh
  cancel-in-progress: false

permissions:
  contents: write
  # gh pr create / pr merge need pull-requests scope (unspecified scopes are
  # 'none' once a permissions block exists)
  pull-requests: write

jobs:
  refresh:
    # main-only: a workflow_dispatch from a feature branch must never push its
    # HEAD to main (scheduled runs always have ref == main).
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Binding-fidelity audit (generates the report the rule-based verifier requires)
        # The rule-based verifier refuses to issue VERIFIED without current
        # audit coverage (evidence-integrity repair, PR #398), so this must
        # run before any verification pass. The report ships with the other
        # data artifacts below, keeping the input tracked instead of
        # regenerated-from-memory each run.
        run: node scripts/organ-binding-fidelity.mjs

      - name: Rebuild discovery stores (snapshot 1 — also materializes the gitignored cube the organ reads)
        run: node scripts/reconcile-discovery-stores.mjs

      - name: Verify PENDING claims — general queue (rule-based, affinities)
        run: |
          MAX="${{ github.event.inputs.general_claims || 150 }}"
          echo "General organ budget this run: $MAX claims"
          node scripts/organ-claim-verification.mjs --max="$MAX"

      - name: Verify PENDING claims — PubMed queue (reserved budget)
        env:
          PUBMED_API_KEY: ${{ secrets.PUBMED_API_KEY }}
        run: |
          MAX="${{ github.event.inputs.pubmed_claims || 50 }}"
          echo "PubMed organ budget this run: $MAX claims"
          node scripts/organ-claim-verification.mjs --verifier=pubmed --max="$MAX"

      - name: Rebuild discovery stores (snapshot 2 — propagate new verdicts into every artifact)
        run: node scripts/reconcile-discovery-stores.mjs

      - name: Reconciliation self-test (expect 19/19)
        run: node scripts/test-discovery-store-reconciliation.js

      - name: Substantive-change gate
        id: gate
        run: node scripts/substantive-data-change.mjs

      - name: Commit + ship refreshed data
        if: steps.gate.outputs.substantive == 'true'
        env:
          # Optional: a fine-grained PAT (contents:write + pull-requests:write
          # on THIS repo) enabling the full unattended ship loop. REQUIRED for
          # shipping, because GitHub suppresses workflow runs on PRs created
          # by GITHUB_TOKEN — required checks would never start and the PR
          # could never merge. The PAT must be OPERATOR-OWNED so the squash/
          # merge commit on main resolves to the operator author (Vercel
          # git-author protection blocks bot-authored commits). Without it
          # this job validates and stops (see the notice below); the
          # alternative is adding GitHub Actions to the main ruleset bypass
          # list and restoring direct-push.
          AUTO_SHIP_TOKEN: ${{ secrets.AUTO_SHIP_TOKEN }}
        run: |
          git config user.name  "Chris Hubbel"
          git config user.email "chrishubbel72@gmail.com"
          git add assets/data/treatment-discovery/ \
                  assets/data/audit/verification-ledger.json \
                  assets/data/audit/binding-fidelity-report.json \
                  assets/data/audit/cube-unresolved-ids.json \
                  assets/data/audit/discovery-store-reconciliation.json \
                  assets/data/_master-inbox.json
          # Provenance gate: this automation may ONLY ever ship regenerated
          # data artifacts. If anything outside assets/data/ is dirty, a code
          # change has crept into the run — stop and leave it for humans.
          DIRTY=$(git status --porcelain | grep -v '^??' | grep -v 'assets/data/' || true)
          if [ -n "$DIRTY" ]; then
            echo "::error::non-data files unexpectedly changed — refusing to ship:"
            echo "$DIRTY"
            exit 1
          fi
          COUNTS=$(node -e "const s=require('./assets/data/treatment-discovery/_summary.json').epistemicBuckets;console.log(\`\${s.proven} proven / \${s.unproven} unproven / \${s.unknown} unknown / \${s.impossible} impossible\`)")
          git commit -m "Auto: treatment-discovery store refresh

          Scheduled rebuild of the discovery cube, cross-domain residuals,
          verification-ledger join, render artifacts, epistemic buckets and
          master inbox under one snapshot. Current claims: $COUNTS.
          Generated by .github/workflows/discovery-store-refresh.yml
          (substantive-change gated; reconciliation self-test 19/19).
          No AI spend.

          Co-Authored-By: Kimi Code <noreply@moonshot.cn>"
          if [ -z "$AUTO_SHIP_TOKEN" ]; then
            echo "::notice::AUTO_SHIP_TOKEN not configured — data validated (19/19, substantive) but NOT shipped. Provision the secret to enable the unattended ship loop, or add GitHub Actions to the main ruleset bypass list and switch this step to direct-push."
            exit 0
          fi
          # PAT path: push + open the PR as a REAL actor so the required
          # checks actually run (GITHUB_TOKEN-created PRs never trigger
          # workflows). Poll, then self-merge ONLY when the diff is data-only
          # (guaranteed above) and both required checks are green.
          BRANCH="auto/discovery-store-refresh-$(date -u +%Y%m%d-%H%M%S)"
          git push "https://x-access-token:${AUTO_SHIP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:$BRANCH"
          GH_TOKEN="$AUTO_SHIP_TOKEN" gh pr create --base main --head "$BRANCH" \
            --title "Auto: treatment-discovery store refresh" \
            --body "Scheduled discovery-store refresh (substantive-change gated, self-test 19/19, data-only provenance gate). Current claims: $COUNTS. Generated by discovery-store-refresh.yml. Self-merges once Vercel + repository-check pass."
          MERGED=0
          for i in $(seq 1 45); do
            sleep 20
            STATE=$(GH_TOKEN="$AUTO_SHIP_TOKEN" gh pr view "$BRANCH" --json mergeStateStatus -q .mergeStateStatus)
            echo "poll $i: mergeStateStatus=$STATE"
            case "$STATE" in
              CLEAN)
                if GH_TOKEN="$AUTO_SHIP_TOKEN" gh pr merge "$BRANCH" --squash --delete-branch \
                   || GH_TOKEN="$AUTO_SHIP_TOKEN" gh pr merge "$BRANCH" --merge --delete-branch; then MERGED=1; fi
                ;;
              BEHIND)
                # Never update-branch in place: merging data generated against
                # the old parent under a newer main re-creates the sourceCommit
                # lineage defect. Fail loudly; the next run ships from fresh
                # main with matching provenance.
                echo "::error::main advanced mid-run — closing auto-PR; re-run to ship from current main"
                GH_TOKEN="$AUTO_SHIP_TOKEN" gh pr close "$BRANCH" --delete-branch || true
                exit 1
                ;;
              DIRTY)
                echo "::error::auto-PR has conflicts — manual resolution needed"
                exit 1
                ;;
            esac
            [ "$MERGED" = "1" ] && break
          done
          if [ "$MERGED" != "1" ]; then
            echo "::error::auto-PR did not merge within the poll window"
            exit 1
          fi
          echo "shipped: $BRANCH merged to main"

      - name: report this run to the harness
        # Records that this job ran, so /api/harness can tell "never ran" from
        # "ran and failed". Never fails the job: a ledger outage must not look
        # like a work outage.
        if: always()
        continue-on-error: true
        env:
          HARNESS_KEY: ${{ secrets.LEAD_ADMIN_KEY }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then OK=1; else OK=0; fi
          curl -sS -m 15 -o /dev/null -G https://limenhelix.com/api/harness \
            --data-urlencode "beat=discovery-store-refresh" \
            --data-urlencode "ok=$OK" \
            --data-urlencode "note=$JOB_STATUS" \
            --data-urlencode "key=$HARNESS_KEY" || true
