# LIMEN Helix — autonomic loop (LIVE repo). The system audits and heals itself.
#
# Ported from the full repo's immune-system.yml (2026-06-13) so the autonomic
# pulse feeds the LIVE site: vitals + structural deltas commit to THIS repo and
# auto-deploy to limenhelix.com. Runs EVERY 24H (was 6h in full).
#
# Scope (deliberately narrow — NO AI at strictness 2, NO autonomous fire):
#   - vitals audit (12 organs) → _vitals.json
#   - process operator actions (PRINT/REFRESH/DECLINE; strictness 2 = deterministic, no AI)
#   - autonomous portal-regen QUEUE only (finds/flags backlog; does NOT build)
#   - safe corpus heals (scrub DATA_NEEDED, fix category bleed, wire CB slugs — idempotent)
#   - commit structural deltas back to main
# The dangerous autonomous-FIRE pipeline (autoqueue/autofire/multipass) stays
# PAUSED pending Gate A (ops/crons-paused-2026-06-01-pre-gate-a.json) — NOT here.
#
# IMPORTANT: the full repo's copy must be DISABLED (GitHub Actions tab) so this
# runs in exactly one place — both write the SHARED Upstash Redis (operator-actions).
name: Immune System (vitals + heal)

on:
  schedule:
    - cron: '0 8 * * *'        # every 24 hours (08:00 UTC, off the capital-engine 0/6/12/18 schedule)
  workflow_dispatch: {}        # manual trigger from the Actions tab

permissions:
  contents: write
  pull-requests: write     # the code gate below opens a PR instead of pushing code to main

jobs:
  immune:
    runs-on: ubuntu-latest
    concurrency:
      group: immune-system
      cancel-in-progress: false
    steps:
      # SPARSE CHECKOUT IS A DIAGNOSTIC HAZARD, not just a disk optimisation. Several organs
      # probe for a file inside a try/catch and treat a read failure as evidence about the
      # SYSTEM rather than about the checkout. Two confirmed cases, both fixed by listing the
      # file below:
      #   - assets/data/brain-connectome.json  -> the snapshot THIS JOB commits reported
      #     inhibitoryEdgesLoaded:0, so /vitals and the public /api/limen-stress-propagation
      #     both showed "0 damped" and the organ scored 100 on presence+fresh+size.
      #     CORRECTION 2026-07-31, measured after deploy: the LIVE hourly Vercel path was fine
      #     all along — /api/limen-stress-slim reports inhibitoryEdgesLoaded 6, loadError null,
      #     354 of 795 nodes damped, avg damping 0.9526. Only this job's checkout was blind.
      #     So this was an OBSERVABILITY outage, not a regulation outage. An earlier commit
      #     message here said the propagation "ran purely additive"; that was true of the
      #     committed snapshot and false of the running system.
      #   - assets/js/company-portal-ui.js     -> organ-dead-links.mjs:121 probes it for the
      #     `cp-empty` graceful fallback and sets severity `fallbackPresent ? low : high`.
      #     Absent from the checkout, so CI read false and escalated the finding to HIGH.
      # WIDENED 2026-07-31, because the cost argument turned out to run the other way. Measured:
      #   already in the cone   assets/data/companies 48M (796 files) + scripts/lib/handlers/api
      #                         14M + three assets/js subsets 5.2M  ~= 67M
      #   was excluded          rest of assets/js ~17M + every .html 31M              ~= 48M
      # So the audit was already pulling 48M of company JSON while omitting the 48M that contains
      # the actual surfaces. Roughly doubling a 67M checkout on a runner that already has a
      # "free up runner disk" step is not a real cost.
      #
      # What it buys, measured: 37 files across the full tree build company-portal links — 19 at
      # root, 17 in assets/js, 1 in scripts/. The cone let organ-dead-links see ONE of them, so it
      # reported "1 total emitters" and scored 100 while 36 surfaces went unaudited. Every organ
      # that walks the tree had the same blind spot.
      #
      # Still true and NOT fixed here: an organ that probes a path in a try/catch still cannot
      # tell "file absent" from "property absent". Widening the cone removes today's instances;
      # the durable fix is for organs to declare required inputs and report "input missing"
      # instead of inferring a system property from an ENOENT.
      #
      # assets/data/brain-connectome.json is REQUIRED by lib/limen-stress-propagator.js
      # loadInhibitoryEdges(). It was absent from the sparse list below until 2026-07-31, so
      # every snapshot this job committed carried inhibitoryEdgesLoaded:0 and the propagation
      # ran PURELY ADDITIVE — stress could accumulate but never regulate. The file has been
      # tracked in git since the initial commit and deploys fine as a static asset; it was only
      # ever missing from THIS checkout, and the loader's catch swallowed the ENOENT.
      - name: checkout (sparse — only what the autonomic loop needs)
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
          sparse-checkout: |
            scripts/
            api/
            handlers/
            lib/
            assets/data/companies/*.json
            assets/data/_vitals.json
            assets/data/bridge-patterns.json
            assets/data/verbiage-templates.json
            assets/data/command-board-data.json
            assets/data/command-board-eligible.json
            assets/data/brain-node-domains.json
            assets/data/connectome-node-registry.json
            assets/data/brain-connectome.json
            assets/data/companies-manifest.json
            assets/data/company-aliases.json
            assets/data/stress-network-state.json
            assets/js/
            *.html
            vercel.json
            ops/
            limen-helix-api/limen_v4_kernel.js
            limen-helix-api/limen_backtest_kernel.js
            package.json
            .gitignore
          sparse-checkout-cone-mode: false

      - name: free up runner disk (build tools we don't need)
        run: |
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true
          df -h /
        continue-on-error: true

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      # refresh the spider-web stress propagator snapshot FIRST so the audit below
      # reflects a fresh network (nothing else refreshed it -> it went 402h stale).
      # Inputs (lib/, assets/data/companies/, command-board-data.json) are all in
      # the sparse-checkout. Non-fatal so the pulse commits regardless.
      - name: refresh spider-web stress network (propagator snapshot)
        run: node scripts/build-stress-network.mjs
        continue-on-error: true

      - name: audit system (body-wide interoception · 12 organs)
        run: node scripts/audit-system-vitals.mjs

      # process operator actions: strictness 2 = deterministic (no AI). Keys passed
      # so a future strictness-3 refresh works once secrets are added to THIS repo;
      # non-fatal so the vitals + structural-delta commit happens regardless.
      - name: process operator actions (print/refresh/decline)
        run: node scripts/process-operator-actions.mjs --apply
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}

      - name: autonomous portal regen queue (find missing portals — DOES NOT build)
        run: node scripts/autonomous-portal-regen.mjs --apply
        continue-on-error: true

      - name: heal corpus (immune response · safe idempotent heals only)
        run: node scripts/heal-corpus.mjs --apply
        continue-on-error: true

      # ── THE CODE GATE ────────────────────────────────────────────────────────────────────
      # Until 2026-07-31 this step ran `git add -A` and pushed everything to main, which
      # auto-deploys. That is fine for the data artifacts the healers rewrite, and wrong for
      # anything executable: an autonomous run could ship code to production at 08:00 UTC with
      # nobody awake. CLAUDE.md already states the rule for autonomous builds (branch, push the
      # branch, report it, the human merge is what deploys); this step now implements it.
      #
      # TWO PHASES, deliberately split rather than gating the whole pulse:
      #   A. assets/data/** goes straight to main exactly as before, so /vitals keeps refreshing
      #      daily. These are idempotent artifact rewrites and heal-corpus now verifies them
      #      against a re-audit rather than trusting an exit code.
      #   B. ANYTHING ELSE is treated as code and goes to agent/immune-heal-<utc> with a PR.
      #      Nothing executable reaches production without an explicit merge.
      #
      # Conservative by construction: the data allowlist is a single path, so any new writer that
      # touches something unexpected lands in the gated half rather than shipping silently.
      #
      # Cost note: pushing a branch creates a Vercel PREVIEW deployment. Code heals should be rare
      # (there are currently no registered code heals at all), so this is near-zero build spend,
      # and the preview is what lets the change be reviewed before it is merged.
      - name: commit only structural changes (skip runtime artifacts)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Author as the operator's git identity (NOT a bot identity). Vercel's
          # git-author deployment protection BLOCKS production deploys triggered by
          # a commit author it can't resolve to a team member — so bot-authored
          # immune commits deploy as "Blocked" and never ship. Because the /vitals
          # immunity page reads the STATICALLY DEPLOYED assets/data/_vitals.json
          # (not Redis), a blocked deploy means the page never refreshes from the
          # pulse. Committing as the operator (whose email resolves to the trusted
          # GitHub account) lets the 24h pulse actually deploy + update /vitals.
          # Provenance stays in the commit message below ("Auto-generated by …").
          git config user.name  "Chris Hubbel"
          git config user.email "chrishubbel72@gmail.com"
          # Restore portal files only if heal didn't intend to change them is NOT
          # done here (live heals ARE committed). Stage everything stageable and
          # gate the commit on what's actually staged (sparse checkout reports
          # out-of-cone files that git add can't stage).
          # ── PHASE A · DATA → main (unchanged behaviour) ──────────────────────────────────
          # Only assets/data. Everything the healers legitimately rewrite lives here:
          # _vitals.json, companies/*.json, command-board-*.json, company-aliases.json,
          # stress-network-state.json.
          git add -- assets/data 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No data deltas."
          else
            git commit -m "Autonomic immune pulse — vitals + structural deltas

            Auto-generated by .github/workflows/immune-system.yml (LIVE, every 24h).
            Heavy runtime artifacts live in Upstash Redis; this commit carries the
            refreshed _vitals.json + any safe heals / alias / CB-slug deltas.
            DATA ONLY — code changes are gated to a PR in the next phase.

            Co-Authored-By: Claude Opus 4.8 (1M context) <noreply@anthropic.com>"
            pushed=0
            for attempt in 1 2 3 4 5; do
              if git push origin main; then pushed=1; break; fi
              echo "push rejected (attempt $attempt) — rebasing on latest origin/main"
              git fetch origin main || true
              git rebase origin/main || { git rebase --abort 2>/dev/null || true; sleep 3; }
            done
            if [ "$pushed" = 1 ]; then echo "Data deltas committed to main."; else echo "::warning::immune push failed after 5 attempts; next tick will retry"; fi
          fi

          # ── PHASE B · EVERYTHING ELSE → branch + PR, never main ──────────────────────────
          git add -A
          if git diff --cached --quiet; then
            echo "No code changes — nothing to gate."
          else
            BRANCH="agent/immune-heal-$(date -u +%Y%m%d-%H%M%S)"
            # Capture the file list BEFORE committing; --cached is empty afterwards.
            CHANGED=$(git diff --cached --name-only)
            COUNT=$(echo "$CHANGED" | sed '/^$/d' | wc -l | tr -d ' ')
            echo "::warning::immune pulse produced $COUNT code change(s) — gating to $BRANCH for review"
            echo "$CHANGED" | sed 's/^/  · /'
            # checkout -b carries the staged index onto the new branch, so nothing lands on main.
            git checkout -b "$BRANCH"
            git commit -m "Immune heal touched code — gated for review

            Auto-generated by .github/workflows/immune-system.yml. This branch exists because
            the pulse changed something outside assets/data, and executable changes are not
            allowed to reach production without a human merge. Data deltas from the same run
            went to main separately.

            Co-Authored-By: Claude Opus 4.8 (1M context) <noreply@anthropic.com>"
            if git push origin "$BRANCH"; then
              {
                echo "An autonomous immune pulse changed **$COUNT file(s) outside \`assets/data\`**, so it was gated here instead of shipping to production."
                echo
                echo "Nothing in this branch is live. Merging is what deploys."
                echo
                echo "### Changed"
                echo "$CHANGED" | sed '/^$/d' | sed 's/^/- `/' | sed 's/$/`/'
                echo
                echo "### Before merging"
                echo "- Confirm each change is something a healer should have made autonomously."
                echo "- Data deltas from this same run already went to \`main\`; this branch is code only."
                echo "- Vitals: https://limenhelix.com/vitals.html"
                echo
                echo "Generated by \`.github/workflows/immune-system.yml\`."
              } > /tmp/immune-pr-body.md
              gh pr create --base main --head "$BRANCH" \
                --title "Immune heal (gated): $COUNT code change(s) from the $(date -u +%Y-%m-%d) pulse" \
                --body-file /tmp/immune-pr-body.md \
                || echo "::warning::branch pushed but gh pr create failed — open the PR manually from $BRANCH"
            else
              echo "::error::could not push gated branch $BRANCH — code changes were NOT shipped and NOT saved"
            fi
          fi
      - name: report this run to the harness
        # Records that this job ran, so /api/harness can tell "never ran" from
        # "ran and failed". Never fails the job: a ledger outage must not look
        # like a work outage.
        if: always()
        continue-on-error: true
        env:
          HARNESS_KEY: ${{ secrets.LEAD_ADMIN_KEY }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then OK=1; else OK=0; fi
          curl -sS -m 15 -o /dev/null -G https://limenhelix.com/api/harness \
            --data-urlencode "beat=immune-system" \
            --data-urlencode "ok=$OK" \
            --data-urlencode "note=$JOB_STATUS" \
            --data-urlencode "key=$HARNESS_KEY" || true
