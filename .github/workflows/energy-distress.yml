# ENERGY L1 signal worker — pulls EIA retiring generators (EIA-860M), ranks by interconnection value,
# POSTs to /api/energy-distress-ingest. National, structured, free with a free EIA API key.
name: EIA retiring-generator signal
on:
  schedule:
    - cron: '0 16 * * 1'      # weekly Mondays 16:00 UTC (EIA-860M is monthly data)
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts/energy-distress-fetch.js
            lib/energy-distress.js
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: fetch + ingest EIA retiring generators
        run: node scripts/energy-distress-fetch.js
        env:
          LEAD_ADMIN_KEY: ${{ secrets.LEAD_ADMIN_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          INGEST_URL: https://limenhelix.com
      - name: report this run to the harness
        # Records that this job ran, so /api/harness can tell "never ran" from
        # "ran and failed". Never fails the job: a ledger outage must not look
        # like a work outage.
        if: always()
        continue-on-error: true
        env:
          HARNESS_KEY: ${{ secrets.LEAD_ADMIN_KEY }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then OK=1; else OK=0; fi
          curl -sS -m 15 -o /dev/null -G https://limenhelix.com/api/harness \
            --data-urlencode "beat=energy-distress" \
            --data-urlencode "ok=$OK" \
            --data-urlencode "note=$JOB_STATUS" \
            --data-urlencode "key=$HARNESS_KEY" || true
