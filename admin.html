<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LIMEN HELIX · Mission Control</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080a0f;color:#e8e3d9;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:15px;line-height:1.55;
  background-image:linear-gradient(rgba(201,169,78,0.015) 1px,transparent 1px),linear-gradient(90deg,rgba(201,169,78,0.015) 1px,transparent 1px);background-size:28px 28px;}
a{color:inherit;text-decoration:none}
.wrap{max-width:1000px;margin:0 auto;padding:46px 24px 90px}
.top{border-bottom:1px solid rgba(201,169,78,0.16);padding-bottom:22px}
.brand{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:rgba(201,169,78,0.55);margin-bottom:10px}
h1{font-size:28px;font-weight:400;letter-spacing:0.5px}
.who{font-size:11px;letter-spacing:2px;color:rgba(214,209,198,0.7);text-transform:uppercase;margin-top:5px}
.sec{display:flex;align-items:baseline;gap:9px;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:rgba(224,200,130,0.92);margin:32px 0 13px}
.sec .n{font-size:10px;letter-spacing:1px;color:rgba(214,209,198,0.38)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(224px,1fr));gap:11px}
.card{display:block;border:1px solid rgba(201,169,78,0.16);border-radius:5px;padding:14px 16px;background:#0c0f16;transition:border-color .15s,background .15s}
.card:hover{border-color:rgba(201,169,78,0.5);background:#0e1219}
.card .t{font-size:14.5px;color:#e8e3d9;margin-bottom:4px}
.card .d{font-size:10.5px;letter-spacing:0.5px;color:rgba(214,209,198,0.5);line-height:1.4}
.dgrid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.dgrid .card{padding:11px 13px}
.dgrid .card .t{text-transform:capitalize}
.logout{margin-top:46px;display:inline-block;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:rgba(212,87,75,0.8);border:1px solid rgba(212,87,75,0.3);padding:8px 18px;border-radius:3px;cursor:pointer;background:none}
.logout:hover{background:rgba(212,87,75,0.08)}
.gate{padding:70px 0;text-align:center;color:rgba(214,209,198,0.6)}
.gate button{margin-top:18px;background:transparent;border:1px solid rgba(201,169,78,0.45);color:#c9a94e;font-family:inherit;letter-spacing:2px;padding:10px 24px;border-radius:3px;cursor:pointer;text-transform:uppercase}
.badge{background:#5ab5a0;color:#04130f;font-weight:700;border-radius:10px;padding:0 7px;font-size:0.7em;margin-left:5px}
.lookup{margin:20px 0 2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lookup input{flex:1;min-width:220px;background:#0c0f16;border:1px solid rgba(201,169,78,0.22);color:#e8e3d9;font-family:inherit;font-size:13px;padding:10px 12px;border-radius:4px}
.lookup input:focus{outline:none;border-color:rgba(201,169,78,0.55)}
.lookup button{background:transparent;border:1px solid rgba(201,169,78,0.45);color:#c9a94e;font-family:inherit;letter-spacing:1.5px;font-size:11px;text-transform:uppercase;padding:10px 18px;border-radius:4px;cursor:pointer}
.lookup button:hover{background:rgba(201,169,78,0.08)}
.luout{width:100%}
.luout .r{border:1px solid rgba(201,169,78,0.16);border-radius:4px;padding:10px 12px;margin-top:8px;background:#0c0f16;font-size:12px;color:rgba(214,209,198,0.85)}
.luout .k{color:rgba(201,169,78,0.7);text-transform:uppercase;letter-spacing:1px;font-size:10px}
.luout .warn{color:#dca87e}
.luout .save{margin-left:12px;font-size:10px;padding:4px 10px;letter-spacing:1px}
.pullrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-left:4px}
.pulllbl{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:rgba(214,209,198,0.4)}
.lookup button.mini{padding:7px 12px;font-size:10px;letter-spacing:1px}
.lookup input.mini-in{flex:0 1 auto;min-width:150px;font-size:11px;padding:7px 10px}
.lookup input.tiny-in{flex:0 0 auto;width:64px;font-size:11px;padding:7px 8px}
.town{width:100%;margin-top:10px}
.town .bar{height:6px;background:#0c0f16;border:1px solid rgba(201,169,78,0.18);border-radius:3px;overflow:hidden;margin:8px 0}
.town .bar i{display:block;height:100%;background:rgba(201,169,78,0.55);width:0;transition:width .2s}
.town .stat{font-size:11px;letter-spacing:1px;color:rgba(214,209,198,0.7);margin:6px 0}
.town .stat b{color:#c9a94e}
.twrap{max-height:420px;overflow:auto;border:1px solid rgba(201,169,78,0.14);border-radius:4px;margin-top:8px}
table.tt{width:100%;border-collapse:collapse;font-size:11px}
table.tt th{position:sticky;top:0;background:#11151d;color:rgba(201,169,78,0.7);text-align:left;padding:6px 8px;font-weight:400;letter-spacing:1px;text-transform:uppercase;font-size:9.5px}
table.tt td{padding:5px 8px;border-top:1px solid rgba(201,169,78,0.08);color:rgba(214,209,198,0.9);vertical-align:top}
table.tt tr:hover td{background:rgba(201,169,78,0.04)}
table.tt td.dim{color:rgba(214,209,198,0.35)}
.town .dl{font-size:10px;padding:7px 14px;letter-spacing:1px}
.town .note{font-size:10px;color:rgba(214,209,198,0.5);margin-top:6px;line-height:1.5}
</style>

<script type="module" src="/assets/js/vercel-analytics.js"></script>

<body>
<div class="wrap">
  <div id="root"><div class="gate">Loading…</div></div>
</div>
<script src="assets/js/limen-admin-login.js"></script>
<script>
(function(){
  'use strict';
  var root=document.getElementById('root');
  var ALL_DOMAINS=['agriculture','communication','culture','defense','economy','education','energy','environment','finance','governance','industry','infrastructure','intelligence','law','medicine','population','religion','science','technology','trade'];
  var DOMAIN_DESC={energy:'Watch + console',culture:'Music front',infrastructure:'Watch + console',finance:'Capital Engine'};

  // Per-person login stores a `limen_admin` object. The front-page passphrase only sets
  // limen_access=granted (no person) - treat that as the master operator.
  function person(){
    var p=null; try{ p=JSON.parse(sessionStorage.getItem('limen_admin')||'null'); }catch(e){}
    if(p) return p;
    var granted=false; try{ granted=sessionStorage.getItem('limen_access')==='granted'; }catch(e){}
    if(granted) return { master:true, name:'Operator', domains:ALL_DOMAINS.slice() };
    return null;
  }
  function card(href,title,desc){ return '<a class="card" href="'+href+'"><div class="t">'+title+'</div><div class="d">'+(desc||'')+'</div></a>'; }
  /* the papers live on limenhelix.news, so they open in their own tab
     rather than navigating the console away from itself */
  function xcard(href,title,desc){ return '<a class="card" href="'+href+'" target="_blank" rel="noopener"><div class="t">'+title+'</div><div class="d">'+(desc||'')+'</div></a>'; }
  function sec(title,cards,cls){ cards=cards.filter(Boolean); if(!cards.length) return ''; return '<div class="sec">'+title+'<span class="n">'+cards.length+'</span></div><div class="grid'+(cls?' '+cls:'')+'">'+cards.join('')+'</div>'; }
  function head(p){ return '<div class="top"><div class="brand"><a href="/">LIMEN HELIX</a> · Mission Control</div><h1>'+(p?(p.name||'Operator'):'Sign in')+'</h1>'+(p?'<div class="who">'+(p.master?'Master access · full system':'Assigned operator')+'</div>':'')+'</div>'; }

  // Company-contact lookup bar: runs the free enrichment engine live (web-contact
  // + ddg-search) and shows the resolved email/phone, with a save-as-lead button.
  // Reuses the same sessionStorage key the rest of admin uses; never stores it in source.
  function wireLookup(){
    var q=document.getElementById('luq'), btn=document.getElementById('lubtn'), out=document.getElementById('luout');
    if(!q||!btn||!out) return;
    var KEY='limen_lead_admin_key';
    function getKey(force){ var k=''; try{k=sessionStorage.getItem(KEY)||'';}catch(e){} if(!k||force){ k=(window.prompt('Paste the sales/lead admin key (SALES_ADMIN_KEY or LEAD_ADMIN_KEY, set in Vercel). Kept only in this browser tab.')||'').trim(); try{ if(k) sessionStorage.setItem(KEY,k); }catch(e){} } return k; }
    function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function run(force){
      var org=(q.value||'').trim(); if(org.length<2){ out.innerHTML=''; return; }
      var k=getKey(force); if(!k){ out.innerHTML='<div class="r warn">admin key required</div>'; return; }
      out.innerHTML='<div class="r">looking up '+esc(org)+'…</div>';
      fetch('/api/leadgen?action=lookup&org='+encodeURIComponent(org)+'&key='+encodeURIComponent(k))
        .then(function(r){ return r.json().then(function(jj){ return {status:r.status,j:jj}; }); })
        .then(function(res){
          var jr=res.j||{};
          if(res.status===403||res.status===503){ try{sessionStorage.removeItem(KEY);}catch(e){} out.innerHTML='<div class="r warn">'+esc(jr.error||('auth '+res.status))+' · click Look up to re-enter the key</div>'; return; }
          if(!jr.ok){ out.innerHTML='<div class="r warn">'+esc(jr.error||'error')+'</div>'; return; }
          if(!jr.found){
            var ddg=(jr.backends||[]).filter(function(b){return b.id==='ddg-search';})[0];
            var hint=(ddg&&!ddg.active)?' · free web lookup only (needs a company website)':'';
            out.innerHTML='<div class="r warn">no contact found for '+esc(org)+hint+'</div>'; return;
          }
          out.innerHTML='<div class="r"><span class="k">email</span> '+esc(jr.email||'—')+' &nbsp;&nbsp; <span class="k">phone</span> '+esc(jr.phone||'—')+' &nbsp;&nbsp; <span class="k">mail</span> '+esc(jr.address||'—')+' &nbsp;&nbsp; <span class="k">via</span> '+esc(jr.via||'—')+' <button class="save" id="lusave">save as lead</button></div>';
          var sv=document.getElementById('lusave');
          if(sv) sv.addEventListener('click', function(){
            sv.disabled=true; sv.textContent='saving…';
            fetch('/api/leadgen?action=capture&key='+encodeURIComponent(k),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({lead:{name:org,org:org,email:jr.email,phone:jr.phone,address:jr.address,source:'lookup'}})})
              .then(function(r){return r.json();}).then(function(s){ sv.textContent=(s&&s.ok&&s.added)?'saved ✓':((s&&s.dupes)?'already a lead':'save failed'); })
              .catch(function(){ sv.textContent='save failed'; });
          });
        })
        .catch(function(){ out.innerHTML='<div class="r warn">network error</div>'; });
    }
    btn.addEventListener('click', function(){ run(false); });
    q.addEventListener('keydown', function(e){ if(e.key==='Enter'){ run(false); } });

    // Operator-triggered desk pull (finance/homestead): syncs the desk's candidate
    // pool into leadgen and runs enrichment on the batch. Reads only — no send, no
    // spend (free backends). NOT the held Phase-2 cron; this is a manual button.
    function pull(source, b){
      var k=getKey(false); if(!k){ out.innerHTML='<div class="r warn">admin key required</div>'; return; }
      var old=b.textContent; b.disabled=true; b.textContent='pulling…';
      out.innerHTML='<div class="r">pulling '+esc(source)+' + enriching…</div>';
      fetch('/api/leadgen?action=pull&key='+encodeURIComponent(k),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({source:source,limit:25})})
        .then(function(r){ return r.json().then(function(jj){ return {status:r.status,j:jj}; }); })
        .then(function(res){
          b.disabled=false; b.textContent=old;
          var jr=res.j||{};
          if(res.status===403||res.status===503){ try{sessionStorage.removeItem(KEY);}catch(e){} out.innerHTML='<div class="r warn">'+esc(jr.error||('auth '+res.status))+'</div>'; return; }
          if(!jr.ok){ out.innerHTML='<div class="r warn">'+esc(jr.error||'pull failed')+'</div>'; return; }
          var en=jr.enriched||{};
          out.innerHTML='<div class="r"><span class="k">'+esc(source)+'</span> pulled '+(jr.pulled||0)+' · added '+(jr.added||0)+' · dupes '+(jr.dupes||0)+' · <span class="k">enriched</span> '+(en.enriched||0)+'/'+(en.attempted||0)+(jr.note?' · '+esc(jr.note):'')+'</div>';
        })
        .catch(function(){ b.disabled=false; b.textContent=old; out.innerHTML='<div class="r warn">network error</div>'; });
    }
    var pf=document.getElementById('pullfin'), ph=document.getElementById('pullhome');
    if(pf) pf.addEventListener('click', function(){ pull('finance-desk', pf); });
    if(ph) ph.addEventListener('click', function(){ pull('homestead-desk', ph); });

    // Google Places pull: find real B2B businesses by type + location. Each has a
    // website, so web-contact free-enriches them. Needs GOOGLE_PLACES_API_KEY.
    var gpq=document.getElementById('gpq'), gploc=document.getElementById('gploc'), gpbtn=document.getElementById('gpbtn');
    function gpull(){
      var query=((gpq&&gpq.value)||'').trim(), loc=((gploc&&gploc.value)||'').trim();
      if(query.length<2){ out.innerHTML='<div class="r warn">enter a business type to search</div>'; return; }
      var k=getKey(false); if(!k){ out.innerHTML='<div class="r warn">admin key required</div>'; return; }
      var old=gpbtn.textContent; gpbtn.disabled=true; gpbtn.textContent='finding…';
      out.innerHTML='<div class="r">finding '+esc(query)+(loc?(' in '+esc(loc)):'')+' + enriching…</div>';
      fetch('/api/leadgen?action=pull&key='+encodeURIComponent(k),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({source:'google-places',query:query,location:loc,limit:20})})
        .then(function(r){ return r.json().then(function(jj){ return {status:r.status,j:jj}; }); })
        .then(function(res){
          gpbtn.disabled=false; gpbtn.textContent=old;
          var jr=res.j||{};
          if(res.status===403||res.status===503){ try{sessionStorage.removeItem(KEY);}catch(e){} out.innerHTML='<div class="r warn">'+esc(jr.error||('auth '+res.status))+'</div>'; return; }
          if(!jr.ok){ out.innerHTML='<div class="r warn">'+esc(jr.error||'pull failed')+'</div>'; return; }
          var en=jr.enriched||{};
          out.innerHTML='<div class="r"><span class="k">google-places</span> pulled '+(jr.pulled||0)+' · added '+(jr.added||0)+' · dupes '+(jr.dupes||0)+' · <span class="k">enriched</span> '+(en.enriched||0)+'/'+(en.attempted||0)+(jr.note?(' · '+esc(jr.note)):'')+'</div>';
        })
        .catch(function(){ gpbtn.disabled=false; gpbtn.textContent=old; out.innerHTML='<div class="r warn">network error</div>'; });
    }
    if(gpbtn) gpbtn.addEventListener('click', gpull);
    if(gpq) gpq.addEventListener('keydown', function(e){ if(e.key==='Enter'){ gpull(); } });
    if(gploc) gploc.addEventListener('keydown', function(e){ if(e.key==='Enter'){ gpull(); } });

    // Enrich-a-town: enumerate every business in a US town (OpenStreetMap) then
    // resolve each one's contact through the SAME free lookup. OSM tags are
    // location-correct; an enriched phone is kept only if its area code is one of
    // the town's local codes, an enriched address only if it names the state —
    // so a same-named business in another state is dropped, not shown as fact.
    // Read-only: nothing is saved and no one is contacted. CSV downloads locally.
    var twcity=document.getElementById('twcity'), twstate=document.getElementById('twstate'),
        twbtn=document.getElementById('twbtn'), twstop=document.getElementById('twstop'),
        twout=document.getElementById('twout');
    var twAbort=false;
    function areaOf(phone){ var p=String(phone||'').replace(/[^0-9]/g,''); if(p.length===11&&p[0]==='1')p=p.slice(1); if(p.length!==10)return ''; if(p[0]==='0'||p[0]==='1')return ''; return p.slice(0,3); }
    function tcsv(s){ s=String(s==null?'':s); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }
    function twRender(city,state,rows,doneN,total,running){
      var done=rows.filter(function(r){return r.email||r.phone||r.address;}).length;
      var em=rows.filter(function(r){return r.email;}).length, ph=rows.filter(function(r){return r.phone;}).length, ad=rows.filter(function(r){return r.address;}).length;
      var pct=total?Math.round(doneN/total*100):0;
      var body=rows.map(function(r){
        return '<tr><td>'+esc(r.name)+'</td><td'+(r.phone?'':' class="dim"')+'>'+esc(r.phone||'—')+'</td><td'+(r.email?'':' class="dim"')+'>'+esc(r.email||'—')+'</td><td'+(r.address?'':' class="dim"')+'>'+esc(r.address||'—')+'</td></tr>';
      }).join('');
      twout.innerHTML='<div class="stat">'+esc(city)+', '+esc(state)+' — <b>'+doneN+'</b>/'+total+' processed'+(running?' …':' · done')+' &nbsp; email <b>'+em+'</b> · phone <b>'+ph+'</b> · mailable <b>'+ad+'</b></div>'
        +'<div class="bar"><i style="width:'+pct+'%"></i></div>'
        +'<div class="twrap"><table class="tt"><thead><tr><th>business</th><th>phone</th><th>email</th><th>mailing address</th></tr></thead><tbody>'+body+'</tbody></table></div>'
        +(running?'':'<button class="lookup dl" id="twdl" style="margin-top:10px;background:transparent;border:1px solid rgba(201,169,78,0.45);color:#c9a94e;border-radius:4px;cursor:pointer">download CSV</button>')
        +'<div class="note">Phone is area-code verified to '+esc(state)+' locals; address is '+esc(state)+'-verified; email is best-effort (a national chain or a same-named business elsewhere can slip in — eyeball before use). Nothing here was saved or contacted.</div>';
      var dl=document.getElementById('twdl');
      if(dl) dl.addEventListener('click', function(){
        var head='name,phone,email,address\n';
        var csv=head+rows.map(function(r){ return [r.name,r.phone,r.email,r.address].map(tcsv).join(','); }).join('\n');
        var blob=new Blob([csv],{type:'text/csv'});
        var a=document.createElement('a'); a.href=URL.createObjectURL(blob);
        a.download='town-'+city.toLowerCase().replace(/\s+/g,'-')+'-'+state.toLowerCase()+'.csv'; a.click();
        setTimeout(function(){ URL.revokeObjectURL(a.href); },1000);
      });
    }
    async function runTown(){
      var city=(twcity&&twcity.value||'').trim(), state=(twstate&&twstate.value||'').trim().toUpperCase();
      if(city.length<2||state.length!==2){ twout.innerHTML='<div class="stat warn" style="color:#dca87e">enter a city and 2-letter state</div>'; return; }
      var k=getKey(false); if(!k){ twout.innerHTML='<div class="stat" style="color:#dca87e">admin key required</div>'; return; }
      twAbort=false; twbtn.disabled=true; twbtn.textContent='enumerating…'; twstop.style.display='';
      twout.innerHTML='<div class="stat">finding businesses in '+esc(city)+', '+esc(state)+' …</div>';
      var listRes;
      try{
        var r=await fetch('/api/leadgen?action=town-list&city='+encodeURIComponent(city)+'&state='+encodeURIComponent(state)+'&key='+encodeURIComponent(k));
        listRes=await r.json();
        if(r.status===403||r.status===503){ try{sessionStorage.removeItem(KEY);}catch(e){} twout.innerHTML='<div class="stat" style="color:#dca87e">'+esc(listRes.error||('auth '+r.status))+'</div>'; twbtn.disabled=false; twbtn.textContent='enrich town'; twstop.style.display='none'; return; }
      }catch(e){ twout.innerHTML='<div class="stat" style="color:#dca87e">network error</div>'; twbtn.disabled=false; twbtn.textContent='enrich town'; twstop.style.display='none'; return; }
      if(!listRes||!listRes.ok){ twout.innerHTML='<div class="stat" style="color:#dca87e">'+esc((listRes&&listRes.error)||'could not enumerate town')+'</div>'; twbtn.disabled=false; twbtn.textContent='enrich town'; twstop.style.display='none'; return; }
      var biz=listRes.businesses||[]; var localAreas=listRes.localAreas||[]; var total=biz.length;
      var stRe=new RegExp(',\\s*'+state+'\\b','i');
      var rows=biz.map(function(b){ return { name:b.name, phone:b.phone||'', email:b.email||'', address:b.address||'', _osmP:!!b.phone, _osmA:!!b.address, website:b.website||'' }; });
      twbtn.textContent='enriching…'; twRender(city,state,rows,0,total,true);
      var idx=0, doneN=0, CONC=3;
      async function worker(){
        while(!twAbort){
          var i=idx++; if(i>=total) return;
          var row=rows[i];
          // skip the search when OSM already gave email+phone+address
          if(!(row.email&&row.phone&&row.address)){
            try{
              var lr=await fetch('/api/leadgen?action=lookup&org='+encodeURIComponent(row.name)+(row.website?('&website='+encodeURIComponent(row.website)):'')+'&key='+encodeURIComponent(k));
              var lj=await lr.json();
              if(lj&&lj.ok&&lj.found){
                if(!row.email&&lj.email) row.email=lj.email;
                if(!row.phone&&lj.phone){ var ac=areaOf(lj.phone); if(ac&&localAreas.indexOf(ac)>-1) row.phone=lj.phone; }
                if(!row.address&&lj.address&&stRe.test(lj.address)) row.address=lj.address;
              }
            }catch(e){}
          }
          doneN++;
          if(doneN%2===0||doneN===total) twRender(city,state,rows,doneN,total,doneN<total&&!twAbort);
        }
      }
      var pool=[]; for(var w=0;w<CONC;w++) pool.push(worker());
      await Promise.all(pool);
      twbtn.disabled=false; twbtn.textContent='enrich town'; twstop.style.display='none';
      twRender(city,state,rows,doneN,total,false);
    }
    if(twbtn) twbtn.addEventListener('click', runTown);
    if(twstop) twstop.addEventListener('click', function(){ twAbort=true; });
    if(twstate) twstate.addEventListener('keydown', function(e){ if(e.key==='Enter'){ runTown(); } });
  }

  /* Ask the paper what it publishes and redraw the Documents section from
     the answer. Allowed to fail: on a miss the static card stays, which is
     the front page, which is always true. */
  function loadPapers(){
    var host=document.getElementById('papersec');
    if(!host) return;
    fetch('https://limenhelix.news/editions/index.json',{mode:'cors',cache:'no-store'})
      .then(function(r){ return r.ok?r.json():null; })
      .then(function(ix){
        if(!ix||!ix.papers||!ix.papers.length) return;
        var cards=ix.papers.map(function(p){
          var d=p.headline||p.standfirst||'';
          if(p.wire) d=d?(d+' &middot; live wire'):'Written edition, with a live wire';
          return xcard(p.url, p.nameplate||p.edition, d);
        });
        host.innerHTML=sec('Documents',cards);
      })
      .catch(function(){});
  }

  function render(){
    var p=person();
    if(!p){ root.innerHTML=head(null)+'<div class="gate">You are not signed in.<br><button onclick="LimenAdminLogin.open()">Admin login</button></div>'; return; }
    var h=head(p);
    h+='<div class="lookup"><input id="luq" type="text" placeholder="🔎 company name or ticker — find a contact" autocomplete="off"><button id="lubtn">Look up</button><div class="pullrow"><span class="pulllbl">desk pull</span><button id="pullfin" class="mini">finance-desk</button><button id="pullhome" class="mini">homestead-desk</button></div><div class="pullrow"><span class="pulllbl">find B2B</span><input id="gpq" class="mini-in" type="text" placeholder="business type e.g. HVAC contractor"><input id="gploc" class="mini-in" type="text" placeholder="location e.g. Kansas City, MO"><button id="gpbtn" class="mini">find businesses</button></div><div class="pullrow"><span class="pulllbl">enrich a town</span><input id="twcity" class="mini-in" type="text" placeholder="city e.g. Lansing"><input id="twstate" class="tiny-in" type="text" placeholder="ST" maxlength="2"><button id="twbtn" class="mini">enrich town</button><button id="twstop" class="mini" style="display:none">stop</button></div><div id="luout" class="luout"></div><div id="twout" class="town"></div></div>';

    if(p.master){
      h+=sec('Command Center',[
        card('/operator','Operator Console','Sense, diagnose, launch on live signal'),
        card('/playbook','Playbook','Go-to-market + skills reference'),
        card('/civilization','Civilization','The connectome cockpit'),
        card('/admin-master','Master Brain','Every domain and its opportunities')
      ]);
      h+=sec('Sales Funnel',[
        card('/sales','Sales Board','Pipeline overview'),
        card('/sales-leads','Leads','Top of funnel'),
        card('/sales-appointments','Appointments','Booked'),
        card('/sales-shows','Shows','Attended'),
        card('/sales-enrollments','Enrollments','Closed and won'),
        card('/sales-referrals','Referrals','Advocacy loop'),
        card('/sales-autopilot','Autopilot','Automated cadence')
      ]);
      h+=sec('Deal Desks',[
        card('/finance-capital-engine','Capital Engine','Content and capital operations'),
        card('/admin-deals','Deal Desk','Arbitrage cockpit'),
        card('/admin-homestead','Homestead','Real-estate distress'),
        card('/admin-finance','Corporate Distress','EDGAR 8-K feed'),
        card('/admin-industry','Plant Closings','WARN notices'),
        card('/admin-energy','Energy Generators','EIA retirements')
      ]);
      h+=sec('Domains', ALL_DOMAINS.map(function(d){ return card('/domain-console?domain='+d, d, DOMAIN_DESC[d]||'Console'); }), 'dgrid');
      h+=sec('Public Fronts',[
        card('/energy','Energy','Bill X-Ray and markets'),
        card('/culture','Culture','Music front'),
        card('/wave-radar','Wave Radar','Drew, artist toolkit'),
        card('/infrastructure','Infrastructure','Plan Your Project'),
        card('/relay-margin','Relay','Storefront margin control'),
        card('/fitness','Fitness','TUT body-composition tools')
      ]);
      h+=sec('Per-Operator',[
        card('/project-planner','Project Planner','Liz, public lead page'),
        card('/project-radar','Project Radar','Liz, bids and leads')
      ]);
      /* Documents. Two papers, both written. The compiled per-domain
         editions were withdrawn: a headline list poured into the shape of
         an essay is not a newspaper, and listing nineteen of them here
         implied a body of work that did not exist. The generator is still
         running and the Energy edition still pulls its live wire from it,
         which is what it is good at. */
      /* Documents. The list is not kept here. The paper publishes
         editions/index.json describing what it actually prints, and this
         reads it, so writing a paper is enough to make it appear and
         nobody has to remember to edit this file. The cards below are what
         shows before the fetch lands, and what stays if it never does. */
      h+='<div id="papersec">'+sec('Documents',[
        xcard('https://limenhelix.news/','The LIMEN Helix Gazette','The paper, front page')
      ])+'</div>';
      h+=sec('System',[
        card('/pages','Site Map','Every page'),
        card('/phase-map','Phase Map','P0 to P10'),
        card('/kernel-comparison','Kernel','Validation'),
        card('/treatment-discovery','Treatment Discovery','Remedy engine'),
        card('/pattern-proposals','Pattern Proposals','Review queue'),
        card('/vitals','Vitals','System health'),
        '<a class="card" href="https://claude.ai/code/routines/trig_017mWPSW6AiA5rbQvgUp39gt" target="_blank" rel="noopener"><div class="t">Recorder Check ↗</div><div class="d">Feed-recorder cron accumulation verifier</div></a>'
      ]);
      h+=sec('Admin Tools',[
        card('/admin-leads','Front-Page Leads','Sign-ups'),
        card('/admin-requests','Site Requests <span id="reqBadge"></span>','Change requests'),
        card('/admin-social','Post Queue','Review what goes out on Bluesky'),
        card('/admin-subscribers','Subscribers','Who is paying, and who started checkout')
      ]);
    } else {
      h+=sec('Your Domains', (p.domains||[]).map(function(d){
        if(d==='finance') return card('/finance-capital-engine','Finance','Capital Engine');
        return card('/domain-console?domain='+d, d, DOMAIN_DESC[d]||'Console');
      }), (p.domains||[]).length>6?'dgrid':'');
      h+=sec('Public Fronts', (p.domains||[]).filter(function(d){return ['energy','culture','infrastructure'].indexOf(d)>-1;}).map(function(d){
        if(d==='culture') return card('/wave-radar','Wave Radar','Your music tools');
        if(d==='infrastructure') return card('/project-planner','Project Planner','Your public lead page');
        return card('/'+d, d, 'Public front');
      }));
      if(p.properties&&p.properties.length){ h+=sec('Properties', p.properties.map(function(pr){ return card(pr.url||'#', pr.name, (pr.domain||'')+' · storefront'); })); }
      var tools=[];
      if((p.domains||[]).indexOf('infrastructure')>-1) tools.push(card('/project-radar','Project Radar','Your bids, leads, primes'));
      if((p.domains||[]).indexOf('finance')>-1) tools.push(card('/admin-leads','Leads','Front-page sign-ups'));
      if((p.domains||[]).indexOf('culture')>-1) tools.push(card('/admin-requests','Site Requests <span id="reqBadge"></span>','Change requests'));
      h+=sec('Tools', tools);
    }

    h+='<button class="logout" onclick="sessionStorage.removeItem(\'limen_admin\');sessionStorage.removeItem(\'limen_access\');location.reload()">Log out</button>';
    root.innerHTML=h;
    loadPapers();

    wireLookup();

    // unread badge on the Site Requests card (only if the admin key is already in this tab)
    var badge=document.getElementById('reqBadge');
    if(badge){ var k=''; try{ k=sessionStorage.getItem('limen_lead_admin_key')||''; }catch(e){}
      if(k){ fetch('/api/site-request?key='+encodeURIComponent(k)).then(function(r){return r.json();}).then(function(j){
        if(j&&j.ok&&j.unread>0){ badge.textContent=j.unread; badge.className='badge'; }
      }).catch(function(){}); }
    }
  }
  render();
})();
</script>
<script src="/assets/js/limen-nav.js"></script>
