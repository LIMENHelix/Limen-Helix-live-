<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>LIMEN HELIX · CRM Pipeline</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#050810;color:#e8e3d9;font-family:"IBM Plex Mono",monospace;padding:20px 24px;max-width:900px;margin:0 auto;font-size:12px;line-height:1.7}h1{font-size:0.6rem;letter-spacing:4px;color:#C9A94E;margin-bottom:4px}p{font-size:0.4rem;color:#b0a898;margin-bottom:12px}.stats{display:flex;gap:16px;margin:12px 0;font-size:0.36rem;flex-wrap:wrap}.stat{color:#807868}.stat b{color:#d0c8b8}table{width:100%;border-collapse:collapse;margin:12px 0}th{font-size:0.30rem;letter-spacing:1.5px;color:rgba(201,169,78,0.4);padding:4px 8px;border-bottom:1px solid rgba(201,169,78,0.1);text-align:left}td{padding:5px 8px;border-bottom:1px solid rgba(255,255,255,0.02);font-size:0.38rem;color:#c0b8a5}.add{padding:12px;border:1px solid rgba(201,169,78,0.08);border-radius:3px;margin:12px 0}input,select{padding:4px 8px;background:#0a0c14;border:1px solid rgba(201,169,78,0.12);border-radius:2px;color:#e8e3d9;font-family:inherit;font-size:0.36rem;margin-bottom:4px;width:100%}.btn{font-family:inherit;font-size:0.34rem;padding:6px 12px;border-radius:2px;cursor:pointer;border:1px solid rgba(90,181,160,0.3);background:rgba(90,181,160,0.08);color:#5ab5a0}a{color:rgba(201,169,78,0.5);text-decoration:none}</style></head>
<body>
<a href="/domain-console?domain=energy&mode=operator" style="font-size:0.34rem;display:block;margin-bottom:12px">&larr; Back</a>
<h1>CRM PIPELINE</h1><p>Track portal sales, partnerships, and enterprise interest.</p>
<div class="stats" id="crmStats"></div>
<table><thead><tr><th>NAME</th><th>COMPANY</th><th>TYPE</th><th>STATUS</th><th>VALUE</th><th>DATE</th></tr></thead><tbody id="crmBody"></tbody></table>
<div class="add"><div style="font-size:0.28rem;letter-spacing:2px;color:rgba(201,169,78,0.4);margin-bottom:6px">ADD RECORD</div>
<input id="crmName" placeholder="Contact name"><input id="crmCompany" placeholder="Company"><select id="crmType"><option>portal_sales</option><option>execution_partnership</option><option>enterprise_interest</option><option>portfolio_relationship</option></select><select id="crmStatus"><option>new</option><option>qualified</option><option>proposal</option><option>negotiation</option><option>won</option><option>lost</option></select><input id="crmValue" placeholder="Value estimate ($)" type="number"><input id="crmNotes" placeholder="Notes"><button class="btn" id="crmAdd">ADD</button></div>
<script src="assets/js/execution-crm-shell.js"></script>
<script>(function(){var crm=window.LIMENExecution&&window.LIMENExecution.phase5&&window.LIMENExecution.phase5.crm;if(!crm)return;function render(){var all=crm.getAll();var t=crm.getValueTotals();document.getElementById('crmStats').innerHTML='<span class="stat">Records: <b>'+all.length+'</b></span><span class="stat">Pipeline: <b style="color:#C9A94E">$'+(t.pipeline||0).toLocaleString()+'</b></span><span class="stat" style="color:#5ab5a0">Won: <b>$'+(t.won||0).toLocaleString()+'</b></span><span class="stat" style="color:#e85454">Lost: <b>$'+(t.lost||0).toLocaleString()+'</b></span>';var h='';for(var i=0;i<all.length;i++){var r=all[i];h+='<tr><td>'+r.name+'</td><td>'+r.company+'</td><td>'+r.pipelineType+'</td><td>'+r.status.toUpperCase()+'</td><td>$'+(r.valueEstimate||0).toLocaleString()+'</td><td>'+new Date(r.createdAt).toLocaleDateString()+'</td></tr>'}if(!all.length)h='<tr><td colspan="6" style="color:#706860">No records yet.</td></tr>';document.getElementById('crmBody').innerHTML=h}document.getElementById('crmAdd').addEventListener('click',function(){var n=document.getElementById('crmName').value;if(!n)return;crm.create({name:n,company:document.getElementById('crmCompany').value,pipelineType:document.getElementById('crmType').value,status:document.getElementById('crmStatus').value,valueEstimate:parseInt(document.getElementById('crmValue').value)||0,notes:document.getElementById('crmNotes').value});document.getElementById('crmName').value='';document.getElementById('crmCompany').value='';document.getElementById('crmValue').value='';document.getElementById('crmNotes').value='';render()});render()})();</script></body></html>
