 and safety, and serves as the company's face to the community. The classic first general-management job in America. Measured on sales versus plan, payroll percentage, shrink, and customer/associate scores.", "credentials": "Bachelor's preferred but not required; internal leadership programs; food-safety manager certification in grocery.", "socCode": "41-1011"}, {"title": "Distribution Center General Manager", "level": "Management", "reportsTo": "VP Distribution / CSCO", "duties": "Operates a 500,000-1.5M square-foot node: shift and wave planning, labor management across hundreds of hourly associates, automation uptime, safety (OSHA recordables), and outbound service to hundreds of stores or millions of parcels. Measured on cost per unit, throughput, accuracy, and TRIR.", "credentials": "BS in supply chain/engineering or military logistics background; Lean/Six Sigma; 10-15 years in operations.", "socCode": "11-3071"}, {"title": "Buyer / Category Manager", "level": "Professional", "reportsTo": "Divisional Merchandise Manager (DMM)", "duties": "Owns a category's P&L: selects the assortment, negotiates cost, terms, and vendor allowances, plans promotions, and manages open-to-buy dollars against sales and inventory plans. Sits across the table from CPG national-account teams. Measured on sales, margin, turns, and markdown rate for the category.", "credentials": "Bachelor's in merchandising/business; allocator-to-assistant-buyer-to-buyer ladder; retail math fluency (IMU, GMROI) is the craft.", "socCode": "13-1022"}, {"title": "Demand Planner / Inventory Analyst", "level": "Professional", "reportsTo": "Director of Planning", "duties": "Builds the forecast that drives every purchase order: models baseline demand, promotional lift, and seasonality by SKU-location; balances service-level targets against inventory dollars; runs the S&OP consensus process with buying and supply chain. Measured on forecast accuracy (MAPE), in-stock rate, and inventory turns.", "credentials": "Bachelor's in analytics/supply chain; ASCM CPIM; Excel/SQL and planning systems (Blue Yonder, o9).", "socCode": "13-1081"}, {"title": "Licensed Customs Broker / Entry Specialist", "level": "Professional", "reportsTo": "Brokerage Operations Manager / VP Trade Compliance", "duties": "Classifies goods under the 10-digit HTS, determines valuation and origin, files entries in CBP's ACE system, calculates and remits duties, and responds to CBP requests (CF-28/29) — personally accountable under a federal license for reasonable care. Measured on entry accuracy, clearance speed, and audit findings.", "credentials": "CBP Customs Broker License (federal exam with ~5-15% historical pass rates); NCBFAA CCS certification; no degree legally required.", "socCode": "13-1041"}, {"title": "National Account Manager (Wholesale/CPG Sales)", "level": "Professional", "reportsTo": "VP Sales", "duties": "Sells a manufacturer's or distributor's line into major retail headquarters: annual joint business planning, trade-promotion budgets, new-item presentations against slotting realities, and forecast alignment. Lives in line reviews. Measured on revenue, share of shelf, and trade-spend ROI.", "credentials": "Bachelor's; CPG sales training programs; category-analytics fluency (Nielsen/Circana).", "socCode": "41-4011"}, {"title": "Freight Broker / Transportation Analyst", "level": "Professional", "reportsTo": "Transportation Manager", "duties": "Matches loads to carriers: negotiates spot and contract rates, tracks shipments through exceptions (weather, breakdowns, port congestion), and manages carrier scorecards and claims. In brokerage, personal book-of-business economics apply. Measured on margin per load, on-time percentage, and claim rates.", "credentials": "Bachelor's typical; TIA Certified Transportation Broker; FMCSA broker authority at the firm level.", "socCode": "43-5011"}, {"title": "E-commerce Merchandiser / Marketplace Manager", "level": "Professional", "reportsTo": "Director of Digital Commerce", "duties": "Runs the digital shelf: product content and search optimization, pricing and promotion automation, retail-media campaigns, and marketplace seller operations (Buy Box economics, fulfillment method selection). Measured on conversion rate, digital sales growth, and advertising cost of sales (ACoS).", "credentials": "Bachelor's; platform certifications (Amazon Ads, Google); analytics and A/B testing fluency.", "socCode": "13-1161"}, {"title": "Loss Prevention / Asset Protection Specialist", "level": "Professional", "reportsTo": "District Asset Protection Manager", "duties": "Attacks shrink from all sources: surveils and (under strict policy) apprehends external theft, investigates internal cases through exception reporting and interviews, audits operational compliance, and partners with law enforcement on organized retail crime. Measured on shrink percentage, case resolution, and safety of encounters.", "credentials": "Criminal justice degree common; Wicklander-Zulawski interview certification; LPC (Loss Prevention Certified).", "socCode": "33-9099"}, {"title": "Retail Sales Associate / Cashier", "level": "Operational", "reportsTo": "Department/Front-End Supervisor", "duties": "The face of the domain to the customer: greets and advises shoppers, rings transactions accurately (cash handling, age-restricted-sale verification), stocks and faces shelves, processes returns, and executes the daily task list from corporate. Measured on transaction accuracy, units per hour on tasks, and customer scores.", "credentials": "No degree required; on-the-job POS and product training; alcohol-seller permits where applicable.", "socCode": "41-2031"}, {"title": "Warehouse Associate / Forklift Operator", "level": "Operational", "reportsTo": "Warehouse Shift Supervisor", "duties": "Physically moves commerce: receives and putaways inbound freight, picks orders to engineered rates via RF scanner or voice systems, operates reach trucks and order pickers in narrow aisles, loads trailers to plan, and cycle-counts inventory. Measured on picks per hour, accuracy, and safe operation.", "credentials": "No degree; OSHA-mandated powered-industrial-truck certification per equipment class; physical capability requirements.", "socCode": "53-7051"}, {"title": "Delivery Driver (Last-Mile / Route)", "level": "Operational", "reportsTo": "Dispatch / Operations Supervisor", "duties": "Executes 100-250 stops daily: loads and sequences the van, navigates optimized routes, delivers with proof-of-delivery capture, handles COD or signature requirements, and represents the brand at the doorstep. DSD route drivers additionally merchandise shelves and write orders. Measured on stops per hour, on-time rate, and safety telematics.", "credentials": "Standard or commercial driver's license by vehicle class; DOT medical card; clean MVR.", "socCode": "53-3033"}, {"title": "Import/Export Documentation Coordinator", "level": "Operational", "reportsTo": "Trade Operations Manager", "duties": "Assembles and verifies the paper trail on which cargo moves: commercial invoices, packing lists, bills of lading, certificates of origin, letters-of-credit document sets presented to banks under UCP 600 exactness, and ISF filings 24 hours before vessel loading. A misspelled consignee can strand a container. Measured on document accuracy, LC acceptance rates, and filing timeliness.", "credentials": "Associate's/bachelor's; forwarder or bank trade-services training; incoterms and LC document fluency.", "socCode": "43-5011"}, {"title": "Personal Shopper / Order Fulfillment Picker (Omnichannel)", "level": "Operational", "reportsTo": "Fulfillment Team Lead", "duties": "Picks online grocery and pickup orders in-store against pick-path apps: judges produce quality on the customer's behalf, manages substitutions within policy, stages orders in temperature zones, and dispenses at curbside within promised windows. Measured on units per hour, substitution acceptance, and on-time order readiness.", "credentials": "No degree; in-app certification and food-safety basics.", "socCode": "53-7065"}]}}, {"id": "agriculture", "name": "Agriculture", "icon": "🌾", "tagline": "The domain that feeds and clothes civilization — converting soil, sun, water, and genetics into food, fiber, and fuel, then processing it for eight billion mouths.", "view100k": {"role": "Agriculture is the foundational domain: the one civilization invented itself around. The Neolithic shift from foraging to farming ~12,000 years ago produced storable surplus, and surplus produced everything else — cities, writing, hierarchy, priesthood, and the very possibility of a division of labor into the other nineteen domains. Modern agriculture spans the primary production of crops and livestock, the harvesting of wild stocks (fisheries) and forests (silviculture), the input industries that feed production (seed, fertilizer, chemicals, machinery), and the vast processing, packing, and manufacturing chain that turns raw commodities into the shelf-stable, portioned, branded food that consumers actually buy. The domain's defining tension is biological time and weather risk layered on thin margins: a farmer makes roughly one decision-cycle per year, cannot control rain or price, and operates on single-digit margins — which is why risk-transfer institutions (crop insurance, futures markets, government price supports) are woven into the domain's DNA.\n\nThe scale is immense and lopsided. Agriculture, food, and related industries contribute over $1.5 trillion to U.S. GDP (roughly 5.5%) and food-and-agriculture supports over 20 million U.S. jobs, yet on-farm production itself is under 1% of GDP and employs only ~2 million farmers — the productivity miracle of the last century, in which one American farmer now feeds ~165 people versus ~25 in 1960. Globally agriculture employs roughly 26% of the workforce (over 850 million people, concentrated in developing economies) and the global food and agribusiness system is a $8-10 trillion complex. Four firms dominate global grain trade (the ABCD traders), a handful dominate seed and chemicals after mega-mergers, and yet production remains atomized across some 570 million farms worldwide, most of them small.\n\nThe historical arc is one of successive intensifications: the agricultural revolutions of crop rotation and enclosure that freed labor for the Industrial Revolution; mechanization (the McCormick reaper, the tractor) that emptied the countryside; the Haber-Bosch synthesis of nitrogen fertilizer (~1910) that roughly doubled the population the earth could carry; the Green Revolution's dwarf high-yield varieties that averted predicted famine across Asia; and the biotech and precision-agriculture era of GMOs, GPS-guided equipment, satellite imagery, and gene editing. The current chapter contends with climate volatility, water scarcity, soil degradation, consolidation and farm-succession crises, animal-welfare and antibiotic scrutiny, and the collision between feeding ten billion people and shrinking agriculture's environmental footprint.", "interdependencies": "Agriculture sits at the base of the food chain of domains, feeding Population literally and supplying Industry (textiles, biofuels, bioplastics, food manufacturing feedstock) and Trade (agricultural commodities are the oldest globally traded goods). It is deeply dependent on Energy — modern farming is essentially a process for converting fossil energy (diesel, natural-gas-derived nitrogen fertilizer) into food calories — and on Infrastructure for irrigation, rural roads, grain elevators, ports, and cold chains. Finance underwrites it through the specialized Farm Credit System, crop insurance, and commodity futures that let farmers and processors hedge price; Economy sets the farm-bill subsidies, tariffs, and price data that govern its economics. Science and Technology drive its every productivity gain — plant breeding, genomics, agronomy, precision equipment, and now AI-guided spraying and autonomous tractors — while Education (land-grant universities and extension services) diffuses that knowledge to the field. Water, soil, biodiversity, and climate make Environment simultaneously agriculture's resource base and its chief constraint and critic (runoff, emissions, land-use). Governance and Law set food safety, labor, land, and water rights; Medicine intersects through nutrition, zoonotic disease, and antimicrobial resistance; Defense and Intelligence treat food security as strategic (grain embargoes are weapons); Communication carries market prices and weather to the field; and Culture and Religion shape the domain profoundly — dietary law (kosher, halal), harvest festivals, land-stewardship ethics, and the deep symbolic weight of bread, rice, and the family farm.", "regulationModel": "Agriculture is governed by an unusually thick and old regulatory apparatus reflecting food's status as a public-health and national-security good. In the U.S., the sprawling USDA both promotes and regulates: FSIS inspects every meat and poultry carcass, APHIS guards against pests and animal disease, AMS runs grading and marketing orders, the Risk Management Agency and FCIC administer subsidized crop insurance, the FSA delivers farm-program payments, and NASS produces the crop reports that move billion-dollar markets. The FDA regulates all non-meat food safety (produce, seafood, processed foods) under the Food Safety Modernization Act; the EPA registers pesticides (FIFRA) and governs agricultural water and emissions; the CFTC oversees the commodity futures markets essential to the trade; and DOL/OSHA and state agencies govern the (heavily immigrant, H-2A) agricultural workforce. Internationally, the FAO coordinates global food policy, the Codex Alimentarius sets food-safety standards adopted into trade law, the WTO disciplines agricultural subsidies and sanitary/phytosanitary barriers, and the OIE/WOAH governs animal health. Self-regulation is dense and consequential: commodity check-off programs and marketing orders (funded by producers), the National Organic Program's accredited certifiers, GFSI-benchmarked food-safety schemes (SQF, BRC) that retailers demand of every supplier, GAP audits, and animal-welfare and sustainability certifications that increasingly function as private law across the supply chain."}, "view10k": {"overview": "The domain spans NAICS Sector 11 (Agriculture, Forestry, Fishing and Hunting): subsector 111 (crop production — oilseed and grain 1111, vegetables 1112, fruit and tree nut 1113, greenhouse 1114), 112 (animal production — cattle ranching and dairy 1121, hog 1122, poultry and egg 1123, aquaculture 1125), 113 (forestry and logging), 114 (fishing, hunting, trapping), and 115 (support activities — the custom operators, crop services, and farm-labor contractors). It reaches downstream into NAICS Sector 311 (Food Manufacturing — grain milling, meat processing 3116, dairy 3115) and upstream into the input industries classified elsewhere: 3253 (agricultural chemicals — fertilizer and pesticides), 333111 (farm machinery), and 424510/424910 (farm-product and supply wholesaling). Structurally the domain organizes into a value chain from inputs → production → first handlers/elevators → processors/packers → distribution, with firm types ranging from vertically integrated protein giants and multinational grain traders down to the family farm that remains, remarkably, the dominant production unit (~96% of U.S. farms are family-owned, though large operations produce most output).", "businessTypes": [{"name": "Row-Crop / Grain & Oilseed Farm", "naics": "111110, 111140, 111150, 111199", "definition": "A production operation growing commodity crops — corn, soybeans, wheat, cotton, rice — on broad acreage, selling into a global commodity market at prices it cannot influence.", "operations": "Revenue is yield times commodity price times acres, minus input costs (seed, fertilizer, chemicals, fuel, land rent); margins are razor-thin and volatile, so operators hedge with futures/options and lean on crop insurance and farm-program payments. The annual cycle is planting, in-season scouting and application, harvest, grain marketing and storage decisions, and equipment/land capital management.", "regulation": "EPA (pesticide labels under FIFRA, WOTUS water rules), USDA (conservation compliance for program eligibility, NASS reporting), OSHA for hired labor, state right-to-farm laws. Self-regulates through commodity check-off programs, GAP audits, and stewardship codes (e.g., herbicide-resistance management).", "examples": "Family and corporate grain farms across the Corn Belt; large operators like those farming tens of thousands of acres"}, {"name": "Cattle Ranch / Cow-Calf & Feedlot Operation", "naics": "112111, 112112", "definition": "Beef production, split between cow-calf operations that breed and raise weaned calves on pasture and feedlots that finish cattle on grain to market weight.", "operations": "Cow-calf ranchers sell calves by the pound into a market driven by the cattle cycle; feedlots earn on the spread between feeder-cattle and fed-cattle prices minus the cost of gain (feed conversion is the key metric), hedging both ends with CME live and feeder cattle futures. Operations are grazing and herd health on the ranch, and ration formulation, pen riding, and cattle procurement in the yard.", "regulation": "USDA FSIS at slaughter and APHIS for animal disease and traceability, EPA CAFO permits for large feedlots (manure/nutrient management), FDA Veterinary Feed Directive on antibiotics. Self-regulates through the Beef Quality Assurance program (a producer certification) and check-off-funded standards.", "examples": "Five Rivers Cattle Feeding, Four Six Ranch, tens of thousands of cow-calf ranches"}, {"name": "Dairy Farm", "naics": "112120", "definition": "An operation milking cows (or goats) to produce raw milk sold to processors or cooperatives, on a relentless twice- or thrice-daily production schedule.", "operations": "Revenue is pounds of milk times a federally influenced milk price minus feed (the milk-feed ratio is the profitability signal); the business is capital- and labor-intensive with no days off. Operations are milking-parlor throughput, herd nutrition and reproduction, somatic-cell-count quality management, and manure handling.", "regulation": "FDA Pasteurized Milk Ordinance and state dairy inspectors (Grade A permits), USDA Federal Milk Marketing Orders setting minimum prices, EPA for large-CAFO nutrient management. Self-regulates through the National Dairy FARM animal-care program and cooperative quality premiums.", "examples": "Fair Oaks Farms, Riverview LLP, thousands of family dairies (many members of DFA)"}, {"name": "Poultry & Egg Operation (Integrated Grower)", "naics": "112310, 112320, 112330", "definition": "Broiler, turkey, or egg production, predominantly under contract to a vertically integrated processor that owns the birds while the grower provides housing and labor.", "operations": "Contract broiler growers earn per-bird or per-pound payments (often on a tournament ranking against neighbors) for converting company feed and chicks into finished birds in ~6-7 week cycles; the integrator captures the margin across feed mill, hatchery, processing, and branding. Operations are climate-controlled house management, biosecurity, and flock health.", "regulation": "USDA FSIS (poultry inspection), APHIS (avian influenza response, which triggers mass depopulation), FDA (egg safety rule), EPA CAFO. Self-regulates through NCC animal-welfare guidelines and processor-imposed audit standards.", "examples": "Tyson Foods, Pilgrim's Pride, Cal-Maine Foods (eggs)"}, {"name": "Specialty Crop Grower (Fruit, Vegetable, Nut, Greenhouse)", "naics": "111219, 111310, 111335, 111419", "definition": "A labor-intensive producer of high-value perishables — fresh produce, tree nuts, berries, and greenhouse/nursery crops — often tied to a specific region and irrigation.", "operations": "Higher revenue per acre than commodities but higher labor, water, and perishability risk; profit depends on yield, pack-out grade, timing to market windows, and food-safety compliance. Operations are irrigation scheduling, pest and disease management, and the enormous seasonal-labor surge of hand harvest.", "regulation": "FDA Produce Safety Rule (FSMA), EPA Worker Protection Standard, DOL wage-hour and H-2A guestworker rules, state water boards. Self-regulates through GAP/GHP certification, GFSI-benchmarked schemes, and commodity-specific marketing orders (e.g., almonds, raisins).", "examples": "Driscoll's (berries), Dole, Wonderful Company (nuts/citrus), Sun-Maid"}, {"name": "Commercial Fishing & Aquaculture Operation", "naics": "114111, 114112, 112511, 112512", "definition": "Harvesting wild fish and shellfish from public waters under quota, or farming aquatic species in ponds, raceways, and net pens.", "operations": "Wild capture earns dockside price per pound against fuel and crew shares under strict catch limits and short seasons; aquaculture is a controlled grow-out business converting feed to fish (salmon, catfish, shrimp) with disease and water-quality as chief risks. Operations range from vessel logistics and gear management to hatchery, feeding, and harvest cycles.", "regulation": "NOAA Fisheries (magnuson-Stevens catch limits, permits), FDA (seafood HACCP, aquaculture drugs), U.S. Coast Guard (vessel safety), state fish and wildlife agencies. Self-regulates through the Marine Stewardship Council and Best Aquaculture Practices certifications demanded by buyers.", "examples": "Trident Seafoods, American Seafoods, Cooke Aquaculture, Mowi (salmon)"}, {"name": "Forestry & Logging Operation", "naics": "113110, 113210, 113310", "definition": "The growing, management, and harvesting of timber from managed forests for lumber, pulp, and increasingly carbon and conservation values.", "operations": "Timberland is a long-cycle asset (20-50 year rotations) generating revenue at thinning and final harvest, valued by REITs and TIMOs on biological growth plus land appreciation; logging contractors earn per-ton or per-load harvesting and hauling. Operations are silviculture (planting, thinning), harvest planning, and log merchandising to mills.", "regulation": "State forest-practice acts (e.g., California, Oregon reforestation and streamside rules), U.S. Forest Service on federal land, OSHA (logging is among the most dangerous occupations), EPA water rules. Self-regulates through SFI and FSC forest-certification schemes that gate market access.", "examples": "Weyerhaeuser, Rayonier, PotlatchDeltic, Sierra Pacific Industries"}, {"name": "Agricultural Input Supplier — Seed & Crop Protection", "naics": "115112, 325320, 424910", "definition": "Companies developing and selling the genetics and chemistry of production — seed (including biotech traits), fertilizers, and pesticides — plus the retail dealers who distribute them.", "operations": "Seed/trait companies earn on technology fees and licensing protected by patents and regulatory approvals; the model is R&D-heavy (a new trait costs $100M+ and a decade to deregulate). Ag retailers earn margin on product plus fees for custom application and agronomic advice. Operations span breeding pipelines, regulatory dossiers, and the spring input-delivery crunch.", "regulation": "EPA (FIFRA pesticide registration), USDA APHIS (biotech deregulation), FDA (food/feed safety of GM crops), state departments of agriculture (dealer licensing, applicator certification). Self-regulates through CropLife America stewardship (Bt refuge requirements, container recycling) and the excellence-through-stewardship program.", "examples": "Bayer Crop Science, Corteva, Nutrien (retail + fertilizer), Syngenta"}, {"name": "Farm Machinery & Equipment Manufacturer/Dealer", "naics": "333111, 423820", "definition": "Makers and dealers of tractors, combines, planters, and precision-ag technology — the capital goods that mechanized farming and now digitize it.", "operations": "Manufacturers earn on equipment sales plus high-margin parts, service, and increasingly software/data subscriptions; dealers make more on service and used-equipment trade cycles than new sales. The business is deeply cyclical with farm income and now central to the right-to-repair fight. Operations are manufacturing, dealer-network management, and precision-ag data platforms.", "regulation": "EPA/CARB engine-emissions (Tier 4), NHTSA/DOT for road transport, OSHA machine-guarding, FCC for GPS/telematics. Self-regulates through AEM (Association of Equipment Manufacturers) standards and ASABE engineering standards.", "examples": "John Deere, CNH Industrial (Case IH), AGCO, Kubota"}, {"name": "Grain Elevator / First Handler & Merchandiser", "naics": "424510, 493130", "definition": "The country and terminal elevators and merchandising operations that buy grain from farmers, store it, and sell it into the processing and export channel — the pivot between farm and market.", "operations": "Earns the merchandising margin (basis) and storage/handling fees, not directional price bets — elevators hedge every bushel bought on futures the moment they take ownership, profiting on basis appreciation and carry. Operations are receiving and quality grading at harvest, blending, storage management, and logistics (rail, barge) to end users.", "regulation": "USDA GIPSA/Federal Grain Inspection Service (weighing and grading), CFTC (their hedging is exempt but supervised), state grain-warehouse licensing and bonding to protect farmer deposits. Self-regulates through NGFA (National Grain and Feed Association) trade rules and arbitration.", "examples": "Cargill, ADM, Bunge, CHS Inc. (cooperative)"}, {"name": "Global Agricultural Commodity Trader", "naics": "424510, 425120", "definition": "The multinational merchants (the 'ABCDs') that originate, transport, store, process, and trade agricultural commodities across the world, arbitraging geography, time, and form.", "operations": "Profits from spreads across space (origin to destination), time (storage/carry), and form (crushing soybeans into meal and oil — the crush margin); scale in logistics assets (ports, vessels, crush plants) and market information is the moat. Operations are origination from farmers worldwide, freight and logistics orchestration, processing, and risk management across a global book.", "regulation": "CFTC (derivatives), CBP and foreign customs (cross-border flows), antitrust scrutiny given concentration, sanctions/export-control compliance. Self-regulates through GAFTA and FOSFA contract and arbitration rules that govern the physical trade globally.", "examples": "ADM, Bunge, Cargill, Louis Dreyfus Company"}, {"name": "Meat & Poultry Processor / Packer", "naics": "311611, 311615, 311612", "definition": "Slaughter and processing operations that convert live animals into boxed meat and further-processed products — the industrial heart of the protein value chain.", "operations": "Earns the packer margin — the spread between live-animal cost and boxed-meat value (the beef/pork cutout) — on enormous throughput at thin per-pound margins, so line speed, yield, and byproduct (rendering, hides) recovery are everything. Operations are continuous disassembly lines under permanent USDA inspection, cold-chain management, and food-safety intervention.", "regulation": "USDA FSIS with in-plant inspectors on every shift (a carcass cannot ship without the mark of inspection), OSHA (a high-injury industry), EPA wastewater, DOL for a heavily immigrant workforce. Self-regulates through GFSI-benchmarked schemes and HACCP plans mandated and validated.", "examples": "Tyson Foods, JBS, Cargill Protein, Smithfield Foods"}, {"name": "Food & Beverage Processor / Manufacturer", "naics": "311 (e.g., 311230 cereal, 311340 confectionery, 311411 frozen, 311513 cheese, 311824 milling)", "definition": "Manufacturers that transform agricultural raw materials into shelf-stable, portioned, branded food and beverage products for retail and foodservice.", "operations": "Earns brand and value-add margins far above raw-commodity margins; profitability hinges on commodity input hedging, plant efficiency (OEE), innovation, and trade-spend management with retailers. Operations are formulation, high-speed continuous or batch manufacturing lines, sanitation (the sacred nightly cleanup), packaging, and distribution.", "regulation": "FDA (FSMA preventive controls, labeling under FALCPA/Nutrition Facts), USDA FSIS for meat-containing products, EPA, OSHA, FTC for advertising claims. Self-regulates through GFSI schemes (SQF, BRC), GMA/CBA industry standards, and third-party allergen and organic audits.", "examples": "Nestlé, PepsiCo, General Mills, Kraft Heinz"}, {"name": "Agricultural Support & Custom Services", "naics": "115111, 115113, 115115", "definition": "Firms providing services to producers — custom planting, spraying, and harvesting; crop dusting; soil testing; farm-labor contracting; and increasingly ag-tech and agronomy services.", "operations": "Earns per-acre or per-hour service fees, letting farmers avoid owning specialized equipment or accessing scarce labor; custom harvesters follow the wheat harvest north across the plains each summer. Operations are seasonal, equipment- and labor-intensive, and weather-dependent.", "regulation": "EPA/state applicator licensing (commercial pesticide applicators must be certified), FAA for aerial application, DOL for farm-labor contractors (MSPA registration and H-2A), OSHA. Self-regulates through NAAA (aerial applicators) and custom-operator association standards.", "examples": "Custom harvesting crews (U.S. Custom Harvesters members), Helena Agri-Enterprises (services), Nutrien Ag Solutions"}], "regulators": [{"name": "U.S. Department of Agriculture (USDA)", "jurisdiction": "US", "role": "The domain's central regulator and promoter: FSIS inspects meat/poultry, APHIS guards plant/animal health, AMS grades and runs marketing orders, RMA/FCIC and FSA deliver crop insurance and farm payments, and NASS publishes the market-moving crop and livestock reports."}, {"name": "Food and Drug Administration (FDA)", "jurisdiction": "US", "role": "Regulates the safety of all food except meat and poultry — produce, seafood, dairy, and processed foods — under the Food Safety Modernization Act, plus food labeling, animal drugs and feed, and the produce-safety and preventive-controls rules."}, {"name": "Environmental Protection Agency (EPA)", "jurisdiction": "US", "role": "Registers and restricts pesticides under FIFRA, sets the Worker Protection Standard, permits large livestock operations (CAFOs) for manure and nutrient runoff, and governs agricultural water and air emissions."}, {"name": "Commodity Futures Trading Commission (CFTC)", "jurisdiction": "US", "role": "Regulates the agricultural futures and options markets (corn, soybeans, wheat, cattle, hogs) essential to price discovery and hedging, policing manipulation and enforcing position limits on the exchanges where farmers and processors lay off risk."}, {"name": "NOAA Fisheries (National Marine Fisheries Service)", "jurisdiction": "US", "role": "Manages wild-capture fisheries under the Magnuson-Stevens Act: sets science-based catch limits and quotas, permits vessels, and enforces sustainable-harvest rules through the regional fishery management councils."}, {"name": "Food and Agriculture Organization (FAO) / Codex Alimentarius", "jurisdiction": "Global", "role": "The FAO coordinates global food-security policy and data; the joint FAO/WHO Codex Alimentarius sets international food-safety and quality standards that the WTO recognizes as the benchmark in trade disputes over food."}, {"name": "USDA National Organic Program & Accredited Certifiers", "jurisdiction": "US (co-regulatory)", "role": "Administers the federal organic standard through a network of USDA-accredited third-party certifiers that inspect and certify farms and processors — a hybrid public-private regime governing a $60B+ market."}, {"name": "National Grain and Feed Association (NGFA) / Commodity Check-off Boards", "jurisdiction": "US (industry self-regulation)", "role": "The NGFA writes the trade rules and arbitration system governing grain merchandising; producer-funded check-off boards (beef, pork, dairy, soybean) self-fund research, promotion, and quality-assurance programs under USDA oversight."}]}, "groundView": {"orgModel": "The domain has two dominant organizational archetypes. The production farm — even large ones — is a family or closely held business: an owner-operator (or a partnership of family principals) is simultaneously CEO, CFO, and lead equipment operator, supported by a farm manager or foreman directing a small permanent crew swollen by seasonal labor at planting and harvest; specialized advisers (agronomist, veterinarian, crop insurance agent, grain marketer, banker) are largely outsourced. The agribusiness corporation — the processors, input suppliers, traders, and integrators — looks like an industrial company: a public-company board over a CEO, with executives running procurement/origination (buying the raw commodity), operations (plants, feed mills, elevators), commercial/sales, R&D, and a powerful commodity risk-management/trading function that hedges input and output prices, since a processor is fundamentally a spread business. Beneath them, plant and facility managers run continuous operations through superintendents and shift supervisors down to the line workers, equipment operators, and farmhands who do the physical work — increasingly alongside precision-ag data and automation.", "positions": [{"title": "Board Director (Agribusiness / Cooperative)", "level": "Governance", "reportsTo": "Shareholders / Cooperative Members", "duties": "Oversees strategy in a commodity-cyclical, weather-exposed business; approves major capital (plants, acquisitions), commodity risk-management policy, and — at cooperatives — patronage distributions to farmer-members who elect the board. Measured on return on capital, member value, and food-safety/reputational stewardship.", "credentials": "Agribusiness executives, farmer-leaders (at co-ops), commodity and food-safety expertise; NACD or cooperative-director training.", "socCode": "11-1011"}, {"title": "Chief Executive Officer / Farm Owner-Operator", "level": "Executive", "reportsTo": "Board / Family Partners / Self", "duties": "At an agribusiness, sets strategy, capital allocation, and risk posture across a global commodity book; at a farm, is the working proprietor making the land, crop-mix, marketing, and capital decisions while often still in the cab. Measured on ROIC and margin (corporate) or net farm income, yield, and balance-sheet survival (farm).", "credentials": "Corporate: MBA or ag-economics plus decades in the industry. Farm: agronomic and business acumen, often a land-grant ag degree, generational knowledge.", "socCode": "11-9013"}, {"title": "Chief Operating Officer / VP Operations", "level": "Executive", "reportsTo": "CEO", "duties": "Runs the physical enterprise: plants, feed mills, elevators, or farm divisions; owns throughput, cost, food safety, and worker safety. Chairs operations reviews on yield, line efficiency, and USDA/FDA compliance. Measured on cost per unit, plant uptime (OEE), recordable-injury rate, and food-safety audit scores.", "credentials": "Engineering or food-science degree; Lean/Six Sigma; 20 years through plant management; HACCP and PCQI certification.", "socCode": "11-1021"}, {"title": "VP Commodity Risk Management / Chief Trading Officer", "level": "Executive", "reportsTo": "CEO / CFO", "duties": "Owns the hedge book that keeps a spread business alive: sets policy for hedging input and output commodity exposure on futures/options, manages basis and crush/cutout margins, and governs speculative limits. Measured on hedge effectiveness, margin capture, and staying within risk limits.", "credentials": "Ag economics or finance degree; deep futures-market expertise; Series 3 where applicable; a decade on trading/merchandising desks.", "socCode": "11-3031"}, {"title": "VP Procurement / Origination (Grain, Livestock, Milk)", "level": "Executive", "reportsTo": "CEO / COO", "duties": "Secures the raw material supply: builds producer relationships and contracts, sets buying-station pricing, and coordinates with risk management to hedge every purchase. In protein, manages live-animal procurement to keep plants full. Measured on volume secured, cost of raw material versus market, and supply reliability.", "credentials": "Ag business degree; merchandising background; NGFA trade-rule fluency; grower-relationship credibility.", "socCode": "11-3061"}, {"title": "Plant Manager (Processing / Packing)", "level": "Management", "reportsTo": "VP Operations", "duties": "Runs a slaughter, processing, or food-manufacturing plant 24/6: line speed and yield, USDA/FDA inspection relationship, sanitation and food safety, labor of hundreds or thousands, and cost budget. A recall or an inspector's action is a plant-manager crisis. Measured on yield, throughput, food-safety metrics, labor cost, and TRIR.", "credentials": "Food science or engineering degree; HACCP/PCQI; 15 years through supervision; bilingual leadership often essential.", "socCode": "11-3051"}, {"title": "Farm Manager / Ranch Manager", "level": "Management", "reportsTo": "Owner / Farm Operating Company", "duties": "Manages day-to-day production on owned or operated land: cropping or grazing plans, input purchasing, equipment and labor scheduling, agronomic and animal-health decisions, and record-keeping for programs and lenders. Measured on yield, cost per acre/head, and operational execution against the plan.", "credentials": "Land-grant degree in agronomy, animal science, or ag business (or equivalent experience); Certified Crop Adviser useful; pesticide applicator license.", "socCode": "11-9013"}, {"title": "Grain Merchandiser / Commodity Trader", "level": "Professional", "reportsTo": "VP Risk Management / Origination Manager", "duties": "Buys and sells physical grain and manages basis positions: quotes cash bids to farmers and end users, hedges each transaction on CBOT futures within minutes, and optimizes storage carry and freight to capture margin. Marks the book daily. Measured on merchandising margin, basis performance, and hedge discipline.", "credentials": "Ag economics/finance degree; NGFA and futures-market fluency; often a grain-origination trainee track.", "socCode": "41-3099"}, {"title": "Agronomist / Certified Crop Adviser", "level": "Professional", "reportsTo": "Agronomy Manager / Farm Owner", "duties": "Prescribes the crop plan: soil and tissue testing, fertility and pest recommendations, seed and hybrid selection, and increasingly variable-rate prescriptions from precision-ag data — scouting fields through the season and adjusting. Measured on client yield outcomes, product sell-through (at retailers), and recommendation accuracy.", "credentials": "BS in agronomy/soil science; Certified Crop Adviser (CCA) credential; state pesticide applicator/consultant license.", "socCode": "19-1013"}, {"title": "Food Safety & Quality Assurance Manager", "level": "Professional", "reportsTo": "Plant Manager / VP Quality", "duties": "Owns the plant's food-safety system: writes and validates the HACCP plan, manages the SQF/BRC certification, runs environmental pathogen monitoring, leads the response to positives and recalls, and hosts USDA/FDA and customer audits. Measured on audit scores, pathogen results, holds/recalls, and customer complaints.", "credentials": "Food science or microbiology degree; PCQI and HACCP certification; SQF/BRC practitioner training.", "socCode": "11-9199"}, {"title": "Veterinarian (Production Animal / Public Health)", "level": "Professional", "reportsTo": "Director of Animal Health / Live Operations", "duties": "Manages herd/flock health across an integrated operation or as an inspector: vaccination and treatment protocols, disease surveillance and outbreak response (a positive avian-influenza test is a veterinary emergency), antibiotic stewardship under the VFD, and welfare compliance. Measured on morbidity/mortality, treatment costs, and welfare-audit outcomes.", "credentials": "DVM and state veterinary license; USDA accreditation; often board specialization in poultry/swine/bovine medicine.", "socCode": "29-1131"}, {"title": "Precision Agriculture / Ag Data Specialist", "level": "Professional", "reportsTo": "Farm Manager / Technology Lead", "duties": "Runs the digital layer of the modern farm: GPS/RTK guidance and auto-steer setup, yield-monitor and imagery data management, variable-rate prescription writing, and equipment telematics — turning field data into agronomic decisions. Measured on data quality, prescription performance, and equipment uptime.", "credentials": "Degree or certificate in precision ag/agronomy or GIS; platform certifications (John Deere Operations Center, Climate FieldView).", "socCode": "19-4012"}, {"title": "Crop Insurance Agent / Adjuster", "level": "Professional", "reportsTo": "Agency Principal / RMA-approved Insurance Provider", "duties": "Sells and services federally reinsured crop insurance: matches coverage (yield, revenue protection) to operations by the sales-closing deadline, and as adjuster documents and appraises losses after hail, drought, or flood to settle indemnities under RMA procedures. Measured on book retention, compliance accuracy, and claim-cycle timeliness.", "credentials": "State insurance license plus RMA/AIP training and certification; ag background essential to credibility.", "socCode": "13-1031"}, {"title": "Livestock Feedlot Manager / Nutritionist", "level": "Professional", "reportsTo": "Feedlot Owner / VP Cattle Feeding", "duties": "Optimizes the cost of gain: formulates least-cost rations against feed markets, manages cattle procurement and placement, oversees pen riding and health programs, and times cattle to market against hedged prices. Measured on feed conversion, average daily gain, death loss, and closeout profitability per pen.", "credentials": "Animal science degree, often MS in ruminant nutrition; feedlot-management experience; commodity-market fluency.", "socCode": "19-1011"}, {"title": "Equipment Operator (Tractor / Combine / Sprayer)", "level": "Operational", "reportsTo": "Farm Manager / Foreman", "duties": "Runs the machinery of production: operates GPS-guided tractors for tillage and planting, combines through harvest (often around the clock in the harvest window), and self-propelled sprayers for chemical application — with the mechanical skill to keep six-figure equipment running in the field. Measured on acres covered, timeliness, application accuracy, and equipment care.", "credentials": "No degree required; equipment proficiency; commercial pesticide applicator license for spraying; CDL for road/grain hauling.", "socCode": "45-2091"}, {"title": "Meat/Poultry Processing Line Worker", "level": "Operational", "reportsTo": "Line Supervisor", "duties": "Performs a specialized station on the disassembly line — cutting, trimming, deboning, or packing — at high line speed under cold, wet, physically demanding conditions, meeting yield and food-safety standards under constant USDA inspection. Measured on line rate, yield/trim accuracy, and food-safety compliance.", "credentials": "No formal education required; in-plant training; a workforce that is heavily immigrant, making bilingual supervision common.", "socCode": "51-3023"}, {"title": "Farmworker / Crop & Livestock Laborer", "level": "Operational", "reportsTo": "Crew Leader / Farm Foreman", "duties": "Does the hand labor of agriculture: planting, weeding, hand-harvesting fruit and vegetables at piece-rate pace, sorting and packing in the shed, and tending animals — the seasonal surge often filled by H-2A guestworkers. Measured on picking speed/piece count, pack quality, and adherence to food-safety and worker-protection protocols.", "credentials": "No formal education; on-the-job and Worker Protection Standard training; H-2A visa for many seasonal workers.", "socCode": "45-2092"}, {"title": "Dairy Herdsperson / Milker", "level": "Operational", "reportsTo": "Dairy Manager", "duties": "Runs the milking parlor on a rigid twice/thrice-daily schedule: prepping and attaching units with correct sanitation to protect milk quality (somatic cell count), monitoring cows for mastitis and heat, and moving groups — the relentless rhythm that never pauses for weekends or holidays. Measured on milk quality, parlor throughput, and cow health.", "credentials": "No degree; on-the-job training in milking protocols and animal handling; often skilled immigrant labor.", "socCode": "45-2093"}, {"title": "Commercial Fisher / Deckhand", "level": "Operational", "reportsTo": "Vessel Captain", "duties": "Works the deck on one of the most dangerous jobs in America: setting and hauling gear, handling and processing catch at sea, and maintaining vessel and equipment through long, hazardous trips under quota deadlines — paid on a share of the catch. Measured on catch handled, safety, and crew-share productivity.", "credentials": "No degree; USCG-required safety training and drills; experience earned aboard; captain roles require USCG licensing.", "socCode": "45-3031"}, {"title": "Grain Elevator Operator / Facility Worker", "level": "Operational", "reportsTo": "Elevator/Facility Manager", "duties": "Runs the country elevator at harvest: probes and grades incoming loads, operates dumps, legs, and conveyors to bin grain by quality, manages aeration and fumigation to preserve stored grain, and loads rail cars and barges — in one of agriculture's most hazardous settings (grain entrapment, dust explosion). Measured on receiving throughput, grade accuracy, grain condition, and safety.", "credentials": "No degree; OSHA grain-handling (bin-entry, lockout, dust) training; equipment operation certification.", "socCode": "45-2041"}]}}, {"id": "infrastructure", "name": "Infrastructure", "icon": "🏗️", "tagline": "The built environment and physical networks that carry everything else a civilization does.", "view100k": {"role": "Infrastructure is the load-bearing skeleton of civilization: the roads, bridges, tunnels, ports, airports, rail, pipelines, dams, levees, water and wastewater systems, and the buildings in which people live, work, and are governed. Its function is to move people, goods, water, energy, and information across space and to shelter human activity, converting the raw geography of a territory into a productive, connected economy. Without a graded roadbed there is no trade; without a treatment plant there is no public health; without a foundation there is no factory. Infrastructure exists because the fixed, capital-intensive, long-lived assets it produces are prerequisites that no single household or firm can economically supply alone, so society organizes construction, civil engineering, and real estate development to build and maintain them.\n\nThe scale is immense. Global construction output is on the order of $13-15 trillion per year, roughly 13% of world GDP, and the sector directly employs well over 200 million people worldwide — one of the largest employment blocks of any domain, and the single largest industrial consumer of raw materials (cement, steel, aggregate, asphalt). In the United States, construction alone is about $2 trillion of annual spending and employs roughly 8 million workers across some 750,000 establishments, most of them small specialty-trade contractors. Real estate, the sister discipline that finances, develops, and operates the built stock, is by asset value the largest store of wealth on Earth — global real estate is estimated near $380 trillion, dwarfing all equities and bonds combined.\n\nThe historical arc runs from Roman roads, aqueducts, and concrete through the canal and turnpike eras, the 19th-century railway and sanitation revolutions (Bazalgette's London sewers, the Brooklyn Bridge), the 20th-century age of reinforced concrete, the interstate highway and public-works programs, and now a 21st-century pivot toward renewal of aging assets, resilience against climate loads, and the digital instrumentation of physical systems (BIM, smart grids, sensor-laden 'smart' infrastructure). The defining tension of the modern era is the maintenance and decarbonization of a vast, depreciating legacy stock rather than only greenfield expansion.", "interdependencies": "Infrastructure is the physical substrate on which the other nineteen domains run. It carries Energy (transmission corridors, pipelines, the poured foundations of every plant), enables Trade and Economy (ports, highways, logistics), and delivers the water and sanitation that underpin Medicine and Population health. It is financed by Finance (project bonds, REITs, infrastructure funds) and directed by Governance (public-works ministries, zoning, eminent domain). It consumes the output of Industry (steel, cement, machinery) and the designs of Science and Technology (materials science, BIM, GIS), and it must answer to Environment (impact assessment, wetlands, emissions) and Law (contracts, liability, building codes). Communication networks ride on its ducts and towers; Education and Culture occupy its schools, universities, and monuments; Defense depends on its strategic mobility (bases, dual-use ports and airfields); and Agriculture relies on its irrigation, grain terminals, and farm-to-market roads. Nearly every domain both demands infrastructure and is shaped by where and how it is built.", "regulationModel": "Infrastructure is one of the most heavily and multiply regulated domains because its failures kill people and its assets last for generations. Government safety regulators (in the US, OSHA for worker safety, the FHWA and state DOTs for highways, the FAA for airports, the FRA for rail, the EPA and state agencies for water and wastewater under the Clean Water and Safe Drinking Water Acts) set binding rules. The work itself is gated by professional licensure: only a licensed Professional Engineer (PE) may seal structural and civil designs, and licensure boards (state boards under NCEES model rules) enforce competence and liability. A dense layer of consensus standards and model codes governs practice — the International Code Council's building codes, ACI (concrete), AISC (steel), ASTM and ASCE (loads, materials, and the ASCE 7 standard), and ISO. Self-regulation runs through industry associations (AGC, ABC, the Design-Build Institute) and professional societies (ASCE, ACEC). Finally, market and financial discipline — rating-agency scrutiny of municipal and project debt, insurers, and surety bonding — polices who is allowed to build and borrow."}, "view10k": {"overview": "In NAICS, infrastructure spans Sector 23 (Construction) — split into building construction (236), heavy and civil engineering construction (237), and specialty trade contractors (238) — together with the transportation and warehousing networks of Sector 48-49, the water/sewage and pipeline utilities in Sector 22 and 486, the design services of NAICS 5413 (architectural and engineering services), and Sector 53 (Real Estate and Rental and Leasing) which develops, finances, and operates the built stock. Firms range from global engineering-procurement-construction (EPC) contractors and design giants to a long tail of local specialty-trade subcontractors, plus public agencies (DOTs, water districts, port authorities) that own and operate much of the network directly.", "businessTypes": [{"name": "Heavy & Civil Engineering (EPC) Contractor", "naics": "237310, 237990", "definition": "Firms that build large fixed civil works — highways, bridges, tunnels, dams, ports, and mass earthworks — often on a design-build or engineer-procure-construct basis.", "operations": "They win work by competitive bid or negotiated contract, then self-perform or subcontract heavy earthmoving, structural, and paving work while managing schedule, equipment fleets, and materials logistics; margins are thin (2-4%) and cash flow is driven by progress billings and change orders. Profit hinges on accurate estimating, productivity of crews and equipment, and disciplined claims management.", "regulation": "Governed externally by OSHA, FHWA/state DOTs, and USACE permitting; self-regulated through AGC standard contract practices, prequalification, surety bonding, and ISO 9001/45001 quality and safety certification.", "examples": "Bechtel, Kiewit, Fluor, VINCI, ACS/Dragados"}, {"name": "Building / General Contractor", "naics": "236210, 236220", "definition": "Firms that construct commercial, institutional, and industrial buildings, acting as the prime coordinator of trades and the party responsible to the owner for delivery.", "operations": "They act as construction manager or general contractor, buying out subcontracts, sequencing trades, and delivering to cost and schedule; revenue comes from a fee or lump-sum contract, and they carry risk on productivity, coordination, and defects. Preconstruction estimating and supply-chain buyout drive competitiveness.", "regulation": "Regulated by local building departments enforcing ICC codes and inspections, plus OSHA; self-regulation via AGC/ABC, LEED green-building certification (USGBC), and licensing of the qualifying party.", "examples": "Turner Construction, Skanska USA, DPR, Gilbane"}, {"name": "Specialty Trade Contractor", "naics": "238", "definition": "Subcontractors performing a single trade — electrical, mechanical/HVAC, plumbing, concrete, structural steel, roofing, or excavation.", "operations": "They contract to a GC or owner for a defined scope, deploy licensed tradespeople and foremen, and earn margin on labor productivity and material markup; most are small, local, and labor-intensive. Work backlog, skilled-labor availability, and safety records determine viability.", "regulation": "Trade licensing (electrical, plumbing) by state/local boards, OSHA safety rules, and electrical/mechanical codes (NEC/NFPA 70, IPC); self-regulated through trade unions and associations (NECA, MCAA, SMACNA) that set apprenticeship and workmanship standards.", "examples": "Rosendin Electric, EMCOR subsidiaries, Comfort Systems USA"}, {"name": "Architecture & Engineering (A/E) Design Firm", "naics": "541310, 541330", "definition": "Professional practices that design buildings and civil works and produce the sealed drawings and specifications that permit construction.", "operations": "They sell professional services billed hourly or as a percentage of construction cost, producing schematic, design-development, and construction documents and providing construction-phase oversight; profit depends on billable utilization and avoiding uninsured design errors. Reputation and repeat clients drive backlog.", "regulation": "Licensure of architects (NCARB/state boards) and Professional Engineers (NCEES/state boards) is mandatory to seal work; professional liability insurance and codes (IBC, ASCE 7) constrain design. Self-regulated by AIA, ACEC, and ASCE codes of ethics.", "examples": "AECOM, Jacobs, Gensler, Arup, HDR"}, {"name": "Water & Wastewater Utility", "naics": "221310, 221320", "definition": "Public or investor-owned systems that treat, distribute, and reclaim potable water and sewage.", "operations": "They operate treatment plants and pipe networks, recovering costs through rate-based tariffs approved by regulators; capital comes from municipal bonds or state revolving funds, and operations center on compliance, plant uptime, and leak reduction. Revenue is a regulated return on rate base or cost-recovery for public systems.", "regulation": "Heavily regulated by EPA and state agencies under the Safe Drinking Water Act and Clean Water Act, with public utility commissions setting rates; AWWA sets consensus operating and materials standards.", "examples": "American Water, Veolia, Suez, Thames Water"}, {"name": "Transportation Network Operator (Toll/Port/Airport/Rail)", "naics": "488119, 488310, 488190, 482", "definition": "Entities that own and operate fixed transportation assets — toll roads, ports, airports, and rail lines — and charge for access.", "operations": "They earn tolls, landing fees, berthing charges, or access fees, and must fund heavy periodic maintenance and capacity expansion; many are public authorities or long-term private concessionaires under public-private partnership (P3) contracts. Traffic volume and asset availability drive revenue.", "regulation": "Sector-specific federal regulators (FAA for airports, FRA/STB for rail, MARAD/Coast Guard for ports) plus concession agreements; self-regulation via IATA/ACI (airports) and AAPA (ports) standards.", "examples": "Port Authority of NY/NJ, Ferrovial (toll roads), Transurban, PSA International"}, {"name": "Real Estate Developer", "naics": "237210, 236117, 531", "definition": "Firms that assemble land, secure entitlements and financing, and build residential, commercial, or mixed-use property for sale or lease.", "operations": "They create value by turning raw or underused land into permitted, financed, built product; returns come from the development spread between all-in cost and completed value, funded by equity plus construction and permanent debt. Entitlement risk, capital cost, and absorption/lease-up pace govern success.", "regulation": "Constrained by zoning, land-use law, and building codes enforced by municipalities, plus environmental review (NEPA/CEQA); self-regulation through ULI best practices and NAHB/NAIOP standards.", "examples": "Hines, Related Companies, Lendlease, Brookfield Properties"}, {"name": "REIT / Infrastructure Asset Owner", "naics": "525990, 531120, 531190", "definition": "Investment vehicles that own income-producing real estate or infrastructure assets and distribute cash flow to investors.", "operations": "They aggregate capital to acquire and operate stabilized assets (offices, warehouses, towers, toll roads), earning net operating income and returning it as dividends to retain tax-advantaged status; leverage and cap-rate spreads amplify returns. Occupancy, rent growth, and cost of capital drive performance.", "regulation": "REITs are regulated by the SEC and IRS (90% distribution and asset tests); infrastructure funds by securities regulators. Self-regulation via Nareit reporting standards and GRESB ESG benchmarking.", "examples": "Prologis, American Tower, Simon Property Group, Macquarie Infrastructure"}, {"name": "Construction Materials Producer (Cement/Aggregate/Ready-Mix)", "naics": "327320, 212321, 327310", "definition": "Firms that quarry aggregate and manufacture cement, ready-mix concrete, and asphalt for construction.", "operations": "They run capital-intensive quarries and plants near demand centers (materials are heavy and freight-sensitive), selling by volume to contractors; profitability depends on local pricing power, plant utilization, and energy/fuel costs. Aggregates are a low-value, high-weight, locally monopolistic business.", "regulation": "MSHA regulates mines and quarries, EPA governs emissions and dust; self-regulation and standards via ASTM C150 (cement), ACI, and the NRMCA/Portland Cement Association.", "examples": "Holcim, CRH, Vulcan Materials, Martin Marietta, Cemex"}, {"name": "Construction Equipment Rental & Fleet", "naics": "532412", "definition": "Companies that rent earthmoving, lifting, and access equipment to contractors on daily-to-monthly terms.", "operations": "They own large depreciating fleets (excavators, cranes, aerial lifts) and earn rental revenue plus resale of used units; utilization rate and fleet-age management drive returns, and the model converts contractors' capex into opex. Branch density and fleet mix are competitive levers.", "regulation": "OSHA and ANSI/ASME rules govern crane and aerial-lift operation and inspection; self-regulation through the American Rental Association (ARA) safety standards.", "examples": "United Rentals, Sunbelt Rentals (Ashtead), Herc Rentals"}, {"name": "Facilities Management & Operations", "naics": "561210", "definition": "Firms that operate and maintain the mechanical, electrical, and structural systems of buildings and campuses over their service life.", "operations": "They provide integrated maintenance, janitorial, security, and energy management under multi-year service contracts, earning recurring fees; performance is measured by uptime, service-level compliance, and lifecycle cost reduction. The model monetizes the long operating phase of the asset lifecycle.", "regulation": "OSHA, fire and life-safety codes (NFPA), and building codes; self-regulation via IFMA and BOMA operating standards and certifications (FMP, RPA).", "examples": "CBRE (GWS), JLL, ISS, Sodexo"}, {"name": "Surveying, Geotechnical & Testing Services", "naics": "541370, 541380", "definition": "Technical firms that survey land, characterize soils and rock, and test materials to inform and verify construction.", "operations": "They deploy survey crews, drilling rigs, and labs to produce boundary/topographic surveys, geotechnical reports, and materials-testing certifications billed as professional services; accuracy and liability management are central. Their outputs de-risk design and are prerequisites for permits.", "regulation": "Professional Land Surveyor (PLS) and PE licensure, plus lab accreditation (AASHTO/ASTM, ISO 17025); self-regulated by NSPS and ASFE/Geoprofessional Business Association.", "examples": "Terracon, Fugro, NV5, Wood plc"}], "regulators": [{"name": "Occupational Safety and Health Administration (OSHA)", "jurisdiction": "US", "role": "Sets and enforces construction worker-safety standards (29 CFR 1926), inspects sites, and levies penalties for fall, trench, and struck-by hazards — the leading causes of construction death."}, {"name": "Federal Highway Administration (FHWA) & State DOTs", "jurisdiction": "US", "role": "Fund and set design/construction standards for the National Highway System, administer federal-aid rules, and oversee bridge inspection under the National Bridge Inspection Standards."}, {"name": "U.S. Environmental Protection Agency (EPA)", "jurisdiction": "US", "role": "Administers the Safe Drinking Water Act and Clean Water Act, regulating water/wastewater utilities, stormwater (NPDES), wetlands (Section 404 with USACE), and construction runoff."}, {"name": "U.S. Army Corps of Engineers (USACE)", "jurisdiction": "US", "role": "Permits work in navigable waters and wetlands, builds and operates federal dams, levees, and ports, and sets civil-works engineering standards."}, {"name": "International Code Council (ICC)", "jurisdiction": "US/Global (standards body)", "role": "Develops the model building codes (IBC, IRC, IEBC) adopted by jurisdictions as the legal baseline for structural, fire, and life-safety requirements — a consensus standards body, not a government agency."}, {"name": "NCEES / State Licensing Boards", "jurisdiction": "US (professional licensure)", "role": "Administer the PE and PS exams and model licensure law; state boards license and discipline Professional Engineers and Surveyors who alone may seal infrastructure designs."}, {"name": "American Society of Civil Engineers (ASCE)", "jurisdiction": "US/Global (professional society & standards)", "role": "Publishes consensus load and design standards (notably ASCE 7), a binding code of ethics, and the Report Card grading US infrastructure condition — a self-regulatory professional body."}, {"name": "Associated General Contractors / American Water Works Association (AGC / AWWA)", "jurisdiction": "US (industry associations)", "role": "AGC issues standard construction contracts and safety/best-practice programs; AWWA sets consensus standards for water-system materials and operations — private self-regulation of the trades."}]}, "groundView": {"orgModel": "A large engineering-and-construction or infrastructure firm is governed by a board and led by a CEO, beneath whom sit a President/COO and functional chiefs (CFO, Chief Engineer, Chief Safety Officer, General Counsel). Work is organized into business units by market (transportation, buildings, water, energy) or geography, each run by a division/regional president. Below the executive tier, delivery flows through project organizations: a project executive oversees several projects, each led by a project manager supported by project engineers, estimators, schedulers, and a superintendent who directs field production. The field ladder runs superintendent to general foreman to trade foremen to journeyworkers, apprentices, and laborers, with safety, quality, and procurement functions matrixed across projects. Design firms mirror this with principals, project architects/engineers, discipline leads, and CAD/BIM technicians.", "positions": [{"title": "Board of Directors / Chair", "level": "Governance", "reportsTo": "Shareholders", "duties": "Sets corporate strategy and risk appetite, approves major bids and capital commitments, and holds the CEO accountable for safety and financial performance. Owns fiduciary oversight and is measured on shareholder value and the absence of catastrophic failures.", "credentials": "Senior industry, finance, or engineering leaders; often former CEOs or PEs; board governance experience.", "socCode": "11-1011"}, {"title": "Chief Executive Officer", "level": "Executive", "reportsTo": "Board of Directors", "duties": "Sets strategy, allocates capital across markets, and owns overall P&L, safety culture, and major client relationships. Measured on revenue, margin, backlog quality, and safety metrics such as the recordable incident rate.", "credentials": "Engineering or construction-management degree, often an MBA; decades of project and executive experience; frequently a PE.", "socCode": "11-1011"}, {"title": "Chief Engineer / VP of Engineering", "level": "Executive", "reportsTo": "CEO", "duties": "Owns technical standards, design quality, and engineering risk across the firm, approving complex designs and adjudicating technical disputes. Measured on design integrity, avoided rework, and compliance with codes.", "credentials": "Professional Engineer (PE) license, advanced engineering degree, extensive design and construction experience.", "socCode": "11-9041"}, {"title": "Chief Safety Officer / EHS Director", "level": "Executive", "reportsTo": "CEO / COO", "duties": "Sets the safety and environmental management system, drives OSHA compliance, investigates incidents, and owns the firm's injury-prevention performance. Measured on TRIR/EMR, fatalities, and regulatory citations.", "credentials": "Safety/occupational-health degree, CSP (Certified Safety Professional) certification, OSHA and construction experience.", "socCode": "11-9199"}, {"title": "Division / Regional President", "level": "Executive", "reportsTo": "CEO / COO", "duties": "Runs a market or geographic business unit's P&L, sets its go-to-market and bidding strategy, and develops major client and owner relationships. Measured on unit profit, backlog, and win rate.", "credentials": "Engineering or construction degree, MBA common, long project-delivery track record.", "socCode": "11-1021"}, {"title": "Project Executive", "level": "Management", "reportsTo": "Division President", "duties": "Oversees a portfolio of projects, mentors project managers, manages owner relationships, and owns aggregate schedule, budget, and risk. Measured on portfolio margin, claims outcomes, and client satisfaction.", "credentials": "Bachelor's in construction management or engineering, PMP common, 15+ years' experience.", "socCode": "11-9021"}, {"title": "Project Manager", "level": "Management", "reportsTo": "Project Executive", "duties": "Owns a single project's cost, schedule, contracts, and subcontractor buyout, running change management and progress billing. Measured on project margin, on-time completion, and dispute avoidance.", "credentials": "Construction management/engineering degree, PMP or CCM certification, 7-12 years' experience.", "socCode": "11-9021"}, {"title": "Professional Engineer (Design)", "level": "Professional", "reportsTo": "Discipline Lead / Chief Engineer", "duties": "Produces and seals structural, civil, geotechnical, or MEP designs, performs load and code calculations, and stamps drawings, assuming legal liability for design adequacy. Measured on design quality, code compliance, and delivery to fee.", "credentials": "ABET-accredited engineering degree plus PE license (EIT then PE after experience and exams).", "socCode": "17-2051"}, {"title": "Architect", "level": "Professional", "reportsTo": "Principal / Project Architect", "duties": "Designs building form, function, and detailing, coordinates consultants, and produces sealed construction documents; owns aesthetic and code compliance. Measured on design quality, permit approval, and fee performance.", "credentials": "Professional (accredited) architecture degree, NCARB licensure, AXP experience, ARE exams.", "socCode": "17-1011"}, {"title": "Estimator", "level": "Professional", "reportsTo": "Preconstruction Manager", "duties": "Quantifies work, prices labor/material/equipment, and assembles competitive bids and budgets, driving whether the firm wins profitable work. Measured on bid accuracy, win rate, and margin realized versus estimate.", "credentials": "Construction management or quantity-surveying degree; CPE or estimating certification; software fluency (Bluebeam, HCSS).", "socCode": "13-1051"}, {"title": "Project Scheduler / Planner", "level": "Professional", "reportsTo": "Project Manager", "duties": "Builds and maintains the critical-path (CPM) schedule, tracks progress, and analyzes delays to support claims and recovery plans. Measured on schedule accuracy and forecast reliability.", "credentials": "Engineering/CM degree; Primavera P6 skills; PSP (Planning & Scheduling Professional) certification.", "socCode": "13-1082"}, {"title": "Superintendent", "level": "Management", "reportsTo": "Project Manager", "duties": "Directs all field production, sequences trades, enforces safety and quality, and owns daily productivity and site logistics. Measured on schedule adherence, safety record, and workmanship.", "credentials": "Trade background plus construction-management experience; OSHA 30; often a former foreman.", "socCode": "11-9021"}, {"title": "Field / Project Engineer", "level": "Professional", "reportsTo": "Project Manager / Superintendent", "duties": "Manages submittals, RFIs, quantities, and quality documentation, bridging the design and the field and resolving constructability issues. Measured on document turnaround and defect prevention.", "credentials": "Civil/construction engineering degree; EIT; entry-to-mid experience.", "socCode": "17-2051"}, {"title": "General Foreman / Trade Foreman", "level": "Operational", "reportsTo": "Superintendent", "duties": "Leads a crew of a specific trade, lays out and directs the day's work, and is accountable for crew productivity, safety, and quality. Measured on units installed per hour and incident-free work.", "credentials": "Journeyman certification in the trade, years of field experience, OSHA training, leadership skill.", "socCode": "47-1011"}, {"title": "Structural Ironworker", "level": "Operational", "reportsTo": "Trade Foreman", "duties": "Erects and connects structural steel and rebar, working at height to bolt and weld the building or bridge frame. Measured on connections completed safely to tolerance.", "credentials": "Ironworkers apprenticeship (3-4 years), welding certification, fall-protection training.", "socCode": "47-2221"}, {"title": "Heavy Equipment Operator", "level": "Operational", "reportsTo": "Trade Foreman", "duties": "Operates excavators, dozers, cranes, and graders to move earth and lift loads to grade and plan. Measured on production volume, accuracy, and equipment care/safety.", "credentials": "Operating Engineers apprenticeship; NCCCO crane certification where applicable; CDL for some machines.", "socCode": "47-2073"}, {"title": "Electrician / Plumber (Journeyman Tradesperson)", "level": "Operational", "reportsTo": "Trade Foreman", "duties": "Installs and tests electrical, plumbing, or mechanical systems to code, troubleshooting and commissioning building services. Measured on code-compliant, inspected, defect-free installation.", "credentials": "State journeyman/master license, completed apprenticeship, code knowledge (NEC/IPC).", "socCode": "47-2111"}, {"title": "Water/Wastewater Treatment Operator", "level": "Operational", "reportsTo": "Plant Superintendent", "duties": "Runs treatment plant processes, monitors chemistry and equipment, and ensures effluent and potable water meet permit limits. Measured on compliance, uptime, and process efficiency.", "credentials": "State operator certification (graded levels), environmental/chemistry coursework, continuing education.", "socCode": "51-8031"}, {"title": "Construction Laborer", "level": "Operational", "reportsTo": "Foreman", "duties": "Performs site preparation, material handling, concrete placement, and general support across trades. Measured on productivity, reliability, and safe work practices.", "credentials": "Entry-level; OSHA 10; Laborers' union apprenticeship or on-the-job training.", "socCode": "47-2061"}, {"title": "Land Surveyor", "level": "Professional", "reportsTo": "Survey Manager / PLS", "duties": "Establishes boundaries, grades, and control points, producing legal survey plats and construction staking. Measured on positional accuracy and legal defensibility.", "credentials": "Surveying/geomatics degree, PLS (Professional Land Surveyor) licensure, GPS/total-station skills.", "socCode": "17-1022"}]}}, {"id": "industry", "name": "Industry", "icon": "🏭", "tagline": "The transformation of raw matter and energy into the manufactured goods that equip civilization.", "view100k": {"role": "Industry is the domain that physically makes things — it extracts minerals and fuels from the earth and transforms raw materials into finished products, from steel beams and chemicals to cars, aircraft, semiconductors' host machines, appliances, and medicines' active ingredients. Its function is to convert matter and energy into useful, tradable goods at scale, capturing the productivity gains of the division of labor, mechanization, and, increasingly, automation. Industry is where scientific knowledge and engineering design become tangible output; it is the engine that turned agrarian societies into wealthy ones and remains the backbone of national economic power, defense capacity, and material living standards.\n\nThe scale is civilization-defining. Global manufacturing value-added is roughly $16 trillion per year — about 16-17% of world GDP — and mining and quarrying add trillions more; together industry employs several hundred million people worldwide. China alone accounts for nearly 30% of global manufacturing output, followed by the United States, and manufacturing punches far above its GDP weight because it drives the majority of private R&D, most patents, and the bulk of physical trade. In the US, manufacturing is about $2.9 trillion of value-added and roughly 13 million jobs, spread across durable goods (machinery, autos, aerospace, electronics, metals) and non-durables (chemicals, food, plastics, pharmaceuticals).\n\nThe historical arc runs from craft workshops and guilds through the First Industrial Revolution (steam, textiles, iron), the Second (steel, electricity, chemicals, the assembly line and interchangeable parts), the mid-20th-century age of mass production and the multinational manufacturer, the late-century shift to lean production and globalized supply chains, and now Industry 4.0 — robotics, additive manufacturing, digital twins, and the reshoring and decarbonization of heavy industry. The defining tensions of the modern era are automation versus employment, globalized efficiency versus supply-chain resilience, and output versus the carbon and material intensity of production.", "interdependencies": "Industry sits at the center of the material economy. It draws Energy (industry is the largest energy consumer, especially heavy steel, cement, and chemicals) and raw inputs from Agriculture (food processing, fibers) and its own extractive mining. It depends on Infrastructure to move inputs and outputs (ports, rail, roads) and on Finance for the immense working and fixed capital that plants require. It converts the discoveries of Science and the designs of Technology into products, and in turn supplies Technology with the fabs, machinery, and hardware it needs; it arms Defense (the defense-industrial base) and equips Medicine (devices, pharmaceuticals, PPE). It is governed by Governance (industrial policy, tariffs, safety and antitrust law) and constrained by Environment (emissions, waste, and the material footprint of extraction). Trade routes its output across borders, Education and the labor of Population supply its skilled workforce, Law enforces its contracts and liabilities, and Culture shapes demand for its consumer goods. Nearly every physical object in the other domains passed through industry first.", "regulationModel": "Industry is regulated on three fronts: worker safety, environmental impact, and product/market conduct. Worker safety is enforced by OSHA (and MSHA for mines) with binding standards on machine guarding, hazardous materials, and process safety. Environmental discharge, air emissions, and hazardous-waste handling are policed by the EPA under the Clean Air Act, Clean Water Act, RCRA, and TSCA (chemicals), with parallel EU regimes (REACH for chemicals, the Industrial Emissions Directive). Product safety and market conduct are overseen by the CPSC (consumer products), NHTSA (autos), FAA (aircraft), FDA (drugs/devices), and antitrust authorities (FTC/DOJ). Layered over government are consensus standards bodies and self-regulatory organizations: ISO (9001 quality, 14001 environment, 45001 safety), ASME (pressure vessels and the Boiler & Pressure Vessel Code), ASTM and SAE (materials and automotive standards), IPC (electronics), and powerful industry associations (the National Association of Manufacturers, the American Chemistry Council's Responsible Care program, the American Iron and Steel Institute) that set voluntary codes, certification, and stewardship regimes. Market discipline, insurance, and product-liability law complete the system."}, "view10k": {"overview": "In NAICS, industry spans the manufacturing sectors 31-33 — food, beverage, and textiles (311-316), wood, paper, printing, and chemicals (321-326), and the durable-goods complex of primary and fabricated metals, machinery, computers and electronics, electrical equipment, and transportation equipment (331-336) — together with the extractive Sector 21 (Mining, Quarrying, and Oil & Gas Extraction). Firms range from vertically integrated global manufacturers (autos, aerospace, chemicals) and contract manufacturers to a vast tier of component and job-shop suppliers, plus the miners and metal producers that feed them. The organizing logic is the value chain: extraction to primary materials to components to assembly to distribution, increasingly coordinated as global, tiered supplier networks.", "businessTypes": [{"name": "Automotive Manufacturer (OEM)", "naics": "336111, 336112", "definition": "Original equipment manufacturers that design, assemble, and market passenger vehicles and light trucks.", "operations": "They run capital-intensive assembly plants pulling thousands of parts from a tiered supplier base, earning margin on unit sales, financing, and increasingly software/services; profitability hinges on vo
