cast, Charter (Spectrum), Liberty Global"}, {"name": "Satellite & Space Communications Operator", "naics": "517410", "definition": "Firms that operate satellites and ground stations to provide broadcast, broadband, and connectivity.", "operations": "They build, launch, and operate satellite fleets, selling capacity and connectivity to broadcasters, carriers, and consumers; orbital slots, spectrum, and fleet reliability drive value. Capital intensity and long asset lives characterize the model, with LEO constellations disrupting it.", "regulation": "FCC and ITU allocate spectrum and orbital slots; self-regulation via ITU coordination and industry consortia.", "examples": "SES, Intelsat, Starlink (SpaceX), Viasat"}, {"name": "Broadcast Network / Television & Radio Station", "naics": "515120, 516210", "definition": "Firms that produce or aggregate and transmit programming to mass audiences over the air.", "operations": "They program and broadcast content, monetizing through advertising and, for TV, retransmission and affiliate fees; ratings and reach drive ad rates. Local stations and networks split content and distribution roles.", "regulation": "FCC licenses stations and enforces ownership, decency, and public-interest rules; self-regulation via NAB code and broadcast standards & practices.", "examples": "NBCUniversal, Disney/ABC, iHeartMedia, BBC"}, {"name": "Streaming Media / Content Platform", "naics": "516210, 512110", "definition": "Firms that produce and distribute film, TV, and audio directly to consumers over the internet.", "operations": "They license or produce content and deliver it via subscription or ad-supported streaming, with high content cost and near-zero delivery cost; subscriber growth, retention, and content hits drive value. The model displaces linear broadcasting and cable.", "regulation": "FTC (advertising, privacy), copyright law, emerging EU content rules; self-regulation via content ratings and industry practices.", "examples": "Netflix, Disney+, Spotify, YouTube"}, {"name": "Publisher (News, Books, Periodicals)", "naics": "513110, 513130, 513120", "definition": "Firms that produce and distribute written content — newspapers, books, and magazines — in print and digital form.", "operations": "They commission, edit, and distribute content, monetizing through subscriptions, sales, and advertising; brand, audience, and content quality drive value amid a wrenching print-to-digital transition. News publishers face collapsed ad revenue and paywall pivots.", "regulation": "Defamation and copyright law, press freedom protections; self-regulation via editorial standards, press councils, and SPJ ethics.", "examples": "The New York Times, News Corp, Penguin Random House, Condé Nast"}, {"name": "News Agency / Journalism Organization", "naics": "519110, 513110", "definition": "Organizations that gather and distribute news and reporting to the public and to other media.", "operations": "They employ reporters and editors to produce original journalism, monetizing via wire subscriptions, licensing, advertising, and reader subscriptions; credibility, speed, and exclusivity drive value. Wire services supply the whole media ecosystem.", "regulation": "Press freedom and defamation law; self-regulation via journalistic ethics codes and press councils.", "examples": "Reuters, Associated Press, Agence France-Presse, Bloomberg News"}, {"name": "Advertising Agency", "naics": "541810", "definition": "Firms that plan, create, and place advertising and marketing communications for clients.", "operations": "They develop creative campaigns and buy media on behalf of advertisers, earning fees, commissions, or margin on media buying; creativity, data/targeting, and client relationships drive value. The shift to digital and programmatic has reshaped the model.", "regulation": "FTC (truth-in-advertising), FCC (broadcast ads), privacy law; self-regulation via the BBB National Advertising Division and IAB standards.", "examples": "WPP, Omnicom, Publicis, Dentsu"}, {"name": "Digital / Social Media Platform", "naics": "519290, 513210", "definition": "Firms that operate networked platforms where users create, share, and consume content.", "operations": "They aggregate user attention and content and monetize primarily through targeted advertising, with strong network effects and near-zero marginal cost; engagement, data, and ad targeting drive value. They now rival broadcasters as primary information distributors.", "regulation": "FTC (privacy, ads), EU DSA (content/transparency), Section 230 debates; self-regulation via community guidelines and content moderation.", "examples": "Meta (Facebook/Instagram), TikTok, X (Twitter), LinkedIn"}, {"name": "Public Relations & Communications Firm", "naics": "541820", "definition": "Firms that manage reputation, messaging, and stakeholder communications for organizations.", "operations": "They craft and place messages, manage media relations and crises, and shape public perception, earning retainer and project fees; relationships, message discipline, and results drive value. They influence the earned-media side of communication.", "regulation": "FTC disclosure rules, lobbying-disclosure law; self-regulation via PRSA code of ethics.", "examples": "Edelman, Weber Shandwick, FleishmanHillard"}, {"name": "Postal Service Operator", "naics": "491110", "definition": "Public or national operators that collect, sort, and deliver mail and parcels universally.", "operations": "They run vast collection, sorting, and delivery networks under a universal-service mandate, funded by postage and parcel revenue; volume, network efficiency, and the shift from letters to parcels drive economics. Scale and ubiquity are the model.", "regulation": "In the US the Postal Regulatory Commission oversees the USPS; internationally the Universal Postal Union coordinates cross-border mail.", "examples": "USPS, Royal Mail, Deutsche Post, Japan Post"}, {"name": "Courier & Express Delivery Company", "naics": "492110", "definition": "Firms that provide time-definite delivery of documents and parcels.", "operations": "They operate integrated air-and-ground logistics networks offering expedited, tracked delivery, earning per-shipment revenue; network density, speed, and reliability drive value, boosted by e-commerce. Hub-and-spoke logistics and technology are core.", "regulation": "DOT/FAA (air operations), customs authorities, FMCSA (trucking); self-regulation via industry logistics standards.", "examples": "FedEx, UPS, DHL, Amazon Logistics"}], "regulators": [{"name": "Federal Communications Commission (FCC)", "jurisdiction": "US", "role": "Licenses spectrum, regulates telecom carriers, broadcasters, and cable, and sets rules on interconnection, universal service, media ownership, and broadcast content — the central US communications regulator."}, {"name": "Federal Trade Commission (FTC)", "jurisdiction": "US", "role": "Polices truth in advertising, deceptive marketing, consumer privacy, and data practices across media and platforms, and reviews media/telecom mergers for competition harm."}, {"name": "International Telecommunication Union (ITU)", "jurisdiction": "Global (UN agency / standards body)", "role": "Allocates the global radio spectrum and satellite orbital slots and sets international telecom standards, coordinating cross-border communications."}, {"name": "Universal Postal Union (UPU)", "jurisdiction": "Global (UN agency)", "role": "Coordinates international mail exchange, sets cross-border postal rules and terminal dues, and standardizes the worldwide postal network."}, {"name": "3GPP / GSMA", "jurisdiction": "Global (standards body / association)", "role": "3GPP develops the mobile network standards (4G/5G); the GSMA represents mobile operators and sets industry practices — self-governance of the mobile ecosystem."}, {"name": "IAB / BBB National Advertising Division (NAD)", "jurisdiction": "US (self-regulatory)", "role": "The IAB sets digital-advertising technical and measurement standards; the NAD adjudicates truth-in-advertising disputes — industry self-regulation of advertising."}, {"name": "Society of Professional Journalists (SPJ) / Press Councils", "jurisdiction": "US/Global (self-regulatory)", "role": "Maintain journalistic codes of ethics and adjudicate press standards, providing the self-regulatory backbone of professional journalism and editorial integrity."}, {"name": "Postal Regulatory Commission (PRC)", "jurisdiction": "US", "role": "Oversees the USPS — reviewing rates, service standards, and the universal-service obligation — providing independent regulation of the national postal operator."}]}, "groundView": {"orgModel": "Structure varies sharply between the infrastructure and content halves of the domain. A telecom carrier is governed by a board and led by a CEO over a CFO, a Chief Technology/Network Officer, a Chief Commercial/Marketing Officer, a Chief Information Officer, and a General Counsel; the core is the Network organization (engineering, operations, and field technicians) alongside commercial (sales, marketing, customer care) and IT. A media, broadcasting, or publishing company is led by a CEO over content/editorial leadership (an editor-in-chief, a chief content officer, or heads of programming/production), a sales/advertising organization, distribution/operations, and business functions; the newsroom or studio is organized under editors or executive producers directing reporters, producers, and technical crews. Advertising and PR agencies organize into account, creative, media, and strategy teams. Across all, the ladder runs from board to executives to directors/managers to professionals (engineers, journalists, producers, creatives) to frontline operational staff (technicians, camera and audio operators, customer-care agents, mail carriers).", "positions": [{"title": "Board of Directors / Chair", "level": "Governance", "reportsTo": "Shareholders", "duties": "Approves corporate strategy, major spectrum/content/M&A investments, and risk and editorial-independence policy, and holds the CEO accountable. Measured on shareholder value and sound governance.", "credentials": "Senior media, telecom, and finance leaders; regulatory and governance expertise.", "socCode": "11-1011"}, {"title": "Chief Executive Officer", "level": "Executive", "reportsTo": "Board of Directors", "duties": "Sets strategy, allocates capital between network/content and growth, and owns total P&L, major partnerships, and regulatory relationships. Measured on revenue, margin, subscriber/audience growth, and market position.", "credentials": "Media/telecom or business background, MBA common, extensive executive experience.", "socCode": "11-1011"}, {"title": "Chief Technology / Network Officer", "level": "Executive", "reportsTo": "CEO", "duties": "Owns network or platform architecture, capital planning, and reliability, directing engineering and buildout (spectrum, fiber, 5G, data centers). Measured on network performance, coverage, uptime, and capex efficiency.", "credentials": "Telecom/EE engineering background, network-operations leadership experience.", "socCode": "11-3021"}, {"title": "Chief Content Officer / Editor-in-Chief", "level": "Executive", "reportsTo": "CEO", "duties": "Owns editorial or programming strategy and standards, commissions and oversees content, and safeguards quality and (in news) independence. Measured on audience, ratings/engagement, awards, and reputation.", "credentials": "Distinguished journalism, production, or programming career; editorial leadership.", "socCode": "11-2032"}, {"title": "Chief Commercial / Advertising Officer", "level": "Executive", "reportsTo": "CEO", "duties": "Owns revenue — subscriptions, advertising sales, and distribution deals — and go-to-market strategy. Measured on revenue, ad yield, subscriber growth, and churn.", "credentials": "Sales/marketing leadership, media or telecom commercial experience.", "socCode": "11-2022"}, {"title": "General Counsel / Regulatory Affairs Head", "level": "Executive", "reportsTo": "CEO", "duties": "Owns legal, licensing, and regulatory strategy (FCC/ITU filings, content law, privacy), and manages disputes and compliance. Measured on regulatory outcomes, license retention, and risk management.", "credentials": "Law degree (JD), communications/media law expertise.", "socCode": "23-1011"}, {"title": "Network Engineering / Operations Manager", "level": "Management", "reportsTo": "CTO / Network Officer", "duties": "Manages the design and operation of network regions or systems, owning performance, capacity, and outage response. Measured on availability, quality metrics, and project delivery.", "credentials": "EE/telecom engineering degree, network certifications, operations experience.", "socCode": "11-9041"}, {"title": "Managing Editor / News Director / Executive Producer", "level": "Management", "reportsTo": "Editor-in-Chief / Chief Content Officer", "duties": "Runs the newsroom or production operation day to day, assigns coverage, manages editors and producers, and owns the publication/broadcast schedule. Measured on output, quality, timeliness, and audience.", "credentials": "Journalism/production degree, senior editorial experience.", "socCode": "27-3041"}, {"title": "Telecommunications / RF Engineer", "level": "Professional", "reportsTo": "Network Engineering Manager", "duties": "Designs and optimizes radio, transport, and core networks, planning cell sites, spectrum use, and capacity, and troubleshooting performance. Measured on coverage, capacity, and quality-of-service metrics.", "credentials": "EE/telecom engineering degree, RF and network design skills, sometimes PE.", "socCode": "17-2072"}, {"title": "Journalist / Reporter", "level": "Professional", "reportsTo": "Editor / News Director", "duties": "Researches, reports, and writes or presents news stories, cultivates sources, and verifies facts under deadline. Measured on story output, accuracy, impact, and audience engagement.", "credentials": "Journalism or related degree, reporting experience, ethics and verification skills.", "socCode": "27-3023"}, {"title": "Producer (TV/Film/Audio)", "level": "Professional", "reportsTo": "Executive Producer / Content Head", "duties": "Plans and manages the production of programs — budgets, scheduling, crews, and content — from concept to delivery. Measured on on-time, on-budget delivery and content quality/ratings.", "credentials": "Media production degree or experience, project-management and creative skills.", "socCode": "27-2012"}, {"title": "Creative Director / Copywriter (Agency)", "level": "Professional", "reportsTo": "Executive Creative Director / Account Lead", "duties": "Conceives and executes advertising campaigns and creative concepts across media. Measured on campaign effectiveness, client satisfaction, and awards.", "credentials": "Design/advertising/communications background, strong portfolio.", "socCode": "27-1011"}, {"title": "Media Planner / Buyer", "level": "Professional", "reportsTo": "Media Director", "duties": "Plans and purchases advertising placements across channels to hit reach and efficiency targets, and optimizes campaigns with data. Measured on campaign ROI, reach, and cost efficiency.", "credentials": "Marketing/advertising degree, analytics and platform (programmatic) skills.", "socCode": "13-1161"}, {"title": "Public Relations Specialist", "level": "Professional", "reportsTo": "PR Manager / Communications Director", "duties": "Writes messaging and press materials, manages media relationships, and coordinates campaigns and crisis response. Measured on earned media, message pickup, and reputation outcomes.", "credentials": "Communications/PR degree, media relations experience, APR certification common.", "socCode": "27-3031"}, {"title": "Broadcast / Studio Engineer", "level": "Operational", "reportsTo": "Chief Engineer / Technical Director", "duties": "Operates and maintains transmission, studio, and control-room equipment, ensuring signal quality and on-air continuity, and troubleshooting technical faults. Measured on on-air uptime, signal quality, and fault resolution.", "credentials": "Broadcast technology/EE training, SBE certification, hands-on RF and A/V skills.", "socCode": "27-4012"}, {"title": "Camera / Audio / Lighting Operator", "level": "Operational", "reportsTo": "Technical Director / Producer", "duties": "Operates cameras, microphones, and lighting to capture and record programming to production standards. Measured on technical quality of captured material and reliability.", "credentials": "Media production training, equipment proficiency, on-set experience.", "socCode": "27-4031"}, {"title": "Network / Field Technician (Telecom Installer)", "level": "Operational", "reportsTo": "Field Operations Supervisor", "duties": "Installs, maintains, and repairs cell sites, fiber, and customer connections, tests circuits, and restores outages in the field. Measured on installs completed, repair time, and service quality.", "credentials": "Telecom/electronics training, fiber and RF certifications, safety (tower-climbing) training.", "socCode": "49-2022"}, {"title": "Customer Care / Call Center Representative", "level": "Operational", "reportsTo": "Customer Service Supervisor", "duties": "Handles customer inquiries, billing, and technical support for connectivity and media services, and retains subscribers. Measured on resolution time, CSAT, and retention.", "credentials": "Entry-level with training; communication and product knowledge.", "socCode": "43-4051"}, {"title": "Mail / Package Sorter & Carrier", "level": "Operational", "reportsTo": "Postal/Logistics Supervisor", "duties": "Sorts, processes, and delivers mail and parcels along routes or in facilities to service standards, scanning and handling items. Measured on delivery accuracy, on-time performance, and volume handled.", "credentials": "Entry-level; postal/logistics training; driving license for carrier routes.", "socCode": "43-5052"}, {"title": "Broadcast Technician / Master Control Operator", "level": "Operational", "reportsTo": "Broadcast Operations Manager", "duties": "Monitors and switches on-air feeds, inserts programming and ads, and ensures continuous compliant transmission from master control. Measured on error-free playout and compliance.", "credentials": "Broadcast technology training, automation-system proficiency.", "socCode": "27-4012"}]}}, {"id": "education", "name": "Education", "icon": "🎓", "tagline": "The deliberate transmission and certification of human knowledge, skill, and capability across generations.", "view100k": {"role": "Education is civilization's mechanism for compounding human capital: it takes the accumulated knowledge of prior generations and installs it, at scale, into new minds, converting raw demographic growth into productive capacity. Economists from Adam Smith to Gary Becker and Theodore Schultz have treated schooling as investment rather than consumption — each additional year of education is associated with roughly 8-10% higher individual earnings globally, and cross-country growth accounting consistently attributes a large share of long-run GDP differences to differences in cognitive skill and educational attainment. The domain spans early childhood care and pre-primary programs, K-12 primary and secondary schooling, tertiary education (universities, community colleges, polytechnics), vocational and apprenticeship systems, corporate learning and development, testing and credentialing, and the educational technology and publishing industries that supply all of them.\n\nThe global scale is enormous: worldwide spending on education runs on the order of $5-6 trillion annually (roughly 4-5% of world GDP, with public sources supplying about four-fifths of it), serving approximately 1.5 billion enrolled learners and employing on the order of 85-100 million teachers and education workers — teaching is among the largest single occupational categories on Earth. In the United States alone, education is a ~$1.5 trillion enterprise: roughly $800+ billion in public K-12 spending across ~13,000 school districts, ~$700 billion in higher education revenues across ~4,000 degree-granting institutions, plus a corporate training market exceeding $100 billion and a global edtech sector valued in the hundreds of billions. Education employs about 9-10% of the entire U.S. workforce when public and private institutions are combined.\n\nThe historical arc runs from apprenticeship and religious instruction (temple schools of Sumer, the madrasa, the cathedral school), through the medieval university (Bologna 1088, Oxford, al-Qarawiyyin), to the Prussian model of compulsory state schooling in the 18th-19th centuries that most nations subsequently copied, the Morrill Land-Grant Acts (1862, 1890) that democratized American higher education, the GI Bill (1944) that massified it, and the post-1990 digital turn — MOOCs, learning management systems, adaptive learning, and now AI tutoring — which is unbundling instruction, content, and credentialing into separately traded services. The persistent structural tension of the domain is that education is simultaneously a public good (funded and mandated by the state), a private investment (households and employers pay for positional advantage), and a certification cartel (degrees function as labor-market signals), and every reform fight — vouchers, accreditation, student debt, standardized testing — is ultimately a fight over which of those three logics should dominate.", "interdependencies": "Education is the upstream supplier of skilled labor to every other domain — it trains the engineers for Energy, Infrastructure, and Industry; the physicians and nurses for Medicine; the analysts for Finance, Intelligence, and Defense; the agronomists for Agriculture; and the researchers who populate Science, whose discoveries flow back into curricula on a decades-long loop. It depends on Finance for student lending, endowment management, and municipal bond markets that fund school construction; on Governance and Law for compulsory-attendance statutes, funding formulas, accreditation authority, and civil-rights enforcement; on Population dynamics, since enrollment is a direct function of birth cohorts and migration; on Technology and Communication for learning platforms, connectivity, and the distribution of instruction; on Infrastructure and Energy to physically operate millions of campuses; on Economy and Trade, which set the labor-market demand signals that determine what is worth teaching; on Culture and Religion, which historically founded most schools and still contest curricular content; on Medicine for school health services and the pediatric research underpinning child development practice; and on Environment, as campuses become laboratories for sustainability and climate literacy enters the canon.", "regulationModel": "Education is governed by a layered, decentralized regime. In the U.S., authority is constitutionally reserved to the states: state legislatures and boards of education set standards, licensure, and funding formulas; ~13,000 local school boards exercise operational control; and the federal Department of Education conditions money (Title I, IDEA, Title IX enforcement, federal student aid under Title IV of the Higher Education Act) on compliance rather than commanding directly. Higher education is disciplined through a triad: state authorization, federal aid eligibility, and private accreditation by bodies recognized by the U.S. Secretary of Education (institutional accreditors such as HLC, MSCHE, SACSCOC, NECHE, WSCUC; programmatic accreditors such as ABET for engineering, AACSB for business, LCME for medical schools, ABA for law, CAEP for teacher preparation). Internationally, UNESCO sets normative frameworks (SDG 4, the International Standard Classification of Education), the OECD benchmarks systems via PISA, and ministries of education regulate directly in most countries. Self-regulation runs through faculty governance, teacher unions (NEA, AFT), testing bodies (College Board, ETS), and professional associations, while market discipline operates through enrollment choice, rankings, and employer acceptance of credentials."}, "view10k": {"overview": "In NAICS 2022, the domain centers on Sector 61 (Educational Services), which spans elementary and secondary schools (6111), junior colleges (6112), colleges and universities (6113), business/computer/management training (6114), technical and trade schools (6115), other schools and instruction (6116), and educational support services (6117); adjacent activity sits in 5112/5138 (educational software and platforms), 51913 (internet publishing of courseware under the 2022 revision), 513120 (textbook publishing), and 624410 (child care). Organizationally the domain divides into public-sector systems (school districts, state university systems — the dominant form by enrollment), private nonprofits (independent schools, most selective universities, accreditors, testing bodies), and for-profit firms (edtech, publishers, tutoring chains, proprietary colleges, corporate training vendors), each with distinct funding logic: tax appropriation, tuition-plus-endowment philanthropy, and earned revenue respectively.", "businessTypes": [{"name": "Public School District (K-12)", "naics": "611110", "definition": "A local governmental entity operating tax-funded elementary and secondary schools providing free, compulsory education within a defined geography.", "operations": "Funded by a blend of local property taxes, state formula aid, and federal categorical grants (Title I, IDEA); governed by an elected board that hires a superintendent to run schools, transportation, food service, and special education. Core processes are enrollment and attendance management, curriculum delivery against state standards, assessment administration, and collective-bargaining-governed staffing. Budgets are approved publicly and audited; per-pupil spending averages roughly $15,000-$18,000 in the U.S.", "regulation": "Regulated by state departments of education (standards, teacher licensure, accountability under ESSA) and federal civil-rights law (OCR, IDEA); self-governance through elected school boards and voluntary regional accreditation (e.g., Cognia).", "examples": "New York City Public Schools, Los Angeles Unified School District, Chicago Public Schools, Fairfax County Public Schools"}, {"name": "Private / Independent School", "naics": "611110", "definition": "A nonpublic elementary or secondary school funded by tuition, endowment, and philanthropy rather than tax appropriation, including independent, parochial, and charter-adjacent models.", "operations": "Revenue from tuition (often $20,000-$60,000+ at elite day and boarding schools), annual giving, and endowment draw; operations center on admissions and financial aid, small-cohort instruction, and advancement (fundraising). Governed by a self-perpetuating board of trustees that hires a head of school.", "regulation": "Lightly regulated by states (health, safety, attendance recognition); primary discipline is voluntary accreditation via NAIS-affiliated regional bodies (e.g., NEASC, ISACS) and, for religious schools, diocesan or denominational oversight.", "examples": "Phillips Exeter Academy, Sidwell Friends School, the Archdiocese of New York Catholic school system, Harvard-Westlake"}, {"name": "Public Research University / State University System", "naics": "611310", "definition": "A state-chartered degree-granting institution combining undergraduate and graduate instruction with sponsored research and public service, often organized into multi-campus systems.", "operations": "Funded by state appropriations, tuition, federal research grants (NIH, NSF, DOE, DOD), hospital revenues, and endowments; core processes are enrollment management, credit-hour instruction, sponsored-research administration (with negotiated indirect-cost rates), technology transfer, and auxiliary enterprises (housing, athletics). Flagship budgets commonly exceed $5-10 billion including academic medical centers.", "regulation": "Regulated by state higher-education boards, the U.S. Department of Education (Title IV aid, Clery Act, Title IX), and research sponsors (OMB Uniform Guidance, IRB/IACUC rules); self-regulated through institutional accreditors (HLC, SACSCOC), programmatic accreditors (ABET, AACSB, LCME), faculty senates, and the NCAA for athletics.", "examples": "University of California system, University of Michigan, University of Texas at Austin, Ohio State University"}, {"name": "Private Nonprofit College / University", "naics": "611310", "definition": "An independent, tax-exempt degree-granting institution governed by trustees, ranging from small liberal-arts colleges to global research universities.", "operations": "Revenue mix of net tuition, endowment payout (elite endowments exceed $10-50 billion), sponsored research, and gifts; operations emphasize selective admissions, faculty-governed curriculum, development offices, and endowment management through investment offices. Discount rates on sticker tuition now average near 50% among privates.", "regulation": "U.S. Department of Education (Title IV), state authorization, IRS 501(c)(3) rules; self-regulation via regional/institutional accreditors (MSCHE, NECHE), AAUP norms on tenure and academic freedom, and NACUBO financial standards.", "examples": "Yale University, Stanford University, Williams College, University of Notre Dame"}, {"name": "Community College", "naics": "611210", "definition": "A public two-year institution granting associate degrees and certificates, providing open-access academic transfer, workforce training, and adult education.", "operations": "Funded by state and local appropriations plus low tuition (~$4,000/yr average); operations revolve around open enrollment, developmental education, articulation agreements with four-year universities, dual enrollment with high schools, and employer-aligned workforce programs (nursing, welding, IT). Enrollment is countercyclical, rising in recessions.", "regulation": "State community-college boards and coordinating commissions; accredited by institutional accreditors (e.g., ACCJC, HLC); programmatic accreditation for health programs (ACEN for nursing); represented by AACC.", "examples": "Miami Dade College, Northern Virginia Community College, Maricopa County Community College District, Valencia College"}, {"name": "Vocational / Technical & Trade School", "naics": "611510, 611513", "definition": "An institution delivering hands-on occupational training and apprenticeship instruction leading to industry certifications and licensure in skilled trades.", "operations": "Funded by tuition, Workforce Innovation and Opportunity Act (WIOA) dollars, Perkins V federal CTE grants, and employer/union sponsorship; day-to-day operations pair classroom theory with shop-floor practicum, tracked to certification exams (ASE, AWS welding, FAA airframe, cosmetology boards). Registered apprenticeships blend paid on-the-job training with related instruction.", "regulation": "State licensing boards for proprietary schools, U.S. DOL Office of Apprenticeship for registered programs; accreditation by ACCSC or COE; industry bodies (NCCER, AWS) certify curricula.", "examples": "Lincoln Tech, Universal Technical Institute, IBEW/NECA electrical apprenticeship programs, Tulsa Welding School"}, {"name": "For-Profit (Proprietary) College", "naics": "611310, 611210", "definition": "An investor-owned degree-granting institution operating education as a commercial enterprise, typically serving working adults through career-oriented and online programs.", "operations": "Revenue overwhelmingly from tuition financed by federal Title IV aid (capped by the 90/10 rule); operations are marketing- and enrollment-driven, with centralized curriculum, high adjunct ratios, and online delivery at scale. Margins depend on retention and regulatory standing.", "regulation": "Intensively regulated by the Department of Education (gainful employment, borrower defense, 90/10), state authorization boards, and the FTC on advertising; accredited by institutional accreditors such as DEAC or HLC — loss of accreditation is existential (cf. ITT Tech, Corinthian collapses).", "examples": "University of Phoenix, DeVry University, Grand Canyon Education (service arm), Strayer/Capella (Strategic Education Inc.)"}, {"name": "Educational Technology (EdTech) Company", "naics": "513210, 611710", "definition": "A software firm building learning platforms, courseware, assessment engines, and administrative systems sold to institutions, employers, and consumers.", "operations": "SaaS subscription and licensing revenue from LMS platforms, adaptive-learning engines, MOOC marketplaces, and student information systems; consumer models monetize via subscriptions and freemium tutoring. Core processes are product development, learning-science R&D, institutional sales cycles, and data analytics on learner outcomes.", "regulation": "Regulated as data handlers under FERPA, COPPA, and state student-privacy laws (SOPIPA); self-regulation through interoperability standards bodies (1EdTech/IMS Global — LTI, Caliper standards) and the Student Privacy Pledge.", "examples": "Instructure (Canvas), Coursera, Duolingo, PowerSchool"}, {"name": "Educational Publisher & Courseware Provider", "naics": "513120, 513210", "definition": "A firm creating, licensing, and distributing textbooks, digital courseware, and curriculum materials for K-12 and higher education.", "operations": "Revenue from adoption-cycle sales to districts (state textbook adoptions in TX, CA, FL drive the K-12 market), inclusive-access digital subscriptions in higher ed, and platform licensing; core processes are content development against state standards, efficacy research, and sales through adoption committees.", "regulation": "Subject to state textbook-adoption review boards and accessibility law (Section 508, ADA); self-regulates through industry associations (Association of American Publishers) and standards alignment certifications (EdReports reviews).", "examples": "Pearson, McGraw Hill, Houghton Mifflin Harcourt, Savvas Learning"}, {"name": "Testing, Assessment & Credentialing Organization", "naics": "611710, 813920", "definition": "An organization that designs, administers, and scores standardized examinations and issues credentials that gate admission, licensure, and employment.", "operations": "Revenue from test fees (SAT, GRE, TOEFL, AP), state assessment contracts, and licensure-exam administration for professional boards; operations center on psychometrics (item development, equating, validity studies), secure test delivery through proctored centers and online proctoring, and score reporting. Mostly organized as nonprofits with substantial reserves.", "regulation": "Governed by contract with states and licensing boards, testing-standards frameworks (AERA/APA/NCME Standards for Educational and Psychological Testing), and disability-access law; self-regulation via the Association of Test Publishers and internal technical advisory committees.", "examples": "College Board, ETS, ACT Inc., Pearson VUE"}, {"name": "Corporate Training & Professional Development Firm", "naics": "611430", "definition": "A provider of management, professional, and technical training delivered to employers and working professionals, from leadership development to compliance and technical upskilling.", "operations": "B2B revenue via enterprise contracts, per-seat licenses, and executive-education programs; delivery blends instructor-led workshops, e-learning libraries, cohort programs, and coaching. Corporate L&D spending exceeds $350 billion globally; buyers measure via completion, skill assessment, and business KPIs.", "regulation": "Largely market-disciplined; certifying arms follow ANSI/ANAB ISO/IEC 17024 personnel-certification accreditation; industry self-regulation via ATD (Association for Talent Development) competency models and SHRM/PMI/CompTIA certification governance.", "examples": "LinkedIn Learning, Skillsoft, Franklin Covey, Harvard Business School Executive Education"}, {"name": "Early Childhood Education & Child Care Provider", "naics": "624410, 611110", "definition": "An organization providing developmental care and pre-primary education for children from infancy to kindergarten entry, spanning center chains, Head Start grantees, and family child care.", "operations": "Funded by parent fees, employer subsidies, state pre-K appropriations, CCDF vouchers, and federal Head Start grants; operations are staffing-intensive (mandated child-staff ratios of roughly 4:1 for infants), organized around licensed classrooms, developmental curricula, and family engagement.", "regulation": "Licensed by state child-care agencies (health, safety, ratios, background checks); Head Start regulated by HHS Administration for Children and Families performance standards; voluntary quality accreditation by NAEYC and state QRIS rating systems.", "examples": "KinderCare Learning Companies, Bright Horizons, Head Start grantee agencies, Primrose Schools"}, {"name": "Tutoring, Test Prep & Supplemental Education", "naics": "611691, 611699", "definition": "Businesses delivering individualized or small-group academic support, exam preparation, and enrichment outside formal schooling.", "operations": "Consumer-pay hourly and package revenue, plus district contracts for high-dosage tutoring (expanded post-pandemic via ESSER funds); operations match tutors to students through centers, in-home, or online marketplaces, with diagnostics and progress tracking as core processes.", "regulation": "Minimal direct regulation beyond consumer-protection and child-safety law; self-regulation through associations like the National Tutoring Association and district vendor-approval standards.", "examples": "Kumon, Kaplan, Sylvan Learning, Varsity Tutors"}, {"name": "Accreditation & Quality Assurance Body", "naics": "813920, 611710", "definition": "A nongovernmental membership organization that evaluates institutions and programs against published standards and confers the accredited status on which federal aid eligibility and professional licensure depend.", "operations": "Funded by member dues, evaluation fees, and annual sustaining fees; operations run on peer review — trained volunteer evaluators conduct self-study reviews and site visits, with commissions voting accreditation actions on multi-year cycles. It is the paradigmatic self-regulatory business model in education.", "regulation": "Recognized and periodically reviewed by the U.S. Department of Education (NACIQI process) and/or CHEA; governed by their own commissions of member institutions and public members.", "examples": "Higher Learning Commission (HLC), ABET, LCME, Cognia"}], "regulators": [{"name": "U.S. Department of Education (ED)", "jurisdiction": "US (federal)", "role": "Administers federal student aid (Title IV), enforces civil-rights law through the Office for Civil Rights (Title VI, Title IX, Section 504), conditions K-12 funding under ESSA, recognizes accreditors via NACIQI, and polices institutional eligibility (gainful employment, borrower defense)."}, {"name": "State Departments / Boards of Education & Higher Education Coordinating Boards", "jurisdiction": "US (state)", "role": "Hold plenary constitutional authority over schooling: set learning standards, license teachers, charter schools and authorize degree-granting, apportion funding formulas, and run accountability and assessment systems."}, {"name": "UNESCO", "jurisdiction": "Global", "role": "Sets international normative frameworks (Education 2030 / SDG 4), maintains the ISCED classification of education levels, coordinates cross-border recognition conventions, and monitors global education data through the UNESCO Institute for Statistics."}, {"name": "Council for Higher Education Accreditation (CHEA)", "jurisdiction": "US (self-regulatory)", "role": "The national coordinating body and recognizer of institutional and programmatic accreditors; the apex of higher education's peer-review self-regulation system alongside ED recognition."}, {"name": "ABET", "jurisdiction": "US/Global (programmatic accreditor)", "role": "Accredits ~4,700 engineering, computing, and applied-science programs worldwide against outcomes-based criteria; ABET accreditation gates eligibility for the FE/PE engineering licensure pathway."}, {"name": "State Professional Standards Boards / Teacher Licensure Boards", "jurisdiction": "US (state)", "role": "License and discipline teachers and administrators, approve educator-preparation programs (often referencing CAEP accreditation), and enforce codes of professional conduct."}, {"name": "Office of Head Start, HHS Administration for Children and Families", "jurisdiction": "US (federal)", "role": "Funds and regulates Head Start/Early Head Start grantees through detailed Program Performance Standards, monitoring reviews, and recompetition of underperforming grantees; state child-care licensing agencies regulate the broader ECE market."}, {"name": "1EdTech Consortium (formerly IMS Global) and the Association of Test Publishers", "jurisdiction": "Global (industry associations)", "role": "Set interoperability standards (LTI, QTI, Caliper) for edtech products and professional/technical norms for test development and delivery — industry self-regulation of the domain's technology and assessment layers."}]}, "groundView": {"orgModel": "The archetypal education organization is a mission-governed hierarchy with dual authority lines. At the top sits a lay governing board (elected school board, board of trustees, or board of regents) that owns fiduciary duty, hires the chief executive (superintendent, president, or head of school), and approves budget and policy. The executive tier — provost/chief academic officer, CFO/CBO, and vice presidents or assistant superintendents for enrollment, student affairs, advancement, HR, and operations — manages the administrative line. Parallel to it runs the academic line: deans over colleges or principals over schools, department chairs, and faculty/teachers, whose authority over curriculum, standards, and evaluation is formalized in faculty senates and, in K-12, collective bargaining agreements. Beneath instruction sits a large operational base — counselors, registrars, financial-aid officers, IT, facilities, food service, and transportation. Public systems add a political layer (state boards, legislatures); nonprofits add development and endowment functions; edtech firms follow conventional corporate structure but embed learning scientists and instructional designers in product teams.", "positions": [{"title": "Trustee / School Board Member", "level": "Governance", "reportsTo": "The electorate or the board itself (self-perpetuating boards); no operational superior", "duties": "Sets institutional mission and policy, hires and evaluates the superintendent or president, approves budgets, tuition, and labor agreements, and holds fiduciary and duty-of-care responsibility. Measured by institutional financial health, accreditation standing, and (in K-12) student-outcome accountability and re-election.", "credentials": "No formal requirement; typically community, business, or academic leaders; board-governance training (NSBA, AGB) common.", "socCode": "11-1011"}, {"title": "Superintendent of Schools", "level": "Executive", "reportsTo": "Board of Education", "duties": "Chief executive of a school district: proposes and executes the budget, appoints principals and cabinet, negotiates with unions, implements state accountability mandates, and answers publicly for enrollment, safety, and achievement data. Measured by graduation rates, assessment results, fiscal audits, and board confidence.", "credentials": "Master's or doctorate in educational leadership (Ed.D./Ph.D. common); state superintendent license/administrative certificate; prior principalship typical.", "socCode": "11-9032"}, {"title": "University President / Chancellor", "level": "Executive", "reportsTo": "Board of Trustees / Board of Regents", "duties": "Leads institutional strategy, fundraising campaigns, government and community relations, and crisis response; appoints the provost and vice presidents. Measured by enrollment, endowment growth, research standing, rankings, and campus stability.", "credentials": "Ph.D. or terminal degree with a distinguished academic record typical; increasingly recruited from provost ranks; some from law, government, or business.", "socCode": "11-9033"}, {"title": "Provost / Chief Academic Officer", "level": "Executive", "reportsTo": "President / Chancellor", "duties": "Owns the academic enterprise: faculty hiring, promotion and tenure, academic program approval and closure, accreditation compliance, and allocation of instructional budget across deans. Measured by academic program quality, faculty recruitment and retention, and accreditation outcomes.", "credentials": "Ph.D. with tenure and a record as dean or department chair; deep familiarity with faculty governance.", "socCode": "11-9033"}, {"title": "Chief Financial Officer / Chief Business Officer", "level": "Executive", "reportsTo": "President or Superintendent", "duties": "Manages budgeting, treasury, debt issuance (municipal bonds for districts, tax-exempt bonds for universities), financial reporting under GASB/FASB, procurement, and auxiliary enterprises. Measured by clean audits, bond ratings, and structural budget balance.", "credentials": "MBA or M.Acc; CPA common; NACUBO or ASBO (SFO certification) credentials in the sector.", "socCode": "11-3031"}, {"title": "Dean (College/School)", "level": "Management", "reportsTo": "Provost", "duties": "Leads an academic college: recruits and reviews department chairs and faculty, manages the college budget, drives fundraising for the unit, and answers for enrollment, research output, and programmatic accreditation (e.g., AACSB, ABET). Measured by rankings, sponsored-research volume, and faculty productivity.", "credentials": "Ph.D. and tenured full professorship in a relevant discipline; prior chair or associate-dean service.", "socCode": "11-9033"}, {"title": "School Principal", "level": "Management", "reportsTo": "Superintendent (or area/assistant superintendent)", "duties": "Runs a school building: hires and evaluates teachers, manages the master schedule, enforces discipline and safety, leads instructional improvement, and engages parents. Measured by school accountability grades, attendance, climate surveys, and teacher retention.", "credentials": "Master's in educational leadership; state principal/administrator license; teaching experience required.", "socCode": "11-9032"}, {"title": "Academic Department Chair", "level": "Management", "reportsTo": "Dean (higher ed) or Principal (K-12)", "duties": "First-line academic manager: builds course schedules, assigns teaching loads, mentors junior faculty, shepherds curriculum proposals, and manages the department budget while usually continuing to teach. Measured by course coverage, program review outcomes, and departmental collegiality.", "credentials": "Ph.D. and tenure in higher ed; in K-12, senior licensed teacher with leadership endorsement.", "socCode": "25-1099"}, {"title": "Professor (Tenure-Track Faculty)", "level": "Professional", "reportsTo": "Department Chair", "duties": "Teaches courses, conducts and publishes original research, wins external grants, advises graduate students, and performs service on faculty committees. Measured through the tenure-and-promotion triad of research, teaching, and service — publications, citations, grant dollars, and teaching evaluations.", "credentials": "Ph.D. or terminal degree in field; postdoctoral experience common in the sciences.", "socCode": "25-1099"}, {"title": "K-12 Classroom Teacher (Secondary)", "level": "Professional", "reportsTo": "Principal (via department chair)", "duties": "Plans and delivers standards-aligned instruction to ~100-150 students daily, assesses and grades student work, differentiates for IEPs and English learners, manages classroom behavior, and communicates with families. Measured by observation rubrics (e.g., Danielson Framework), student growth data, and licensure renewal requirements.", "credentials": "Bachelor's degree plus state teaching license (subject-area endorsement); Praxis or state exams; master's degree common; National Board Certification (NBPTS) as advanced credential.", "socCode": "25-2031"}, {"title": "Special Education Teacher", "level": "Professional", "reportsTo": "Principal / Director of Special Education", "duties": "Designs and delivers specially designed instruction for students with disabilities, writes and manages legally binding IEPs under IDEA, coordinates related services, and documents progress for compliance. Measured by IEP goal attainment, compliance timelines, and inclusion quality.", "credentials": "Bachelor's/master's in special education; state special-education licensure; knowledge of IDEA procedural law.", "socCode": "25-2058"}, {"title": "Instructional Designer / Learning Experience Designer", "level": "Professional", "reportsTo": "Director of Teaching & Learning / Product Manager (edtech)", "duties": "Translates subject matter into structured learning experiences: writes objectives, storyboards courses, builds assessments, and applies learning science (ADDIE, backward design) in LMS platforms. Measured by course completion, learner outcomes, and stakeholder satisfaction.", "credentials": "Master's in instructional design/learning sciences common; portfolio in Articulate/Canvas/Moodle; ATD or Quality Matters certifications.", "socCode": "25-9031"}, {"title": "School Counselor", "level": "Professional", "reportsTo": "Principal", "duties": "Provides academic scheduling, college and career advising, and social-emotional support to caseloads that often approach the 385:1 national average against the recommended 250:1; runs crisis response and mandated reporting. Measured by postsecondary placement, FAFSA completion, and caseload service metrics.", "credentials": "Master's in school counseling; state pupil-personnel/counselor license; ASCA framework fluency.", "socCode": "21-1012"}, {"title": "Registrar", "level": "Professional", "reportsTo": "Provost or VP of Enrollment Management", "duties": "Owns the academic record: course registration, transcripts, degree audits, FERPA compliance, catalog and classroom scheduling, and enrollment reporting to the National Student Clearinghouse and IPEDS. Measured by data integrity, audit findings, and registration cycle smoothness.", "credentials": "Bachelor's/master's; AACRAO professional development; deep student-information-system expertise.", "socCode": "11-9033"}, {"title": "Financial Aid Officer", "level": "Professional", "reportsTo": "Director of Financial Aid / VP Enrollment", "duties": "Packages federal, state, and institutional aid, verifies FAFSA data, exercises professional judgment on appeals, and keeps the institution compliant with Title IV rules where errors trigger repayment liabilities. Measured by processing accuracy, audit/program-review findings, and yield support.", "credentials": "Bachelor's degree; NASFAA credentials; mastery of federal aid regulations.", "socCode": "13-2071"}, {"title": "Admissions Counselor / Enrollment Officer", "level": "Operational", "reportsTo": "Director of Admissions", "duties": "Recruits within an assigned territory: school visits, application reading against rubric, applicant interviews, and yield events. Measured by funnel metrics — inquiries, applications, admits, and enrolled students against territory targets.", "credentials": "Bachelor's degree; NACAC ethics training; CRM (Slate) proficiency.", "socCode": "13-1071"}, {"title": "Paraprofessional / Teacher Aide", "level": "Operational", "reportsTo": "Classroom Teacher / Principal", "duties": "Provides one-on-one and small-group instructional support, assists students with disabilities with academic and personal care needs, supervises transitions and lunch, and reinforces behavior plans. Measured by student support quality and attendance reliability.", "credentials": "High school diploma plus 48 college credits or paraprofessional assessment (ESSA requirement for Title I roles).", "socCode": "25-9042"}, {"title": "Early Childhood Educator / Preschool Teacher", "level": "Operational", "reportsTo": "Center Director", "duties": "Delivers play-based developmental curriculum to children ages 0-5, maintains required ratios and safety documentation, conducts developmental screenings, and communicates daily with families. Measured by CLASS observation scores, licensing compliance, and family retention.", "credentials": "CDA (Child Development Associate) credential minimum; associate or bachelor's in early childhood education for lead roles; state licensing background checks.", "socCode": "25-2011"}, {"title": "Proctor / Test Center Administrator", "level": "Operational", "reportsTo": "Test Center Manager / Assessment Director", "duties": "Verifies examinee identity, enforces test security protocols, administers timed standardized examinations, documents irregularities, and safeguards secure materials. Measured by security incident rates and administration fidelity.", "credentials": "High school diploma/bachelor's; certification by the testing vendor (Pearson VUE, Prometric, College Board training).", "socCode": "25-9099"}, {"title": "School Bus Driver", "level": "Operational", "reportsTo": "Transportation Director", "duties": "Safely transports students on fixed daily routes, conducts pre-trip vehicle inspections, manages onboard student behavior, and executes emergency evacuation procedures. Measured by safety record, on-time performance, and inspection compliance.", "credentials": "Commercial Driver's License (CDL Class B) with passenger (P) and school bus (S) endorsements; DOT physical; background checks.", "socCode": "53-3051"}]}}, {"id": "medicine", "name": "Medicine / Health", "icon": "🏥", "tagline": "The organized preservation, restoration, and financing of human health across the life span.", "view100k": {"role": "Medicine is civilization's system for keeping its population alive, functional, and productive — the domain that converts biological knowledge into clinical care and finances the enormous cost of doing so. It exists because illness, injury, and mortality are universal and because the information asymmetry between patient and clinician, combined with the catastrophic and unpredictable cost of serious illness, makes health both a moral imperative and a market that cannot function like ordinary commerce. The domain integrates care delivery (hospitals, clinics, physician practices, long-term and home care), the life-sciences supply chain (pharmaceuticals, biotechnology, medical devices, diagnostics), the financing layer (insurers, government payers, pharmacy benefit managers), and the public-health apparatus that protects populations rather than individuals.\n\nGlobal health spending is roughly $9-10 trillion per year, close to 10% of world GDP, and the health-and-social-care workforce exceeds 65-70 million people worldwide, making it one of the largest employment domains on the planet. The United States is the extreme case: health expenditure runs about $4.9 trillion, roughly 17-18% of GDP — over $14,000 per person — split among hospital care (~31%), physician and clinical services (~20%), and prescription drugs (~9%), with the sector employing more than 22 million people (about one in eight American workers) and hospitals alone employing over 6 million. Globally the pharmaceutical market exceeds $1.6 trillion and the medical-device market approaches $600 billion.\n\nThe historical arc runs from temple medicine and the Hippocratic tradition, through the germ theory revolution of Pasteur and Koch, the professionalization catalyzed by the 1910 Flexner Report (which closed weak U.S. medical schools and made university-based scientific training the norm), the antibiotic and vaccine era, the mid-20th-century rise of third-party insurance (employer-based coverage in the U.S., Bismarckian and Beveridge systems in Europe), the 1965 creation of Medicare and Medicaid, and the genomic and biologic revolution of the 21st century. The defining tension of the domain is the impossible triangle of access, cost, and quality: every health system on Earth is a different political answer to how to ration finite care against effectively infinite demand, and the U.S. hybrid of private delivery with fragmented public-private financing sits at one extreme of high spending and uneven access.", "interdependencies": "Medicine draws its foundational knowledge from Science (biomedical research, chemistry, genomics) and its practitioners from Education (medical schools, nursing programs, residency training). It depends on Finance and the Economy for insurance markets, capital for hospital construction, and the venture and public-equity funding of biotech; on Industry and Technology for drug manufacturing, medical devices, imaging, and health IT; on Trade for global pharmaceutical and device supply chains; on Agriculture and Environment for nutrition, food safety, clean water, and the environmental determinants of disease; on Infrastructure and Energy to run always-on hospitals; on Communication for telehealth and health information exchange; on Governance and Law for licensure, drug approval, malpractice liability, and the vast public financing of care; on Population, since demographics (aging, birth rates) drive demand and epidemiology defines need; on Defense, through military and veterans' health systems and biodefense; on Intelligence for disease surveillance and biosecurity; and on Culture and Religion, which shape health behavior, bioethics, and end-of-life practice.", "regulationModel": "Health is among the most heavily regulated of all domains, governed through overlapping public, professional, and accreditation authorities. In the U.S., the FDA approves drugs, biologics, and devices and polices manufacturing and marketing; CMS runs Medicare and Medicaid, sets the reimbursement rates that anchor the entire payment system, and enforces the Conditions of Participation that hospitals must meet; the DEA controls scheduled substances; HHS agencies (CDC, NIH, HRSA, SAMHSA) handle surveillance, research funding, and safety-net programs; and OSHA and state health departments regulate workplace and facility safety. Practitioners are licensed by state medical, nursing, and pharmacy boards and certified by private specialty boards (ABMS member boards). Facilities pursue voluntary accreditation — chiefly by The Joint Commission — because it confers deemed status for Medicare participation. Insurers are regulated by state insurance commissioners and the ACA marketplace rules. Internationally, the WHO sets norms and coordinates emergency response, the International Council for Harmonisation (ICH) harmonizes drug-approval standards, and bodies like the EMA regulate regionally. Self-regulation runs through the AMA and specialty societies' clinical guidelines, medical ethics codes, and peer review."}, "view10k": {"overview": "In NAICS 2022, care delivery sits in Sector 62 (Health Care and Social Assistance): ambulatory care (621 — physician offices 6211, dental 6212, outpatient centers 6214, home health 6216, medical labs 6215), hospitals (622 — general medical/surgical 62211, psychiatric 62221, specialty 62231), and nursing and residential care (623). The life-sciences supply side sits in manufacturing Sector 32-33: pharmaceutical and medicine manufacturing (3254), medical device and supply manufacturing (3391), and electromedical apparatus (334510). Financing sits in Sector 52 (direct health and medical insurance carriers, 524114) and management/administration (PBMs, 524292; 621491 HMO medical centers). The domain divides organizationally into nonprofit systems (the majority of U.S. hospital beds), for-profit chains, government providers (VA, military, county public hospitals, NIH), publicly traded pharma/device/insurer corporations, and independent professional practices.", "businessTypes": [{"name": "General Acute-Care Hospital / Health System", "naics": "622110", "definition": "An institution providing inpatient and emergency medical and surgical care, increasingly organized into multi-hospital integrated delivery systems with employed physicians and outpatient networks.", "operations": "Revenue from negotiated commercial insurance rates, Medicare DRG and Medicaid payments, and self-pay; the business runs on bed occupancy, surgical volume, and payer mix, with fixed high-cost capacity (EDs, ORs, ICUs) and thin operating margins (often 1-4%). EMTALA mandates emergency stabilization regardless of ability to pay. Nonprofits justify tax exemption through community benefit.", "regulation": "CMS Conditions of Participation, state licensure and certificate-of-need laws, EMTALA, HIPAA; accredited primarily by The Joint Commission or DNV, conferring Medicare deemed status; medical staff self-governs credentialing and peer review.", "examples": "HCA Healthcare, Kaiser Permanente, Mayo Clinic, Cleveland Clinic"}, {"name": "Physician Practice / Medical Group", "naics": "621111", "definition": "A practice of physicians delivering outpatient diagnostic and treatment services, ranging from solo practices to large multispecialty groups, independently owned or employed by health systems.", "operations": "Fee-for-service billing per CPT/E&M codes plus growing value-based and capitation contracts; core processes are scheduling, clinical documentation, coding, and revenue-cycle management against payer denials. Increasing consolidation into system-owned and private-equity-backed groups.", "regulation": "State medical boards license physicians; CMS and commercial payers set billing rules; Stark Law and Anti-Kickback Statute govern referrals; specialty boards (ABMS) certify; self-regulation via AMA ethics and specialty-society guidelines.", "examples": "Permanente Medical Groups, US Oncology Network, Privia Health, independent private practices"}, {"name": "Pharmaceutical Manufacturer", "naics": "325412", "definition": "A company that discovers, develops, manufactures, and markets prescription and over-the-counter drugs, including small-molecule and biologic therapies.", "operations": "Revenue from patented branded drugs during exclusivity, funding a high-risk R&D pipeline (10-15 years and $1-2B+ per approved drug) through preclinical, Phase I-III trials, and FDA New Drug/Biologics License Applications; margins fall sharply at patent cliff when generics enter. Manufacturing follows current Good Manufacturing Practice (cGMP).", "regulation": "FDA regulates approval, manufacturing (cGMP), labeling, and pharmacovigilance; DEA controls scheduled drugs; FTC and DOJ police pricing and marketing; ICH harmonizes globally; self-regulation via PhRMA marketing codes.", "examples": "Pfizer, Johnson & Johnson, Merck, Roche"}, {"name": "Biotechnology Company", "naics": "325414, 541714", "definition": "A firm applying molecular biology, genomics, and cell/gene technology to develop novel biologic therapeutics, diagnostics, and platforms, often pre-revenue and research-stage.", "operations": "Funded by venture capital, public equity, and pharma partnerships/milestone payments rather than product revenue in early stages; the model is to advance a lead candidate through clinical trials toward approval or acquisition. Cash runway and clinical-trial readouts drive valuation.", "regulation": "FDA (CBER for biologics, cell and gene therapy), NIH/OBA and IRBs for research oversight, and cGMP for manufacturing; self-regulation via BIO industry association standards.", "examples": "Amgen, Genentech, Vertex Pharmaceuticals, Moderna"}, {"name": "Medical Device & Diagnostics Manufacturer", "naics": "339112, 334510", "definition": "A manufacturer of instruments, implants, imaging systems, and in-vitro diagnostics used in the diagnosis, monitoring, and treatment of disease.", "operations": "Revenue from capital equipment sales, high-margin disposables/consumables, and service contracts; regulatory pathway varies by risk class (510(k) clearance vs. premarket approval PMA). Innovation cycles are shorter than pharma; hospital group-purchasing organizations pressure pricing.", "regulation": "FDA Center for Devices and Radiological Health (device classes I-III, 510(k)/PMA, Quality System Regulation, UDI); EU MDR abroad; self-regulation via AdvaMed code of ethics.", "examples": "Medtronic, Abbott, Boston Scientific, Siemens Healthineers"}, {"name": "Health Insurer / Managed Care Payer", "naics": "524114", "definition": "An organization that pools risk and finances medical care for enrolled members through premiums, administering commercial, Medicare Advantage, and Medicaid managed-care plans.", "operations": "Collects premiums, adjudicates claims, negotiates provider networks and rates, and manages utilization and pharmacy benefits; profitability hinges on the medical loss ratio (ACA caps administrative retention at 15-20%) and actuarial pricing of risk pools. Increasingly vertically integrated with providers and PBMs.", "regulation": "State insurance commissioners (solvency, rate review, network adequacy), CMS for Medicare Advantage/Medicaid managed care and ACA marketplaces, ERISA for self-funded employer plans; NCQA accredits health plans; self-regulation via AHIP.", "examples": "UnitedHealth Group, Elevance Health, Cigna, Humana"}, {"name": "Pharmacy & Pharmacy Benefit Manager (PBM)", "naics": "456110, 524292", "definition": "Retail and specialty pharmacies dispense medications; PBMs are intermediaries that administer drug benefits, negotiate rebates, and manage formularies for payers.", "operations": "Pharmacies earn dispensing fees and drug-margin spread; PBMs profit from rebate retention, spread pricing, and administrative fees while controlling formulary placement and pharmacy networks. The three largest PBMs process the vast majority of U.S. prescriptions.", "regulation": "State boards of pharmacy license pharmacies and pharmacists; DEA for controlled substances; FTC scrutiny of PBM practices; state PBM transparency laws; accreditation of specialty pharmacies by URAC/ACHC.", "examples": "CVS Health/Caremark, Cigna/Express Scripts, UnitedHealth/OptumRx, Walgreens"}, {"name": "Long-Term Care & Skilled Nursing Facility", "naics": "623110", "definition": "A residential facility providing 24-hour skilled nursing, rehabilitation, and custodial care for aged and disabled persons unable to live independently.", "operations": "Revenue heavily from Medicaid (custodial long-term care) and Medicare (post-acute rehab), plus private pay and long-term-care insurance; the model depends on census (occupancy), payer mix, and controlling labor costs amid chronic staffing shortages. Star-rating and survey deficiencies affect referrals.", "regulation": "CMS certification and the Nursing Home Reform Act (OBRA '87) requirements, enforced through state survey agencies; state licensure; CMS Five-Star Quality Rating; accreditation optional (Joint Commission); self-regulation via AHCA/LeadingAge.", "examples": "Genesis HealthCare, Brookdale Senior Living, Ensign Group, Good Samaritan Society"}, {"name": "Home Health & Hospice Agency", "naics": "621610, 621999", "definition": "An organization delivering skilled nursing, therapy, aide services, and end-of-life palliative care in the patient's home.", "operations": "Reimbursed by Medicare under prospective per-episode/per-day payment (PDGM for home health, per-diem for hospice), plus Medicaid and private pay; operations coordinate visiting clinicians, remote monitoring, and interdisciplinary hospice teams. Margins hinge on visit efficiency and case mix.", "regulation": "CMS Conditions of Participation and OASIS reporting, state licensure; accreditation by CHAP, ACHC, or Joint Commission for deemed status; self-regulation via NAHC.", "examples": "Amedisys, LHC Group, VITAS Healthcare, Kindred at Home"}, {"name": "Outpatient / Ambulatory Surgery & Specialty Center", "naics": "621493, 621498, 621492", "definition": "A freestanding facility providing same-day surgical, dialysis, imaging, or urgent-care services outside the hospital setting.", "operations": "Revenue from facility fees on procedures shifted out of hospitals for lower cost; often physician-owned or joint-ventured, driving high procedural throughput and efficiency. Dialysis centers run recurring outpatient treatment regimens.", "regulation": "CMS ASC Conditions for Coverage, state licensure and CON; accreditation by AAAHC, Joint Commission, or AAAASF; ESRD networks oversee dialysis quality; self-regulation via industry associations.", "examples": "DaVita and Fresenius (dialysis), SurgCenter/USPI, RadNet (imaging), CityMD (urgent care)"}, {"name": "Clinical / Medical Laboratory", "naics": "621511, 621512", "definition": "A facility performing diagnostic testing on patient specimens — clinical chemistry, hematology, microbiology, molecular diagnostics, and imaging interpretation.", "operations": "Revenue per test from payers and providers; high-volume automated core labs and specialized molecular/genomic labs; the model rewards throughput, test-menu breadth, and rapid turnaround. Reference labs serve hospitals and physician offices nationally.", "regulation": "CLIA certification (CMS) governs all clinical testing; FDA regulates test kits and laboratory-developed tests; College of American Pathologists (CAP) accredits labs; state licensure in some states.", "examples": "Quest Diagnostics, Labcorp, ARUP Laboratories, Mayo Clinic Laboratories"}, {"name": "Public Health Agency / Organization", "naics": "923120, 621999", "definition": "A governmental or nonprofit body protecting and improving population health through surveillance, prevention, emergency response, and regulation rather than individual treatment.", "operations": "Funded by government appropriations and grants; core functions are disease surveillance, immunization, environmental health inspection, epidemic response, and health promotion. Not revenue-generating; measured by population health outcomes and emergency readiness.", "regulation": "Operates as the regulator (statutory public-health authority) at federal (CDC/HHS), state, and local levels; accredited by the Public Health Accreditation Board (PHAB); guided by WHO International Health Regulations globally.", "examples": "U.S. Centers for Disease Control and Prevention, New York City Department of Health, county health departments, WHO"}, {"name": "Academic Medical Center", "naics": "622110, 611310", "definition": "A hospital integrated with a medical school and research enterprise, providing tertiary/quaternary care, training physicians through residencies, and conducting clinical research.", "operations": "Tripartite mission funded by clinical revenue (often the largest source), NIH and industry research grants, and educational funding (including Medicare GME payments); handles the most complex cases and clinical trials. Cross-subsidizes teaching and research from clinical margins.", "regulation": "All hospital regulators plus LCME (medical school accreditation), ACGME (residency accreditation), NIH/FDA and IRBs for research; self-regulation via AAMC.", "examples": "Johns Hopkins Medicine, Massachusetts General/Harvard, UCSF Medical Center, Duke University Health System"}, {"name": "Behavioral Health & Addiction Treatment Provider", "naics": "621420, 623220", "definition": "An organization providing outpatient and residential mental health and substance-use disorder treatment.", "operations": "Revenue from Medicaid, commercial insurance (subject to mental-health parity rules), grants, and private pay; delivers therapy, medication-assisted treatment, and residential/detox programs. Workforce shortages and reimbursement gaps constrain capacity.", "regulation": "SAMHSA (block grants, 42 CFR Part 2 confidentiality, opioid treatment program certification), state behavioral-health authorities and licensure, DEA for MAT; accreditation by CARF or Joint Commission; parity enforced under MHPAEA.", "examples": "Acadia Healthcare, community mental health centers, Hazelden Betty Ford Foundation, Universal Health Services behavioral division"}], "regulators": [{"name": "U.S. Food and Drug Administration (FDA)", "jurisdiction": "US (federal)", "role": "Approves and monitors drugs (CDER), biologics (CBER), and devices (CDRH); enforces cGMP manufacturing, labeling, clinical-trial standards, and post-market pharmacovigilance and recalls."}, {"name": "Centers for Medicare & Medicaid Services (CMS)", "jurisdiction": "US (federal)", "role": "Runs Medicare and Medicaid, sets reimbursement rates and Conditions of Participation, certifies facilities (via deemed accreditation), administers CLIA lab certification, and enforces quality reporting — the single largest payer and de facto rule-setter for U.S. care."}, {"name": "State Medical, Nursing & Pharmacy Boards", "jurisdiction": "US (state)", "role": "License and discipline individual clinicians and facilities, define scope of practice, and investigate misconduct; the front line of professional regulation."}, {"name": "The Joint Commission (TJC)", "jurisdiction": "US (accreditor / SRO)", "role": "The dominant private accreditor of hospitals and health-care organizations; its accreditation confers Medicare deemed status and sets widely adopted patient-safety and National Patient Safety Goals — the domain's key self-regulatory body."}, {"name": "American Board of Medical Specialties (ABMS) & specialty societies", "jurisdiction": "US (self-regulatory)", "role": "Its 24 member boards certify physician specialists and maintain continuing certification; specialty societies (ACC, ACS, etc.) issue clinical practice guidelines that govern standards of care."}, {"name": "World Health Organization (WHO)", "jurisdiction": "Global", "role": "Sets international health norms and disease classifications (ICD), administers the International Health Regulations, declares public health emergencies, and coordinates global outbreak response and prequalification of medicines."}, {"name": "Drug Enforcement Administration (DEA)", "jurisdiction": "US (federal)", "role": "Registers and controls handlers of scheduled controlled substances, sets manufacturing quotas, and enforces the Controlled Substances Act across pharmacies, prescribers, and manufacturers."}, {"name": "National Committee for Quality Assurance (NCQA)", "jurisdiction": "US (accreditor)", "role": "Accredits health plans and medical homes and maintains the HEDIS performance measures used to benchmark payer and provider quality — self-regulation of the financing and quality layer."}]}, "groundView": {"orgModel": "A health system is governed by a board of directors/trustees (often community or nonprofit) holding fiduciary and quality-oversight duty, to whom a CEO reports. The C-suite splits along administrative and clinical lines: the CFO, COO, chief nursing officer, chief medical officer, chief information/medical-information officer, and chief compliance officer. Uniquely, a hospital has a parallel, self-governing medical staff — physicians who are often not employees but hold admitting privileges, organized under elected medical-staff officers and a Medical Executive Committee that owns credentialing, peer review, and clinical protocols. Below the executive tier, service-line and departmental directors (surgery, emergency, pharmacy, laboratory, radiology) manage nurse managers and department supervisors, who lead the frontline clinical workforce: attending and resident physicians, registered and licensed practical nurses, advanced-practice providers, pharmacists, therapists, technologists, and aides. Large support functions — revenue cycle, HIM/coding, supply chain, facilities, and environmental services — run in parallel. Pharma, device, and insurer firms follow conventional corporate structures with heavyweight regulatory-affairs, medical-affairs, and clinical-development functions.", "positions": [{"title": "Hospital Board Trustee", "level": "Governance", "reportsTo": "The board itself / community stakeholders", "duties": "Sets mission and strategy, appoints and evaluates the CEO, holds ultimate accountability for quality and patient safety, approves budgets and major capital, and ensures regulatory and community-benefit compliance. Measured by financial sustainability, quality metrics, and mission fulfillment.", "credentials": "No clinical requirement; community, business, legal, or clinical leaders; governance training via AHA/Governance Institute.", "socCode": "11-1011"}, {"title": "Chief Executive Officer (Health System)", "level": "Executive", "reportsTo": "Board of Directors/Trustees", "duties": "Leads overall strategy, growth, physician alignment, payer negotiations, and community and government relations; accountable for financial performance, quality, and system integration. Measured by operating margin, market share, quality scores, and mergers/partnerships.", "credentials": "MHA/MBA or MD; extensive health-system leadership; FACHE credential common.", "socCode": "11-1011"}, {"title": "Chief Medical Officer (CMO)", "level": "Executive", "reportsTo": "CEO", "duties": "Bridges administration and the medical staff: owns clinical quality, patient safety, medical-staff relations, care standardization, and physician performance. Measured by mortality/complication rates, core-measure compliance, and physician engagement.", "credentials": "MD/DO with active board certification, clinical experience, and often an MBA/MMM; physician-executive training.", "socCode": "11-9111"}, {"title": "Chief Nursing Officer (CNO)", "level": "Executive", "reportsTo": "CEO or COO", "duties": "Leads the entire nursing organization — the largest clinical workforce — setting nursing practice standards, staffing models, and care quality; owns nurse recruitment, retention, and Magnet designation. Measured by nurse-sensitive indicators (falls, pressure injuries, CLABSI), staffing ratios, and turnover.", "credentials": "BSN plus MSN/DNP; RN license; nurse-executive certification (NEA-BC).", "socCode": "11-9111"}, {"title": "Chief Compliance Officer", "level": "Executive", "reportsTo": "CEO / Board Audit Committee", "duties": "Runs the corporate compliance program: HIPAA privacy/security, fraud-and-abuse (Stark, Anti-Kickback), billing integrity, and regulatory reporting; investigates and self-discloses violations. Measured by audit findings, absence of enforcement actions, and program effectiveness.", "credentials": "JD or health-administration degree; CHC (Certified in Healthcare Compliance); regulatory expertise.", "socCode": "11-9199"}, {"title": "Service-Line / Clinical Department Director", "level": "Management", "reportsTo": "COO / CMO / CNO", "duties": "Manages a clinical service (e.g., surgical services, emergency, cardiology): operations, budget, staffing, physician relations, throughput, and quality for the line. Measured by volume, contribution margin, patient satisfaction, and clinical outcomes.", "credentials": "Clinical background (RN, therapist) plus master's (MHA/MBA/MSN); service-specific certifications.", "socCode": "11-9111"}, {"title": "Nurse Manager", "level": "Management", "reportsTo": "Director of Nursing / CNO", "duties": "Runs a nursing unit: schedules and manages RNs and techs, ensures staffing ratios and competency, oversees patient-care quality and unit budget, and handles patient/fa
