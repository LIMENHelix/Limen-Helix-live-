mily escalations. Measured by unit quality indicators, patient experience (HCAHPS), staff engagement, and budget.", "credentials": "BSN/MSN; active RN license; charge-nurse experience; CNML/NE-BC certification common.", "socCode": "11-9111"}, {"title": "Attending Physician / Hospitalist", "level": "Professional", "reportsTo": "Medical Staff / Department Chair (clinically self-governing)", "duties": "Diagnoses and treats patients, admits and discharges, directs the care team, documents for billing and legal record, and supervises residents in teaching settings. Measured by clinical outcomes, length of stay, patient satisfaction, and productivity (RVUs).", "credentials": "MD/DO, completed residency, state medical license, DEA registration, and ABMS board certification.", "socCode": "29-1216"}, {"title": "Registered Nurse (RN)", "level": "Professional", "reportsTo": "Nurse Manager / Charge Nurse", "duties": "Delivers and coordinates direct patient care: assessment, medication administration, monitoring, patient education, and care-plan execution; the clinical backbone of the hospital. Measured by adherence to protocols, patient outcomes, documentation, and safety events on assigned patients.", "credentials": "ADN or BSN; passed NCLEX-RN; state RN license; specialty certifications (CCRN, CEN) for advanced units.", "socCode": "29-1141"}, {"title": "Nurse Practitioner / Physician Assistant (Advanced Practice Provider)", "level": "Professional", "reportsTo": "Collaborating/Supervising Physician or Department Director", "duties": "Assesses patients, diagnoses, orders and interprets tests, prescribes, and manages treatment — expanding access to care with varying degrees of practice autonomy by state. Measured by panel outcomes, productivity, and quality metrics.", "credentials": "NP: MSN/DNP plus national certification and state APRN license; PA: master's from an ARC-PA program plus PANCE certification and state license.", "socCode": "29-1171"}, {"title": "Pharmacist", "level": "Professional", "reportsTo": "Pharmacy Director / Manager", "duties": "Reviews and verifies medication orders, checks interactions and dosing, dispenses and compounds, counsels patients, and manages formulary and controlled substances. Measured by dispensing accuracy, intervention rates, and regulatory compliance.", "credentials": "Doctor of Pharmacy (PharmD); passed NAPLEX and MPJE; state pharmacist license; residency for clinical roles.", "socCode": "29-1051"}, {"title": "Medical / Clinical Laboratory Scientist (Technologist)", "level": "Professional", "reportsTo": "Laboratory Director / Manager", "duties": "Performs and validates diagnostic tests across chemistry, hematology, microbiology, and molecular sections, maintains instrument QC, and reports results that drive clinical decisions. Measured by accuracy, turnaround time, and QC/proficiency-testing performance.", "credentials": "Bachelor's in medical laboratory science; ASCP (MLS) certification; state license where required.", "socCode": "29-2011"}, {"title": "Regulatory Affairs Manager (Pharma/Device)", "level": "Professional", "reportsTo": "VP of Regulatory Affairs", "duties": "Prepares and manages regulatory submissions (INDs, NDAs, 510(k)s, PMAs), interfaces with the FDA, and ensures products and labeling comply throughout the lifecycle. Measured by submission success, approval timelines, and audit outcomes.", "credentials": "Life-sciences degree (often advanced); RAC (Regulatory Affairs Certification); deep FDA/ICH knowledge.", "socCode": "13-1041"}, {"title": "Respiratory / Physical / Occupational Therapist", "level": "Professional", "reportsTo": "Rehabilitation or Respiratory Services Manager", "duties": "Delivers specialized therapeutic care — ventilator and airway management (RT), mobility and strength rehabilitation (PT), or functional daily-living recovery (OT) — and documents progress toward measurable goals. Measured by patient functional outcomes and productivity.", "credentials": "RT: associate/bachelor's plus RRT credential and license; PT: DPT plus NPTE and license; OT: master's/doctorate plus NBCOT and license.", "socCode": "29-1120"}, {"title": "Medical Coder / Health Information Technician", "level": "Operational", "reportsTo": "HIM Director / Revenue Cycle Manager", "duties": "Translates clinical documentation into ICD-10, CPT, and HCPCS codes for billing and reporting, ensures coding accuracy and compliance, and supports the revenue cycle. Measured by coding accuracy, denial rates, and productivity.", "credentials": "Postsecondary certificate/associate; AHIMA (CCS/RHIT) or AAPC (CPC) certification.", "socCode": "29-2072"}, {"title": "Certified Nursing Assistant / Patient Care Technician", "level": "Operational", "reportsTo": "Registered Nurse / Nurse Manager", "duties": "Provides direct personal care under RN direction: bathing, feeding, mobility, vital signs, and activities of daily living; the highest-touch frontline caregiver. Measured by care quality, patient safety, and responsiveness.", "credentials": "State-approved CNA training and competency exam; state CNA registry listing; often phlebotomy/EKG add-ons for PCTs.", "socCode": "31-1131"}, {"title": "Emergency Medical Technician / Paramedic", "level": "Operational", "reportsTo": "EMS Supervisor / Medical Director", "duties": "Responds to emergencies, assesses and stabilizes patients in the field, administers treatment within protocol (paramedics provide advanced life support), and transports to hospitals. Measured by response times, protocol adherence, and clinical outcomes.", "credentials": "State EMT/Paramedic license; NREMT certification; paramedics complete 1,200-1,800+ hours of training.", "socCode": "29-2043"}, {"title": "Medical Assistant", "level": "Operational", "reportsTo": "Practice Manager / Physician", "duties": "Rooms patients, takes vitals and histories, assists with procedures, administers injections, and handles scheduling and documentation in outpatient settings. Measured by clinic throughput, accuracy, and patient satisfaction.", "credentials": "Postsecondary MA certificate; CMA (AAMA) or RMA certification common though not always required.", "socCode": "31-9092"}, {"title": "Environmental Services / Sterile Processing Technician", "level": "Operational", "reportsTo": "EVS Manager / Sterile Processing Supervisor", "duties": "Cleans and disinfects patient areas to infection-control standards, or decontaminates, sterilizes, and assembles surgical instrument trays — functions critical to preventing healthcare-associated infections. Measured by infection rates, audit scores, and turnaround times.", "credentials": "High school diploma plus on-the-job training; sterile processing techs earn CRCST (HSPA) certification.", "socCode": "31-9093"}]}}, {"id": "population", "name": "Population", "icon": "👥", "tagline": "The sectors that count, house, place, care for, and move human beings through the life course.", "view100k": {"role": "Population is the domain that treats human beings themselves — their number, distribution, housing, life stages, and mobility — as the object of organized economic and governmental activity. Where Medicine keeps bodies healthy and Education fills minds, the Population domain manages the demographic substrate of civilization: it counts people (census and vital statistics), shelters them (housing), places them into work (employment services and staffing), cares for them at the dependent ends of life (childcare and eldercare), supports them when they fall (social services and safety net), moves them across borders (immigration services), and plans the settlements they inhabit (urban planning). This domain exists because a society must know how many people it has and where they are in order to govern, tax, and provision anything, and because the human life course generates predictable dependency — the young, the old, the unemployed, the displaced — that markets alone will not fully provision.\n\nThe scale is vast and diffuse because it spans public agencies, nonprofits, and private firms. Housing is the single largest asset class on Earth: U.S. residential real estate is worth roughly $45-50 trillion, and shelter is the largest line item in most household budgets. Social assistance and safety-net programs are enormous fiscal enterprises — U.S. Social Security (~$1.4 trillion/year) and means-tested programs (SNAP, TANF, housing assistance, SSI) together move well over $2 trillion annually. The childcare market exceeds $60 billion in the U.S. and the eldercare/senior-living and home-care sector runs into the hundreds of billions as the population ages. The staffing and employment-services industry places tens of millions and generates over $500 billion globally. Social workers, childcare workers, home health and personal-care aides, and social-and-community-service managers collectively number in the many millions — personal-care and home-health aides are among the fastest-growing occupations in the U.S.\n\nThe historical arc runs from ancient censuses (the Roman census, the Domesday Book of 1086, the biblical enumeration) that tied counting to taxation and conscription, through the Elizabethan Poor Laws that first institutionalized public responsibility for the destitute, the 19th-century settlement-house and charity-organization movements that professionalized social work, the 20th-century construction of the welfare state (Social Security in 1935, the Great Society programs of the 1960s, public housing and Section 8), and the modern demographic transition — falling fertility and population aging across the developed world — that is reshaping the entire domain toward eldercare and immigration. The defining tension is between the market allocation of shelter and care (which produces affordability crises and care deserts) and the public and philanthropic provision of a floor beneath human dignity, contested continuously through housing policy, welfare reform, immigration law, and the fiscal sustainability of programs for an aging society.", "interdependencies": "Population is intimately bound to Governance and Law, which define citizenship, entitlement, zoning, landlord-tenant law, and the statutory safety net that funds most of the domain. It depends on Finance for mortgages, the mortgage-backed-securities market, and the capital that builds housing; on the Economy and Trade, whose labor demand the staffing sector intermediates and whose cycles drive unemployment and housing affordability; on Infrastructure, Industry, and Energy to physically build and power settlements; on Medicine, with which eldercare and home care overlap heavily; on Education, which the domain feeds through demographic enrollment and childcare-to-school pipelines; on Technology and Communication for benefits-administration systems, gig-work and staffing platforms, and census data collection; on Agriculture for food assistance; on Environment and urban planning's shared concern with sustainable, resilient settlement; on Culture and Religion, since faith-based and community organizations deliver a huge share of social services; on Intelligence and Defense, which rely on population data for planning and on immigration control for security; and on Science, whose demography and social-science research underpin policy design.", "regulationModel": "The domain is governed through a dense mix of federal, state, and local authority plus professional licensure. In the U.S., the Census Bureau (constitutionally mandated decennial count) and the National Center for Health Statistics run enumeration and vital statistics; HUD sets housing policy, funds public housing and vouchers, and enforces the Fair Housing Act; HHS (Administration for Children and Families, Administration for Community Living) funds and regulates childcare, child welfare, TANF, and aging services; the DOL and state workforce agencies oversee employment services and staffing; and DHS/USCIS administers immigration. Social workers are licensed by state boards (LCSW and related credentials) and self-regulated by the NASW Code of Ethics; the profession's accreditor is CSWE. Housing is regulated locally through zoning, building codes, and rent regulation, and nationally through fair-lending and consumer-finance law (CFPB, RESPA, TILA). Urban planning is governed by local planning commissions and self-regulated by the American Planning Association and its AICP certification. Nonprofits operate under IRS 501(c)(3) rules and voluntary accreditation (e.g., COA/Social Current). Internationally, the UN Population Division, UNHCR (refugees), and UN-Habitat (settlements) set norms."}, "view10k": {"overview": "The domain spans several NAICS sectors rather than one. Housing sits in real estate (Sector 53 — lessors of residential buildings 531110, property management 531311) and in social-assistance community housing (624229). Care services sit in Sector 62 social assistance: child day care (6244), individual and family services (6241 — including child/youth services 624110, elderly and disabled services 624120), community food and housing/emergency relief (6242), and vocational rehabilitation (6243). Employment services sit in Sector 56 (5613 — employment placement 561311, temporary staffing 561320, PEOs 561330). Government functions — census, vital statistics, public housing authorities, urban planning, social-service administration — sit in Sector 92 (public administration). Organizationally the domain is a three-way blend of government agencies (the dominant funder), nonprofit community organizations (the dominant deliverer of social services), and private firms (housing developers/landlords, staffing companies, for-profit childcare and senior living, immigration law practices).", "businessTypes": [{"name": "Residential Real Estate Developer / Homebuilder", "naics": "236115, 237210", "definition": "A firm that acquires land, secures entitlements, and constructs housing — single-family subdivisions, multifamily apartments, and mixed-use — for sale or rent.", "operations": "Revenue from home sales or stabilized rental income; the model turns on land acquisition, entitlement/zoning approval, construction financing, and absorption/lease-up. Margins depend on interest rates, materials costs, and local land-use approval, making the business highly cyclical.", "regulation": "Local zoning boards, planning commissions, and building codes (IBC/IRC); environmental review (NEPA/CEQA); ADA and Fair Housing accessibility; self-regulation via the National Association of Home Builders code.", "examples": "D.R. Horton, Lennar, AvalonBay Communities, Related Companies"}, {"name": "Property Management & Multifamily Landlord (REIT)", "naics": "531311, 531110", "definition": "An owner or manager of rental residential property that leases units, maintains buildings, and administers tenancies, often structured as a real estate investment trust.", "operations": "Recurring rental revenue net of operating expenses and debt service; the model optimizes occupancy, rent growth, turnover, and maintenance costs. REIT structure passes income to shareholders tax-free at the entity level if distribution rules are met.", "regulation": "State/local landlord-tenant law, rent regulation, habitability codes, Fair Housing Act (HUD/DOJ enforcement); SEC for public REITs; self-regulation via the National Apartment Association and IREM (CPM designation).", "examples": "Greystar, Equity Residential, AvalonBay, Invitation Homes"}, {"name": "Public Housing Authority (PHA)", "naics": "925110, 531110", "definition": "A local governmental agency that owns and operates subsidized public housing and administers Housing Choice (Section 8) vouchers for low-income households.", "operations": "Funded by HUD operating and capital subsidies plus tenant rent (capped at ~30% of income); administers waitlists, income certification, inspections (HQS/NSPIRE), and voucher payments to private landlords. Increasingly converts stock to project-based Section 8 via RAD.", "regulation": "HUD (funding, compliance, Fair Housing), state enabling law, annual REAC/NSPIRE inspections; governed by a local board; self-regulation via NAHRO standards.", "examples": "New York City Housing Authority (NYCHA), Chicago Housing Authority, Housing Authority of the City of Los Angeles, Cambridge Housing Authority"}, {"name": "Affordable Housing Developer / Community Development Corporation", "naics": "624229, 236116", "definition": "A mission-driven (often nonprofit) developer that builds and operates income-restricted affordable housing, typically financed with tax credits and public subsidy.", "operations": "Capitalized by Low-Income Housing Tax Credit (LIHTC) equity syndication, tax-exempt bonds, HUD/HOME funds, and soft debt; the model braids many funding sources into a project and earns developer fees plus long-term ownership. Compliance-heavy over 15-30 year affordability periods.", "regulation": "State housing finance agencies (LIHTC allocation and compliance), HUD, IRS Section 42; local zoning; self-regulation via NeighborWorks America and the affordable-housing industry (NCSHA).", "examples": "Enterprise Community Partners, LISC, Mercy Housing, National Church Residences"}, {"name": "Staffing & Temporary Employment Agency", "naics": "561320, 561311", "definition": "A firm that recruits, employs, and places workers — temporary, temp-to-hire, or permanent — with client businesses that need flexible or specialized labor.", "operations": "Revenue from bill-rate markup over the wages it pays temporary employees (of whom it is the legal employer of record, carrying payroll, workers' comp, and unemployment costs) or from placement fees for direct hires; the model scales on recruiting throughput and client relationships.", "regulation": "DOL (FLSA wage/hour, co-employment), EEOC, state workforce agencies, and worker-classification law; self-regulation via the American Staffing Association code of ethics and certification (CSP).", "examples": "Adecco, Randstad, Robert Half, Allegis Group"}, {"name": "Professional Employer Organization (PEO)", "naics": "561330", "definition": "A firm that co-employs a client's workforce to provide outsourced HR, payroll, benefits, and compliance under a shared-employment arrangement.", "operations": "Revenue from per-employee-per-month fees or a percentage of payroll; by aggregating many small clients' employees, the PEO buys benefits and workers' comp at scale and assumes administrative employer duties. Client retains day-to-day direction of workers.", "regulation": "IRS Certified PEO program, state PEO licensing/registration, DOL and state employment law; self-regulation and accreditation via ESAC and NAPEO.", "examples": "ADP TotalSource, Insperity, TriNet, Paychex"}, {"name": "Child Day Care & Early Care Center", "naics": "624410", "definition": "A licensed facility providing custodial and developmental care for children of working families, from infants through school age (distinct from academic pre-K).", "operations": "Parent-fee revenue plus CCDF subsidy vouchers and, for some, Head Start/state pre-K contracts; a low-margin, labor-intensive business bound by mandated child-staff ratios that cap capacity. Occupancy, staff retention, and subsidy timeliness drive viability.", "regulation": "State child-care licensing agencies (ratios, safety, background checks), HHS ACF for subsidy rules; voluntary quality accreditation (NAEYC) and state QRIS ratings.", "examples": "KinderCare, Bright Horizons, La Petite Academy, home-based family child care providers"}, {"name": "Senior Living & Assisted Living Provider", "naics": "623312, 623311", "definition": "An operator of residential communities for older adults — independent living, assisted living, and memory care — providing housing plus personal-care and supportive services short of skilled nursing.", "operations": "Private-pay monthly fees (plus Medicaid HCBS waivers in some assisted living), tiered by care level; the model combines real estate (occupancy, rate) with hospitality and care services. Demographic aging drives long-run demand; labor and occupancy drive margins.", "regulation": "State assisted-living licensing (varies widely by state; not federally certified like nursing homes), fire/life safety codes; self-regulation and accreditation via Argentum, CARF, and LeadingAge.", "examples": "Brookdale Senior Living, Atria Senior Living, Sunrise Senior Living, Holiday by Atria"}, {"name": "Home & Community-Based Personal Care Agency", "naics": "624120, 621610", "definition": "An agency providing non-medical personal care, homemaker, and companion services that enable elderly and disabled people to remain in their homes.", "operations": "Revenue from Medicaid HCBS waivers, private pay, long-term-care insurance, and VA programs; the model matches personal-care aides to clients and bills per hour of care. Aide recruitment, retention, and scheduling are the central operational challenge.", "regulation": "State home-care licensing, Medicaid provider standards, DOL domestic-worker wage rules; self-regulation via the Home Care Association of America.", "examples": "Home Instead, Comfort Keepers, Addus HomeCare, Bayada"}, {"name": "Social Services / Human Services Nonprofit", "naics": "624190, 624110, 624210", "definition": "A nonprofit organization delivering individual and family services — case management, counseling, child welfare, food and emergency relief, refugee resettlement, and community support.", "operations": "Funded by government contracts and grants, philanthropy, and fees; delivers services through professional and paraprofessional staff and volunteers. Measured by contract deliverables, client outcomes, and cost per client; perpetually reliant on grant renewal.", "regulation": "State licensing for specific programs (child welfare, residential), government contract compliance, IRS 501(c)(3); voluntary accreditation by the Council on Accreditation (Social Current) and adherence to NASW ethics.", "examples": "Catholic Charities, United Way agencies, The Salvation Army, Lutheran Immigration and Refugee Service"}, {"name": "Public Social-Service / Human-Service Agency", "naics": "923130", "definition": "A government department that administers means-tested benefits and protective services — SNAP, TANF, Medicaid eligibility, child protective services, and adult protective services.", "operations": "Funded by federal-state cost sharing; determines eligibility, issues benefits, investigates abuse/neglect, and manages caseloads through frontline caseworkers and eligibility specialists. Not revenue-generating; measured by processing accuracy/timeliness, error rates, and child-safety outcomes.", "regulation": "Operates as regulator and administrator under federal statute (HHS/ACF, USDA FNS for SNAP) and state law; oversight by state auditors and federal quality-control reviews.", "examples": "County departments of social services, state Departments of Human Services, Child Protective Services agencies, state SNAP/TANF offices"}, {"name": "Immigration Services & Legal Practice", "naics": "541110, 813319", "definition": "Law firms and accredited nonprofit organizations that advise and represent individuals and employers in immigration, visa, asylum, and naturalization matters.", "operations": "Fee-for-service legal work (family petitions, employment visas, asylum, removal defense) or grant-funded nonprofit representation; the model combines casework, USCIS/immigration-court filings, and compliance advising for employers. Demand tracks immigration policy shifts.", "regulation": "State bar licensure for attorneys, DOJ/EOIR recognition and accreditation for nonprofit representatives, USCIS procedural rules; self-regulation via the American Immigration Lawyers Association (AILA).", "examples": "Fragomen (corporate immigration), International Rescue Committee legal services, CLINIC-affiliated nonprofits, immigration solo/boutique firms"}, {"name": "Census, Survey & Demographic Data Organization", "naics": "926110, 541910", "definition": "Government statistical agencies and private research firms that enumerate populations, register vital events, and produce demographic data and projections.", "operations": "Government agencies are appropriations-funded and conduct the census, vital registration, and ongoing surveys (ACS, CPS); private demographic and market-research firms sell population data, estimates, and analytics. Data feed apportionment, funding formulas, and business/policy planning.", "regulation": "Statutory mandate and confidentiality law (Title 13 for the Census Bureau, Title 26; state vital-records statutes); OMB statistical standards; private firms follow research-industry standards (AAPOR, Insights Association).", "examples": "U.S. Census Bureau, National Center for Health Statistics, state vital-records offices, Nielsen/Claritas"}, {"name": "Urban & Regional Planning Practice", "naics": "541320, 925120", "definition": "Public planning departments and private planning/consulting firms that guide land use, zoning, transportation, and community development to shape how settlements grow.", "operations": "Public planners are budget-funded and process zoning, comprehensive plans, and permits; private firms earn consulting fees for master plans, entitlement support, and studies. Work centers on plan-making, public engagement, and regulatory review.", "regulation": "Local planning commissions and councils adopt zoning and plans under state enabling acts; environmental review (NEPA/CEQA); self-regulation via the American Planning Association and AICP certification/ethics code.", "examples": "City planning departments, regional councils of governments (MPOs), AECOM, HDR planning practices"}], "regulators": [{"name": "U.S. Department of Housing and Urban Development (HUD)", "jurisdiction": "US (federal)", "role": "Funds public housing and Housing Choice Vouchers, insures mortgages (FHA), enforces the Fair Housing Act, and sets national housing and community-development policy and standards (NSPIRE inspections, income limits)."}, {"name": "U.S. Census Bureau", "jurisdiction": "US (federal)", "role": "Conducts the constitutionally mandated decennial census and ongoing surveys, produces the population data that drive congressional apportionment and federal funding allocation, and protects respondent confidentiality under Title 13."}, {"name": "HHS Administration for Children and Families (ACF) & Administration for Community Living (ACL)", "jurisdiction": "US (federal)", "role": "Administers and regulates childcare subsidies, Head Start, child welfare, TANF, refugee resettlement (ACF), and aging and disability services under the Older Americans Act (ACL)."}, {"name": "State Social Work / Human Services Licensing Boards", "jurisdiction": "US (state)", "role": "License and discipline social workers (LCSW, LMSW), enforce scope of practice and ethics, and license residential and child-welfare programs — the professional-regulation layer of the domain."}, {"name": "Council on Social Work Education (CSWE) & Council on Accreditation / Social Current", "jurisdiction": "US (accreditor / SRO)", "role": "CSWE accredits social-work degree programs (gating licensure); COA/Social Current accredits human-services and child/family-serving organizations against national standards — the domain's self-regulatory accreditation."}, {"name": "U.S. Citizenship and Immigration Services (USCIS) / DOJ EOIR", "jurisdiction": "US (federal)", "role": "Adjudicates immigration and naturalization benefits (USCIS) and operates the immigration courts and recognizes nonprofit representatives (EOIR), setting the rules the immigration-services sector operates under."}, {"name": "American Planning Association (APA) / AICP", "jurisdiction": "US (professional association / SRO)", "role": "Sets professional standards and ethics for urban planning and certifies planners (AICP); local planning commissions exercise the actual land-use regulatory power under state enabling law."}, {"name": "American Staffing Association & NAPEO/ESAC", "jurisdiction": "US (industry associations / SRO)", "role": "Self-regulate the staffing and PEO industries through codes of ethics, certification (CSP), and financial-assurance accreditation (ESAC for PEOs); DOL and the IRS provide the statutory backstop."}]}, "groundView": {"orgModel": "Organizations in this domain take three characteristic shapes. A human-services nonprofit is governed by a volunteer board of directors overseeing an executive director/CEO, beneath whom sit program directors for each service line (housing, family services, aging, immigration), program managers/supervisors, and frontline case managers, social workers, and direct-care staff, with development and grants-management functions running in parallel to keep the funding pipeline full. A public agency mirrors this but replaces the board with political leadership (an appointed commissioner or elected board) and adds eligibility, compliance, and quality-control layers dictated by funding statutes. A private firm — homebuilder, staffing agency, senior-living operator — follows a conventional corporate structure (CEO, CFO/COO, regional VPs, site/branch managers, frontline workers) but is shaped by the heavy regulatory and licensing overlay of housing and care. Across all three, the defining feature is a thin professional/management tier stretched over a large, often high-turnover frontline of caseworkers, aides, childcare workers, leasing agents, and recruiters, and a constant tension between mission and the contract/reimbursement economics that fund it.", "positions": [{"title": "Board of Directors Member (Nonprofit)", "level": "Governance", "reportsTo": "The board / community and funders", "duties": "Sets mission and strategy, hires and evaluates the executive director, holds fiduciary responsibility, approves budgets, and leads fundraising and community stewardship. Measured by organizational financial health, mission impact, and funder confidence.", "credentials": "No formal requirement; community, business, legal, or subject-matter leaders; nonprofit-governance training (BoardSource).", "socCode": "11-1011"}, {"title": "Executive Director / CEO (Human Services)", "level": "Executive", "reportsTo": "Board of Directors", "duties": "Leads the organization: strategy, government and philanthropic relations, program portfolio, and financial sustainability across braided funding streams. Measured by budget balance, contract/grant retention, program outcomes, and organizational growth.", "credentials": "Master's common (MSW, MPA, MPH, or MBA); deep sector and grants experience; sometimes LCSW.", "socCode": "11-9151"}, {"title": "Agency Commissioner / Director (Public)", "level": "Executive", "reportsTo": "Mayor/Governor or elected board", "duties": "Runs a public housing authority or social-services department: administers statutory programs, manages the workforce, ensures federal/state compliance, and answers to political leadership and the public. Measured by program performance, audit findings, and constituent outcomes.", "credentials": "MPA/MPP or relevant master's; extensive public-administration experience.", "socCode": "11-9151"}, {"title": "Chief Financial Officer / Chief Operating Officer", "level": "Executive", "reportsTo": "Executive Director/CEO", "duties": "Manages finance, grants and contract administration, compliance, facilities, and HR; owns the fund-accounting and cost-allocation systems that reconcile many restricted funding streams. Measured by clean audits, cash flow, and compliance.", "credentials": "MBA/M.Acc; CPA common; nonprofit or government fund-accounting expertise.", "socCode": "11-3031"}, {"title": "Program Director", "level": "Management", "reportsTo": "Executive Director / COO", "duties": "Leads a service line (e.g., housing, aging, child welfare, workforce): owns program design, budget, grant deliverables, staffing, and outcomes for that portfolio. Measured by contract compliance, client outcomes, and budget performance.", "credentials": "Master's in social work, public administration, or the program field; relevant licensure; management experience.", "socCode": "11-9151"}, {"title": "Property / Community Manager (Housing)", "level": "Management", "reportsTo": "Regional Property Director / PHA Executive", "duties": "Runs a residential property or portfolio: leasing, rent collection, maintenance oversight, compliance (fair housing, income certification for subsidized units), and resident relations. Measured by occupancy, net operating income, collections, and inspection scores.", "credentials": "Bachelor's common; IREM (CPM/ARM) or NAA (CAM) certification; tax-credit compliance (HCCP) for affordable housing.", "socCode": "11-9141"}, {"title": "Staffing Branch Manager", "level": "Management", "reportsTo": "Regional/Area Director", "duties": "Leads a staffing branch: manages recruiters, drives client sales, oversees placements and worker safety/compliance, and owns branch P&L. Measured by gross margin, fill rates, redeployment, and client retention.", "credentials": "Bachelor's; staffing-industry experience; CSP (Certified Staffing Professional).", "socCode": "11-3121"}, {"title": "Social Worker (LCSW / Clinical)", "level": "Professional", "reportsTo": "Program Manager / Clinical Supervisor", "duties": "Assesses clients, develops and implements treatment or service plans, provides counseling and crisis intervention, and connects clients to resources; may supervise casework. Measured by caseload outcomes, documentation quality, and client stability/safety.", "credentials": "MSW plus supervised hours and state clinical license (LCSW); adherence to the NASW Code of Ethics.", "socCode": "21-1022"}, {"title": "Case Manager / Social & Community Service Specialist", "level": "Professional", "reportsTo": "Program Manager / Supervisor", "duties": "Manages a caseload of clients: intake and assessment, benefits navigation, service coordination, home visits, and progress documentation across housing, employment, or family-support programs. Measured by caseload size, service milestones, and client outcomes.", "credentials": "Bachelor's in social work, human services, or related field (BSW); some roles require CM certification.", "socCode": "21-1093"}, {"title": "Urban / Regional Planner", "level": "Professional", "reportsTo": "Planning Director / Principal Planner", "duties": "Reviews development proposals, drafts comprehensive and zoning plans, conducts land-use and transportation analysis, and facilitates public engagement and hearings. Measured by plan quality, review timeliness, and adopted policy outcomes.", "credentials": "Master's in urban planning (MUP/MCP); AICP certification; GIS proficiency.", "socCode": "19-3051"}, {"title": "Recruiter / Employment Placement Specialist", "level": "Professional", "reportsTo": "Staffing Branch Manager", "duties": "Sources, screens, and places candidates into temporary or permanent roles: builds candidate pipelines, interviews, matches to client orders, and manages worker onboarding and redeployment. Measured by placements, fill speed, and candidate/client satisfaction.", "credentials": "Bachelor's common; recruiting experience; ATS proficiency; industry certifications optional.", "socCode": "13-1071"}, {"title": "Immigration / Legal Services Attorney", "level": "Professional", "reportsTo": "Managing Attorney / Legal Director", "duties": "Represents clients in petitions, applications, asylum, and removal defense; prepares filings, advises on eligibility, and appears before USCIS and immigration courts. Measured by case outcomes, caseload, and compliance.", "credentials": "JD and state bar admission (or DOJ-accredited representative status at nonprofits); AILA membership common.", "socCode": "23-1011"}, {"title": "Statistician / Demographer", "level": "Professional", "reportsTo": "Research Director / Division Chief", "duties": "Designs surveys and samples, analyzes population and vital-statistics data, produces estimates and projections, and ensures statistical and confidentiality standards. Measured by data accuracy, methodological soundness, and timeliness of releases.", "credentials": "Master's/PhD in statistics, demography, or economics; expertise in survey methods and statistical software.", "socCode": "15-2041"}, {"title": "Eligibility Specialist / Benefits Caseworker", "level": "Operational", "reportsTo": "Casework Supervisor", "duties": "Interviews applicants, verifies income and documentation, determines eligibility for SNAP/TANF/Medicaid/housing, and processes benefit issuance and renewals. Measured by processing accuracy, timeliness, and error rates under federal quality control.", "credentials": "High school diploma/associate; agency training and certification on eligibility systems.", "socCode": "43-4061"}, {"title": "Childcare Worker", "level": "Operational", "reportsTo": "Center Director / Lead Teacher", "duties": "Supervises and cares for children, maintains safety and hygiene, leads age-appropriate activities and routines, and communicates with parents. Measured by child safety, ratio compliance, and parent satisfaction.", "credentials": "High school diploma; state health/safety training and background check; CDA credential valued.", "socCode": "39-9011"}, {"title": "Home Health / Personal Care Aide", "level": "Operational", "reportsTo": "Care Coordinator / RN Supervisor", "duties": "Assists elderly and disabled clients with daily living — bathing, dressing, mobility, meals, medication reminders, and companionship — enabling independent living at home. Measured by care quality, client safety, and reliability. One of the fastest-growing U.S. occupations.", "credentials": "High school diploma or less; state-required training hours; home health aides need Medicare/Medicaid competency certification.", "socCode": "31-1121"}, {"title": "Leasing Agent / Resident Services Coordinator", "level": "Operational", "reportsTo": "Property Manager", "duties": "Shows and leases units, processes applications and income certifications, handles resident requests and renewals, and (in service-enriched housing) connects residents to support programs. Measured by leasing velocity, occupancy, and resident retention.", "credentials": "High school diploma; real-estate or leasing license in some states; NAA leasing certification (NALP).", "socCode": "41-9022"}, {"title": "Census / Field Survey Enumerator", "level": "Operational", "reportsTo": "Field Supervisor / Crew Leader", "duties": "Collects population and survey data door-to-door and by phone, verifies addresses, follows up with non-responding households, and records responses under strict confidentiality protocols. Measured by completion rates, data accuracy, and productivity.", "credentials": "High school diploma; agency training; background check; short-term/seasonal for decennial census.", "socCode": "43-4111"}]}}, {"id": "environment", "name": "Environment", "icon": "🌍", "tagline": "The management, protection, and restoration of the natural systems that civilization depends on and disrupts.", "view100k": {"role": "Environment is the domain that manages civilization's relationship with the biophysical systems it depends on — air, water, land, biodiversity, and climate — by removing the wastes society produces, cleaning up the damage it causes, protecting the resources it draws down, and increasingly pricing the externalities it once dumped for free. It exists because economic activity generates pollution and depletion that markets, left alone, do not account for: the classic problem of the commons and the negative externality. The domain turns environmental protection into organized economic activity through waste management and recycling, environmental remediation, water and wastewater utilities, environmental consulting and engineering, conservation and land management, and the fast-growing markets in carbon, ecosystem services, and ESG assurance.\n\nThe scale is large and growing. Global environmental services — waste management, water, remediation, and consulting — exceed $1.5 trillion annually; the solid-waste and recycling industry alone is roughly $500 billion worldwide and about $100 billion in the U.S., where it employs several hundred thousand people. Water and wastewater utilities represent trillions in infrastructure assets. Carbon markets have grown rapidly: compliance markets (the EU ETS and others) traded on the order of $900 billion in a recent year, while voluntary carbon markets, though smaller and volatile, channel billions into offset projects. The environmental consulting and engineering sector is a $40-50 billion U.S. industry, and the ESG and sustainability-services market has exploded with mandatory climate disclosure. Refuse and recyclable-material collectors, water-treatment operators, environmental scientists, and conservation workers number well over a million in the U.S.\n\nThe historical arc runs from ancient sanitation (Roman sewers, medieval night-soil collection) through the 19th-century sanitary movement that linked disease to filth and built modern water and sewer systems, to the modern environmental era ignited in the 1960s-70s: Rachel Carson's Silent Spring (1962), the first Earth Day (1970), and the rapid U.S. creation of the EPA (1970), the Clean Air Act (1970), Clean Water Act (1972), and Superfund/CERCLA (1980). Internationally the arc runs through the 1972 Stockholm Conference, the 1987 Montreal Protocol on ozone, the 1992 Rio Earth Summit and UNFCCC, the Kyoto Protocol (1997), and the Paris Agreement (2015), which reframed the domain around climate and made carbon a traded commodity. The defining tension is that environmental protection is a public good financed against private cost: firms and consumers bear concentrated costs for diffuse, long-horizon benefits, so the entire domain depends on regulation, pricing mechanisms, and social pressure to convert externalities into liabilities that markets will manage.", "interdependencies": "Environment is entangled with every extractive and industrial domain. It regulates and services Energy (emissions, spill cleanup, renewable siting), Industry (pollution control, hazardous-waste handling), Agriculture (runoff, water use, soil and land conservation), and Infrastructure (water/sewer systems, landfills). It depends on Science for the ecology, toxicology, and climate research that define standards; on Technology and Industry for treatment, monitoring, and recycling equipment; on Finance for green bonds, carbon markets, and ESG capital; on the Economy and Trade, whose activity generates the waste and emissions and whose supply chains ESG services audit; on Governance and Law, which supply the entire regulatory and liability scaffolding (EPA, permits, Superfund) without which most of the domain would not be economically viable; on Energy and Infrastructure to run treatment plants and collection fleets; on Communication and Intelligence for satellite monitoring and environmental data; on Population and urban planning for land use and settlement patterns; on Medicine, through the environmental determinants of public health; on Culture, via parks, recreation, and environmental values; and on Religion, increasingly a voice in stewardship and climate ethics.", "regulationModel": "The domain is defined by regulation more than any other — its markets largely exist because the state has made pollution and contamination legally costly. In the U.S., the EPA administers the major statutes (Clean Air Act, Clean Water Act, RCRA for waste, CERCLA/Superfund for contaminated sites, Safe Drinking Water Act, TSCA for chemicals), often delegating permitting to state environmental agencies; the Army Corps of Engineers regulates wetlands and waters; the Department of the Interior (BLM, National Park Service, Fish and Wildlife Service) manages public lands, species, and parks; and NOAA manages oceans and fisheries. Environmental review runs through NEPA. Internationally, the UNFCCC/Paris framework governs climate, the Basel Convention governs hazardous-waste trade, and UNEP coordinates. Carbon markets are governed by compliance regulators (EU ETS, California ARB, RGGI) and, in the voluntary market, by private standard-setters and registries (Verra/VCS, Gold Standard) — a self-regulatory infrastructure. ESG and sustainability reporting is governed by emerging mandatory disclosure (EU CSRD, SEC climate rules, California SB 253/261) and voluntary frameworks (GRI, ISSB/IFRS S1-S2, TCFD, SBTi). Professionals self-regulate through certification (licensed professional engineers, Certified Hazardous Materials Managers, LEED APs) and industry associations."}, "view10k": {"overview": "The domain concentrates in NAICS Subsector 562 (Waste Management and Remediation Services): waste collection (5621), waste treatment and disposal including landfills and incinerators (5622), and remediation and other waste services including remediation (562910), materials recovery/recycling (562920), and septic/environmental cleanup. Water and wastewater utilities sit in 2213 (221310 water supply, 221320 sewage treatment). Environmental consulting and engineering sit in professional services (541620 environmental consulting, 541330/541370 engineering and surveying, 541380 testing labs). Conservation and land management sit in 924120 (government) and 813312 (environmental nonprofits), with parks in 712190 and 921 (public administration). Carbon-market and ESG-assurance activity is newer and maps to financial and consulting codes (523, 541611, 541690). Organizationally the domain blends investor-owned waste and consulting giants, municipal and regional utilities and authorities (the dominant form for water and much of waste), federal and state land/resource agencies, and conservation nonprofits and standard-setting bodies.", "businessTypes": [{"name": "Solid Waste Collection & Disposal Company", "naics": "562111, 562212, 562219", "definition": "An integrated firm that collects municipal, commercial, and industrial waste and disposes of it in landfills or waste-to-energy facilities, often vertically integrated across the chain.", "operations": "Revenue from collection fees (residential subscription and municipal franchise contracts), landfill tipping fees, and increasingly landfill-gas energy sales; the model prizes route density, landfill airspace as a depleting asset, and fleet efficiency. Capital-intensive with long-lived, permitted landfill assets.", "regulation": "EPA RCRA Subtitle D landfill standards, Clean Air Act (landfill gas), state solid-waste permitting, DOT for hauling; local franchise agreements; self-regulation via the National Waste & Recycling Association and SWANA.", "examples": "Waste Management, Republic Services, WM/Advanced Disposal, GFL Environmental"}, {"name": "Recycling & Materials Recovery Operator", "naics": "562920", "definition": "A facility that sorts, processes, and markets recyclable materials — paper, metals, glass, plastics — recovered from waste streams into commodity feedstocks.", "operations": "Revenue from selling baled recyclables into volatile commodity markets plus processing/tipping fees; operations run material recovery facilities (MRFs) with optical sorters and manual pickers. Profitability swings with commodity prices and contamination rates; scrap-metal recyclers trade globally.", "regulation": "EPA and state solid-waste rules, worker-safety (OSHA), export rules (Basel Convention on scrap); market and voluntary standards via ISRI (Recycled Materials Association) and the Recycling Partnership.", "examples": "Waste Management recycling division, SIMS Metal Management, Balcones Recycling, Rumpke"}, {"name": "Hazardous Waste Management Firm", "naics": "562211, 562112", "definition": "A specialized company that collects, treats, stores, and disposes of hazardous, medical, and industrial wastes under strict cradle-to-grave regulation.", "operations": "Revenue from treatment/disposal fees and turnkey industrial waste services; operations run permitted TSDFs (treatment, storage, disposal facilities), incinerators, and secure landfills, plus manifested transport. High regulatory barriers create durable margins and few permitted competitors.", "regulation": "EPA RCRA Subtitle C (cradle-to-grave manifest, permitted TSDFs), DOT hazmat transport, state environmental agencies; self-regulation via industry certification and rigorous EHS management systems.", "examples": "Clean Harbors, Veolia North America, Stericycle (medical waste), US Ecology"}, {"name": "Environmental Remediation Contractor", "naics": "562910", "definition": "A firm that cleans up contaminated soil, groundwater, and sites — Superfund sites, brownfields, spills, and decommissioned industrial land.", "operations": "Project-based revenue from responsible parties, governments, and developers; work includes site assessment, excavation, treatment (pump-and-treat, bioremediation, thermal), and long-term monitoring. Driven by CERCLA liability, brownfield redevelopment, and emerging contaminants (PFAS).", "regulation": "EPA CERCLA/Superfund and RCRA corrective action, state voluntary cleanup and brownfield programs, OSHA HAZWOPER for workers; professional oversight by licensed engineers and geologists.", "examples": "AECOM, Jacobs, Tetra Tech, Clean Harbors remediation"}, {"name": "Environmental Consulting & Engineering Firm", "naics": "541620, 541330, 541370", "definition": "A professional-services firm providing environmental assessment, permitting, compliance, and engineering — impact studies, air/water modeling, site investigations, and design.", "operations": "Fee-for-service and billable-hour revenue from industry and government clients needing permits, NEPA/EIS documents, Phase I/II site assessments, and compliance support; the model sells expert labor and regulatory navigation. Backlog and utilization drive economics.", "regulation": "Work product governed by EPA/state permitting and NEPA; professionals licensed as PEs, PGs, and certified (CHMM, CIH); self-regulation via NSPE and the National Association of Environmental Professionals.", "examples": "AECOM, Tetra Tech, Ramboll, ERM (Environmental Resources Management)"}, {"name": "Water & Wastewater Utility", "naics": "221310, 221320", "definition": "A utility that treats and distributes drinking water and collects and treats wastewater, operated by municipalities, regional authorities, or investor-owned companies.", "operations": "Revenue from volumetric water and sewer rates set to recover the cost of treatment plants, pipes, and pumping; the model is capital-intensive with massive long-lived infrastructure and deferred-maintenance challenges. Rate cases (for private utilities) and bond financing fund capital.", "regulation": "EPA Safe Drinking Water Act (MCLs) and Clean Water Act (NPDES discharge permits), state primacy agencies and public utility commissions (for investor-owned rates); self-regulation and standards via the American Water Works Association (AWWA).", "examples": "American Water, Veolia, municipal water departments, regional sanitation districts (e.g., DC Water)"}, {"name": "Environmental Testing Laboratory", "naics": "541380", "definition": "An analytical lab that tests environmental samples — water, soil, air, waste — for contaminants to support compliance, remediation, and monitoring.", "operations": "Per-sample fee revenue from consultants, industry, and utilities; the model runs high-throughput analytical instrumentation (GC-MS, ICP) under strict QA/QC and chain-of-custody. Accreditation and turnaround time are competitive differentiators.", "regulation": "EPA-approved methods, state and NELAP/TNI laboratory accreditation, chain-of-custody legal standards; ISO/IEC 17025 accreditation; self-regulation via accreditation bodies.", "examples": "Eurofins Environment Testing, SGS, Pace Analytical, ALS Global"}, {"name": "Conservation Nonprofit / Land Trust", "naics": "813312", "definition": "A nonprofit that protects natural land, water, and biodiversity through acquisition, conservation easements, restoration, and advocacy.", "operations": "Funded by membership, philanthropy, grants, and government partnerships; the model acquires land or easements to permanently protect it, stewards preserves, and advocates policy. Measured by acres protected, ecological outcomes, and endowment for stewardship.", "regulation": "IRS 501(c)(3) and conservation-easement tax rules, state property law; self-regulation and accreditation via the Land Trust Alliance (Land Trust Accreditation Commission); partnerships with USFWS/BLM.", "examples": "The Nature Conservancy, Trust for Public Land, Ducks Unlimited, local land trusts"}, {"name": "Carbon Market Developer / Offset Project Firm", "naics": "523210, 541690", "definition": "A firm that develops, verifies, and trades carbon credits — from forestry, methane capture, renewable energy, or engineered removal — for compliance and voluntary markets.", "operations": "Revenue from originating offset projects and selling credits, or from trading and brokerage; the model requires measurable, verifiable, additional, and permanent emissions reductions certified by third-party auditors and issued on a registry. Prices are volatile and integrity-sensitive.", "regulation": "Compliance markets regulated by government programs (EU ETS, California ARB cap-and-trade, RGGI); voluntary markets self-regulated by standard-setters and registries (Verra/VCS, Gold Standard) and oversight bodies (ICVCM, VCMI).", "examples": "Verra (standard), South Pole, Climate Impact Partners, Xpansiv (CBL exchange)"}, {"name": "ESG & Sustainability Services / Assurance Firm", "naics": "541611, 541690, 541990", "definition": "A consultancy or assurance provider that advises on and verifies corporate environmental, social, and governance performance and mandatory sustainability disclosures.", "operations": "Advisory and audit-style fees for ESG strategy, GHG inventories, materiality assessments, and third-party assurance of sustainability reports; demand is driven by mandatory disclosure (CSRD, SEC, California) and investor pressure. Big-4 accounting firms dominate assurance.", "regulation": "Emerging mandatory disclosure regimes (EU CSRD, SEC climate rule, California SB 253/261); voluntary frameworks (GRI, ISSB/IFRS S1-S2, TCFD, SBTi); assurance under ISAE 3000/AA1000; professional bodies (AICPA, IFAC).", "examples": "Deloitte, PwC, EY, KPMG sustainability practices; ERM; Sustainalytics/MSCI ESG (ratings)"}, {"name": "Public Land, Parks & Natural Resource Agency", "naics": "924120, 712190", "definition": "A government agency that manages public lands, forests, parks, wildlife, and natural resources for conservation, recreation, and multiple use.", "operations": "Appropriations- and fee-funded (entrance/user fees, grazing/timber leases); functions include land and species management, recreation, wildfire management, permitting of resource use, and enforcement. Not profit-driven; measured by resource health, visitation, and stewardship outcomes.", "regulation": "Operates as regulator under organic statutes (National Park Service Organic Act, FLPMA for BLM, Endangered Species Act for USFWS), NEPA; congressional and state oversight.", "examples": "National Park Service, U.S. Forest Service, Bureau of Land Management, state departments of natural resources"}, {"name": "Renewable / Environmental Infrastructure Developer", "naics": "562213, 221118", "definition": "A developer of environmental infrastructure such as waste-to-energy plants, landfill-gas-to-energy, composting, and anaerobic digestion facilities.", "operations": "Revenue from tipping fees plus energy and commodity (compost, RNG) sales, often supported by renewable credits (RINs, RECs); the model converts waste liabilities into energy and product streams. Capital-intensive with long-term feedstock and offtake contracts.", "regulation": "EPA Clean Air Act and RCRA, state energy and environmental permitting, renewable-fuel programs (EPA RFS); self-regulation via SWANA and industry associations.", "examples": "Covanta (Reworld), Anaergia, landfill-gas projects by Archaea/BP, composting operators"}, {"name": "Spill Response & Emergency Environmental Services", "naics": "562910, 562119", "definition": "A firm providing rapid response to oil, chemical, and hazardous-material spills and environmental emergencies, plus containment and cleanup.", "operations": "On-call and event-driven revenue from responsible parties and governments; the model maintains trained crews, equipment, and 24/7 readiness for spills, natural disasters, and industrial releases, billing time-and-materials. Retainer relationships with industry stabilize revenue.", "regulation": "EPA (Oil Pollution Act, National Contingency Plan), Coast Guard for marine spills, OSHA HAZWOPER; industry standards for emergency response.", "examples": "Clean Harbors, US Ecology emergency response, NRC Group, Marine Spill Response Corporation"}], "regulators": [{"name": "U.S. Environmental Protection Agency (EPA)", "jurisdiction": "US (federal)", "role": "Administers the core environmental statutes (Clean Air Act, Clean Water Act, RCRA, CERCLA/Superfund, Safe Drinking Water Act, TSCA), sets national standards and permits, oversees Superfund cleanups, and delegates implementation to states."}, {"name": "State Environmental Agencies (delegated authority)", "jurisdiction": "US (state)", "role": "Implement and enforce delegated federal programs plus state law — issuing air, water (NPDES), and waste permits, running voluntary cleanup and brownfield programs, and inspecting facilities."}, {"name": "U.S. Department of the Interior (NPS, BLM, USFWS) & USDA Forest Service", "jurisdiction": "US (federal)", "role": "Manage public lands, national parks, forests, wildlife, and endangered species; regulate resource use (grazing, mining, timber) and administer the Endangered Species Act."}, {"name": "UNFCCC / Paris Agreement Secretariat & UNEP", "jurisdiction": "Global", "role": "Set the international climate framework, coordinate national emissions commitments and reporting, and administer global environmental cooperation and treaties (ozone, biodiversity, hazardous-waste trade under Basel)."}, {"name": "Verra (VCS) & Gold Standard / ICVCM", "jurisdiction": "Global (standard-setters / SRO)", "role": "Set methodologies, verify, and register voluntary carbon credits, and (ICVCM/VCMI) set integrity principles for the voluntary carbon market — the self-regulatory backbone of carbon trading."}, {"name": "ISSB (IFRS Foundation), GRI & SBTi", "jurisdiction": "Global (standard-setters / SRO)", "role": "Set sustainability-disclosure and target-setting standards (IFRS S1/S2, GRI Standards, science-based targets) that underpin ESG reporting and increasingly feed mandatory regimes."}, {"name": "Land Trust Accreditation Commission (Land Trust Alliance)", "jurisdiction": "US (accreditor / SRO)", "role": "Accredits land trusts against national conservation standards and practices, providing self-regulatory quality assurance for the conservation-nonprofit sector."}, {"name": "American Water Works Association (AWWA) & SWANA / NWRA", "jurisdiction": "US (industry associations / SRO)", "role": "Set voluntary technical standards, operator certification, and best practices for water utilities (AWWA) and solid-waste management (SWANA, NWRA) — industry self-regulation complementing EPA rules."}]}, "groundView": {"orgModel": "Organizations in this domain take three forms. A publicly traded waste or consulting firm is governed by a board and CEO, with a C-suite that prominently features a chief sustainability/EHS officer and heavy environmental-compliance and legal functions; operations run through regional/area managers, district managers, and site/plant managers over a large frontline of drivers, plant operators, technicians, and field crews, with a parallel professional cadre of engineers, geologists, and scientists who sign off on regulated work. A municipal water utility or waste authority is governed by a board or elected officials and a general manager/director, with engineering, operations, and finance divisions, licensed treatment-plant operators, and field maintenance crews. A conservation nonprofit is governed by a board and executive director, with program directors for land protection, stewardship, and science, field conservation staff, and development/advocacy arms. Across all forms, the licensed professional (PE, PG, certified operator) is a load-bearing figure because regulated deliverables must legally be signed by credentialed experts, and the frontline (drivers, operators, field techs) is where environmental compliance is physically executed.", "positions": [{"title": "Board Director / Commission Member", "level": "Governance", "reportsTo": "Shareholders (corporate) or the electorate/appointing authority (public)", "duties": "Sets strategy and risk appetite, oversees environmental and safety performance and liability, hires/evaluates the CEO or general manager, and approves major capital and rate decisions. Measured by financial performance, regulatory standing, and environmental-incident record.", "credentials": "Business, engineering, environmental, or public-service leadership; no formal requirement.", "socCode": "11-1011"}, {"title": "Chief Executive Officer / General Manager", "level": "Executive", "reportsTo": "Board of Directors / Governing Commission", "duties": "Leads overall strategy, growth, regulatory relations, and capital allocation; for utilities, owns rate strategy and infrastructure investment. Measured by revenue/margin (or rate stability), safety, environmental compliance, and system reliability.", "credentials": "MBA or engineering degree; extensive sector leadership; PE valued in technical firms/utilities.", "socCode": "11-1011"}, {"title": "Chief Sustainability Officer / VP of EHS", "level": "Executive", "reportsTo": "CEO", "duties": "Owns environmental, health, safety, and sustainability strategy: compliance systems, emissions and ESG reporting, permit management, and incident prevention. Measured by regulatory violations, safety rates (TRIR), emissions targets, and disclosure quality.", "credentials": "Advanced degree in environmental science/engineering or sustainability; CHMM/CSP; ESG reporting expertise.", "socCode": "11-9199"}, {"title": "VP of Operations", "level": "Executive", "reportsTo": "CEO / COO", "duties": "Runs collection, treatment, or field-service operations across regions: fleet, plants, safety, service delivery, and operating budget. Measured by operating cost, service reliability, safety, and asset utilization.", "credentials": "Engineering or operations-management background; sector experience; PE for utilities.", "socCode": "11-1021"}, {"title": "Regional / District Manager", "level": "Management", "reportsTo": "VP of Operations", "duties": "Manages operations across multiple sites or routes in a territory: budget, staffing, safety, customer contracts, and regulatory compliance. Measured by P&L, route/plant efficiency, safety, and contract retention.", "credentials": "Bachelor's in business/engineering; operations experience; safety certifications.", "socCode": "11-1021"}, {"title": "Landfill / Treatment Plant Manager", "level": "Management", "reportsTo": "Regional/District Manager", "duties": "Runs a permitted facility day to day: operations, environmental monitoring and reporting, permit compliance, safety, and maintenance. Measured by compliance (no violations/exceedances), throughput, cost, and safety.", "credentials": "Bachelor's (engineering/environmental) or equivalent; state facility-operator certification; SWANA credentials for landfills.", "socCode": "11-9021"}, {"title": "Project Manager (Remediation/Consulting)", "level": "Management", "reportsTo": "Program/Practice Director", "duties": "Leads environmental projects: scope, budget, schedule, client management, regulatory coordination, and technical quality across site assessments and cleanups. Measured by project profitability, on-time/on-budget delivery, and client satisfaction.", "credentials": "Bachelor's/master's in environmental engineering, geology, or science; PE/PG; PMP; often CHMM.", "socCode": "11-9041"}, {"title": "Environmental Engineer", "level": "Professional", "reportsTo": "Engineering Manager / Project Manager", "duties": "Designs treatment systems, pollution controls, remediation approaches, and infrastructure; prepares permits and models; stamps regulated engineering deliverables. Measured by design quality, permit success, and project outcomes.", "credentials": "Bachelor's/master's in environmental or civil engineering; EIT then Professional Engineer (PE) license.", "socCode": "17-2081"}, {"title": "Environmental Scientist / Hydrogeologist", "level": "Professional", "reportsTo": "Project Manager / Technical Director", "duties": "Conducts site investigations, samples soil/water/air, interprets contamination and hydrogeology, models fate and transport, and authors technical and regulatory reports. Measured by data quality, report defensibility, and regulatory acceptance.", "credentials": "Bachelor's/master's in environmental science, geology, or hydrogeology; Professional Geologist (PG) license; 40-hour HAZWOPER.", "socCode": "19-2041"}, {"title": "Sustainability / ESG Analyst", "level": "Professional", "reportsTo": "Chief Sustainability Officer / ESG Manager", "duties": "Compiles GHG inventories, tracks ESG metrics, prepares sustainability and climate disclosures, conducts materiality assessments, and supports assurance. Measured by data accuracy, disclosure timeliness, and framework compliance.", "credentials": "Bachelor's/master's in environmental science, sustainability, or finance; GHG accounting and framework (GRI/ISSB/TCFD) knowledge; SASB/GARP-SCR credentials valued.", "socCode": "13-1199"}, {"title": "Water/Wastewater Treatment Plant Operator", "level": "Professional", "reportsTo": "Plant Manager / Chief Operator", "duties": "Operates and monitors treatment processes, adjusts chemical dosing and equipment, performs lab tests, and maintains compliance with discharge and drinking-water standards; often on rotating shifts. Measured by permit compliance, water quality, and uptime.", "credentials": "High school/associate plus state operator certification (graded I-V by system size); continuing education.", "socCode": "51-8031"}, {"title": "Conservation Program Director / Land Steward", "level": "Professional", "reportsTo": "Executive Director / Conservation VP", "duties": "Leads land protection and stewardship: negotiates acquisitions and easements, plans restoration, manages preserves, and monitors ecological outcomes and easement compliance. Measured by acres protected, stewardship quality, and easement defense.", "credentials": "Bachelor's/master's in ecology, natural-resource management, or conservation; land-protection and GIS skills.", "socCode": "19-1031"}, {"title": "Carbon Project Developer / MRV Specialist", "level": "Professional", "reportsTo": "Project Director", "duties": "Designs offset projects to registry methodologies, handles measurement/reporting/verification (MRV), coordinates third-party validation, and manages credit issuance. Measured by verified credit volume, project integrity, and validation success.", "credentials": "Degree in environmental science, forestry, or engineering; expertise in carbon standards (VCS, Gold Standard) and GHG quantification.", "socCode": "19-2041"}, {"title": "Refuse & Recyclable Material Collection Driver", "level": "Operational", "reportsTo": "Route Supervisor / Operations Manager", "duties": "Operates collection trucks on assigned routes, collects and transports residential/commercial waste and recyclables, performs vehicle inspections, and follows safety and traffic protocols. Measured by route completion, safety record, and service quality.", "credentials": "Commercial Driver's License (CDL Class B); DOT physical; on-the-job safety training.", "socCode": "53-7081"}, {"title": "Hazardous Materials Removal / Remediation Worker", "level": "Operational", "reportsTo": "Site Supervisor / Field Foreman", "duties": "Performs field cleanup — excavation, decontamination, containment, drum handling, asbestos/lead abatement — in personal protective equipment under safety plans. Measured by safety compliance, task completion, and adherence to the site health-and-safety plan.", "credentials": "High school diploma; OSHA 40-hour HAZWOPER; asbestos/lead abatement licenses as required.", "socCode": "47-4041"}, {"title": "MRF Sorter / Recycling Processing Worker", "level": "Operational", "reportsTo": "MRF Supervisor", "duties": "Sorts recyclable materials on processing lines, removes contamination, operates balers and equipment, and maintains line safety and throughput. Measured by sort quality (contamination rate), throughput, and safety.", "credentials": "High school diploma or less; on-the-job and safety training.", "socCode": "53-7062"}, {"title": "Park Ranger / Conservation Field Worker", "level": "Operational", "reportsTo": "Park Superintendent / Field Supervisor", "duties": "Patrols and maintains public lands and preserves, educates visitors, enforces regulations, supports habitat restoration and trail work, and assists with wildfire and resource management. Measured by resource condition, visitor safety/experience, and compliance.", "credentials": "Associate/bachelor's in natural resources or related field; law-enforcement certification for commissioned rangers; wildland-fire training as needed.", "socCode": "33-9092"}, {"title": "Environmental / Field Sampling Technician", "level": "Operational", "reportsTo": "Environmental Scientist / Project Manager", "duties": "Collects field samples, installs and monitors wells and instruments, maintains chain-of-custody, calibrates equipment, and logs field data supporting investigations. Measured by sampling accuracy, data completeness, and protocol adherence.", "credentials": "Associate/bachelor's in environmental science or related; 40-hour HAZWOPER; field-methods training.", "socCode": "19-4042"}]}}, {"id": "governance", "name": "Governance", "icon": "🏛️", "tagline": "The institutional machinery by which societies make, execute, and legitimize collective decisions.", "view100k": {"role": "Governance is civilization's operating system: the constellation of constitutions, legislatures, executives, agencies, municipalities, intergovernmental organizations, and civil-society counterweights through which a population converts contested preferences into binding collective action. It exists because markets alone cannot supply public goods (defense, courts, standards, clean air), cannot internalize externalities, and cannot legitimize coercion. Economists from Adam Smith to Douglass North have framed the state as the ultimate 'rules of the game' institution — the monopoly supplier of enforceable property rights, contract enforcement, and dispute resolution upon which every other domain's transaction costs depend. In NAICS terms it is Sector 92 (Public Administration), but its economic footprint dwarfs that classification: general government spending runs roughly 35-45% of GDP in most OECD economies. In the United States alone, combined federal, state, and local expenditure exceeds $10 trillion annually, and government at all levels employs roughly 23 million people — about 2.2 million federal civilians, 5+ million state workers, and 14+ million local employees, making local government the single largest employer category in the country.\n\nThe historical arc runs from temple-palace administration in Sumer and Egypt, through the Chinese imperial civil service (the first meritocratic examination bureaucracy, c. 605 CE), Roman provincial administration, medieval charters and estates, to the Westphalian sovereign state (1648), the Weberian rational-legal bureaucracy of the 19th century, and the 20th-century administrative and welfare state. Since 1945 a supranational layer has been grafted on: the United Nations system, the Bretton Woods institutions, the EU's pooled sovereignty, and roughly 40,000+ international NGOs forming a global civil society. The late-20th-century 'New Public Management' movement imported private-sector performance disciplines — outsourcing, performance budgeting, citizen-as-customer — creating today's vast government-contracting economy (the U.S. federal government alone obligates over $700 billion per year to contractors) and the professionalized lobbying, public-affairs, and think-tank industries that intermediate between state and society.\n\nStructurally, the domain is unique among the twenty because it is both a player and the referee: it produces the legal and fiscal architecture within which every other domain operates, while simultaneously competing for talent, capital, and legitimacy. Its 'revenue model' is compulsory (taxation, fees, seigniorage) rather than voluntary exchange, which is precisely why its accountability machinery — elections, audits, courts, free press, freedom-of-information regimes — is the most elaborate self-monitoring apparatus in any domain.", "interdependencies": "Governance is the keystone dependency of the other nineteen domains. It charters and supervises Finance (central banks, securities regulators), sets the fiscal and monetary frame of the Economy, negotiates Trade treaties and tariff schedules, subsidizes and inspects Agriculture, finances and permits Infrastructure, licenses Industry and Energy (utilities commissions, environmental permits), funds basic Science and steers Technology through procurement and standards bodies, mandates and finances Education and Medicine (public schools, NHS/Medicare-type systems), counts and channels Population through census, immigration, and vital-records systems, stewards the Environment via EPA-type agencies and treaty regimes, and is the exclusive principal of Defense and Intelligence, which exist only as its instruments. Law is its codified output and its principal constraint; Communication infrastructure carries its mandates and its electoral discourse; Culture and Religion supply the legitimacy narratives — civic rituals, shared identity, moral vocabularies — without which compliance would rest on coercion alone. In return, governance consumes energy, food, buildings, telecommunications, and above all tax revenue generated by the productive domains: a fiscal circulatory system in which the state is both heart and valve.", "regulationModel": "Governance is governed by constitutionalism: entrenched higher law that distributes power horizontally (separation of powers among legislature, executive, judiciary) and vertically (federalism, subsidiarity, home-rule charters), enforced by judicial review. Layered on this are dedicated oversight institutions — supreme audit institutions (the U.S. GAO, the UK NAO, INTOSAI's global network), inspectors general, ombudsmen, ethics commissions (U.S. Office of Government Ethics, state ethics boards), election administration and campaign-finance regulators (FEC, Election Assistance Commission), and lobbying-transparency regimes (the Lobbying Disclosure Act of 1995, the Foreign Agents Registration Act administered by DOJ). International law and peer mechanisms (UN Charter obligations, treaty bodies, OECD anti-bribery and open-government reviews, GRECO in Europe) discipline states externally. Self-regulation operates through professional bodies such as the International City/County Management Association (ICMA) with its enforceable Code of Ethics, ASPA for public administrators, and NASPO for procurement officials. Ultimately the domain answers to the bluntest accountability instruments in existence: periodic elections, a free press, freedom-of-information statutes, and the exit option of mobile citizens and capital."}, "view10k": {"overview": "The domain organizes into a public core classified under NAICS Sector 92 (Public Administration) — 9211 executive, legislative, and general government; 9221 justice and public order; 923-926 functional program administration; 927 space; 928 national security and international affairs — surrounded by a private and nonprofit periphery: government-services contractors (5416 management/scientific consulting, 5415 computer systems design, 5612 facilities support), lobbying and public-affairs firms (541820 Public Relations Agencies plus 541110 law-firm government-relations practices), think tanks and policy research (541720, 813319), grantmaking foundations (813211), social-advocacy NGOs (81331x), political organizations (813940), and intergovernmental bodies (928120 International Affairs). Elections infrastructure spans public election offices (921190) and a small oligopoly of certified voting-system vendors. The distinguishing economics: the public core is funded by compulsory levies and appropriations and 'competes' through elections and mandates; the periphery is funded by contracts, grants, dues, and donations and competes in conventional markets for the state's attention and money.", "businessTypes": [{"name": "Federal Executive Department / Agency", "naics": "921110, 921190 (plus functional codes 923-928)", "definition": "A cabinet-level department or independent agency exercising delegated statutory authority to execute national law, deliver programs, and issue binding regulations.", "operations": "Funded through congressional appropriations (discretionary) or statutory formulas (mandatory/entitlement spending); operates on an annual budget-formulation cycle run through OMB, executes via program offices, grants, and procurement, and rulemaking under the Administrative Procedure Act. Day-to-day work is program administration, regulatory enforcement, benefit adjudication, and contract management by a tenured civil service under political appointees.", "regulation": "Overseen by Congress (authorizing and appropriations committees), GAO audits, agency Inspectors General, OMB (budget and regulatory review via OIRA), and judicial review of agency action. Internally governed by the APA, the civil-service merit system (OPM/MSPB), and ethics rules administered by OGE.", "examples": "U.S. Department of the Treasury; Department of Health and Human Services; Environmental Protection Agency; Social Security Administration"}, {"name": "Legislative Body", "naics": "921120", "definition": "An elected assembly holding the power to enact statutes, levy taxes, appropriate funds, and oversee the executive — the constitutional locus of the purse and the law.", "operations": "Funded by its own appropriation; organized into committees that draft, mark up, and report legislation, hold oversight hearings, and confirm appointees. Members run personal offices for constituent casework while professional staff (committee counsel, CBO/CRS-type analysts) supply the analytical machinery; output is measured in enacted law, budgets passed, and oversight findings.", "regulation": "Constrained by constitutional rules, bicameralism, and judicial review; internally self-regulated through chamber rules, ethics committees (House and Senate Ethics), and disclosure regimes (financial disclosure, STOCK Act). GAO and CBO serve as its analytic arms.", "examples": "U.S. Congress; UK Parliament; California State Legislature; European Parliament"}, {"name": "State / Provincial Government", "naics": "921110-921190 (state level)", "definition": "The intermediate sovereign in federal systems, holding plenary police powers over health, safety, education, and welfare not delegated to the national government.", "operations": "Funded by state inco
