ors, malware reverse-engineering labs, dark-web collection, and analyst teams publishing named-actor reporting (APT designations). Renewal rates and detection efficacy drive the business.", "regulation": "Overseen as software/services firms (FTC, SEC disclosure rules); collection is bounded by the CFAA (no unauthorized access), sanctions law (ransom-payment advisories from OFAC), and responsible-disclosure norms; self-regulation through the FIRST community standards, the Traffic Light Protocol, and vetted sharing bodies like ISACs.", "examples": "Recorded Future; Mandiant (Google); CrowdStrike Intelligence; Flashpoint"}, {"name": "OSINT & Analytics Platform Provider", "naics": "511210, 518210", "definition": "Software firms whose platforms fuse open and licensed data — social media, corporate registries, shipping and flight data, breach corpora — into link-analysis and monitoring environments used by governments, banks, and journalists.", "operations": "License-based revenue with professional-services attach; engineering-heavy operations building collectors, translation/NLP pipelines, entity-resolution graphs, and analyst workbenches. Government contracts (often classified deployments) coexist with commercial compliance and journalism customers.", "regulation": "Bound by platform terms-of-service and anti-scraping litigation risk, privacy statutes (GDPR, state laws), export controls for government-grade analytics, and procurement rules when selling to agencies; self-regulation via human-rights due-diligence policies on end users.", "examples": "Palantir Technologies; Babel Street; Maltego; Sayari Labs"}, {"name": "Commercial Geospatial Intelligence Provider", "naics": "517410, 541370, 334220", "definition": "Operators of imaging-satellite constellations and analytic shops that sell electro-optical, radar (SAR), and RF-sensing data and derived analytics once exclusive to national systems.", "operations": "Revenue from government EOCL-type contracts, defense and intelligence task orders, and commercial monitoring subscriptions (agriculture, insurance, supply chains); operations span satellite manufacturing/operations, ground stations, cloud processing, and analytic teams converting pixels into activity reports.", "regulation": "Licensed by NOAA's Commercial Remote Sensing Regulatory Affairs office (imaging licenses with shutter-control provisions), the FCC (spectrum), and export controls on sensor technology; industry coordinates through USGIF, which also runs GEOINT certification programs.", "examples": "Maxar Intelligence; Planet Labs; BlackSky; ICEYE (SAR)"}, {"name": "Background Screening & Vetting Firm", "naics": "561611", "definition": "High-volume consumer-reporting agencies that verify identity, criminal history, employment, education, and credentials for employers, landlords, and gig platforms — plus contractors supporting government personnel vetting.", "operations": "Per-report and platform-subscription pricing at industrial scale (millions of checks annually); operations are automated court-record retrieval, verification call centers, adjudication workflow software, and dispute-resolution units mandated by law. Turnaround time and accuracy are the competitive metrics.", "regulation": "Squarely regulated as consumer reporting agencies under the FCRA (accuracy, permissible purpose, adverse-action process), enforced by the CFPB and FTC, plus state ban-the-box and clean-slate laws; self-regulated through Professional Background Screening Association (PBSA) accreditation.", "examples": "HireRight; Sterling (First Advantage); Checkr; Peraton (federal vetting support)"}], "regulators": [{"name": "Office of the Director of National Intelligence (ODNI)", "jurisdiction": "US", "role": "Heads the intelligence community: sets collection priorities and analytic standards (Intelligence Community Directives), builds the National Intelligence Program budget, and governs security clearances and information-sharing policy across all 18 elements."}, {"name": "Senate Select Committee on Intelligence (SSCI) and House Permanent Select Committee on Intelligence (HPSCI)", "jurisdiction": "US", "role": "Authorize intelligence budgets, receive mandatory notification of covert action findings and significant activities, conduct closed oversight hearings, and investigate failures (e.g., post-9/11, detention programs); the constitutional check on secret power."}, {"name": "Foreign Intelligence Surveillance Court (FISC)", "jurisdiction": "US", "role": "An Article III court that reviews and approves electronic surveillance and physical-search applications under FISA, certifies Section 702 targeting and minimization procedures, and appoints amici to argue novel civil-liberties questions."}, {"name": "Privacy and Civil Liberties Oversight Board (PCLOB) and the IC Inspector General", "jurisdiction": "US", "role": "PCLOB independently reviews counterterrorism programs for privacy impact and publishes influential public reports (215, 702); the IC IG and agency IGs audit and investigate within classified channels, with protected whistleblower intake."}, {"name": "Federal Trade Commission and Consumer Financial Protection Bureau", "jurisdiction": "US", "role": "The FTC polices data brokers and commercial surveillance under FTC Act Section 5 (deception/unfairness, sensitive-data enforcement); the CFPB enforces the FCRA against background screeners and data sellers whose reports affect credit, employment, or housing eligibility."}, {"name": "State Private Investigator Licensing Boards", "jurisdiction": "US states", "role": "License private investigators and investigative agencies — experience thresholds, examinations, bonding, and discipline — defining the legal perimeter for commercial human-inquiry work in almost every state."}, {"name": "Strategic and Competitive Intelligence Professionals (SCIP)", "jurisdiction": "Global (self-regulatory)", "role": "The professional body for competitive intelligence; its Code of Ethics — comply with all laws, disclose identity before interviews, honor confidentiality, avoid conflicts — is the industry's normative firewall between CI and industrial espionage."}, {"name": "European Data Protection Board / national DPAs (GDPR regime)", "jurisdiction": "EU/Global reach", "role": "Enforce the GDPR's lawful-basis, purpose-limitation, and transfer rules against data brokers, OSINT platforms, and due-diligence firms processing EU personal data, with fines up to 4% of global turnover shaping worldwide data-handling architecture."}]}, "groundView": {"orgModel": "A national intelligence agency is organized around the intelligence cycle: a director and deputy (Executive) atop directorates for collection/operations, analysis, science & technology, and mission support (security, HR, finance), overlaid by mission centers that fuse disciplines against priority targets (counterterrorism, a specific region, counterproliferation). Compartmentation is the defining structural feature — access flows by clearance plus need-to-know, not rank — and embedded oversight (IG, general counsel, privacy and compliance officers) sits inside the wire by statute. Analytic units run on a production model: analysts draft, coordinate across agencies, and publish through review chains enforcing tradecraft standards, with a watch floor operating 24/7 for indications and warning. A commercial intelligence or risk firm mirrors this in miniature: a partnership or corporate board, practice leads (due diligence, cyber, geopolitical), engagement managers running client projects, analysts and licensed investigators executing collection and drafting, and a general counsel gate-checking every collection method for legality. Threat-intel vendors are software companies with an analyst newsroom attached: engineering builds the platform, an intelligence directorate of named-actor teams publishes reporting, and customer-success teams drive renewals.", "positions": [{"title": "Congressional Intelligence Committee Member", "level": "Governance", "reportsTo": "The electorate / chamber leadership", "duties": "Exercises the legislative check on secret agencies: reviews budgets line by line in closed session, receives covert-action notifications, questions agency heads in oversight hearings, and legislates surveillance authorities (FISA reauthorizations). Measured by oversight rigor and legislative product; sworn to protect classified information.", "credentials": "Election plus appointment by chamber leadership; TS/SCI-equivalent access by virtue of office; legal or national-security background typical", "socCode": "11-1031"}, {"title": "Director of National Intelligence", "level": "Governance", "reportsTo": "President of the United States", "duties": "Heads the intelligence community: principal intelligence adviser to the President, sets the National Intelligence Priorities Framework, submits the consolidated NIP budget, and enforces community standards on analysis, clearances, and information sharing. Measured by warning performance and community integration.", "credentials": "Presidential appointment with Senate confirmation; extensive national-security experience required by statute; TS/SCI with all compartments", "socCode": "11-1011"}, {"title": "Agency Director (e.g., D/CIA)", "level": "Executive", "reportsTo": "Director of National Intelligence / President", "duties": "Commands a collection agency: approves sensitive operations within presidential findings, allocates budget across mission centers, represents the agency to Congress and foreign partners, and owns workforce, security, and analytic quality. Personally accountable for operational failures and compliance breaches.", "credentials": "Presidential appointment, Senate confirmation; career intelligence, military, or senior policy background; TS/SCI full-scope polygraph", "socCode": "11-1011"}, {"title": "Chief Executive, Risk & Intelligence Consultancy", "level": "Executive", "reportsTo": "Board of Directors / Private-equity owner", "duties": "Sets practice strategy (which markets, which services), owns firm reputation — the sole asset in an integrity business — and manages conflicts-of-interest architecture between clients. Drives partner recruitment, pricing, and jurisdiction risk decisions (which countries the firm will and will not work in).", "credentials": "Typically former senior investigator, prosecutor, journalist, or intelligence officer; JD or MBA common; no license required at firm level though many principals hold PI licenses", "socCode": "11-1011"}, {"title": "Deputy Director for Analysis / Chief Analytic Officer", "level": "Executive", "reportsTo": "Agency Director", "duties": "Owns the analytic directorate: production priorities, tradecraft standards (ICD 203 compliance), analyst training, and the quality of finished intelligence up to the President's Daily Brief. Arbitrates analytic disputes and dissent channels; measured by product accuracy, timeliness, and policymaker uptake.", "credentials": "20+ years analytic career; advanced degree (regional studies, economics, sciences); TS/SCI; senior executive service appointment", "socCode": "11-1011"}, {"title": "Mission Center Director / Practice Leader", "level": "Management", "reportsTo": "Deputy Director / Managing Partner", "duties": "Runs a fused team against one target set (a region, counterproliferation, a client industry): integrates collectors and analysts, sets collection requirements, owns the operational and production plan, and briefs seniors. In commercial firms, the analog practice leader owns the P&L, staffing, and quality of a service line.", "credentials": "Senior intelligence officer rank or partner-level standing; deep target/domain expertise; TS/SCI (government); relevant certifications (CFE, CAMS) commercially", "socCode": "11-9199"}, {"title": "Collection Manager", "level": "Management", "reportsTo": "Mission Center Director / Directorate of Operations", "duties": "Translates analysts' intelligence gaps into formal collection requirements, arbitrates scarce collection resources (satellite passes, linguist hours) across competing demands, evaluates whether collected material answered the need, and closes the feedback loop. The traffic controller of the intelligence cycle.", "credentials": "Journeyman intelligence career; collection-management professional certification (agency internal); TS/SCI", "socCode": "11-9199"}, {"title": "Engagement Manager (Due Diligence / Investigations)", "level": "Management", "reportsTo": "Practice Leader / Partner", "duties": "Scopes and prices client engagements, assembles investigator-analyst teams, supervises collection plans for legality (counsel sign-off), edits reports to evidentiary standard, and presents findings to clients and outside counsel. Owns engagement margin, deadlines, and source protection.", "credentials": "JD, MBA, or master's in international affairs; PI license in licensing states; CFE (Certified Fraud Examiner) widely held; 5-10 years investigative experience", "socCode": "11-9199"}, {"title": "All-Source Intelligence Analyst", "level": "Professional", "reportsTo": "Analytic Team Chief / Mission Center Director", "duties": "Fuses reporting from every discipline into written assessments: drafts current-intelligence pieces and longer estimative products, expresses calibrated uncertainty, coordinates judgments across agencies, and briefs policymakers or commanders. Measured against tradecraft standards — sourcing, alternative analysis, precision of probability language.", "credentials": "Bachelor's/master's in international relations, regional studies, economics, or STEM; agency analytic training (e.g., career analyst program); TS/SCI, often polygraph", "socCode": "33-3021"}, {"title": "Competitive Intelligence Analyst (Corporate)", "level": "Professional", "reportsTo": "Director of Market/Competitive Intelligence", "duties": "Tracks competitor product launches, pricing, hiring, patents, and earnings signals; runs win/loss interview programs; maintains battlecards for sales; and delivers early warning on strategic moves to product and executive teams. Operates strictly within SCIP ethical rules — no misrepresentation, no trade-secret misappropriation.", "credentials": "Bachelor's/MBA; SCIP certification (CIP); skills in primary research, financial analysis, and patent analytics", "socCode": "13-1161"}, {"title": "Due-Diligence Investigator / Corporate Investigator", "level": "Professional", "reportsTo": "Engagement Manager", "duties": "Executes lawful collection: multi-jurisdictional public-record sweeps (litigation, liens, corporate registries, sanctions lists), discreet human-source interviews with counsel-approved protocols, and asset-tracing analysis; writes findings with full sourcing for use in transactions or litigation. Accuracy and legal defensibility are the performance bar.", "credentials": "State PI license (where required); bachelor's; CFE or CAMS; language skills and jurisdiction expertise command premiums", "socCode": "33-9021"}, {"title": "OSINT Analyst", "level": "Professional", "reportsTo": "Collection Manager / Engagement Manager", "duties": "Collects and verifies open-source material — social media, satellite imagery, corporate filings, shipping/flight trackers, leaked-data corpora handled under counsel guidance — using sock-free, ToS-conscious tradecraft; geolocates and chronolocates imagery; documents provenance chains so findings survive scrutiny.", "credentials": "Bachelor's; OSINT tradecraft training (SANS SEC487, Bellingcat workshops); platform certifications (Maltego, i2); clearance for government work", "socCode": "33-3021"}, {"title": "Cyber Threat Intelligence Analyst", "level": "Professional", "reportsTo": "Director of Threat Intelligence", "duties": "Tracks named threat actors: clusters intrusions by tooling and infrastructure, reverse-engineers malware behaviors with the RE team, maps activity to MITRE ATT&CK, writes actor profiles and flash reports, and answers customer requests for information. Attribution rigor and speed-to-publish are the metrics.", "credentials": "BS in computer science or equivalent; GCTI (GIAC Cyber Threat Intelligence), CISSP; scripting and malware-analysis fundamentals", "socCode": "15-1212"}, {"title": "GEOINT / Imagery Analyst", "level": "Professional", "reportsTo": "GEOINT Team Lead", "duties": "Exploits electro-optical, radar, and multispectral imagery: identifies equipment and facilities, measures change over time, fuses imagery with signals and open sources, and produces annotated graphics and activity assessments for analysts and operators. Certified against national imagery-interpretation standards.", "credentials": "Bachelor's in geography/geospatial science or military imagery training; USGIF Certified GEOINT Professional (CGP); TS/SCI for national work", "socCode": "17-1021"}, {"title": "Foreign Language Analyst / Linguist", "level": "Professional", "reportsTo": "Language Services Chief / Collection Team Lead", "duties": "Translates and gists collected foreign-language material, triaging by intelligence value; provides cultural context that machine translation misses; supports interviews and document exploitation. Tested and re-tested on the Interagency Language Roundtable scale; throughput and fidelity are the measures.", "credentials": "ILR 3/3 proficiency or higher in target language; bachelor's typical; TS/SCI with polygraph for cryptologic work", "socCode": "27-3091"}, {"title": "Data Scientist (Intelligence Applications)", "level": "Professional", "reportsTo": "Chief Data Officer / Analytics Lead", "duties": "Builds entity-resolution graphs, anomaly-detection models, and NLP pipelines that triage collection at machine scale; validates model outputs against analyst ground truth; documents model limitations so analytic products don't launder algorithmic guesses as fact.", "credentials": "MS/PhD in computer science, statistics, or applied math; Python/Spark/graph tooling; clearance for government deployments", "socCode": "15-2051"}, {"title": "Watch Officer (Operations Center)", "level": "Operational", "reportsTo": "Senior Watch Officer / Operations Center Director", "duties": "Staffs the 24/7 watch floor: monitors incoming reporting and alerts, applies indications-and-warning criteria, drafts spot reports, and wakes up seniors when thresholds trip. Owns the log, the checklist, and the first fifteen minutes of every crisis.", "credentials": "Junior-to-mid intelligence or military background; watch qualification board; TS/SCI; shift-work resilience", "socCode": "33-3021"}, {"title": "Background Screening Specialist / Records Researcher", "level": "Operational", "reportsTo": "Screening Operations Supervisor", "duties": "Processes verification queues: pulls county court records, calls employers and universities to verify histories, applies FCRA adjudication matrices, and handles consumer disputes within statutory deadlines. Volume, accuracy, and turnaround time are the daily scoreboard.", "credentials": "High school to bachelor's; PBSA (FCRA Basic) certification; typing/CRM proficiency; state notary or license where required", "socCode": "33-9021"}]}}, {"id": "law", "name": "Law", "icon": "⚖️", "tagline": "The profession, institutions, and industries that make rules enforceable — courts, law firms, corporate counsel, arbitration, legal tech, and the compliance economy.", "view100k": {"role": "Law is civilization's conflict-resolution and expectation-setting technology: the body of enforceable rules, the courts that apply them, and the profession that argues, drafts, and advises within them. It exists because complex cooperation among strangers requires credible commitments — contracts that will be honored, property that will be protected, wrongs that will be remedied — and because the alternative to institutionalized adjudication is feud and self-help. From Hammurabi's code (c. 1754 BCE) through Roman jurisprudence, the English common law and Inns of Court, the Napoleonic codes, and the 1870s invention of the modern law school (Langdell at Harvard) and the large law firm (the 'Cravath system'), the domain has evolved into a dual structure: a public adjudicative branch — one of the three constitutional powers — and a private professional-services industry. The economics are substantial: U.S. legal services generate roughly $350-400 billion in annual revenue (NAICS 5411), with the global legal-services market near $1 trillion; the U.S. counts about 1.3 million licensed attorneys, roughly 350,000+ paralegals and legal assistants, and a court system — federal plus fifty state judiciaries — that disposes of tens of millions of cases a year, the overwhelming majority in state trial courts.\n\nThe industry's structure is a pyramid of stark contrasts. At the apex, roughly 200 'AmLaw'-scale firms run global partnerships with revenue exceeding $1-7 billion each and profits per equity partner in the millions, serving corporations on transactions, litigation, and regulation. The broad middle is small-firm and solo practice — nearly half of practicing lawyers — handling family, criminal, injury, and small-business matters. Alongside sit the corporate legal departments (the largest exceed a thousand in-house lawyers), the public bar (prosecutors, public defenders, agency counsel, judges), and a chronically underfunded legal-aid sector that leaves the majority of low-income Americans' civil legal needs unmet — the 'justice gap' documented by the Legal Services Corporation. Since the 2010s two forces have restructured the periphery: alternative legal service providers and legal technology (eDiscovery platforms, contract-lifecycle management, research AI) now form a $25+ billion market, and the compliance industry — born of Sarbanes-Oxley, Dodd-Frank, anti-money-laundering, and privacy statutes — has made 'compliance officer' one of the fastest-growing professional occupations.\n\nWhat makes the domain singular is self-governance: law is the only industry whose regulator is largely itself. Admission, ethics, and discipline are run by courts and bar associations composed of lawyers, under the rationale that professional independence from the state is a precondition of defending citizens against the state. That bargain — monopoly on practice in exchange for duties to courts and clients — is the domain's defining regulatory architecture and its perennial controversy.", "interdependencies": "Law is the connective tissue of the other nineteen domains: none can transact, hire, build, or innovate without it. Finance depends on it utterly — securities law, secured lending, bankruptcy, and the enforceability of the humble contract are the substrate of every financial instrument — while the Economy and Trade run on corporate, antitrust, and trade law (WTO dispute settlement, trade remedies). Energy, Infrastructure, and Industry live inside permitting, environmental, and utility regulation; Agriculture within land, water, and food-safety law; Technology within intellectual-property and now AI and data law, with patents the currency linking Law to Science. Communication is structured by telecommunications and media law and the free-speech constitutional frame. Education supplies the profession through law schools and is itself heavily regulated; Medicine intersects at malpractice, bioethics, and health regulation; Population at immigration, family, and inheritance law; Environment at the entire edifice of environmental statutes and treaties. Governance and Law are co-constitutive — legislatures produce the raw statute that courts and lawyers refine — while Defense and Intelligence operate under specialized legal regimes (UCMJ, FISA, law of armed conflict) with lawyers embedded at every level. Culture and Religion shape law's moral premises and are protected by it (First Amendment, religious-liberty doctrines), completing a loop in which law both reflects and disciplines every other sphere.", "regulationModel": "The domain is governed by an unusual court-centered self-regulatory model. In the United States, the highest court of each state holds inherent authority over the practice of law: it admits attorneys (bar examination, character and fitness review), promulgates rules of professional conduct (nearly all derived from the ABA Model Rules), and disciplines violations through bar disciplinary boards with sanctions from reprimand to disbarment — a system run predominantly by lawyers judging lawyers, tempered by public members and judicial review. The American Bar Association, a voluntary body, sets the model ethics rules and accredits law schools (a gatekeeping power recognized by the Department of Education); mandatory ('integrated') state bars combine licensing with professional association. Judges are governed separately by codes of judicial conduct, judicial-conduct commissions, and, federally, the Judicial Conference and impeachment. Client protection is layered on through malpractice liability, client-security funds, IOLTA trust-account rules, and the crime-fraud exception to privilege. Public accountability comes from appellate review, open-court principles, and constitutional rights of due process and counsel (Gideon v. Wainwright). Internationally, the profession self-organizes through the International Bar Association and CCBE in Europe, while England's post-2007 Legal Services Act model — an independent Legal Services Board over front-line regulators like the SRA, with alternative business structures permitted — represents the main counter-model to American lawyer self-regulation. Arbitration is governed by party contract under the Federal Arbitration Act and the New York Convention, administered by private institutions (AAA, ICC, JAMS) with their own rules and arbitrator-ethics codes."}, "view10k": {"overview": "The domain organizes into a private industry classified under NAICS 5411 (Legal Services): 541110 Offices of Lawyers — from global partnerships to solo practices — plus 541120 Offices of Notaries, 541191 Title Abstract and Settlement Offices, and 541199 All Other Legal Services (process servers, arbitration and mediation administration, legal document preparation). The public adjudicative core sits in NAICS 92211 (Courts), 92213 (Legal Counsel and Prosecution — prosecutors, public defenders, agency counsel), and 92214/92215 (corrections and juvenile services downstream). Corporate legal departments are embedded within their parents' NAICS codes but collectively rival the law-firm market in lawyer headcount. The periphery includes legal technology and ALSPs (511210 software, 541511 custom programming, 518210 eDiscovery processing), the compliance-consulting industry (541611, 541690), bar associations and professional bodies (813920), and legal aid nonprofits (541110/813319 funded through the Legal Services Corporation and philanthropy). Business models split among the billable hour and alternative fee arrangements (firms), contingency percentages (plaintiffs' bar), flat public salaries (courts and prosecutors), corporate overhead (in-house), subscription software (legal tech), and grant funding (legal aid).", "businessTypes": [{"name": "Large Law Firm (BigLaw / Global Partnership)", "naics": "541110", "definition": "A multi-office partnership of hundreds to thousands of lawyers serving corporations and institutions on high-stakes transactions, litigation, and regulatory matters.", "operations": "Revenue from hourly billing (partner rates now exceeding $2,000 at the apex) and alternative fee arrangements; the leverage model staffs matters with associates whose billings fund partner profits, managed through utilization, realization, and origination metrics. Operations are practice groups (M&A, litigation, capital markets), a professional C-suite (COO, CFO, CMO), and a partnership track of 8-10 years.", "regulation": "Every lawyer individually answerable to state bar discipline and Rules of Professional Conduct (conflicts checks, trust accounting, confidentiality); firms face malpractice liability and court sanctions (Rule 11). Self-regulation through general counsel offices within firms, conflicts committees, and ABA/state ethics opinions.", "examples": "Kirkland & Ellis; Latham & Watkins; Skadden Arps; Baker McKenzie"}, {"name": "Small Firm / Solo Practice", "naics": "541110", "definition": "The numerical backbone of the profession: one-to-twenty-lawyer practices handling family law, criminal defense, estates, immigration, real estate, and small-business matters for individuals and local enterprises.", "operations": "Funded by hourly fees, flat fees, and retainers, with heavy price sensitivity; operations are lean — the lawyer is rainmaker, practitioner, and manager — supported by practice-management software, a paralegal or two, and referral networks. Cash-flow management and client acquisition are the perennial business problems.", "regulation": "State bar licensing, discipline, and mandatory CLE; strict trust-account (IOLTA) rules audited by bar counsel; advertising rules under Rules 7.1-7.5. Solo practitioners self-regulate through bar-association ethics hotlines and practice-management assistance programs.", "examples": "Local family-law and criminal-defense firms; immigration boutiques; estate-planning practices; main-street general practitioners"}, {"name": "Plaintiffs' Contingency Firm", "naics": "541110", "definition": "Firms that finance litigation for injured claimants — personal injury, mass torts, class actions, securities fraud — in exchange for a percentage (typically 33-40%) of recovery.", "operations": "The business model is a portfolio of contingent claims: the firm advances costs (experts, discovery) that may reach millions per mass tort, wins fund the pipeline, and case selection is underwriting. Operations center on intake screening, litigation finance (increasingly third-party funded), medical-record workups, and settlement negotiation at scale.", "regulation": "Bar rules on contingent fees (Rule 1.5, written agreements), solicitation limits (Rule 7.3), and aggregate-settlement rules; courts supervise class actions under Rule 23 and fee awards. Third-party litigation funding faces emerging disclosure rules; the trial bar self-organizes through the American Association for Justice.", "examples": "Morgan & Morgan; Lieff Cabraser; Motley Rice; Susman Godfrey (hybrid)"}, {"name": "Court System (Trial and Appellate)", "naics": "922110", "definition": "The public adjudicative branch: trial courts finding fact and applying law, appellate courts correcting error and declaring doctrine, plus specialized courts (bankruptcy, tax, family, drug courts).", "operations": "Funded by legislative appropriation supplemented by filing fees and fines; operations are docket management — case assignment, motion practice, jury administration, trials, sentencing — run by judges supported by clerks of court, staff attorneys, and probation services. Performance is measured in clearance rates, time-to-disposition, and appellate reversal rates.", "regulation": "Governed by constitutions, statutes creating jurisdiction, and rules of procedure promulgated by supreme courts (federally through the Rules Enabling Act and Judicial Conference); judges disciplined by judicial-conduct commissions and codes of judicial conduct; administratively overseen by the Administrative Office of the U.S. Courts and state court administrators.", "examples": "U.S. District Court for the Southern District of New York; Delaware Court of Chancery; California Superior Courts; U.S. Court of Appeals for the Federal Circuit"}, {"name": "Prosecution & Public Defense", "naics": "922130", "definition": "The public criminal bar: district attorneys and U.S. Attorneys exercising the state's charging power, and public defender offices delivering the constitutionally mandated defense for the indigent.", "operations": "Appropriation-funded; prosecutors run intake and charging, grand jury practice, plea negotiation (resolving 90%+ of cases), trials, and appeals, often with victim-services and investigator units; defenders manage crushing caseloads through triage, motion practice, and negotiation. Both are measured (controversially) by conviction/disposition statistics and caseload standards.", "regulation": "Prosecutors bound by special ethics duties (Rule 3.8, Brady disclosure obligations) and elected or appointed accountability; defenders by effective-assistance standards (Strickland) and ABA caseload guidelines; both under state bar discipline and judicial supervision.", "examples": "U.S. Department of Justice / U.S. Attorneys' Offices; Manhattan District Attorney; Federal Defender Program; county public defender offices"}, {"name": "Corporate Legal Department (In-House Counsel)", "naics": "Embedded in parent's NAICS (function, not establishment)", "definition": "The internal law firm of a corporation: a general counsel and staff attorneys who advise the business, manage outside counsel, and own legal risk, contracts, IP, employment, and governance.", "operations": "Funded as corporate overhead with budgets often exceeding $100M at large caps, split between internal spend and outside counsel; operations are contract review at volume (CLM systems), litigation management, board and securities-law support (often fused with the corporate-secretary function), and preventive counseling embedded in business units.", "regulation": "In-house lawyers remain individually bar-licensed and disciplined; the department is overseen by the board (audit committee), external auditors, and regulators of the parent (SEC disclosure controls, up-the-ladder reporting under Sarbanes-Oxley §307). The Association of Corporate Counsel supplies professional standards and benchmarking.", "examples": "Legal departments of Alphabet, JPMorgan Chase, ExxonMobil; the general counsel's office of any Fortune 500"}, {"name": "ADR Institution (Arbitration & Mediation Provider)", "naics": "541199, 541990", "definition": "Private dispute-resolution administrators and neutrals — arbitral institutions, mediation panels, and retired-judge providers — resolving disputes outside courts under party agreement.", "operations": "Funded by filing/administrative fees and neutrals' hourly or daily rates (elite arbitrators command $10,000+/day); operations are case administration — appointment of neutrals, scheduling, award scrutiny — under institutional rules (AAA Commercial Rules, ICC Rules). International arbitration seats (London, Paris, Singapore, Hong Kong) compete as jurisdictions.", "regulation": "Enforced through the Federal Arbitration Act and the New York Convention (awards enforceable in 170+ states); neutrals governed by institutional ethics codes and the ABA/AAA Code of Ethics for Arbitrators; courts retain vacatur review for corruption and due-process failures.", "examples": "American Arbitration Association / ICDR; JAMS; International Chamber of Commerce Court of Arbitration; Singapore International Arbitration Centre"}, {"name": "Legal Technology Company", "naics": "511210, 541511", "definition": "Software firms building research, drafting, discovery, contract-lifecycle, e-filing, and practice-management tools — increasingly AI-native — for firms, departments, and courts.", "operations": "SaaS subscription economics with per-seat or usage pricing; operations are product engineering, legal-content curation (annotated case law, clause libraries), and enterprise sales into risk-averse buyers. Generative-AI research and drafting assistants are the current investment frontier, with venture funding in the billions annually.", "regulation": "Regulated as software vendors (contract, privacy, security — SOC 2 is table stakes) rather than as lawyers, but bounded by unauthorized-practice-of-law (UPL) doctrines that constrain direct-to-consumer legal advice; bar ethics opinions on lawyers' AI use (competence, confidentiality, supervision) shape product design.", "examples": "Thomson Reuters (Westlaw/CoCounsel); LexisNexis; Relativity (eDiscovery); Ironclad and Harvey (CLM/AI)"}, {"name": "Alternative Legal Services Provider (ALSP) / Legal Process Outsourcing", "naics": "541199, 518210, 561110", "definition": "Non-firm businesses performing high-volume legal work — document review, eDiscovery management, contract staffing, managed compliance services — at lower cost than law-firm leverage.", "operations": "Funded by per-document, per-reviewer-hour, or managed-service subscription pricing; operations are review centers (onshore and offshore), technology-assisted-review workflows, and flexible attorney staffing benches. The Big Four accounting firms' legal arms are the scale players outside the U.S.", "regulation": "Constrained by UPL rules requiring lawyer supervision of legal judgment; document-review attorneys individually licensed; data-protection law governs cross-border review. Arizona's ABS licensing and Utah's regulatory sandbox are opening U.S. non-lawyer ownership, echoing the UK Legal Services Act model overseen by the SRA.", "examples": "Integreon; UnitedLex; Axiom (flexible counsel); Deloitte Legal (non-US)"}, {"name": "Title Abstract & Settlement Company", "naics": "541191", "definition": "Firms that search land records, insure title, and conduct real-estate closings — the legal plumbing of the property market.", "operations": "Funded by title-insurance premiums (split with underwriters) and settlement fees per transaction; operations are abstracting county records, clearing liens and defects, escrow management, and closing coordination among lender, buyer, and seller. Volume tracks the mortgage cycle.", "regulation": "Regulated by state insurance departments (title insurance rates and licensing), RESPA (anti-kickback, administered by CFPB), and state UPL rules on who may conduct closings; the American Land Title Association's Best Practices framework is the industry's self-regulatory standard.", "examples": "First American Title; Old Republic Title; Fidelity National Financial agencies; independent county abstract companies"}, {"name": "Compliance & Investigations Consulting", "naics": "541611, 541690", "definition": "The industry that builds and tests corporate compliance programs — anti-corruption, AML, sanctions, privacy, ESG — and conducts internal investigations, monitorships, and regulatory remediation.", "operations": "Funded by consulting fees, monitorship appointments (court- or DOJ-imposed), and managed compliance services; operations are risk assessments, policy and training design, transaction monitoring tuning, and investigation support with forensic accountants and data analysts. Demand is statute-driven: FCPA, BSA/AML, GDPR, and DOJ's Evaluation of Corporate Compliance Programs guidance set the product spec.", "regulation": "Practitioners overseen indirectly through the regulators they serve (DOJ, SEC, OFAC, FinCEN expectations); professional self-regulation via the Society of Corporate Compliance & Ethics (CCEP certification), ACAMS (CAMS) for AML, and IAPP (CIPP) for privacy.", "examples": "Guidepost Solutions; FTI Consulting; Big Four forensic practices; StoneTurn"}, {"name": "Notarial & Legal Document Services", "naics": "541120, 541199", "definition": "Commissioned notaries public (and, in civil-law countries, the far more powerful civil-law notariat) authenticating signatures and documents, plus process servers and legal-document preparers.", "operations": "Funded by statutory per-act fees (U.S. notaries) or regulated tariffs (civil-law notaries, whose offices handle property conveyance and corporate formation); remote online notarization platforms now intermediate at scale. Process servers bill per service attempt under court rules.", "regulation": "U.S. notaries commissioned and disciplined by secretaries of state under state notary acts (RON statutes now in most states); civil-law notaries governed by ministries of justice and notarial chambers; the National Notary Association provides self-regulatory training and certification.", "examples": "Notarize/Proof (RON platform); UPS Store notary services; French and German civil-law notariats; ABC Legal (process serving)"}, {"name": "Bar Association / Legal Professional Body", "naics": "813920", "definition": "The profession's self-governing institutions: mandatory state bars administering licensure and discipline, voluntary associations setting model standards, and specialty bars organizing practice communities.", "operations": "Funded by mandatory license dues, CLE program revenue, meetings, and publications; operations are admissions (character and fitness), disciplinary prosecution, ethics opinions and hotlines, CLE accreditation, lawyer-assistance programs, and legislative advocacy on the administration of justice.", "regulation": "Operate under delegated judicial authority (state supreme courts) with antitrust boundaries set by cases like North Carolina Dental (active-supervision requirements for boards of market participants); the ABA is itself accountable to the Department of Education for its law-school accreditation role.", "examples": "American Bar Association; State Bar of California; New York State Bar Association; International Bar Association"}], "regulators": [{"name": "State Supreme Courts and Bar Disciplinary Boards", "jurisdiction": "US states", "role": "Hold inherent constitutional authority over law practice: admit attorneys, promulgate rules of professional conduct, and adjudicate discipline from private reprimand to disbarment through bar counsel prosecution and hearing panels."}, {"name": "American Bar Association (ABA)", "jurisdiction": "US (self-regulatory)", "role": "Drafts the Model Rules of Professional Conduct adopted (with variations) by nearly every state, accredits law schools as the DOE-recognized accreditor, issues ethics opinions, and evaluates federal judicial nominees — the profession's normative engine."}, {"name": "Judicial Conference of the United States / Administrative Office of the U.S. Courts", "jurisdiction": "US (federal judiciary)", "role": "The federal courts' self-governance apparatus: sets policy, proposes procedural rules through the Rules Enabling Act process, administers judicial-conduct complaints under the 1980 Act, and manages the judiciary's budget and operations."}, {"name": "U.S. Department of Justice", "jurisdiction": "US", "role": "The government's law firm and the profession's most consequential counterparty: enforces federal criminal and civil law, supervises U.S. Attorneys, imposes corporate monitors and compliance obligations through settlements, and litigates the constitutional questions that reshape the domain."}, {"name": "Legal Services Corporation (LSC)", "jurisdiction": "US", "role": "The congressionally chartered funder of civil legal aid: distributes appropriations to ~130 grantee organizations, enforces restrictions and quality standards on grantees, and documents the national justice gap."}, {"name": "Solicitors Regulation Authority (SRA) under the Legal Services Board", "jurisdiction": "UK (England & Wales)", "role": "The leading alternative to American self-regulation: an independent regulator licensing solicitors and alternative business structures (non-lawyer ownership), enforcing the SRA Standards, with the LSB providing oversight above the professional bodies."}, {"name": "State Secretaries of State (Notary Commissioning) and Insurance Departments (Title)", "jurisdiction": "US states", "role": "Commission and discipline notaries public, administer remote-online-notarization regimes, and (insurance departments) license title insurers and agents and regulate title premium rates."}, {"name": "International Chamber of Commerce Court of Arbitration / UNCITRAL framework", "jurisdiction": "Global", "role": "Administer and normativize cross-border arbitration: the ICC Court scrutinizes awards for enforceability, while the UNCITRAL Model Law and New York Convention supply the treaty architecture making private awards enforceable in national courts worldwide."}]}, "groundView": {"orgModel": "A large law firm is a professional partnership governed by an elected managing partner and executive committee (compensation, conflicts, and new-partner decisions are the crown jewels), organized into practice groups and offices, with a two-tier lawyer pyramid — equity partners who own the firm, income partners and counsel, then associates by class year — supported by a professional management layer (executive director/COO, CFO, CMO, CIO, general counsel of the firm) and an allied-professional base of paralegals, litigation-support analysts, librarians, and secretaries. Economics discipline the structure: leverage ratios, billable-hour budgets (1,800-2,000+ for associates), and origination credit drive behavior. A courthouse inverts the model: judges are independent adjudicators (not 'managed'), while a clerk of court and court administrator run the operational machine — case management, jury operations, records, courtroom staff (courtroom deputies, court reporters, bailiffs), and probation/pretrial services — under the chief judge's administrative authority. A corporate legal department is a corporate function: the general counsel (usually also corporate secretary) reports to the CEO and board, with deputy GCs owning litigation, corporate/securities, employment, IP, and compliance verticals, legal-operations managers running budgets and technology, and contract managers and paralegals handling volume work.", "positions": [{"title": "Managing Partner / Firm Chair", "level": "Governance", "reportsTo": "The equity partnership (elected; works with the executive committee)", "duties": "Sets firm strategy — practice mix, geographic expansion, lateral recruitment, merger decisions — and presides over compensation and partnership admissions. Balances a personal practice with firm leadership; measured by revenue, profits per equity partner, and partner retention.", "credentials": "JD, bar admission, 20+ years of practice and a significant book of business; election by partners per the partnership agreement", "socCode": "23-1011"}, {"title": "Chief Judge (Court)", "level": "Governance", "reportsTo": "Constitutionally independent (administratively within the judicial council / supreme court system)", "duties": "Combines a full adjudicative docket with administrative headship of the court: assigns cases, chairs the bench's governance meetings, supervises the clerk of court, and represents the court to the legislature on budget and to the public. Measured by docket health and institutional integrity.", "credentials": "JD and bar admission; appointment or election as judge plus seniority/selection as chief; judicial-education requirements (state judicial college, FJC programs)", "socCode": "23-1023"}, {"title": "General Counsel / Chief Legal Officer", "level": "Executive", "reportsTo": "Chief Executive Officer (with direct access to the board)", "duties": "Owns the corporation's entire legal risk: advises the board and CEO, supervises the legal department and outside counsel spend, signs off on securities disclosures and major transactions, and carries the up-the-ladder reporting duty when misconduct surfaces. The last check before decisions become liabilities.", "credentials": "JD, bar admission (in-house registration where required); typically 15-25 years spanning firm and in-house practice; securities and governance fluency for public companies", "socCode": "11-1011"}, {"title": "Executive Director / Law Firm COO", "level": "Executive", "reportsTo": "Managing Partner / Executive Committee", "duties": "Runs the business of the firm: finance, pricing and profitability analytics, technology, HR for staff, real estate, and marketing. Translates partnership decisions into operations; measured by margin, realization improvement, and support-function service quality.", "credentials": "MBA or CPA background common; Association of Legal Administrators credentials (CLM); not typically a lawyer", "socCode": "11-1011"}, {"title": "Practice Group Leader / Deputy General Counsel", "level": "Management", "reportsTo": "Managing Partner (firm) / General Counsel (in-house)", "duties": "Manages a legal vertical: staffing matters across partners and associates, setting group business plans and rates, quality-controlling work product, and developing the next generation. In-house DGCs own a risk portfolio (litigation, employment, IP) and its budget.", "credentials": "JD, bar admission, 12-20 years in the specialty; leadership standing among peers; specialty certifications (e.g., board-certified trial specialist) where offered", "socCode": "11-9199"}, {"title": "Clerk of Court / Court Administrator", "level": "Management", "reportsTo": "Chief Judge (or elected independently in many state systems)", "duties": "Operates the courthouse: dockets and case-management systems, jury summoning and management, records and e-filing, fee accounting, courtroom scheduling, and statistical reporting. The judiciary's chief operating officer; measured by case-processing time standards and audit results.", "credentials": "Bachelor's/MPA; ICM Fellow (National Center for State Courts' Institute for Court Management) or NACM certification; election or appointment per jurisdiction", "socCode": "11-1021"}, {"title": "Legal Operations Manager", "level": "Management", "reportsTo": "General Counsel / Deputy GC", "duties": "Industrializes the legal department: outside-counsel management and e-billing enforcement, matter-management and CLM technology, spend analytics, alternative-fee negotiation, and workflow design. The discipline CLOC codified; measured by cost-per-matter and cycle-time reductions.", "credentials": "Bachelor's/MBA; CLOC or ACC legal-ops training; e-billing and CLM platform expertise; often a former paralegal or consultant rather than a lawyer", "socCode": "11-3012"}, {"title": "Trial Judge", "level": "Professional", "reportsTo": "Judicially independent (administrative oversight by chief judge; conduct oversight by judicial commission)", "duties": "Presides over civil and criminal proceedings: rules on motions and evidence, manages trials and juries, sentences defendants, and writes opinions. Owns a docket of hundreds to thousands of cases; measured by clearance rates, reversal rates, and adherence to time standards — but never by outcome preference.", "credentials": "JD, bar admission, typically 10+ years practice; appointment (merit selection/Senate confirmation) or election; judicial college training; bound by the Code of Judicial Conduct", "socCode": "23-1023"}, {"title": "Associate Attorney", "level": "Professional", "reportsTo": "Supervising Partner / Practice Group Leader", "duties": "Executes the legal work: research and memoranda, drafting agreements and briefs, discovery and deposition support, due diligence, and increasingly client contact with seniority. Lives against a billable-hour budget (1,800-2,200); measured by hours, work quality, and progression toward partnership or exit.", "credentials": "JD from an ABA-accredited school, bar admission, character-and-fitness clearance; judicial clerkship a premium credential; CLE compliance ongoing", "socCode": "23-1011"}, {"title": "Prosecutor (Assistant District Attorney / AUSA)", "level": "Professional", "reportsTo": "District Attorney / U.S. Attorney (through section chiefs)", "duties": "Exercises the charging power case by case: reviews arrests, presents to grand juries, negotiates pleas, tries cases, and honors Brady disclosure duties. Carries a caseload from misdemeanors (hundreds) to complex fraud (a handful); measured by disposition quality and ethical rigor, with a minister-of-justice duty beyond winning.", "credentials": "JD, bar admission; competitive honors-program or lateral hiring; security clearance for federal national-security dockets", "socCode": "23-1011"}, {"title": "Public Defender / Legal Aid Attorney", "level": "Professional", "reportsTo": "Chief Defender / Legal Aid Executive Director", "duties": "Defends the indigent accused or represents low-income civil clients (eviction, benefits, family safety): client interviews at jails and clinics, suppression and dispositive motions, negotiation, and trial. Manages caseloads that chronically exceed ABA standards; measured by outcomes and client counseling quality under crushing volume.", "credentials": "JD, bar admission; public-interest fellowship pathways (Equal Justice Works); loan-repayment-assistance eligibility often shapes careers", "socCode": "23-1011"}, {"title": "Arbitrator / Mediator", "level": "Professional", "reportsTo": "Appointing institution and the parties (contractually engaged neutral)", "duties": "Arbitrators conduct evidentiary hearings and issue binding, court-enforceable awards; mediators facilitate negotiated settlement without decision power. Both manage disclosure of conflicts scrupulously — an undisclosed relationship can vacate an award; measured by appointments, award durability, and settlement rates.", "credentials": "Typically JD with 15+ years practice or judicial service; institutional panel admission (AAA, ICC, CPR); mediator certification (40-hour training plus court rosters) for court-annexed work", "socCode": "23-1022"}, {"title": "Administrative Law Judge / Hearing Officer", "level": "Professional", "reportsTo": "Agency chief ALJ (decisional independence protected by the APA)", "duties": "Adjudicates disputes inside the administrative state — Social Security disability, licensing, enforcement — conducting hearings, weighing evidence, and issuing written decisions subject to agency and judicial review. SSA ALJs alone decide hundreds of thousands of cases annually.", "credentials": "JD, bar admission, litigation experience; federal ALJs selected through OPM examination and appointed with APA tenure protections", "socCode": "23-1021"}, {"title": "Compliance Officer", "level": "Professional", "reportsTo": "Chief Compliance Officer / General Counsel", "duties": "Operates the corporate compliance program: risk assessments, policy drafting, training delivery, transaction and trade surveillance, hotline triage and investigations, and regulatory-exam support. Measured by program-effectiveness indicators regulators actually credit — testing results, remediation speed, culture metrics.", "credentials": "Bachelor's/JD; CCEP (SCCE), CAMS (ACAMS), or CIPP (IAPP) certifications by specialty; industry-specific licensing (e.g., FINRA registrations) where applicable", "socCode": "13-1041"}, {"title": "Paralegal / Legal Assistant", "level": "Operational", "reportsTo": "Supervising Attorney / Paralegal Manager", "duties": "Performs substantive legal work under attorney supervision: cite-checking and record assembly, discovery organization, deposition summaries, corporate-entity maintenance, real-estate closings, and trial-notebook preparation. Billable in most firms; the leverage layer that makes legal work affordable.", "credentials": "Associate or bachelor's degree plus paralegal certificate (ABA-approved program); NALA Certified Paralegal (CP) or NFPA PACE registration; cannot give legal advice (UPL boundary)", "socCode": "23-2011"}, {"title": "eDiscovery / Litigation Support Analyst", "level": "Operational", "reportsTo": "Litigation Support Manager / eDiscovery Counsel", "duties": "Manages electronically stored information through the EDRM lifecycle: legal-hold execution, collection with forensic integrity, processing and deduplication, search-term and TAR workflow administration in platforms like Relativity, and production quality control. Defensibility of process is the job.", "credentials": "Bachelor's; Relativity Certified Administrator (RCA), ACEDS CEDS certification; chain-of-custody and metadata fluency", "socCode": "15-1211"}, {"title": "Court Reporter", "level": "Operational", "reportsTo": "Clerk of Court / Court Reporting Manager (or freelance agency)", "duties": "Creates the verbatim official record of proceedings and depositions by stenotype at 225+ words per minute, produces certified transcripts on statutory deadlines, and marks exhibits. The record they make is what appellate courts review; realtime-certified reporters also feed live text to judges and counsel.", "credentials": "Court-reporting program completion; state CSR license and/or NCRA Registered Professional Reporter (RPR); realtime certification (CRR) for premium work", "socCode": "27-3092"}, {"title": "Bailiff / Court Security Officer", "level": "Operational", "reportsTo": "Sheriff / U.S. Marshals Service (court security contracts) / Clerk of Court", "duties": "Maintains courtroom security and order: screens entrants, guards prisoners in transit and in the dock, protects judges, jurors, and witnesses, and executes the judge's orders in the courtroom. The physical guarantee behind judicial authority.", "credentials": "Law-enforcement certification (POST) or CSO credentialing; firearms qualification; background investigation", "socCode": "33-3011"}, {"title": "Notary Public / Title Examiner", "level": "Operational", "reportsTo": "Commissioning Secretary of State (notary) / Title Operations Manager (examiner)", "duties": "Notaries verify signer identity, administer oaths, and complete notarial certificates — now often via audiovisual remote platforms with identity-proofing; title examiners search chains of title in county records, flag liens, easements, and defects, and produce the commitment on which title insurance issues.", "credentials": "State notary commission (application, bond, exam in some states; RON authorization for remote work); title examiners typically hold a bachelor's plus ALTA/state land-title association training", "socCode": "23-2093"}]}}, {"id": "culture", "name": "Culture", "icon": "🎭", "tagline": "The creation, performance, preservation, and experience economy of art, story, play, and shared identity.", "view100k": {"role": "Culture is the domain through which a civilization makes and consumes meaning, beauty, play, and shared identity — the organized economy of the arts, entertainment, sports, gaming, tourism and hospitality, museums and heritage, fashion, and food culture. It exists because human beings do not live by subsistence alone: they require story, ritual, spectacle, recreation, and aesthetic experience, and once societies produce a surplus, they professionalize the making of these things. Culture is simultaneously an economic sector (creators, producers, venues, platforms, and hospitality businesses selling experiences and content), a public good (heritage, museums, public broadcasting, arts education subsidized because markets underprovide them), and the primary medium through which values, taste, and collective identity are transmitted and contested.\n\nThe scale is immense and often underappreciated. The global creative and cultural industries generate well over $2.25 trillion annually and employ some 30 million people; travel and tourism is one of the largest industries on Earth, contributing roughly $9-10 trillion to global GDP (around 9-10% of the total) and supporting over 300 million jobs directly and indirectly. In the U.S., the arts and cultural sector is measured by the BEA at over $1.1 trillion (about 4.3% of GDP), larger than agriculture or transportation; the global video-game industry exceeds $180-200 billion (larger than film and music recorded revenue combined); the restaurant industry alone is a ~$1 trillion U.S. business employing over 15 million people; and global sports is a $500+ billion enterprise. Arts, entertainment, recreation, accommodation, and food services together employ well over 20 million Americans.\n\nThe historical arc runs from cave painting, oral epic, and ritual through the patronage systems of temple, court, and church (which funded most art before markets did), to the commercialization of culture in the modern era: the printing press and mass publishing, the 19th-century rise of professional sport, museums, and the impresario, the 20th-century entertainment revolution (recorded music, cinema, radio, and television, which turned culture into industrial mass media), and the 21st-century digital rupture — streaming, social platforms, user-generated content, and interactive gaming — that collapsed distribution barriers, unbundled cultural products, and turned attention itself into the scarce, monetized resource. The defining tension is between culture as commerce and culture as public heritage and identity: between the blockbuster and the endangered craft, the algorithmic feed and the subsidized symphony, global entertainment conglomerates and the local, the nonprofit and the for-profit — every cultural-policy debate is a negotiation over which deserves protection, subsidy, and voice.", "interdependencies": "Culture depends on Technology and Communication for the platforms, cameras, streaming networks, and game engines that produce and distribute it, and on the Economy, which supplies the discretionary income on which nearly all cultural spending rests. It draws on Education for the training of artists, athletes, and chefs and feeds arts and humanities education in return; on Finance for the capital behind studios, franchises, and hotel REITs; on Trade and Tourism's deep interdependence, since travel is the physical consumption of culture and heritage; on Infrastructure, Energy, and Industry to build stadiums, theaters, hotels, and to manufacture instruments, apparel, and equipment; on Agriculture, which is the raw material of food culture and cuisine; on Governance and Law, which supply intellectual-property protection (the economic foundation of the creative industries), arts funding, gambling and content regulation, and heritage protection; on Population and Environment for the demographics of audiences and the sustainability of tourism; on Medicine and Science for sports science and conservation of artifacts; on Intelligence and Defense, historically patrons and users of culture for propaganda and morale; and above all on Religion, from which most art, music, ritual, festival, and cuisine historically emerged and with which culture remains deeply entwined.", "regulationModel": "Culture is regulated more lightly than most domains but through a distinctive mix of intellectual-property law, content and gambling regulation, self-governance, and public patronage. The economic engine of the creative industries is copyright and trademark law, administered in the U.S. by the Copyright Office and USPTO and internationally by WIPO and treaties (Berne Convention), with collective management organizations (ASCAP, BMI, SESAC) and guilds (SAG-AFTRA, WGA, DGA) self-regulating rights and labor. Broadcast content is regulated by the FCC; film and games self-regulate ratings through the MPA and ESRB; gambling and casino gaming are tightly regulated by state gaming commissions and, for tribal gaming, the National Indian Gaming Commission under IGRA. Professional and collegiate sports self-govern through leagues and associations (the NFL, NBA, MLB, and the NCAA) and international federations (FIFA, IOC), with anti-doping overseen by WADA/USADA. Tourism and hospitality are regulated for health and safety (local health departments, fire codes, ADA) and self-rated by systems like AAA Diamonds and Forbes/Michelin. Museums self-regulate through accreditation (American Alliance of Museums) and ethics codes (ICOM, AAM) governing collections and repatriation (NAGPRA). Public funding flows through the NEA, NEH, IMLS, state arts councils, and abroad through culture ministries and bodies like Arts Council England."}, "view10k": {"overview": "Culture spans two big NAICS sectors plus adjacent manufacturing and retail. Sector 71 (Arts, Entertainment, and Recreation) covers performing arts and spectator sports (711 — performing arts companies 7111, spectator sports 7112, promoters 7113, agents 7114, independent artists 7115), museums and historical sites (712), and amusement, gambling, and recreation (713 — including casinos 7132 and fitness/recreation 7139). Sector 72 (Accommodation and Food Services) covers hotels and lodging (721) and restaurants and bars (722). Media and content sit in Sector 51 (motion pictures 5121, sound recording 5122, and, under the 2022 revision, streaming/gaming publishers in 5132/513210). Fashion spans apparel manufacturing (315) and retail (4581). Organizationally the domain is a striking mix of global for-profit conglomerates (studios, streamers, hotel and game companies), independent creators and small businesses (restaurants, galleries, artists), member-owned leagues and franchises, and a large nonprofit sector (museums, symphonies, theaters, public media) reliant on earned revenue plus philanthropy and public subsidy.", "businessTypes": [{"name": "Film & Television Studio / Content Producer", "naics": "512110", "definition": "A company that finances, produces, and distributes motion pictures and television/streaming programming.", "operations": "Revenue from box office, licensing, subscription streaming, and syndication; the model finances a slate of high-risk projects against a portfolio expectation that hits subsidize flops, monetizing intellectual property across windows and franchises. Development, production, and marketing (P&A) are the major cost centers.", "regulation": "Copyright law and guild collective bargaining (WGA, DGA, SAG-AFTRA); self-regulated content ratings via the MPA (CARA); FTC for advertising; FCC for broadcast. Antitrust history (Paramount decrees) shapes distribution.", "examples": "Walt Disney Studios, Warner Bros., Netflix, Universal Pictures"}, {"name": "Music & Recording Business", "naics": "512200, 512250", "definition": "Record labels, publishers, and rights organizations that produce, distribute, and monetize recorded music and compositions.", "operations": "Revenue from streaming royalties, licensing/sync, publishing, and live/merch; labels advance recording and marketing costs recouped against artist royalties, while publishers and PROs collect performance and mechanical royalties. Catalog ownership is a prized, cash-flowing asset class.", "regulation": "Copyright law and the Music Modernization Act (MLC for mechanicals); performance-rights organizations (ASCAP, BMI) operate under consent decrees; self-regulation via the RIAA and industry bodies.", "examples": "Universal Music Group, Sony Music, Warner Music Group, Spotify (distribution/platform)"}, {"name": "Live Entertainment, Venue & Event Promoter", "naics": "711310, 711320, 711110", "definition": "Companies that promote, book, and stage live concerts, theater, and events, and operate the venues that host them.", "operations": "Revenue from ticket sales, venue fees, sponsorship, and concessions; promoters assume the financial risk of guaranteeing artists against ticket revenue, while venue and ticketing operators earn fees and service charges. Scale and vertical integration (artist-venue-ticketing) drive margins.", "regulation": "Consumer-protection and ticketing law (BOTS Act, resale rules), local licensing, safety/crowd codes, ADA; antitrust scrutiny of ticketing-promotion integration; self-regulation via industry associations.", "examples": "Live Nation/Ticketmaster, AEG Presents, Broadway theater operators (Shubert, Nederlander), Cirque du Soleil"}, {"name": "Professional Sports League & Franchise", "naics": "711211, 711212", "definition": "Member-organized leagues and their team franchises that stage professional athletic competition as commercial spectacle.", "operations": "Revenue from national and local media rights (the dominant source), ticketing, sponsorship, and licensing, shared among franchises under league rules; the model relies on competitive balance mechanisms (salary caps, drafts, revenue sharing) and collectively bargained player labor. Franchise values have soared into the billions.", "regulation": "Self-regulated by leagues as private associations (with a partial MLB antitrust exemption), collective bargaining with player unions, anti-doping (USADA/WADA), and gambling-integrity rules; broadcast and betting law apply.", "examples": "National Football League, NBA, Major League Baseball, English Premier League"}, {"name": "Video Game & Interactive Entertainment Company", "naics": "513210, 512110", "definition": "A developer and publisher of interactive video games and platforms across console, PC, mobile, and online services.", "operations": "Revenue from game sales, in-game microtransactions and live-service monetization, subscriptions, and platform fees; the model funds multi-year, high-budget development against hit-driven returns, increasingly favoring games-as-a-service with ongoing content. Platform holders take a store cut.", "regulation": "Self-regulated content ratings via the ESRB; FTC (COPPA, loot-box/consumer scrutiny), data-privacy law; gambling regulators eye monetization mechanics; self-regulation via the ESA.", "examples": "Sony Interactive, Microsoft/Xbox (Activision Blizzard), Nintendo, Electronic Arts"}, {"name": "Museum, Gallery & Cultural Heritage Institution", "naics": "712110, 712120, 712130", "definition": "A nonprofit or public institution that collects, preserves, researches, and exhibits art, artifacts, science, or natural history for the public.", "operations": "Funded by admissions, memberships, endowment, philanthropy, and government grants (earned revenue rarely covers costs); the model stewards collections in perpetuity, mounts exhibitions, and serves education and research missions. Measured by attendance, collection care, and scholarly/community impact rather than profit.", "regulation": "IRS 501(c)(3), collections and repatriation law (NAGPRA), import/antiquities rules; self-regulation and accreditation via the American Alliance of Museums and ethics codes (AAM, ICOM, AAMD).", "examples": "The Metropolitan Museum of Art, Smithsonian Institution, Museum of Modern Art, British Museum"}, {"name": "Performing Arts Organization (Nonprofit)", "naics": "711110, 711130", "definition": "A nonprofit theater, orchestra, opera, dance, or ballet company that produces live performing-arts programming.", "operations": "Earned revenue (tickets, tuition) covers roughly half of budgets; the rest comes from donations, grants, and endowment — the structural 'cost disease' of live performance, where productivity cannot scale. Governed by boards; measured by artistic quality, attendance, and fundraising.", "regulation": "IRS 501(c)(3); union agreements (Actors' Equity, AFM musicians, AGMA); NEA/state arts-council grant compliance; self-regulation via service organizations (League of American Orchestras, TCG).", "examples": "New York Philharmonic, Metropolitan Opera, Steppenwolf Theatre, American Ballet Theatre"}, {"name": "Hotel & Lodging Company", "naics": "721110", "definition": "Operators, franchisors, and owners of hotels, resorts, and lodging that sell accommodation and hospitality services to travelers.", "operations": "Revenue per available room (RevPAR) from room rates and occupancy plus food/beverage and events; the modern model splits brand/franchise (fee-based, asset-light), management, and ownership (often REITs). Loyalty programs and distribution (OTAs) shape demand and cost.", "regulation": "Local health, fire, building, and zoning codes, ADA accessibility, liquor licensing, labor law; self-regulation and rating via AAA Diamonds, Forbes Travel Guide, and the AHLA.", "examples": "Marriott International, Hilton Worldwide, Hyatt, Airbnb (platform lodging)"}, {"name": "Restaurant & Food Service Business", "naics": "722511, 722513, 722515", "definition": "Establishments preparing and serving food and beverages, spanning full-service, quick-service, fast-casual, and catering.", "operations": "Revenue from food/beverage sales; a notoriously thin-margin business (often 3-6% net) driven by food and labor cost control, table turns or throughput, and location; scales through franchising and off-premise/delivery. High failure rate and low barriers to entry.", "regulation": "Local health-department inspection and food-safety codes (FDA Food Code), liquor licensing, labor and wage law, ADA; self-regulation via the National Restaurant Association and ServSafe certification.", "examples": "McDonald's, Darden Restaurants, Chipotle, independent restaurants and local chains"}, {"name": "Casino & Gaming Operator", "naics": "713210, 721120", "definition": "An operator of casinos and gaming establishments offering wagering, often combined with hotels, dining, and entertainment as integrated resorts.", "operations": "Revenue from gaming win (house edge across slots and tables), plus hotel, food, and entertainment; the model manages regulated wagering, high-roller marketing, and non-gaming amenities. Increasingly includes online sports betting and iGaming.", "regulation": "Heavily regulated by state gaming commissions (licensing, audits, responsible-gaming rules), the National Indian Gaming Commission under IGRA for tribal gaming, and AML/BSA financial rules; self-regulation via the American Gaming Association.", "examples": "Caesars Entertainment, MGM Resorts, Las Vegas Sands, tribal casino operators"}, {"name": "Tourism, Travel & Experience Company", "naics": "561510, 561520, 561599", "definition": "Travel agencies, tour operators, and destination/experience providers that organize and sell travel and tourism experiences.", "operations": "Revenue from commissions, package markups, and booking/service fees; the model bundles transport, lodging, and experiences, or operates attractions and tours directly. Online platforms have disintermediated traditional agencies while growing the experiences market.", "regulation": "Consumer-protection and seller-of-travel laws, DOT rules for air packages, safety/licensing for tours; self-regulation via ASTA and destination marketing organizations.", "examples": "Expedia Group, Booking Holdings, TUI Group, Viator/Tripadvisor"}, {"name": "Fashion & Apparel Brand", "naics": "315000, 424300, 458110", "definition": "Designers, manufacturers, and retailers of clothing, footwear, and accessories, from luxury houses to mass-market and fast fashion.", "operations": "Revenue from wholesale and direct retail; the model runs on seasonal design cycles, brand equity, global sourcing/supply chains, and increasingly direct-to-consumer and e-commerce. Luxury monetizes exclusivity and IP; fast fashion monetizes speed and volume.", "regulation": "FTC (labeling, textile/fur/care rules, advertising), CPSC safety, trademark and design law, and supply-chain/labor and sustainability disclosure; self-regulation via the CFDA and industry sustainability coalitions.", "examples": "LVMH, Nike, Inditex (Zara), Ralph Lauren"}, {"name": "Amusement Park & Recreation Attraction", "naics": "713110, 713120", "definition": "Operators of theme parks, amusement parks, water parks, and recreational attractions selling entertainment experiences.", "operations": "Revenue from admissions, season passes, in-park spending (food, merchandise), and hotels; a capital-intensive model driven by attendance, per-capita spending, and ride/attraction investment. Weather- and season-sensitive with high fixed costs.", "regulation": "State amusement-ride safety inspection, local health/safety codes, ADA, labor law; self-regulation and safety standards via the IAAPA and ASTM ride standards.", "examples": "Disney Parks, Universal Destinations & Experiences, Six Flags, Cedar Fair"}, {"name": "Public Broadcasting & Cultural Media (Nonprofit)", "naics": "515111, 515120, 519110", "definition": "Noncommercial broadcasters and cultural-media organizations that produce and distribute educational and cultural programming as a public service.", "operations": "Funded by member/viewer contributions, corporate underwriting, foundation grants, and government support (CPB); the model produces and distributes public-interest content not fully served by commercial markets. Measured by reach, mission impact, and membership.", "regulation": "FCC licensing, IRS 501(c)(3), CPB funding standards; self-regulation via editorial and public-media codes; distinct from commercial broadcast advertising rules.", "examples": "PBS, NPR, the BBC (public corporation abroad), local public television and radio stations"}], "regulators": [{"name": "U.S. Copyright Office & USPTO / WIPO", "jurisdiction": "US / Global", "role": "Administer copyright and trademark — the legal foundation of the creative economy — and, via WIPO and the Berne Convention, the international system that lets cultural IP be protected and monetized across borders."}, {"name": "National Endowment for the Arts / Humanities, IMLS & State Arts Councils", "jurisdiction": "US (federal/state)", "role": "Provide public grant funding, standards, and support for the arts, humanities, museums, and libraries, sustaining the nonprofit cultural sector that markets underprovide."}, {"name": "Federal Communications Commission (FCC)", "jurisdiction": "US (federal)", "role": "Licenses broadcast media and regulates content standards (indecency, children's programming) and media ownership for radio and television."}, {"name": "State Gaming Commissions & National Indian Gaming Commission (IGRA)", "jurisdiction": "US (state/federal)", "role": "License and audit casinos and gaming operators, enforce responsible-gaming and integrity rules, and regulate tribal gaming under the Indian Gaming Regulatory Act."}, {"name": "American Alliance of Museums (AAM) / ICOM", "jurisdiction": "US / Global (accreditor / SRO)", "role": "Accredits museums and sets professional ethics codes governing collections stewardship, deaccessioning, and repatriation — the self-regulatory backbone of the museum sector."}, {"name": "Professional Sports Leagues & NCAA / International Federations (FIFA, IOC, WADA)", "jurisdiction": "US / Global (SRO)", "role": "Self-govern athletic competition — rules, eligibility, discipline, competitive balance, and anti-doping — as private associations and federations largely outside direct government regulation."}, {"name": "MPA (CARA) & ESRB", "jurisdiction": "US (self-regulatory)", "role": "Operate the film and video-game content-rating systems, providing voluntary industry self-regulation of content that substitutes for government censorship."}, {"name": "National Restaurant Association & American Hotel & Lodging Association", "jurisdiction": "US (industry associations / SRO)", "role": "Set industry standards, food-safety certification (ServSafe), and best practices for the restaurant and lodging sectors, complementing local health, fire, and licensing regulation."}]}, "groundView": {"orgModel": "The domain has no single organizational template because it spans global conglomerates, tiny creative businesses, member-owned leagues, and nonprofits — but several patterns recur. A for-profit cultural enterprise (studio, game company, hotel or restaurant group) is governed by a board and CEO, with a C-suite that pairs conventional business functions (CFO, COO, CMO) with a distinctive creative/content leadership line (chief content officer, creative director, executive chef, showrunner) whose authority over the product rivals the business side; below sit producers, general managers, and department heads over a workforce that mixes salaried staff, unionized crews, and large numbers of hourly, seasonal, and gig workers. A nonprofit cultural institution (museum, symphony, theater) is governed by a board of trustees and an executive/artistic-director dyad — a defining feature is the split between the executive director (business, fundraising, operations) and the artistic director/chief curator (programming, artistic vision) — over curatorial
