<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Business Operations Atlas — Civilization's 20 Domains</title>
<style>
:root{
  --bg:#0f1117; --panel:#161a23; --panel2:#1c2130; --ink:#e8eaf0; --ink2:#9aa3b5; --ink3:#6b7488;
  --accent:#5b8def; --accent2:#8b6def; --gold:#d4a94e; --green:#4eb87e; --red:#d4664e;
  --border:#262c3d; --radius:12px;
  --lvl-gov:#d4a94e; --lvl-exec:#5b8def; --lvl-mgmt:#8b6def; --lvl-prof:#4eb87e; --lvl-ops:#9aa3b5;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;font-size:15px}
a{color:var(--accent)}
#app{display:flex;min-height:100vh}
/* sidebar */
#side{width:270px;min-width:270px;background:var(--panel);border-right:1px solid var(--border);padding:18px 0;position:sticky;top:0;height:100vh;overflow-y:auto}
#side h1{font-size:16px;padding:0 18px 4px;letter-spacing:.5px}
#side .sub{font-size:11px;color:var(--ink3);padding:0 18px 12px;text-transform:uppercase;letter-spacing:1px}
#search{margin:0 14px 12px;width:calc(100% - 28px);padding:9px 12px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--ink);font-size:13px;outline:none}
#search:focus{border-color:var(--accent)}
.navsec{font-size:10px;color:var(--ink3);text-transform:uppercase;letter-spacing:1.2px;padding:12px 18px 4px}
.navitem{display:flex;align-items:center;gap:9px;padding:7px 18px;cursor:pointer;font-size:13.5px;color:var(--ink2);border-left:3px solid transparent}
.navitem:hover{background:var(--panel2);color:var(--ink)}
.navitem.active{background:var(--panel2);color:var(--ink);border-left-color:var(--accent)}
.navitem .ico{width:20px;text-align:center}
/* main */
#main{flex:1;padding:34px 44px;max-width:1060px}
.crumb{font-size:12px;color:var(--ink3);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px}
h2.title{font-size:30px;margin-bottom:4px;display:flex;align-items:center;gap:12px}
.tagline{color:var(--ink2);font-size:16px;margin-bottom:22px;font-style:italic}
/* zoom tabs */
.zoomtabs{display:flex;gap:8px;margin:18px 0 24px;flex-wrap:wrap}
.ztab{padding:9px 18px;border-radius:999px;border:1px solid var(--border);background:var(--panel);cursor:pointer;font-size:13.5px;color:var(--ink2);font-weight:600}
.ztab .alt{font-weight:400;color:var(--ink3);font-size:11.5px}
.ztab.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
.ztab.active .alt{color:rgba(255,255,255,.75)}
/* cards & sections */
.sec{margin-bottom:28px}
.sec h3{font-size:19px;margin-bottom:12px;color:var(--ink);display:flex;align-items:center;gap:8px}
.sec h3 .bar{width:4px;height:20px;border-radius:2px;background:linear-gradient(var(--accent),var(--accent2))}
.prose{color:var(--ink);font-size:15px}
.prose p{margin-bottom:13px;color:#cdd3e0}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px}
.card h4{font-size:15.5px;margin-bottom:4px}
.chip{display:inline-block;font-size:10.5px;padding:2px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--border);color:var(--ink2);margin-left:8px;vertical-align:middle;font-weight:600;letter-spacing:.3px}
.kv{font-size:13.5px;color:#c3cad9;margin-top:7px}
.kv b{color:var(--ink2);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.8px;display:block;margin-bottom:1px}
.kv+.kv{margin-top:9px}
.ex{color:var(--gold);font-size:13px}
/* collapsible */
details.biz{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden}
details.biz summary{padding:13px 18px;cursor:pointer;font-weight:600;font-size:14.5px;list-style:none;display:flex;align-items:center;justify-content:space-between}
details.biz summary::-webkit-details-marker{display:none}
details.biz summary .arr{color:var(--ink3);transition:transform .2s;font-size:12px}
details.biz[open] summary .arr{transform:rotate(90deg)}
details.biz .body{padding:2px 18px 15px;border-top:1px solid var(--border);padding-top:12px}
/* positions table */
.poslvl{margin:16px 0 6px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%}
.pos{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--border);border-radius:10px;padding:13px 17px;margin-bottom:9px}
.pos .top{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px}
.pos h5{font-size:14.5px}
.pos .soc{font-size:11px;color:var(--ink3);font-family:ui-monospace,monospace}
.pos .rep{font-size:12px;color:var(--ink3);margin:2px 0 6px}
.pos .duty{font-size:13.5px;color:#c3cad9}
.pos .cred{font-size:12.5px;color:var(--gold);margin-top:6px}
/* regulators table */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;padding:9px 12px;color:var(--ink2);font-size:11px;text-transform:uppercase;letter-spacing:.8px;border-bottom:2px solid var(--border)}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top;color:#c3cad9}
td:first-child{color:var(--ink);font-weight:600}
/* home grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px;margin-top:16px}
.dcard{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;transition:border-color .15s, transform .15s}
.dcard:hover{border-color:var(--accent);transform:translateY(-2px)}
.dcard .ico{font-size:24px}
.dcard h4{margin:6px 0 3px;font-size:15px}
.dcard p{font-size:12.5px;color:var(--ink2)}
.statrow{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 20px;min-width:150px}
.stat .n{font-size:24px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat .l{font-size:11.5px;color:var(--ink2);text-transform:uppercase;letter-spacing:.8px}
/* search results */
.sres{font-size:13px;color:var(--ink2);margin-bottom:14px}
mark{background:rgba(212,169,78,.35);color:var(--ink);border-radius:3px;padding:0 2px}
.hit{cursor:pointer}
.hit .from{font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:.8px;margin-bottom:2px}
@media(max-width:820px){#app{flex-direction:column}#side{width:100%;height:auto;position:relative;min-width:0}#main{padding:22px 18px}}
footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--border);font-size:12px;color:var(--ink3)}
</style>
</head>

  <nav id="side">
    <h1>📖 Business Operations Atlas</h1>

<script id="DATA" type="application/json">{"universal": {"frameworks": [{"name": "NAICS 2022 (North American Industry Classification System)", "scope": "1,012 industries in 20 sectors", "purpose": "The definitive taxonomy of what businesses DO — every establishment in North America is classified by its primary production process. Maintained by the U.S. Census Bureau with Canada and Mexico; revised every 5 years.", "url": "census.gov/naics"}, {"name": "ISIC Rev. 4 / Rev. 5 (International Standard Industrial Classification)", "scope": "21 sections, ~420 classes, global", "purpose": "The United Nations' worldwide equivalent — the root taxonomy from which national systems (NACE in Europe, ANZSIC, etc.) descend. The common language for comparing economies across countries.", "url": "unstats.un.org"}, {"name": "SOC 2018 (Standard Occupational Classification)", "scope": "867 detailed occupations in 23 major groups", "purpose": "The definitive taxonomy of what WORKERS do — every job in the U.S. economy maps to a SOC code. Maintained by the Bureau of Labor Statistics.", "url": "bls.gov/soc"}, {"name": "O*NET-SOC (Occupational Information Network)", "scope": "~900+ occupations × 200+ descriptors each", "purpose": "The deepest occupational database known — for every occupation it catalogs tasks, tools, knowledge, skills, abilities, work context, education, and wages. Sponsored by the U.S. Department of Labor.", "url": "onetonline.org"}, {"name": "GICS (Global Industry Classification Standard)", "scope": "11 sectors, 25 industry groups, 74 industries, 163 sub-industries", "purpose": "How the FINANCIAL world classifies companies — MSCI and S&P's standard used to sort every publicly traded firm on Earth for indexing and investment.", "url": "msci.com/gics"}, {"name": "APQC Process Classification Framework", "scope": "13 process categories, 1,000+ processes", "purpose": "The standard taxonomy of business OPERATIONS — every activity inside a firm (develop strategy, market & sell, manage supply chain, manage HR...) in a numbered hierarchy used for benchmarking worldwide.", "url": "apqc.org/pcf"}], "legalForms": [{"name": "Sole Proprietorship", "definition": "One person owns and IS the business; no legal separation.", "governance": "Owner decides everything; unlimited personal liability; taxed on personal return.", "share": "~73% of U.S. businesses by count, ~4% of receipts."}, {"name": "General / Limited Partnership (GP, LP, LLP)", "definition": "Two or more co-owners share profits per a partnership agreement.", "governance": "Managed by general partners; limited partners are passive with liability capped at investment; pass-through taxation. LLPs shield professionals (law, accounting) from partners' malpractice.", "share": "Standard form for law firms, private equity funds, and family enterprises."}, {"name": "Limited Liability Company (LLC)", "definition": "Hybrid granting corporate liability protection with partnership tax flexibility.", "governance": "Governed by an operating agreement; member-managed or manager-managed; the default modern form for new private U.S. businesses.", "share": "The fastest-growing entity type since the 1990s."}, {"name": "C-Corporation", "definition": "A legal person separate from its owners, with perpetual life and freely transferable shares.", "governance": "Shareholders elect a board of directors, which hires officers. Double taxation (entity + dividends). The required form for venture-backed and public companies.", "share": "Nearly all large enterprises; ~1.7M U.S. C-corps produce the majority of business receipts."}, {"name": "S-Corporation", "definition": "A corporation electing pass-through taxation under Subchapter S.", "governance": "Same board/officer structure as a C-corp but limited to 100 U.S. shareholders and one class of stock.", "share": "~5M U.S. entities — the most common corporate form by count."}, {"name": "Benefit Corporation / B-Corp", "definition": "A for-profit legally bound to consider social and environmental impact alongside profit.", "governance": "Directors owe duties to stakeholders, not just shareholders; annual benefit report. (B-Corp certification by B Lab is separate from the statutory form.)", "share": "Patagonia, Ben & Jerry's, Danone N.A."}, {"name": "Cooperative", "definition": "Owned and democratically controlled by its members — customers, workers, or producers.", "governance": "One member, one vote; profits returned as patronage dividends. Includes credit unions, rural electric co-ops, agricultural co-ops (Land O'Lakes, Ocean Spray).", "share": "~30,000 U.S. co-ops; dominant in farm marketing and rural utilities."}, {"name": "Nonprofit / 501(c)(3) and kin", "definition": "Mission-owned organization with no shareholders; surpluses must be reinvested in the mission.", "governance": "Self-perpetuating or member-elected board of trustees; IRS oversight of tax exemption; state attorney general oversight of charitable assets.", "share": "~1.8M U.S. nonprofits — hospitals, universities, charities, churches, associations."}, {"name": "Joint Venture / Strategic Alliance", "definition": "Two or more firms co-own a distinct entity or contractually pool capabilities for a defined purpose.", "governance": "Governed by JV agreement and a joint board; common in energy, aerospace, autos, and cross-border market entry.", "share": "The standard vehicle for megaprojects and technology-sharing."}, {"name": "State-Owned / Government Enterprise", "definition": "A commercial enterprise owned wholly or partly by the state.", "governance": "Board appointed by government; blends public mandate with commercial operation (TVA, Amtrak, USPS; Saudi Aramco, EDF globally).", "share": "Globally enormous — many of the world's largest energy, banking, and rail firms."}, {"name": "Holding Company / Conglomerate", "definition": "An entity that owns controlling stakes in operating subsidiaries rather than operating itself.", "governance": "Parent board allocates capital across subsidiaries, each with its own management (Berkshire Hathaway, Alphabet).", "share": "The architecture of nearly every large multi-business enterprise."}, {"name": "Franchise", "definition": "A brand owner (franchisor) licenses its business system to independent owner-operators (franchisees).", "governance": "Franchise agreement + FTC Franchise Rule disclosure; franchisor polices brand standards; franchisee owns the local P&L.", "share": "~800,000 U.S. franchise establishments — fast food, hotels, fitness, services."}], "universalLadder": [{"tier": "Shareholders / Members / Owners", "layer": "Ownership", "what": "The residual claimants. They supply equity capital, bear ultimate risk, and hold the ultimate vote: electing directors, approving mergers, amending charters. In nonprofits this seat is held by the mission itself, supervised by trustees and the state attorney general."}, {"tier": "Board of Directors", "layer": "Governance", "what": "The fiduciary body. Owes duties of care and loyalty; hires/fires the CEO, approves strategy, budgets, major transactions, and executive pay. Works through standing committees — Audit (financial integrity, mandated by Sarbanes-Oxley for public firms), Compensation, Nominating & Governance, and increasingly Risk and Technology. Led by a Chair (or Lead Independent Director when the CEO chairs)."}, {"tier": "Chief Executive Officer (CEO)", "layer": "Executive", "what": "The single point of accountability for the whole enterprise. Sets strategy with the board, allocates capital and talent, owns the operating model and culture, and is the face to investors, regulators, and the public. Measured by total shareholder return, growth, and strategic milestones. SOC 11-1011."}, {"tier": "C-Suite Officers", "layer": "Executive", "what": "The CEO's cabinet, each owning an enterprise-wide system: CFO (capital, accounting, FP&A, investor relations), COO (day-to-day operations), CTO/CIO (technology build vs. run), CMO (demand and brand), CHRO (talent and organization), General Counsel/CLO (legal exposure), CRO (enterprise risk), CCO (compliance), CISO (security), CSO (strategy). Corporate officers are legally appointed by the board and can bind the company."}, {"tier": "Presidents / EVPs / SVPs of Business Units", "layer": "Executive", "what": "Own a full P&L — a division, region, or product line. They are mini-CEOs: responsible for revenue, cost, and headcount of their unit, translating enterprise strategy into unit plans. In a divisional (M-form) organization this is where strategy meets the market."}, {"tier": "Vice Presidents / Directors", "layer": "Management", "what": "Own a function or portfolio within a unit — VP of Sales for a region, Director of Engineering for a product area. They convert annual plans into quarterly execution: set targets, manage budgets, develop managers, and arbitrate resource conflicts. The organizational middle where most coordination actually happens."}, {"tier": "Managers / Supervisors", "layer": "Management", "what": "The front line of management — own a team of 5-15 people. Hire, train, schedule, review performance, remove blockers, and translate targets into individual work. First-line supervisors have their own SOC codes in every industry (51-1011 production, 41-1012 sales, etc.) because this role exists everywhere."}, {"tier": "Professionals / Specialists", "layer": "Professional", "what": "The expert individual contributors — engineers, accountants, analysts, scientists, attorneys, designers, physicians. Advance on dual ladders (management vs. senior IC: Staff/Principal/Fellow, Senior Partner, Distinguished Engineer). Their output is judgment applied to hard problems; many are individually licensed (PE, CPA, MD, JD, Series licenses), which imports professional-body regulation directly into the firm."}, {"tier": "Operational Workforce", "layer": "Operational", "what": "The people who physically make, move, serve, fix, and protect — machinists, drivers, nurses' aides, linemen, cooks, cashiers, security officers. The majority of civilization's ~3.5 billion workers. Often unionized (collective bargaining adds another regulatory layer), credentialed by apprenticeship and certification rather than degree, and measured on safety, quality, and throughput."}], "coreFunctions": [{"name": "Finance & Accounting", "what": "Keeps score and allocates fuel: bookkeeping, financial reporting (GAAP/IFRS), planning & analysis, treasury, tax, audit, procurement of capital. Regulated by SEC reporting rules, SOX internal controls, and the PCAOB/AICPA audit regime."}, {"name": "Operations / Production", "what": "Converts inputs into the product or service: manufacturing, service delivery, quality management (ISO 9001, Six Sigma), capacity planning, maintenance. The function the whole firm exists to perform."}, {"name": "Sales & Business Development", "what": "Converts demand into revenue: pipeline, quota-carrying sellers, account management, channel partners, pricing execution. Measured in bookings, win rate, and retention."}, {"name": "Marketing", "what": "Creates and shapes demand: brand, product marketing, demand generation, communications, market research, pricing strategy. Regulated by FTC advertising law and self-regulated by the BBB National Programs' advertising division."}, {"name": "Human Resources / People", "what": "Acquires and develops the workforce: recruiting, compensation & benefits, learning, performance, labor relations, HRIS. Operates inside EEOC, DOL/FLSA, OSHA, NLRB, and ERISA law."}, {"name": "Information Technology", "what": "Runs the firm's nervous system: infrastructure, applications, data, cybersecurity, helpdesk. Governed by frameworks (ITIL, COBIT, NIST CSF) and, increasingly, by privacy law (GDPR, CCPA, HIPAA)."}, {"name": "Legal, Risk & Compliance", "what": "Keeps the firm inside the lines: contracts, litigation, IP, regulatory filings, ethics programs, enterprise risk management, internal audit. The in-house arm of the Law domain embedded in every company."}, {"name": "Research & Development", "what": "Builds the future offer: applied research, product development, engineering, design. Spend ranges from ~1% of revenue (retail) to 20%+ (pharma, semiconductors)."}, {"name": "Supply Chain & Logistics", "what": "Moves atoms: sourcing, purchasing, inventory, warehousing, transportation, S&OP. The function that connects every firm to the Trade and Infrastructure domains."}, {"name": "Corporate Strategy & Development", "what": "Decides where to play and how to win: strategic planning, M&A, partnerships, competitive intelligence, transformation offices."}], "regulationLayers": [{"name": "Layer 1 — State Regulation (vertical)", "what": "Governments license, inspect, and sanction. Every domain has its designated watchdogs: FERC and NERC for the grid, the Fed/OCC/FDIC/SEC/FINRA/CFTC for finance, FDA and CMS for medicine, FCC for communication, FAA for aviation, EPA for the environment, OSHA for every workplace. Above nations sit treaty bodies — WTO for trade, BIS/Basel for banking, ICAO/IMO for transport, WHO for health."}, {"name": "Layer 2 — Self-Regulation (internal)", "what": "Industries police themselves to pre-empt harsher state rules and to solve trust problems the market can't. Instruments: self-regulatory organizations with real teeth (FINRA fines brokers; state bars disbar lawyers; medical boards revoke licenses), accreditation (Joint Commission for hospitals, ABET for engineering schools), standards bodies (ISO, ANSI, IEEE, NFPA, UL), professional codes of ethics, and industry associations that set codes of practice (API in oil & gas, NAR in real estate, MPA film ratings, ESRB game ratings)."}, {"name": "Layer 3 — Mutual / Market Regulation (horizontal)", "what": "Businesses regulate each other. External auditors attest to financial statements; rating agencies (Moody's, S&P, Fitch) price credibility; insurers impose safety standards as a condition of coverage; exchanges impose listing standards; banks impose covenants; big buyers impose supplier codes of conduct and audits down the supply chain (RBA, Sedex); payment networks impose PCI-DSS; and reputation systems — from Better Business Bureau to app-store ratings — discipline quality at the retail edge."}], "sizeClasses": [{"name": "Micro-enterprise", "range": "1–9 employees", "note": "~75% of all firms; sole proprietors, family shops, independent professionals."}, {"name": "Small business", "range": "10–99 employees (SBA size standards vary to 500+ by NAICS)", "note": "The employment engine — U.S. small businesses employ ~46% of the private workforce."}, {"name": "Mid-market", "range": "100–999 employees / ~$10M–$1B revenue", "note": "Professionalized management appears: real C-suites, ERP systems, formal boards."}, {"name": "Large enterprise", "range": "1,000+ employees", "note": "~0.3% of firms but ~half of employment; multi-divisional structures, public listing common."}, {"name": "Multinational / Fortune Global 500", "range": "10,000–2M+ employees", "note": "Walmart (~2.1M employees) and Amazon (~1.5M) are civilization's largest private employers; the Global 500 alone books ~$40T+ in revenue."}]}, "domains": [{"id": "energy", "name": "Energy", "icon": "⚡", "tagline": "The conversion of fuel, flow, and field into the usable power that animates every other domain of civilization.", "view100k": {"role": "Energy is civilization's metabolic system: the domain that extracts, converts, transports, and delivers the joules that every other domain consumes. No factory turns, no hospital operates, no server farm computes, and no crop is irrigated at scale without the continuous, reliable delivery of electricity, refined fuels, and natural gas. Economists treat energy as a general-purpose input in the same class as labor and capital; historians treat energy transitions — wood to coal, coal to oil, oil to gas and renewables — as the deep engine of every industrial revolution since 1760. The domain spans upstream extraction (drilling, mining, harvesting wind and sun), midstream transport and storage (pipelines, tankers, LNG terminals, transmission grids), and downstream conversion and delivery (refineries, power plants, distribution utilities, retail fuel).\n\nAt global scale the energy sector represents roughly $6-10 trillion in annual revenue depending on commodity prices — oil and gas alone historically run $3-5 trillion, electric power around $2.5-3 trillion, and clean-energy investment crossed $1.7-2 trillion per year in the mid-2020s, exceeding fossil investment for the first time in history. Employment worldwide exceeds 65 million people across extraction, generation, grid operations, and energy efficiency; in the United States alone the sector employs over 8 million. The largest firms on earth by revenue have persistently been energy firms — Saudi Aramco, ExxonMobil, Shell, State Grid Corporation of China — and sovereign wealth itself is substantially an artifact of hydrocarbon rents.\n\nThe historical arc of the domain is a story of successive densification and now decarbonization. The coal-fired steam engine created the modern corporation and the railroad; Rockefeller's Standard Oil created both the vertically integrated multinational and, through its 1911 breakup, modern antitrust; Edison and Insull created the regulated natural-monopoly utility model that still governs the grid. The present era is defined by the energy transition: the largest coordinated reallocation of capital in economic history, in which wind, solar, storage, and electrification are being layered onto — and are progressively displacing — a hydrocarbon system that still supplies roughly 80% of primary energy. The domain's central management problem is therefore double: run the legacy system with five-nines reliability while simultaneously rebuilding it.", "interdependencies": "Energy is the upstream dependency of nearly all 19 other domains and the downstream customer of most of them. It powers Industry's furnaces, Agriculture's irrigation, fertilizer, and diesel fleets, Infrastructure's water and transit systems, Technology's data centers (now among the fastest-growing load classes), Medicine's hospitals and cold chains, and Communication's networks. In return it depends on Finance for project capital and commodity hedging markets; on Economy for price signals, subsidies, and carbon markets; on Trade for the seaborne movement of crude, LNG, and coal; on Infrastructure for ports, rail, and rights-of-way; on Science and Technology for reservoir modeling, turbine metallurgy, photovoltaics, and grid software; on Education for engineers and skilled trades; on Environment as both resource base and constraint (emissions, water use, land, permitting); on Governance and Law for the regulatory compacts, leases, and rate cases that define its economics; on Defense and Intelligence because energy security is national security (strategic petroleum reserves, grid cyber-defense, chokepoint protection); on Population for demand growth and workforce; and on Culture and Religion insofar as social license — from climate movements to resource nationalism — determines what may be built and where.", "regulationModel": "Energy is among the most intensively regulated domains because much of it is natural monopoly and all of it is safety- and security-critical. In the United States, the Federal Energy Regulatory Commission (FERC) regulates wholesale power markets, interstate transmission, and gas pipelines; state public utility commissions set retail rates under cost-of-service or performance-based regulation; the Nuclear Regulatory Commission licenses reactors; EPA and Interior (BLM, BOEM, BSEE) govern emissions and federal leasing; PHMSA governs pipeline safety; and CFTC polices energy derivatives. Reliability is governed by a hybrid model unique to the sector: NERC, a nonprofit self-regulatory organization, writes and enforces mandatory grid reliability and cybersecurity (CIP) standards under FERC oversight. Internationally, the IEA coordinates consumer-nation policy and strategic stocks, OPEC+ cartelizes supply among producer states, and IRENA and the UNFCCC process shape the transition. Self-regulation runs deep: the American Petroleum Institute publishes the engineering standards (API specs) the industry builds to, INPO enforces nuclear operational excellence peer review, and ISO/RTO markets impose real-time market discipline on generators every five minutes."}, "view10k": {"overview": "The domain maps primarily to NAICS Sector 21 (Mining, Quarrying, and Oil and Gas Extraction — subsector 211 oil and gas, 2121 coal), NAICS 2211 (Electric Power Generation, Transmission and Distribution), 2212 (Natural Gas Distribution), 324 (Petroleum and Coal Products Manufacturing, i.e., refining), 486 (Pipeline Transportation), and slices of 237 (heavy construction of power and pipeline infrastructure) and 523 (energy trading). Structurally the industry organizes along the value chain — upstream, midstream, downstream, and power — and by regulatory character: competitive commodity businesses (exploration, generation in restructured markets, trading) versus rate-regulated monopoly franchises (transmission, distribution). Firm types range from supermajors and national oil companies through investor-owned utilities, independent power producers, oilfield service giants, renewable developers, and municipal cooperatives.", "businessTypes": [{"name": "Integrated Oil & Gas Major (Supermajor / NOC)", "naics": "211120, 211130, 324110", "definition": "A vertically integrated company operating across upstream exploration and production, midstream transport, downstream refining, and retail marketing of hydrocarbons.", "operations": "Makes money on the spread between finding-and-development costs and realized commodity prices upstream, and on crack spreads (crude-to-product margins) downstream; integration hedges the cycle since refining margins often widen when crude falls. Day-to-day operations center on managing a portfolio of multi-billion-dollar, decade-horizon capital projects, reserve replacement, trading desks that optimize physical flows, and relentless cost-per-barrel discipline.", "regulation": "Regulated by SEC (reserve disclosure rules), EPA, Interior/BOEM/BSEE offshore, state oil and gas commissions (e.g., Texas Railroad Commission), and host-government petroleum ministries abroad. Self-regulates through American Petroleum Institute standards, IOGP guidelines, and post-Macondo consortia like the Center for Offshore Safety.", "examples": "ExxonMobil, Shell, Chevron, Saudi Aramco"}, {"name": "Independent Exploration & Production (E&P) Company", "naics": "211120, 211130", "definition": "A non-integrated firm focused solely on finding and producing crude oil and natural gas, typically onshore shale or offshore basins, selling output at the wellhead.", "operations": "Revenue is production volume times realized price minus lifting and development costs; the business is a treadmill of leasing acreage, drilling and completing wells (whose output declines 60-70% in year one for shale), and hedging 12-24 months of production with swaps and collars. Core processes are geoscience-driven prospect generation, drilling program execution, and lease operating expense management.", "regulation": "State oil and gas regulators issue drilling permits and spacing rules; EPA and state agencies govern methane, flaring, and produced water; SEC governs reserve reporting; CFTC oversees its hedge book. Self-regulation via API standards, state associations, and voluntary methane-certification schemes (e.g., MiQ, OGMP 2.0).", "examples": "ConocoPhillips, EOG Resources, Devon Energy, Diamondback Energy"}, {"name": "Oilfield Services & Drilling Contractor", "naics": "213111, 213112, 333132", "definition": "A firm that performs drilling, well completion (including hydraulic fracturing), well logging, and equipment manufacturing under contract to E&P operators, without owning the hydrocarbons.", "operations": "Earns dayrates on rigs and per-job pricing on frac fleets, wireline, cementing, and directional drilling; profitability tracks the rig count and is brutally cyclical. Operations are logistics-intensive: crewing 24/7 well sites, moving sand and water by the trainload, and maintaining high-spec rotating equipment.", "regulation": "OSHA and state oil and gas agencies regulate well-site safety; EPA regulates underground injection (SDWA UIC program); BSEE offshore. Self-regulates through API and IADC (International Association of Drilling Contractors) standards, well control certification (WellSharp), and customer safety audits.", "examples": "SLB (Schlumberger), Halliburton, Baker Hughes, Transocean"}, {"name": "Petroleum Refiner", "naics": "324110", "definition": "A manufacturer that converts crude oil into gasoline, diesel, jet fuel, and petrochemical feedstocks through distillation, cracking, and treating.", "operations": "Margin is the crack spread — product basket value minus crude cost — optimized daily by linear-programming models that choose crude slates and unit run rates; refineries run continuously for 3-5 years between turnarounds. Money is made on utilization, crude sourcing flexibility, and yield toward the highest-value products.", "regulation": "EPA (Clean Air Act, fuel specifications, Renewable Fuel Standard RIN obligations), OSHA Process Safety Management, Chemical Safety Board investigations, and state air districts. Self-regulates through AFPM (American Fuel & Petrochemical Manufacturers) practices and API recommended practices for process safety.", "examples": "Marathon Petroleum, Valero, Phillips 66"}, {"name": "Midstream Pipeline & Storage Operator", "naics": "486110, 486210, 486910, 493190", "definition": "An owner-operator of pipelines, gathering systems, processing plants, storage caverns, and export terminals that transport hydrocarbons between producers and consumers for a fee.", "operations": "A toll-road model: revenue from long-term, fee-based transport and storage contracts (take-or-pay capacity reservations), largely insulated from commodity prices; many operate as MLPs or C-corps optimized for distributable cash flow. Daily work is scheduling nominations, running compressor and pump stations, integrity management (pigging, inline inspection), and commercial contracting of capacity.", "regulation": "FERC sets interstate pipeline tariffs and terms; PHMSA enforces pipeline safety; TSA issues pipeline cybersecurity directives; states regulate intrastate lines. Self-regulation via API 1160/1173 pipeline safety management systems and INGAA and Liquid Energy Pipeline Association commitments.", "examples": "Kinder Morgan, Enterprise Products Partners, Energy Transfer, Williams"}, {"name": "Investor-Owned Electric Utility (Vertically Integrated or Wires-Only)", "naics": "221111-221118, 221121, 221122", "definition": "A shareholder-owned franchise monopoly that generates and/or transmits and distributes electricity to captive retail customers under rate regulation.", "operations": "Earns an allowed return on equity applied to its rate base (invested capital), set in periodic rate cases before the state commission — so growth comes from prudent capital investment in grid modernization, generation replacement, and reliability. Operations run 24/7 control centers, vegetation management, outage restoration, metering and billing for millions of accounts, and integrated resource planning on 20-year horizons.", "regulation": "State public utility commissions set retail rates and service standards; FERC regulates its transmission and wholesale sales; NERC enforces reliability and CIP cyber standards; EPA governs plant emissions. Self-regulates through EEI (Edison Electric Institute) mutual-assistance compacts and IEEE technical standards.", "examples": "NextEra Energy (FPL), Duke Energy, Southern Company, PG&E"}, {"name": "Independent Power Producer / Merchant Generator", "naics": "221111, 221112, 221113, 221118", "definition": "A competitive generator that sells electricity and capacity into wholesale markets or under long-term power purchase agreements rather than through a regulated retail franchise.", "operations": "Revenue comes from energy sales cleared in ISO/RTO auctions (bid every five minutes to an hour), capacity market payments, ancillary services, and bilateral PPAs; margin is the spark spread between fuel cost and power price. Core processes are dispatch optimization, fuel procurement, plant availability, and hedging of a volatile merchant position.", "regulation": "FERC grants market-based rate authority and polices market manipulation; NERC reliability standards apply; ISO/RTO market monitors surveil bidding behavior; NRC if nuclear. Self-regulation through EPSA (Electric Power Supply Association) and rigorous internal risk-control frameworks patterned on trading compliance.", "examples": "Vistra, Constellation Energy, NRG Energy, Talen"}, {"name": "Renewable Energy Developer & Operator", "naics": "221114, 221115, 237130", "definition": "A firm that originates, permits, finances, constructs, and operates utility-scale solar, wind, and battery storage projects.", "operations": "Develops greenfield sites (land control, interconnection queue position, permits, offtake PPA), finances them with tax equity monetizing ITC/PTC credits plus project debt, then earns contracted cash flows for 15-30 years; a development pipeline is the core asset. Day-to-day work spans interconnection studies, EPC management, asset-management SCADA monitoring, and REC/credit transfer sales.", "regulation": "FERC (interconnection and QF status), state siting boards and local zoning, U.S. Fish & Wildlife (eagle/endangered species takes), Treasury/IRS (tax credit compliance), NERC once operating. Self-regulates via ACP (American Clean Power) and SEIA codes, and third-party certification of production estimates for financiers.", "examples": "NextEra Energy Resources, Ørsted, Invenergy, Brookfield Renewable"}, {"name": "Natural Gas Local Distribution Company (LDC)", "naics": "221210", "definition": "A regulated utility that purchases wholesale natural gas and distributes it through low-pressure mains to residential, commercial, and industrial burner tips.", "operations": "Earns a regulated return on its distribution rate base while passing through commodity costs at no markup via purchased-gas adjustment clauses; the winter peak defines system design. Operations center on leak survey and repair, main replacement programs (cast iron/bare steel), odorization, emergency response, and storage/pipeline capacity portfolio management.", "regulation": "State utility commissions set rates; PHMSA and state pipeline safety programs enforce 49 CFR 192 distribution integrity rules. Self-regulates through the American Gas Association's peer reviews and GTI technical standards.", "examples": "Atmos Energy, Southern California Gas, National Grid (US gas), Spire"}, {"name": "Nuclear Plant Operator", "naics": "221113", "definition": "A licensed operator of fission reactors producing baseload, zero-carbon electricity under the strictest safety regime in industry.", "operations": "Economics favor maximal capacity factor (top fleets exceed 92%) against high fixed costs; revenue comes from regulated rates, merchant sales, state zero-emission credits, and increasingly hyperscaler PPAs. Operations are procedure-driven to a degree unique in industry: licensed control-room crews, 18-24 month refueling outages executed in ~25 days, and continuous requalification training.", "regulation": "The Nuclear Regulatory Commission licenses every reactor and licensed operator, with resident inspectors on site; FEMA reviews emergency preparedness. Self-regulation through INPO — the industry's peer-review body whose confidential evaluations effectively set insurance and standing — plus WANO globally.", "examples": "Constellation Energy, Vistra, Électricité de France (EDF)"}, {"name": "Energy Trading & Marketing House", "naics": "523160, 425120", "definition": "A firm that buys, sells, transports, and hedges physical and financial energy commodities — power, gas, crude, products, LNG, environmental credits — capturing arbitrage across time, geography, and form.", "operations": "Profits from basis spreads, storage optionality (buy summer gas, store, sell winter), transport arbitrage, and structured origination deals with producers and utilities; positions are marked to market daily against VaR limits. The daily rhythm is scheduling physical flows, nominating pipeline and grid capacity, and running desks segmented by commodity and region.", "regulation": "CFTC regulates futures, swaps, and anti-manipulation; FERC polices physical power and gas market manipulation (post-Enron authority); exchanges (CME/ICE) impose position limits. Self-regulates through ISDA master agreements, EEI/NAESB standard contracts, and independent middle-office risk functions.", "examples": "Vitol, Trafigura, Glencore, Shell Trading"}, {"name": "Electric Cooperative / Municipal Utility", "naics": "221122, 221121", "definition": "A consumer-owned (co-op) or city-owned (muni) nonprofit utility distributing power at cost to member-owners or citizens, dominant in rural and some urban America.", "operations": "Operates on a cost-of-service, not-for-profit basis: rates recover expenses and margins are returned to members as capital credits; generation is often procured through G&T (generation and transmission) co-ops. Operations mirror an IOU's — line crews, dispatch, billing — at smaller scale with strong mutual-aid networks.", "regulation": "Governed by elected member boards or city councils rather than (in most states) PUC rate jurisdiction; RUS (USDA Rural Utilities Service) loan covenants apply to many co-ops; NERC standards apply to larger systems. Self-regulation through NRECA and APPA standards, safety programs, and mutual-assistance compacts.", "examples": "Tri-State G&T, Pedernales Electric Cooperative, Salt River Project, Los Angeles DWP"}, {"name": "Fuel Distribution & Retail (Downstream Marketing)", "naics": "424710, 424720, 457110, 457210", "definition": "Wholesalers, jobbers, and retailers that move refined products from terminal racks to service stations, fleets, homes, and airports.", "operations": "Margin per gallon is thin (retail fuel often nets cents per gallon) so profit concentrates in convenience-store sales, volume, and terminal logistics; jobbers arbitrage rack prices across terminals daily. Core processes are tank-truck fleet dispatch, inventory and price management updated intraday, and branded-supplier contract compliance.", "regulation": "EPA (underground storage tank rules, fuel specs), state weights-and-measures inspectors, FTC (franchise and pricing practices), IRS (motor fuel excise). Self-regulates through NACS and EMA (Energy Marketers of America) codes and branded-flag image and quality standards.", "examples": "Pilot Flying J, Casey's, Sunoco LP, World Kinect"}], "regulators": [{"name": "Federal Energy Regulatory Commission (FERC)", "jurisdiction": "US", "role": "Regulates wholesale electricity markets, interstate transmission rates, natural gas pipeline certification and tariffs, hydropower licensing, and LNG terminal siting; polices market manipulation with civil penalty authority."}, {"name": "North American Electric Reliability Corporation (NERC)", "jurisdiction": "US/Canada", "role": "The FERC-certified Electric Reliability Organization — an industry self-regulatory body that writes and enforces mandatory grid reliability and Critical Infrastructure Protection (cybersecurity) standards, with fines up to $1M+ per violation per day."}, {"name": "Nuclear Regulatory Commission (NRC)", "jurisdiction": "US", "role": "Licenses commercial reactors, fuel-cycle facilities, and individual reactor operators; stations resident inspectors at every plant and can order immediate shutdown."}, {"name": "State Public Utility Commissions (e.g., CPUC, NYPSC, PUCT)", "jurisdiction": "US states", "role": "Set retail electric and gas rates through adjudicated rate cases, approve utility capital plans and resource procurement, and enforce service quality and safety for franchise monopolies."}, {"name": "Environmental Protection Agency (EPA)", "jurisdiction": "US", "role": "Regulates power plant and refinery emissions (Clean Air Act), fuel standards and the Renewable Fuel Standard, methane rules for oil and gas, and underground injection of produced water."}, {"name": "Pipeline and Hazardous Materials Safety Administration (PHMSA)", "jurisdiction": "US", "role": "Writes and enforces safety regulations for 3.3 million miles of gas and hazardous-liquid pipelines, including integrity management, operator qualification, and incident reporting."}, {"name": "International Energy Agency (IEA) / OPEC", "jurisdiction": "Global", "role": "IEA coordinates strategic petroleum reserves and energy policy among consumer nations; OPEC+ manages production quotas among producer states — together the twin poles of global oil governance."}, {"name": "American Petroleum Institute (API)", "jurisdiction": "US/Global (industry association)", "role": "The sector's principal self-regulatory standards body: publishes 700+ engineering and safety standards (well design, tanks, pipelines) that regulators incorporate by reference, and certifies equipment and personnel."}]}, "groundView": {"orgModel": "A typical large energy company is governed by a board of directors with mandatory audit, compensation, and — distinctively — safety/operations and sustainability committees, reflecting the sector's catastrophic-risk profile. Below the CEO, the executive layer divides along the value chain (EVPs of Upstream/Generation, Midstream/Transmission, Downstream/Distribution or Retail) supported by a powerful CFO organization (because the business is capital allocation), a Chief Operating Officer, and staff functions with unusual weight: HSE (health, safety, environment), regulatory affairs (who litigate rate cases or manage permits), engineering, land/right-of-way, and trading/risk. Business units run as asset-centric P&Ls — a refinery, a fleet of plants, a basin — each led by an asset or plant manager commanding operations, maintenance, and engineering superintendents, beneath whom sit shift supervisors and then the licensed operators, technicians, lineworkers, and crews who physically run the system around the clock.", "positions": [{"title": "Board Director (Utility/Energy Board)", "level": "Governance", "reportsTo": "Shareholders / Members", "duties": "Sets risk appetite for a business where failure means blackouts or blowouts; approves multi-billion-dollar capital programs, CEO succession, and dividend policy; chairs committees overseeing audit, nuclear/operational safety, and climate transition strategy. Measured on total shareholder return, safety record, and regulatory standing.", "credentials": "Prior C-suite experience in energy, finance, or engineering; NACD directorship credentialing common; nuclear boards typically include ex-Navy or ex-NRC expertise.", "socCode": "11-1011"}, {"title": "Chief Executive Officer", "level": "Executive", "reportsTo": "Board of Directors", "duties": "Owns capital allocation across a decades-long asset portfolio, the regulatory and political relationships that define allowed returns, and the safety culture of the enterprise. Spends time on rate-case strategy or portfolio high-grading, major project FIDs, and investor communication. Measured on ROE versus allowed ROE, TSR, reserve replacement or rate-base growth, and OSHA/SAIDI safety-reliability metrics.", "credentials": "Engineering or finance degree plus MBA typical; 25+ years operating experience; P&L leadership of a major business unit.", "socCode": "11-1011"}, {"title": "Chief Financial Officer", "level": "Executive", "reportsTo": "CEO", "duties": "Runs financing for one of the most capital-intensive business models in existence: rate-case revenue requirements or project finance structures, commodity hedge programs, credit-rating defense, and tax-equity monetization of energy credits. Owns FP&A, treasury, and investor relations. Measured on cost of capital, FFO/debt ratios, and earnings delivery.", "credentials": "CPA or CFA, MBA; deep familiarity with FERC accounting (Uniform System of Accounts) or oil-and-gas full-cost/successful-efforts accounting.", "socCode": "11-3031"}, {"title": "Chief Operating Officer / EVP Operations", "level": "Executive", "reportsTo": "CEO", "duties": "Accountable for every megawatt-hour generated and every barrel moved: fleet availability, outage execution, storm restoration, and the HSE record. Chairs operating committees reviewing plant performance and near-miss incidents. Measured on capacity factor, SAIDI/SAIFI reliability indices, TRIR safety rate, and O&M cost per unit.", "credentials": "BS in mechanical/electrical/petroleum engineering; often a licensed Professional Engineer (PE); 20+ years through plant and asset management roles.", "socCode": "11-1011"}, {"title": "Chief Regulatory & External Affairs Officer", "level": "Executive", "reportsTo": "CEO", "duties": "Leads rate cases, FERC filings, permit campaigns, and legislative strategy — in a regulated utility this role effectively negotiates the company's revenue. Manages testimony, settlement talks with consumer advocates, and commissioner relationships. Measured on authorized ROE, constructive regulatory outcomes, and permit cycle times.", "credentials": "JD or economics/public policy graduate degree; former commission staff or FERC experience highly valued.", "socCode": "11-1011"}, {"title": "VP Health, Safety & Environment (HSE)", "level": "Executive", "reportsTo": "COO or CEO", "duties": "Owns the process-safety and environmental management systems: incident investigation, PSM audits, emissions compliance, and emergency response readiness. Has stop-work authority across the enterprise. Measured on TRIR, process safety event rates, and notices of violation.", "credentials": "BS in engineering or occupational safety; CSP (Certified Safety Professional) or CIH; refinery/plant operations background.", "socCode": "11-9199"}, {"title": "Plant Manager / Asset Manager", "level": "Management", "reportsTo": "VP Generation / Regional Operations VP", "duties": "The single point of accountability for a power station, refinery unit, or producing field: budget, staffing, maintenance planning, regulatory inspections, and community relations. Runs the daily plan-of-the-day meeting and owns outage scope and schedule. Measured on availability, heat rate or lifting cost, budget variance, and zero-harm metrics.", "credentials": "BS engineering; PE common; for nuclear, prior Senior Reactor Operator license nearly mandatory; 15+ years operations/maintenance progression.", "socCode": "11-3051"}, {"title": "Transmission & Distribution Operations Manager", "level": "Management", "reportsTo": "VP Grid Operations", "duties": "Directs the control centers and field districts that operate the wires: switching orders, outage restoration priorities, mutual-aid deployment during storms, and NERC compliance evidence. Measured on SAIDI/SAIFI, wires safety events, and restoration times.", "credentials": "BSEE typical; NERC System Operator certification for control-room paths; journeyman-lineworker-to-management routes common.", "socCode": "11-9199"}, {"title": "Drilling Superintendent", "level": "Management", "reportsTo": "VP Drilling & Completions", "duties": "Plans and supervises drilling programs across multiple rigs: well design execution, contractor performance, cost per lateral foot, and well control readiness. On call 24/7 for stuck pipe, kicks, and NPT (non-productive time) decisions. Measured on days-per-well, cost versus AFE, and safety.", "credentials": "BS petroleum engineering; IADC WellSharp well-control certification; 10+ years from rig floor or drilling engineer roles.", "socCode": "11-9041"}, {"title": "Trading Desk Head / Manager, Energy Trading", "level": "Management", "reportsTo": "Chief Commercial Officer", "duties": "Runs a commodity desk (power, gas, crude): sets trader limits within the risk mandate, approves structured deals, and owns desk P&L and its VaR utilization. Reviews positions each morning against overnight market moves and scheduling issues. Measured on risk-adjusted P&L and limit compliance.", "credentials": "Quantitative degree (economics, math, engineering); Series 3 where futures brokerage applies; a decade of trading or origination experience.", "socCode": "11-3031"}, {"title": "Petroleum Engineer (Reservoir/Production)", "level": "Professional", "reportsTo": "Engineering Manager / Asset Manager", "duties": "Models reservoirs, designs completions, forecasts decline curves, and books reserves under SEC rules; recommends workovers and artificial lift changes to arrest decline. Owns the technical economics of each well. Measured on production versus forecast and EUR added per dollar.", "credentials": "BS/MS petroleum engineering; PE license for those signing reserve reports; SPE membership standard.", "socCode": "17-2171"}, {"title": "Electrical Engineer, Grid Planning & Protection", "level": "Professional", "reportsTo": "Manager, Transmission Planning", "duties": "Runs power-flow, short-circuit, and stability studies; sets protective relay schemes; writes interconnection study reports for new generators; ensures NERC TPL planning standard compliance. Measured on study quality, misoperation rates, and project support timeliness.", "credentials": "BSEE, often MSEE; PE license expected within 5 years; PSS/E or PSCAD proficiency.", "socCode": "17-2071"}, {"title": "Energy Trader (Power/Gas Scheduler-Trader)", "level": "Professional", "reportsTo": "Trading Desk Head", "duties": "Buys and sells physical and financial energy: bids generation into day-ahead ISO markets, schedules pipeline nominations by the 11:00 ET Timely cycle, and manages intraday length or shortness against weather swings. Marks positions daily and defends them at risk meetings. Measured on desk P&L attribution and scheduling-error rate.", "credentials": "Bachelor's in economics, finance, engineering, or meteorology; ERCOT/PJM market rules fluency; Series 3 if brokering futures.", "socCode": "41-3031"}, {"title": "Geoscientist (Geologist/Geophysicist)", "level": "Professional", "reportsTo": "Exploration Manager", "duties": "Interprets seismic volumes and well logs to map subsurface structure and rock properties, generates drillable prospects with risked volumes, and steers wells geologically in real time. Measured on prospect success rate and reserves added.", "credentials": "MS in geology or geophysics is the de facto entry ticket; licensed Professional Geologist in some states; Petrel/Kingdom software mastery.", "socCode": "19-2042"}, {"title": "NERC Compliance / Regulatory Analyst", "level": "Professional", "reportsTo": "Director, Compliance", "duties": "Maintains the evidence trail proving adherence to reliability and CIP cyber standards, coordinates regional entity audits, files self-reports and mitigation plans, and tracks new FERC orders into internal procedures. Measured on audit findings and on-time filings.", "credentials": "Bachelor's in engineering, business, or political science; NERC standards expertise; CCEP compliance certification a plus.", "socCode": "13-1041"}, {"title": "Power Plant Operator / Control Room Operator", "level": "Operational", "reportsTo": "Shift Supervisor", "duties": "Operates boilers, turbines, and generators from the control room and in the field: executes startups and shutdowns, monitors hundreds of parameters, responds to alarms, and tags out equipment for maintenance under lockout/tagout. Works rotating 12-hour shifts. Measured on availability, deviation-free operation, and safety.", "credentials": "High school plus utility apprenticeship or Navy nuclear/power school; state boiler or NERC certifications as applicable; for nuclear, an NRC Reactor Operator license (51-8011).", "socCode": "51-8013"}, {"title": "Electrical Power-Line Installer & Repairer (Lineworker)", "level": "Operational", "reportsTo": "Line Crew Foreman / District Supervisor", "duties": "Builds and repairs energized distribution and transmission lines from bucket trucks and climbing hooks — often at 13.8kV to 500kV, in storms, using rubber-glove and hot-stick live-line techniques. Restores outages, sets poles, and switches circuits under dispatcher orders. Measured on restoration speed, switching accuracy, and zero-contact safety.", "credentials": "4-year IBEW/utility apprenticeship (~7,000 hours) to journeyman status; CDL; OSHA 1910.269 qualification; first-aid/CPR.", "socCode": "49-9051"}, {"title": "Wind Turbine Service Technician", "level": "Operational", "reportsTo": "Site Operations Manager", "duties": "Climbs 300-foot towers to troubleshoot and repair gearboxes, generators, pitch and yaw systems, and converters; performs scheduled torque, lubrication, and blade inspections; resets faults remotely via SCADA when possible. Measured on turbine availability and mean time to repair.", "credentials": "Wind-tech associate certificate or GWO Basic Safety Training; climbing/rescue certification; electrical and hydraulic competencies.", "socCode": "49-9081"}, {"title": "Derrickhand / Roustabout (Oilfield Crew)", "level": "Operational", "reportsTo": "Driller / Toolpusher", "duties": "Performs the physical work of the well site: handling pipe in the derrick, mixing drilling mud, rigging up and down, maintaining pumps and leases, and keeping the location safe and clean through 12-hour tours on rotational schedules. Measured on crew NPT, safety observations, and tour performance.", "credentials": "No degree required; SafeLand/rig-pass safety orientation; progression ladder roustabout → floorhand → derrickhand → driller.", "socCode": "47-5071"}, {"title": "Gas Utility Service Technician", "level": "Operational", "reportsTo": "Field Operations Supervisor", "duties": "Responds to odor calls and emergency leak orders, performs leak surveys with combustible-gas indicators, relights appliances, sets and exchanges meters, and executes main and service repairs under DOT operator-qualification rules. Measured on emergency response times and OQ compliance.", "credentials": "High school plus utility training program; DOT Operator Qualification certifications per covered task; CDL often required.", "socCode": "49-9012"}]}}, {"id": "finance", "name": "Finance", "icon": "🏦", "tagline": "The intermediation of capital across time, space, and risk — turning savings into investment and uncertainty into priced, tradable contracts.", "view100k": {"role": "Finance is civilization's capital-allocation and risk-transfer machinery. Its irreducible functions, in Merton's classic formulation, are six: clearing payments, pooling savings, transferring resources across time and space, managing risk, producing price information, and mitigating the incentive problems that arise when one party knows more than another. Banks transform short-term deposits into long-term loans; insurers pool idiosyncratic catastrophe into an actuarially priced premium; securities markets let a railroad or a startup sell claims on its future to ten thousand strangers; and payment systems move value between them all in milliseconds. Without these functions, capital sits idle where it is saved rather than flowing to where it is productive — which is precisely the condition of pre-financial economies.\n\nThe scale is enormous even measured conservatively. Global banking assets exceed $180 trillion; assets under management worldwide passed $120 trillion; global insurance premiums run near $7 trillion annually; daily foreign-exchange turnover alone exceeds $7.5 trillion. Finance and insurance contribute roughly 8% of U.S. GDP and employ about 6.5 million Americans, with tens of millions more globally across banking, insurance, asset management, exchanges, and fintech. The sector's peculiarity is leverage: a bank operating at 10:1 means the system's stability is a public good, which is why finance is regulated more like a utility than its private profits suggest.\n\nHistorically, the domain's arc runs from Renaissance Italian deposit banking and double-entry bookkeeping, through the Amsterdam and London exchanges that financed the joint-stock age, the Rothschild-era sovereign bond market, and the American innovations of investment banking, consumer credit, and the mutual fund. Its rhythm is the credit cycle: euphoria, crisis, re-regulation — 1907 begat the Federal Reserve, 1929 begat Glass-Steagall and the SEC, 2008 begat Dodd-Frank and Basel III. The current chapter is defined by the digitization of every function (payments, lending, advice), the migration of credit from banks to private markets, and the contest over whether money itself — stablecoins, CBDCs, tokenized assets — will be re-platformed.", "interdependencies": "Finance is the circulatory system through which every other domain funds itself: Energy's project finance and commodity hedges, Trade's letters of credit and receivables factoring, Agriculture's crop insurance and futures markets, Infrastructure's municipal bonds, Industry's working capital, Technology's venture capital, Medicine's health insurance, and Education's student lending. In return it depends on Economy for the monetary policy, statistics, and macro-stability that anchor all pricing; on Technology for the trading, core-banking, and payment rails that are now its physical plant; on Communication for the market data and networks on which price discovery rides; on Law for the enforceability of contracts, collateral, and bankruptcy that make lending possible at all; on Governance for deposit insurance, lender-of-last-resort backstops, and regulatory legitimacy; on Intelligence and Defense for sanctions enforcement, anti-money-laundering, and cyber-defense of systemically critical infrastructure; on Education for its quantitative workforce; on Science for the mathematics of option pricing and risk; on Population for demographic flows that drive savings and pension liabilities; on Environment for the catastrophe and climate risks it must now price; and on Culture and Religion for the trust norms — and constraints like Islamic finance's prohibition of riba — that shape what financial contracts societies will accept.", "regulationModel": "Finance operates under the densest regulatory lattice of any private industry, layered by function and by charter. In the U.S., the Federal Reserve supervises bank holding companies and sets monetary policy; the OCC charters and examines national banks; the FDIC insures deposits and resolves failures; the SEC governs securities issuance, exchanges, funds, and advisers; the CFTC governs futures and swaps; the CFPB polices consumer financial products; FinCEN enforces anti-money-laundering; and insurance is regulated state-by-state, coordinated through the NAIC. A distinctive feature is statutory self-regulation: FINRA (broker-dealers) and the NFA (futures) are industry-funded SROs with examination and enforcement power under SEC/CFTC oversight, and exchanges like NYSE and CME are themselves SROs. Internationally, the Basel Committee sets bank capital standards, IOSCO coordinates securities regulators, the FSB monitors systemic risk, IAIS covers insurance, and FATF sets AML standards. Beneath all of it operates market discipline — rating agencies, short sellers, counterparty credit limits, and the daily plebiscite of funding markets — which regulators deliberately harness through disclosure regimes."}, "view10k": {"overview": "The domain corresponds to NAICS Sector 52 (Finance and Insurance): subsector 521 (monetary authorities), 522 (credit intermediation — banks, credit unions, card issuers, mortgage and consumer lenders, payment processors), 523 (securities, commodity contracts, and investments — investment banking and intermediation 523150, exchanges 523210, portfolio management and advice 523940), 524 (insurance carriers 5241 and agencies/brokerages 5242), and 525 (funds, trusts, and other vehicles). Structurally the industry organizes by balance-sheet model: spread businesses that earn net interest margin on leveraged balance sheets (banks, insurers), fee businesses that earn on flows and assets (asset managers, brokers, payment networks), and risk-transfer businesses that earn underwriting margin (insurance, derivatives dealing). Firm sizes range from four U.S. money-center banks above $1.7 trillion in assets to 4,400 community banks, 4,500 credit unions, and thousands of RIAs and fintechs.", "businessTypes": [{"name": "Commercial Bank (Money-Center / Regional / Community)", "naics": "522110", "definition": "A chartered depository institution that takes insured deposits and extends commercial, real estate, and consumer credit, operating the core payment accounts of the economy.", "operations": "Earns net interest margin — the spread between loan yields and deposit costs — plus fees from treasury management, cards, and mortgage servicing; profitability is measured in ROA/ROE against efficiency ratio. Daily operations run credit underwriting committees, asset-liability management (ALCO) of interest-rate risk, branch and digital channel service, and BSA/AML transaction monitoring.", "regulation": "Supervised by the OCC (national charters) or Fed/FDIC plus state regulators (state charters), with FDIC deposit insurance, Fed holding-company oversight, CFPB consumer rules, and Basel III capital/liquidity requirements. Self-regulates through ABA and state banker association codes, internal audit's three-lines-of-defense model, and BAI operational standards.", "examples": "JPMorgan Chase, Bank of America, PNC, a typical $1B community bank"}, {"name": "Investment Bank / Broker-Dealer", "naics": "523150", "definition": "A securities firm that underwrites debt and equity issuance, advises on mergers and acquisitions, makes markets, and executes trades for institutional and retail clients.", "operations": "Revenue splits between advisory fees (M&A retainers and success fees of ~1-2% of deal value), underwriting spreads (gross spreads of ~2-7% on IPOs), and sales-and-trading (bid-ask capture, financing, and prime brokerage). The daily engine is deal teams building models and roadshows, trading desks quoting two-way markets, and a capital committee rationing balance sheet.", "regulation": "SEC registration and net-capital rules (15c3-1), FINRA membership with its examination and enforcement regime, Fed oversight if bank-affiliated, and SIPC customer protection. Self-regulates through FINRA itself (the archetypal SRO), SIFMA best practices, and mandatory registered-principal supervision structures.", "examples": "Goldman Sachs, Morgan Stanley, Evercore, Jefferies"}, {"name": "Asset Manager (Mutual Funds / ETFs / Institutional)", "naics": "523940, 525910", "definition": "A fiduciary firm that invests pooled client capital in securities portfolios for a fee, spanning index funds, active strategies, and institutional mandates.", "operations": "Earns basis-point fees on assets under management (from ~3bp on index ETFs to 60-100bp on active equity), so the business scales with markets and net flows; margins hinge on distribution reach and performance track records. Core processes are portfolio management and research, trading and best execution, daily NAV striking and fund accounting, and distribution through advisers and platforms.", "regulation": "SEC regulation under the Investment Advisers Act of 1940 and Investment Company Act of 1940 (fund boards, custody rule, 15(c) fee approvals); DOL ERISA rules for retirement assets. Self-regulates through ICI standards, CFA Institute's GIPS performance-reporting and ethics codes, and independent fund director governance.", "examples": "BlackRock, Vanguard, Fidelity, T. Rowe Price"}, {"name": "Private Equity / Private Credit / Venture Capital Firm", "naics": "523999, 523910, 525990", "definition": "An alternative asset manager raising closed-end funds from institutions to buy companies (PE), lend directly (private credit), or fund startups (VC), earning management and performance fees.", "operations": "The 2-and-20 model: ~1.5-2% annual management fees on committed capital plus 20% carried interest above a preferred return; value creation comes from leverage, operational improvement, and multiple expansion over 3-7 year holds. Daily work is deal sourcing and diligence, portfolio company board governance, financing negotiations, and LP fundraising and reporting.", "regulation": "SEC registration as investment advisers with Form ADV/PF reporting and examination; antitrust (HSR) review of acquisitions; banking regulators watch leveraged-lending exposure. Self-regulates through ILPA reporting principles negotiated with limited partners and institutional LP diligence discipline.", "examples": "Blackstone, KKR, Apollo, Sequoia Capital"}, {"name": "Life & Annuity Insurance Carrier", "naics": "524113", "definition": "An insurer underwriting mortality and longevity risk — life policies, annuities, pension risk transfer — funded by long-duration premium reserves invested in bonds and alternatives.", "operations": "Profits from mortality margin (actual vs. priced deaths), investment spread over crediting rates, and fees on variable products; the balance sheet is a leveraged bond portfolio matched against actuarial liabilities decades long. Operations center on actuarial pricing and valuation, underwriting (medical and financial), asset-liability matching, and policyholder administration at scale.", "regulation": "Regulated by state insurance departments coordinated through the NAIC (risk-based capital, reserving rules, market conduct exams); the Fed supervises designated or savings-and-loan-holding insurers; guaranty associations backstop policyholders. Self-regulates through the Society of Actuaries' and American Academy of Actuaries' professional standards and ACLI industry codes.", "examples": "MetLife, Prudential Financial, Northwestern Mutual, Athene"}, {"name": "Property & Casualty Insurance Carrier", "naics": "524126", "definition": "An insurer covering property damage and liability — auto, homeowners, commercial lines, catastrophe — where policies are short-tail annual contracts repriced against loss experience.", "operations": "Underwriting profit is measured by the combined ratio (losses plus expenses over premiums; below 100 is profit) supplemented by investment income on float — Buffett's engine. Daily operations are pricing and underwriting risk selection, claims adjustment and litigation management, catastrophe modeling, and reinsurance program buying.", "regulation": "State insurance commissioners approve rates and forms in many lines and run solvency exams under NAIC accreditation; catastrophe-exposed states add residual-market mechanisms. Self-regulates through ISO/Verisk standard forms and loss-cost filings, CAS actuarial standards, and IBHS building-resilience research.", "examples": "State Farm, Progressive, Chubb, Travelers"}, {"name": "Reinsurer", "naics": "524130", "definition": "An insurer of insurers: assumes portfolios of risk from primary carriers via treaty or facultative contracts, spreading peak catastrophe and casualty exposure across global capital.", "operations": "Earns underwriting margin on assumed premium priced with catastrophe models (hurricane, quake, cyber) and returns on a conservatively invested float; retrocession and insurance-linked securities (cat bonds) lay off peak risk to capital markets. The annual rhythm peaks at January 1 treaty renewals negotiated through brokers.", "regulation": "Regulated by domiciliary supervisors (Bermuda Monetary Authority, state regulators, EIOPA under Solvency II) with credit-for-reinsurance rules governing cross-border business. Self-regulates through rating-agency capital adequacy discipline (AM Best, S&P) — effectively the binding constraint — and industry bodies like the Reinsurance Association of America.", "examples": "Munich Re, Swiss Re, Berkshire Hathaway Reinsurance, RenaissanceRe"}, {"name": "Insurance Agency & Brokerage", "naics": "524210", "definition": "A distribution intermediary that places clients' risks with carriers — agents represent carriers, brokers represent insureds — earning commissions and fees without bearing underwriting risk.", "operations": "Revenue is commission (typically 10-15% of premium) and fees for large-account consulting; the business is a renewal annuity, so retention and organic growth drive value, and the industry consolidates relentlessly via roll-ups. Daily work is marketing submissions to carriers, negotiating terms, binding coverage, and servicing certificates and claims advocacy.", "regulation": "State licensing of every producer and agency, market-conduct and fiduciary-fund rules, and disclosure requirements on compensation. Self-regulates through Big I (IIABA) and CIAB codes and E&O-driven best practices.", "examples": "Marsh McLennan, Aon, Arthur J. Gallagher, HUB International"}, {"name": "Credit Union", "naics": "522130", "definition": "A member-owned, not-for-profit depository cooperative providing savings and consumer credit to a defined field of membership.", "operations": "Operates the bank spread model but returns margin to members as better rates; governance is one-member-one-vote with a volunteer board. Operations mirror a retail bank — lending, deposits, cards, digital banking — often outsourcing scale functions to CUSOs and corporate credit unions.", "regulation": "Chartered and examined by the NCUA (federal) or state regulators, with NCUSIF share insurance; exempt from federal income tax but subject to CFPB rules above $10B. Self-regulates through America's Credit Unions association standards and league-based peer collaboration.", "examples": "Navy Federal, State Employees' CU, PenFed"}, {"name": "Payments Network & Processor (Fintech Infrastructure)", "naics": "522320", "definition": "Firms operating the rails of money movement: card networks, merchant acquirers, payment facilitators, and real-time payment infrastructure.", "operations": "Earns per-transaction economics — network assessments (Visa/Mastercard ~0.13-0.15%), acquirer markups, and interchange flowing to issuers — so revenue compounds with global payment volume. Operations are five-nines authorization uptime, fraud scoring in milliseconds, merchant onboarding and underwriting, and chargeback dispute processing.", "regulation": "Regulated as money transmitters state-by-state, by the Fed (Regulation II debit interchange), CFPB (Reg E consumer protections), and FinCEN for AML; bank-sponsorship models put partner banks' regulators indirectly in charge. Self-regulates through PCI-DSS data security standards (an industry-created regime), Nacha operating rules for ACH, and EMVCo specifications.", "examples": "Visa, Fiserv, Stripe, Adyen"}, {"name": "Digital Lender / Neobank (Fintech)", "naics": "522291, 522320, 522110", "definition": "A technology-first company delivering banking, lending, or investing products through software — often atop a sponsor bank's charter — competing on user experience and underwriting data.", "operations": "Monetizes via interchange on debit spend, interest and origination fees on loans (frequently sold to credit funds), and subscription tiers; unit economics hinge on customer acquisition cost versus lifetime value. Core processes are ML-driven credit models, compliance-as-code onboarding (KYC), and continuous product deployment.", "regulation": "Regulated through the sponsor bank's supervisors (OCC/FDIC/Fed) under third-party risk guidance, state lending and money-transmission licenses, CFPB fair-lending and UDAAP enforcement, and FTC jurisdiction for non-banks. Self-regulates through model-risk governance (SR 11-7 patterned), and industry groups like the American Fintech Council.", "examples": "Chime, SoFi, Affirm, Nubank"}, {"name": "Securities & Derivatives Exchange / Clearinghouse", "naics": "523210", "definition": "A regulated marketplace that lists instruments, matches buyers and sellers, publishes prices, and (through central counterparty clearing) guarantees settlement of every trade.", "operations": "Earns transaction fees per contract or share, market-data licensing (a growing majority of revenue at some venues), listing fees, and clearing fees; CCPs manage default risk with margin and guaranty funds sized to Cover-2 standards. Daily operations are microsecond matching-engine uptime, real-time surveillance, and twice-daily margin cycles.", "regulation": "SEC (securities exchanges) and CFTC (futures/DCMs and clearinghouses) regulate market structure, and systemically important CCPs answer to the Fed under Title VIII of Dodd-Frank. Exchanges are themselves SROs with rulebooks and enforcement over members — the purest fusion of market and regulator.", "examples": "CME Group, Intercontinental Exchange (NYSE), Nasdaq, DTCC (clearing)"}, {"name": "Hedge Fund / Proprietary Trading Firm", "naics": "523999, 523150", "definition": "A private investment vehicle pursuing absolute returns with flexible mandates — long/short equity, macro, quant, market-making — using leverage and derivatives; prop firms trade the partners' own capital.", "operations": "Hedge funds charge management plus incentive fees on LP capital; prop/HFT firms earn bid-ask spread and arbitrage at scale with sub-millisecond systems. Daily operations revolve around research and signal generation, risk management against drawdown limits, prime-broker financing, and post-trade reconciliation.", "regulation": "SEC adviser registration and Form PF for funds above thresholds; CFTC/NFA for futures strategies; FINRA membership for broker-dealer-structured prop firms; Reg SHO, market-access rule 15c3-5. Self-regulates through MFA/AIMA sound-practice standards and investor due-diligence (ODD) discipline.", "examples": "Citadel, Bridgewater, Jane Street, Renaissance Technologies"}, {"name": "Mortgage Bank & Servicer", "naics": "522292, 522390", "definition": "A nonbank (or bank unit) that originates residential mortgages for sale into GSE and Ginnie Mae securitizations and services the loans — collecting payments, escrow, and default management — for ongoing fees.", "operations": "Origination earns gain-on-sale margins (~1-3 points) with volume swinging violently with rates; servicing earns ~25-50bp strips whose value rises when rates rise, a natural hedge. Operations are loan manufacturing to agency underwriting specs (DU/LP), pipeline hedging with TBAs, and servicing call centers, escrow administration, and loss mitigation.", "regulation": "CFPB (TRID disclosures, servicing rules, ability-to-repay), state licensing via NMLS, FHFA indirectly through GSE seller-servicer guides, HUD/FHA for government loans. Self-regulates through MBA standards and GSE rep-and-warrant quality-control regimes.", "examples": "Rocket Mortgage, United Wholesale Mortgage, Mr. Cooper (servicing)"}], "regulators": [{"name": "Board of Governors of the Federal Reserve System", "jurisdiction": "US", "role": "Supervises bank holding companies and systemically important institutions, sets capital and stress-testing (CCAR) requirements, operates payment systems (Fedwire, FedNow), and serves as lender of last resort."}, {"name": "Securities and Exchange Commission (SEC)", "jurisdiction": "US", "role": "Regulates securities issuance and disclosure, exchanges, broker-dealers, investment advisers, and funds; enforces antifraud provisions and oversees SROs including FINRA and the exchanges."}, {"name": "Federal Deposit Insurance Corporation (FDIC)", "jurisdiction": "US"
