, education, development, and operations departments. A hospitality property or restaurant runs a general manager over front-of-house and back-of-house brigades. Across all forms, culture uniquely elevates the frontline creative and service worker — the artist, athlete, chef, curator, and performer — as the irreplaceable core of the product, even as business and platform layers capture much of the value.", "positions": [{"title": "Board of Trustees / Directors Member", "level": "Governance", "reportsTo": "The board / shareholders / members", "duties": "Sets mission and strategy, hires and evaluates the CEO or executive/artistic director, holds fiduciary duty, approves budgets and major initiatives, and (in nonprofits) leads fundraising and community stewardship. Measured by financial health, mission/artistic impact, and reputation.", "credentials": "No formal requirement; business, philanthropic, artistic, or civic leaders; nonprofit-governance training for cultural boards.", "socCode": "11-1011"}, {"title": "Chief Executive Officer / Executive Director", "level": "Executive", "reportsTo": "Board of Directors/Trustees", "duties": "Leads overall strategy, financial performance, fundraising or growth, and external relations; in nonprofits, partners with the artistic director on the mission-business balance. Measured by revenue/margin or budget health, attendance/audience, and institutional reputation.", "credentials": "MBA or arts-administration/hospitality degree; extensive sector leadership; deep fundraising skill in nonprofits.", "socCode": "11-1011"}, {"title": "Artistic Director / Chief Content Officer / Creative Director", "level": "Executive", "reportsTo": "CEO / Board", "duties": "Owns the creative product: programming, repertoire, content slate, or brand aesthetic; sets artistic vision and casts/commissions talent. Measured by critical reception, audience/ratings, awards, and cultural relevance.", "credentials": "Distinguished record as artist, curator, producer, or creative leader; deep field expertise; MFA or equivalent stature.", "socCode": "27-1011"}, {"title": "Chief Financial Officer / VP of Finance", "level": "Executive", "reportsTo": "CEO/Executive Director", "duties": "Manages budgeting, financing (production financing, endowment, or franchise capital), reporting, and risk; in nonprofits, oversees fund accounting and grant compliance. Measured by financial controls, margins or balanced budgets, and cash management.", "credentials": "MBA/M.Acc; CPA common; entertainment or hospitality finance experience.", "socCode": "11-3031"}, {"title": "General Manager (Property / Venue / Team)", "level": "Management", "reportsTo": "COO / Regional VP / Ownership", "duties": "Runs a hotel, venue, park, or franchise operation: P&L, staffing, guest/fan experience, safety, and local marketing. Measured by revenue (RevPAR, attendance, gate), cost control, guest satisfaction, and staff performance.", "credentials": "Bachelor's in hospitality/business; sector operations experience; brand certifications.", "socCode": "11-1021"}, {"title": "Producer / Line Producer", "level": "Management", "reportsTo": "Studio Executive / Executive Producer", "duties": "Manages the making of a film, show, game, or production: budget, schedule, hiring crew and talent, and delivery within scope. Measured by on-budget/on-schedule delivery and production quality.", "credentials": "Industry experience; often film/production degree; strong project-management and negotiation skills; guild membership (DGA/PGA).", "socCode": "27-2012"}, {"title": "Curator / Collections Manager", "level": "Management", "reportsTo": "Director / Chief Curator", "duties": "Researches, develops, and interprets collections and exhibitions; makes acquisition and loan recommendations, writes scholarship, and oversees care and documentation of objects. Measured by exhibition quality, scholarship, collection growth/care, and attendance.", "credentials": "Master's or PhD in art history, museum studies, or the collection's field; deep subject expertise.", "socCode": "25-4012"}, {"title": "Executive Chef / Culinary Director", "level": "Management", "reportsTo": "General Manager / Restaurant Owner", "duties": "Designs menus, sources ingredients, sets recipes and standards, manages food and labor cost, and leads the kitchen brigade. Measured by food quality/consistency, food cost percentage, kitchen efficiency, and reviews.", "credentials": "Culinary degree or extensive apprenticeship; ServSafe certification; years in progressive kitchen roles.", "socCode": "35-1011"}, {"title": "Marketing / Development Director", "level": "Management", "reportsTo": "CEO/Executive Director", "duties": "In for-profits, drives audience marketing, ticketing, and brand; in nonprofits, leads fundraising — memberships, major gifts, grants, and galas — that closes the earned-revenue gap. Measured by revenue raised or generated, audience growth, and donor retention.", "credentials": "Bachelor's/master's in marketing, arts administration, or nonprofit management; CFRE for fundraisers.", "socCode": "11-2021"}, {"title": "Professional Athlete", "level": "Professional", "reportsTo": "Coach / General Manager", "duties": "Trains and competes at elite level as the core product of a sports franchise, adhering to team, league, and anti-doping rules and to media and sponsorship obligations. Measured by athletic performance statistics, wins, and marketability.", "credentials": "Elite athletic ability developed through years of competition; league eligibility (draft/combine); no academic requirement.", "socCode": "27-2021"}, {"title": "Artist / Performer / Musician (Independent)", "level": "Professional", "reportsTo": "Self / Agent / Producer", "duties": "Creates, performs, or records original artistic work; auditions or pitches, rehearses, performs, and manages a portfolio career of commissions, gigs, and royalties. Measured by artistic output, bookings, audience/streams, and critical reception.", "credentials": "Talent and training (conservatory, MFA, or apprenticeship); union membership (SAG-AFTRA, AEA, AFM) for professional work.", "socCode": "27-2090"}, {"title": "Game Designer / Developer", "level": "Professional", "reportsTo": "Lead Designer / Producer", "duties": "Designs game mechanics, levels, systems, or writes code; iterates through playtesting toward engaging, balanced, shippable experiences. Measured by feature quality, player engagement metrics, and milestone delivery.", "credentials": "Degree in game design, computer science, or art; strong portfolio; engine (Unreal/Unity) proficiency.", "socCode": "15-1255"}, {"title": "Conservator / Registrar", "level": "Professional", "reportsTo": "Chief Curator / Collections Manager", "duties": "Preserves and restores artifacts and artworks (conservator) or manages the legal and logistical records, loans, insurance, and movement of collection objects (registrar). Measured by object condition, documentation integrity, and loan/exhibition support.", "credentials": "Master's in art conservation or museum studies; specialized conservation training and apprenticeship.", "socCode": "25-4013"}, {"title": "Sous Chef / Line Cook", "level": "Operational", "reportsTo": "Executive Chef / Kitchen Manager", "duties": "Executes menu preparation on station during service, maintains food-safety and quality standards, manages prep and mise en place, and (sous) supervises the line. Measured by ticket times, food quality/consistency, waste, and safety compliance.", "credentials": "Culinary training or on-the-job experience; ServSafe/food-handler certification.", "socCode": "35-2014"}, {"title": "Server / Front-of-House Staff", "level": "Operational", "reportsTo": "Restaurant Manager / Maître d'", "duties": "Takes orders, serves food and beverages, manages guest experience and check accuracy, and upsells; the primary guest-facing role in hospitality. Measured by sales, tips, table turns, and guest satisfaction.", "credentials": "High school or none; on-the-job training; food-handler and responsible-alcohol (TIPS) certification.", "socCode": "35-3031"}, {"title": "Hotel Front Desk / Guest Services Agent", "level": "Operational", "reportsTo": "Front Office Manager", "duties": "Checks guests in and out, handles reservations and requests, resolves issues, processes payments, and coordinates housekeeping and services. Measured by guest satisfaction scores, upsells, and check-in efficiency.", "credentials": "High school diploma; hospitality/property-management-system training; customer-service skills.", "socCode": "43-4081"}, {"title": "Museum / Venue Attendant & Educator", "level": "Operational", "reportsTo": "Visitor Services or Education Manager", "duties": "Welcomes and orients visitors, leads tours and education programs, ensures gallery/venue security and visitor safety, and supports events. Measured by visitor experience, program delivery, and safety.", "credentials": "High school/bachelor's (education roles); subject familiarity; docent/guide training.", "socCode": "25-3021"}, {"title": "Stagehand / Production Crew / Technician", "level": "Operational", "reportsTo": "Production/Stage Manager or Technical Director", "duties": "Builds and strikes sets, rigs lighting and sound, operates technical equipment during productions and events, and ensures backstage safety. Measured by setup accuracy, show reliability, and safety.", "credentials": "Technical/vocational training or apprenticeship; union membership (IATSE) common; equipment certifications.", "socCode": "27-4021"}]}}, {"id": "religion", "name": "Religion", "icon": "🕊️", "tagline": "The organized institutions of faith — congregations, denominations, charities, schools, media, and ministries that structure meaning, morality, and community.", "view100k": {"role": "Religion is civilization's oldest continuously operating institutional form: the organized structures — congregations, denominations, orders, charities, schools, and media — through which communities transmit ultimate meaning, moral codes, ritual, and mutual aid across generations. It exists because humans everywhere have organized around the sacred, and because durable cooperation demands shared narratives, sanctified norms, and rites of passage; sociologists from Durkheim onward have treated it as the original social technology of solidarity, and the world's first bureaucracies, schools, hospitals, banks (temple lending in Mesopotamia), and welfare systems were religious institutions. The scale remains vast: roughly 85% of humanity identifies with a religious tradition — some 2.4 billion Christians, 2 billion Muslims, 1.2 billion Hindus, half a billion Buddhists, and 15 million Jews, among many others. In the United States alone there are an estimated 350,000-400,000 congregations; religion-related giving is the largest single category of American philanthropy at roughly $145 billion per year (about a quarter of all charitable giving), and studies of the 'faith economy' place the total socio-economic contribution of religion to U.S. society above $1 trillion annually when religious healthcare, education, and charities are counted. The domain employs hundreds of thousands of clergy (the BLS counts ~240,000 U.S. clergy plus directors of religious activities and education), and religious bodies operate some of the largest nonprofit systems in existence — Catholic dioceses, hospital systems, and school networks; the Salvation Army; World Vision; Islamic Relief; Jewish Federations.\n\nThe historical arc runs from temple economies of the ancient Near East, through the medieval church as Europe's largest landowner and its monasteries as engines of literacy and agriculture, the Reformation's institutional pluralization, and disestablishment — the American constitutional experiment of 1791 that severed state funding from religious life and thereby created the modern voluntary congregation, funded by tithes and offerings rather than taxes. That voluntary model made religion an entrepreneurial sector: denominations compete, congregations plant and close, parachurch organizations (relief agencies, campus ministries, broadcasters) proliferate alongside the historic communions. The 20th and 21st centuries added religious broadcasting and publishing industries, faith-based finance (church extension funds, denominational pension boards managing tens of billions, Islamic finance exceeding $3 trillion globally), professionalized chaplaincy embedded in hospitals, militaries, and prisons, and — in the secularizing West — the managerial challenge of declining affiliation, congregational mergers, and the repurposing of sacred real estate.\n\nEconomically, the domain runs on a distinctive model: voluntary contribution revenue, tax exemption without the disclosure obligations imposed on other charities (U.S. churches need not file Form 990), volunteer labor at enormous scale, and governance that ranges from strict hierarchy (episcopal polity) to radical congregational autonomy — making it a natural laboratory of organizational design that management scholars have studied since Weber.", "interdependencies": "Religion touches every other domain as moral interpreter, service provider, and institutional actor. It shapes Culture most intimately — art, music, calendars, festivals, and ethics are saturated with religious inheritance — and interacts with Governance through establishment/free-exercise settlements, faith-based partnerships, and religious lobbying, and with Law through religious-liberty doctrine, canon and religious law systems (halakha, sharia, canon law), and the charitable-trust framework that religious property inhabits. It is a major operator in Education (parochial schools, seminaries, and many of the world's oldest universities), Medicine (faith-based hospital systems are among the largest in the U.S.), and Population dynamics (marriage, fertility norms, and vital-record functions religion historically performed). It depends on Finance for stewardship of endowments, pensions, and construction lending — and supplies Finance with ethical-investment screens and Islamic banking; on Communication for broadcasting, publishing, and now streaming worship; on Infrastructure and Energy for its enormous building stock; on Agriculture through food charities, religious dietary certification (kosher/halal — a multi-hundred-billion-dollar certified market), and historic monastic agronomy. It feeds Defense and Intelligence chaplaincies and moral-injury care, informs Environment through stewardship theology and faith-based climate advocacy, engages Trade and Economy through remittance-scale global giving and mission networks, draws on Science amid ongoing dialogue and tension, and supplies Technology with one of its fastest-adopting nonprofit user bases (giving platforms, church management software).", "regulationModel": "Religion is the least state-regulated domain by constitutional design and among the most self-regulated by internal law. In the United States, the First Amendment's twin clauses bar establishment and protect free exercise; the church-autonomy and ministerial-exception doctrines (Hosanna-Tabor, Our Lady of Guadalupe) put clergy employment and doctrinal disputes beyond civil-court reach; and RFRA/RLUIPA add statutory protection for religious practice and land use. Fiscal oversight is deliberately light: houses of worship are automatically tax-exempt under IRC 501(c)(3) without applying, are exempt from Form 990 filing, and can be audited only under the special church-audit procedures of IRC 7611 — though they remain bound by the prohibitions on private inurement, excess-benefit transactions (IRC 4958), and campaign intervention (the Johnson Amendment). State attorneys general oversee religious charities' solicitation and fiduciary conduct with varying deference; clergy operate under mandatory-reporting statutes (with contested clergy-penitent privilege carve-outs), and religious schools answer to state education codes and accreditors. The dense layer is internal: canon law with its tribunals and the Vatican's dicasteries; presbyterian and episcopal polities with synods, bishops, and disciplinary processes; congregational polities governed by member vote and associational covenants; Islamic fiqh councils and halal-certification bodies; rabbinical courts (batei din) supervising kosher certification and religious divorce. Voluntary self-regulation is substantial: the Evangelical Council for Financial Accountability (ECFA) accredits 2,700+ ministries against seven stewardship standards; denominational pension and finance boards impose fiduciary regimes; and accreditors like the Association of Theological Schools govern seminary quality. Public accountability ultimately operates through the exit of adherents and donors — the disciplining force of the voluntary system."}, "view10k": {"overview": "The institutional core is NAICS 813110 (Religious Organizations): congregations, denominational judicatories, religious orders, and missionary societies. Around it cluster faith-based social services (624 — emergency relief, family services; 62421 community food services), grantmaking and federated giving (813211, 813212, 813219 — e.g., Jewish Federations, Catholic Charities appeals), religious education (611110 parochial K-12; 611310 seminaries, divinity schools, and religious colleges), religious publishing (513130 book publishers; 513120 periodicals) and broadcasting/streaming (516110, 516120, 516210), religious camps and retreat centers (721214), cemeteries and funeral ministries (812220), and faith-based finance — church extension funds and denominational investment programs (522298, 523940), faith-aligned credit unions (522130), and denominational pension boards (525110). Chaplaincy is employed across host industries (622 hospitals, 928110 military, 922140 corrections). The dominant funding model is voluntary giving (tithes, offerings, pledges) supplemented by fees (tuition, camps), endowment income, and government contracts for secular social services delivered by faith-based providers under charitable-choice rules; governance polity — episcopal (hierarchical), presbyterian (representative), or congregational (autonomous) — is the variable that determines how authority, property, and money actually flow.", "businessTypes": [{"name": "Local Congregation (Church / Mosque / Synagogue / Temple)", "naics": "813110", "definition": "The base operating unit of organized religion: a covenanted local community gathering for worship, instruction, life-cycle rites, pastoral care, and mutual aid, typically incorporated as a nonprofit religious corporation.", "operations": "Funded by tithes, offerings, and pledges (median U.S. congregation budget is modest — most congregations are small, while megachurches exceed $50M); operations are weekly worship production, religious education, pastoral visitation, weddings and funerals, facility stewardship, and volunteer-driven ministries. Staffing scales from a solo clergy-and-volunteers model to multi-site organizations with executive staff.", "regulation": "Automatically 501(c)(3) exempt with no Form 990 requirement, bounded by inurement and campaign-intervention rules (IRS); governed internally by its polity — bishop/diocese, session/presbytery, or congregational vote — with bylaws, elder/vestry boards, and denominational discipline as the operative law.", "examples": "A Catholic parish; Saddleback Church; Islamic Center of America (Dearborn); Central Synagogue (NYC)"}, {"name": "Denomination / Judicatory (Diocese, Synod, Convention, Conference)", "naics": "813110", "definition": "The supra-congregational governance body: ordains and deploys clergy, holds or oversees property, adjudicates doctrine and discipline, and operates shared services (missions, publishing, pensions) for member congregations.", "operations": "Funded by assessments/apportionments on congregations, endowments, and program fees; operations include clergy credentialing and placement, congregational consulting and church planting, disciplinary tribunals, and administration of insurance, pension, and loan programs. Legislative assemblies (general conventions, synods) meet periodically to set doctrine and budget.", "regulation": "Civil courts defer to its internal adjudication under church-autonomy doctrine (Watson v. Jones lineage); internally governed by constitutions, books of order/discipline, and canon law with formal tribunal systems; property disputes at the civil-religious boundary are resolved under neutral-principles analysis.", "examples": "Roman Catholic Archdiocese of Chicago; Southern Baptist Convention; Evangelical Lutheran Church in America; Union for Reform Judaism"}, {"name": "Religious Order / Monastic Community", "naics": "813110", "definition": "A vowed community living under a common rule — monastic, mendicant, or apostolic — often operating schools, hospitals, retreat houses, and commercial enterprises to sustain its mission.", "operations": "Funded by members' earned income (teaching, healthcare salaries), enterprise revenue (breweries, fruitcakes, publishing — Trappist and Benedictine businesses are famous), donations, and endowments; daily operations follow the rule (prayer offices, work, hospitality) with formation programs governing entry from postulancy through final vows.", "regulation": "Governed by its rule and constitutions under canonical oversight (for Catholic orders, the Dicastery for Institutes of Consecrated Life); civil-law entities for property and employment; commercial ventures regulated like any business (FDA for food products, state labor law for lay employees).", "examples": "The Jesuits (Society of Jesus); Benedictine monasteries (e.g., Saint John's Abbey); Missionaries of Charity; New Skete communities"}, {"name": "Faith-Based Relief & Development NGO", "naics": "624230, 624190, 813219", "definition": "Large religious charities delivering disaster relief, development, refugee resettlement, and anti-poverty programs domestically and worldwide, motivated by religious mission but often serving without religious test.", "operations": "Funded by individual donations (child sponsorship is a signature model), congregational campaigns, and substantial government grants (USAID, refugee-resettlement contracts) under charitable-choice rules; operations are country programs, gift-in-kind logistics, emergency-response rosters, and donor-development machines. Several rank among the largest charities in the world by revenue.", "regulation": "IRS 501(c)(3) with full Form 990 disclosure (unlike churches), state charity registration, federal single audits for grant funds, and watchdog scrutiny (Charity Navigator, BBB); self-regulated through ECFA accreditation, InterAction standards, and Sphere humanitarian standards.", "examples": "World Vision; Catholic Relief Services; Samaritan's Purse; Islamic Relief Worldwide"}, {"name": "Federated Religious Charity / Social-Service Agency", "naics": "624190, 813212, 624221", "definition": "Denominationally affiliated human-services networks — adoption and family services, homeless shelters, addiction recovery, refugee services — operating as professional social-service agencies under religious identity.", "operations": "Revenue blends government purchase-of-service contracts (often the majority), United Way and federation allocations, fees, and donations; operations are licensed social work: case management, residential programs, food banks, and counseling delivered by credentialed professionals. Catholic Charities agencies collectively serve 15+ million people annually.", "regulation": "State human-services licensing for programs (childcare, residential treatment), government contract audits, IRS/state-AG charity oversight; religious-exemption litigation (e.g., over placement services) defines its legal frontier; accreditation via COA/Social Current supplements self-regulation.", "examples": "Catholic Charities USA network; Lutheran Services in America; The Salvation Army; Jewish Family Services agencies"}, {"name": "Parochial / Religious Day School", "naics": "611110", "definition": "K-12 schools operated by congregations, dioceses, or independent religious boards, combining state-recognized academic curriculum with religious formation.", "operations": "Funded by tuition, parish/denominational subsidy, philanthropy, and increasingly state school-choice programs (vouchers, tax-credit scholarships, ESAs); operations mirror any school — enrollment management, faculty, athletics, facilities — plus religious-studies curriculum and chapel life. U.S. Catholic schools alone enroll ~1.7 million students; Jewish day schools, Islamic academies, and Protestant Christian schools add millions more.", "regulation": "State education codes (compulsory-attendance recognition, health/safety), accreditation by regional and faith-based accreditors (Cognia, ACSI, NCEA frameworks), background-check and mandatory-reporting law; ministerial exception governs religious-teacher employment; internally overseen by diocesan school offices or independent boards.", "examples": "Archdiocesan Catholic school systems; Ramaz School (Jewish); regional Christian academies (ACSI members); Islamic Foundation School"}, {"name": "Seminary / Divinity School / Religious University", "naics": "611310", "definition": "Higher-education institutions forming clergy and religious professionals (MDiv, rabbinic ordination, Islamic studies) and, in religious universities, delivering full academic programs within a faith identity.", "operations": "Funded by tuition, denominational subsidies, and endowments (some seminary endowments exceed $1B); operations are graduate theological education, field-placement supervision in congregations, ordination-track formation and assessment, plus lay and continuing education. Enrollment pressure has driven mergers, embedding of seminaries within universities, and online MDiv programs.", "regulation": "Accredited by the Association of Theological Schools (ATS) and regional accreditors; Title IV federal aid brings Department of Education oversight; state higher-ed authorization; governed by boards of trustees frequently including denominational appointees.", "examples": "Princeton Theological Seminary; Fuller Theological Seminary; Hebrew Union College; Zaytuna College"}, {"name": "Religious Publishing House", "naics": "513130, 513120", "definition": "Publishers of scriptures, curricula, devotional and academic religious books, hymnals, and periodicals — several owned by denominations, others commercial imprints within trade publishing.", "operations": "Revenue from book and Bible sales (the Bible remains the best-selling book in the world; the U.S. Bible market alone moves ~20 million units yearly), church curriculum subscriptions, and rights licensing; operations are acquisitions editing, translation licensing (Bible translations are managed IP), print-and-digital production, and retail/direct channels.", "regulation": "Ordinary publishing law (copyright, defamation); denominational publishers answer to their church's governance for doctrinal conformity; the Evangelical Christian Publishers Association provides industry self-organization and bestseller integrity standards.", "examples": "Zondervan and Thomas Nelson (HarperCollins Christian); Lifeway (Southern Baptist); Paulist Press; ArtScroll (Jewish)"}, {"name": "Religious Broadcasting & Media Network", "naics": "516110, 516120, 516210", "definition": "Radio and television stations, networks, podcast studios, and streaming platforms producing worship, teaching, music, and news content for faith audiences.", "operations": "Funded by listener/viewer donations (telethons, monthly partners), program-time sales to ministries, advertising on Christian-format radio (one of the largest U.S. radio formats), and subscription streaming; operations are station groups, satellite/cable carriage, content production, and donor-response call centers.", "regulation": "FCC licensing for broadcast spectrum (including noncommercial educational licenses many religious broadcasters hold), FTC/state fundraising law; self-regulated through National Religious Broadcasters membership standards and ECFA accreditation of donor-funded ministries.", "examples": "Salem Media Group; Trinity Broadcasting Network; K-LOVE (Educational Media Foundation); Relevant/podcast-era studios"}, {"name": "Chaplaincy Services (Institutional Ministry)", "naics": "Employed within 622110 (hospitals), 928110 (military), 922140 (corrections), 813110 (providers)", "definition": "Professional ministry embedded in secular institutions — hospitals, the armed forces, prisons, universities, corporations, sports — providing spiritual care across faith traditions to people in crisis or institutional life.", "operations": "Funded by the host institution (hospital spiritual-care departments, the military chaplain corps) or by sponsoring religious bodies (prison ministry organizations, corporate chaplaincy firms billing employers per-employee); daily work is bedside and unit rounds, crisis response, ethics-committee service, staff care, and religious-accommodation facilitation.", "regulation": "Board certification through the Board of Chaplaincy Certification Inc. (APC/BCCI) requiring 4 units of Clinical Pastoral Education (ACPE-accredited); military chaplains require denominational endorsement plus commissioning; hospital accreditation (Joint Commission) recognizes spiritual care; endorsing bodies retain ecclesiastical discipline.", "examples": "U.S. Army Chaplain Corps; Cleveland Clinic Spiritual Care; Prison Fellowship; Marketplace Chaplains (corporate)"}, {"name": "Faith-Based Financial Institution", "naics": "522298, 522130, 525110, 523940", "definition": "The finance arms of religion: church extension funds lending for congregation construction, denominational pension boards, faith-aligned credit unions, religiously screened investment funds, and Islamic (sharia-compliant) finance providers.", "operations": "Extension funds raise investment notes from members and lend to congregations (a multi-billion-dollar niche); pension boards manage retirement assets for clergy and lay workers (the largest exceed $25B AUM) with values-aligned screens; Islamic finance structures murabaha and sukuk instruments to avoid interest. Operations are underwriting, asset management, and benefits administration.", "regulation": "Church extension funds sell under state securities exemptions with NASAA church-bond guidelines; credit unions under NCUA; pension boards under denominational governance with church-plan ERISA exemption; Islamic finance overseen by internal sharia boards plus AAOIFI standards and ordinary banking regulators.", "examples": "Wespath (United Methodist pensions); Everence (Anabaptist financial services); Guidance Residential (Islamic home finance); Church Extension Fund entities of major denominations"}, {"name": "Missionary Sending & Para-Church Ministry", "naics": "813110", "definition": "Agencies that recruit, fund, train, and deploy missionaries and ministry staff — evangelism, Bible translation, campus ministry, church planting — outside congregational structures.", "operations": "Signature funding model is deputized support-raising: each missionary raises a personal support budget from individual donors and churches, administered centrally with an assessment for overhead; operations include candidate assessment, cross-cultural training, field logistics, member care, and security management in sensitive regions.", "regulation": "501(c)(3) with Form 990 (most), IRS rules on donor-designated support (funds must remain under organizational control); ECFA accreditation is near-universal among large agencies; host-country registration and visa law govern field operations.", "examples": "Wycliffe Bible Translators/SIL; Cru (Campus Crusade); InterVarsity Christian Fellowship; Chabad-Lubavitch shluchim network"}, {"name": "Religious Camps, Retreat & Conference Centers", "naics": "721214, 813110", "definition": "Residential facilities for youth camps, spiritual retreats, and denominational conferences — the formation infrastructure where religious identity is intensively transmitted.", "operations": "Funded by program fees, congregational subsidies, and donations; seasonal operations (summer camp economics: 8-10 revenue weeks funding year-round sites) with retreat rentals smoothing the calendar; staffing mixes career directors with large seasonal counselor cohorts.", "regulation": "State youth-camp licensing and health codes, ACA (American Camp Association) accreditation as self-regulation, mandatory child-protection screening and abuse-prevention standards (increasingly insurer-driven); property-tax exemption contests are a recurring legal issue.", "examples": "Young Life camps; Camp Ramah network (Jewish); YMCA of the Rockies; diocesan retreat centers"}], "regulators": [{"name": "Internal Revenue Service — Exempt Organizations (TE/GE)", "jurisdiction": "US", "role": "Administers 501(c)(3) status: churches are automatically exempt and 990-exempt, but the IRS enforces private-inurement, excess-benefit (IRC 4958), and political-campaign-intervention prohibitions, and may audit churches only under the IRC 7611 church-audit procedures requiring high-level approval."}, {"name": "State Attorneys General / Charity Bureaus", "jurisdiction": "US states", "role": "Oversee charitable solicitation registration, fiduciary conduct of religious nonprofits' boards, and charitable-trust enforcement over religious property — with most states exempting houses of worship from registration but policing fraud in all faith-branded fundraising."}, {"name": "Evangelical Council for Financial Accountability (ECFA)", "jurisdiction": "US (self-regulatory)", "role": "Accredits 2,700+ churches and ministries against Seven Standards of Responsible Stewardship — board governance, audited financials, transparency, fundraising integrity — created in 1979 explicitly to forestall federal regulation; accreditation is the donor-trust seal of the evangelical world."}, {"name": "Denominational Governing Bodies and Tribunals (canon law, books of discipline, batei din, fiqh councils)", "jurisdiction": "Global (internal religious law)", "role": "The domain's primary regulators: credential and discipline clergy, adjudicate doctrine and property, certify religious compliance (kosher via rabbinical supervision, halal via certification bodies), and impose safeguarding regimes — civil courts defer to their judgments on ecclesiastical questions."}, {"name": "Federal Communications Commission (FCC)", "jurisdiction": "US", "role": "Licenses religious broadcasters' spectrum (commercial and noncommercial educational stations), enforces broadcast rules (sponsorship identification, EAS participation), and adjudicates the license renewals on which broadcast ministries depend."}, {"name": "Association of Theological Schools (ATS) and faith-based school accreditors (ACSI, NCEA-aligned, Cognia)", "jurisdiction": "US/Canada (self-regulatory accreditation)", "role": "Set and enforce educational quality standards for seminaries and religious schools — governance, faculty credentials, assessment — serving as the gate to federal student aid and public recognition of religious degrees and diplomas."}, {"name": "Board of Chaplaincy Certification Inc. (BCCI/APC) and the Armed Forces Chaplains Board", "jurisdiction": "US (professional/self-regulatory and DoD)", "role": "BCCI board-certifies professional chaplains (education, CPE units, endorsement, ethics code with disciplinary process); the Armed Forces Chaplains Board sets DoD chaplaincy policy and recognizes the religious endorsing agents who alone can sponsor military chaplains."}, {"name": "North American Securities Administrators Association (NASAA) guidelines / state securities regulators", "jurisdiction": "US states", "role": "Regulate church-bond and church-extension-fund note offerings under state securities law and NASAA's Church Extension Fund guidelines — the investor-protection perimeter around faith-based finance."}]}, "groundView": {"orgModel": "Religious organization is polity-dependent, but the modal mid-size congregation looks like this: a governing lay board (elders, vestry, parish council, deacons, or trustees — titles vary by tradition) holds fiduciary and often doctrinal authority alongside or under the senior clergy; the senior pastor/rabbi/imam functions as the executive, preaching and providing vision; an executive pastor or administrator runs operations; program staff lead worship/music, education, youth, and outreach; and an operational base of administrators, bookkeepers, facilities staff, and a large volunteer corps delivers the weekly rhythm. Above the congregation, hierarchical polities add a judicatory layer — bishop and diocesan curia, presbytery, district superintendent — that owns or oversees property, deploys clergy, and adjudicates discipline; congregational polities replace this with member meetings and voluntary associations. Faith-based nonprofits (relief NGOs, schools, media) adopt standard nonprofit architecture — board, CEO, program and development divisions — with the addition of statements of faith governing hiring and mission alignment, and endorsement/ordination credentials threading through professional roles. Across all forms, the distinguishing features are voluntary revenue (making stewardship/development a core function), volunteer labor as a primary workforce, and dual accountability to civil law and to internal religious law.", "positions": [{"title": "Elder / Vestry Member / Trustee (Congregational Board)", "level": "Governance", "reportsTo": "The congregation (elected by members) or the judicatory, per polity", "duties": "Holds fiduciary and spiritual oversight of the congregation: approves budget and compensation, hires (or calls) senior clergy per polity, oversees property and risk, and in many traditions shares responsibility for doctrine and member discipline. Serves without pay; measured by financial health, safeguarding compliance, and congregational vitality.", "credentials": "Church membership in good standing; election or appointment under bylaws; ordination as lay elder in some traditions; nonprofit-board fiduciary duties under state law", "socCode": "11-1011"}, {"title": "Bishop / Presiding Officer of a Denomination", "level": "Governance", "reportsTo": "The denominational assembly/synod that elects them (and, in Catholic polity, the Holy See)", "duties": "Exercises regional or national oversight: ordains and appoints clergy, visits and disciplines congregations, guards doctrine, presides over synods and tribunals, and manages the judicatory's finances and institutions (schools, camps, charities). Measured by clergy health, congregational trends, and safeguarding integrity.", "credentials": "Ordination plus years of senior pastoral service; election or papal appointment per canon/constitution; advanced theological degree (MDiv, DMin, or doctorate) typical", "socCode": "21-2011"}, {"title": "Senior Pastor / Rabbi / Imam (Senior Clergy)", "level": "Executive", "reportsTo": "Congregational board and/or judicatory, per polity", "duties": "Leads worship and preaches, provides vision and strategic direction, performs life-cycle rites (weddings, funerals, brit milah, janazah), offers pastoral counseling, and represents the congregation publicly. Functionally the CEO of a voluntary organization whose 'workforce' can quit weekly; measured by attendance, giving, member care, and mission outcomes.", "credentials": "Ordination/semikha/ijazah through the tradition's process; Master of Divinity or equivalent (rabbinical/madrasa training); denominational credentialing and background clearance; officiant registration under state marriage law", "socCode": "21-2011"}, {"title": "Executive Pastor / Congregational Administrator", "level": "Executive", "reportsTo": "Senior Pastor / Governing Board", "duties": "Runs the organization behind the ministry: staff supervision, budgeting and cash management, facilities and construction projects, HR and safeguarding systems, technology, and execution of the board's plans. The COO role that lets clergy do clergy work; measured by budget performance, staff health, and operational reliability.", "credentials": "MBA/MDiv or church-management training; The Church Network's Certified Church Administrator (CCA) credential; ordination optional by tradition", "socCode": "11-1021"}, {"title": "Chief Executive Officer, Faith-Based Nonprofit", "level": "Executive", "reportsTo": "Board of Directors", "duties": "Leads a religious charity, school system, or media ministry: sets strategy within the statement of faith, owns fundraising leadership and government-grant relationships, manages executive staff, and answers publicly for stewardship. Measured by program impact, revenue growth, watchdog ratings, and mission fidelity.", "credentials": "Master's (MBA, MPA, MDiv) typical; nonprofit executive track record; alignment/endorsement requirements per the organization's faith standards", "socCode": "11-1011"}, {"title": "Director of Religious Education / Formation Director", "level": "Management", "reportsTo": "Senior Clergy / Executive Pastor", "duties": "Designs and manages the teaching ministry: curriculum selection across age groups, recruiting and training volunteer teachers, sacramental or bar/bat-mitzvah preparation programs, and family-ministry events. Owns the pipeline of religious literacy; measured by participation, volunteer retention, and formation milestones.", "credentials": "Bachelor's/master's in religious education or theology; denominational catechetical certification; safeguarding training and background checks mandatory", "socCode": "21-2021"}, {"title": "Development / Stewardship Director", "level": "Management", "reportsTo": "Executive Pastor / Nonprofit CEO", "duties": "Runs the voluntary-revenue engine: annual pledge or generosity campaigns, major-donor and planned-giving programs (bequests, donor-advised funds), capital campaigns for buildings, and grant writing at nonprofits. Measured by giving per household, donor retention, and campaign attainment.", "credentials": "Bachelor's; CFRE (Certified Fund Raising Executive) or Lake Institute faith-and-giving training; AFP/ECFA ethics standards on fundraising", "socCode": "11-2033"}, {"title": "Worship / Music Director", "level": "Management", "reportsTo": "Senior Clergy", "duties": "Plans and leads the musical and liturgical life: selects repertoire within the tradition, directs choirs, bands, and cantorial or organ programs, rehearses volunteers weekly, and coordinates production (sound, streaming) for services. Measured by worship quality, volunteer musician development, and congregational participation.", "credentials": "Degree in music/sacred music common; AGO certifications for organists, cantorial ordination in Jewish settings; CCLI/copyright licensing administration knowledge", "socCode": "27-2041"}, {"title": "Hospital / Military / Prison Chaplain", "level": "Professional", "reportsTo": "Director of Spiritual Care (hospital) / senior chaplain and command (military) / chaplaincy supervisor (corrections)", "duties": "Delivers spiritual care in institutions: crisis and end-of-life presence, trauma response, ethics consultations, religious-accommodation coordination for all faiths and none, and staff support. Military chaplains additionally advise commanders on religion and morale and hold noncombatant status; measured by coverage, care documentation, and interdisciplinary integration.", "credentials": "MDiv or equivalent; 4 units of ACPE Clinical Pastoral Education; BCCI board certification (hospital); denominational endorsement plus officer commissioning (military); security/facility clearances as required", "socCode": "21-2011"}, {"title": "Missionary / Field Worker", "level": "Professional", "reportsTo": "Field Director / Sending-Agency Regional Leader", "duties": "Serves cross-culturally in evangelism, translation, education, medicine, or development: language acquisition, community relationships, program delivery, and reporting to supporters. Raises and maintains a personal support budget; measured by field objectives, cultural competence, and longevity (attrition is the sector's chronic metric).", "credentials": "Bible/theology training plus cross-cultural preparation; agency candidate assessment; support-raising completion; host-country visas and, for specialists, professional licenses (medicine, teaching)", "socCode": "21-2099"}, {"title": "Theology Professor / Seminary Faculty", "level": "Professional", "reportsTo": "Academic Dean / Seminary President", "duties": "Teaches scripture, theology, history, and pastoral disciplines to ordination-track students; publishes scholarship; supervises field education and theses; and serves on ordination examination committees. Measured by teaching evaluations, scholarship, and formation outcomes under ATS standards.", "credentials": "PhD or ThD in the discipline; ordination often expected for pastoral-theology chairs; adherence to the institution's confessional standards", "socCode": "25-1126"}, {"title": "Youth Minister / Young-Adult Director", "level": "Professional", "reportsTo": "Senior Pastor / Director of Religious Education", "duties": "Builds ministry to adolescents and young adults: weekly programming, mentoring and discipleship, camps and mission trips, parent partnership, and crisis intervention in young lives. The tradition's retention frontier; measured by engagement, volunteer team strength, and safeguarding compliance (the non-negotiable).", "credentials": "Bachelor's in ministry/youth ministry; denominational certification; child-protection training, background checks, and two-adult-rule protocols mandatory", "socCode": "21-2099"}, {"title": "Parochial School Teacher", "level": "Professional", "reportsTo": "School Principal", "duties": "Teaches the academic curriculum integrated with religious instruction, prepares students for sacraments or religious milestones, and models the faith community's ethos — courts treat many such teachers as 'ministers' for employment-law purposes. Measured by academic outcomes, accreditation standards, and mission witness.", "credentials": "Bachelor's in education; state certification or faith-based accreditor equivalency (ACSI certification); catechist certification in Catholic systems; background clearance", "socCode": "25-2021"}, {"title": "Religious Media Producer / Broadcaster", "level": "Professional", "reportsTo": "Program Director / Network Executive", "duties": "Produces worship broadcasts, teaching programs, podcasts, and livestreams: show rundowns, guest booking, studio and remote production, donor-appeal segments, and platform distribution. Measured by audience, donor response, and content standards of the network and NRB.", "credentials": "Degree in communications/media production; FCC operational knowledge for broadcast; audio/video production credentials; theological literacy for content review", "socCode": "27-2012"}, {"title": "Church Business Administrator / Bookkeeper", "level": "Operational", "reportsTo": "Executive Pastor / Treasurer", "duties": "Keeps the books of a donation-funded entity: weekly contribution counting under dual-control policies, donor recordkeeping and giving statements, payroll with clergy-specific tax treatment (housing allowance, SECA), accounts payable, and audit preparation. Internal controls are the job — churches are chronic embezzlement targets.", "credentials": "Accounting coursework or degree; The Church Network CCA or capin-style church-finance training; QuickBooks/ChMS (church management software) proficiency", "socCode": "43-3031"}, {"title": "Parish Secretary / Office Manager", "level": "Operational", "reportsTo": "Senior Clergy / Executive Pastor", "duties": "Runs the congregational front office: bulletins and communications, sacramental and membership records (baptisms, marriages — legally significant registries), scheduling of clergy and facilities, and first-line pastoral triage of walk-ins and calls, including benevolence requests.", "credentials": "High school to associate degree; office software and ChMS proficiency; discretion and confidentiality; notary commission useful", "socCode": "43-6014"}, {"title": "Facilities Manager / Sexton", "level": "Operational", "reportsTo": "Executive Pastor / Business Administrator", "duties": "Maintains the sacred plant — often a historic, high-maintenance building: cleaning and setup cycles for services, weddings, and funerals; HVAC, roofing, and preservation projects; grounds and cemetery care; and safety/security systems. Measured by readiness of spaces and stewardship of deferred maintenance.", "credentials": "Trade skills (HVAC, electrical basics); facilities certifications (IFMA FMP) at larger campuses; historic-preservation awareness for landmark buildings", "socCode": "49-9071"}, {"title": "Volunteer Coordinator", "level": "Operational", "reportsTo": "Executive Pastor / Program Director", "duties": "Mobilizes the domain's distinctive workforce: recruits, screens (background checks for child-facing roles), trains, schedules, and appreciates the volunteer corps that staffs everything from ushering to food pantries. Measured by fill rates, volunteer retention, and safeguarding compliance.", "credentials": "Bachelor's helpful; CVA (Certified in Volunteer Administration); ChMS scheduling tools; safeguarding-program administration", "socCode": "11-9151"}]}}]}</script>
<script>
const DATA = JSON.parse(document.getElementById('DATA').textContent);
const D = DATA.domains, U = DATA.universal;
const LVLС = {Governance:'var(--lvl-gov)',Executive:'var(--lvl-exec)',Management:'var(--lvl-mgmt)',Professional:'var(--lvl-prof)',Operational:'var(--lvl-ops)'};
const LVLORD = ['Governance','Executive','Management','Professional','Operational'];
const esc = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const paras = s => String(s??'').split(/\n\n+/).map(p=>`<p>${esc(p)}</p>`).join('');
const main = document.getElementById('main');
let state = {view:'home', dom:null, zoom:'100k'};

// build domain nav
const nav = document.getElementById('domnav');
nav.innerHTML = D.map(d=>`<div class="navitem" data-view="dom" data-id="${d.id}"><span class="ico">${d.icon}</span>${esc(d.name)}</div>`).join('');
document.querySelectorAll('.navitem').forEach(el=>el.addEventListener('click',()=>{
  document.getElementById('search').value='';
  state.view = el.dataset.view; state.dom = el.dataset.id||null; state.zoom='100k'; render();
}));

function setActive(){
  document.querySelectorAll('.navitem').forEach(el=>{
    el.classList.toggle('active', el.dataset.view===state.view && (el.dataset.id||null)===(state.view==='dom'?state.dom:null));
  });
}

function zoomTabs(){
  const t=[['100k','100,000 ft','Civilization view'],['10k','10,000 ft','Industries & regulation'],['ground','Ground level','Positions & people']];
  return `<div class="zoomtabs">`+t.map(([k,a,b])=>`<div class="ztab ${state.zoom===k?'active':''}" data-z="${k}">${a} <span class="alt">· ${b}</span></div>`).join('')+`</div>`;
}
function bindZoom(){ main.querySelectorAll('.ztab').forEach(el=>el.addEventListener('click',()=>{state.zoom=el.dataset.z;render();})); }

function renderHome(){
  const nPos = D.reduce((a,d)=>a+d.groundView.positions.length,0);
  const nBiz = D.reduce((a,d)=>a+d.view10k.businessTypes.length,0);
  const nReg = D.reduce((a,d)=>a+d.view10k.regulators.length,0);
  main.innerHTML = `
  <div class="crumb">Foundations · The widest lens</div>
  <h2 class="title">🌍 The 100,000-Foot View</h2>
  <div class="tagline">Civilization, seen as one enterprise: twenty interlocking domains, each with its industries, its regulators, and its people.</div>
  <div class="statrow">
    <div class="stat"><div class="n">20</div><div class="l">Domains</div></div>
    <div class="stat"><div class="n">${nBiz}</div><div class="l">Business types</div></div>
    <div class="stat"><div class="n">${nPos}</div><div class="l">Positions detailed</div></div>
    <div class="stat"><div class="n">${nReg}</div><div class="l">Regulators mapped</div></div>
  </div>
  <div class="sec prose">
    <p>Every human need that can be organized has been organized. The result is the modern economy: roughly <b>330+ million companies on Earth</b> employing about <b>3.5 billion working people</b>, producing over <b>$110 trillion</b> in annual output. This Atlas maps that machine the way an anatomist maps a body — at three altitudes. At <b>100,000 feet</b>, you see the domain itself: why civilization needs it, what it exchanges with the other nineteen, and who holds its leash. At <b>10,000 feet</b>, you see its industries: the specific types of businesses, what each one does, how it earns, and how it is regulated — by the state above it, by its own institutions within it, and by its counterparties beside it. At <b>ground level</b>, you see the people: the actual positions, from board chair to front line, with what each role owns, reports to, and must be credentialed to do.</p>
    <p>The map is anchored in the most comprehensive classification systems ever built — the taxonomies governments and markets themselves use to see the economy. Where a code appears (NAICS for a business, SOC for a job), it is a pointer into those systems, which together describe every industry and every occupation known to official statistics.</p>
  </div>
  <div class="sec"><h3><span class="bar"></span>The canonical source systems</h3>
    ${U.frameworks.map(f=>`<div class="card"><h4>${esc(f.name)} <span class="chip">${esc(f.scope)}</span></h4><div class="kv">${esc(f.purpose)} <span class="ex">→ ${esc(f.url)}</span></div></div>`).join('')}
  </div>
  <div class="sec"><h3><span class="bar"></span>The twenty domains</h3>
    <div class="grid">${D.map(d=>`<div class="dcard" data-id="${d.id}"><div class="ico">${d.icon}</div><h4>${esc(d.name)}</h4><p>${esc(d.tagline)}</p></div>`).join('')}</div>
  </div>
  <footer>Sources: NAICS 2022 (U.S. Census Bureau), ISIC Rev.4/5 (UN Statistics Division), SOC 2018 (U.S. Bureau of Labor Statistics), O*NET-SOC (U.S. Dept. of Labor), GICS (MSCI/S&P), APQC PCF. Compiled July 2026.</footer>`;
  main.querySelectorAll('.dcard').forEach(el=>el.addEventListener('click',()=>{state.view='dom';state.dom=el.dataset.id;state.zoom='100k';render();}));
}

function renderAnatomy(){
  main.innerHTML = `
  <div class="crumb">Foundations · Inside any firm</div>
  <h2 class="title">🏛️ The Anatomy of a Company</h2>
  <div class="tagline">Strip away the industry and every organization shares one skeleton: owners → board → executives → managers → professionals → the operational front line.</div>
  <div class="sec"><h3><span class="bar"></span>Legal forms — the body a business is born into</h3>
    ${U.legalForms.map(f=>`<details class="biz"><summary>${esc(f.name)}<span class="arr">▶</span></summary><div class="body">
      <div class="kv"><b>Definition</b>${esc(f.definition)}</div>
      <div class="kv"><b>Governance & liability</b>${esc(f.governance)}</div>
      <div class="kv"><b>Where you see it</b><span class="ex">${esc(f.share)}</span></div></div></details>`).join('')}
  </div>
  <div class="sec"><h3><span class="bar"></span>The universal ladder — nine tiers of authority</h3>
    ${U.universalLadder.map((t,i)=>`<div class="pos" style="border-left-color:${LVLС[t.layer]||'var(--accent)'}">
      <div class="top"><h5>${i+1}. ${esc(t.tier)}</h5><span class="soc">${esc(t.layer)}</span></div>
      <div class="duty">${esc(t.what)}</div></div>`).join('')}
  </div>
  <div class="sec"><h3><span class="bar"></span>The ten core functions every firm runs</h3>
    ${U.coreFunctions.map(f=>`<div class="card"><h4>${esc(f.name)}</h4><div class="kv">${esc(f.what)}</div></div>`).join('')}
  </div>
  <div class="sec"><h3><span class="bar"></span>Size classes — from kiosk to leviathan</h3>
    <table><tr><th>Class</th><th>Scale</th><th>Character</th></tr>
    ${U.sizeClasses.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.range)}</td><td>${esc(s.note)}</td></tr>`).join('')}</table>
  </div>`;
}

function renderRegulation(){
  main.innerHTML = `
  <div class="crumb">Foundations · The rules of the game</div>
  <h2 class="title">⚖️ How Business Regulates Itself — and Everyone Else</h2>
  <div class="tagline">Three layers of discipline keep 330 million firms honest enough to trade with strangers.</div>
  <div class="sec prose"><p>No market survives on law alone. Modern commerce is held together by a lattice of three regulatory layers that operate simultaneously on every business. Understanding them explains most of what compliance departments, industry associations, auditors, and standards bodies actually do all day.</p></div>
  ${U.regulationLayers.map(l=>`<div class="sec"><h3><span class="bar"></span>${esc(l.name)}</h3><div class="prose"><p>${esc(l.what)}</p></div></div>`).join('')}
  <div class="sec"><h3><span class="bar"></span>Every domain's watchdogs, in one table</h3>
  <table><tr><th>Domain</th><th>Key regulators & self-regulators</th></tr>
  ${D.map(d=>`<tr><td>${d.icon} ${esc(d.name)}</td><td>${d.view10k.regulators.map(r=>esc(r.name)).join(' · ')}</td></tr>`).join('')}</table></div>`;
}

function renderDomain(){
  const d = D.find(x=>x.id===state.dom); if(!d) return renderHome();
  let body='';
  if(state.zoom==='100k'){
    body = `<div class="sec"><h3><span class="bar"></span>Role in civilization</h3><div class="prose">${paras(d.view100k.role)}</div></div>
    <div class="sec"><h3><span class="bar"></span>Interdependencies with the other 19 domains</h3><div class="prose">${paras(d.view100k.interdependencies)}</div></div>
    <div class="sec"><h3><span class="bar"></span>The regulation model</h3><div class="prose">${paras(d.view100k.regulationModel)}</div></div>`;
  } else if(state.zoom==='10k'){
    body = `<div class="sec prose">${paras(d.view10k.overview)}</div>
    <div class="sec"><h3><span class="bar"></span>Business types (${d.view10k.businessTypes.length})</h3>
    ${d.view10k.businessTypes.map(b=>`<details class="biz"><summary>${esc(b.name)}<span><span class="chip">NAICS ${esc(b.naics)}</span> <span class="arr">▶</span></span></summary><div class="body">
      <div class="kv"><b>Definition</b>${esc(b.definition)}</div>
      <div class="kv"><b>Operations & business model</b>${esc(b.operations)}</div>
      <div class="kv"><b>Regulation</b>${esc(b.regulation)}</div>
      <div class="kv"><b>Archetypes</b><span class="ex">${esc(b.examples)}</span></div></div></details>`).join('')}
    </div>
    <div class="sec"><h3><span class="bar"></span>Regulators & self-regulators</h3>
    <table><tr><th>Body</th><th>Jurisdiction</th><th>Role</th></tr>
    ${d.view10k.regulators.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.jurisdiction)}</td><td>${esc(r.role)}</td></tr>`).join('')}</table></div>`;
  } else {
    const by = {};
    d.groundView.positions.forEach(p=>{(by[p.level]=by[p.level]||[]).push(p)});
    body = `<div class="sec prose">${paras(d.groundView.orgModel)}</div>
    ${LVLORD.filter(l=>by[l]).map(l=>`
      <div class="poslvl" style="color:${LVLС[l]}"><span class="dot" style="background:${LVLС[l]}"></span>${l} (${by[l].length})</div>
      ${by[l].map(p=>`<div class="pos" style="border-left-color:${LVLС[l]}">
        <div class="top"><h5>${esc(p.title)}</h5><span class="soc">SOC ${esc(p.socCode)}</span></div>
        <div class="rep">Reports to: ${esc(p.reportsTo)}</div>
        <div class="duty">${esc(p.duties)}</div>
        <div class="cred">🎓 ${esc(p.credentials)}</div></div>`).join('')}`).join('')}`;
  }
  main.innerHTML = `<div class="crumb">Domain ${String(D.indexOf(d)+1).padStart(2,'0')} / 20</div>
  <h2 class="title">${d.icon} ${esc(d.name)}</h2>
  <div class="tagline">${esc(d.tagline)}</div>
  ${zoomTabs()}${body}`;
  bindZoom();
}

function render(){
  setActive();
  window.scrollTo(0,0);
  if(state.view==='home') renderHome();
  else if(state.view==='anatomy') renderAnatomy();
  else if(state.view==='regulation') renderRegulation();
  else renderDomain();
}

// search
document.getElementById('search').addEventListener('input', e=>{
  const q = e.target.value.trim().toLowerCase();
  if(q.length<2){render();return;}
  const hits=[];
  D.forEach(d=>{
    d.groundView.positions.forEach(p=>{ if((p.title+' '+p.duties+' '+p.credentials).toLowerCase().includes(q)) hits.push({t:'Position',dom:d,zoom:'ground',title:p.title,snip:p.duties}); });
    d.view10k.businessTypes.forEach(b=>{ if((b.name+' '+b.definition+' '+b.examples).toLowerCase().includes(q)) hits.push({t:'Business type',dom:d,zoom:'10k',title:b.name,snip:b.definition}); });
    d.view10k.regulators.forEach(r=>{ if((r.name+' '+r.role).toLowerCase().includes(q)) hits.push({t:'Regulator',dom:d,zoom:'10k',title:r.name,snip:r.role}); });
  });
  const hl = s => esc(s).replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>');
  main.innerHTML = `<h2 class="title">🔎 Search</h2><div class="sres">${hits.length} results for “${esc(q)}” across all 20 domains</div>` +
    hits.slice(0,80).map((h,i)=>`<div class="card hit" data-i="${i}"><div class="from">${h.dom.icon} ${esc(h.dom.name)} · ${h.t}</div><h4>${hl(h.title)}</h4><div class="kv">${hl(h.snip)}</div></div>`).join('') +
    (hits.length>80?`<div class="sres">…and ${hits.length-80} more. Refine your search.</div>`:'');
  main.querySelectorAll('.hit').forEach(el=>el.addEventListener('click',()=>{
    const h=hits[+el.dataset.i]; document.getElementById('search').value='';
    state.view='dom';state.dom=h.dom.id;state.zoom=h.zoom;render();
  }));
});

render();
</script>
</body>
</html>
