, "role": "Insures deposits to $250,000, examines state nonmember banks, and resolves failed banks as receiver — the credibility anchor of the deposit system."}, {"name": "Office of the Comptroller of the Currency (OCC)", "jurisdiction": "US", "role": "Charters, examines, and supervises national banks and federal savings associations, setting safety-and-soundness and (via interpretive letters) permissible-activity boundaries including fintech partnerships."}, {"name": "Commodity Futures Trading Commission (CFTC)", "jurisdiction": "US", "role": "Regulates futures, options, and swaps markets — designated contract markets, clearinghouses, FCMs, and swap dealers — and prosecutes manipulation and fraud in derivatives and their underlying commodities."}, {"name": "Financial Industry Regulatory Authority (FINRA)", "jurisdiction": "US (SRO)", "role": "The self-regulatory organization for ~3,300 broker-dealers: writes conduct rules, licenses representatives through qualification exams (SIE, Series 7), examines firms, runs market surveillance, and operates arbitration — all under SEC oversight."}, {"name": "National Association of Insurance Commissioners (NAIC) / State Insurance Departments", "jurisdiction": "US states", "role": "State commissioners license carriers and producers, approve rates and forms, and conduct solvency exams; the NAIC coordinates them through model laws, risk-based capital standards, and accreditation."}, {"name": "Basel Committee on Banking Supervision / Financial Stability Board", "jurisdiction": "Global", "role": "Basel sets the international bank capital, liquidity (LCR/NSFR), and leverage standards national regulators implement; the FSB designates global systemically important institutions and coordinates crisis-prevention policy across the G20."}]}, "groundView": {"orgModel": "A large financial institution is governed by a board whose risk and audit committees carry regulatory force — Fed guidance effectively prescribes their duties — atop a CEO and an executive committee organized into revenue divisions (consumer banking, commercial banking, markets, wealth/asset management) and powerful control functions with mandated independence: the Chief Risk Officer's second line of defense, Compliance, and Internal Audit reporting to the board, not management. The distinctive architecture is the three lines of defense: front-office businesses own risk, independent risk/compliance functions constrain it, and audit assures both. Below division heads sit managing directors running desks, regions, and product P&Ls; then vice presidents and associates executing deals, portfolios, and credit decisions; then the operational layer of branch staff, operations processors, and call centers that touch millions of customer transactions daily. Compensation is heavily variable and deferred, itself a regulatory instrument for aligning risk horizons.", "positions": [{"title": "Board Director / Risk Committee Chair", "level": "Governance", "reportsTo": "Shareholders", "duties": "Approves risk appetite statements, capital plans submitted to the Fed, and executive compensation structures regulators scrutinize for risk incentives; meets examiners annually and owns the board-level response to supervisory findings (MRAs/MRIAs). Measured on the institution's safety-and-soundness ratings and shareholder returns.", "credentials": "Former bank executives, regulators, or CFOs; Dodd-Frank requires risk expertise on large-bank risk committees; NACD or bank-director certification common.", "socCode": "11-1011"}, {"title": "Chief Executive Officer", "level": "Executive", "reportsTo": "Board of Directors", "duties": "Allocates capital across businesses within regulatory ratios, owns the relationship with primary supervisors, sets risk culture from the top, and answers to markets quarterly. Personally attests under supervisory frameworks; measured on ROTCE, efficiency ratio, stress-test results, and franchise growth.", "credentials": "MBA or equivalent; ascension typically through markets, commercial banking, or finance leadership; two decades of P&L and regulatory-facing experience.", "socCode": "11-1011"}, {"title": "Chief Risk Officer", "level": "Executive", "reportsTo": "CEO and Board Risk Committee", "duties": "Runs the independent second line: sets credit, market, liquidity, and operational risk limits; owns stress testing and the risk appetite framework; can veto transactions and escalate directly to the board. Measured on losses versus expectation, limit breaches, and supervisory exam outcomes.", "credentials": "Advanced quantitative degree common; FRM or CFA; long experience across credit and market risk; regulator-credible gravitas is a job requirement.", "socCode": "11-3031"}, {"title": "Chief Financial Officer", "level": "Executive", "reportsTo": "CEO", "duties": "Owns the balance sheet: capital planning (CCAR submission), funding and liquidity strategy, investor relations, and regulatory financial reporting (Call Reports, FR Y-9C, 10-K). Runs treasury's interest-rate positioning. Measured on NIM management, capital efficiency, and reporting integrity under SOX.", "credentials": "CPA and/or CFA, MBA; controllership or treasury track; deep GAAP and regulatory-reporting fluency.", "socCode": "11-3031"}, {"title": "Chief Compliance Officer / BSA Officer", "level": "Executive", "reportsTo": "CEO / Board (functional line)", "duties": "Owns adherence to the rulebook: AML/BSA program (a statutorily required officer role), sanctions screening, fair lending, suitability, and the compliance testing calendar; files or supervises SAR decisions. Measured on exam findings, regulatory actions avoided, and program maturity.", "credentials": "JD or compliance career track; CAMS (anti-money-laundering) and CRCM certifications standard; examiner alumni common.", "socCode": "13-1041"}, {"title": "Head of Investment Banking / Division Head", "level": "Executive", "reportsTo": "CEO", "duties": "Runs a revenue division's P&L: client coverage model, league-table standing, banker headcount and compensation pools, and the risk the division originates. Chairs commitment committees that approve underwriting exposures. Measured on revenue, ROE of allocated capital, and market share.", "credentials": "MBA typical; Series 24 general securities principal; 20 years of deal or trading leadership.", "socCode": "11-1011"}, {"title": "Managing Director, M&A / Coverage Banker", "level": "Management", "reportsTo": "Head of Investment Banking", "duties": "Owns C-suite client relationships in a sector, originates mandates, negotiates fee letters, and quarterbacks live deals — fairness opinions, board presentations, negotiation strategy. Carries a personal revenue expectation ($10-30M+ at bulge brackets). Measured on origination revenue and client wallet share.", "credentials": "MBA from a target program traditionally; Series 79 (investment banking) and 63; a decade-plus of execution before the title.", "socCode": "11-3031"}, {"title": "Branch / Market Manager (Retail Banking)", "level": "Management", "reportsTo": "Regional Executive, Consumer Bank", "duties": "Runs one or several branches: staffing and coaching, deposit and loan growth goals, operational integrity (cash audits, dual control), and community presence under CRA expectations. Measured on household growth, deposit balances, service scores, and audit results.", "credentials": "Bachelor's typical; NMLS registration for mortgage referrals; internal leadership development pathways.", "socCode": "11-3031"}, {"title": "Portfolio Manager", "level": "Professional", "reportsTo": "Chief Investment Officer", "duties": "Owns investment decisions for funds or mandates against a benchmark: position sizing, risk budgeting, and sell discipline; writes commentary that clients and consultants scrutinize quarterly. Measured on alpha versus benchmark, information ratio, and asset retention.", "credentials": "CFA charter is the field's credential of record; MBA or graduate quantitative degree common; a decade as analyst first.", "socCode": "13-2051"}, {"title": "Derivatives Trader (Rates/FX/Equities Desk)", "level": "Professional", "reportsTo": "Desk Head / Head of Trading", "duties": "Makes markets and manages the desk's book: quotes prices to clients, hedges greeks (delta, vega, gamma) continuously, and runs risk within VaR and stress limits marked to market nightly. Measured on desk P&L, Sharpe of risk taken, and limit discipline.", "credentials": "Quantitative bachelor's or master's; Series 7/63 (and 57 for securities traders); programming (Python) now table stakes.", "socCode": "41-3031"}, {"title": "Credit Analyst / Underwriter (Commercial Lending)", "level": "Professional", "reportsTo": "Chief Credit Officer / Senior Credit Manager", "duties": "Spreads financial statements, models cash-flow coverage and collateral, writes credit approval memos, assigns risk ratings, and monitors covenants across a portfolio. The institution's loss experience is the long-run scorecard. Measured on underwriting quality, turnaround time, and criticized-asset migration.", "credentials": "Finance/accounting degree; formal bank credit-training program; RMA credit certifications; CFA for advancement.", "socCode": "13-2041"}, {"title": "Actuary", "level": "Professional", "reportsTo": "Chief Actuary", "duties": "Prices insurance products and values reserves: builds mortality/morbidity or loss-development models, signs statutory opinions on reserve adequacy, and tests capital under stress scenarios. Legally accountable for the numbers via professional standards. Measured on pricing adequacy, reserve accuracy, and exam outcomes.", "credentials": "Fellowship in the Society of Actuaries (FSA) or Casualty Actuarial Society (FCAS) via a multi-year exam sequence; MAAA for signing opinions.", "socCode": "15-2011"}, {"title": "Quantitative Analyst / Model Developer", "level": "Professional", "reportsTo": "Head of Quantitative Research", "duties": "Builds and validates the models that price derivatives, score credit, detect fraud, and compute capital; documents them to SR 11-7 model-risk standards and defends them to validation teams and examiners. Measured on model performance, validation findings, and production reliability.", "credentials": "PhD or MS in math, physics, statistics, or financial engineering; C++/Python; CQF or FRM sometimes added.", "socCode": "13-2051"}, {"title": "Financial Advisor / Wealth Manager", "level": "Professional", "reportsTo": "Branch Manager / Market Executive (Wealth)", "duties": "Advises households on portfolios, retirement, and estate coordination; operates under Regulation Best Interest or fiduciary duty depending on registration; prospects and retains a book of relationships. Measured on net new assets, revenue on assets, and client retention.", "credentials": "Series 7 and 66; CFP certification increasingly the professional standard; insurance licenses for annuity business.", "socCode": "13-2052"}, {"title": "Compliance Analyst / AML Investigator", "level": "Professional", "reportsTo": "BSA Officer / Compliance Manager", "duties": "Clears transaction-monitoring alerts, investigates suspicious activity and drafts SAR narratives filed with FinCEN, performs enhanced due diligence on high-risk customers, and screens against OFAC sanctions lists. Measured on case quality, timeliness against regulatory clocks, and audit validation.", "credentials": "Bachelor's; CAMS certification the norm; investigative or law-enforcement backgrounds valued.", "socCode": "13-2061"}, {"title": "Insurance Claims Adjuster", "level": "Operational", "reportsTo": "Claims Manager", "duties": "Investigates losses — inspects damaged property, interviews claimants, reads policy language for coverage — sets reserves, negotiates settlements, and detects fraud referrals. Works a pending inventory of 50-150 claims. Measured on cycle time, accuracy of payments (leakage), and customer satisfaction.", "credentials": "Bachelor's preferred; state adjuster licenses; AIC or CPCU designations for advancement; Xactimate proficiency in property.", "socCode": "13-1031"}, {"title": "Loan Officer / Mortgage Loan Originator", "level": "Operational", "reportsTo": "Sales Manager / Branch Manager", "duties": "Sources borrowers through realtors and referrals, structures loan applications, quotes and locks rates, and shepherds files through processing and underwriting to closing under TRID disclosure deadlines. Compensated substantially on commission per funded loan. Measured on funded volume, pull-through rate, and file quality.", "credentials": "NMLS licensing with SAFE Act exam for nonbank MLOs (registration for bank MLOs); no degree required though common.", "socCode": "13-2072"}, {"title": "Bank Teller / Universal Banker", "level": "Operational", "reportsTo": "Branch Manager / Head Teller", "duties": "Processes deposits, withdrawals, and payments with dual-control cash handling; balances a drawer to the penny daily; flags structuring and elder-fraud red lines to BSA; increasingly cross-trained to open accounts and handle service issues as branches consolidate roles. Measured on balancing accuracy, transaction quality, and referral generation.", "credentials": "High school diploma; on-the-job certification in cash handling, BSA basics, and platform systems.", "socCode": "43-3071"}, {"title": "Trade Settlement / Operations Specialist", "level": "Operational", "reportsTo": "Operations Manager", "duties": "Affirms, confirms, and settles trades on T+1 deadlines; investigates breaks between front-office blotters, custodians, and DTCC; processes corporate actions and margin calls. Errors here become real money fast. Measured on settlement fail rates, break aging, and processing accuracy.", "credentials": "Bachelor's typical; Series 99 (operations professional) at broker-dealers; systems fluency (DTCC, SWIFT, Aladdin).", "socCode": "43-4011"}, {"title": "Fraud & Disputes Specialist (Cards/Payments)", "level": "Operational", "reportsTo": "Fraud Operations Manager", "duties": "Works real-time fraud queues: reviews flagged transactions, contacts cardholders, blocks and reissues cards, and processes Reg E/Reg Z dispute investigations within statutory timelines. Measured on fraud loss prevention, false-positive rates, and dispute cycle compliance.", "credentials": "High school to bachelor's; internal certification on network rules (Visa/Mastercard chargeback reason codes).", "socCode": "13-2099"}]}}, {"id": "economy", "name": "Economy", "icon": "📊", "tagline": "The coordination layer of civilization — the monetary, fiscal, statistical, and analytical apparatus that steers markets, plus the property and holding structures through which wealth is organized.", "view100k": {"role": "The Economy domain is not a single industry but civilization's coordination layer: the set of institutions that measure, model, steer, and structure economic activity itself. At its core sit the monetary authorities — central banks that issue currency, set the price of money, and act as lenders of last resort — and the fiscal apparatus of treasuries and budget offices that tax and spend a quarter to half of national income. Around this core operates the knowledge infrastructure: national statistical agencies whose GDP, CPI, and employment series are the instrument panel of policy; economic consulting and forecasting firms that translate theory into litigation testimony and corporate strategy; think tanks that manufacture the policy ideas governments later adopt; and credit rating agencies whose opinions gate access to $140 trillion of global bond markets. The domain also encompasses the structures through which claims on wealth are organized — holding companies that own operating businesses, and the real estate and rental markets that constitute the largest single asset class on earth.\n\nThe scale is paradoxical: the domain's direct revenues are modest, but its leverage is total. The Federal Reserve's balance sheet has ranged from $4 to $9 trillion; U.S. federal spending exceeds $6 trillion annually against roughly $28 trillion of GDP; global real estate is valued near $380 trillion — more than all equities and debt securities combined — with U.S. real estate services and rental/leasing (NAICS 53) contributing over $3 trillion to GDP and employing millions of brokers, appraisers, and property managers. Economic consulting is a $10B+ specialty; the three major rating agencies gross over $10 billion; and national statistical systems, though costing only billions, calibrate decisions worth trillions — a mismeasured CPI compounds across every indexed contract, pension, and tax bracket in the economy.\n\nHistorically the domain emerged in layers: early modern states built tax bureaucracies; the Bank of England (1694) invented central banking as war finance and evolved into Bagehot's lender of last resort; the crises of 1907 and 1929 produced the Federal Reserve and the modern statistical state (national income accounts were literally invented by Kuznets in the 1930s so policymakers could see the Depression); Bretton Woods (1944) created the IMF and World Bank to coordinate the system internationally. The Keynesian revolution made macroeconomic management a formal government function; the inflation of the 1970s produced independent, inflation-targeting central banks; and 2008 added macroprudential oversight to the toolkit. The current chapter contends with fiscal-monetary entanglement after successive crisis interventions, the measurement problem of a digital economy invisible to industrial-age statistics, and housing affordability as a first-order political economy question.", "interdependencies": "The Economy domain is the thermostat wired into every other room of civilization: its interest rates set the discount rate on Energy's power plants and Infrastructure's toll roads; its statistics tell Agriculture what to plant and Trade what to ship; its property markets determine where Population lives and what Education and Medicine facilities cost to site. It depends on Finance as its transmission mechanism — monetary policy works only through banks, bond markets, and mortgage rates — and on Governance and Law for the independence, tax authority, and property-rights enforcement that make coordination credible. Technology supplies the payment rails, data pipelines, and now the AI models reshaping both forecasting and the labor markets being forecast; Science and Education supply the economists and the discipline itself; Communication transmits the forward guidance on which modern central banking runs — a Fed chair's sentence moves $100 trillion of asset prices. Demographics from Population drive the dependency ratios haunting every pension projection; Environment forces carbon pricing and climate-risk accounting into national balance sheets; Defense and Intelligence rely on economic statecraft — sanctions, export controls, reserve-currency power — as weapons; and Culture and Religion set the deep parameters (trust, thrift, attitudes toward debt and interest) that economists measure but do not control. Industry, Trade, and Agriculture, in turn, generate the transactions this domain exists to measure and steer.", "regulationModel": "This domain is peculiar in that it largely regulates the regulators: its governance is constitutional more than administrative. Central banks operate under statutory mandates (the Fed's dual mandate of price stability and maximum employment) with instrument independence but congressional oversight, audited transparency, and international coordination through the Bank for International Settlements and its Basel committees. Fiscal institutions are disciplined by budget law, debt-limit statutes, independent scorekeepers (CBO, and fiscal councils abroad), and ultimately bond-market vigilantes. Statistical agencies are governed by professional standards — the IMF's Special Data Dissemination Standard, UN statistical frameworks, and legal firewalls (Title 13 confidentiality for the Census) that protect data integrity from political interference. The private layer is conventionally regulated: credit rating agencies register with the SEC as NRSROs under post-2008 conflict-of-interest rules; economic consultants face Daubert reliability standards when testifying; real estate brokerage is licensed state-by-state and self-regulated through the National Association of Realtors' code of ethics and MLS rules (recently reshaped by antitrust litigation); appraisers answer to state boards under the federal Appraisal Subcommittee and USPAP standards; and holding companies are governed by securities, antitrust, and — for bank holding companies — Federal Reserve supervision."}, "view10k": {"overview": "The domain spans NAICS 521110 (Monetary Authorities — Central Bank), the public-administration codes for economic programs (926110 Administration of General Economic Programs, 921130 Public Finance Activities — covering treasuries, budget offices, and statistical agencies), the analytical private sector in 5416 and 5417 (541611/541618 economic and management consulting, 541720 research in social sciences — the think-tank code, 541910 market/opinion research), credit intermediation adjuncts like 561450 (credit bureaus) and NRSRO rating agencies, the vast Real Estate and Rental sector 53 (531110/531120 lessors, 531210 brokerage offices, 531311/531312 property managers, 531320 appraisers, 237210 land subdivision), and the ownership superstructure of NAICS 551 (551111 bank holding companies, 551112 other holding companies). Firm types thus range from public institutions that are not firms at all, through partnerships of PhD economists, to REITs, brokerages, and conglomerate holding structures.", "businessTypes": [{"name": "Central Bank / Monetary Authority", "naics": "521110", "definition": "The public institution that issues the currency, sets policy interest rates, regulates money supply and credit conditions, supervises banks, and acts as lender of last resort.", "operations": "Not profit-seeking, but operationally it earns seigniorage: interest on a portfolio of government securities funded by non-interest-bearing currency, remitting surplus to the treasury. Day-to-day it conducts open market operations and repo facilities to hold the policy rate on target, runs the payment system (Fedwire, FedNow), supervises banks, and produces the research and forecasts behind eight FOMC meetings a year.", "regulation": "Governed by statute (Federal Reserve Act), congressional oversight and testimony, GAO audit (excluding monetary policy deliberations), and internal Inspector General; internationally coordinated through the BIS. Self-regulates through transparency frameworks — published minutes, dot plots, inflation-targeting regimes — that stake its credibility publicly.", "examples": "Federal Reserve System, European Central Bank, Bank of Japan, Bank of England"}, {"name": "National Treasury / Fiscal & Budget Agency", "naics": "921130", "definition": "The government's finance ministry: raises revenue, issues sovereign debt, manages public cash, and executes the budget; flanked by independent scorekeepers that cost legislation.", "operations": "Operates the largest cash-management operation on earth — the U.S. Treasury auctions roughly $20+ trillion in securities annually across bills, notes, and bonds through primary dealers, forecasts daily cash balances, and disburses payments from Social Security to payroll. Budget offices (OMB, CBO) build baselines, score bills, and enforce budget law.", "regulation": "Bound by appropriations law, the Antideficiency Act, debt-limit statute, and GAO audit; debt issuance follows published auction rules with primary-dealer conduct overseen jointly with the Fed and SEC. Institutional self-discipline comes through transparency (Monthly Treasury Statement, TBAC consultation with market participants).", "examples": "U.S. Department of the Treasury, Congressional Budget Office, HM Treasury, Germany's Finanzagentur"}, {"name": "National Statistical Agency", "naics": "926110", "definition": "The public bureau that measures the economy and society — GDP, inflation, employment, trade, census — producing the official statistics on which policy, markets, and indexed contracts depend.", "operations": "Runs continuous survey and administrative-data pipelines: the BLS prices 80,000 items monthly for CPI and surveys 60,000 households for the unemployment rate; BEA assembles GDP from thousands of source series on a rigid release calendar whose embargo security is treated like classified material. Funded by appropriation; its product is credibility.", "regulation": "Governed by statistical law (Title 13 confidentiality, CIPSEA), OMB statistical policy directives, and international standards (UN SNA 2008/2025 for national accounts, IMF SDDS). Self-regulates through professional autonomy norms, published methodology, and revision transparency — the defense against political capture.", "examples": "Bureau of Labor Statistics, Bureau of Economic Analysis, U.S. Census Bureau, Eurostat"}, {"name": "Multilateral Economic Institution", "naics": "928120 (International Affairs)", "definition": "Treaty-based bodies that coordinate the global economy: balance-of-payments lending (IMF), development finance (World Bank), and policy coordination and standards (OECD, BIS).", "operations": "The IMF lends from quota subscriptions under conditionality and runs Article IV surveillance of every member economy; the World Bank borrows on capital markets against callable capital to fund development projects; the OECD produces comparative statistics and soft law (tax treaties, BEPS). Staffed by career economists; output is loans, data, and leverage over policy.", "regulation": "Governed by their Articles of Agreement, weighted shareholder boards of member states, and independent evaluation offices; enjoy legal immunities but face member-state political oversight. Self-regulation through evaluation offices (IEO at the IMF) and transparency policies.", "examples": "International Monetary Fund, World Bank Group, OECD, Bank for International Settlements"}, {"name": "Economic Consulting Firm", "naics": "541611, 541618, 541690", "definition": "A professional-services firm selling applied economics: expert testimony in antitrust and damages litigation, merger analysis, regulatory economics, transfer pricing, and forecasting.", "operations": "Bills senior economist time at $500-1,500+/hour supported by leveraged analyst pyramids; the core assets are academic-affiliated experts whose credibility survives cross-examination. Projects run from merger simulations filed with the DOJ/FTC to damages models in billion-dollar disputes, on litigation timelines.", "regulation": "No dedicated regulator; disciplined by Daubert/Frye admissibility standards in court, DOJ/FTC merger-review scrutiny of submitted analyses, and professional ethics. Self-regulates through peer review norms, conflict-check systems, and reputational capital — an expert discredited once is finished.", "examples": "Analysis Group, Charles River Associates, NERA, Compass Lexecon, Brattle Group"}, {"name": "Think Tank / Policy Research Institute", "naics": "541720, 813319", "definition": "A nonprofit research organization producing policy analysis and ideas intended to shape legislation, regulation, and public debate — the R&D lab of governance.", "operations": "Funded by endowments, foundation grants, corporate and individual donors; produces reports, testimony, convenings, and scholars who rotate into administrations (the 'revolving door' is the product working). Output is measured in citations, media presence, and policy adoption rather than revenue.", "regulation": "IRS 501(c)(3) rules cap lobbying and require public Form 990 disclosure; FARA applies to foreign funding for political activity. Self-regulates through funding-transparency commitments, peer review, and independence firewalls between donors and findings — imperfectly, as recurring scandals attest.", "examples": "Brookings Institution, American Enterprise Institute, Peterson Institute, RAND Corporation"}, {"name": "Credit Rating Agency (NRSRO)", "naics": "561450 (classified with credit bureaus), 523999", "definition": "A firm issuing opinions on the creditworthiness of borrowers and securities — sovereign, corporate, municipal, structured — whose letter grades are hardwired into investment mandates and capital rules.", "operations": "The issuer-pays model: borrowers pay for ratings (typically ~5-7bp of issuance) because unrated debt is unsellable; analysts run committees applying published criteria, then surveil ratings through the life of the instrument. Data and analytics subscriptions are the growth business.", "regulation": "SEC registration and examination as Nationally Recognized Statistical Rating Organizations under the Credit Rating Agency Reform Act and Dodd-Frank (conflict-of-interest walls between sales and analysis, methodology disclosure); ESMA regulates in Europe. Self-regulates through published criteria, rating-performance studies, and analyst rotation policies.", "examples": "S&P Global Ratings, Moody's, Fitch Ratings"}, {"name": "Economic Data & Forecasting Vendor", "naics": "519290, 541910, 541611", "definition": "A private firm selling macroeconomic data, indices, models, and forecasts — the commercial complement to official statistics.", "operations": "Subscription revenue for terminals, data feeds, scenario services, and purchasing-managers indices that markets trade on the second they print; some (Conference Board's consumer confidence, S&P Global PMIs) are quasi-official market movers. Operations blend survey panels, nowcasting models, and economist commentary.", "regulation": "Largely unregulated as speech, though benchmark indices used in financial contracts fall under IOSCO benchmark principles and EU Benchmark Regulation; market-moving data releases follow self-imposed embargo protocols. Self-regulates through methodology transparency and revision policies.", "examples": "Moody's Analytics, S&P Global Market Intelligence, Oxford Economics, The Conference Board"}, {"name": "Real Estate Brokerage", "naics": "531210", "definition": "A licensed intermediary matching buyers and sellers (or landlords and tenants) of residential and commercial property, earning commission on closed transactions.", "operations": "Agents — mostly independent contractors — split commissions (historically ~5-6% residential, now compressing post-settlement) with their brokerage; the brokerage sells brand, leads, MLS access, and compliance supervision. Commercial brokerage adds tenant representation, investment sales, and debt placement on multi-year relationship cycles.", "regulation": "State real estate commissions license brokers and agents and discipline violations; the 2024 NAR antitrust settlement restructured commission practices; RESPA governs settlement referrals. Self-regulates through the National Association of Realtors' Code of Ethics, local MLS rules, and arbitration of commission disputes.", "examples": "Compass, CBRE, Keller Williams, JLL"}, {"name": "Lessor / Landlord (Residential & Commercial, incl. REITs)", "naics": "531110, 531120, 525930", "definition": "An owner of income-producing property — apartments, offices, warehouses, retail — renting space to tenants; at scale, structured as Real Estate Investment Trusts distributing 90% of taxable income.", "operations": "Revenue is contracted rent against operating expenses and debt service; value creation comes from occupancy, rent growth, and cap-rate compression, with leverage amplifying both directions. Operations are leasing, tenant credit underwriting, capital-expenditure cycles, and asset-level financing rolled every 5-10 years.", "regulation": "State/local landlord-tenant law, rent stabilization regimes in some jurisdictions, Fair Housing Act enforcement (HUD/DOJ), building and fire codes; REITs additionally answer to the SEC and IRS qualification tests. Self-regulates through NMHC/NAA and BOMA operating standards and codes.", "examples": "Prologis, AvalonBay, Equity Residential, Greystar (owner side)"}, {"name": "Property Management Firm", "naics": "531311, 531312", "definition": "A fee-for-service operator of properties on behalf of owners: leasing, rent collection, maintenance, budgeting, and compliance for residential communities or commercial assets.", "operations": "Earns 3-8% of collected rents residentially (or per-square-foot fees commercially) plus leasing and construction-supervision fees; the model is thin-margin and scale-driven. Daily operations are work-order dispatch, delinquency management, vendor contracting, and owner reporting.", "regulation": "State broker licensing typically required to manage third-party property; trust-accounting rules for tenant funds; Fair Housing and habitability law. Self-regulates through IREM certifications (CPM), NARPM codes, and BOMA standards.", "examples": "Greystar, Cushman & Wakefield (property services), Lincoln Property Company, FirstService Residential"}, {"name": "Real Estate Appraisal & Valuation Firm", "naics": "531320", "definition": "An independent professional practice producing opinions of property value for lending, taxation, litigation, and investment decisions.", "operations": "Fee-per-assignment economics (residential appraisals $400-800; commercial narratives $3,000-25,000+); the product is a USPAP-compliant report defending a value conclusion from comparable sales, income capitalization, and cost approaches. Volume tracks mortgage originations, making the business rate-cyclical.", "regulation": "State appraiser boards license under federal oversight by the Appraisal Subcommittee; the Appraisal Foundation writes USPAP standards; lenders' appraisal-independence rules (post-HVCC) insulate appraisers from loan-production pressure. Self-regulates through the Appraisal Institute's MAI/SRA designations and ethics enforcement.", "examples": "CBRE Valuation & Advisory, Newmark V&A, Colliers Valuation, thousands of independent shops"}, {"name": "Holding Company / Diversified Conglomerate", "naics": "551112, 551111", "definition": "A parent entity that owns controlling stakes in operating subsidiaries, existing to allocate capital, provide governance, and shield liabilities across a portfolio — the ownership architecture of large-scale capitalism.", "operations": "The pure holding company produces nothing: it earns dividends and capital gains from subsidiaries, allocates retained cash to acquisitions, buybacks, or internal reinvestment, and arbitrages its cost of capital across businesses. Headquarters may be dozens of people (Berkshire's is ~25) governing hundreds of thousands of employees through subsidiary boards and capital budgets.", "regulation": "Securities laws if public; antitrust review of acquisitions (DOJ/FTC, HSR); bank holding companies fall under Federal Reserve supervision with source-of-strength doctrine; tax law (consolidated returns, Subpart F) shapes structure heavily. Self-regulates through board governance, listing standards, and controlled-company disclosure.", "examples": "Berkshire Hathaway, Alphabet Inc., Danaher, Exor"}, {"name": "Title, Escrow & Settlement Services", "naics": "541191, 524127", "definition": "Firms that search property records, insure title against defects, and act as neutral escrow agents closing real estate transactions — the trust infrastructure of property transfer.", "operations": "Title insurers earn a one-time premium (state-regulated rates, ~0.5-1% of price) with unusually low loss ratios because the product is defect prevention via search and cure; escrow operations hold and disburse purchase funds against recorded deeds. Volume rides the transaction cycle.", "regulation": "State insurance departments regulate title insurance rates and forms; RESPA (CFPB) polices kickbacks and affiliated-business arrangements; state bar rules govern attorney-closing states. Self-regulates through ALTA (American Land Title Association) best practices and standardized policy forms.", "examples": "Fidelity National Financial, First American, Old Republic Title"}], "regulators": [{"name": "Federal Reserve System", "jurisdiction": "US", "role": "Beyond bank supervision, it is the economy's chief coordinator: sets the federal funds rate, conducts open market operations and quantitative easing/tightening, operates payment rails, and publishes the flow-of-funds accounts and Beige Book intelligence."}, {"name": "U.S. Department of the Treasury / OMB / CBO", "jurisdiction": "US", "role": "Treasury issues and manages the public debt and administers sanctions (OFAC) and tax policy; OMB enforces budget discipline across agencies; CBO provides the independent cost scores that constrain legislation."}, {"name": "Securities and Exchange Commission (SEC)", "jurisdiction": "US", "role": "Registers and examines credit rating agencies (NRSROs), regulates REIT and holding-company disclosure, and polices the securities dimension of economic information (Reg FD, insider trading on macro data)."}, {"name": "International Monetary Fund (IMF)", "jurisdiction": "Global", "role": "Surveils all member economies through Article IV consultations, lends to countries in balance-of-payments crisis under policy conditionality, and sets data-dissemination standards national statistics follow."}, {"name": "Bank for International Settlements (BIS) / OECD", "jurisdiction": "Global", "role": "The BIS hosts the committees (Basel, CPMI) where central banks coordinate standards and serves as their bank; the OECD sets soft law on tax (BEPS, Pillar Two), statistics, and structural policy benchmarking."}, {"name": "State Real Estate Commissions & Appraisal Boards / Appraisal Subcommittee (ASC)", "jurisdiction": "US states + federal oversight", "role": "License and discipline real estate brokers, agents, and appraisers; the federal ASC oversees state appraiser programs and The Appraisal Foundation's USPAP standards under FIRREA."}, {"name": "National Association of Realtors (NAR)", "jurisdiction": "US (industry association/SRO)", "role": "The 1.5-million-member trade association whose Code of Ethics, MLS governance, and arbitration system function as the self-regulatory regime of residential brokerage — restructured by the 2024 antitrust settlement but still the profession's rulebook."}, {"name": "Federal Trade Commission / DOJ Antitrust Division", "jurisdiction": "US", "role": "Review mergers and holding-company acquisitions under the Clayton Act and HSR premerger notification, and police anticompetitive conduct in markets from MLS rules to rating-agency practices."}]}, "groundView": {"orgModel": "Organizations in this domain split into three architectures. Public institutions (central banks, statistical agencies) are governed by boards or commissions appointed for fixed terms to insulate them from politics — the Fed's seven governors and twelve reserve bank presidents, a statistical agency's Senate-confirmed commissioner — over a career civil-service staff of PhD economists, statisticians, and examiners organized into research, operations, and supervision divisions. Analytical firms (consultancies, rating agencies, think tanks) are partnership-like pyramids: name-brand principals and managing directors selling and signing the work, layers of vice presidents and senior analysts building models, and research assistants at the base — an apprenticeship structure where credibility, not capital, is the scarce asset. Real estate and holding enterprises are asset-governance structures: a board and investment committee allocating capital, regional and asset-level managers operating properties or subsidiaries, and a large commissioned or field workforce (agents, appraisers, property staff) at the customer edge. Across all three, the common thread is that the product is judgment — a rate decision, a GDP print, a rating, a valuation — so governance centers on protecting the independence and integrity of that judgment.", "positions": [{"title": "Central Bank Governor / Board Member (e.g., Fed Governor)", "level": "Governance", "reportsTo": "Appointing authority (President/Senate confirmation); institutionally independent", "duties": "Votes on monetary policy at FOMC meetings, oversees bank supervision policy and payment systems, and communicates the policy path through speeches that themselves are policy instruments. Testifies before Congress. Measured against the statutory mandate: inflation at target, employment at maximum sustainable levels, financial stability.", "credentials": "PhD in economics or distinguished financial/legal career; 14-year terms (Fed) designed to outlast presidents.", "socCode": "11-1011"}, {"title": "Board Director / Trustee (REIT, Rating Agency, Think Tank)", "level": "Governance", "reportsTo": "Shareholders / Members / Charter", "duties": "Approves capital allocation and dividend/distribution policy at REITs and holding companies, methodology-governance and conflict firewalls at rating agencies, and research-independence policies at think tanks; hires and evaluates the chief executive. Measured on total return, ratings performance, or institutional reputation respectively.", "credentials": "Senior executive, academic, or public-policy careers; audit-committee financial expertise per SOX where public.", "socCode": "11-1011"}, {"title": "Chief Executive Officer / Agency Director (e.g., BLS Commissioner, Consulting CEO)", "level": "Executive", "reportsTo": "Board / Appointing authority", "duties": "Owns the institution's credibility: at a statistical agency, defends methodology and release integrity against political pressure; at a consultancy or rating agency, balances commercial growth against analytical independence; at a REIT, sets portfolio strategy and balance-sheet posture. Measured on institutional trust metrics, financial results, and talent retention.", "credentials": "PhD economist or statistician for public agencies; MBA/JD or economics doctorate for private firms; decades of domain standing.", "socCode": "11-1011"}, {"title": "Chief Economist", "level": "Executive", "reportsTo": "CEO / Governor / Managing Partner", "duties": "Owns the house view: directs the forecasting shop, signs off on published outlooks, briefs the board or policy committee before decisions, and serves as the public analytical face in media and testimony. Measured on forecast accuracy versus consensus, research influence, and client/policymaker demand.", "credentials": "PhD in economics almost universally; publication record; central-bank or IMF pedigree common.", "socCode": "19-3011"}, {"title": "Chief Investment Officer (REIT / Holding Company)", "level": "Executive", "reportsTo": "CEO / Board Investment Committee", "duties": "Allocates capital across acquisitions, developments, and dispositions: sets target markets and cap-rate discipline, structures joint ventures, and presents every major deal to the investment committee with underwritten IRRs. Measured on realized versus underwritten returns and portfolio total return against benchmarks (NCREIF, peer REITs).", "credentials": "MBA and/or CFA; often CCIM or a real-estate-finance background; 15+ years of transactions.", "socCode": "11-3031"}, {"title": "Director of Research / Head of Statistical Programs", "level": "Management", "reportsTo": "Agency Director / Chief Economist", "duties": "Manages the production line of numbers or studies: survey design and response-rate rescue, model maintenance, release-calendar discipline, and the peer review that catches errors before they move markets. Owns methodology change management with public comment. Measured on data quality metrics, revision size, and on-time releases.", "credentials": "PhD or MS in economics/statistics; deep survey methodology (AAPOR) or national-accounts expertise; federal statistical-system experience.", "socCode": "11-9199"}, {"title": "Engagement Manager / Vice President (Economic Consulting)", "level": "Management", "reportsTo": "Managing Director / Partner", "duties": "Runs case teams day to day: structures damages or merger models, manages analyst workstreams and the document record, drafts expert reports for the testifying expert's signature, and holds the budget. Measured on realization rates, expert satisfaction, and case outcomes.", "credentials": "MA/PhD in economics or MBA; 5-10 years of casework; econometrics and Stata/R/Python fluency.", "socCode": "11-2032"}, {"title": "Regional Property Manager / Managing Broker", "level": "Management", "reportsTo": "VP Operations / Brokerage Owner", "duties": "Oversees a portfolio of properties or an office of agents: hires site staff or recruits agents, enforces trust-accounting and license compliance, drives occupancy and NOI budgets or sales-volume targets, and handles escalated tenant or client disputes. Measured on NOI versus budget, occupancy, agent retention, or per-agent productivity.", "credentials": "Broker's license (brokerage) or CPM designation (property management); 7-10 years in the field.", "socCode": "11-9141"}, {"title": "Staff Economist (Central Bank / Agency / Multilateral)", "level": "Professional", "reportsTo": "Director of Research / Division Chief", "duties": "Builds and runs the models — DSGE, nowcasts, sectoral analyses — briefs principals ahead of policy meetings, drafts sections of official reports (Beige Book, Article IV, Monetary Policy Report), and publishes research maintaining the institution's intellectual standing. Measured on briefing quality, publication record, and forecast contribution.", "credentials": "PhD in economics (the job market for these roles is the annual AEA meeting); strong econometrics and programming.", "socCode": "19-3011"}, {"title": "Credit Ratings Analyst", "level": "Professional", "reportsTo": "Sector Managing Director / Ratings Committee", "duties": "Covers a portfolio of issuers: builds cash-flow and leverage models against published criteria, leads management meetings, writes committee packages recommending rating actions, and monitors for downgrades between reviews. Rating decisions belong to the committee, not the analyst — by regulation. Measured on ratings performance (default/transition studies) and surveillance timeliness.", "credentials": "Finance/economics degree, often MBA or CFA; series of internal criteria certifications; barred from securities ownership in covered names.", "socCode": "13-2051"}, {"title": "Government Statistician / Survey Methodologist", "level": "Professional", "reportsTo": "Program Director", "duties": "Designs samples and questionnaires, runs seasonal adjustment and imputation, investigates anomalies before release ('is this number real or an artifact?'), and documents methodology publicly. Guards respondent confidentiality under criminal penalty. Measured on data accuracy, response-rate management, and methodological rigor.", "credentials": "MS/PhD in statistics, economics, or survey methodology; federal statistical training programs; SAS/R.", "socCode": "15-2041"}, {"title": "Policy Analyst / Fellow (Think Tank)", "level": "Professional", "reportsTo": "Program Director / Research VP", "duties": "Produces the reports, op-eds, testimony, and briefings that carry ideas into policy: models proposals, briefs Hill staff and journalists, and convenes stakeholders. A fellow's currency is being cited and called. Measured on publications, citations, media reach, and legislative uptake.", "credentials": "Master's or PhD in economics/public policy; government or campaign experience common; writing ability is the differentiator.", "socCode": "19-3011"}, {"title": "Real Estate Appraiser (Certified General / Residential)", "level": "Professional", "reportsTo": "Chief Appraiser / Principal (or independent)", "duties": "Inspects properties, selects and adjusts comparables, applies income and cost approaches, and signs USPAP-compliant value opinions that lenders, courts, and tax authorities rely on — with personal license liability. Measured on report defensibility, turn times, and review outcomes.", "credentials": "State certification (Certified Residential or Certified General) requiring coursework, 1,500-3,000 supervised hours, and exams; MAI designation for commercial prestige.", "socCode": "13-2021"}, {"title": "Financial/Economic Data Analyst (Data Vendor / Holding Co. FP&A)", "level": "Professional", "reportsTo": "Head of Analytics / CFO", "duties": "Builds the dashboards and models management steers by: consolidates subsidiary reporting at a holding company, or constructs indices and nowcasts at a data vendor; automates pipelines and stress-tests scenarios. Measured on accuracy, timeliness, and decision usefulness.", "credentials": "Bachelor's/master's in economics, finance, or data science; SQL/Python; CFA progress valued.", "socCode": "13-2051"}, {"title": "Real Estate Agent / Salesperson", "level": "Operational", "reportsTo": "Managing Broker", "duties": "The domain's street-level market maker: prospects listings, prices homes against comps, stages and markets properties, negotiates offers and inspection credits, and shepherds transactions through escrow to close. Paid purely on commission as an independent contractor. Measured on closed volume, listing win rate, and client reviews.", "credentials": "State salesperson license (pre-licensing course plus exam); Realtor membership for MLS access; no degree required.", "socCode": "41-9022"}, {"title": "Leasing Consultant / Property Site Staff", "level": "Operational", "reportsTo": "Community/Property Manager", "duties": "Tours prospects, processes applications and credit screens under Fair Housing scripts, executes leases, handles renewals and delinquency notices, and logs service requests — the daily interface between the asset and its tenants. Measured on closing ratio, occupancy, and renewal rate.", "credentials": "High school to bachelor's; Fair Housing training mandatory; NALP certification available.", "socCode": "41-9022"}, {"title": "Economic Research Assistant / Statistical Assistant", "level": "Operational", "reportsTo": "Staff Economist / Statistician", "duties": "Cleans data, codes survey responses, runs regressions to spec, checks numbers that will be published or filed in court, and maintains replication files. The bottom rung of the economist apprenticeship — two years here is the standard pre-PhD credential. Measured on accuracy and throughput; errors are career events.", "credentials": "Bachelor's in economics, math, or statistics with strong grades; R/Stata/Python; typically a 2-year pre-graduate-school stint.", "socCode": "43-9111"}, {"title": "Data Collection Field Economist / Enumerator", "level": "Operational", "reportsTo": "Regional Survey Manager", "duties": "The ground truth of official statistics: visits stores to price CPI items exactly to specification (same brand, size, terms, month after month), interviews households for the CPS, and documents substitutions and quality changes. Measured on collection completeness, accuracy audits, and response-rate maintenance.", "credentials": "Bachelor's preferred; federal training and confidentiality certification under CIPSEA/Title 13.", "socCode": "43-4111"}, {"title": "Escrow Officer / Title Examiner", "level": "Operational", "reportsTo": "Escrow Branch Manager / Title Operations Manager", "duties": "Examines chains of title in county records for liens and defects, clears requirements to issue title insurance, and as escrow officer holds funds, coordinates payoffs, balances closing statements to the penny, and records deeds — the transaction's neutral hub. Measured on closing accuracy, cycle time, and claims avoidance.", "credentials": "State escrow/title licensing where required; ALTA training; notary commission; no degree required though common.", "socCode": "23-2093"}]}}, {"id": "trade", "name": "Trade", "icon": "🛒", "tagline": "The distribution engine of civilization — moving goods from whoever makes them to whoever needs them, across the counter or across the ocean.", "view100k": {"role": "Trade is the domain that closes the gap between production and consumption: the wholesalers, retailers, importers, exporters, freight arrangers, and customs machinery that move goods from the point of manufacture to the point of use. Its economic logic is Smith's oldest theorem — the division of labor is limited by the extent of the market — and trade is what extends the market. A farmer in Iowa, a chipmaker in Taiwan, and a garment factory in Bangladesh are all viable only because a distribution apparatus exists to aggregate, break bulk, finance, transport, clear customs, merchandise, and finally hand their output to a customer. Trade performs the four classic utilities of marketing economics: place utility (getting goods where demanded), time utility (inventory buffering across seasons), possession utility (transferring title), and increasingly information utility (telling producers what to make via point-of-sale data).\n\nThe scale is civilizational. Global merchandise trade crossed $24 trillion annually, with services trade adding $7+ trillion; some 80-90% of it moves by sea in roughly 5,600 container ships and tens of thousands of bulk carriers. U.S. retail sales alone exceed $7 trillion a year and wholesale trade turns over more than $11 trillion; together NAICS sectors 42 and 44-45 employ over 21 million Americans — retail remains among the largest private employers on earth, with Walmart's 2.1 million associates the single largest private workforce in history. E-commerce, from a rounding error in 2000, now takes roughly 16% of U.S. retail and far more in China, collapsing the wholesale-retail distinction into direct fulfillment networks.\n\nThe historical arc runs from the Silk Road caravans and Hanseatic League through the Dutch and English East India Companies — the first joint-stock multinationals, born to trade — to the department store (Bon Marché, 1852), the self-service supermarket (Piggly Wiggly, 1916), the shipping container (McLean, 1956, which cut cargo handling costs ~97% and made globalization physically possible), the barcode (1974), Walmart's cross-docking logistics revolution, and Amazon's algorithmic everything-store. Institutionally, the GATT rounds and the WTO (1995) cut average tariffs from ~22% postwar to under 5%, engineering the greatest expansion of trade in history; the current chapter is defined by the partial reversal — tariff wars, export controls, friend-shoring, and the re-weaponization of customs — alongside the continued digitization of every transaction.", "interdependencies": "Trade is the circulatory system for physical goods and thus touches every producing and consuming domain: it distributes Agriculture's harvests and Industry's manufactures, supplies Medicine's pharmacies and hospital supply chains, provisions Defense through its contractor logistics, and stocks the shelves that feed Population. It depends existentially on Infrastructure — ports, roads, rail, warehouses — and on Energy for the bunker fuel, diesel, and electricity that move and store everything; a fuel shock is a trade shock. Finance provides its working capital, letters of credit, trade credit insurance, and the payment rails at every register; Economy sets the tariffs, exchange rates, and consumer confidence that determine volumes; Technology supplies the ERP, WMS, barcode/RFID, and e-commerce platforms that are now the industry's operating system, while Communication carries the marketing and the market data. Law and Governance define contract enforcement, customs regimes, product liability, and the trade agreements under which everything moves; Intelligence and Defense secure sea lanes and enforce export controls on dual-use goods; Environment increasingly constrains packaging, emissions (IMO shipping rules), and forced-labor-free sourcing; Education supplies supply-chain professionals; Science improves everything from cold chains to demand forecasting; and Culture determines what consumers want at all — retail is applied anthropology with a P&L.", "regulationModel": "Trade regulation operates at three altitudes. At the border, customs authorities — U.S. Customs and Border Protection foremost — enforce tariff classification (the Harmonized System), valuation, origin rules, quotas, and security regimes (CTPAT), while partner agencies (FDA, USDA, CPSC, Fish & Wildlife) hold their own admissibility jurisdiction over imports; export controls run through Commerce's Bureau of Industry and Security (EAR), State (ITAR), and Treasury's OFAC sanctions. Internationally, the WTO provides the tariff bindings, most-favored-nation rules, and (a currently hobbled) dispute system; the World Customs Organization harmonizes classification; and free-trade agreements like USMCA layer preferential regimes on top. In the domestic market, the FTC polices deceptive advertising, pricing claims, and antitrust (Robinson-Patman price discrimination applies distinctively to wholesale-retail relations), CPSC governs product safety, and states enforce sales tax (post-Wayfair, on remote sellers too), weights and measures, and licensing. Self-regulation is pervasive and load-bearing: the National Customs Brokers association and licensed customs brokers (a federally examined profession), GS1's barcode and data standards that make global commerce interoperable, the ICC's Incoterms defining who bears risk in every international sale, the BBB and NAD advertising self-regulation system, PCI-DSS at every register, and retailer-imposed supplier codes of conduct that function as private regulation of global factories."}, "view10k": {"overview": "The domain maps to NAICS Sector 42 (Wholesale Trade: 423 durable goods, 424 nondurable goods, 425 wholesale agents and electronic markets), Sectors 44-45 (Retail Trade, reorganized in NAICS 2022 so that store and online sellers of the same products classify together — e.g., 441 motor vehicle dealers, 445 food and beverage retailers, 455 general merchandise including department stores 455110 and warehouse clubs/supercenters 455211), and the commerce-logistics slice of Sectors 48-49 (488510 freight transportation arrangement — the forwarders and brokers, 492 couriers and last-mile delivery, 493 warehousing and storage). Structurally the industry organizes by position in the channel: merchant wholesalers who take title, agents and brokers who don't, retailers by format (specialty, general merchandise, grocery, dealer networks), direct-to-consumer e-commerce, and the intermediary professions — freight forwarders, customs brokers, trading companies — that arbitrage distance and regulation. Concentration is barbell-shaped: a handful of giants (Walmart, Amazon, Costco, McKesson) atop millions of small merchants.", "businessTypes": [{"name": "Merchant Wholesaler / Distributor", "naics": "423 (durable), 424 (nondurable)", "definition": "A firm that buys goods in bulk, takes title and inventory risk, and resells in smaller quantities to retailers, contractors, institutions, or other businesses — the classic middleman with a warehouse.", "operations": "Earns the wholesale spread (gross margins typically 15-30%, net margins 1-4%) by providing bulk-breaking, credit, delivery, and assortment; the business lives on inventory turns times margin (GMROI) and route density. Daily operations are purchasing against forecasts, warehouse pick-pack-ship, DSD route delivery, and accounts-receivable management of thousands of trade-credit accounts.", "regulation": "FTC/DOJ antitrust (Robinson-Patman on discriminatory pricing), DEA for drug distributors (suspicious-order monitoring), FDA food-safety rules (FSMA sanitary transport), state licensing for alcohol's mandated three-tier system. Self-regulates through NAW and vertical associations (HDA for pharma, NBWA for beer) and GS1 data standards.", "examples": "McKesson, Sysco, Grainger, Ferguson"}, {"name": "General Merchandise Retailer (Mass, Club, Department)", "naics": "455110, 455211", "definition": "A large-format retailer selling wide assortments across categories — discount mass merchants, warehouse clubs selling membership access to bulk goods, and department stores.", "operations": "Mass merchants earn thin margins (2-4% net) on enormous volume driven by price leadership and supply-chain efficiency; clubs invert the model, selling near cost and profiting on membership fees (Costco's fees approximate its entire operating profit). Core processes are category management, weekly ad planning, distribution-center replenishment, and labor scheduling across hundred-thousand-square-foot boxes.", "regulation": "FTC advertising and pricing rules, CPSC recalls, EEOC/NLRB and state wage-hour law for massive workforces, state sales-tax collection. Self-regulates through NRF standards, supplier codes of conduct with factory audits, and BBB/NAD advertising self-regulation.", "examples": "Walmart, Target, Costco, Macy's"}, {"name": "Grocery / Food & Beverage Retailer", "naics": "445110, 445230, 445320", "definition": "Supermarkets, convenience stores, and specialty food retailers selling perishable and packaged food — the highest-frequency retail format and the last mile of the food system.", "operations": "Net margins of 1-3% on relentless volume; profit levers are private label (25-35% margins versus national brands), shrink control, and increasingly retail media (selling ad space on shelf data). Operations run perishable ordering cycles measured in hours, cold-chain integrity, planogram compliance, and front-end labor at scale.", "regulation": "FDA (Food Code via state/local health inspectors, FSMA), USDA (meat rooms, SNAP retailer rules), TTB/state ABC boards for alcohol, weights-and-measures scanner-accuracy audits. Self-regulates through FMI food-safety programs, SQF/GFSI certification demanded of suppliers, and industry recall protocols.", "examples": "Kroger, Albertsons, Publix, 7-Eleven"}, {"name": "E-commerce & Marketplace Platform", "naics": "455110 / classified by product line (NAICS 2022 abolished the separate e-shopping code 454110); marketplaces also 519290", "definition": "A retailer or platform selling via the internet — either first-party (owning inventory) or as a marketplace intermediating millions of third-party sellers for commissions and services.", "operations": "First-party e-commerce earns retail margins minus fulfillment costs (the box, the pick, the last mile — typically 12-20% of sales); marketplaces earn 8-15% referral fees plus fulfillment, advertising, and subscription revenue, a structurally superior take-rate model. Operations are demand forecasting, fulfillment-center automation, dynamic pricing algorithms, and seller onboarding/fraud screening.", "regulation": "FTC (dark patterns, reviews, INFORM Consumers Act seller verification), CPSC (marketplace recall duties), state marketplace-facilitator sales-tax laws, EU DSA/DMA for gatekeeper platforms. Self-regulates through platform policies that function as private law for sellers, plus PCI-DSS and trust-and-safety operations.", "examples": "Amazon, Shopify (merchant infrastructure), eBay, Alibaba"}, {"name": "Specialty Retailer (Apparel, Electronics, Home, Auto Parts)", "naics": "448 (2022: 455-458 range), 449110, 441310, 444110", "definition": "A retailer focused on a single category where assortment depth, expertise, and brand define the value proposition — from fashion chains to home improvement to auto parts.", "operations": "Earns higher gross margins than general merchandise (apparel 50-60%) against fashion/obsolescence risk; the operating cycle is seasonal buying 6-9 months ahead, markdown management, and omnichannel fulfillment (buy-online-pickup-in-store). Store labor doubles as service and selling.", "regulation": "FTC (textile labeling, Made-in-USA claims, pricing), CPSC (flammability, children's products), customs on imported private label. Self-regulates through NRF and category associations, and brand-protection/anti-counterfeit programs.", "examples": "Home Depot, Best Buy, TJX, AutoZone, O'Reilly"}, {"name": "Motor Vehicle & Equipment Dealer", "naics": "441110, 441210, 423110", "definition": "A franchised or independent dealer retailing new and used vehicles, powersports, or heavy equipment, bundling sales with financing, insurance, parts, and service.", "operations": "New-vehicle gross margins are thin (~5%); the profit engine is fixed operations (parts and service at 45%+ margins) and F&I (finance and insurance income per vehicle); used-vehicle sourcing and floor-plan financing costs dominate working capital. Daily operations are inventory turn management, desking deals, service-bay throughput, and manufacturer program compliance.", "regulation": "State DMV dealer licensing and franchise laws (which legally protect dealers from manufacturers), FTC (Used Car Rule, CARS junk-fee rules), CFPB-adjacent fair-lending scrutiny of dealer markup, NHTSA recalls. Self-regulates through NADA standards and manufacturer facility/CSI requirements.", "examples": "AutoNation, Penske Automotive, CarMax (independent), local franchise dealers"}, {"name": "Import/Export Trading Company", "naics": "425120, 423/424 by product line", "definition": "A merchant that specializes in cross-border commerce — sourcing goods abroad for domestic resale or placing domestic production in foreign markets — bearing exchange-rate, transit, and counterparty risk across borders; the sogo shosha at grandest scale.", "operations": "Earns trading margins on owned cargoes and commissions on agented ones; profit lives in information asymmetry, financing capacity (issuing/receiving letters of credit), and logistics orchestration. Daily work is supplier development and audits, contract negotiation under Incoterms, FX hedging, and documentary compliance (bills of lading, certificates of origin).", "regulation": "CBP on the import side (classification, valuation, UFLPA forced-labor bans), BIS/OFAC/State on the export side (EAR, sanctions, ITAR), FTC country-of-origin rules. Self-regulates through ICC banking and Incoterms rules, trade-association arbitration, and CTPAT supply-chain-security certification.", "examples": "Mitsubishi Corporation, Li & Fung (sourcing), Marubeni, thousands of specialized traders"}, {"name": "Freight Forwarder & Customs Broker", "naics": "488510", "definition": "The travel agents of cargo: forwarders architect international shipments across carriers and modes without owning ships or planes; customs brokers — a federally licensed profession — clear goods through import formalities as agents of the importer.", "operations": "Forwarders buy carrier capacity wholesale and resell with margin plus fees for documentation, consolidation, and insurance; brokers charge per-entry fees for classification, valuation, and duty payment filed via CBP's ACE system. The daily rhythm is bookings, document packets (commercial invoice, packing list, B/L), entry filing, and exception management when cargo rolls or holds hit.", "regulation": "Customs brokers are licensed and disciplined by CBP (broker exam, 19 CFR 111); ocean forwarders/NVOCCs are licensed and bonded by the Federal Maritime Commission; IATA accredits air cargo agents; TSA regulates air-cargo security. Self-regulates through the NCBFAA code of conduct and WCA/forwarder network vetting.", "examples": "Kuehne+Nagel, DHL Global Forwarding, Expeditors, Flexport"}, {"name": "Third-Party Logistics (3PL) & Warehousing Provider", "naics": "493110, 493120, 488510, 541614", "definition": "A contract operator of the physical middle of commerce: warehouses, fulfillment centers, distribution networks, and transportation management run on behalf of shippers.", "operations": "Earns storage fees, per-unit handling fees, and management fees on cost-plus or transactional contracts; margins hinge on labor productivity (units per hour), space utilization, and automation payback. Operations are receiving and putaway, wave picking, parcel manifesting, returns processing, and peak-season labor surges.", "regulation": "OSHA (warehousing is injury-intensive; forklift certification under 29 CFR 1910.178), FDA/USDA registration for food-grade facilities, fire codes for high-pile storage, DOT/FMCSA where fleets operate. Self-regulates through IWLA standards, ISO 9001, and customer audit regimes.", "examples": "GXO Logistics, DHL Supply Chain, C.H. Robinson (brokerage), Lineage (cold chain)"}, {"name": "Courier, Express & Last-Mile Delivery", "naics": "492110, 492210", "definition": "Time-definite parcel networks — air and ground hubs, sortation, and doorstep delivery — that physically consummate e-commerce.", "operations": "A network-economics business: fixed hub-and-linehaul costs demand density, so pricing rewards volume and punishes residential dispersion (fuel and residential surcharges); revenue per piece versus cost per stop is the core equation. Operations are nightly sort waves, route optimization, and peak flexing to double volumes in December.", "regulation": "DOT/FAA (air networks), FMCSA (trucking hours-of-service), OSHA, state challenges over driver classification (employee versus independent contractor), postal law defining letter monopolies. Self-regulates through service-level guarantees and network operating standards.", "examples": "UPS, FedEx, Amazon Logistics, DHL Express"}, {"name": "Wholesale Agent / Broker & B2B Electronic Market", "naics": "425120, 425110", "definition": "Intermediaries who arrange sales between buyers and sellers for commission without ever taking title — manufacturers' reps, food brokers, commodity brokers, and B2B exchange platforms.", "operations": "Pure asset-light commission economics (2-6% typically): a manufacturers' rep aggregates non-competing lines and sells them to a territory's retailers or distributors; food brokers manage grocery headquarters relationships and in-store execution for CPG brands. The daily work is line reviews, trade-promotion management, and order facilitation.", "regulation": "UCC agency law and state rep-protection statutes govern commissions; PACA licensing for produce brokers (USDA); FTC brokerage provisions of Robinson-Patman. Self-regulates through MANA and industry codes plus contractual exclusivity norms.", "examples": "Acosta (food brokerage), Advantage Solutions, regional manufacturers' rep firms"}, {"name": "Convenience & Fuel Retail", "naics": "457110, 457120, 445131", "definition": "Small-format, high-frequency retail combining fuel, immediate-consumption food and beverage, and essentials — the most numerous retail format in America (~150,000 stores).", "operations": "Fuel draws traffic at cents-per-gallon margins while inside sales (foodservice at 50%+ margins, beverages, tobacco) generate profit; site-level economics turn on gallons, inside conversion, and shrink. Operations are daily price surveys and fuel drops, food-safety routines, and 24/7 staffing of small crews.", "regulation": "EPA underground storage tanks, state lottery/tobacco/alcohol licensing with sting enforcement, FDA tobacco rules, weights and measures on pumps. Self-regulates through NACS standards and franchise brand requirements.", "examples": "7-Eleven, Circle K, Wawa, Buc-ee's"}, {"name": "Duty-Free & Cross-Border Retail (incl. Foreign-Trade Zones)", "naics": "455999, 493190 (FTZ warehousing)", "definition": "Retail and warehousing that operates in customs limbo: duty-free shops selling to international travelers, and foreign-trade-zone operations where goods are stored or processed before duties apply.", "operations": "Duty-free arbitrages tax regimes at airports and borders under concession agreements with airport authorities (rents often 30-45% of sales); FTZ operators defer, reduce, or eliminate duties for manufacturers and distributors by inverting tariffs or re-exporting. Operations are bonded inventory control audited to unit-level accuracy.", "regulation": "CBP regulates bonded warehouses and duty-free (Class 9) stores and audits FTZs under the FTZ Board (Commerce); airport authorities impose concession terms. Self-regulates through the NAFTZ association and internal bonded-compliance programs.", "examples": "Dufry/Avolta, DFS Group, Duty Free Americas, hundreds of FTZ operators"}], "regulators": [{"name": "U.S. Customs and Border Protection (CBP)", "jurisdiction": "US", "role": "Administers the tariff at 328 ports of entry: classification, valuation, origin, duty collection (now hundreds of billions annually), forced-labor enforcement (UFLPA), broker licensing, and the CTPAT trusted-trader program."}, {"name": "Federal Trade Commission (FTC)", "jurisdiction": "US", "role": "Polices the demand side of trade: deceptive advertising and pricing, endorsements and fake reviews, Made-in-USA claims, franchise disclosure, and — with DOJ — retail and wholesale antitrust including merger review."}, {"name": "World Trade Organization (WTO)", "jurisdiction": "Global", "role": "The treaty architecture of world commerce: binds tariffs, enforces most-favored-nation and national-treatment rules, disciplines subsidies and dumping, and (via a currently impaired Appellate Body) adjudicates disputes among 160+ members."}, {"name": "Bureau of Industry and Security (BIS, Commerce) / OFAC (Treasury)", "jurisdiction": "US (extraterritorial reach)", "role": "BIS controls exports of dual-use goods and technology through the EAR and Entity List; OFAC administers sanctions programs — together they define who may trade what with whom, with penalties reaching billions."}, {"name": "Consumer Product Safety Commission (CPSC)", "jurisdiction": "US", "role": "Sets and enforces product-safety standards for 15,000 consumer product types, orders recalls, and holds importers, marketplaces, and retailers responsible for hazardous goods at the border and on the shelf."}, {"name": "Federal Maritime Commission (FMC)", "jurisdiction": "US", "role": "Regulates ocean commerce intermediaries: licenses NVOCCs and ocean freight forwarders, polices carrier practices (demurrage and detention rules under OSRA 2022), and reviews carrier alliances."}, {"name": "World Customs Organization (WCO) / International Chamber of Commerce (ICC)", "jurisdiction": "Global", "role": "The WCO maintains the Harmonized System nomenclature used by 200+ customs administrations; the ICC — a private body — writes Incoterms and the UCP 600 letter-of-credit rules, the self-made law under which most international sales actually operate."}, {"name": "National Retail Federation (NRF) / GS1", "jurisdiction": "US/Global (industry associations)", "role": "NRF is retail's advocacy and standards voice (loss-prevention, ARTS data standards); GS1 is the self-regulatory standards body whose GTIN barcodes, GLNs, and EDI/EPCIS standards are the shared language making global commerce machine-readable."}]}, "groundView": {"orgModel": "A major retail or distribution company is governed by a conventional public-company board, but its executive architecture reflects the industry's twin engines: merchandising and supply chain. Under the CEO sit a Chief Merchandising Officer commanding buying organizations arranged by category (GMMs over DMMs over buyers), a Chief Supply Chain Officer running distribution centers, transportation, and inventory flow, a Chief Stores/Operations Officer commanding the field hierarchy (regional VPs → district managers → store managers), plus digital/e-commerce, marketing, real estate (site selection is destiny in retail), and the standard staff functions. The defining structural fact is span: a handful of headquarters decisions — an assortment reset, a pricing change — propagate to thousands of stores and hundreds of thousands of hourly associates within days, so the org runs on standard operating procedures, planograms, and weekly cadences (the Monday sales flash, the seasonal line review). Wholesalers and logistics firms mirror this with sales territories and facility networks in place of store fleets; trading companies organize by product desk and geography.", "positions": [{"title": "Board Director (Retail/Distribution)", "level": "Governance", "reportsTo": "Shareholders", "duties": "Oversees strategy in a low-margin, high-velocity business: approves capital allocation between store fleets, supply chain automation, and digital; monitors cybersecurity and supply-chain risk; governs CEO succession. Measured on TSR, comparable-sales trajectory, and capital returns.", "credentials": "Former retail/CPG executives, supply-chain and digital leaders; audit-committee financial experts per SOX.", "socCode": "11-1011"}, {"title": "Chief Executive Officer", "level": "Executive", "reportsTo": "Board of Directors", "duties": "Sets the merchandising identity and price position of the enterprise, allocates capital across stores, distribution, and digital, and personally walks stores and DCs — retail CEOs manage by store visit. Measured on comparable-store sales, gross margin, inventory turns, and market share.", "credentials": "Typically risen through merchandising or operations; MBA common but store-floor pedigree respected; 25+ years in the trade.", "socCode": "11-1011"}, {"title": "Chief Merchandising Officer", "level": "Executive", "reportsTo": "CEO", "duties": "Owns what the company sells and at what price: category strategy, vendor negotiations at the top of the funnel, private-label development, and the markdown budget. Chairs seasonal line reviews. Measured on gross margin dollars, sell-through, and inventory freshness.", "credentials": "20 years up the buying ladder (buyer → DMM → GMM); category P&L mastery; negotiation as core craft.", "socCode": "11-2021"}, {"title": "Chief Supply Chain Officer", "level": "Executive", "reportsTo": "CEO / COO", "duties": "Runs the physical network: DC footprint and automation strategy, transportation procurement (ocean, linehaul, parcel), inventory positioning, and service levels to stores and doorsteps. Owns the peak-season plan. Measured on in-stock rates, cost per unit shipped, inventory days, and on-time delivery.", "credentials": "BS/MS in supply chain or industrial engineering; APICS/ASCM CSCP or CPIM; 20 years across DCs and transportation.", "socCode": "11-3071"}, {"title": "VP International Trade & Customs Compliance", "level": "Executive", "reportsTo": "CSCO / General Counsel", "duties": "Owns the border: tariff-classification database, valuation and origin programs, duty-mitigation strategies (FTZs, drawback, FTA qualification), export-control screening, and the relationship with CBP including audits. In a tariff-war era this role moves the P&L materially. Measured on duty spend, penalty avoidance, and clearance cycle times.", "credentials": "Licensed Customs Broker (CBP exam) or JD; CTPAT and Importer Self-Assessment program mastery; 15+ years in trade compliance.", "socCode": "13-1041"}, {"title": "Regional Vice President / Director of Stores", "level": "Management", "reportsTo": "Chief Stores Officer", "duties": "Commands 80-150 stores through district managers: cascades merchandising and labor programs, controls shrink and payroll percentages, develops the store-manager bench, and audits execution on relentless store-visit circuits. Measured on regional comp sales, payroll leverage, shrink, and engagement scores.", "credentials": "Risen from store management; bachelor's typical; 15+ years multi-unit leadership.", "socCode": "11-1021"}, {"title": "Store Manager (Large-Format)", "level": "Management", "reportsTo": "District Manager", "duties": "Runs a $30-150M retail P&L with 150-400 associates: hires and schedules the crew, owns presentation standards and in-stock execution, manages shrink
