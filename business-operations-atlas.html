me/sales taxes, federal grants-in-aid (roughly a third of state budgets in the U.S.), and fees; operates through a governor's cabinet of departments (transportation, education, health, corrections) and quasi-independent boards. Core processes are biennial/annual budgeting, program delivery, professional licensing, and pass-through administration of federal programs like Medicaid.", "regulation": "Bound by its state constitution and federal supremacy; audited by elected or appointed state auditors, overseen by the legislature, and disciplined by bond-market credit ratings. Compacts and associations (NGA, NCSL) coordinate horizontal self-governance.", "examples": "State of Texas; Commonwealth of Massachusetts; Government of Ontario; Free State of Bavaria"}, {"name": "Municipal / County Government", "naics": "921110, 921190", "definition": "General-purpose local government delivering the most citizen-proximate services — policing, fire, zoning, sanitation, parks, streets — under a state-granted charter.", "operations": "Funded chiefly by property taxes, local sales taxes, utility fees, state transfers, and municipal bond issuance; governed by an elected council with either an elected 'strong mayor' or an appointed professional city manager (council-manager form covers most U.S. cities). Daily operations are service delivery, land-use permitting, code enforcement, and capital-improvement programs.", "regulation": "Creatures of state law (Dillon's Rule or home-rule charters), audited by state auditors and independent CPA firms under GASB standards, with open-meeting and public-records laws enforcing transparency. ICMA's Code of Ethics binds professional managers; bond covenants and rating agencies impose fiscal discipline.", "examples": "City of Phoenix; Cook County, Illinois; City of Charlotte; Miami-Dade County"}, {"name": "Independent Regulatory Agency / Commission", "naics": "926110-926150", "definition": "A statutorily insulated body (often a multi-member bipartisan commission with fixed terms) that licenses, sets rates, adjudicates, and polices a specific market or activity.", "operations": "Funded by appropriations or industry fees/assessments (e.g., the SEC and FCC are substantially fee-funded); operates through notice-and-comment rulemaking, licensing dockets, examinations and inspections, enforcement actions, and administrative adjudication before ALJs. Staffed by economists, attorneys, and examiners; output measured in rules issued, cases resolved, and market integrity.", "regulation": "Subject to APA procedure, judicial review (Chevron/Loper Bright doctrine era), congressional oversight and the Congressional Review Act, OIRA review for executive agencies, and GAO/IG audit. Ethics recusal rules and ex parte contact bans govern commissioners.", "examples": "Federal Communications Commission; Federal Energy Regulatory Commission; state Public Utility Commissions; UK Ofcom"}, {"name": "Government Services Contractor", "naics": "541611, 541512, 541330, 561210", "definition": "A private firm whose principal customer is the state, selling professional services, IT modernization, engineering, logistics, and facilities operation under public contracts.", "operations": "Revenue flows from competitively awarded contracts under the FAR (fixed-price, cost-reimbursable, time-and-materials) and multi-award vehicles (GSA Schedules, GWACs, IDIQs); the business model runs on capture management, proposal shops, billable utilization, and past-performance ratings (CPARS). Operations center on program delivery against statements of work, earned-value management, and audit-ready cost accounting.", "regulation": "Policed by contracting officers, agency IGs, GAO bid-protest jurisdiction, the SBA (small-business set-asides), and suspension/debarment officials; cost-type work is audited under CAS. Industry self-regulates through the Professional Services Council and mandatory contractor codes of business ethics required by FAR 52.203-13.", "examples": "Booz Allen Hamilton; Leidos; Accenture Federal Services; Maximus"}, {"name": "Lobbying / Government Relations Firm", "naics": "541820, 541110 (law-firm practices)", "definition": "A firm that represents corporate, trade-association, and nonprofit clients before legislatures and agencies — supplying access, intelligence, coalition-building, and advocacy.", "operations": "Funded by monthly client retainers and project fees (U.S. federal lobbying disclosures alone total roughly $4+ billion per year); daily work is monitoring bills and dockets, drafting testimony and amendments, arranging meetings with members and staff, and running grassroots and PAC strategies. Success is measured in legislative and regulatory outcomes and client retention.", "regulation": "Registered and disclosed under the Lobbying Disclosure Act (quarterly LD-2 filings) and FARA for foreign principals (DOJ enforcement); state lobbying commissions impose parallel regimes. Self-regulation runs through firm ethics policies, the revolving-door cooling-off statutes, and bodies like the National Institute for Lobbying & Ethics code of conduct.", "examples": "Brownstein Hyatt Farber Schreck; Akin Gump; BGR Group; Holland & Knight public policy group"}, {"name": "Think Tank / Public Policy Research Institute", "naics": "541720, 813319", "definition": "A nonprofit (occasionally for-profit) research organization producing policy analysis, evaluation, and ideas intended to shape legislation, regulation, and public opinion.", "operations": "Funded by philanthropic grants, endowment income, government research contracts, and corporate sponsorships; operates through resident scholars, commissioned studies, convenings, and testimony. The product is credibility: peer-reviewable reports, congressional testimony, and media placement, with influence measured by citations and policy uptake.", "regulation": "Most are 501(c)(3) entities overseen by the IRS (lobbying limited by the substantial-part or 501(h) tests) and state charity regulators; boards of trustees govern internally. Self-regulation includes funder-transparency norms, research-integrity policies, and disclosure standards promoted by groups like Transparify.", "examples": "Brookings Institution; RAND Corporation; Heritage Foundation; Urban Institute"}, {"name": "Intergovernmental Organization (IGO)", "naics": "928120", "definition": "A treaty-based organization of member states pooling sovereignty to manage transnational problems — peace and security, development finance, health, trade, standards.", "operations": "Funded by assessed contributions (scaled to member GNI), voluntary contributions, and, for the development banks, callable capital and bond issuance on private markets; governed by plenary assemblies, executive boards, and an international civil-service secretariat. Operations span peacekeeping deployment, program country offices, treaty administration, and normative standard-setting.", "regulation": "Governed by their charters and member-state organs (e.g., UN General Assembly, Security Council, the Fifth Committee for budget); audited by boards of auditors, the Joint Inspection Unit, and internal oversight offices (OIOS); enjoy functional immunities under headquarters agreements while answerable to member states and donor accountability frameworks (MOPAN reviews).", "examples": "United Nations; World Bank Group; OECD; World Health Organization"}, {"name": "Advocacy NGO / Civil Society Organization", "naics": "813311, 813312, 813319", "definition": "A nonprofit organized around a cause — human rights, environment, transparency, civil liberties — that monitors power, litigates, mobilizes members, and campaigns for policy change.", "operations": "Funded by individual donations, membership dues, foundation grants, and bequests; operates through research and documentation, strategic litigation, public campaigns, and legislative advocacy (within 501(c)(3) limits, or unrestricted via affiliated 501(c)(4) arms). Measures of success are policy wins, membership growth, and watchdog impact.", "regulation": "IRS exempt-organization rules (Form 990 disclosure), state attorney-general charity bureaus, and, for cross-border work, FARA and foreign-funding laws; boards of directors carry fiduciary duties. Sector self-regulation includes Independent Sector's Principles for Good Governance, BBB Wise Giving Alliance standards, and InterAction standards for international NGOs.", "examples": "ACLU; Transparency International; Sierra Club; Human Rights Watch"}, {"name": "Grantmaking Foundation", "naics": "813211", "definition": "An endowed philanthropic entity (private foundation or community foundation) that finances the nonprofit and policy ecosystem through grants rather than direct operations.", "operations": "Funded by a donor's endowment invested for perpetuity; U.S. private foundations must pay out roughly 5% of assets annually and pay an excise tax on net investment income. Core processes are program strategy, grant due diligence, disbursement, and impact evaluation, run by program officers under a board of trustees.", "regulation": "Regulated by the IRS under IRC 4940-4945 (self-dealing, payout, jeopardizing investments, taxable expenditures) and state charity officials; governed by trustee fiduciary law. Self-regulatory norms come from the Council on Foundations' ethical principles and regional grantmaker associations.", "examples": "Ford Foundation; Bill & Melinda Gates Foundation; Silicon Valley Community Foundation; Open Society Foundations"}, {"name": "Political Party / Campaign Organization", "naics": "813940", "definition": "The electoral enterprise: national and state party committees, candidate campaign committees, and PACs/super PACs that recruit candidates, raise money, and contest elections.", "operations": "Funded by regulated individual contributions, PAC transfers, and (for super PACs) unlimited independent-expenditure money; operations are voter-file analytics, fundraising (small-dollar digital and major-donor programs), field organizing, media buying, and compliance reporting. The cycle-driven business scales up to thousands of staff in election years and contracts heavily with consultancies.", "regulation": "Federal Election Commission enforcement of FECA (contribution limits, disclosure, coordination rules), state election boards, and IRS treatment of 527 organizations; parties self-govern through national committee rules, convention charters, and candidate-selection bylaws.", "examples": "Democratic National Committee; Republican National Committee; ActBlue/WinRed (conduit platforms); major super PACs such as Senate Leadership Fund"}, {"name": "Election Administration & Elections-Infrastructure Vendor", "naics": "921190 (public administration); 334118, 541519 (vendors)", "definition": "The public offices that register voters and conduct elections, plus the small certified-vendor industry supplying voting machines, tabulators, e-pollbooks, and results software.", "operations": "Public side funded by county/state budgets plus periodic federal HAVA grants; runs voter registration databases, ballot design, poll-worker recruitment (600,000+ per U.S. federal election), early/mail voting logistics, tabulation, canvass, and audits. Vendors sell hardware, software licenses, and support contracts to roughly 8,000 U.S. election jurisdictions.", "regulation": "Overseen by the U.S. Election Assistance Commission (voluntary voting-system guidelines and testing/certification), state certification programs, DOJ Civil Rights Division (Voting Rights Act), and CISA as critical-infrastructure sector risk manager; canvass boards, recounts, and risk-limiting audits provide procedural self-checks.", "examples": "Los Angeles County Registrar-Recorder; Maricopa County Elections Department; Election Systems & Software (ES&S); Hart InterCivic"}], "regulators": [{"name": "U.S. Government Accountability Office (GAO)", "jurisdiction": "US (federal)", "role": "Congress's supreme audit institution: audits agency finances and program performance, issues legal decisions on appropriations law, and adjudicates federal bid protests; its reports drive legislative oversight and recoveries."}, {"name": "Office of Management and Budget (OMB)", "jurisdiction": "US (executive branch)", "role": "Assembles the President's budget, apportions appropriated funds, sets government-wide management and procurement policy (OFPP), and reviews significant regulations through OIRA before promulgation."}, {"name": "U.S. Office of Government Ethics (OGE) and agency Inspectors General (CIGIE)", "jurisdiction": "US (federal)", "role": "OGE administers executive-branch ethics rules (financial disclosure, conflicts, gifts); the 70+ statutory IGs, coordinated through CIGIE, investigate fraud, waste, and abuse inside their agencies with independent reporting lines to Congress."}, {"name": "Federal Election Commission (FEC) and U.S. Election Assistance Commission (EAC)", "jurisdiction": "US", "role": "The FEC enforces campaign-finance law (contribution limits, disclosure, coordination); the EAC certifies voting systems, distributes HAVA funds, and issues election-administration guidance to states."}, {"name": "DOJ FARA Unit and Lobbying Disclosure regime (Clerk of the House / Secretary of the Senate)", "jurisdiction": "US", "role": "Enforces registration and disclosure by agents of foreign principals (FARA) and administers quarterly lobbying disclosures under the LDA, making paid influence on government legally visible."}, {"name": "IRS Tax Exempt & Government Entities Division and State Attorneys General", "jurisdiction": "US (federal and state)", "role": "Determine and police tax-exempt status of foundations, think tanks, NGOs, and political organizations (Forms 990/990-PF, lobbying and campaign-intervention limits); state AG charity bureaus enforce fiduciary duties and solicitation laws."}, {"name": "International City/County Management Association (ICMA)", "jurisdiction": "Global (professional/self-regulatory)", "role": "The professional body for appointed local-government managers; its 12-tenet Code of Ethics is actively enforced through peer review and censure/expulsion, and its ICMA-CM credential sets the management standard for the council-manager form."}, {"name": "OECD Public Governance Directorate / UN and INTOSAI frameworks", "jurisdiction": "Global", "role": "Set and peer-review international norms — open government, anti-bribery (OECD Convention), budget transparency, and INTOSAI auditing standards (ISSAIs) adopted by national supreme audit institutions."}]}, "groundView": {"orgModel": "The archetypal governance organization is a chartered hierarchy under dual control: an elected or appointed governing body (council, legislature, board of trustees) that sets policy and holds the purse, and an executive apparatus that administers. In a council-manager city — the modal professional form — the elected council enacts ordinances and adopts the budget; a professionally credentialed city manager serves at its pleasure and directs department heads (police, fire, public works, finance, planning, parks), each running divisions staffed by civil-service professionals and front-line workers. Staff functions (budget office, HR, city attorney, city clerk, IT, procurement) cut horizontally across line departments. Federal agencies replicate the pattern at scale: a Senate-confirmed secretary and political appointees atop a career Senior Executive Service, program offices, and field/regional structures, with independent watchdogs (IG, ethics official, CFO under the CFO Act) embedded by statute. Nonprofits and IGOs mirror it with boards, secretariats, and program units. The constant is separation of the deciding body from the administering body, layered merit-based staffing, and statutory transparency obligations that no private firm carries.", "positions": [{"title": "City Council Member / Legislator", "level": "Governance", "reportsTo": "The electorate (constitutionally independent; presided over by a council president or speaker)", "duties": "Enacts ordinances and statutes, adopts the budget and tax levies, confirms senior appointments, and conducts oversight hearings. Spends heavy time on committee work, constituent casework, and public meetings; measured by legislative record, district service, and reelection.", "credentials": "Election under the jurisdiction's charter; typically a bachelor's degree, often law, business, or public affairs background; state-mandated ethics and open-meetings training", "socCode": "11-1031"}, {"title": "Board Chair, Nonprofit / Foundation", "level": "Governance", "reportsTo": "The full board of directors (elected by members or self-perpetuating per bylaws)", "duties": "Leads the board in fiduciary oversight of mission, strategy, CEO hiring/evaluation, and financial integrity; chairs meetings, signs off on Form 990 and audit, and leads major-donor relationships. Measured by organizational health, clean audits, and CEO succession success.", "credentials": "Senior executive or professional standing; governance training (BoardSource or equivalent); duty-of-care/loyalty fiduciary obligations under state nonprofit law", "socCode": "11-1011"}, {"title": "Mayor / Governor (Elected Chief Executive)", "level": "Executive", "reportsTo": "The electorate (checked by the council/legislature and courts)", "duties": "Sets the policy agenda, proposes the budget, signs or vetoes legislation, appoints department heads, and commands emergency response. The public face of the jurisdiction in crises, intergovernmental negotiation, and economic development; measured by service outcomes, fiscal condition, and approval at the ballot.", "credentials": "Election per constitution/charter; commonly JD, MPA, or business background; no license required — legitimacy is the credential", "socCode": "11-1011"}, {"title": "City Manager / Chief Administrative Officer", "level": "Executive", "reportsTo": "City Council", "duties": "Runs the entire municipal enterprise day to day: hires and directs department heads, prepares and executes the budget, negotiates labor contracts, and delivers council policy. Owns operational performance across police, fire, utilities, and public works; measured by service benchmarks, bond rating, and council confidence.", "credentials": "Master of Public Administration (MPA) typical; ICMA Credentialed Manager (ICMA-CM) designation; 10-20 years of progressive local-government management", "socCode": "11-1011"}, {"title": "Agency Secretary / Administrator (Cabinet-level)", "level": "Executive", "reportsTo": "President / Governor (Senate or legislative confirmation)", "duties": "Translates the elected executive's agenda into departmental strategy, regulation, and budget requests; testifies before legislative committees; owns the department's statutory missions and crisis response. Measured by program outcomes, audit findings, and regulatory agenda delivery.", "credentials": "Presidential/gubernatorial appointment with confirmation; typically advanced degree (JD, PhD, MPA) and senior leadership record; financial-disclosure and ethics-agreement compliance", "socCode": "11-1011"}, {"title": "Chief of Staff", "level": "Executive", "reportsTo": "Elected executive or agency head", "duties": "Controls the principal's time, information flow, and decision process; brokers among department heads, legislators, and external stakeholders; enforces follow-through on decisions. Often manages the political appointee corps and crisis communications; measured by the principal's agenda advancing without avoidable fires.", "credentials": "Bachelor's minimum, often JD/MPA/MBA; deep political-operations or senior-management experience; security clearance where applicable", "socCode": "11-1021"}, {"title": "Budget Director", "level": "Management", "reportsTo": "City Manager / Agency head / CFO", "duties": "Builds the annual (or biennial) budget: revenue forecasting, department target-setting, hearings, and the adopted document; monitors execution through allotments, variance reports, and mid-year adjustments. Owns fiscal-note analysis on proposed legislation; measured by forecast accuracy, structural balance, and reserve compliance.", "credentials": "MPA/MBA or economics degree; GFOA Certified Public Finance Officer (CPFO) or CGFM common; mastery of fund accounting and GASB standards", "socCode": "11-3031"}, {"title": "Program Manager (Public Program / Grant Program)", "level": "Management", "reportsTo": "Bureau/Division Director", "duties": "Runs a statutory program end to end — eligibility rules, service delivery or grant cycles, subrecipient monitoring, and performance reporting under GPRA-type frameworks. Manages staff and contractor teams; measured against program performance metrics, improper-payment rates, and audit results.", "credentials": "Bachelor's/MPA; federal PM certification (FAC-P/PM) or PMP; knowledge of 2 CFR 200 Uniform Guidance for grant programs", "socCode": "11-9199"}, {"title": "Director of Government Relations / Lobbyist", "level": "Management", "reportsTo": "Firm partner or client organization's head of external affairs", "duties": "Monitors legislation and rulemakings affecting clients, builds relationships with members and staff, drafts amendments and testimony, and orchestrates coalition and PAC strategy. Files quarterly LD-2 disclosures; measured by legislative outcomes and client retention.", "credentials": "JD or MPP common; Hill or agency experience is the real credential; LDA/FARA registration and ethics-rule fluency; certificates such as the Professional Lobbying Certificate (PLC)", "socCode": "11-2032"}, {"title": "Policy Analyst", "level": "Professional", "reportsTo": "Program Manager / Research Director", "duties": "Researches problems, models options with cost-benefit and fiscal-impact analysis, drafts white papers, regulatory-impact analyses, and decision memos. Briefs leadership and legislative staff; measured by analytical rigor, timeliness, and uptake of recommendations.", "credentials": "MPP/MPA/economics master's or PhD; quantitative methods (Stata/R), benefit-cost analysis; subject-matter depth in the program area", "socCode": "19-3094"}, {"title": "Contracting Officer (CO)", "level": "Professional", "reportsTo": "Head of Contracting Activity / Procurement Director", "duties": "The only official with a warrant to bind the government contractually: plans acquisitions, issues solicitations, evaluates proposals, negotiates and awards contracts, and administers modifications, disputes, and terminations under the FAR. Measured by competition rates, protest sustainment record, and small-business goals.", "credentials": "Bachelor's plus 24 business-credit hours (federal 1102 series); FAC-C (Professional) / DAWIA contracting certification; warrant issued at defined dollar thresholds", "socCode": "13-1023"}, {"title": "Grants Management Specialist", "level": "Professional", "reportsTo": "Grants Officer / Program Manager", "duties": "Administers the grant lifecycle: NOFO drafting, application review panels, risk assessment of recipients, award terms, drawdown monitoring, and closeout under 2 CFR 200. Flags single-audit findings and enforces allowable-cost rules; measured by on-time awards and monitoring compliance.", "credentials": "Bachelor's; Certified Grants Management Specialist (CGMS) or NGMA training; Uniform Guidance expertise", "socCode": "13-1199"}, {"title": "Auditor / Inspector General Analyst", "level": "Professional", "reportsTo": "Inspector General / State or City Auditor", "duties": "Conducts financial and performance audits under GAGAS (Yellow Book), investigates fraud and whistleblower referrals, and issues findings with recommendations tracked to closure. Independence is structural — reporting lines bypass management; measured by questioned costs, funds recovered, and recommendation implementation rates.", "credentials": "Accounting or public-administration degree; CPA, CIA, CGAP, or CFE certification; continuing education required under Government Auditing Standards", "socCode": "13-2011"}, {"title": "Foreign Service Officer / IGO Program Officer", "level": "Professional", "reportsTo": "Ambassador / Country Director / Division Chief", "duties": "Represents the state or organization abroad: political and economic reporting, visa adjudication, development-program management, treaty negotiation support. Rotates posts every 2-4 years; measured through structured promotion boards on reporting quality and program results.", "credentials": "Bachelor's minimum (master's in international affairs common); Foreign Service Officer Test and oral assessment; security clearance; language proficiency scores (FSI scale)", "socCode": "19-3094"}, {"title": "City Clerk", "level": "Operational", "reportsTo": "City Council (or City Manager, by charter)", "duties": "The jurisdiction's official record-keeper: prepares council agendas and minutes, attests ordinances and resolutions, administers oaths, manages public-records requests, and often runs local elections and business licensing. The compliance hinge for open-meetings and records law; measured by legal sufficiency and records responsiveness.", "credentials": "Associate/bachelor's; Certified Municipal Clerk (CMC) and Master Municipal Clerk (MMC) through IIMC; notary commission typical", "socCode": "43-4031"}, {"title": "Elections Administrator / Registrar", "level": "Operational", "reportsTo": "County commission / Secretary of State / City Clerk", "duties": "Maintains the voter roll, designs and proofs ballots, certifies equipment logic-and-accuracy tests, recruits and trains poll workers, runs early/mail/Election-Day voting, and manages the canvass, audits, and recounts. Measured by accuracy, wait times, chain-of-custody integrity, and successful certification.", "credentials": "Bachelor's typical; Certified Elections/Registration Administrator (CERA) via the Election Center; state certification programs; increasingly, security training with CISA", "socCode": "43-4031"}, {"title": "Permit Technician / Licensing Clerk", "level": "Operational", "reportsTo": "Permitting / Community Development Manager", "duties": "The counter and portal face of the regulatory state: intakes building, business, and special-event applications, checks completeness against code, routes plan reviews, collects fees, and issues permits and licenses. Measured by cycle time, error rates, and customer-service scores.", "credentials": "High school plus; ICC Permit Technician certification; knowledge of local zoning and building-code administration", "socCode": "43-4031"}, {"title": "Constituent Services Representative / Caseworker", "level": "Operational", "reportsTo": "District Director / Chief of Staff (legislative office)", "duties": "Handles citizen requests to elected officials: untangles benefit denials (Social Security, VA, immigration cases) with agency liaisons, logs casework in CRM systems, and surfaces systemic issues to the legislator. Measured by case resolution rates and constituent satisfaction.", "credentials": "Bachelor's typical; privacy-act release handling; bilingual skills highly valued; no license required", "socCode": "21-1093"}]}}, {"id": "defense", "name": "Defense", "icon": "🛡️", "tagline": "The organized capacity of societies to deter, fight, and secure — from standing armies to defense primes, private security, and cyber defense.", "view100k": {"role": "Defense is civilization's insurance policy against organized violence: the standing armed services, ministries, and mobilization systems by which states deter aggression, and the industrial and services complex that arms, equips, and supports them. It exists because security is the purest public good — non-excludable, non-rival, and impossible to supply through voluntary exchange — which is why every durable polity from the Assyrian empire to the Westphalian state has organized it as a sovereign monopoly. In economic terms the domain is enormous: global military expenditure passed $2.4 trillion by the mid-2020s, with the United States alone budgeting over $850 billion annually — roughly 3% of U.S. GDP and about 12% of federal spending. The U.S. Department of Defense is the largest employer on earth, with about 1.3 million active-duty personnel, 750,000+ civilians, and 800,000 reserve/National Guard members; the private defense industrial base adds well over a million more across aerospace, shipbuilding, munitions, electronics, and services, and the adjacent private-security industry (guards, systems, investigations) employs another million-plus in the U.S. under NAICS 5616.\n\nThe historical arc runs from citizen levies and mercenary companies, through Napoleonic mass conscription and the industrialized total wars of the 20th century, to the post-1945 permanent military-industrial establishment President Eisenhower named in 1961. The Cold War built the modern architecture: a unified Department of Defense (National Security Act of 1947), alliance structures (NATO, 1949), a concentrated prime-contractor oligopoly consolidated after the 1993 'Last Supper' into five U.S. giants, and an arms-control treaty lattice (NPT, CWC, ITAR/EAR export controls). Since the 1990s the domain has expanded into two new markets: privatized military and security services (logistics, base operations, protective details) and cyber defense, where the front line runs through corporate networks and a commercial cybersecurity industry now worth $200+ billion globally stands alongside uniformed cyber commands.\n\nStructurally the domain pairs the most hierarchical human organizations in existence — militaries with unbroken chains of command, codified in law — with an unusual monopsony market in which one buyer (the state) faces few sellers, prices are set by regulated cost accounting rather than open markets, and demand is driven by threat perception and politics rather than consumer preference. Veterans' services close the loop: the U.S. Department of Veterans Affairs, with a budget above $300 billion and over 400,000 employees, is itself one of the largest health and benefits enterprises in the world.", "interdependencies": "Defense draws on nearly every other domain and shapes them in return. It consumes vast Energy (the DoD is the largest single institutional fuel consumer in the U.S.) and depends on Finance for appropriations, war bonds, and the defense-sector capital markets; it is a deliberate instrument of the Economy through industrial policy and of Trade through export controls, arms sales (FMS), and sanctions enforcement. Agriculture and Medicine sustain forces (rations, military health systems); Infrastructure and Industry supply bases, shipyards, and arsenals; Technology and Science are symbiotic — radar, jet engines, nuclear power, GPS, and the internet all emerged from defense R&D (DARPA), and defense procurement still anchors national semiconductor and space industries. Communication provides command-and-control networks and contested information space; Education feeds it through academies, ROTC, and STEM pipelines; Population determines recruitment pools and conscription policy; Environment constrains basing and is increasingly framed as a threat multiplier. Governance is its master — civilian control is the constitutional bedrock — while Intelligence is its sensory system, Law bounds it through the UCMJ, the law of armed conflict, and export-control statutes, and Culture and Religion shape warrior ethos, public support, and the chaplaincies embedded within it.", "regulationModel": "Defense operates under the strictest layered oversight of any domain because it wields lethal force with public money. Constitutionally, civilian control runs from the elected executive (commander-in-chief) through a civilian secretary of defense, with the legislature holding the powers to declare war, raise armies, and appropriate — exercised annually through the NDAA and defense appropriations acts and policed by the Armed Services and Appropriations committees, GAO audits, and the DoD Inspector General. The acquisition system is governed by the FAR/DFARS, audited by the Defense Contract Audit Agency (DCAA) and administered by the Defense Contract Management Agency (DCMA), with Cost Accounting Standards and Truthful Cost or Pricing Data (TINA) statutes disciplining pricing. Arms transfers are controlled by the State Department's DDTC under ITAR and Commerce's BIS under the EAR, with congressional notification for major sales; international law adds the Geneva Conventions, the Arms Trade Treaty, and nonproliferation regimes (NPT/IAEA, CWC/OPCW, MTCR, Wassenaar). Personnel security and classified industry are governed by DCSA under the NISPOM (32 CFR Part 117). Self-regulation includes military professional ethics codified in the UCMJ and service core values, industry codes such as the Defense Industry Initiative on Business Ethics and Conduct, and private-security standards (ASIS International, the ICoCA code for private security providers, ANSI/ASIS PSC.1)."}, "view10k": {"overview": "The public core sits in NAICS 928110 (National Security) — the armed services, defense ministries, and combat-support agencies — and 923140 (Administration of Veterans' Affairs). Around it ranges the defense industrial base: 336411 (aircraft manufacturing), 336414 (guided missiles and space vehicles), 336611 (shipbuilding), 336992 (military armored vehicles), 332992-332994 (ammunition and arms), and 334511 (search, detection, navigation, and guidance instruments — the C4ISR electronics heart). The services layer includes 541330/541715 (defense engineering and R&D, including FFRDCs), 541512/541519 (defense IT and cybersecurity), and 561210 (base operations and facilities support). The private-security industry lives in 5616 — 561612 (guard and patrol services), 561611 (investigation), 561621 (security systems) — and veterans' service organizations in 813410. The economics are monopsonistic on the government side (one buyer, cost-regulated contracts, decades-long programs of record) and conventionally competitive in commercial security and cybersecurity, where firms sell to enterprises as well as governments.", "businessTypes": [{"name": "National Armed Service (Military Branch)", "naics": "928110", "definition": "A uniformed fighting service — army, navy, air force, marine corps, space force — that organizes, trains, and equips forces to deter and win armed conflict under civilian command.", "operations": "Funded entirely by legislative appropriation (personnel, O&M, procurement, RDT&E accounts); operates through a force-generation cycle of recruiting, basic and advanced training, unit readiness workups, and deployment rotations, executed by commands echeloned from headquarters to squads. Day-to-day life is training, maintenance, exercises, and standing watch, with combatant commands employing forces the services provide.", "regulation": "Governed by Title 10 U.S.C. and the UCMJ, overseen by the civilian service secretary, the Secretary of Defense, congressional armed services committees, GAO, and the DoD IG; internally self-regulated through inspectors general, courts-martial, promotion boards, and codified service values and the Law of Armed Conflict training regime.", "examples": "U.S. Army; U.S. Navy; Royal Air Force; U.S. Space Force"}, {"name": "Defense Ministry / Departmental Civilian Agency", "naics": "928110", "definition": "The civilian headquarters and combat-support agencies (logistics, contract management, audit, security clearances) that direct policy, acquisition, and resources for the armed services.", "operations": "Appropriation-funded; runs the Planning, Programming, Budgeting and Execution (PPBE) process, major defense acquisition programs through milestone reviews, and enterprise services (DLA logistics, DISA networks, DCSA clearances). Staffed by career civil servants under political appointees, measured by readiness, program cost/schedule, and audit outcomes.", "regulation": "Overseen by Congress (NDAA authorization, appropriations), OMB, GAO, and the DoD Office of Inspector General; internally disciplined by the DFARS, financial-improvement and audit-readiness programs, and statutory chief officers (CFO, CIO, USD(A&S)).", "examples": "Office of the Secretary of Defense; Defense Logistics Agency; UK Ministry of Defence; Defense Counterintelligence and Security Agency (DCSA)"}, {"name": "Aerospace & Missile Prime Contractor", "naics": "336411, 336414, 334511", "definition": "A publicly traded systems integrator that designs and produces aircraft, missiles, satellites, and integrated weapon systems as prime on government programs of record.", "operations": "Revenue from multi-year and multi-decade contracts (cost-plus for development, fixed-price for production), foreign military sales, and sustainment; operations center on program management offices, systems engineering, supply chains of thousands of subcontractors, and certified earned-value management. Backlogs of $50-150B provide utility-like revenue visibility; margins are regulated by weighted guidelines and CAS-compliant cost accounting.", "regulation": "Audited by DCAA, administered by DCMA, protested before GAO, security-cleared under DCSA/NISPOM, and export-controlled by DDTC (ITAR); self-regulates through the Defense Industry Initiative ethics code, mandatory FAR ethics programs, and SEC-grade public-company governance.", "examples": "Lockheed Martin; RTX (Raytheon); Northrop Grumman; Boeing Defense, Space & Security"}, {"name": "Naval Shipbuilder", "naics": "336611", "definition": "A heavy-industrial yard constructing and overhauling warships, submarines, and auxiliaries — among the longest-cycle, most capital-intensive manufacturing in existence.", "operations": "Funded by shipbuilding appropriations (SCN) contracts spanning 5-10 years per hull plus decades of maintenance availabilities; operates dry docks, modular fabrication halls, and nuclear-qualified trades employing tens of thousands of welders, pipefitters, and engineers. Workforce apprenticeship pipelines and supplier-base fragility are the core management problems.", "regulation": "Overseen by Navy program executive offices, SUPSHIP resident oversight, DCMA/DCAA, and NAVSEA technical authority (nuclear work additionally under Naval Reactors' exacting regime); industry self-governs via classification societies (ABS) and OSHA-partnered maritime safety programs.", "examples": "HII Newport News Shipbuilding; General Dynamics Electric Boat; BAE Systems Maritime; Fincantieri Marinette Marine"}, {"name": "Land Systems & Munitions Manufacturer", "naics": "336992, 332992, 332993, 332994", "definition": "Producers of armored vehicles, artillery, small arms, and ammunition — the expendables and platforms of ground warfare, including government-owned contractor-operated (GOCO) ammunition plants.", "operations": "Funded by procurement contracts, multi-year munitions buys, and allied sales; operations are classic heavy manufacturing — forging, energetics chemistry, assembly lines — with surge capacity held as a paid readiness service. The Ukraine-era rearmament exposed and re-capitalized thin production bases (e.g., 155mm shell output).", "regulation": "ATF licenses manufacture of firearms/explosives domestically; DDTC/BIS control exports; Army Joint Program Executive Office oversees GOCO plants; explosive-safety boards (DDESB) and OSHA govern energetics. Trade self-regulation via NDIA and SAAMI ammunition standards.", "examples": "General Dynamics Land Systems; BAE Systems Platforms; Rheinmetall; American Ordnance (GOCO)"}, {"name": "Defense Electronics & C4ISR Integrator", "naics": "334511, 334220", "definition": "Firms building radars, electronic warfare suites, secure radios, avionics, and command-and-control systems — the sensing and nervous tissue of modern forces.", "operations": "Mixed cost-plus development and fixed-price production, heavy classified ('special access') work, and sustained engineering-services revenue; operations revolve around cleared engineering campuses, SCIF facilities, and obsolescence management of decades-old fielded systems.", "regulation": "NISPOM/DCSA facility clearances, ITAR/EAR export control, DCAA/DCMA contract oversight, NSA certification for cryptographic products; self-regulation through AIA standards bodies and internal export-compliance programs with voluntary disclosure practice.", "examples": "L3Harris Technologies; Leonardo DRS; Elbit Systems of America; Thales Defense & Security"}, {"name": "Defense IT / Cybersecurity Services & Products Firm", "naics": "541512, 541519, 511210", "definition": "Companies defending networks and data — managed detection and response, endpoint and cloud security products, security operations centers, and DoD network engineering.", "operations": "Government side sells cleared engineers on IDIQ task orders and operates mission SOCs; commercial side sells subscription software (EDR, SIEM, threat intel feeds) and incident-response retainers with 70-80% gross margins. Around-the-clock SOC shifts, red teams, and incident-response surge teams are the operating core.", "regulation": "For defense work: CMMC certification against NIST SP 800-171, FedRAMP for cloud, DCSA clearances; commercially overseen by the FTC (breach/deception), SEC (incident disclosure), and sector regulators. Self-regulation via CREST, ISC2/ISACA codes of ethics, and coordinated-vulnerability-disclosure norms.", "examples": "Booz Allen Hamilton cyber; CrowdStrike; Palo Alto Networks; Mandiant (Google Cloud)"}, {"name": "FFRDC / UARC (Federally Funded Research Center)", "naics": "541715, 541720", "definition": "Not-for-profit research institutions chartered to give the government conflict-free technical judgment — systems engineering, operational analysis, and advanced R&D outside civil-service constraints.", "operations": "Funded by sponsoring-agency contracts with fee caps and prohibited from competing with industry; operate national labs, threat-modeling teams, and trusted-agent studies (analyses of alternatives, red teams). Talent model is PhD-dense with security clearances as the entry ticket.", "regulation": "Governed by FAR 35.017 charters, sponsoring-agency comprehensive reviews every five years, GAO scrutiny, and conflict-of-interest firewalls; university-affiliated UARCs add academic governance and export-control (deemed export) compliance.", "examples": "MITRE Corporation; RAND National Security Research Division; Johns Hopkins APL; MIT Lincoln Laboratory"}, {"name": "Private Security Services Firm", "naics": "561612, 561611, 561621", "definition": "Companies supplying guard forces, executive protection, event and facility security, alarm monitoring, and investigations to corporate, government, and residential clients.", "operations": "Labor-arbitrage business model: bill rates over guard wages with thin (4-8%) margins, won through large multi-site contracts; operations are 24/7 scheduling, licensing compliance, training academies, and central alarm stations. The global majors employ hundreds of thousands of officers each.", "regulation": "Licensed state-by-state (guard cards, firearms endorsements, PI licenses) by regulatory boards; alarm firms face UL central-station certification. Self-regulation through ASIS International standards and certifications (CPP, PSP), NASCO advocacy, and ISO 18788 security-operations management systems.", "examples": "Allied Universal; Securitas; GardaWorld; ADT (systems/monitoring)"}, {"name": "Private Military / Contingency Logistics Contractor", "naics": "561210, 488190, 541614", "definition": "Firms performing base operations, life support, convoy and static security, training, and logistics in conflict and austere zones under government contract.", "operations": "Funded by LOGCAP-type omnibus contracts, State Department Worldwide Protective Services task orders, and allied-government deals; operations involve rapid mobilization of expatriate and local-national workforces, camp construction, dining/fuel/water services, and armed protective details under strict rules on the use of force.", "regulation": "Bound by the Montreux Document and the International Code of Conduct (ICoCA), MEJA and host-nation law for personnel conduct, DFARS 225.302 for contractors accompanying the force, and SIGAR/IG audits; ANSI/ASIS PSC.1 certification is the market's self-regulatory license to operate.", "examples": "KBR; Fluor Government Group; Constellis (Triple Canopy); Amentum"}, {"name": "Veterans' Health, Benefits & Service Organizations", "naics": "923140, 622110 (VA hospitals), 813410 (VSOs)", "definition": "The public agencies delivering veterans' healthcare, disability compensation, education (GI Bill), and burial benefits, plus congressionally chartered veterans service organizations that represent claimants and advocate.", "operations": "The VA is appropriation-funded, operating ~170 medical centers and a benefits administration adjudicating millions of disability claims annually; VSOs are dues- and donation-funded nonprofits whose accredited service officers prepare claims for free and lobby on veterans' policy. Measured by wait times, claims backlog, and veteran outcomes.", "regulation": "Overseen by House/Senate Veterans' Affairs Committees, VA Office of Inspector General, and GAO; VSO claim representatives are accredited by the VA Office of General Counsel; nonprofits answer to the IRS and their congressional charters.", "examples": "U.S. Department of Veterans Affairs; Veterans Health Administration; American Legion; Disabled American Veterans (DAV)"}, {"name": "Arms Control, Export Compliance & Nonproliferation Services", "naics": "541690, 541110, 541990", "definition": "Consultancies, law practices, and NGOs that classify products against control lists, obtain export licenses, build ITAR/EAR compliance programs, and verify treaty compliance.", "operations": "Funded by corporate compliance retainers, license-preparation fees, government verification contracts, and (for NGOs) foundation grants; daily work is jurisdiction/classification analysis (USML vs. CCL), license applications through DDTC's DECCS and BIS's SNAP-R, audits, training, and voluntary disclosures after violations.", "regulation": "The substantive regulators are State DDTC (ITAR), Commerce BIS (EAR), Treasury OFAC (sanctions), and internationally the IAEA, OPCW, and Wassenaar/MTCR/NSG regimes; practitioners self-organize through the Society for International Affairs and ECTI training credentials.", "examples": "Export-control practices of Akin Gump and Torres Trade Law; Vista Outdoor-scale in-house programs; Nuclear Threat Initiative (NGO); SGS treaty-inspection services"}], "regulators": [{"name": "Congressional Armed Services Committees (HASC/SASC) and Defense Appropriations Subcommittees", "jurisdiction": "US", "role": "Authorize the entire defense program annually through the NDAA, set end-strengths and acquisition policy, confirm senior officers and civilian leaders, and control every appropriated dollar; conduct continuous oversight hearings."}, {"name": "Government Accountability Office (GAO) and DoD Office of Inspector General", "jurisdiction": "US", "role": "GAO audits weapon-system cost/schedule (annual Weapon Systems Assessment) and adjudicates bid protests; the DoD IG investigates fraud, whistleblower reprisal, and program failures across the department and its contractors."}, {"name": "Defense Contract Audit Agency (DCAA) and Defense Contract Management Agency (DCMA)", "jurisdiction": "US", "role": "DCAA audits contractor incurred costs, forward-pricing rates, and accounting-system adequacy under CAS; DCMA administers contracts in contractor plants — quality assurance, delivery surveillance, earned-value validation, and property administration."}, {"name": "State Department Directorate of Defense Trade Controls (DDTC) and Commerce Bureau of Industry and Security (BIS)", "jurisdiction": "US (extraterritorial reach)", "role": "DDTC administers ITAR and the U.S. Munitions List — registration, licensing, and enforcement for defense articles and services; BIS runs the EAR and Commerce Control List for dual-use items, with both able to impose debarment and criminal referral."}, {"name": "Defense Counterintelligence and Security Agency (DCSA)", "jurisdiction": "US", "role": "Grants and continuously vets personnel security clearances, oversees the National Industrial Security Program (facility clearances under 32 CFR Part 117/NISPOM), and monitors foreign ownership, control, or influence (FOCI) in cleared industry."}, {"name": "State Private Security Licensing Boards (e.g., California BSIS, Texas DPS Private Security Bureau)", "jurisdiction": "US states", "role": "License security companies, guards, and private investigators — background checks, training-hour minimums, firearms permits — and discipline violations through fines and license revocation."}, {"name": "ASIS International and the International Code of Conduct Association (ICoCA)", "jurisdiction": "Global (self-regulatory)", "role": "ASIS sets professional security standards and certifications (CPP, PSP, APP) and ANSI-accredited management standards; ICoCA certifies and monitors private security companies against the Montreux-derived human-rights code of conduct."}, {"name": "IAEA / OPCW and allied treaty regimes", "jurisdiction": "Global", "role": "Verify state compliance with the Nuclear Non-Proliferation Treaty (safeguards inspections) and the Chemical Weapons Convention (declarations, challenge inspections); alongside MTCR and Wassenaar Arrangement, they set the multilateral control lists national export regulators enforce."}]}, "groundView": {"orgModel": "Military organizations are the archetype of unity-of-command hierarchy: a civilian secretary and service chief atop a headquarters staff (personnel/G-1, intelligence/G-2, operations/G-3, logistics/G-4, plans, communications), commanding echeloned formations — corps, division, brigade, battalion, company, platoon, squad — each led by a commissioned officer paired with a senior non-commissioned officer who owns training and welfare of enlisted troops. Authority, promotion, and discipline are codified in statute (Title 10, UCMJ) rather than employment contract. A defense prime mirrors this with corporate governance: a board with audit and classified-security committees, a CEO over sector presidents, program managers running individual contracts with matrixed engineering, supply-chain, quality, security (an empowered Facility Security Officer is legally required), and contracts/compliance functions; DCMA and customer program offices are embedded on-site. Private security firms run lean regional hierarchies — branch managers over account managers over site supervisors over officers — where scheduling, licensing, and training compliance are the operational heartbeat. Across all three, the distinctive features are clearance-gated access to information, formal chains of command, and external auditors resident inside the organization.", "positions": [{"title": "Board Director, Defense Prime (Audit & Classified Business Committee)", "level": "Governance", "reportsTo": "Shareholders / Board Chair", "duties": "Oversees strategy, CEO succession, and risk for a public defense contractor, including a special committee (often of cleared former officials) supervising classified programs the full board cannot see. Approves major bids, M&A, and ethics/compliance posture; measured by total shareholder return and clean audits.", "credentials": "Senior executive, flag-officer, or senior-government background; security clearance for classified-committee service; NACD-style governance training", "socCode": "11-1011"}, {"title": "Secretary of the Military Department (Service Secretary)", "level": "Governance", "reportsTo": "Secretary of Defense / President", "duties": "The statutory civilian head of a military department: sets service policy, presents and defends the budget, directs acquisition, and ensures civilian control. Decides basing, force structure proposals, and senior officer assignments; accountable to Congress in testimony.", "credentials": "Presidential appointment, Senate confirmation; typically national-security, legal, or industry executive background; TS/SCI clearance", "socCode": "11-1011"}, {"title": "Service Chief of Staff / Chief of Naval Operations (4-star)", "level": "Executive", "reportsTo": "Service Secretary (and Joint Chiefs chairman for joint advice)", "duties": "The senior uniformed officer: organizes, trains, and equips the force, sets doctrine and requirements, and advises the President as a member of the Joint Chiefs. Owns readiness of the entire service; measured by readiness rates, recruiting/retention, and modernization delivery.", "credentials": "35+ years commissioned service, joint qualification under Goldwater-Nichols, war-college education, Senate confirmation; TS/SCI", "socCode": "55-1019"}, {"title": "Chief Executive Officer, Defense Contractor", "level": "Executive", "reportsTo": "Board of Directors", "duties": "Sets portfolio strategy across programs and international markets, allocates IRAD (independent R&D), leads capture of franchise programs, and personally manages relationships with the Pentagon's senior leadership and Capitol Hill. Measured by bookings, backlog, margins, and program execution.", "credentials": "Engineering or business degree plus MBA typical; decades in program management or military service; security clearance", "socCode": "11-1011"}, {"title": "Program Executive Officer / Program Manager (Acquisition)", "level": "Management", "reportsTo": "Service Acquisition Executive (government) or Sector President (industry)", "duties": "Runs a weapon-system program across cost, schedule, and performance baselines: milestone decision preparation, test integration, contractor management, and congressional reporting (Selected Acquisition Reports). Owns the program's earned-value performance and risk register; Nunn-McCurdy breaches end careers.", "credentials": "DAWIA Program Management certification (Practitioner/Advanced), engineering or management degree, PMP common; government PMs are O-5/O-6 or GS-14/15 with clearance", "socCode": "11-9199"}, {"title": "Battalion / Squadron Commander (O-5)", "level": "Management", "reportsTo": "Brigade / Group Commander", "duties": "Commands 300-1,000 troops: legally responsible for training, discipline (UCMJ authority), equipment maintenance, and combat readiness of the unit, and for its employment in operations. Balances mission with soldier welfare and family readiness; measured by readiness reporting, inspection results, and command-climate surveys.", "credentials": "Commissioned officer ~16-18 years service; command selection board; intermediate-level (staff college) education; clearance appropriate to mission", "socCode": "55-1019"}, {"title": "Director of Security Operations (Private Security Firm)", "level": "Management", "reportsTo": "Regional Vice President / COO", "duties": "Oversees dozens of client sites: staffing and scheduling to contract, guard training and licensing compliance, incident escalation, and client retention. Manages account P&Ls with thin margins; measured by fill rates, turnover, incident outcomes, and contract renewals.", "credentials": "Bachelor's in criminal justice or business; ASIS Certified Protection Professional (CPP); state security-manager licensing; often military/law-enforcement background", "socCode": "11-9199"}, {"title": "Contracting Officer (Government) / Contracts Director (Industry)", "level": "Professional", "reportsTo": "Head of Contracting Activity / VP Contracts", "duties": "Government KOs solicit, negotiate, award, and administer defense contracts with warranted authority to obligate funds; industry counterparts negotiate terms, manage REAs and claims, and certify cost or pricing data under TINA. Both own compliance with FAR/DFARS flow-downs.", "credentials": "Bachelor's plus business credits; DAWIA Contracting Professional certification or NCMA CPCM/CFCM; warrant (government); clearance for classified contracting", "socCode": "13-1023"}, {"title": "Systems Engineer (Weapon Systems)", "level": "Professional", "reportsTo": "Chief Engineer / Program Manager", "duties": "Decomposes requirements into specifications, manages interfaces and technical baselines, runs trade studies and design reviews (SRR/PDR/CDR), and verifies performance through test. Owns the technical risk register; measured by requirement stability, test success, and design-review exit criteria.", "credentials": "BS/MS in engineering; INCOSE CSEP certification valued; DoD SPRDE/engineering DAWIA certification on government side; Secret/TS clearance", "socCode": "17-2199"}, {"title": "Cyber Defense Analyst (SOC Analyst / Incident Responder)", "level": "Professional", "reportsTo": "SOC Manager / CISO", "duties": "Monitors networks for intrusion via SIEM/EDR telemetry, triages alerts, hunts threats against MITRE ATT&CK behaviors, and executes containment and forensics during incidents. Writes detection rules and after-action reports; measured by mean time to detect/respond and false-positive discipline.", "credentials": "BS in computer science/cyber or equivalent experience; Security+, GCIA/GCIH, CISSP progression; DoD 8140 compliance and clearance for defense SOCs", "socCode": "15-1212"}, {"title": "Facility Security Officer (FSO)", "level": "Professional", "reportsTo": "Senior Management Official (legally) / VP Security", "duties": "The legally mandated custodian of a cleared contractor's industrial security program: personnel clearance processing, classified information control, insider-threat program, visitor control, and self-inspections. Interfaces with DCSA on vulnerability assessments; a failing security rating can suspend the company's classified business.", "credentials": "FSO Program Management certification (CDSE), NISPOM (32 CFR 117) mastery, personnel clearance at facility level; ISP/ISOC certification valued", "socCode": "13-1199"}, {"title": "Export Compliance Officer (ITAR/EAR)", "level": "Professional", "reportsTo": "General Counsel / Chief Compliance Officer", "duties": "Classifies hardware and technical data against the USML/CCL, prepares DDTC and BIS license applications, controls foreign-national access (deemed exports), audits shipments and data flows, and manages voluntary disclosures. Measured by license cycle times and zero willful violations.", "credentials": "Bachelor's (engineering or international affairs helpful); ECTI/SIA training certificates; empowered-official designation under ITAR", "socCode": "13-1041"}, {"title": "Logistician (Military or Defense Industry)", "level": "Professional", "reportsTo": "G-4 / Director of Sustainment", "duties": "Plans and executes supply, maintenance, and distribution: provisioning spares, managing depot repair cycles, forecasting readiness drivers, and building deployment movement plans. Owns supply availability and equipment operational-readiness rates.", "credentials": "Bachelor's; DAWIA Life Cycle Logistics certification or SOLE/APICS (CPIM/CSCP) credentials; clearance as required", "socCode": "13-1081"}, {"title": "First Sergeant / Senior Non-Commissioned Officer", "level": "Operational", "reportsTo": "Company Commander", "duties": "The senior enlisted soldier of a company: enforces standards and discipline, runs daily formations and training schedules, mentors junior NCOs, and manages soldier welfare, housing, and readiness paperwork. The commander's barometer of morale; measured by unit discipline statistics and training completion.", "credentials": "15-20 years enlisted service; senior enlisted professional military education (First Sergeant Course, Sergeants Major Academy track); clearance per unit mission", "socCode": "55-2011"}, {"title": "Infantry Soldier / Fire Team Member", "level": "Operational", "reportsTo": "Fire Team Leader / Squad Leader", "duties": "Trains for and executes close combat: weapons proficiency, battle drills, patrolling, and physical conditioning; maintains assigned weapons and equipment daily. In garrison, life is training cycles and maintenance; in deployment, security operations and combat missions under rules of engagement.", "credentials": "Enlistment (ASVAB qualification), basic and infantry one-station-unit training; airborne/ranger qualifications as advanced credentials; Secret clearance common", "socCode": "55-3016"}, {"title": "Security Officer (Guard)", "level": "Operational", "reportsTo": "Site Supervisor / Account Manager", "duties": "Controls access at posts, patrols premises, monitors CCTV and alarms, writes incident reports, and executes emergency procedures (evacuation, medical response, law-enforcement liaison). The visible deterrent; measured by post-order compliance, incident documentation quality, and client feedback.", "credentials": "State guard license ('guard card'), 8-40 hours mandated training, firearms endorsement if armed; ASIS Certified Protection Officer or APP for career progression", "socCode": "33-9032"}, {"title": "Aircraft Structures Assembler / Shipyard Welder", "level": "Operational", "reportsTo": "Production Supervisor / Trade Foreman", "duties": "Fabricates and joins airframe sections or hull structures to exacting military specifications: drilling, fastening, welding to NAVSEA or aerospace standards, with every joint traceable through quality documentation. Measured by first-pass yield, foreign-object-damage discipline, and schedule adherence.", "credentials": "Apprenticeship or trade school; AWS welding certifications / NADCAP process quals; ability to obtain facility access or clearance", "socCode": "51-2011"}, {"title": "Veterans Service Officer (VSO Representative)", "level": "Operational", "reportsTo": "County Veterans Service Director / VSO State Adjutant", "duties": "Interviews veterans and survivors, develops evidence for disability and pension claims, files through VA systems, and represents claimants in appeals before the Board of Veterans' Appeals. Free to the veteran; measured by claim grant rates and backlog management.", "credentials": "VA Office of General Counsel accreditation; NACVSO or service-organization training and continuing education; often veteran status", "socCode": "13-1199"}]}}, {"id": "intelligence", "name": "Intelligence", "icon": "🕵️", "tagline": "The systematic collection, analysis, and delivery of decision-advantage information — from national intelligence communities to competitive intelligence, due diligence, and threat-intel markets.", "view100k": {"role": "Intelligence is civilization's institutionalized answer to uncertainty about adversaries, markets, and risks: the disciplined cycle of planning, collection, processing, analysis, and dissemination that converts scattered information into decision advantage. It exists because decisions of consequence — whether to go to war, sanction a bank, acquire a company, or trust a counterparty — are made under asymmetric information, and organized intelligence reduces that asymmetry faster than adversaries can restore it. The public core is the state intelligence community: the U.S. IC comprises 18 elements coordinated by the Office of the Director of National Intelligence, with a disclosed National Intelligence Program budget in the range of $70+ billion annually plus a Military Intelligence Program of roughly $25-30 billion, employing on the order of 100,000+ officers across CIA (human intelligence), NSA (signals), NGA (geospatial), NRO (satellite systems), DIA (defense), FBI (domestic security), and departmental units in State, Treasury, Energy, and DHS. Allied services — the UK's SIS/GCHQ/MI5, France's DGSE, the Five Eyes partnership — form a treaty-linked global lattice.\n\nThe commercial hemisphere has grown into a multi-industry complex. Competitive and market intelligence functions exist inside most Fortune 500 firms and are served by specialist consultancies; the corporate investigations and risk-consulting industry (Kroll, Control Risks, Teneo risk practices) sells due diligence, asset tracing, and political-risk analysis; data brokers and information-services firms (LexisNexis Risk Solutions, Thomson Reuters/Refinitiv World-Check, Experian, Acxiom) operate a data economy estimated in the hundreds of billions of dollars; cyber threat-intelligence vendors (Recorded Future, Mandiant, CrowdStrike intelligence units) sell adversary tracking as subscription software; and commercial geospatial constellations (Maxar, Planet Labs) now deliver imagery once reserved for superpowers. OSINT — open-source intelligence — has become both a profession and a public practice, exemplified by investigative collectives and by the wartime fusion of satellite imagery, social media, and shipping data.\n\nHistorically the arc runs from Sun Tzu's employment of spies and Elizabethan England's Walsingham network, through the codebreaking wars of the 20th century (Room 40, Bletchley Park, MAGIC) that arguably shortened World War II, to the National Security Act of 1947 that created the CIA and the modern institutional form. The post-1975 Church Committee reforms built the oversight architecture — congressional intelligence committees, the Foreign Intelligence Surveillance Act and its court — and the post-9/11 Intelligence Reform and Terrorism Prevention Act (2004) created the DNI. The 21st-century story is the migration of capability into the commercial sector and the corresponding rise of privacy law as the domain's binding constraint.", "interdependencies": "Intelligence is a service domain: it produces nothing but refined judgment, and every other domain is either its customer, its collection target, or its substrate. Governance and Defense are its principal masters — statecraft and military operations run on its warning, targeting, and estimative products — while Law both empowers it (FISA, surveillance statutes) and cages it (Fourth Amendment, GDPR, FCRA for background data). It depends on Technology and Science for sensors, satellites, cryptography, and now machine learning at the core of processing; on Communication networks as both collection medium and dissemination channel; on Energy and Infrastructure for data centers and ground stations; and on Finance both as a customer (sanctions enforcement, anti-money-laundering intelligence via FinCEN) and as a target of economic analysis. It feeds Trade and Economy through country-risk and market intelligence, protects Industry and Agriculture through counterintelligence against IP theft and supply-chain espionage, monitors Population flows and Medicine (pandemic warning was an IC mission before COVID-19), watches Environment as a security variable (climate intelligence), and reads Culture and Religion as the terrain of influence operations and radicalization analysis. Education supplies its linguists, analysts, and engineers through a clearance-gated pipeline.", "regulationModel": "Lawful intelligence is governed by a compact: extraordinary powers in exchange for extraordinary oversight. In the U.S., the framework rests on the National Security Act of 1947, Executive Order 12333 (missions and limits of each element, attorney-general-approved guidelines for handling U.S. person information), and the Foreign Intelligence Surveillance Act, whose court (FISC) must approve certain surveillance and whose Section 702 program is subject to recurring congressional reauthorization. Oversight is quadruple-layered: the Senate Select Committee on Intelligence and House Permanent Select Committee on Intelligence (budgets, covert-action notification via presidential findings); the Intelligence Community Inspector General and agency IGs; the Privacy and Civil Liberties Oversight Board; and internal compliance offices with mandatory incident reporting. Classification is governed by executive order (13526) with declassification review, and whistleblowers have a protected statutory channel (ICWPA). The commercial side is regulated as information commerce: the FTC polices unfair and deceptive data practices, the FCRA (enforced by the CFPB and FTC) governs background-screening data, state laws (CCPA/CPRA) and the EU's GDPR constrain data brokerage, and private investigators are licensed by state boards. Self-regulation is meaningful: SCIP's code of ethics for competitive intelligence expressly prohibits misrepresentation and requires legal compliance; the Professional Background Screening Association accredits screeners; and due-diligence firms operate under attorney supervision and anti-bribery (FCPA/UK Bribery Act) compliance frameworks."}, "view10k": {"overview": "The public core is classified under NAICS 928110 (National Security) and 922120 (Police Protection, for law-enforcement intelligence), organized as a community of collection agencies (SIGINT, GEOINT, HUMINT), all-source analytic centers, and a coordinating DNI staff. The commercial periphery spans several NAICS neighborhoods: 561611 (Investigation Services — corporate investigators, due-diligence firms, background screeners), 541910 (Marketing Research — the home of competitive and market intelligence), 541611/541690 (management and technical consulting — risk advisory, political risk), 519290 and 518210 (data brokers and information/data-processing services), 511210 and 541512 (threat-intelligence software and cyber intelligence services), 541370 (geospatial mapping services) with 517410 (satellite telecommunications) for space-based collection, and 541715 (FFRDC-style research). The economics divide cleanly: government intelligence is appropriation-funded with a large cleared-contractor workforce (roughly half the IC workforce by some counts is contractors), while commercial intelligence sells subscriptions (data and threat feeds), retainers (investigations, risk advisory), and per-report fees (due diligence, background checks). Everything here concerns lawful, publicly documented structures — statutory agencies, licensed investigators, and open commercial markets.", "businessTypes": [{"name": "National Intelligence Agency (Collection & Analysis)", "naics": "928110", "definition": "A statutory civilian agency that collects foreign intelligence through a specialized discipline — human sources, signals, or imagery — and produces all-source or single-discipline analysis for national policymakers.", "operations": "Funded through the classified National Intelligence Program appropriation; organized into directorates for operations/collection, analysis, science & technology, and support. Daily work is tasking against national intelligence priorities, processing collected material, and publishing serialized product — from the President's Daily Brief to community assessments — under strict compartmentation.", "regulation": "Overseen by the DNI, SSCI/HPSCI, the agency and IC Inspectors General, PCLOB, and the FISC where statutes apply; internally governed by EO 12333 attorney-general guidelines, analytic tradecraft standards (ICD 203), and pre-publication review of employee writings.", "examples": "Central Intelligence Agency; National Security Agency; National Geospatial-Intelligence Agency; UK Government Communications Headquarters (GCHQ)"}, {"name": "Intelligence Community Coordinating Body", "naics": "928110", "definition": "The integrating headquarters — in the U.S., the Office of the Director of National Intelligence — that sets collection priorities, builds the consolidated budget, enforces analytic and security standards, and runs mission centers that fuse community-wide effort.", "operations": "Appropriation-funded staff organization; runs the National Intelligence Priorities Framework, produces National Intelligence Estimates through the National Intelligence Council, manages security-clearance policy, and hosts fusion centers (NCTC for terrorism, NCSC for counterintelligence). Output is coordination, standards, and community product rather than unilateral collection.", "regulation": "Created by IRTPA 2004; answerable to the President and the congressional intelligence committees, audited by the IC IG and GAO (for unclassified management matters), with PCLOB reviewing civil-liberties implications of community programs.", "examples": "Office of the Director of National Intelligence; National Counterterrorism Center; National Intelligence Council; UK Joint Intelligence Organisation"}, {"name": "Military & Defense Intelligence Component", "naics": "928110", "definition": "Defense-department agencies and service intelligence centers producing foreign military intelligence — order of battle, weapons assessment, targeting support — for commanders and defense planners.", "operations": "Funded by the Military Intelligence Program; embeds analysts and collectors with combatant commands, runs the defense attaché system in embassies, operates technical centers (missile and space intelligence), and feeds targeting cycles. The tempo is operational: intelligence preparation of the battlespace, indications and warning watch floors, battle-damage assessment.", "regulation": "Overseen by the Under Secretary of Defense for Intelligence & Security, the DNI (for national programs), congressional armed services and intelligence committees, and the DoD IG; bound by EO 12333, DoD Manual 5240.01 on U.S. person information, and the law of armed conflict for targeting support.", "examples": "Defense Intelligence Agency; National Reconnaissance Office; Army Military Intelligence (INSCOM); Office of Naval Intelligence"}, {"name": "Domestic Security & Law-Enforcement Intelligence", "naics": "928110, 922120", "definition": "The intelligence arms of domestic security services and police — counterterrorism, counterintelligence, and criminal intelligence — operating under domestic legal authorities rather than foreign-intelligence rules.", "operations": "Appropriation-funded; runs field intelligence groups, joint terrorism task forces, state and local fusion centers, and suspicious-activity reporting pipelines. Core processes are threat assessment, case-support analysis, and information sharing across roughly 18,000 U.S. police agencies through RISS networks and DHS channels.", "regulation": "Governed by the Attorney General's Guidelines for Domestic FBI Operations, FISA for national-security surveillance, 28 CFR Part 23 for criminal-intelligence databases, and oversight from DOJ IG, congressional judiciary and intelligence committees, and privacy officers embedded in fusion centers.", "examples": "FBI Intelligence Branch; DHS Office of Intelligence & Analysis; NYPD Intelligence Bureau; UK MI5 (Security Service)"}, {"name": "Competitive & Market Intelligence Firm", "naics": "541910, 541690", "definition": "Consultancies and in-house functions that legally collect and analyze information on competitors, markets, and technologies — win/loss analysis, war-gaming, patent landscaping — to inform corporate strategy.", "operations": "Funded by project fees, retainers, and subscription intelligence platforms; methods are strictly open and ethical: primary interviews with disclosed identity, trade-show collection, public filings, patent and import-record analysis, and expert networks. Deliverables are battlecards, early-warning dashboards, and scenario war-games for product and M&A decisions.", "regulation": "Bounded by trade-secret law (DTSA/EEA — misappropriation is a federal crime), antitrust limits on competitor information exchange, and contract/NDA law; self-regulated through the SCIP Code of Ethics, which mandates identity disclosure and legal compliance in collection.", "examples": "Fuld & Company; Klue and Crayon (CI software); Gartner (market intelligence); in-house CI units at major pharmaceutical and technology firms"}, {"name": "Corporate Investigations & Due-Diligence Firm", "naics": "561611", "definition": "Licensed investigative consultancies performing pre-transaction due diligence, fraud investigation, asset tracing, litigation support, and integrity monitoring for corporations, funds, and law firms.", "operations": "Revenue from hourly billing and fixed-fee reports, frequently engaged through outside counsel to preserve privilege; operations combine public-records research across jurisdictions, licensed database access, discreet human-source inquiries, forensic accounting, and in-country networks. Reputational (pre-IPO, KYC) reports and internal FCPA investigations are staple products.", "regulation": "Investigators are licensed by state PI boards; work is constrained by the FCRA (when reports serve employment/credit purposes), GLBA pretexting prohibitions, wiretap and computer-fraud statutes, and GDPR for European subjects. Firms self-regulate through internal counsel review, anti-bribery compliance, and bodies like the Association of Certified Fraud Examiners' code.", "examples": "Kroll; Control Risks; Nardello & Co.; K2 Integrity"}, {"name": "Political Risk & Geopolitical Advisory", "naics": "541611, 541690", "definition": "Analytic consultancies selling forecasts of political, regulatory, and security developments — election outcomes, sanction trajectories, coup and expropriation risk — to investors, multinationals, and insurers.", "operations": "Subscription research plus bespoke advisory; staffed by regional specialists, former diplomats, and economists producing scenario analyses, country risk ratings, and crisis advisories. Integrated with security services (evacuation planning, travel risk) at some firms; measured by forecast track record and client renewals.", "regulation": "Lightly regulated as publishing/consulting; constrained by securities law when advice touches trading (MNPI policies), FARA if representing foreign principals, and sanctions law for engagement with restricted jurisdictions; professional self-discipline via transparent methodology and analyst sourcing standards.", "examples": "Eurasia Group; Control Risks (country risk); Verisk Maplecroft; S&P Global Country Risk"}, {"name": "Data Broker / Risk-Information Services", "naics": "519290, 518210", "definition": "Firms that aggregate, license, and score identity, public-record, sanctions, adverse-media, and behavioral data at population scale — the raw-material layer of commercial intelligence and compliance screening.", "operations": "Subscription and per-query licensing of massive linked datasets (property, court, corporate registries, watchlists); operations are data acquisition, entity resolution, scoring algorithms, and API delivery into bank KYC/AML systems, insurers, and investigators. Gross margins are software-like; data provenance and accuracy are the core operational risks.", "regulation": "Regulated by the FTC (Section 5, and enforcement actions on sensitive-location data), the FCRA where data feeds eligibility decisions, state data-broker registration laws (Vermont, California Delete Act), and GDPR/UK DPA abroad; self-regulation through data-ethics boards and industry codes remains contested and is the domain's active policy frontier.", "examples": "LexisNexis Risk Solutions; Thomson Reuters (World-Check via LSEG); Experian; Acxiom"}, {"name": "Cyber Threat Intelligence Vendor", "naics": "511210, 541512", "definition": "Companies that track hostile cyber actors — nation-state groups, ransomware crews — and sell finished intelligence, indicator feeds, and attribution analysis as subscription products and incident-response support.", "operations": "SaaS subscriptions for intelligence platforms and feeds, plus consulting (threat assessments, dark-web monitoring, executive protection intelligence); operations combine telemetry from deployed sens
