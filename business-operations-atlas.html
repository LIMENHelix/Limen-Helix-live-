lume, plant utilization, and platform sharing. Product cycles run years and require multibillion-dollar tooling investments.", "regulation": "Regulated by NHTSA (safety/FMVSS) and EPA/CARB (emissions and fuel economy), plus recall authority; self-regulation via SAE standards and IATF 16949 automotive quality certification.", "examples": "Toyota, Volkswagen, Ford, General Motors"}, {"name": "Aerospace & Defense Manufacturer", "naics": "336411, 336412, 336414", "definition": "Firms that design and build aircraft, spacecraft, engines, and defense systems.", "operations": "They execute long-cycle, high-value programs under fixed-price or cost-plus contracts, managing complex global supply chains and stringent certification; revenue is program-based with large backlogs and thin unit volumes. Engineering intensity and certification cost are enormous.", "regulation": "FAA certifies civil aircraft; DoD/DCMA and ITAR govern defense work; self-regulation via AS9100 aerospace quality standard and SAE aerospace standards.", "examples": "Boeing, Airbus, Lockheed Martin, RTX (Raytheon)"}, {"name": "Industrial Machinery & Equipment Manufacturer", "naics": "333", "definition": "Makers of engines, turbines, construction and agricultural machinery, and factory automation equipment.", "operations": "They design and build durable capital goods sold to other businesses, earning margin on equipment plus lucrative aftermarket parts and service; demand is cyclical and tied to capital investment. Engineering, aftermarket, and dealer networks drive returns.", "regulation": "OSHA machine-safety rules, EPA off-road engine emissions, and CE marking (EU Machinery Directive); self-regulation via ASME, ISO 12100 (machine safety), and ANSI.", "examples": "Caterpillar, Deere & Company, Komatsu, Siemens"}, {"name": "Chemical Manufacturer", "naics": "325", "definition": "Firms that convert raw hydrocarbons, minerals, and gases into basic, specialty, and agricultural chemicals and plastics.", "operations": "They run continuous-process plants where scale, feedstock cost, and plant reliability determine margin, selling bulk commodities or higher-margin specialties; the business is energy- and safety-intensive with long asset lives. Process optimization and feedstock advantage are decisive.", "regulation": "Heavily regulated by EPA (TSCA, Clean Air Act, RCRA), OSHA Process Safety Management, and EU REACH; self-regulation via the ACC's Responsible Care program and ISO standards.", "examples": "BASF, Dow, SABIC, LyondellBasell"}, {"name": "Pharmaceutical & Biologics Manufacturer", "naics": "325412, 325411, 325414", "definition": "Firms that manufacture active pharmaceutical ingredients and finished drug and biologic products.", "operations": "They run GMP-validated production lines with rigorous quality control, earning high margins on patented products before generic competition; capital and compliance costs are high and batch integrity is paramount. Yield, validation, and quality determine viability.", "regulation": "FDA (cGMP, 21 CFR 210/211) and EMA regulate manufacturing and quality; DEA controls scheduled substances; self-regulation via USP standards and ISPE/PDA guidance.", "examples": "Pfizer, Novartis, Roche, Lonza (CDMO)"}, {"name": "Semiconductor Fabricator (Foundry/IDM)", "naics": "334413", "definition": "Firms that manufacture integrated circuits on silicon wafers in cleanroom fabs.", "operations": "They run the most capital-intensive plants on Earth ($10-20B+ per leading-edge fab), earning margin on wafer volume and process-node leadership; yield, uptime, and utilization dominate economics. The business is a relentless capex-and-R&D treadmill (Moore's Law).", "regulation": "EPA/OSHA for hazardous chemicals and gases, export controls (BIS) on advanced tools; self-regulation via SEMI standards for equipment, materials, and safety.", "examples": "TSMC, Samsung, Intel, GlobalFoundries"}, {"name": "Primary Metals Producer (Steel/Aluminum)", "naics": "331110, 331313", "definition": "Firms that smelt and refine ore or scrap into primary metals and basic shapes.", "operations": "They operate blast furnaces, electric-arc furnaces, or smelters, selling commodity metal where energy cost, scale, and utilization govern thin margins; the business is highly cyclical and energy-intensive. Feedstock (ore/scrap) and power costs are decisive.", "regulation": "EPA air/water permits, OSHA molten-metal and heat hazards; self-regulation via AISI, ASTM material specs, and ISO 14001; trade remedies (anti-dumping) shape markets.", "examples": "ArcelorMittal, Nucor, POSCO, Alcoa"}, {"name": "Fabricated Metal / Job Shop", "naics": "332", "definition": "Contract manufacturers that cut, form, machine, weld, and finish metal parts to customer specification.", "operations": "They run CNC machining, stamping, and welding to build parts and assemblies on purchase orders, earning margin on machine time and labor; capacity utilization and quoting accuracy drive profit. Most are small-to-mid firms serving OEMs.", "regulation": "OSHA machine and welding safety, EPA for finishing/plating waste; self-regulation via AWS welding codes, ISO 9001/IATF 16949, and NIST/PPAP quality systems.", "examples": "Local and mid-market job shops; contract manufacturers like Jabil (broader EMS)"}, {"name": "Electronics Contract Manufacturer (EMS)", "naics": "334418", "definition": "Firms that assemble printed circuit boards and finished electronic products for OEMs.", "operations": "They run high-volume surface-mount and box-build lines under contract, earning thin margins on scale and supply-chain management; flexibility, yield, and component sourcing are key. They enable brand OEMs to be 'fabless' in assembly.", "regulation": "OSHA/EPA for solder and e-waste, RoHS/REACH material compliance; self-regulation via IPC assembly standards and ISO 9001.", "examples": "Foxconn (Hon Hai), Flex, Jabil, Pegatron"}, {"name": "Consumer / Durable Goods Manufacturer", "naics": "335, 337, 339", "definition": "Makers of appliances, electrical equipment, furniture, and other finished consumer durables.", "operations": "They design, manufacture, and brand products sold through retail and distribution, earning margin on volume, brand, and product mix; scale, design, and channel access matter. Demand tracks consumer confidence and housing.", "regulation": "CPSC product-safety rules, DOE energy-efficiency standards, UL safety certification; self-regulation via UL, ANSI, and AHAM standards.", "examples": "Whirlpool, Samsung Electronics, LG, Bosch"}, {"name": "Mining & Metal Ore Extraction", "naics": "212", "definition": "Firms that extract metallic and non-metallic minerals from the earth.", "operations": "They develop and operate mines, extracting and concentrating ore for sale to smelters, earning margin on the spread between commodity price and cash cost; reserves, grade, and operating cost govern returns. Long lead times and heavy capital define the model.", "regulation": "MSHA (mine safety), EPA and Interior/BLM (reclamation, water), and permitting; self-regulation via ICMM sustainability framework and the SME.", "examples": "BHP, Rio Tinto, Glencore, Freeport-McMoRan"}, {"name": "Oil & Gas Extraction / Refining", "naics": "211120, 324110", "definition": "Firms that extract crude oil and natural gas and refine them into fuels and petrochemical feedstocks.", "operations": "Upstream firms drill and produce hydrocarbons; refiners crack crude into fuels earning a refining margin (crack spread); both are capital- and commodity-price-driven. Reservoir management and refinery reliability are central.", "regulation": "EPA (emissions, spills), BSEE/BLM (drilling), PHMSA (pipelines), OSHA PSM; self-regulation via API standards and recommended practices.", "examples": "ExxonMobil, Shell, Chevron, Saudi Aramco"}, {"name": "Food & Beverage Processor", "naics": "311, 312", "definition": "Firms that transform agricultural raw materials into packaged food and beverage products.", "operations": "They run continuous or batch processing lines converting commodities into branded packaged goods, earning margin on brand, scale, and product mix; food safety and throughput are paramount. Input (commodity) costs and shelf velocity drive economics.", "regulation": "FDA and USDA (FSIS for meat) enforce food-safety and labeling under FSMA; self-regulation via GFSI schemes (SQF, BRC), HACCP, and ISO 22000.", "examples": "Nestlé, PepsiCo, Tyson Foods, Anheuser-Busch InBev"}], "regulators": [{"name": "Occupational Safety and Health Administration (OSHA) & MSHA", "jurisdiction": "US", "role": "OSHA sets and enforces factory worker-safety and process-safety standards; MSHA does the same for mines, covering machine guarding, hazardous materials, and explosion risk."}, {"name": "U.S. Environmental Protection Agency (EPA)", "jurisdiction": "US", "role": "Regulates industrial air emissions, water discharge, hazardous waste (RCRA), and chemicals (TSCA), issuing the permits that heavy industry must hold to operate."}, {"name": "Consumer Product Safety Commission (CPSC) / NHTSA", "jurisdiction": "US", "role": "CPSC regulates the safety of manufactured consumer products and orders recalls; NHTSA does the same for motor vehicles and equipment."}, {"name": "European Chemicals Agency (ECHA) / REACH", "jurisdiction": "EU", "role": "Administers REACH and CLP, requiring registration, evaluation, and authorization of chemicals sold in the EU — the world's most influential chemicals regime."}, {"name": "International Organization for Standardization (ISO)", "jurisdiction": "Global (standards body)", "role": "Publishes the consensus management-system standards (9001 quality, 14001 environment, 45001 safety) and thousands of technical standards that industry certifies to as a condition of doing business."}, {"name": "ASME / ASTM International", "jurisdiction": "US/Global (standards bodies)", "role": "ASME writes the Boiler & Pressure Vessel Code and mechanical standards; ASTM sets materials and test-method standards — consensus bodies whose codes are adopted into law and contract."}, {"name": "National Association of Manufacturers / American Chemistry Council", "jurisdiction": "US (industry associations)", "role": "Industry self-regulatory and advocacy bodies; the ACC's Responsible Care program imposes environmental, health, safety, and security management requirements on member chemical makers."}, {"name": "SEMI", "jurisdiction": "Global (industry association / standards)", "role": "The semiconductor industry association that publishes SEMI standards for equipment interfaces, materials, and fab safety, self-governing the microelectronics manufacturing supply chain."}]}, "groundView": {"orgModel": "A typical manufacturer is governed by a board and led by a CEO over functional chiefs — COO/Chief Manufacturing Officer, CFO, Chief Technology/Engineering Officer, Chief Supply Chain Officer, Chief Quality Officer, and General Counsel — with the enterprise often split into product divisions or business units each carrying its own P&L. The operating heart is the plant: a plant manager runs each factory, beneath whom sit production/operations managers, process and manufacturing engineers, quality and maintenance managers, and supply-chain/materials planners. The shop floor is organized into value streams or lines led by shift supervisors and team leads directing machine operators, assemblers, CNC machinists, welders, maintenance technicians, and material handlers. Overlaid are staff functions — R&D/product engineering, procurement, EHS, and continuous-improvement (lean/Six Sigma) — that matrix into every plant.", "positions": [{"title": "Board of Directors / Chair", "level": "Governance", "reportsTo": "Shareholders", "duties": "Approves strategy, major capital investments (new plants, product programs), and risk policy, and holds management accountable for returns and safety. Measured on shareholder value and avoidance of catastrophic operational or product failures.", "credentials": "Senior industry, engineering, or financial executives; audit and technical committee expertise.", "socCode": "11-1011"}, {"title": "Chief Executive Officer", "level": "Executive", "reportsTo": "Board of Directors", "duties": "Sets corporate strategy, allocates capital across divisions, and owns total P&L, product roadmap, and safety culture. Measured on revenue, operating margin, ROIC, and market share.", "credentials": "Engineering or business degree, MBA common, decades of operating experience.", "socCode": "11-1011"}, {"title": "Chief Operating Officer / Chief Manufacturing Officer", "level": "Executive", "reportsTo": "CEO", "duties": "Owns the global manufacturing network, capacity, and operational performance, driving cost, quality, and delivery. Measured on OEE, unit cost, on-time delivery, and safety.", "credentials": "Industrial/mechanical engineering degree, lean/Six Sigma mastery, plant-leadership track record.", "socCode": "11-1021"}, {"title": "Chief Technology / Engineering Officer", "level": "Executive", "reportsTo": "CEO", "duties": "Directs R&D and product engineering, owns the technology roadmap and IP, and governs product design decisions. Measured on new-product success, R&D productivity, and patents.", "credentials": "Advanced engineering or science degree (often PhD), extensive product-development experience.", "socCode": "11-9041"}, {"title": "Chief Supply Chain Officer", "level": "Executive", "reportsTo": "CEO / COO", "duties": "Owns procurement, logistics, and materials planning across the tiered supplier base, managing cost, resilience, and inventory. Measured on total landed cost, supply continuity, and working capital.", "credentials": "Supply-chain/engineering degree, MBA, APICS/CSCP certification.", "socCode": "11-3071"}, {"title": "Plant Manager", "level": "Management", "reportsTo": "COO / VP Operations", "duties": "Runs a single factory's full operation — production, quality, maintenance, safety, and cost — as a mini-P&L. Measured on output, unit cost, quality (PPM defects), and safety (incident rate).", "credentials": "Engineering degree, 10-15 years' manufacturing experience, lean leadership.", "socCode": "11-3051"}, {"title": "Manufacturing / Process Engineer", "level": "Professional", "reportsTo": "Engineering Manager", "duties": "Designs, optimizes, and troubleshoots production processes, tooling, and line layouts to raise yield and cut cost. Measured on cycle time, yield, scrap reduction, and successful launches.", "credentials": "Industrial/mechanical/chemical engineering degree; Six Sigma; process-simulation skills.", "socCode": "17-2112"}, {"title": "Quality Manager / Quality Engineer", "level": "Professional", "reportsTo": "Chief Quality Officer / Plant Manager", "duties": "Owns the quality management system, inspection, supplier quality, and corrective action, ensuring product meets spec and standards. Measured on defect rates, customer returns, and audit results.", "credentials": "Engineering degree, ASQ CQE/CQM certification, knowledge of ISO 9001/IATF 16949.", "socCode": "17-2112"}, {"title": "R&D / Product Development Engineer", "level": "Professional", "reportsTo": "Engineering Director", "duties": "Designs new products and materials, prototypes, tests, and prepares designs for manufacture. Measured on design performance, time-to-market, and cost targets.", "credentials": "Engineering degree (often MS/PhD), CAD/simulation skills, domain expertise.", "socCode": "17-2141"}, {"title": "Production / Operations Supervisor", "level": "Management", "reportsTo": "Plant Manager", "duties": "Directs a shift or area's production, schedules people and machines, and enforces safety and quality on the floor. Measured on output, downtime, labor efficiency, and incidents.", "credentials": "Technical degree or equivalent experience, lean training, front-line leadership.", "socCode": "51-1011"}, {"title": "Maintenance / Reliability Manager", "level": "Management", "reportsTo": "Plant Manager", "duties": "Owns equipment reliability, preventive/predictive maintenance, and spare parts to maximize uptime. Measured on OEE, mean time between failures, and maintenance cost.", "credentials": "Mechanical/electrical engineering or trade background, CMRP certification.", "socCode": "49-1011"}, {"title": "EHS (Environment, Health & Safety) Manager", "level": "Management", "reportsTo": "Plant Manager / Corporate EHS", "duties": "Manages OSHA/EPA compliance, process safety, and environmental permits at the plant, driving injury and emission reduction. Measured on incident rate, compliance, and permit adherence.", "credentials": "Safety/environmental science degree, CSP/CIH certification, regulatory knowledge.", "socCode": "11-9199"}, {"title": "Industrial / Manufacturing Engineer (Continuous Improvement)", "level": "Professional", "reportsTo": "Operations Manager", "duties": "Runs lean/Six Sigma projects, time-and-motion studies, and layout optimization to raise throughput and cut waste. Measured on productivity gains and cost savings delivered.", "credentials": "Industrial engineering degree, Six Sigma Black Belt, data-analysis skills.", "socCode": "17-2112"}, {"title": "Production Planner / Scheduler", "level": "Professional", "reportsTo": "Supply Chain / Operations Manager", "duties": "Plans production schedules and material requirements (MRP) to balance demand, capacity, and inventory. Measured on schedule attainment, inventory turns, and stockouts.", "credentials": "Supply-chain/business degree, APICS/CPIM certification, ERP proficiency.", "socCode": "13-1081"}, {"title": "CNC Machinist", "level": "Operational", "reportsTo": "Production Supervisor", "duties": "Sets up, programs, and operates computer-controlled machine tools to cut metal parts to tight tolerance, inspecting output. Measured on parts per hour, dimensional accuracy, and scrap.", "credentials": "Machining apprenticeship or technical certificate, blueprint reading, GD&T, NIMS certification.", "socCode": "51-4041"}, {"title": "Welder / Fabricator", "level": "Operational", "reportsTo": "Production Supervisor", "duties": "Joins metal components by MIG/TIG/arc welding to code, fabricating assemblies and structures. Measured on weld quality (passing inspection), throughput, and rework.", "credentials": "Welding certification (AWS), technical training, code knowledge.", "socCode": "51-4121"}, {"title": "Assembly Line Worker / Assembler", "level": "Operational", "reportsTo": "Line Supervisor", "duties": "Assembles components into finished products at a workstation to standard work instructions, checking quality. Measured on takt-time adherence, quality, and safety.", "credentials": "Entry-level with on-the-job training; some roles require technical certificates.", "socCode": "51-2092"}, {"title": "Process / Chemical Plant Operator", "level": "Operational", "reportsTo": "Shift Supervisor", "duties": "Monitors and controls continuous-process units (reactors, distillation, furnaces) from control rooms and the field, maintaining safe operating parameters. Measured on throughput, product quality, and safe operation.", "credentials": "Process-technology associate degree or plant training; hazmat and PSM training.", "socCode": "51-8091"}, {"title": "Maintenance / Industrial Mechanic (Millwright)", "level": "Operational", "reportsTo": "Maintenance Supervisor", "duties": "Installs, repairs, and maintains machinery, pumps, and conveyors, diagnosing mechanical and electrical faults. Measured on repair speed, uptime, and preventive-maintenance completion.", "credentials": "Millwright/industrial-maintenance apprenticeship, mechanical and electrical skills.", "socCode": "49-9041"}, {"title": "Machine Operator / Material Handler", "level": "Operational", "reportsTo": "Production Supervisor", "duties": "Operates production machines and moves materials and finished goods through the plant, feeding lines and staging inventory. Measured on machine uptime, throughput, and safe handling.", "credentials": "Entry-level; forklift certification; on-the-job training.", "socCode": "51-9111"}]}}, {"id": "technology", "name": "Technology", "icon": "💻", "tagline": "The design of computation, software, and networks that automate and augment every other domain.", "view100k": {"role": "Technology, in the information-and-computing sense, is the domain that builds the digital machinery of civilization: the semiconductors and hardware, the operating systems and applications, the cloud data centers, the internet and its platforms, the IT services that integrate them, and now the artificial-intelligence systems layered on top. Its function is to capture, transmit, store, and process information and to automate cognitive and coordination work — turning transistors into logic, logic into software, and software into the connective tissue that runs finance, commerce, media, governance, and science. It exists because information processing has become the highest-leverage input to productivity: a marginal software copy costs nearly nothing yet can serve billions, giving the sector extreme scale economies, winner-take-most dynamics, and network effects unmatched by any physical industry.\n\nThe scale is staggering and growing. Global spending on information technology runs on the order of $5 trillion per year, and the digital economy is estimated to be 15% or more of world GDP. A handful of technology firms are among the most valuable enterprises ever created, several exceeding a trillion dollars in market capitalization; the semiconductor industry alone is roughly $600 billion in annual sales and underpins essentially all of it. Employment is concentrated in high-wage software, engineering, and IT-services roles — several tens of millions of professionals worldwide — and the sector commands the largest share of private R&D and venture capital of any domain.\n\nThe historical arc runs from the mainframe era (IBM, the 1950s-60s), through the minicomputer and then the personal-computer and packaged-software revolutions (Intel, Microsoft, Apple, the 1970s-90s), the rise of the commercial internet and the web (Netscape, Google, Amazon), the mobile and cloud era (the smartphone, AWS, the shift from owning to renting computing), the platform and social-media age, and now the generative-AI wave built on massive models and specialized accelerators. The defining tensions of the moment are the concentration of platform power (and the antitrust and content-moderation debates it provokes), data privacy and security, the geopolitics of semiconductors and export controls, and the economic and safety implications of increasingly capable AI.", "interdependencies": "Technology is the universal automation layer that now permeates the other nineteen domains. It runs on Energy (data centers and fabs are enormous power consumers) and on Infrastructure (fiber, towers, data-center buildings), and it is built from the products of Industry (the fabs, servers, and devices that Technology designs but Industry manufactures). It is funded by Finance and venture capital more than any other sector, and it in turn digitizes Finance itself (fintech, trading, payments). It commercializes the discoveries of Science and depends on Education to supply engineering talent. Technology powers Communication (the internet, platforms), Trade (e-commerce, logistics software), Medicine (health IT, bioinformatics), Governance (e-government, digital ID), Intelligence and Defense (cyber, surveillance, autonomous systems), and Culture (streaming, gaming, social media). It is disciplined by Law (IP, privacy, antitrust) and increasingly implicated in Environment (energy use, e-waste) and Population (labor displacement). Nearly every domain now has a software layer, and Technology supplies it.", "regulationModel": "Technology has historically been lightly regulated at the product level but is rapidly acquiring binding rules. Market conduct and consumer protection are policed by the FTC (privacy, data security, unfair practices) and by antitrust enforcers (FTC and DOJ in the US, the European Commission's DG COMP, and China's SAMR); the EU's Digital Markets Act and Digital Services Act now impose platform-specific obligations. Data protection is governed by the EU's GDPR and a patchwork of US state laws (notably California's CCPA/CPRA), and the EU AI Act creates the first comprehensive AI risk regime. Cybersecurity and critical-infrastructure protection involve CISA and NIST (whose Cybersecurity Framework is a de facto standard), while export controls (the Commerce Department's Bureau of Industry and Security) govern advanced chips and tools. Uniquely, much of the domain governs itself through open, consensus standards bodies and multistakeholder governance: the IETF (internet protocols), the W3C (the web), IEEE (hardware and networking standards), ICANN (domain names and IP addresses), ISO/IEC JTC 1 (IT standards), and industry consortia. Market discipline, open-source community norms, app-store gatekeeping, and voluntary responsible-AI commitments round out a still-evolving governance model."}, "view10k": {"overview": "In NAICS, technology spans several sectors: computer and electronic product manufacturing (334, including semiconductors 334413 and computers 334111), the Information sector's software publishing (5132) and data processing/hosting (518), the internet and web-search platforms and other information services (519), and the professional-services sector's computer systems design and related services (5415) plus custom programming. Firms cluster into distinct layers — semiconductor and hardware makers, software product companies (packaged and SaaS), cloud/infrastructure providers (hyperscalers), internet platforms, and IT services/consulting integrators — each with different economics but all sharing high R&D intensity, scalability, and rapid product cycles.", "businessTypes": [{"name": "Semiconductor Designer (Fabless)", "naics": "334413", "definition": "Firms that design integrated circuits but outsource fabrication to foundries.", "operations": "They invest heavily in chip design and IP, selling processors, GPUs, and accelerators at high margins while foundries bear the capital of fabs; success depends on architecture, design wins, and software ecosystems. R&D and IP, not factories, are the asset.", "regulation": "Export controls (BIS) on advanced chips, FTC on conduct; self-regulation via JEDEC memory standards, PCI-SIG, and IEEE.", "examples": "NVIDIA, Qualcomm, AMD, Broadcom"}, {"name": "Computer & Consumer Electronics Hardware Maker", "naics": "334111, 334220", "definition": "Firms that design and sell computers, smartphones, and networking hardware.", "operations": "They design integrated hardware-plus-software products, outsource assembly, and earn margin on premium devices and attached services/ecosystems; brand, design, and supply-chain scale are decisive. Product cycles and ecosystem lock-in drive recurring value.", "regulation": "FCC (RF emissions), CPSC/UL (safety), FTC (warranty/repair); self-regulation via IEEE, USB-IF, Wi-Fi Alliance, and Bluetooth SIG standards.", "examples": "Apple, Dell, HP, Cisco"}, {"name": "Enterprise Software / SaaS Company", "naics": "513210", "definition": "Firms that develop and license business application and platform software, increasingly as cloud subscriptions.", "operations": "They build software once and sell recurring subscriptions to many customers, earning high gross margins on near-zero marginal copy cost; net revenue retention, churn, and R&D efficiency drive value. Land-and-expand sales and platform stickiness compound growth.", "regulation": "FTC (privacy/security), GDPR/CCPA for data; SOX-relevant for public firms; self-regulation via SOC 2 audits, ISO 27001, and industry security frameworks.", "examples": "Microsoft, Salesforce, SAP, ServiceNow"}, {"name": "Cloud / Hyperscale Infrastructure Provider", "naics": "518210", "definition": "Firms that operate large data-center fleets and rent compute, storage, and services on demand.", "operations": "They build and operate global data centers, renting elastic infrastructure (IaaS/PaaS) at utility-like scale, earning margin on utilization and higher-level managed services; capex and energy are enormous but scale economies are decisive. Utilization, efficiency, and service breadth drive returns.", "regulation": "FTC, sector data-residency and sovereignty rules, FedRAMP for government; self-regulation via SOC 2, ISO 27001/27017, and CSA STAR.", "examples": "Amazon Web Services, Microsoft Azure, Google Cloud"}, {"name": "Internet Platform / Marketplace", "naics": "519290, 459110", "definition": "Firms that operate two-sided digital platforms — search, social, marketplaces, or app stores — monetized by advertising or transaction fees.", "operations": "They aggregate users and third parties, earning revenue from advertising, commissions, or fees, with strong network effects and near-zero marginal cost; engagement, take rate, and ad targeting drive value. Data and network effects create winner-take-most dynamics.", "regulation": "FTC/DOJ and EU (DMA/DSA) antitrust and content rules, GDPR for data, Section 230 in the US; self-regulation via content-moderation policies and industry ad standards (IAB).", "examples": "Google (Alphabet), Meta, Amazon Marketplace, Apple App Store"}, {"name": "IT Services & Systems Integration", "naics": "541512, 541511", "definition": "Firms that design, build, integrate, and manage IT systems and custom software for clients.", "operations": "They sell people-based services — consulting, custom development, systems integration, and managed services — billed by time-and-materials or fixed price; utilization, bill rates, and delivery efficiency drive margin. Offshore labor arbitrage and platform partnerships are core levers.", "regulation": "FTC and client-sector rules (HIPAA, PCI-DSS); self-regulation via CMMI maturity, ISO 27001, and ITIL practice standards.", "examples": "Accenture, Tata Consultancy Services, Infosys, IBM Consulting"}, {"name": "Cybersecurity Vendor", "naics": "541512, 513210", "definition": "Firms that provide security software and services to defend systems, networks, and data.", "operations": "They sell security products (endpoint, network, identity, cloud) and monitoring/response services, often as subscriptions, earning recurring revenue tied to threat evolution; efficacy, detection rates, and threat intelligence drive value. The market grows with the attack surface.", "regulation": "FTC, CISA guidance, sector mandates (NYDFS, GLBA); self-regulation via NIST CSF, ISO 27001, Common Criteria, and FIRST/threat-sharing norms.", "examples": "Palo Alto Networks, CrowdStrike, Fortinet, Microsoft Security"}, {"name": "Artificial Intelligence / Foundation Model Lab", "naics": "541715, 513210", "definition": "Firms that research and build large AI models and offer them as products or APIs.", "operations": "They train large models on massive compute and data, monetizing via APIs, subscriptions, and enterprise deals; compute cost, model capability, and safety/alignment drive both cost and value. Talent, data, and GPU access are the scarce inputs.", "regulation": "Emerging EU AI Act, FTC on deceptive/unfair AI, export controls on compute; self-regulation via voluntary safety commitments, model cards, red-teaming, and NIST AI RMF.", "examples": "OpenAI, Anthropic, Google DeepMind, Mistral"}, {"name": "Data Center Operator / Colocation", "naics": "518210", "definition": "Firms that build and lease physical data-center space, power, and cooling to tenants.", "operations": "They develop and operate secure, powered, cooled facilities, leasing space and interconnection to cloud, enterprise, and network tenants; power availability, uptime (SLA), and location drive value. The business is a hybrid of real estate and utility.", "regulation": "Local building/energy codes, FERC-adjacent power interconnection; self-regulation via Uptime Institute Tier certification and SOC 2.", "examples": "Equinix, Digital Realty, NTT"}, {"name": "Fintech / Payments Technology", "naics": "522320, 518210", "definition": "Firms that build software rails for payments, lending, and financial services.", "operations": "They process transactions or provide financial software, earning fees per transaction or subscription; scale, reliability, and regulatory licenses drive economics. They bridge Technology and Finance.", "regulation": "FTC, CFPB, and banking regulators; PCI-DSS for card data, KYC/AML rules; self-regulation via PCI Security Standards Council.", "examples": "Stripe, PayPal, Block (Square), Adyen"}, {"name": "Electronic Design Automation (EDA) & IP", "naics": "513210", "definition": "Firms that provide the software tools and reusable design IP used to design chips.", "operations": "They license the essential software and IP cores that chip designers use, earning high-margin recurring license and royalty revenue; the business is a small, high-value oligopoly critical to the whole semiconductor chain. Tool sophistication is the moat.", "regulation": "Export controls (BIS) on advanced-node tools; self-regulation via IEEE and interoperability standards.", "examples": "Synopsys, Cadence, Arm, Siemens EDA"}, {"name": "Consumer Internet / Streaming & Gaming", "naics": "512250, 513210, 519290", "definition": "Firms that deliver digital entertainment — streaming media, games, and apps — over the internet.", "operations": "They produce or aggregate digital content and monetize via subscriptions, in-app purchases, or advertising, with high fixed content cost and near-zero marginal delivery cost; engagement and retention drive value. Content and network effects are the battleground.", "regulation": "FTC (children's privacy/COPPA, ads), copyright law; self-regulation via ESRB game ratings and content policies.", "examples": "Netflix, Spotify, Roblox, Electronic Arts"}], "regulators": [{"name": "Federal Trade Commission (FTC)", "jurisdiction": "US", "role": "Polices unfair and deceptive practices, data privacy and security lapses, and (with the DOJ) antitrust conduct across technology markets, and increasingly scrutinizes AI and platform behavior."}, {"name": "European Commission (DG COMP / DMA & DSA)", "jurisdiction": "EU", "role": "Enforces competition law and the Digital Markets Act (gatekeeper obligations) and Digital Services Act (platform content and transparency duties), plus GDPR-adjacent oversight — the world's most assertive tech regulator."}, {"name": "National Institute of Standards and Technology (NIST)", "jurisdiction": "US (standards body)", "role": "Publishes the widely adopted Cybersecurity Framework, cryptographic standards (FIPS), and the AI Risk Management Framework — voluntary standards that function as de facto rules."}, {"name": "Internet Engineering Task Force (IETF)", "jurisdiction": "Global (standards body / SRO)", "role": "Develops and maintains the core internet protocol standards (TCP/IP, HTTP, TLS, DNS) through open consensus RFCs — self-governance of the internet's technical foundations."}, {"name": "World Wide Web Consortium (W3C)", "jurisdiction": "Global (standards body)", "role": "Develops open web standards (HTML, CSS, accessibility/WCAG, web APIs) that keep the web interoperable across browsers and devices."}, {"name": "ICANN", "jurisdiction": "Global (governance body)", "role": "Coordinates the internet's domain name system and IP-address allocation, governing the unique identifiers that make the global internet function."}, {"name": "IEEE / ISO-IEC JTC 1", "jurisdiction": "Global (standards bodies)", "role": "IEEE sets hardware and networking standards (e.g., 802.11 Wi-Fi, 802.3 Ethernet); ISO/IEC JTC 1 sets IT standards including ISO 27001 information security — consensus technical governance."}, {"name": "Cybersecurity and Infrastructure Security Agency (CISA)", "jurisdiction": "US", "role": "Coordinates national cyber defense, issues advisories and directives, and protects critical digital infrastructure against threats."}]}, "groundView": {"orgModel": "A typical technology company is governed by a board and led by a CEO over a C-suite that reflects the domain's software-centric nature: a CTO and/or Chief Product Officer, a CFO, a Chief Information Security Officer, a VP of Engineering, a Chief Revenue/Marketing Officer, and a General Counsel. The core organization is Engineering and Product, structured as cross-functional teams (squads/pods) each pairing a product manager, an engineering manager, software engineers, designers, and data scientists around a product area or service, supported by platform/infrastructure and site-reliability teams that keep systems running. Around this sit go-to-market (sales, marketing, customer success), operations, and G&A functions. Hardware and semiconductor firms add design, verification, and manufacturing-liaison organizations; the reporting ladder runs from board to CEO to VPs to directors to engineering/product managers to individual contributors organized by seniority (junior, senior, staff, principal).", "positions": [{"title": "Board of Directors / Chair", "level": "Governance", "reportsTo": "Shareholders", "duties": "Approves strategy, major investments and acquisitions, and risk and compensation policy, and holds the CEO accountable for growth and governance. Measured on shareholder value and sound oversight.", "credentials": "Senior tech executives, investors, and domain experts; audit and technology committee expertise.", "socCode": "11-1011"}, {"title": "Chief Executive Officer", "level": "Executive", "reportsTo": "Board of Directors", "duties": "Sets vision and strategy, allocates capital, hires the executive team, and owns growth, culture, and major customer and investor relationships. Measured on revenue growth, profitability, and market position.", "credentials": "Often technical founder or seasoned operator; CS/engineering or business background; scaling experience.", "socCode": "11-1011"}, {"title": "Chief Technology Officer", "level": "Executive", "reportsTo": "CEO", "duties": "Owns technology strategy, architecture direction, and R&D, and represents the firm's technical vision internally and externally. Measured on technical roadmap delivery, platform scalability, and innovation.", "credentials": "Advanced CS/engineering background, deep architecture experience, often prior founder/principal engineer.", "socCode": "11-3021"}, {"title": "Chief Product Officer", "level": "Executive", "reportsTo": "CEO", "duties": "Owns product strategy and the roadmap across the portfolio, aligning engineering, design, and go-to-market to customer needs. Measured on product-market fit, adoption, and revenue from new products.", "credentials": "Product-management leadership track record, technical fluency, often MBA or CS degree.", "socCode": "11-2021"}, {"title": "Chief Information Security Officer (CISO)", "level": "Executive", "reportsTo": "CEO / CTO", "duties": "Owns cybersecurity strategy, risk, and compliance, protecting systems, data, and customers from threats. Measured on breach prevention, incident response, and audit/compliance posture.", "credentials": "Security background, CISSP/CISM certification, incident-response and governance experience.", "socCode": "11-3021"}, {"title": "VP of Engineering", "level": "Executive", "reportsTo": "CTO / CEO", "duties": "Leads the engineering organization, owning delivery, quality, headcount, and engineering culture and process. Measured on velocity, reliability, and successful shipping at quality.", "credentials": "CS/engineering degree, extensive software-leadership experience, org-scaling skill.", "socCode": "11-9041"}, {"title": "Engineering Director / Manager", "level": "Management", "reportsTo": "VP of Engineering", "duties": "Manages several engineering teams or a domain, owning execution, staffing, and technical direction for their area. Measured on team output, reliability, and people development.", "credentials": "CS degree, senior engineering experience, people-management skills.", "socCode": "11-9041"}, {"title": "Product Manager", "level": "Professional", "reportsTo": "Director of Product / CPO", "duties": "Defines what to build and why, owns the roadmap and backlog for a product area, and coordinates engineering, design, and go-to-market. Measured on adoption, retention, and business outcomes of features.", "credentials": "Technical or business degree, product experience, data and user-research fluency.", "socCode": "11-2021"}, {"title": "Staff / Principal Software Engineer", "level": "Professional", "reportsTo": "Engineering Manager / Director", "duties": "Sets technical direction for major systems, designs architecture, and mentors engineers while writing critical code. Measured on system design quality, technical impact, and reliability.", "credentials": "CS degree, 10+ years' experience, deep systems and architecture expertise.", "socCode": "15-1252"}, {"title": "Software Engineer / Developer", "level": "Professional", "reportsTo": "Engineering Manager", "duties": "Designs, writes, tests, and maintains software features and services, participating in code review and on-call. Measured on shipped features, code quality, and reliability.", "credentials": "CS degree or bootcamp/equivalent, proficiency in relevant languages and frameworks.", "socCode": "15-1252"}, {"title": "Site Reliability Engineer / DevOps Engineer", "level": "Professional", "reportsTo": "Engineering Manager / SRE Lead", "duties": "Keeps production systems reliable and scalable, builds CI/CD and observability, automates operations, and responds to incidents. Measured on uptime/SLOs, MTTR, and toil reduction.", "credentials": "CS/engineering degree, systems and cloud expertise, scripting/automation and IaC skills.", "socCode": "15-1244"}, {"title": "Data Scientist / Machine Learning Engineer", "level": "Professional", "reportsTo": "Data/ML Manager", "duties": "Builds models and data pipelines, runs experiments, and turns data into product features and insight. Measured on model performance, experiment impact, and shipped ML features.", "credentials": "Advanced degree in CS/statistics/ML, programming and modeling skills (Python, ML frameworks).", "socCode": "15-2051"}, {"title": "Product Designer / UX Engineer", "level": "Professional", "reportsTo": "Design Manager / Head of Design", "duties": "Designs user experiences and interfaces, researches users, prototypes, and validates usability. Measured on usability, adoption, and design quality.", "credentials": "Design/HCI degree or portfolio, UX research and prototyping (Figma) skills.", "socCode": "27-1024"}, {"title": "Semiconductor / Hardware Design Engineer", "level": "Professional", "reportsTo": "Hardware Engineering Manager", "duties": "Designs and verifies integrated circuits or hardware (RTL, layout, timing, signal integrity), running simulation and tape-out. Measured on design correctness, power/performance/area, and first-pass silicon success.", "credentials": "EE/computer-engineering degree (often MS/PhD), EDA-tool and HDL expertise.", "socCode": "17-2072"}, {"title": "QA / Test Engineer", "level": "Professional", "reportsTo": "Engineering Manager", "duties": "Designs and runs manual and automated tests, builds test frameworks, and gatekeeps release quality. Measured on defect escape rate, test coverage, and release confidence.", "credentials": "CS/engineering degree, test-automation and scripting skills.", "socCode": "15-1253"}, {"title": "IT / Systems Administrator", "level": "Operational", "reportsTo": "IT Manager", "duties": "Provisions, configures, and maintains internal systems, networks, and endpoints, and supports employees. Measured on system availability, ticket resolution, and security hygiene.", "credentials": "IT associate/bachelor degree or certifications (CompTIA, Microsoft, Cisco).", "socCode": "15-1244"}, {"title": "Technical Support / Customer Engineer", "level": "Operational", "reportsTo": "Support Manager", "duties": "Diagnoses and resolves customer technical issues, escalates bugs, and documents solutions. Measured on resolution time, CSAT, and escalation rate.", "credentials": "Technical training or degree, product knowledge, troubleshooting and communication skills.", "socCode": "15-1232"}, {"title": "Data Center Technician", "level": "Operational", "reportsTo": "Data Center Operations Manager", "duties": "Installs, cables, and repairs servers, storage, and network gear in the data hall, replacing failed hardware and maintaining power/cooling. Measured on hardware uptime, ticket turnaround, and safety.", "credentials": "IT/networking certifications, hardware experience, physical-plant knowledge.", "socCode": "49-2011"}, {"title": "Sales Engineer / Solutions Architect", "level": "Professional", "reportsTo": "Sales/Solutions Leader", "duties": "Provides technical expertise in the sales cycle, designs solutions, runs demos and proofs of concept, and helps close deals. Measured on technical win rate and influenced revenue.", "credentials": "Technical degree, product and architecture expertise, customer-facing skills.", "socCode": "41-9031"}, {"title": "Account Executive / Sales Representative", "level": "Operational", "reportsTo": "Sales Manager", "duties": "Sells software and services to prospects and existing accounts, manages the pipeline, and closes deals. Measured on quota attainment, bookings, and pipeline health.", "credentials": "Business degree common; SaaS sales experience; CRM proficiency.", "socCode": "41-4011"}]}}, {"id": "science", "name": "Science", "icon": "🔬", "tagline": "The organized production of reliable knowledge — and the R&D, labs, and metrology that turn it into capability.", "view100k": {"role": "Science, as a civilization domain, is the institutionalized production, validation, and diffusion of reliable knowledge about the natural and physical world, together with the research-and-development enterprise that converts that knowledge into new capabilities. It spans basic research (understanding for its own sake), applied research (knowledge aimed at a use), and experimental development (turning findings into products and processes), carried out in universities, national laboratories, government agencies, contract research organizations, and corporate R&D. Its function is to expand the frontier of what is known and doable — new drugs, materials, energy technologies, measurement standards, and understanding of everything from genomes to galaxies — and to supply the trained minds, instruments, and standards on which every technical domain depends. Science exists because knowledge is a public good with enormous positive spillovers that private markets under-invest in, so society funds and organizes research collectively.\n\nThe scale is large and strategically decisive. Global spending on research and development is on the order of $2.5 trillion per year — roughly 2.3% of world GDP — led by the United States (~3.5% of GDP), China, Japan, Germany, and South Korea; the US alone spends close to $900 billion annually across business (the majority), universities, and government. Employment includes several million researchers worldwide plus a vast supporting workforce of technicians, lab staff, and research administrators. The metrology and standards infrastructure — the national measurement institutes that define the kilogram, second, and volt — quietly underpins an estimated large share of GDP by making trade, manufacturing, and science mutually intelligible.\n\nThe historical arc runs from natural philosophy and the Scientific Revolution (the experimental method, the Royal Society, 1660), through the professionalization of science and the German research university in the 19th century, the rise of the industrial research lab (Edison, Bell Labs) and 'big science' in the 20th century (the Manhattan Project, national labs, CERN, the space program, the genome), the post-war social contract in which governments fund basic research for long-run payoff, and now an era of globalized, collaborative, data- and instrument-intensive science, contract research, and intense competition over strategic technologies. The defining tensions are basic versus applied priorities, reproducibility and research integrity, open versus proprietary knowledge, and the geopolitics of scientific and technological leadership.", "interdependencies": "Science is the knowledge wellspring feeding the other nineteen domains, and it depends on them for resources and problems. It is funded by Finance and Governance (public research budgets, grants) and equipped by Industry and Technology (scientific instruments, computing, reagents) while in turn generating the discoveries those domains commercialize. It supplies Medicine with the biomedical research behind drugs and diagnostics, Energy with new materials and reactor and battery science, Agriculture with crop and soil science, Environment with climate and ecological science, and Defense with strategic R&D. It is inseparable from Education (universities are the joint home of teaching and research and the pipeline of researchers) and from Communication (scholarly publishing, peer review, dissemination). Its metrology and standards work underpins Trade and Industry by making measurements comparable worldwide; its methods discipline Intelligence and policy analysis; and it both informs and is shaped by Law (IP, research ethics), Culture (the authority of science), and even Religion (the long dialogue over knowledge and meaning). Nearly every advance in the other domains traces back to research done here.", "regulationModel": "Science governs itself primarily through professional and institutional mechanisms rather than a single market regulator, layered with government rules where research touches safety, ethics, or public funds. The defining self-regulatory mechanism is peer review — of grant proposals (by bodies like the NIH and NSF) and of publications — reinforced by professional societies, journal editorial standards, and research-integrity offices. Human-subjects research is governed by Institutional Review Boards under the Common Rule and, for drugs, by the FDA; animal research by IACUCs and the USDA/OLAW; biosafety by NIH and CDC guidelines and Institutional Biosafety Committees; and research using federal funds by agency policy and, for misconduct, the Office of Research Integrity. Standards and metrology are the province of national measurement institutes (NIST in the US, and internationally the BIPM/CGPM that maintain the SI units) and accreditation bodies (ISO/IEC 17025 for laboratory competence). Export controls and biosecurity rules constrain sensitive research. Over all of this sits the norm-based governance of the scientific community itself — reproducibility expectations, data-sharing mandates, conflict-of-interest disclosure, and reputational discipline — which polices quality more continuously than any statute."}, "view10k": {"overview": "In NAICS, the research enterprise centers on Sector 5417 (Scientific Research and Development Services) — subdivided into research in biotechnology (541714), the physical, engineering, and life sciences (541715), and the social sciences and humanities (541720) — together with testing laboratories (541380), professional and scientific instrument manufacturing (334516, 334510), and the research functions embedded in universities (Sector 6113) and government. The domain organizes into performers (universities, national labs, government agencies, corporate R&D, and independent/contract research institutes) and funders (government agencies, foundations, and industry), plus the instrument makers, contract labs, and standards/metrology institutes that supply the tools and the measurement backbone. R&D intensity, reliance on grants and contracts, and reputation-based competition characterize the sector.", "businessTypes": [{"name": "Research University", "naics": "611310", "definition": "Institutions that jointly perform research and educate researchers, hosting labs across all disciplines.", "operations": "They fund research largely through competitive federal grants and contracts (plus endowment and tuition), running principal-investigator labs and recovering indirect costs; success is measured by grants won, publications, and discoveries. Faculty compete for funding and prestige as the currency of the enterprise.", "regulation": "Governed by federal grant rules (Uniform Guidance), IRB/IACUC oversight, and accreditation; self-regulation via peer review, tenure, and AAU/faculty governance norms.", "examples": "MIT, Stanford, University of Cambridge, ETH Zürich"}, {"name": "National Laboratory / Government Research Institute", "naics": "541715", "definition": "Government-owned research establishments performing mission and big-science research.", "operations": "They execute large, long-horizon and often classified or infrastructure-scale research (fusion, particle physics, energy, defense) funded by government appropriations, frequently run by contractors (GOCO model); measured by mission delivery and scientific output. They operate unique national facilities (accelerators, supercomputers).", "regulation": "Overseen by sponsoring agencies (DOE, NASA), safety and security rules, and export controls; self-regulation via peer review and scientific advisory committees.", "examples": "Los Alamos, Oak Ridge, CERN, Fraunhofer institutes"}, {"name": "Contract Research Organization (CRO)", "naics": "541714, 541715", "definition": "Firms that conduct research and clinical trials on contract for pharma, biotech, and industry.", "operations": "They sell research services — preclinical studies, clinical-trial management, lab testing — on a fee or milestone basis, earning margin on scientific labor and infrastructure; utilization, quality, and regulatory track record drive value. They let sponsors outsource R&D capacity.", "regulation": "FDA/EMA Good Clinical/Laboratory Practice (GCP/GLP), IRB oversight; self-regulation via ISO accreditation and industry (ACRO) standards.", "examples": "IQVIA, Labcorp Drug Development, ICON, Charles River Laboratories"}, {"name": "Biotechnology Research Company", "naics": "541714", "definition": "Firms conducting research to discover and develop biological products, therapies, and platforms.", "operations": "They invest heavily in discovery research, funded by venture capital, partnerships, and public markets, aiming to create IP and drug candidates before revenue; scientific milestones and pipeline progression drive valuation. Most are pre-revenue and burn capital toward breakthroughs.", "regulation": "FDA for eventual products, NIH biosafety guidelines, IBC oversight; self-regulation via peer-reviewed publication and BIO industry norms.", "examples": "Genentech (research), Moderna, Regeneron, Illumina (platform)"}, {"name": "Corporate R&D / Industrial Research Lab", "naics": "541715", "definition": "In-house research divisions of corporations that develop new products, materials, and processes.", "operations": "They perform applied research and development aligned to the parent's strategy, funded from corporate budgets, converting science into proprietary products and patents; measured by innovation pipeline and IP generated. They capture spillovers internally rather than publishing openly.", "regulation": "Governed by the parent's sector regulators, safety rules, and IP law; self-regulation via internal review and trade-secret protection.", "examples": "IBM Research, Bell Labs (historical), Samsung Advanced Institute, 3M"}, {"name": "Scientific Instrument Manufacturer", "naics": "334516, 334510", "definition": "Firms that design and build the instruments and analytical equipment used in research and industry.", "operations": "They engineer and sell precision instruments (spectrometers, microscopes, sequencers, chromatographs) plus consumables and service, earning margin on hardware and a lucrative recurring aftermarket; performance, precision, and installed-base lock-in drive value. The razor-and-blades model dominates.", "regulation": "FDA for clinical/diagnostic instruments, CE/UL for safety; self-regulation via ISO measurement and calibration standards.", "examples": "Thermo Fisher Scientific, Agilent Technologies, Danaher, Bruker"}, {"name": "Testing, Inspection & Certification (TIC) Laboratory", "naics": "541380", "definition": "Independent labs that test and certify materials, products, and samples against standards.", "operations": "They run analytical and physical testing on samples for fees, providing independent verification and certification; accreditation, turnaround, and impartiality drive value. They are trusted third parties enabling trade and safety.", "regulation": "ISO/IEC 17025 accreditation (via bodies like A2LA), sector rules (FDA, EPA); self-regulation via accreditation and impartiality requirements.", "examples": "SGS, Bureau Veritas, Intertek, Eurofins"}, {"name": "Metrology / Standards & Calibration Institute", "naics": "541380, 541990", "definition": "Bodies that maintain measurement standards and provide calibration traceable to national references.", "operations": "National metrology institutes realize the SI units and disseminate them through calibration services; commercial calibration labs provide traceable calibration to industry for fees. Measurement accuracy and traceability are the product.", "regulation": "Coordinated internationally by the BIPM/CGPM and nationally by NIST; accredited to ISO/IEC 17025; self-regulation via inter-laboratory comparisons.", "examples": "NIST, PTB (Germany), NPL (UK), Fluke Calibration"}, {"name": "Nonprofit Research Institute / Foundation", "naics": "541715, 813211", "definition": "Independent, mission-driven institutes and funders that perform or fund research outside universities.", "operations": "They perform focused research (often biomedical or applied) or fund it through grants, financed by endowments, donations, and contracts; measured by scientific impact and mission advancement. They fill gaps between academia, government, and industry.", "regulation": "Nonprofit and grant compliance (IRS, funder rules), IRB/IACUC where applicable; self-regulation via peer review and scientific boards.", "examples": "Howard Hughes Medical Institute, Broad Institute, Wellcome Trust, SRI International"}, {"name": "Scientific & Technical Publisher / Data Service", "naics": "513120, 519290", "definition": "Firms that publish peer-reviewed research and provide scientific databases and analytics.", "operations": "They manage peer review and disseminate research via subscriptions, article-processing charges, and data/analytics products, earning high margins on scholarly content; reputation of journals and datasets drives value. They operate the certification and archiving layer of science.", "regulation": "Copyright and open-access mandates from funders; self-regulation via COPE (publication ethics) and editorial peer-review standards.", "examples": "Elsevier, Springer Nature, Wiley, Clarivate"}, {"name": "Independent / Academic Core Facility & Field Station", "naics": "541715", "definition": "Shared research infrastructure — genomics cores, microscopy centers, observatories, and field stations.", "operations": "They provide specialized equipment and expertise as a shared service to many researchers, recovering cost through user fees and grants; utilization and technical quality drive sustainability. They pool expensive instruments across the community.", "regulation": "Institutional oversight, biosafety and radiation rules, ISO methods; self-regulation via user committees and quality control.", "examples": "University genomics and cryo-EM cores, Mauna Kea observatories, marine field stations"}, {"name": "Think Tank / Social & Policy Research Organization", "naics": "541720, 541611", "definition": "Institutions conducting social-science, economic, and policy research to inform decisions.", "operations": "They produce research reports, analysis, and evaluations funded by grants, contracts, and donors, monetizing expertise and influence rather than products; credibility and reach drive value. They apply scientific method to social and policy questions.", "regulation": "Nonprofit/lobbying rules, funder disclosure; self-regulation via peer review and transparency/methodology standards.", "examples": "RAND Corporation, Brookings Institution, NBER, Pew Research Center"}], "regulators": [{"name": "National Institutes of Health / National Science Foundation (NIH / NSF)", "jurisdiction": "US", "role": "Primary federal funders of biomedical and basic research; they set grant policy, run peer review, and enforce research-integrity, biosafety, and human/animal-subjects requirements as conditions of funding."}, {"name": "Food and Drug Administration (FDA)", "jurisdiction": "US", "role": "Regulates research on drugs, biologics, and devices — Good Clinical/Laboratory Practice, investigational-new-drug approvals, and clinical-trial oversight — governing translational and clinical science."}, {"name": "Office of Research Integrity (ORI) & Institutional Review Boards (IRBs)", "jurisdiction": "US", "role": "ORI investigates research misconduct in PHS-funded work; IRBs, under the Common Rule, review and approve human-subjects research to protect participants — the ethics backbone of research."}, {"name": "National Institute of Standards and Technology (NIST)", "jurisdiction": "US (metrology/standards)", "role": "The US national metrology institute; realizes and disseminates measurement standards, sets reference materials and methods, and underpins the measurement traceability science and industry rely on."}, {"name": "International Bureau of Weights and Measures (BIPM/CGPM)", "jurisdiction": "Global (standards body)", "role": "Maintains the International System of Units (SI) and coordinates national metrology institutes, ensuring measurements are consistent and comparable worldwide."}, {"name": "ISO / IEC & Accreditation Bodies (e.g., ISO 17025, A2LA)", "jurisdiction": "Global (standards & accreditation)", "role": "ISO/IEC 17025 defines competence for testing and calibration labs; accreditation bodies audit and accredit labs, self-regulating the quality and credibility of scientific measurement and testing."}, {"name": "Committee on Publication Ethics (COPE) & Learned Societies", "jurisdiction": "Global (self-regulatory)", "role": "COPE sets publication-ethics standards for journals; professional societies (AAAS, national academies) set norms, peer-review practices, and codes of conduct — the community self-governance of scientific quality."}, {"name": "Department of Energy Office of Science / Sponsoring Agencies", "jurisdiction": "US", "role": "Funds and oversees national laboratories and big-science facilities, setting research priorities, safety, security, and stewardship requirements for major scientific infrastructure."}]}, "groundView": {"orgModel": "Research organizations vary by type but share a recognizable structure. A university or research institute is governed by a board of trustees/regents and led by a president/director, with research overseen by a Vice President/Provost for Research and administered through an Office of Sponsored Programs; the scientific work is organized into departments and centers led by chairs and directors, within which principal investigators (faculty or senior scientists) run individual labs. Each PI's lab is itself a small enterprise: the PI raises funding and sets direction, supported by staff scientists, postdoctoral researchers, graduate students, lab managers, and research technicians. Corporate and contract-research organizations replace the academic hierarchy with an R&D executive (Chief Scientific Officer/VP R&D) over research directors, project/program leaders, principal and senior scientists, and technicians, plus quality, regulatory, and lab-operations functions. Across all types, research-support roles — grants administration, compliance (IRB/IACUC/biosafety), core-facility staff, and instrument technicians — surround the bench scientists.", "positions": [{"title": "Board of Trustees / Regents", "level": "Governance", "reportsTo": "Stakeholders / Public", "duties": "Sets institutional mission, approves budgets and major research investments, and appoints and oversees the president/director. Measured on institutional health, research reputation, and stewardship.", "credentials": "Distinguished academics, executives, and public figures; governance experience.", "socCode": "11-1011"}, {"title": "President / Institute Director", "level": "Executive", "reportsTo": "Board of Trustees", "duties": "Leads the institution, sets research strategy and priorities, secures funding and partnerships, and represents it externally. Measured on research output, funding, and reputation.", "credentials": "Distinguished scientist (often PhD/MD) with senior administrative experience.", "socCode": "11-9033"}, {"title": "Vice President / Provost for Research (or Chief Scientific Officer)", "level": "Executive", "reportsTo": "President / CEO", "duties": "Owns the research enterprise — strategy, funding portfolio, research infrastructure, and compliance — and champions research growth. Measured on grant/contract volume, research quality, and integrity.", "credentials": "Accomplished researcher (PhD), leadership and grants experience.", "socCode": "11-9121"}, {"title": "Research Director / Department Chair", "level": "Management", "reportsTo": "VP Research / CSO", "duties": "Leads a department, center, or research program, recruiting and supporting investigators and setting scientific direction. Measured on the unit's funding, productivity, and reputation.", "credentials": "Senior scientist/professor (PhD), strong publication and funding record.", "socCode": "11-9121"}, {"title": "Principal Investigator / Senior Scientist", "level": "Professional", "reportsTo": "Department Chair / Research Director", "duties": "Conceives and directs research programs, writes grants, leads a lab, publishes findings, and mentors trainees. Measured on grants won, publications, and scientific impact.", "credentials": "PhD (and often postdoctoral training) in the field; independent research record.", "socCode": "19-1042"}, {"title": "Research Scientist / Staff Scientist", "level": "Professional", "reportsTo": "Principal Investigator / R&D Manager", "duties": "Designs and conducts experiments, analyzes data, and drives projects toward results, often independently within a program. Measured on experimental output, data quality, and publications/patents.", "credentials": "PhD or MS in the discipline; strong technical and analytical skills.", "socCode": "19-1042"}, {"title": "Postdoctoral Researcher", "level": "Professional", "reportsTo": "Principal Investigator", "duties": "Conducts advanced research under a PI, produces publications, and develops toward an independent career. Measured on research productivity and publications.", "credentials": "Recent PhD in the field; specialized technical expertise.", "socCode": "19-1042"}, {"title": "Clinical Research / Trial Manager", "level": "Management", "reportsTo": "R&D Director / Medical Director", "duties": "Plans and runs clinical trials, manages sites, timelines, and regulatory compliance, and ensures data integrity and patient safety. Measured on enrollment, timeline, quality, and compliance.", "credentials": "Life-science degree, clinical-research certification (ACRP/SOCRA), GCP knowledge.", "socCode": "11-9121"}, {"title": "Regulatory Affairs / Compliance Manager", "level": "Management", "reportsTo": "CSO / VP Research", "duties": "Ensures research meets FDA/EMA, IRB/IACUC, and biosafety requirements and manages submissions and audits. Measured on approvals secured, audit outcomes, and compliance.", "credentials": "Science degree, RAC certification, deep regulatory knowledge.", "socCode": "13-1041"}, {"title": "Grants / Research Administrator", "level": "Professional", "reportsTo": "Office of Sponsored Programs", "duties": "Prepares and administers grant proposals and budgets, ensures financial and reporting compliance, and manages awards. Measured on proposal support, compliance, and award management.", "credentials": "Business/administration background, CRA certification, knowledge of funder rules.", "socCode": "11-3012"}, {"title": "Biostatistician / Data Scientist", "level": "Professional", "reportsTo": "Research Director / PI", "duties": "Designs experiments and analyzes research data statistically, builds models, and ensures rigorous, reproducible inference. Measured on analytical rigor, study design quality, and contributions to publications.", "credentials": "Advanced degree in statistics/biostatistics/data science; strong programming (R, Python, SAS).", "socCode": "15-2041"}, {"title": "Metrologist / Calibration Scientist", "level": "Professional", "reportsTo": "Lab Director / Quality Manager", "duties": "Develops and applies measurement standards and calibration procedures, ensuring traceability and uncertainty quantification. Measured on measurement accuracy, traceability, and inter-lab comparison results.", "credentials": "Physics/engineering degree, metrology training, ISO 17025 knowledge.", "socCode": "19-2012"}, {"title": "Lab Manager / Research Facility Manager", "level": "Management", "reportsTo": "PI / Department", "duties": "Runs the day-to-day operations of a lab or core facility — equipment, supplies, safety, budgets, and staff scheduling. Measured on lab uptime, safety compliance, and operational efficiency.", "credentials": "Science degree, lab-operations experience, safety and management skills.", "socCode": "11-9121"}, {"title": "Instrumentation / Field Application Engineer", "level": "Professional", "reportsTo": "Engineering/Service Manager", "duties": "Designs, installs, calibrates, and supports scientific instruments, and trains users, bridging manufacturer and lab. Measured on instrument uptime, installations, and customer success.", "credentials": "Engineering/physics degree, instrument expertise, field-service skills.", "socCode": "17-2199"}, {"title": "Research Technician / Laboratory Technician", "level": "Operational", "reportsTo": "Lab Manager / PI", "duties": "Performs bench experiments, sample preparation, assays, and measurements to protocol, records data, and maintains equipment. Measured on data quality, throughput, and protocol adherence.", "credentials": "BS or associate degree in a science; hands-on lab technique.", "socCode": "19-4021"}, {"title": "Clinical Research Coordinator", "level": "Operational", "reportsTo": "Clinical Trial Manager / PI", "duties": "Runs trial activities at a site — recruiting and consenting participants, collecting data, and ensuring protocol compliance. Measured on enrollment, data completeness, and compliance.", "credentials": "Life-science degree, clinical-research coordinator certification, GCP training.", "socCode": "11-9121"}, {"title": "Lab / Calibration Technician", "level": "Operational", "reportsTo": "Lab Manager / Metrologist", "duties": "Runs analytical tests or calibrations on samples and instruments to standard methods, documents results, and maintains equipment. Measured on accuracy, turnaround, and method compliance.", "credentials": "Associate/BS in science or technology; instrument and method training.", "socCode": "19-4031"}, {"title": "Animal Care / Vivarium Technician", "level": "Operational", "reportsTo": "Facility Manager / Veterinarian", "duties": "Cares for research animals, maintains husbandry and welfare, and supports procedures under IACUC and veterinary oversight. Measured on animal welfare, protocol compliance, and colony health.", "credentials": "Animal-science training, AALAS certification (ALAT/LAT), welfare knowledge.", "socCode": "19-4021"}, {"title": "Field Research Assistant", "level": "Operational", "reportsTo": "Principal Investigator / Field Station Manager", "duties": "Collects samples and data in the field, operates field instruments, and maintains logistics for field campaigns. Measured on data quality, sample integrity, and field reliability.", "credentials": "Science degree or coursework; field skills; often specialized (diving, remote-area) training.", "socCode": "19-4099"}]}}, {"id": "communication", "name": "Communication", "icon": "📡", "tagline": "The networks, media, and messages that let a civilization talk to itself.", "view100k": {"role": "Communication is the domain that moves information and meaning between people: the telecommunications networks that carry signals, the media and broadcasting that produce and distribute content, the publishing and journalism that inform, the advertising that persuades and finances much of it, the social platforms that connect billions, and the postal and courier services that move physical messages and parcels. Its function is to overcome distance and enable coordination, culture, commerce, and collective decision-making — no market, government, army, or society can function without the ability to send, receive, and share information reliably. Communication is simultaneously physical infrastructure (spectrum, fiber, satellites, sorting centers) and a cultural-institutional system (the press, the public sphere, the attention economy).\n\nThe scale is vast and central to modern life. Global telecommunications services are roughly $1.5-1.8 trillion per year; the media and entertainment industry (film, TV, music, publishing, games, and digital) is on the order of $2.5-3 trillion; global advertising exceeds $1 trillion annually (now majority digital); and postal and courier/logistics services add several hundred billion more. Together the domain employs many tens of millions worldwide and reaches essentially every human — more people have mobile-phone access than reliable sanitation. A handful of telecom carriers, media conglomerates, and social platforms sit among the world's largest and most influential enterprises.\n\nThe historical arc runs from writing, the printing press (Gutenberg, ~1440) and the rise of newspapers, through the electrical revolution of the telegraph and telephone (Morse, Bell), radio and television broadcasting, the satellite and cable eras, the internet's absorption of all prior media into digital form, mobile telephony's leap over fixed-line infrastructure in much of the world, and now the platform age in which social media, streaming, and algorithmic distribution have upended broadcasting, journalism, and advertising alike. The defining tensions of the moment are the collapse of the traditional news business model, the concentration and content-moderation dilemmas of dominant platforms, misinformation and information integrity, spectrum scarcity and the buildout of 5G/fiber, and the surveillance and privacy implications of an economy built on attention and data.", "interdependencies": "Communication is the nervous system that connects the other nineteen domains. It rides on Infrastructure (towers, ducts, fiber, sorting hubs) and Energy (network and data-center power) and is built from the products of Industry and Technology (routers, chips, satellites, the internet itself). It is financed by Finance and, for much of media, by Advertising revenue tied to Trade and the Economy. It carries the information that Governance, Defense, and Intelligence depend on for command, propaganda, and surveillance, and it is the primary vehicle of Culture (film, music, news) and of Education (distance learning, dissemination). It amplifies Science (scholarly and science communication) and Medicine (public-health messaging), coordinates Population and Agriculture markets, and is disciplined by Law (defamation, copyright, spectrum licensing, privacy). In turn every domain feeds Communication with content and demand. Because it shapes what a society knows and believes, Communication holds unusual power over Governance and Culture, making its ownership and regulation perennially contested.", "regulationModel": "Communication is regulated along three axes: the physical networks and spectrum, the content and conduct of media, and market competition. In the US the FCC licenses spectrum, regulates carriers and broadcasters, and sets rules on interconnection, universal service, and (variably) net neutrality; the FTC polices advertising truthfulness, privacy, and unfair practices; and the Postal Regulatory Commission oversees the USPS. Internationally the ITU (a UN agency) allocates global spectrum and orbital slots and sets telecom standards, the Universal Postal Union coordinates cross-border mail, and technical standards come from bodies like 3GPP (mobile), the IEEE, and the IETF. Media and speech are shaped by content law (defamation, obscenity, copyright), broadcast licensing, and — for digital platforms — emerging regimes like the EU's Digital Services Act and debates over intermediary liability (Section 230 in the US). Crucially, much of the domain self-regulates: press councils and journalistic ethics codes (SPJ, editorial standards), advertising self-regulation (the Better Business Bureau's National Advertising Division, the IAB's digital standards), broadcast standards boards, and platform content-moderation policies. Market discipline, antitrust review of media mergers, and public-service-broadcasting mandates complete the model."}, "view10k": {"overview": "In NAICS, communication spans the Information sector (51): telecommunications (517, wired, wireless, and satellite carriers), broadcasting and content — motion pictures (512), radio and television broadcasting (5151), cable and subscription programming (5152), sound recording (5122), publishing of newspapers, books, and periodicals (5111), and internet publishing and web portals (519) — plus advertising and public relations (5418) in the professional-services sector and postal service and couriers (491, 492) in transportation. Firms range from capital-intensive network carriers and satellite operators, through content creators and broadcasters, publishers, advertising and PR agencies, and digital/social platforms, to the postal and courier operators that move physical messages and parcels. The domain's economics split between infrastructure businesses (high fixed cost, utility-like) and content/attention businesses (hit-driven, advertising- and subscription-funded).", "businessTypes": [{"name": "Telecommunications Carrier (Wireless & Wireline)", "naics": "517111, 517112", "definition": "Firms that own and operate networks to provide voice, mobile, and broadband connectivity.", "operations": "They build and run costly network infrastructure (spectrum, cell sites, fiber) and sell connectivity subscriptions, earning recurring revenue where scale, network quality, and subscriber retention (churn) drive margin. Heavy capex and spectrum costs define the business.", "regulation": "Regulated by the FCC (licensing, interconnection, universal service) and internationally the ITU; self-regulation via 3GPP and GSMA industry standards.", "examples": "AT&T, Verizon, Vodafone, T-Mobile"}, {"name": "Cable / Broadband & Pay-TV Operator", "naics": "517111, 515210", "definition": "Firms that deliver broadband internet and subscription television over cable/fiber networks.", "operations": "They operate last-mile networks selling broadband and video bundles, earning recurring subscription revenue; network reach, broadband speed, and bundling drive value as video declines and broadband grows. Infrastructure ownership is the moat.", "regulation": "FCC and local franchise authorities, privacy rules; self-regulation via CableLabs technical standards and NCTA practices.", "examples": "Com
