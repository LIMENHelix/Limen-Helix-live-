<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LIMEN HELIX &middot; Culture Workspace</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050810;color:#e8e3d9;font-family:"IBM Plex Mono",monospace;padding:0;min-height:100vh}

.ws-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 16px;border-bottom:1px solid rgba(201,169,78,0.08);
  background:rgba(5,8,16,0.95);position:sticky;top:0;z-index:100;
}
.ws-title{font-size:clamp(0.48rem,1.4vw,0.60rem);letter-spacing:4px;text-transform:uppercase;color:rgba(201,169,78,0.5)}
.ws-title a{color:rgba(201,169,78,0.45);text-decoration:none;transition:color 0.2s}
.ws-title a:hover{color:rgba(201,169,78,0.9)}
.ws-sep{color:rgba(201,169,78,0.2)}
.ws-active{color:rgba(201,169,78,0.7)}
.ws-nav a{
  font-family:inherit;font-size:0.38rem;letter-spacing:1.5px;text-transform:uppercase;
  color:rgba(201,169,78,0.4);text-decoration:none;padding:3px 10px;
  border:1px solid rgba(201,169,78,0.1);border-radius:2px;transition:all 0.2s;
}
.ws-nav a:hover{color:rgba(201,169,78,0.8);border-color:rgba(201,169,78,0.3)}

.ws-body{padding:16px 24px 60px;max-width:900px;margin:0 auto}
.ws-loading{text-align:center;padding:40px;color:#807868;font-size:0.42rem;letter-spacing:2px}

.ws-opp-title{font-size:0.5rem;color:#e8e3d9;margin-bottom:4px}
.ws-opp-track{font-size:0.28rem;letter-spacing:2px;padding:2px 8px;border-radius:2px;display:inline-block;margin-bottom:12px}
.ws-track-grant{color:#5ab5a0;border:1px solid rgba(90,181,160,0.25);background:rgba(90,181,160,0.06)}
.ws-track-patent{color:#a87adb;border:1px solid rgba(168,122,219,0.25);background:rgba(168,122,219,0.06)}

@media print{
  .ws-header,.ws-nav{display:none}
  body{background:white;color:black}
}
</style>
</head>
<body>
<div id="limen-topbar"></div>
<script src="assets/js/limen-topbar.js"></script>

  <!-- topbar removed: see assets/js/limen-topbar.js -->

<div class="ws-body" id="wsBody">
  <div class="ws-loading">LOADING WORKSPACE...</div>
</div>

<script src="assets/js/culture-execution-panels.js"></script>
<script src="assets/js/culture-business-build.js"></script>
<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var track = params.get('track') || 'grant';
  var oppKey = params.get('opp') || '';
  var returnTo = params.get('returnTo') || '/domain-console?domain=culture&mode=operator';

  document.getElementById('wsNavBack').href = returnTo;
  document.getElementById('wsBackBtn').href = returnTo;
  var trackLabels = { grant: 'GRANT', patent: 'PATENT', business: 'BUSINESS BUILD' };
  document.getElementById('wsTrackLabel').textContent = (trackLabels[track] || track.toUpperCase()) + ' WORKSPACE';
  document.title = 'LIMEN HELIX \u00b7 Culture ' + (trackLabels[track] || track) + ' Workspace';

  var context = null;
  try { context = JSON.parse(sessionStorage.getItem('limen_exec_context')); } catch(e) {}

  var body = document.getElementById('wsBody');

  function tryRender() {
    if (track === 'business') {
      var bb = window.LIMENCultureBusinessBuild;
      if (!bb) { setTimeout(tryRender, 200); return; }
      var prefill = context || {};
      var h = '<div class="ws-opp-title">' + ((prefill.businessType || oppKey || 'New Culture Business').replace(/_/g, ' ')) + '</div>';
      h += '<span class="ws-opp-track" style="color:#C9A94E;border:1px solid rgba(201,169,78,0.25);background:rgba(201,169,78,0.06)">BUSINESS BUILD</span>';
      h += bb.renderPanel(oppKey || 'default', prefill);
      body.innerHTML = h;
      bb.wirePanel(body, oppKey || 'default');
      var panelBody = body.querySelector('.eep-body');
      if (panelBody) panelBody.classList.add('open');
      var toggle = body.querySelector('.eep-toggle');
      if (toggle) toggle.textContent = '\u25B2';
      return;
    }

    var panels = window.LIMENCultureExecutionPanels;
    if (!panels) { setTimeout(tryRender, 200); return; }

    var path = track === 'grant' ? 'GRANT-ELIGIBLE' : 'PATENTABLE';
    var opp = { title: oppKey.replace(/_/g, ' '), diagnosisId: '', path: path };
    if (context) opp.title = context.key ? context.key.replace(/_/g, ' ') : opp.title;

    var h = '';
    h += '<div class="ws-opp-title">' + opp.title.charAt(0).toUpperCase() + opp.title.slice(1) + '</div>';
    h += '<span class="ws-opp-track ws-track-' + track + '">' + track.toUpperCase() + ' APPLICATION</span>';
    h += panels.renderForOpportunity(oppKey || 'default', path, opp);

    body.innerHTML = h;
    panels.wireForOpportunity(body, oppKey || 'default', path);
    var panelBody = body.querySelector('.eep-body');
    if (panelBody) panelBody.classList.add('open');
    var toggle = body.querySelector('.eep-toggle');
    if (toggle) toggle.textContent = '\u25B2';
  }

  tryRender();
})();
</script>
</body>
</html>
