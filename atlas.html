*{margin:0;padding:0;box-sizing:border-box}

/* intro + tools */

<script>
(function(){
  'use strict';
  // PUBLIC routing only — clicks never reach gated pages. Every domain has a free
  // public front; each node id maps to its own route (medicine → the fitness front).
  var PUBLIC = {};
  ['economy','environment','technology','science','trade','governance','agriculture',
   'industry','education','communication','defense','religion','population','law','finance',
   'intelligence','energy','culture','infrastructure'].forEach(function(d){ PUBLIC[d] = '/' + d; });
  PUBLIC.medicine = '/fitness';
  var _lastPt={x:null,y:null};
  addEventListener('pointerdown',function(e){_lastPt={x:e.clientX,y:e.clientY};},{passive:true});
  function onNodeClick(n){
    // The orb takes over: the domain speaks first, and "Enter" inside it still routes on.
    if (n && n.id && window.__orbOpen) { window.__orbOpen(n.id, _lastPt.x, _lastPt.y); return; }
    var url = n && (PUBLIC[n.id] || PUBLIC[(n.childUniverse||'').toLowerCase()]);
    if (url) window.location.href = url;
    // else: no navigation — hover tooltip already shows the sector's state
  }
  if (window.CivilizationConnectome) {
    CivilizationConnectome.init('c', { miniMode:false, focusDomain:null, onNodeClick:onNodeClick });
  }
  var v=document.getElementById('entry-veil');
  setTimeout(function(){ if(v){ v.style.opacity='0'; setTimeout(function(){ v.remove(); },2000); } },300);
})();

/* admin: passcode → /api/admin-auth → /admin */
(function(){
  var btn=document.getElementById('adminBtn'),ov=document.getElementById('ov'),
      f=document.getElementById('ovForm'),pw=document.getElementById('ovPw'),
      err=document.getElementById('ovErr'),x=document.getElementById('ovX');
  function show(){ov.classList.add('show');setTimeout(function(){pw.focus();},50);}
  function hide(){ov.classList.remove('show');err.textContent='';pw.value='';}
  btn.addEventListener('click',show); x.addEventListener('click',hide);
  ov.addEventListener('click',function(e){if(e.target===ov)hide();});
  document.addEventListener('keydown',function(e){
    if((e.ctrlKey||e.metaKey)&&e.shiftKey&&(e.key==='A'||e.key==='a')){e.preventDefault();show();}
    if(e.key==='Escape')hide();});
  f.addEventListener('submit',function(e){e.preventDefault();var val=(pw.value||'').trim();
    if(!val){err.textContent='Enter code';return;} err.textContent='checking…';
    fetch('/api/admin-auth',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({passcode:val})})
      .then(function(r){return r.json();})
      .then(function(j){ if(j&&j.ok){ try{sessionStorage.setItem('limen_access','granted');if(j.person)sessionStorage.setItem('limen_admin',JSON.stringify(j.person));sessionStorage.setItem('limen_pass',val);}catch(e){} window.location.replace('/connectome'); }
        else { err.textContent='Incorrect'; pw.value=''; pw.focus(); } })
      .catch(function(){ err.textContent='Error. Try again'; });
  });
})();
</script>
<script>
/* ── GALAXY BACKDROP ───────────────────────────────────────────────────────────────────────
   The same sky as the home page, so the front door and the atlas read as one product.

   THE GAS IS A REAL PHOTOGRAPH. assets/img/sky-plate.webp is the James Webb Space Telescope's
   NIRCam image of the Cosmic Cliffs in the Carina Nebula (NGC 3324), reduced to grey with a
   hard curve. Its COLOUR is discarded and only its structure is kept, then re-tinted to our
   indigo and teal. Borrowing the structure rather than the palette is the point: procedural
   blobs cannot fake real filaments and dust lanes, and that softness is what made the old
   backdrop read as airbrush.

   The plate carries no alpha channel and does not need one. The colour field is MULTIPLIED by
   the grey plate and the product added with 'lighter'. Black multiplies to black and black
   adds nothing, so the dark sky masks itself. (Encoding the same structure in alpha cost
   1.47 MB against 238 KB as grey, because Chrome compresses WebP alpha losslessly.)

   This is a BACKDROP, so it deliberately leaves out the home page's foreground personality:
   no helix, no parallax, no satellite, no visitors. The connectome is the subject here and
   the sky must not compete with it. What it keeps is the palette, the real structure, the two
   star populations and the twinkle.

   Everything static bakes into one bitmap, blitted once per frame, with only the twinkling
   stars drawn live. On the home page the three-layer version measured 10fps at 2880x1800;
   this is the same fix. dpr is integer-only, because a fractional backing ratio puts every
   draw on a resampling path and costs more than the pixels it saves.                        */
(function(){
  var cv = document.getElementById('stars'); if (!cv) return;
  var ctx = cv.getContext('2d', { alpha: false });
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var scene = document.createElement('canvas'), sx = scene.getContext('2d');
  var w = 0, h = 0, dpr = 1, twinklers = [], raf = null, t0 = 0;
  var plate = new Image(), plateReady = false, fade = 0;

  var ANG = -0.42, CA = Math.cos(ANG), SA = Math.sin(ANG);
  var PALETTE = ['255,255,255','255,255,255','255,255,255',
                 '214,228,255','182,208,255','255,246,224','255,228,180'];
  function rand(a,b){ return a + Math.random()*(b-a); }
  function pick(a){ return a[(Math.random()*a.length)|0]; }

  function paintGas(target){
    if (!plateReady) return;
    var diag = Math.sqrt(w*w + h*h);
    var tmp = document.createElement('canvas');
    tmp.width = Math.round(w*dpr); tmp.height = Math.round(h*dpr);
    var g = tmp.getContext('2d');
    g.setTransform(dpr,0,0,dpr,0,0);

    // Indigo to teal, running ACROSS the band so the two hues separate with distance.
    var lg = g.createLinearGradient(w/2 + SA*diag*0.5, h/2 - CA*diag*0.5,
                                    w/2 - SA*diag*0.5, h/2 + CA*diag*0.5);
    lg.addColorStop(0.00,'#12318C'); lg.addColorStop(0.45,'#1D5FA8'); lg.addColorStop(1.00,'#12A6A8');
    g.fillStyle = lg; g.fillRect(0,0,w,h);

    // The one warm region, low and left. Only warm colour in the sky; without it the whole
    // field reads as a single cold wash.
    var ar = diag*0.34;
    var amber = g.createRadialGradient(w*0.20, h*0.84, 0, w*0.20, h*0.84, ar);
    amber.addColorStop(0,'rgba(226,146,54,0.95)');
    amber.addColorStop(0.55,'rgba(196,116,58,0.45)');
    amber.addColorStop(1,'rgba(196,116,58,0)');
    g.fillStyle = amber; g.fillRect(0,0,w,h);

    // Real structure, rotated onto the band and scaled to still cover after rotation.
    g.save();
    g.globalCompositeOperation = 'multiply';
    g.translate(w/2, h/2); g.rotate(ANG);
    var cover = Math.max(w/plate.width, h/plate.height) * 1.45;
    g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
    g.drawImage(plate, -plate.width*cover/2, -plate.height*cover/2,
                plate.width*cover, plate.height*cover);
    g.restore();

    // Confine the gas to one diagonal band.
    g.save();
    g.globalCompositeOperation = 'multiply';
    g.translate(w/2, h/2); g.rotate(ANG);
    var bd = diag*0.62;
    var band = g.createLinearGradient(0,-bd,0,bd);
    band.addColorStop(0.00,'#000000'); band.addColorStop(0.26,'#3a3a3a');
    band.addColorStop(0.50,'#ffffff');
    band.addColorStop(0.74,'#3a3a3a'); band.addColorStop(1.00,'#000000');
    g.fillStyle = band; g.fillRect(-diag,-diag,diag*2,diag*2);
    g.restore();

    /* Clear the middle. On the home page this protected the wordmark; here it protects the
       connectome, which is densest at the centre and unreadable over lit gas. Elliptical
       rather than circular because the graph is wider than it is tall. */
    g.save();
    g.globalCompositeOperation = 'multiply';
    g.translate(w/2, h/2);
    g.scale(1, (h*0.34)/(w*0.42));
    var cr = w*0.42;
    var clear = g.createRadialGradient(0,0,0,0,0,cr);
    clear.addColorStop(0.00,'#000000'); clear.addColorStop(0.55,'#2b2b2b'); clear.addColorStop(1.00,'#ffffff');
    g.fillStyle = clear; g.fillRect(-diag,-diag,diag*2,diag*2);
    g.restore();

    target.save();
    target.globalCompositeOperation = 'lighter';
    target.setTransform(1,0,0,1,0,0);
    target.drawImage(tmp,0,0);
    target.restore();
  }

  // Deterministic placement, so the with-gas and without-gas bakes hold the same stars and
  // the fade-in does not make the whole field jump.
  var seed = 1;
  function srand(){ seed = (seed*1103515245 + 12345) & 0x7fffffff; return seed/0x7fffffff; }

  function bake(){
    scene.width = Math.round(w*dpr); scene.height = Math.round(h*dpr);
    sx.setTransform(dpr,0,0,dpr,0,0);
    sx.globalCompositeOperation = 'source-over';

    var base = sx.createLinearGradient(0,0,0,h);
    base.addColorStop(0,'#04060c'); base.addColorStop(0.55,'#070c15'); base.addColorStop(1,'#03050a');
    sx.fillStyle = base; sx.fillRect(0,0,w,h);

    var diag = Math.sqrt(w*w + h*h);
    seed = 20260803;

    // Dense faint population: this is the layer that makes the field read as deep.
    var n = Math.min(6000, Math.round((w*h)/300));
    for (var i=0;i<n;i++){
      var x = srand()*w, y = srand()*h;
      var d = Math.abs((x-w/2)*SA - (y-h/2)*CA);
      var nb = Math.exp(-Math.pow(d/(diag*0.19),2));
      if (srand() > 0.34 + nb*0.66) continue;
      sx.beginPath(); sx.arc(x,y,0.24+srand()*0.58,0,6.2832);
      sx.fillStyle = 'rgba(' + PALETTE[(srand()*PALETTE.length)|0] + ',' +
                     ((0.16+srand()*0.54)*(0.58+nb*0.42)).toFixed(3) + ')';
      sx.fill();
    }

    paintGas(sx);

    // Sparse bright population, drawn after the gas so they sit in front of it.
    sx.setTransform(dpr,0,0,dpr,0,0);
    sx.globalCompositeOperation = 'source-over';
    var m = Math.min(300, Math.round((w*h)/6200));
    for (var k=0;k<m;k++){
      var mx = srand()*w, my = srand()*h;
      var md = Math.abs((mx-w/2)*SA - (my-h/2)*CA);
      var mb = Math.exp(-Math.pow(md/(diag*0.24),2));
      if (srand() > 0.42 + mb*0.58) continue;
      var col = PALETTE[(srand()*PALETTE.length)|0];
      var r = 0.7+srand()*0.7, a = 0.45+srand()*0.45;
      var hg = sx.createRadialGradient(mx,my,0,mx,my,r*5.5);
      hg.addColorStop(0,'rgba('+col+','+(a*0.5).toFixed(3)+')');
      hg.addColorStop(1,'rgba('+col+',0)');
      sx.fillStyle = hg; sx.fillRect(mx-r*5.5,my-r*5.5,r*11,r*11);
      sx.beginPath(); sx.arc(mx,my,r,0,6.2832);
      sx.fillStyle = 'rgba('+col+','+a.toFixed(3)+')'; sx.fill();
    }

    // Vignette last, baked in rather than drawn per frame.
    var vg = sx.createRadialGradient(w/2,h/2,Math.min(w,h)*0.30,w/2,h/2,diag*0.62);
    vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.55)');
    sx.fillStyle = vg; sx.fillRect(0,0,w,h);
  }

  function buildTwinklers(){
    twinklers = [];
    var count = Math.min(420, Math.round((w*h)/3400));
    for (var i=0;i<count;i++){
      twinklers.push({ x:Math.random()*w, y:Math.random()*h, r:rand(0.5,1.5),
        colour:pick(PALETTE), base:rand(0.35,1.0),
        // Two rates that do not divide into each other, so the blink never repeats on a
        // short cycle. One sine reads as a metronome; two read as a sky.
        s1:rand(1.1,4.2), s2:rand(0.3,1.3),
        p1:Math.random()*6.2832, p2:Math.random()*6.2832,
        amp:Math.random()<0.34?rand(0.75,1.0):rand(0.25,0.6) });
    }
  }

  function twinkle(s,t){
    if (reduce) return s.base;
    var a = 0.5 - 0.5*Math.cos(s.s1*t + s.p1);
    var b = 0.5 - 0.5*Math.cos(s.s2*t + s.p2);
    return Math.max(0, Math.min(1, s.base*(1 - s.amp*(1 - a*(0.45+0.55*b)))));
  }

  function draw(now){
    var t = (now - t0)/1000;
    if (plateReady && fade < 1) fade = Math.min(1, fade + 0.05);
    ctx.setTransform(1,0,0,1,0,0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(scene,0,0);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.globalCompositeOperation = 'lighter';
    for (var i=0;i<twinklers.length;i++){
      var s = twinklers[i], a = twinkle(s,t);
      if (a < 0.012) continue;
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.2832);
      ctx.fillStyle = 'rgba('+s.colour+','+a.toFixed(3)+')'; ctx.fill();
      if (a > 0.6){
        ctx.beginPath(); ctx.arc(s.x,s.y,s.r*3.4,0,6.2832);
        ctx.fillStyle = 'rgba('+s.colour+','+(a*0.09).toFixed(3)+')'; ctx.fill();
      }
    }
    ctx.globalCompositeOperation = 'source-over';
    raf = requestAnimationFrame(draw);
  }

  function resize(){
    w = window.innerWidth; h = window.innerHeight;
    // Integer dpr only, with a pixel budget: 2x on phones and tablets where the canvas is
    // small, 1x at desktop sizes where 2x costs half the frame rate for no visible gain.
    var raw = window.devicePixelRatio || 1;
    dpr = (raw >= 1.8 && w*h*4 <= 4500000) ? 2 : 1;
    cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
    cv.style.width = w+'px'; cv.style.height = h+'px';
    bake();
    buildTwinklers();
  }

  var rt;
  addEventListener('resize', function(){ clearTimeout(rt); rt = setTimeout(resize, 160); });
  document.addEventListener('visibilitychange', function(){
    if (document.hidden){ if (raf){ cancelAnimationFrame(raf); raf = null; } }
    else if (!raf){ t0 = performance.now(); raf = requestAnimationFrame(draw); }
  });

  /* 238 KB, so the sky is painted and running before it arrives and the gas fades in when it
     lands. Nothing waits on the network, and if it never arrives this is still a star field
     rather than an empty rectangle. */
  plate.onload = function(){ plateReady = true; bake(); };
  plate.onerror = function(){ plateReady = false; };
  plate.src = '/assets/img/sky-plate.webp';

  resize();
  t0 = performance.now();
  raf = requestAnimationFrame(draw);
})();
</script>

  #orbCard.meet{max-height:44vh;bottom:2.5vh;width:min(94vw,900px)}

<div id="orbLayer" aria-hidden="true">
  <div id="orbScrim"></div>
  <canvas id="orbCanvas"></canvas>
  <button id="orbClose" type="button" aria-label="Close">&times;</button>
  <div id="orbCard" role="dialog" aria-live="polite"></div>
</div>
<div id="orbPick" aria-label="The twenty domain managers"></div>

<script>
(function () {
  'use strict';

  var layer = document.getElementById('orbLayer');
  var cv = document.getElementById('orbCanvas');
  var ctx = cv.getContext('2d');
  var card = document.getElementById('orbCard');
  var pick = document.getElementById('orbPick');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // atlas topics, with the civilisational function the connectome tooltip already uses
  var _B = (typeof LIMEN_ORB !== 'undefined') ? LIMEN_ORB : (window.LIMEN_ORB || {});
  var DOMAINS = _B.DOMAINS, FEEDKEY = _B.FEEDKEY, NEWS = _B.NEWS, PATHWAYS = _B.PATHWAYS,
      RELATION = _B.RELATION, SPEAKERS = _B.SPEAKERS, NEURO = _B.NEURO, VOICE = _B.VOICE,
      DESK = _B.DESK || {};

  var cache = { snap:null, opps:null, cons:null, subs:{}, news:{} };
  function getJSON(u){ return fetch(u).then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; }); }

  // ── the orb ─────────────────────────────────────────────────────────────────────────────
  var orb = null, raf = null, t0 = 0, sparks = [];
  /* While a meeting runs this holds one seat per manager in the room and the frame loop draws
     the call instead of the single orb. Null in solo mode, so nothing about opening one
     manager changes. `live` is who holds the floor for the whole turn; `speaking` is only
     true while audio is actually playing, so the plate lights up immediately and the orb
     pulses when the voice really starts. */
  var seats = null, activeSeat = null;

  // Stable pseudo-random hue per domain until phase drives it: derived from the name, so a
  // domain is the same colour every time rather than flickering to a new one.
  function hueFor(id){ var h=0; for (var i=0;i<id.length;i++) h=(h*31+id.charCodeAt(i))%360; return h; }

  function makeSparks(){
    sparks = [];
    for (var i=0;i<90;i++) sparks.push({
      a: Math.random()*6.2832, rr: 0.75+Math.random()*1.5,
      sp: (Math.random()<0.5?-1:1)*(0.06+Math.random()*0.5),
      sz: 0.5+Math.random()*1.6, ph: Math.random()*6.2832,
      tw: 0.6+Math.random()*2.6, ecc: 0.28+Math.random()*0.5
    });
  }

  function sizeCanvas(){
    var d = Math.min(window.devicePixelRatio||1, 2);
    cv.width = Math.round(innerWidth*d); cv.height = Math.round(innerHeight*d);
    ctx.setTransform(d,0,0,d,0,0);
  }

  /* Translucent, lit from within, no face. Expression lives in the surface: the core
     brightens and the sparks quicken while it speaks, which reads as address without turning
     an instrument into a character. */
  /* ONE ORB, DRAWN ANYWHERE. Pulled out of the frame loop so a meeting can lay several of
     them out side by side like a call, instead of one orb changing colour and the viewer
     having to remember who is talking. `seed` decorrelates the shared spark field, or four
     orbs twinkle in perfect unison and read as four copies of one thing. */
  function paintOrb(t, cx, cy, R, H, speak, seed){
    var rr = R*(1+speak*0.035);
    var tint = function(l,a){ return 'hsla('+H+',92%,'+l+'%,'+a+')'; };
    var blue = function(l,a){ return 'hsla(212,95%,'+l+'%,'+a+')'; };

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    var g0 = ctx.createRadialGradient(cx,cy,rr*0.6,cx,cy,rr*2.9);
    g0.addColorStop(0, tint(64,(0.17+speak*0.12).toFixed(3)));
    g0.addColorStop(0.45, blue(52,(0.09+speak*0.06).toFixed(3)));
    g0.addColorStop(1, blue(45,0));
    ctx.fillStyle=g0; ctx.beginPath(); ctx.arc(cx,cy,rr*2.9,0,6.2832); ctx.fill();

    var g1 = ctx.createRadialGradient(cx-rr*0.26,cy-rr*0.3,rr*0.05,cx,cy,rr);
    g1.addColorStop(0,'rgba(240,250,255,'+(0.86+speak*0.12).toFixed(3)+')');
    g1.addColorStop(0.22, tint(72,0.55));
    g1.addColorStop(0.52, blue(56,0.34));
    g1.addColorStop(0.82, blue(40,0.15));
    g1.addColorStop(1, blue(30,0.04));
    ctx.fillStyle=g1; ctx.beginPath(); ctx.arc(cx,cy,rr,0,6.2832); ctx.fill();

    // Refraction caustic low and right: the detail that stops it reading as a flat disc.
    var cg = ctx.createRadialGradient(cx+rr*0.34,cy+rr*0.42,0,cx+rr*0.34,cy+rr*0.42,rr*0.72);
    cg.addColorStop(0, tint(78,(0.20+speak*0.14).toFixed(3)));
    cg.addColorStop(1, tint(60,0));
    ctx.fillStyle=cg; ctx.beginPath(); ctx.arc(cx,cy,rr,0,6.2832); ctx.fill();

    for (var i=0;i<3;i++){
      var ph = t*(0.7+i*0.28)+i*2.1;
      var ar = rr*(0.30+0.22*i)*(1+speak*0.09*Math.sin(ph*2));
      ctx.beginPath();
      ctx.ellipse(cx,cy,ar,ar*(0.42+0.3*Math.abs(Math.sin(ph))),Math.sin(ph*0.5)*0.6,0,6.2832);
      ctx.strokeStyle='rgba(190,225,255,'+(0.06+speak*0.07).toFixed(3)+')';
      ctx.lineWidth=1.1; ctx.stroke();
    }

    ctx.beginPath(); ctx.arc(cx,cy,rr*0.985,0,6.2832);
    ctx.strokeStyle='rgba(214,238,255,'+(0.26+speak*0.3).toFixed(3)+')';
    ctx.lineWidth=1.4; ctx.stroke();

    for (var si=0;si<sparks.length;si++){
      var s=sparks[si];
      var ang=s.a+(seed||0)*1.73+t*s.sp*(1+speak*1.6), dist=rr*s.rr*(1+speak*0.05);
      var px2=cx+Math.cos(ang)*dist, py2=cy+Math.sin(ang)*dist*s.ecc;
      var tw=0.5+0.5*Math.sin(t*s.tw+s.ph);
      var sa=(0.12+0.55*tw)*(0.5+speak*0.5);
      if (sa<0.02) continue;
      var sr=s.sz*(1+speak*0.35);
      ctx.beginPath(); ctx.arc(px2,py2,sr,0,6.2832);
      ctx.fillStyle = tw>0.86 ? 'rgba(255,255,255,'+sa.toFixed(3)+')' : tint(74,sa.toFixed(3));
      ctx.fill();
      if (tw>0.93){ ctx.beginPath(); ctx.arc(px2,py2,sr*4.2,0,6.2832);
        ctx.fillStyle=tint(70,(sa*0.16).toFixed(3)); ctx.fill(); }
    }
    ctx.restore();
  }

  /* Seats laid out across the top band. The transcript owns the bottom of the screen, so the
     call sits above it and both stay on screen at once — a demo where you have to scroll to
     see who is speaking is a demo nobody follows. */
  function seatLayout(n, w, h){
    var top = h*0.055, band = h*0.40;
    var cols = (w >= 900) ? n : Math.min(2, n);
    var rows = Math.ceil(n/cols);
    var cw = w/cols, ch = band/rows;
    var r = Math.max(24, Math.min(cw, ch)*0.29);
    var out = [];
    for (var i=0;i<n;i++){
      var c = i%cols, rw = Math.floor(i/cols);
      out.push({ x: cw*(c+0.5), y: top + ch*(rw+0.5), r: r });
    }
    return out;
  }

  // The nameplate under each seat, and the mic dot on whoever currently holds the floor.
  function plate(s, p){
    var y = p.y + p.r*1.6;
    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = '600 12px ui-monospace,SFMono-Regular,Menlo,monospace';
    ctx.fillStyle = s.live ? 'hsla('+s.hue+',88%,78%,.98)' : 'rgba(214,228,244,.5)';
    ctx.fillText(s.name.toUpperCase(), p.x, y);
    ctx.font = '400 10.5px ui-sans-serif,system-ui,-apple-system,sans-serif';
    ctx.fillStyle = s.live ? 'rgba(226,236,250,.72)' : 'rgba(200,216,232,.3)';
    ctx.fillText(s.label, p.x, y + 15);
    if (s.live){
      var wdt = ctx.measureText(s.label).width;
      ctx.beginPath(); ctx.arc(p.x - wdt/2 - 11, y + 11, 3.2, 0, 6.2832);
      ctx.fillStyle = 'hsla('+s.hue+',90%,66%,'+(s.speaking?0.95:0.4)+')';
      ctx.fill();
    }
    ctx.restore();
  }

  function drawOrb(now){
    var t = (now-t0)/1000, w = innerWidth, h = innerHeight;
    ctx.clearRect(0,0,w,h);

    if (seats && seats.length){
      var lay = seatLayout(seats.length, w, h);
      for (var i=0;i<seats.length;i++){
        var s = seats[i], p = lay[i];
        var sp = s.speaking ? (0.5+0.5*Math.sin(t*7.5)) : 0;
        paintOrb(t, p.x, p.y, p.r * (s.live ? 1.1 : 0.88), s.hue, sp, i);
        plate(s, p);
      }
      raf = requestAnimationFrame(drawOrb); return;
    }

    if (!orb) { raf = requestAnimationFrame(drawOrb); return; }
    var k = Math.min(1, t/1.15), e = 1-Math.pow(1-k,3);
    var targetX = w>=1100 ? w*0.34 : w/2;
    var targetY = w>=1100 ? h*0.46 : h*0.32;
    var cx = orb.fromX + (targetX-orb.fromX)*e;
    var cy = orb.fromY + (targetY-orb.fromY)*e;
    var R  = 10 + (Math.min(w,h)*0.17 - 10)*e;
    paintOrb(t, cx, cy, R, orb.hue, orb.speaking ? (0.5+0.5*Math.sin(t*7.5))*orb.energy : 0, 0);
    raf = requestAnimationFrame(drawOrb);
  }

  // ── assembling the briefing ─────────────────────────────────────────────────────────────

  function render(b){
    var html = '<div class="fn">'+b.name+' &middot; '+b.fn+'</div><h2>'+b.label+'</h2>';
    b.paras.forEach(function(p){ html += '<p>'+p+'</p>'; });
    if (b.rows.length){
      html += '<div class="rows">';
      b.rows.forEach(function(r){ html += '<div class="row"><div class="k">'+r[0]+'</div><div class="v">'+r[1]+'</div></div>'; });
      html += '</div>';
    }
    /* THE DESK. The briefing above tells you the state of a domain; this tells you there is a
       free page behind it and who runs it. It sits after the evidence rows on purpose — the
       reading earns the click, the pitch does not. Text comes from LIMEN_ORB.DESK, which is
       derived from each page's own description, so the card cannot promise what the page
       does not do. A desk with no honest line (medicine) shows the door without a pitch. */
    var desk = DESK[b.id] || null;
    if (desk && desk.offer)
      html += '<p class="desk"><span class="who">What '+b.name+' runs:</span> '+desk.offer+'.</p>';
    var room = roomFor(b.id);
    html += '<div class="acts">'+
      '<a class="act go'+(desk && desk.free ? ' free' : '')+'" href="'+
        (desk ? desk.path : '/'+(b.id==='medicine'?'fitness':b.id))+'">'+
        (desk ? desk.cta : 'Enter '+b.label)+' &rarr;</a>'+
      // Remy is the only manager with two doors: the clinical read and the calculators.
      (desk && desk.also
        ? '<a class="act go'+(desk.also.free?' free':'')+'" href="'+desk.also.path+'">'+desk.also.cta+' &rarr;</a>'
        : '')+
      (room.length > 1 ? '<button class="act room" type="button" id="orbRoom">Bring in the room</button>' : '')+
      '<button class="act" type="button" id="orbAgain">Say it again</button></div>';
    // Back to one manager: dismiss the room so the frame loop returns to the single orb.
    seats = null; activeSeat = null;
    card.classList.remove('meet');
    card.innerHTML = html;
    var again = document.getElementById('orbAgain');
    if (again) again.addEventListener('click', function(){ speak(b); });
    var rm = document.getElementById('orbRoom');
    if (rm) rm.addEventListener('click', function(){ convene(b); });
  }

  // ── the room ────────────────────────────────────────────────────────────────────────────

  /* A MEETING ON THE PUBLIC ATLAS. Deterministic like everything else on this page: turn
     order is live strain, who may address whom is the typed pathway graph, and no model
     writes a sentence. That is what lets it be public at all.

     The room is whoever this manager is actually wired to, capped at four seats. roomFor()
     lives in the shared module, not here, so the page and anything that pre-renders or voices
     a meeting agree on who is in it. A manager wired to nobody gets no button, because an
     empty room would have to be faked to be worth showing. */
  var meetOn = false;
  function roomFor(id){ return _B.roomFor(id); }

  /* Everything build() needs for a set of domains, fetched once and shared, so every turn in
     a meeting is quoting the same instant rather than drifting between speakers. */
  function ensure(ids){
    var jobs = [];
    if (!cache.snap) jobs.push(getJSON('/api/domain-snapshot').then(function(j){ cache.snap=j; }));
    if (!cache.opps) jobs.push(getJSON('/api/limen-snapshot?type=opportunities').then(function(j){ cache.opps=j; }));
    if (!cache.cons) jobs.push(getJSON('/api/limen-snapshot?type=console').then(function(j){ cache.cons=j; }));
    ids.forEach(function(id){
      if (!(id in cache.subs))
        jobs.push(getJSON('/assets/data/deep/'+id+'-neuro-substrate.json').then(function(j){ cache.subs[id]=j; }));
      if (NEWS[id] && !(id in cache.news))
        jobs.push(getJSON('/api/'+id+'-news').then(function(j){ cache.news[id]=j; }));
    });
    return Promise.all(jobs);
  }

  /* MEETINGS SPEAK IN THE CAST VOICES, same as the solo briefings.

     They cannot be pre-rendered the way the briefings are: a meeting's words depend on who is
     in the room and what the instruments read at that second, so there is no fixed set of
     sentences to render ahead of time. /api/orb-voice synthesises the turn instead. The URL
     carries the exact text, so the edge caches it and the same sentence in the same voice is
     paid for once.

     The browser voice remains ONLY as a failure path. It is what you get if the endpoint is
     down, out of budget, or blocked, and it exists so a meeting degrades instead of going
     silent. It is not the design. */
  function voiceUrl(voice, text){
    return '/api/orb-voice?voice=' + encodeURIComponent(voice) + '&text=' + encodeURIComponent(text);
  }
  // Warm the next turn while the current one talks, or every turn opens with dead air.
  function prefetchTurn(t){
    if (!t || !t.voice || reduce) return;
    try{ var a = new Audio(voiceUrl(t.voice, t.spoken)); a.preload = 'auto'; a.load(); }catch(e){}
  }
  // Drives whichever thing is on screen: the single orb in solo mode, the seat in a meeting.
  function voiceOn(on){
    if (orb){ orb.speaking = on; if (on) orb.energy = 1; }
    if (activeSeat) activeSeat.speaking = on;
  }
  function sayTurn(t, done){
    var moved = false;
    function go(){ if (moved) return; moved = true; voiceOn(false); done(); }
    var est = 1400 + (t.spoken.length / 14) * 1000;

    /* THE GUARD IS NOT OPTIONAL, and it covers both paths. A stalled fetch and a dropped
       speechSynthesis utterance both end the same way: onend never fires and the meeting is
       stranded mid-room with no error and no way forward. Whichever fires first wins. */
    function browser(){
      if (moved) return;
      if (!window.speechSynthesis){ setTimeout(go, Math.min(9000, est)); return; }
      try{
        window.speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(t.spoken);
        u.rate = 0.98; u.pitch = 0.92;
        u.onstart = function(){ voiceOn(true); };
        u.onend = go; u.onerror = go;
        window.speechSynthesis.speak(u);
      }catch(e){ setTimeout(go, 1600); }
    }

    if (reduce){ setTimeout(go, Math.min(9000, est)); return; }
    if (!t.voice){ browser(); setTimeout(go, est * 2.2 + 8000); return; }

    try{
      var a = new Audio(voiceUrl(t.voice, t.spoken));
      _audio = a;
      a.onplay  = function(){ voiceOn(true); };
      a.onended = go;
      a.onerror = function(){ browser(); };
      a.play().catch(function(){ browser(); });      // autoplay blocked, or synthesis refused
    }catch(e){ browser(); }
    setTimeout(go, est * 2.2 + 8000);
  }

  function convene(b){
    var ids = roomFor(b.id);
    if (ids.length < 2) return;
    hush();
    meetOn = true;
    card.classList.add('meet');
    card.innerHTML = '<div class="fn">'+b.name+' is convening</div><h2>The room</h2>'+
                     '<p>Bringing in everyone '+b.name+' is wired to…</p>';
    ensure(ids).then(function(){
      if (!meetOn) return;
      var turns = _B.meeting(ids, cache);
      if (!turns.length){ meetOn = false; render(b); return; }

      /* One seat per manager, in the order they first speak. The chair appears once even
         though they take both the first and last turn. */
      var seen = {};
      seats = [];
      turns.forEach(function(t){
        if (seen[t.id]) return;
        seen[t.id] = 1;
        seats.push({ id:t.id, name:t.name, label:t.label, hue:hueFor(t.id), live:false, speaking:false });
      });
      var names = seats.map(function(s){ return s.name; });
      card.innerHTML = '<div class="fn">In the room</div><h2>'+names.join(' &middot; ')+'</h2>'+
        '<p class="meetnote">Turn order is live strain. Who may address whom is the pathway '+
        'graph between these domains. Nothing said here is written by a model.</p>'+
        '<div id="orbMeet"></div>'+
        '<div class="acts" id="orbMeetActs">'+
        '<button class="act" type="button" id="orbMeetStop">Stop the meeting</button></div>';

      document.getElementById('orbMeetStop')
        .addEventListener('click', function(){ meetOn = false; hush(); render(b); });

      var box = document.getElementById('orbMeet'), i = 0;
      (function next(){
        if (!meetOn) return;
        if (i >= turns.length){ endMeeting(b, box); return; }
        var t = turns[i++];
        // Hand the floor over: exactly one seat is live, and the plate lights before the
        // voice arrives so the room never looks like nobody is up next.
        activeSeat = null;
        for (var z = 0; z < seats.length; z++){
          seats[z].live = (seats[z].id === t.id);
          seats[z].speaking = false;
          if (seats[z].live) activeSeat = seats[z];
        }
        var d = document.createElement('div');
        d.className = 'mturn';
        var h = '<div class="mwho" style="color:hsl('+hueFor(t.id)+',78%,70%)">'+
                t.name+' <em>'+t.label+'</em></div>';
        t.lines.forEach(function(l){ h += '<p>'+l+'</p>'; });
        if (t.desk && !t.closing){
          h += '<a class="mdesk'+(t.desk.free?' free':'')+'" href="'+t.desk.path+'">'+t.desk.cta+' &rarr;</a>';
          if (t.desk.also)
            h += '<a class="mdesk'+(t.desk.also.free?' free':'')+'" href="'+t.desk.also.path+'">'+t.desk.also.cta+' &rarr;</a>';
        }
        d.innerHTML = h;
        box.appendChild(d);
        d.scrollIntoView({ behavior:'smooth', block:'nearest' });
        prefetchTurn(turns[i]);                        // the next one, while this one talks
        sayTurn(t, function(){ setTimeout(next, 280); });
      })();
    });
  }

  function endMeeting(b, box){
    meetOn = false;
    // Nobody holds the floor once it is over, but the room stays on screen to be looked at.
    activeSeat = null;
    if (seats) seats.forEach(function(s){ s.live = false; s.speaking = false; });
    var f = document.createElement('div');
    f.className = 'mend';
    f.innerHTML = '<p>That is the room. Every desk at that table is public and free to read.</p>';
    box.appendChild(f);
    f.scrollIntoView({ behavior:'smooth', block:'nearest' });
    var acts = document.getElementById('orbMeetActs');
    if (acts){
      acts.innerHTML = '<button class="act" type="button" id="orbBack">Back to '+b.name+'</button>';
      document.getElementById('orbBack').addEventListener('click', function(){ render(b); });
    }
  }

  /* VOICE. Each domain is cast to one of 26 xAI voices, synthesised ahead of time by
     scripts/generate-orb-voices.mjs so the bill does not scale with visitors.

     THE RECORDING ALWAYS PLAYS. The first design refused to play whenever the text had
     moved; measured against live data, 5 of 20 briefings changed within seconds, so the
     cast voices would have been effectively never heard. Instead the manifest stores the
     spoken TEXT, and when the live card has moved on the orb dates the recording. A
     bulletin taped at five is not lying at six.

     The comparison is therefore text equality, not a digest — the manifest `hash` field is
     the generator's own incremental-rebuild key and this page does not read it. If the
     audio fails for any reason the browser voice reads the words actually on screen, so
     the orb always speaks and never says something the card does not. */
  var _manifest = null, _audio = null;
  function manifest(){
    if (!_manifest) _manifest = getJSON('/assets/audio/orb/manifest.json')
      .then(function(m){ return (m && m.voices) ? m : { voices:{} }; });
    return _manifest;
  }
  function robot(b){
    try{
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(b.spoken);
      u.rate=0.98; u.pitch=0.92;
      u.onstart=function(){ if (orb){ orb.speaking=true; orb.energy=1; } };
      u.onend=function(){ if (orb) orb.speaking=false; };
      window.speechSynthesis.speak(u);
    }catch(e){}
  }
  function hush(){
    try{ window.speechSynthesis && window.speechSynthesis.cancel(); }catch(e){}
    if (_audio){ try{ _audio.pause(); }catch(e){} _audio = null; }
  }
  function speak(b){
    hush();
    var mine = b.id;
    var current = function(){ return orb && orb.id === mine; };
    var rec = '/assets/audio/orb/' + b.id + '.mp3';

    function play(url, onFail){
      var a = new Audio(url);
      a.onplay  = function(){ if (current()){ orb.speaking=true; orb.energy=1; } };
      a.onended = function(){ if (current()) orb.speaking=false; };
      a.onerror = function(){ if (current()){ orb.speaking=false; onFail(); } };
      _audio = a;
      a.play().catch(function(){ if (current()) onFail(); });   // autoplay blocked
    }

    manifest().then(function(m){
      var e = m.voices[b.id];
      if (!e) { if (current()) robot(b); return; }

      /* The recording is right until the readings move under it. When they do we can now be
         right about BOTH: synthesise the words actually on the card, in the same cast voice,
         rather than playing a dated clip. Measured at 1 to 2 of 20 at any moment, so the
         static file still serves almost every listen and the bill barely moves.

         Three steps down, each strictly worse than the last and each still the right voice or
         the right words: live synthesis, then the recording with a dateline, then the browser
         voice reading what is on screen. */
      var moved = !!(e.text && e.text !== b.spoken);
      if (moved && VOICE[b.id] && b.spoken.length <= 1400){
        play(voiceUrl(VOICE[b.id], b.spoken), function(){
          if (!current()) return;
          stamp(e.spoken_at);
          play(rec, function(){ robot(b); });
        });
        return;
      }
      if (moved) stamp(e.spoken_at);
      play(rec, function(){ robot(b); });
    }).catch(function(){ if (current()) robot(b); });
  }

  /* Date the voice when it no longer matches the card. Only appears when the two have
     actually diverged, so an orb whose briefing has not moved says nothing about recordings
     and simply speaks. */
  function stamp(iso){
    if (!iso) return;
    var when;
    try {
      var d = new Date(iso);
      when = d.toLocaleTimeString([], { hour:'numeric', minute:'2-digit' });
      var today = new Date();
      if (d.toDateString() !== today.toDateString())
        when = d.toLocaleDateString([], { month:'short', day:'numeric' }) + ', ' + when;
    } catch(e){ return; }
    var el = document.getElementById('orbRec');
    if (!el){
      el = document.createElement('div');
      el.id = 'orbRec'; el.className = 'rec';
      var acts = card.querySelector('.acts');
      if (acts) card.insertBefore(el, acts); else card.appendChild(el);
    }
    el.textContent = 'Voice recorded ' + when + '. The readings above are live and have moved since.';
  }

  // ── open / close ────────────────────────────────────────────────────────────────────────
  function open(id,label,fn,x,y){
    sizeCanvas();
    meetOn = false;                       // opening a manager ends any room already running
    seats = null; activeSeat = null;
    orb = { id:id, fromX: x!=null?x:innerWidth/2, fromY: y!=null?y:innerHeight/2,
            speaking:false, energy:1, hue:hueFor(id) };
    makeSparks();
    t0 = performance.now();
    layer.classList.add('on'); layer.setAttribute('aria-hidden','false');
    if (!raf) raf = requestAnimationFrame(drawOrb);
    var sp0 = SPEAKERS[id];
    card.classList.remove('meet');
    card.innerHTML = '<div class="fn">'+(sp0? sp0.name+' &middot; '+sp0.fn : fn)+'</div><h2>'+label+'</h2><p>Reading my instruments…</p>';

    ensure([id]).then(function(){
      var b = _B.build(id, label, fn, cache);
      render(b);
      if (!reduce) setTimeout(function(){ speak(b); }, 400);
    });
  }

  function close(){
    layer.classList.remove('on'); layer.setAttribute('aria-hidden','true');
    meetOn = false;                       // otherwise a stopped room keeps talking off-screen
    seats = null; activeSeat = null;
    orb = null;
    hush();
  }

  document.getElementById('orbClose').addEventListener('click', close);
  document.addEventListener('keydown', function(e){ if (e.key==='Escape') close(); });
  addEventListener('resize', sizeCanvas);

  /* Alphabetical, and sorted on a copy: DOMAINS order is the lifecycle order the ring is
     drawn in, so mutating it here would rearrange the map. This is a lookup list, and a
     lookup list is scanned by name. */
  DOMAINS.slice().sort(function(a,b){ return a[1].localeCompare(b[1]); }).forEach(function(dd){
    var b = document.createElement('button'), sp = SPEAKERS[dd[0]] || {}, dk = DESK[dd[0]] || {};
    /* NAME FIRST. Twenty domain labels is a taxonomy; twenty people is a staff. The manager
       is the door — clicking opens the orb, which gives the reading and only then offers the
       page. Linking the bar straight to the page would skip the reason to go. */
    b.type='button';
    b.innerHTML = sp.name ? '<span class="who">'+sp.name+'</span>'+dd[1] : dd[1];
    b.title = sp.name
      ? sp.name + ' runs ' + dd[1] + (dk.cta ? ' — ' + dk.cta : '')
      : dd[1];
    b.setAttribute('aria-label', b.title);
    b.addEventListener('click', function(){
      var r=b.getBoundingClientRect();
      open(dd[0],dd[1],dd[2], r.x+r.width/2, r.y);
    });
    pick.appendChild(b);
  });

  window.__orbOpen = function(id,x,y){
    var dd = DOMAINS.filter(function(q){ return q[0]===id; })[0];
    if (dd) open(dd[0],dd[1],dd[2],x,y);
  };

  /* Warm the shared feeds at load. Both are one request covering all twenty domains, and
     fetching them only on click left the card reading "Reading my instruments" for the better
     part of ten seconds. */
  function warm(){
    if (!cache.snap) getJSON('/api/domain-snapshot').then(function(j){ cache.snap=j; });
    if (!cache.opps) getJSON('/api/limen-snapshot?type=opportunities').then(function(j){ cache.opps=j; });
    if (!cache.cons) getJSON('/api/limen-snapshot?type=console').then(function(j){ cache.cons=j; });
  }
  if (window.requestIdleCallback) requestIdleCallback(warm,{timeout:2500}); else setTimeout(warm,1200);
})();
</script>
</body>
</html>
