<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>LIMEN HELIX · Disputes & Exceptions</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#050810;color:#e8e3d9;font-family:"IBM Plex Mono",monospace;padding:20px 24px;max-width:900px;margin:0 auto;font-size:12px;line-height:1.7}h1{font-size:0.6rem;letter-spacing:4px;color:#C9A94E;margin-bottom:12px}h2{font-size:0.42rem;color:rgba(201,169,78,0.6);margin:16px 0 6px;letter-spacing:2px;border-bottom:1px solid rgba(201,169,78,0.08);padding-bottom:4px}.row{display:flex;justify-content:space-between;font-size:0.38rem;color:#b0a898;padding:2px 0}.row b{color:#d0c8b8}.card{padding:10px;border:1px solid rgba(201,169,78,0.06);border-radius:3px;margin-bottom:8px;background:rgba(0,0,0,0.15)}.badge{display:inline-block;font-size:0.3rem;padding:2px 6px;border-radius:2px;margin-left:6px}.sev-critical{background:rgba(232,84,84,0.15);color:#e85454}.sev-elevated{background:rgba(212,168,74,0.15);color:#d4a84a}.sev-moderate{background:rgba(90,181,160,0.15);color:#5ab5a0}.sev-low{background:rgba(120,120,140,0.15);color:#9898a8}a{color:rgba(201,169,78,0.5);text-decoration:none}.btn{font-family:inherit;font-size:0.34rem;padding:6px 12px;border:1px solid rgba(90,181,160,0.3);background:rgba(90,181,160,0.08);color:#5ab5a0;border-radius:2px;cursor:pointer;margin-right:6px}.btn-danger{border-color:rgba(232,84,84,0.3);background:rgba(232,84,84,0.08);color:#e85454}.tabs{display:flex;gap:8px;margin-bottom:12px}.tab{font-family:inherit;font-size:0.34rem;padding:4px 10px;border:1px solid rgba(201,169,78,0.1);background:transparent;color:#807868;border-radius:2px;cursor:pointer}.tab.active{border-color:rgba(201,169,78,0.3);color:#C9A94E;background:rgba(201,169,78,0.06)}.empty{font-size:0.36rem;color:#605848;padding:20px;text-align:center}@media print{body{background:white;color:black}}</style></head>
<body>
<a href="/domain-console?domain=energy&mode=operator" style="font-size:0.34rem;display:block;margin-bottom:12px">&larr; Back</a>
<h1>DISPUTES & EXCEPTIONS</h1>
<div class="tabs"><button class="tab active" onclick="filterTab('all',this)">ALL</button><button class="tab" onclick="filterTab('open',this)">OPEN</button><button class="tab" onclick="filterTab('under_review',this)">UNDER REVIEW</button><button class="tab" onclick="filterTab('resolved',this)">RESOLVED</button><button class="tab" onclick="filterTab('rejected',this)">REJECTED</button></div>
<div id="disputeList"></div>
<div style="margin-top:16px;border-top:1px solid rgba(201,169,78,0.08);padding-top:12px">
<h2>RAISE NEW ISSUE</h2>
<div style="display:flex;flex-direction:column;gap:6px;max-width:400px">
<input id="dTitle" placeholder="Title" style="font-family:inherit;font-size:0.36rem;padding:4px 8px;background:rgba(0,0,0,0.3);border:1px solid rgba(201,169,78,0.1);color:#e8e3d9;border-radius:2px">
<select id="dType" style="font-family:inherit;font-size:0.36rem;padding:4px 8px;background:rgba(0,0,0,0.3);border:1px solid rgba(201,169,78,0.1);color:#e8e3d9;border-radius:2px"><option value="payout">Payout</option><option value="approval">Approval</option><option value="documentation">Documentation</option><option value="duplicate">Duplicate</option><option value="compliance">Compliance</option><option value="other">Other</option></select>
<select id="dSeverity" style="font-family:inherit;font-size:0.36rem;padding:4px 8px;background:rgba(0,0,0,0.3);border:1px solid rgba(201,169,78,0.1);color:#e8e3d9;border-radius:2px"><option value="low">Low</option><option value="moderate" selected>Moderate</option><option value="elevated">Elevated</option><option value="critical">Critical</option></select>
<textarea id="dSummary" placeholder="Summary" rows="3" style="font-family:inherit;font-size:0.36rem;padding:4px 8px;background:rgba(0,0,0,0.3);border:1px solid rgba(201,169,78,0.1);color:#e8e3d9;border-radius:2px;resize:vertical"></textarea>
<button class="btn" onclick="raiseDispute()">SUBMIT</button>
</div>
</div>
<script src="assets/js/execution-disputes.js"></script>
<script>
var _filter='all';
function filterTab(status,el){_filter=status;document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});el.classList.add('active');render()}
function render(){
  var disp=window.LIMENExecution&&window.LIMENExecution.phase7&&window.LIMENExecution.phase7.disputes;
  if(!disp){document.getElementById('disputeList').innerHTML='<div class="empty">Disputes module not loaded.</div>';return}
  var list=_filter==='all'?disp.getDisputes():disp.getDisputesByStatus(_filter);
  if(list.length===0){document.getElementById('disputeList').innerHTML='<div class="empty">No disputes found.</div>';return}
  var h='';
  for(var i=0;i<list.length;i++){var d=list[i];
    h+='<div class="card"><div class="row"><span>'+d.title+'</span><b>'+d.status.toUpperCase()+'<span class="badge sev-'+d.severity+'">'+d.severity.toUpperCase()+'</span></b></div>';
    h+='<div class="row"><span>Type: '+d.disputeType+'</span><b>'+new Date(d.openedAt).toLocaleDateString()+'</b></div>';
    if(d.summary)h+='<div class="row" style="color:#807868">'+d.summary+'</div>';
    if(d.notes&&d.notes.length>0){for(var n=0;n<d.notes.length;n++)h+='<div class="row" style="color:#605848;font-size:0.32rem">'+d.notes[n].action+': '+d.notes[n].text+' ('+new Date(d.notes[n].ts).toLocaleDateString()+')</div>'}
    if(d.status==='open'||d.status==='under_review'){
      h+='<div style="margin-top:4px">';
      if(d.status==='open')h+='<button class="btn" onclick="reviewIt(\''+d.id+'\')">REVIEW</button>';
      h+='<button class="btn" onclick="resolveIt(\''+d.id+'\')">RESOLVE</button>';
      h+='<button class="btn btn-danger" onclick="rejectIt(\''+d.id+'\')">REJECT</button></div>';
    }
    h+='</div>';
  }
  document.getElementById('disputeList').innerHTML=h;
}
function raiseDispute(){
  var disp=window.LIMENExecution&&window.LIMENExecution.phase7&&window.LIMENExecution.phase7.disputes;if(!disp)return;
  var t=document.getElementById('dTitle').value;if(!t){alert('Title required');return}
  disp.createDispute({title:t,disputeType:document.getElementById('dType').value,severity:document.getElementById('dSeverity').value,summary:document.getElementById('dSummary').value});
  document.getElementById('dTitle').value='';document.getElementById('dSummary').value='';render();
}
function reviewIt(id){var disp=window.LIMENExecution.phase7.disputes;disp.reviewDispute(id,'Moved to review');render()}
function resolveIt(id){var disp=window.LIMENExecution.phase7.disputes;disp.resolveDispute(id,'Resolved by operator');render()}
function rejectIt(id){var disp=window.LIMENExecution.phase7.disputes;disp.rejectDispute(id,'Rejected by operator');render()}
setTimeout(render,500);
</script></body></html>
